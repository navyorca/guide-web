<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>공유 중지</title>
<style>:root{--ink:#0B1220;--sub:#3A4A6B;--line:#1C3E92;--bg:#FFFFFF}@media (prefers-color-scheme:dark){:root{--ink:#F0F8FF;--sub:#C9D6F2;--line:#8FB0FF;--bg:#0B1220}}html,body{margin:0;background:var(--bg);color:var(--ink)}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center}main{max-width:420px}svg{width:72px;height:72px;margin-bottom:20px}h4{margin:0 0 12px;font-size:1.5rem;font-weight:700;line-height:1.4}p{margin:0;font-size:1.1875rem;line-height:1.6;color:var(--sub)}</style>
</head><body><main>
<svg viewBox="0 0 72 72" role="img" aria-label="공유 중지 표시 그림"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M15 57L57 15" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/></svg>
<h4>저작권 침해 우려로 공유가 중지되었습니다.</h4>
<p>문의는 담당 멘토에게 해 주세요.</p>
</main></body></html>
