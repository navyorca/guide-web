></button>\r\n<button class=\"nav-item appendix\" data-target=\"p5\"><span class=\"ico\">🎧</span><span class=\"nm\">부록1 · 모범 통화<span class=\"sub\">가상 1 + 실제 17</span></span></button>\r\n<button class=\"nav-item appendix\" data-target=\"p6\"><span class=\"ico\">🗓️</span><span class=\"nm\">부록2 · 시기별 스피치<span class=\"sub\">결산·개강·성수기 26</span></span></button><div class=\"legend2\"><b>우리 69건</b> 척추 · <b>CS 매뉴얼</b> 정합 · <b>영업이론</b> 참고<br><b>영업 스피치</b> 시기별 명분(부록2)<br>고객=이니셜 · 직원=익명</div></aside>\r\n<div class=\"main\"><div class=\"wrap\">\r\n<header>\r\n  <h3>컨택 표준 매뉴얼</h3>\r\n  <div class=\"sub\"><b>전 영업멘토 공용</b> · 감이 아니라 데이터 — 우리 18지점 실통화 <b>69건</b> 전수 분석 + CS팀 매뉴얼(정합)</div>\r\n  <div class=\"chips\">\r\n    <span class=\"chip\"><b>척추</b> 우리 69건</span>\r\n    <span class=\"chip\"><b>정합·보강</b> CS 매뉴얼</span>\r\n    <span class=\"chip\">실측 발화 <b>멘토 74 : 고객 26</b> → 타깃 6:4</span>\r\n    <span class=\"chip\">컨택의 목적 = <b>방문 약속 하나</b></span>\r\n    <span class=\"chip\">STEP마다 <b>▸ 실제 티키타카</b> 펼쳐보기</span>\r\n  </div>\r\n</header>\r\n<section class=\"panel active\" id=\"p1\">\r\n<!-- 치트시트 -->\r\n<details class=\"cheat\" open>\r\n  <summary>★ 한 장 치트시트 — 이것만 외워도 됩니다</summary>\r\n<pre>컨택 = 방문 약속 하나. (설명·가격·등록 아님)        발화 멘토 6 : 고객 4 (독백 금지)\r\n\r\nSTEP 0 사전준비  : 문의 과정·유형 가설 1개\r\nSTEP 1 오프닝    : 본인확인 → 소속+멘토명 → 과정 호명 → 통화허락+질문예고\r\nSTEP 2 파악질문  : \"왜 묻는지\" 깔고 → 목적·신분·동기·취업·툴·일정\r\nSTEP 3 경청      : 한 토막 듣고 되받기 / 설명을 질문으로 쪼개기\r\nSTEP 4 근거·공감 : 공감 선행 → 근거(포폴=절대영역) → 칭찬\r\nSTEP 5 방문명분  : \"전화론 한계, 오시면 정확·유리하게\" (명분 1~2개)\r\nSTEP 6 클로징    : 내일/모레 → 오전/오후 → ○시 → 카톡 + 바른마무리(끝인사 화답)\r\nSTEP 7 복기      : 다음 통화에서 개선할 1가지\r\n\r\n지양: 100%·전원취업·합격률 단정 / 사물존칭(\"되십니다\") / 내부사정 노출 / 국비 적격자 자부담 유도</pre>\r\n  <div class=\"ref\">상세 = Part 2(STEP) · Part 3(멘트) · Part 6(지양). 자가진단 = Part 7.</div>\r\n</details>\r\n\r\n\r\n<!-- Part 0 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 0</span>왜 이 매뉴얼인가 — 권위와 근거</h4>\r\n\r\n<h3 class=\"sub3\">0-1. 컨택의 단 하나의 목적 = \"방문 약속\"</h3>\r\n<p class=\"t\">컨택(전화·문자)의 목적은 <b>상품 설명도, 가격 안내도, 등록 성사도 아닙니다.</b> 오직 하나, <b>고객이 학원에 직접 오기로 약속하게 만드는 것</b>입니다. <span class=\"src s-eq\">우리 69건 ≡ CS 매뉴얼</span></p>\r\n<ul class=\"t\">\r\n  <li>우리 멘토 전원이 이미 이렇게 합니다: <span class=\"q mute\">\"전화로는 감이 안 오실 것 같아요\", \"통화로는 남는 자료가 없으니까\", \"비주얼 커리큘럼·결과물·일정표를 직접 보고 결정하시는 게…\"</span> <span class=\"src s-our\">우리 69건</span></li>\r\n  <li>CS팀 공식 정의도 동일: <b>\"컨택 상담의 목적 = 고객의 학원 방문 상담 유도.\"</b> <span class=\"src s-keg\">CS 매뉴얼</span></li>\r\n</ul>\r\n<blockquote>그래서 컨택에서 모든 설명을 끝내려 하면 오히려 진다. <b>\"전화로는 다 못 드린다 → 오시면 정확·유리하게 드린다\"</b>가 방문을 만든다.</blockquote>\r\n\r\n<h3 class=\"sub3\">0-2. 이 매뉴얼은 무엇으로 만들어졌나 (출처 3종)</h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>출처</th><th>무엇</th><th>역할</th></tr></thead>\r\n  <tbody>\r\n    <tr><td><span class=\"src s-our\">우리 69건</span></td><td>우리 18지점 실통화 녹취 전수 분석(전 부서)</td><td><b>척추</b> — 모든 표준의 1차 근거</td></tr>\r\n    <tr><td><span class=\"src s-keg\">CS 매뉴얼</span></td><td>전국 사업부 컨택 가이드 + AI 컨택 인사이트</td><td><b>정합·보강</b> — 회사 표준과 일치 증명</td></tr>\r\n    <tr><td><span class=\"src s-th\">영업이론</span></td><td>SPIN(3.5만 콜)·Gong(2.5만 콜) 등</td><td>참고 — 왜 이게 통하는지</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<blockquote>이 표준은 <b>누가 시켜서가 아니라, 우리가 실제로 잘하고 있는 것을 데이터로 확인</b>한 결과다. 그리고 그것이 CS팀 전국 표준과도 1:1로 맞아떨어졌다(독립 수렴 = 신뢰).</blockquote>\r\n\r\n<h3 class=\"sub3\">0-3. ★ 우리가 가장 먼저 고쳐야 할 한 가지 — 발화 비중</h3>\r\n<p class=\"t\">우리 69건을 화자별 글자수로 실측한 결과: <span class=\"src s-our\">우리 69건</span></p>\r\n<pre>            멘토 74  :  고객 26     ← 멘토가 고객보다 약 3배 더 말한다\r\n잘한 컨택조차  멘토 73~76 : 고객 24~27   ← \"잘한\" 통화도 멘토가 압도적으로 많이 말함</pre>\r\n<ul class=\"t\">\r\n  <li>즉 우리의 공통 약점은 <b>독백형 설명</b>이다. 잘하는 멘토조차 말이 많다.</li>\r\n  <li>영업 이론 대조 <span class=\"src s-th\">영업이론</span>: Gong — 골든 비율 ≈ 영업자 43 : 고객 57(진짜 차이는 비율 아닌 <b>주고받는 횟수</b>) / SPIN — 성공한 콜은 <b>고객이 더 말한다(영업자가 질문하니까).</b></li>\r\n</ul>\r\n<blockquote><b>타깃 = 멘토 6 : 고객 4.</b> 비율 숫자를 외우라는 게 아니다. 핵심은 <b>① 질문으로 열기 ② 설명을 질문으로 쪼개 독백 없애기 ③ 고객이 \"사실은요…\"를 꺼내게</b> 하는 것. <span class=\"src s-our\">우리 69건</span> <span class=\"src s-th\">영업이론</span></blockquote>\r\n\r\n<details class=\"full gold\"><summary>📚 잠깐 — SPIN·Gong 이 두 이론이 뭔가요? (펼쳐서 근거 확인)</summary><div class=\"fbody\">\r\n  <div class=\"fnote\">⚠️ <b>참고용 외부 근거</b>: 우리 표준은 <span class=\"src s-our\">우리 69건</span>이 1차 근거다. SPIN·Gong은 <b>\"왜 우리 방식이 통하는지\"</b>를 외부 검증 연구로 뒷받침할 뿐. 둘 다 결론은 같다 — <b>\"영업자가 말을 줄이고, 질문으로 고객이 말하게 하라.\"</b></div>\r\n\r\n  <p class=\"t\"><b>🟦 SPIN Selling — 질문의 <em>순서</em> 이론</b></p>\r\n  <ul class=\"t\">\r\n    <li>닐 라컴(Neil Rackham)이 <b>실제 영업 통화 3.5만 건</b>을 분석해 만든 이론(책 『SPIN Selling』, 1988).</li>\r\n    <li>핵심 발견: <b>성공한 통화일수록 고객이 더 많이 말한다</b> — 영업자가 질문을 잘 던지기 때문.</li>\r\n    <li>SPIN = 질문 4단계의 머리글자. <b>우리 STEP과 거의 1:1로 겹친다.</b></li>\r\n  </ul>\r\n  <div class=\"tw\"><table class=\"ov\">\r\n    <thead><tr><th>단계</th><th>무엇</th><th>우리 매뉴얼 대응</th></tr></thead>\r\n    <tbody>\r\n      <tr><td><b>S</b> — Situation 상황</td><td>\"지금 학생이세요, 구직 중이세요?\"</td><td>STEP 2 파악 질문</td></tr>\r\n      <tr><td><b>P</b> — Problem 문제</td><td>\"혼자 배우려니 어디서 막히세요?\"</td><td>STEP 2~3 관심 끌어내기</td></tr>\r\n      <tr><td><b>I</b> — Implication 시사</td><td>\"그렇게 1년 더 흐르면 어떨까요?\"</td><td>방문 명분 만들기</td></tr>\r\n      <tr><td><b>N</b> — Need-payoff 해결보상</td><td>해결되면 좋은 점을 <b>고객 입으로</b></td><td>가치 인식 → 방문 약속</td></tr>\r\n    </tbody>\r\n  </table></div>\r\n  <blockquote>교훈: 정보를 <b>쏟아붓지(독백) 말고</b>, 질문 순서로 <b>고객이 스스로 필요를 말하게</b> 하라.</blockquote>\r\n\r\n  <p class=\"t\"><b>🟩 Gong — 말하기 <em>비율</em>의 데이터</b></p>\r\n  <ul class=\"t\">\r\n    <li>Gong.io = 미국의 영업 통화 분석 AI 회사. 실제 콜 <b>2.5만 건+</b>을 분석한 <b>실측 통계</b>(이론서가 아님).</li>\r\n    <li>골든 비율 ≈ <b>영업자 43 : 고객 57</b> — 성공한 통화의 평균 말하기 비중. 영업자가 <b>덜</b> 말한다.</li>\r\n    <li>단, Gong 자신의 결론: <b>진짜 차이는 비율이 아니라 \"주고받는 횟수\"</b> — 짧게 묻고→듣고→다시 묻는 <b>핑퐁</b>이 자주 일어나야 한다.</li>\r\n  </ul>\r\n\r\n  <p class=\"t\"><b>🔗 그래서 우리 \"멘토 6 : 고객 4\"는?</b></p>\r\n  <ul class=\"t\">\r\n    <li>이론치(Gong 43:57)는 인바운드+방문예약+국비/가격 안내가 섞인 <b>우리 컨택엔 너무 고객 쪽</b> → 비현실적.</li>\r\n    <li>우리 실측(멘토 74~76:고객 24~26)은 <b>멘토 독백 과다.</b></li>\r\n    <li>그래서 <b>타깃 6:4 = 두 극단의 중간</b>. 핵심은 숫자가 아니라 <b>독백 제거</b> = Gong의 \"주고받는 횟수 늘리기\"와 같은 결론.</li>\r\n  </ul>\r\n  <div class=\"fnote\">한 줄 요약 — <b>SPIN</b>은 \"질문을 이 순서로 던져라\"(방법), <b>Gong</b>은 \"그러면 고객이 더 말하고 그게 계약으로 이어진다\"(데이터 증명). 둘 다 우리의 <b>\"독백 말고 질문으로 쪼개라\"</b>를 외부에서 보증한다.</div>\r\n</div></details>\r\n\r\n\r\n<!-- Part 1 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 1</span>삼관(三關) 프레임 — 관심 → 관계 → 관리</h4>\r\n<p class=\"intro\">모든 컨택·상담을 관통하는 메타 프레임. <span class=\"src s-our\">우리 69건</span></p>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>관(關)</th><th>무엇</th><th>컨택에서</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>관심</td><td>왜·무엇·상황을 알려는 마음. 질문으로 <b>고객의 솔직한 이야기</b>(\"사실은요 제가…\")를 끌어냄</td><td class=\"og\">★ 컨택의 무대</td></tr>\r\n    <tr><td>관계</td><td>그 이야기에 근거·공감으로 답하며 트는 <b>신뢰의 싹</b></td><td class=\"og\">★ 컨택의 무대</td></tr>\r\n    <tr><td>관리</td><td>등록 이후 사람을 함께 끌고 가는 단계</td><td class=\"mute\">컨택 아님(나중)</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<h3 class=\"sub3\">1-1. 컨택의 무대 = \"관심 → 관계\" 두 단계뿐</h3>\r\n<ul class=\"t\">\r\n  <li><b>관리는 제일 나중(등록 이후).</b> 컨택에서 관리까지 가려 하면 부담만 준다.</li>\r\n  <li>컨택이 할 일: <b>질문으로 이야기를 끌어내고(관심) → 근거·공감으로 신뢰를 만들고(관계) → \"방문해야 할 이유 + 오면 얻을 게 있다\"는 인식을 심어 → 방문 약속.</b></li>\r\n</ul>\r\n<h3 class=\"sub3\">1-2. 발화 리듬 — 독백 금지, 설명을 질문으로 쪼개기</h3>\r\n<ul class=\"t\">\r\n  <li>관심·관계는 <b>질문으로 굴러간다.</b> 국비·가격 같은 긴 설명이 나올 때가 독백 위험 구간.</li>\r\n  <li>한 토막 말하고 → <span class=\"q\">\"이런 상황 맞으세요?\"</span>로 되받고 → 다음 토막. 고객이 <span class=\"q\">\"사실은요…\"</span>를 꺼내면 잘 가고 있는 것. <span class=\"src s-our\">우리 69건</span> <span class=\"src s-th\">영업이론</span></li>\r\n</ul>\r\n\r\n\r\n</section>\r\n<section class=\"panel\" id=\"p2\">\r\n<!-- Part 2 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 2</span>★ 표준 프로세스 — 8블록 (사전준비 STEP 0 + 7단계)</h4>\r\n<blockquote><b>이게 우리 컨택의 기본형.</b> 우리 69건이 예외 없이 이 골격으로 흐르고, CS팀 공식 가이드(도입→탐색질문→과정안내→방문확정→마무리)와 <b>구조가 1:1로 일치</b>한다. <span class=\"src s-eq\">우리 69건 ≡ CS 매뉴얼</span> 멘트는 토씨가 아니라 <b>골격</b>으로 익힌다(낭독 X).</blockquote>\r\n\r\n<div class=\"step a\"><div class=\"sh\"><div class=\"sn\">0</div><div class=\"st\">사전 준비 (통화 전 30초)</div></div><div class=\"sb\">\r\n  <ul class=\"t\"><li>DB에서 <b>문의 과정·유입경로·연령대·시간</b>을 보고 어떤 유형일지 가설 1개. (어떤 화법으로 갈지 미리 정함) <span class=\"src s-our\">우리 69건</span></li><li>오프닝에서 과정명을 곧장 부르려면 이 준비가 있어야 한다.</li></ul>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 정보덤프형</span> — 준비 없이 전화 → 고객이 \"일정 어떻게 돼요?\" 물으면 끌려다니며 정보만 나열.</div>\r\n  <div class=\"chk\">☐ 문의 과정·유형 가설 1개를 갖고 전화를 거는가?</div>\r\n</div></div>\r\n\r\n<div class=\"step a\"><div class=\"sh\"><div class=\"sn\">1</div><div class=\"st\">오프닝 첫 30초 — 도입 4요소</div></div><div class=\"sb\">\r\n  <div class=\"ment\"><b>①본인확인</b> <span class=\"q\">\"안녕하세요, ○○님 맞으실까요?\"</span></div>\r\n  <div class=\"ment\"><b>②소속+즉시성</b> <span class=\"q\">\"방금 문의 주신 SBS아카데미 컴퓨터아트학원 ○○ 멘토입니다.\"</span></div>\r\n  <div class=\"ment\"><b>③과정 호명</b> <span class=\"q\">\"[모션 포트폴리오 / 실내건축 자격증]으로 문의 주셨네요.\"</span></div>\r\n  <div class=\"ment\"><b>④통화허락+질문예고</b> <span class=\"q\">\"잠깐 통화 괜찮으세요? 정확히 안내드리려 몇 가지만 여쭤볼게요.\"</span></div>\r\n  <p class=\"t mute\"><span class=\"src s-our\">우리 69건</span> 오프닝 표준문형(거의 토씨까지 동일) / <span class=\"src s-keg\">CS 매뉴얼</span> 도입 = 첫인사·수신자 확인·소속/성명·용건·통화 가능. <span class=\"src s-eq\">우리 69건 ≡ CS 매뉴얼</span></p>\r\n  <div class=\"box good\"><span class=\"lbl\">✅ 모범</span> \"남겨주신 내용 보니 ○○ 고민이 크신 것 같아요\"(배경 깔기)</div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 반면교사</span> <b>정보덤프형</b> — 소속·라포 건너뛰고 \"5월 개강 다음 주인데 언제 시작?\" / <b>소속·멘토명 누락</b> — CS팀 우수자조차 멘토명을 빠뜨려 CS팀이 지적. <span class=\"mute\">우수자도 빠뜨리는 1순위 실수.</span> <span class=\"src s-keg\">CS 매뉴얼</span></div>\r\n  <div class=\"chk\">☐ 소속 + <b>멘토명</b>을 말했는가 / 문의 과정을 호명했는가?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 (실통화 발췌·순화)</summary><div class=\"dlg\">\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">안녕하세요, 서○○님 맞으실까요? 이전에 저희 SBS 컴퓨터학원에 영상 과정으로 문의 주셨는데, 그때 안내를 못 받으신 것 같더라고요. 혹시 그 뒤로 영상 편집은 좀 공부해 보셨어요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">마음은 있는데 아직 시작은 못 했어요.</div></div>\r\n    <div class=\"note2\">→ 소속·과정 호명 + 즉시성을 한 호흡에, 곧장 질문으로 연결.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step a\"><div class=\"sh\"><div class=\"sn\">2</div><div class=\"st\">파악 질문 (관심) — 6질문 + \"왜 묻는지 먼저\"</div></div><div class=\"sb\">\r\n  <p class=\"t\">가격·과정을 꺼내기 <b>전에</b> 아래 6개로 고객을 먼저 말하게 한다.</p>\r\n  <div class=\"box warn\"><span class=\"lbl\">★ 질문 목적 먼저</span> <span class=\"src s-keg\">CS 매뉴얼</span> — 바로 묻지 말고 <span class=\"q\">\"종류가 다양해서, 먼저 몇 가지 확인하고 ○○님 맞춤으로 안내드리려고요.\"</span> 후 질문.</div>\r\n  <p class=\"t\"><b>CS 매뉴얼 질문 5쌍</b> <span class=\"src s-keg\">CS 매뉴얼</span> (❌ 바로 묻기 → ✅ 목적 깔고)</p>\r\n  <div class=\"tw\"><table class=\"ov\">\r\n    <thead><tr><th>항목</th><th class=\"ng\">❌ 바로 묻기</th><th class=\"og\">✅ 목적 깔고 묻기</th></tr></thead>\r\n    <tbody>\r\n      <tr><td>동기</td><td>\"알아보시는 이유가 뭐예요?\"</td><td>\"어떤 방향으로 안내드리면 좋을지, 관심 가지시게 된 계기가 있으실까요?\"</td></tr>\r\n      <tr><td>거주지</td><td>\"어느 지역 거주하세요?\"</td><td>\"저희가 ○○역 앞이라 통학 거리실까요? 시간대 안내드리려고요.\"</td></tr>\r\n      <tr><td>학년·신분</td><td>\"몇 학년이세요?\"</td><td>\"국비 지원이 학년에 따라 달라서요, 현재 몇 학년 재학 중이세요?\"</td></tr>\r\n      <tr><td>툴 숙련</td><td>\"컴퓨터 얼마나 다뤄요?\"</td><td>\"맞는 난이도 안내드리려고요, 컴퓨터 사용 경험 좀 여쭤볼게요.\"</td></tr>\r\n      <tr><td>목적</td><td>\"목적이 뭐죠?\"</td><td>\"방향이 달라질 수 있어서요, 취미에 가까운지 진로까지 염두에 두시는지요?\"</td></tr>\r\n    </tbody>\r\n  </table></div>\r\n  <p class=\"t\"><b>우리 6질문 체크리스트</b> <span class=\"src s-our\">우리 69건</span></p>\r\n  <div class=\"tw\"><table class=\"ov\">\r\n    <thead><tr><th>질문</th><th>포인트</th></tr></thead>\r\n    <tbody>\r\n      <tr><td>Q1 목적</td><td>\"어디에 <b>활용</b>하려고요?\" (가장 먼저 — 취업/취미/진학/보충)</td></tr>\r\n      <tr><td>Q2 신분·상태</td><td>\"학생 / 구직 / 재직 어디세요?\" (지원제도 분기 핵심)</td></tr>\r\n      <tr><td>Q3 동기</td><td>\"왜 이 분야를 배우려 하세요?\" (계기 = 공감 포인트)</td></tr>\r\n      <tr><td>Q4 취업 목표</td><td>\"취업은 어디까지 알아보셨어요?\"</td></tr>\r\n      <tr><td>Q5 툴 경험</td><td>\"다뤄보신 툴 있으세요?\" (언급 툴 중심 전문성)</td></tr>\r\n      <tr><td>Q6 일정</td><td>\"언제부터 원하세요?\" (이달→잔여석 / 다음달→1년 시간표)</td></tr>\r\n    </tbody>\r\n  </table></div>\r\n  <p class=\"t\"><b>쿠션어</b> <span class=\"src s-keg\">CS 매뉴얼</span>: 질문 앞에 <span class=\"q\">\"실례지만 / 괜찮으시다면 / 혹시 / 번거로우시겠지만.\"</span></p>\r\n  <div class=\"box good\"><span class=\"lbl\">✅ 모범</span> \"과목이 20가지 넘어서 정확한 안내 위해 몇 가지 여쭤볼게요\" 후 목적부터.</div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 정보덤프형</span> 파악질문 <b>0</b> → 바로 개강일·내일배움카드·시간표·가격 일방 나열.</div>\r\n  <div class=\"chk\">☐ 가격·과정 꺼내기 전에 목적부터 물었는가 / \"왜 묻는지\"를 깔았는가?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 (실통화 발췌·순화)</summary><div class=\"dlg\">\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">혹시 지금 학생이세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">대학교는 안 다녀요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 영상 편집은 어떤 계기로 관심 갖게 되셨어요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">옛날부터 관심 있었는데 전문적으로 배워보고 싶어서요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇구나. 그럼 나중에 취업도 생각 있으신 거예요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">하면 좋을 것 같아요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">현재 나이가 어떻게 되세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">05년생이요.</div></div>\r\n    <div class=\"note2\">→ 신분 → 동기 → 취업 → 나이. 답을 되짚으며 한 겹씩, 가격·과정 얘기 전에.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step a\"><div class=\"sh\"><div class=\"sn\">3</div><div class=\"st\">경청·티키타카 — 발화 리듬</div></div><div class=\"sb\">\r\n  <ul class=\"t\">\r\n    <li>한 토막 듣고 <span class=\"q\">\"아 그러시구나, 그럼 ~?\"</span>로 되받는다. <b>독백 금지.</b> 고객이 <span class=\"q\">\"사실은요…\"</span>를 꺼내면 잘 가는 것. <span class=\"src s-our\">우리 69건</span></li>\r\n    <li>국비·가격 긴 설명이 나올 때 → <b>질문으로 쪼갠다.</b></li>\r\n  </ul>\r\n  <div class=\"box warn\"><span class=\"lbl\">공감어</span> <span class=\"src s-keg\">CS 매뉴얼</span> 답을 그냥 받지 마라: 고객 \"○역이요\" → <span class=\"ng\">❌\"아 네.\"</span> → <span class=\"og\">✅\"오! 저희가 ○번 출구 바로 앞이에요.\"</span></div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 정보덤프형</span> 고객이 되물어도 설명만 추가, 질문으로 열지 않음.</div>\r\n  <div class=\"chk\">☐ 내 독백이 길지 않았나(질문으로 쪼갰나) / 고객이 솔직한 이야기를 꺼냈나?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 (실통화 발췌·순화)</summary><div class=\"dlg\">\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">평소 일정은 어떻게 쓰고 계세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">알바하고 있어요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">무슨 알바 하세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그냥 카페 알바요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">요즘 카페 알바 들어가기 좀 괜찮아요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">좀 어렵긴 했는데….</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠. 저도 옛날에 카페 알바 하려는데, 경력에 바리스타 자격증까지 있어야 한다더라고요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">맞아요.</div></div>\r\n    <div class=\"note2\">→ 과정 얘기로 직진하지 않고 고객 일상으로 들어가 라포. 짧게 주고받으며 독백을 만들지 않음.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step b\"><div class=\"sh\"><div class=\"sn\">4</div><div class=\"st\">근거·공감 (관계)</div></div><div class=\"sb\">\r\n  <ul class=\"t\">\r\n    <li><b>공감 선행</b>: <span class=\"q\">\"비전공이 70%세요\" / \"딱 그런 분들 많이 오세요\"</span> → 안심. <span class=\"src s-our\">우리 69건</span></li>\r\n    <li><b>근거(챌린저)</b>: <span class=\"q\">\"취업은 포트폴리오가 절대영역이에요. 자격증 몇 개보다 포폴이 좋으면 들어가요\" / \"자격증은 실무 하면 자연히 따라와요.\"</span></li>\r\n    <li><b>칭찬</b>: <span class=\"q\">\"미리 준비하시다니 성실하시네요.\"</span></li>\r\n  </ul>\r\n  <div class=\"box warn\"><span class=\"lbl\">⚠️ KEG 존대어</span> <span class=\"src s-keg\">CS 매뉴얼</span> 사물존칭 금지(\"할인되십니다\"❌→\"할인됩니다\"✅) / 줄임말 금지(\"인강\"❌→\"따즈아 온라인 강의\"✅) / 보장 단정 금지(Part 6).</div>\r\n  <div class=\"box good\"><span class=\"lbl\">✅ 모범</span> 비전공·전공생 고민에 공감 선행 후 근거 / 자녀 대신 온 고객에 \"스스로 준비하다니 대견하다\" 칭찬 + 부모 안심.</div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 감정 노출</span> 이전 담당자 짜증 응대로 고객 이탈 → 회복은 \"담당이 저로 변경됐어요, 불편하셨다면 대신 사과드려요.\"</div>\r\n  <div class=\"chk\">☐ 공감을 먼저 했나 / 사물존칭·보장 단정을 안 썼나?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 (실통화 발췌·순화)</summary><div class=\"dlg\">\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">자격증도 같이 봐주시나요?</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼요. 자격증은 공부하다 보면 자연스럽게 따라와요. 다만 이쪽은 포트폴리오가 절대영역이라, 자격증이 많아도 포폴이 별로면 안 뽑히고, 반대로 포폴이 좋으면 학벌 무시하고 들어가요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">(배우는 것도 돈이 드니까) 돈 좀 모으고 시작하려고요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">솔직히 말씀드리면, 돈 모아서 오겠다던 분 중에 실제로 온 분이 거의 없었어요. 대학 4년이면 학비만 3,600만 원인데 그 돈을 지금부터 모으긴 어렵잖아요. 오히려 대학을 안 갔으니 그만큼 여유가 있는 거예요.</div></div>\r\n    <div class=\"note2\">→ 공감으로 받은 뒤 챌린저식 근거(포폴=절대영역)·투자가치로 전환. 보장 단정은 쓰지 않음.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step b\"><div class=\"sh\"><div class=\"sn\">5</div><div class=\"st\">방문 명분 + 전환 (전화의 한계)</div></div><div class=\"sb\">\r\n  <p class=\"t\"><span class=\"q\">\"유선으로는 한계가 있어서요. <b>직접 오시면</b> 학생들 포트폴리오 보여드리고 커리큘럼·취업처·준비물까지 하나하나 안내드려요.\"</span> <span class=\"src s-our\">우리 69건</span></p>\r\n  <p class=\"t\"><b>방문 명분 라이브러리 7종</b> <span class=\"src s-keg\">CS 매뉴얼</span> (상황 맞는 1~2개)</p>\r\n  <div class=\"tw\"><table class=\"ov\">\r\n    <thead><tr><th>명분</th><th>멘트</th></tr></thead>\r\n    <tbody>\r\n      <tr><td>커리큘럼 보안</td><td>\"커리큘럼이 외부 반출이 안 돼요. 오셔서 직접 보셔야 정확해요.\"</td></tr>\r\n      <tr><td>지원금 방문조회</td><td>\"지원금은 사람마다 달라서요, 신분증 가져오시면 정확히 조회해 드려요.\"</td></tr>\r\n      <tr><td>국비 비교</td><td>\"국비 종류가 여러 개라, 방문해서 ○○님께 맞는 걸로 비교해 드릴게요.\"</td></tr>\r\n      <tr><td>경험도 진단</td><td>\"어느 정도 다루시는지 봐야 기초·심화 어디부터인지 정확해요. 작업물 가져오시면 체크해 드려요.\"</td></tr>\r\n      <tr><td>상담 무게 선고지</td><td>\"지원제도랑 전반 안내드리다 보니 40분~1시간 정도 걸려요.\"</td></tr>\r\n      <tr><td>멘토 경력</td><td>\"저도 그쪽 현업이었어서 어떻게 준비하면 좋을지 직접 피드백 드릴게요.\"</td></tr>\r\n      <tr><td>현장 가치·마감</td><td>\"위생·시설·수업 방식은 오셔야 보여요 / 방학이라 실시간 정원 마감을 같이 확인하셔야 해요.\"</td></tr>\r\n    </tbody>\r\n  </table></div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 방문 미클로징</span> 방문 명분 약하게 줘서 고객이 \"알아보고 연락드릴게요\"로 종료.</div>\r\n  <div class=\"chk\">☐ \"와야 할 이유\"를 1~2개 구체적으로 줬는가?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 — ★ 국비전환 고객이익 가드 + 부모 동반</summary><div class=\"dlg\">\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내일배움카드로 들을 수 있는 과정 있던데요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">내일배움카드 과정은 디자인도 잠깐, 3D도 얕게 배우는 구성이라 취준 목적엔 좀 안 맞아요. <b>그럼에도 \"저는 내일배움카드로 듣고 싶어요\" 하시면 그 수업이 맞으시고요.</b> \"지원만 되면 다른 수업도 괜찮아요\" 하시면, 국민취업지원제도로 월 60씩 6개월 360만 원 환급받으면서 전문 과정을 거의 무료에 가깝게 들으실 수 있어요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">오셔서 두 커리큘럼이랑, 학생들이 만든 포트폴리오를 직접 눈으로 보고 판단하시는 게 빨라요.</div></div>\r\n    <div class=\"note2\">→ ★ 적격자를 막지 않고(\"국비 원하면 그 수업이 맞다\") + 고객 손익(환급)으로 비교 → 방문. = Part 3-1 국비전환 4스텝 가드의 실증.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 국비전환(3D모션, 18분)</div>\r\n    <div>\r\n      <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">상담은 비용이 들지 않으니, 괜찮으시면 부모님과 같이 오셔서 한번 받아보시는 건 어때요? 그 과정에서 부모님이 \"이 정도는 도와줄게\" 하실 수도 있잖아요.</div></div>\r\n      <div class=\"note2\">→ 진로고민형엔 \"부모 동반 + 비용 없음\"이 자연스러운 방문 명분.</div>\r\n      <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n    </div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step b\"><div class=\"sh\"><div class=\"sn\">6</div><div class=\"st\">방문 약속 — 폐쇄형 클로징 + 바른 마무리</div></div><div class=\"sb\">\r\n  <p class=\"t\"><b>결제가 아니라 \"방문 약속\"이 목표.</b> 열린 질문 X → <b>양자택일</b>로 좁힌다. <span class=\"src s-eq\">우리 69건 ≡ CS 매뉴얼</span></p>\r\n  <div class=\"ment\"><b>①날짜</b> \"내일이나 모레 중 언제가 편하세요?\"</div>\r\n  <div class=\"ment\"><b>②시간대</b> \"오전·오후 중엔요?\" → \"그럼 내일 저녁 8시 / 모레 7시 중 어떠세요?\"</div>\r\n  <div class=\"ment\"><b>③확정+카톡</b> \"○시로 잡아드릴게요. 통화 끝나면 예약 문자·약도·명함 카톡으로 보내드려요.\"</div>\r\n  <div class=\"box warn\"><span class=\"lbl\">실패 회복</span> \"혹시 짧게라도 어려우실까요? 방문하셔야 커리큘럼·할인을 제 권한으로 더 챙겨드릴 수 있거든요.\" → 안 되면 \"번호 남겨둘 테니 필요할 때 연락 주세요\"(관계 유지).</div>\r\n  <p class=\"t\"><b>★ 바른 마무리 — 끝인사 ≠ 끝, 상담의 완성</b> <span class=\"src s-keg\">CS 매뉴얼</span></p>\r\n  <div class=\"tw\"><table class=\"ov\">\r\n    <thead><tr><th>▶ 방문 예정 (5단)</th><th>▶ 방문 거절 (4단)</th></tr></thead>\r\n    <tbody>\r\n      <tr><td>① \"○월 ○일 ○시 방문 예정으로 예약 도와드렸습니다.\"</td><td>① \"고민해보시고 궁금하시면 언제든 편하게 연락주세요.\"</td></tr>\r\n      <tr><td>② \"일정·위치는 카톡으로 남겨드릴게요, 확인 답장 한 번만.\"</td><td>② \"추후 프로모션·일정 변동 있을 때 연락드려도 괜찮으실까요?\"</td></tr>\r\n      <tr><td>③ \"○층 인포데스크에 <b>성함만</b> 말씀해주시면 됩니다.\"</td><td>③ \"오늘 문의주신 과정 정보 사이트를 카톡으로 남겨드릴게요.\"</td></tr>\r\n      <tr><td>④ \"방문하신 분께 드리는 혜택도 그 날 함께 안내드릴게요.\"</td><td>④ \"문의 주셔서 감사드리고, 좋은 하루 보내세요.\"</td></tr>\r\n      <tr><td>⑤ \"그럼 ○시에 뵙겠습니다. 조심히 오세요, 좋은 하루 보내세요.\"</td><td class=\"mute\">—</td></tr>\r\n    </tbody>\r\n  </table></div>\r\n  <div class=\"box warn\"><span class=\"lbl\">끝인사 화답(공통)</span> 내가 끝인사를 건넸어도 고객이 되이어 건네는 끝인사에 <b>화답</b>하고, 고객이 끊을 때까지 기다린다(먼저 끊지 않기).</div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 정보만</span> 안내만 하고 \"고민해보시고 연락주세요\"로 마무리 → 약속 못 잡음.</div>\r\n  <div class=\"chk\">☐ 양자택일로 약속을 잡았나 / 끝인사 화답하고 카톡을 약속했나?</div>\r\n  <details class=\"tk\"><summary>▸ 실제 티키타카 보기 — 양자택일·유연 대응·카톡·배웅·인포데스크</summary><div class=\"dlg\">\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">금요일 오전·오후 중엔 언제가 편하세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">오후가 괜찮아요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 17일 오후 2시 어떠세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 괜찮아요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">당일 바로 결정하시는 건 추천 안 드려요. 모르던 얘기를 듣고 고민이 필요하실 테니, 편하게 오셔서 평소 만들어보고 싶던 영상 같이 보면서 얘기해요.</div></div>\r\n    <div class=\"note2\">→ 양자택일로 시간 확정 + \"당일 결정 안 하셔도 된다\"로 부담 제거(오히려 신뢰).</div>\r\n    <div>\r\n      <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">혹시 저 혼자라도 가서 상담받을 수 있나요?</div></div>\r\n      <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼요. 먼저 혼자 오셔서 상담하시고, 결심 서면 부모님과 2차 방문하셔도 돼요.</div></div>\r\n      <div class=\"note2\">→ 조건이 막히면 더 쉬운 방문으로 길을 열어 약속 유지.</div>\r\n    </div>\r\n    <div>\r\n      <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">카톡으로 명함·약도·방문 일정·캘린더 보내드릴게요. 변경 필요하시면 편하게 연락 주세요. 이번 주 알바 처음 시작하셨는데 잘 마무리하시고, 금요일 2시에 뵐게요. 좋은 하루 되세요.</div></div>\r\n      <div class=\"note2\">→ 카톡 풀세트 약속 + 고객 근황을 챙기는 따뜻한 배웅.</div>\r\n      <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 진로고민형(13분)</div>\r\n    </div>\r\n    <div>\r\n      <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">(다른 통화) 고층 엘리베이터 타고 ○층 올라오셔서, 인포데스크에 상담 예약하셨다고 성함만 말씀해주시면 안내해 드릴게요.</div></div>\r\n      <div class=\"note2\">→ 초행 고객 배려한 인포데스크 안내가 CS팀 우수컨택 채택 포인트.</div>\r\n      <div class=\"src2\"><span class=\"src s-keg\">CS 매뉴얼</span> 익명 우수컨택</div>\r\n    </div>\r\n  </div></details>\r\n</div></div>\r\n\r\n<div class=\"step b\"><div class=\"sh\"><div class=\"sn\">7</div><div class=\"st\">복기 (성장)</div></div><div class=\"sb\">\r\n  <ul class=\"t\"><li>통화 끝나고 30초 자가점검(권장): 발화 6:4였나 / 6질문 빠뜨림 / 양자택일 했나 / 바른마무리 화답했나. <span class=\"src s-our\">우리 69건</span></li><li>다음 통화에서 개선할 1가지만 정한다.</li></ul>\r\n  <blockquote>★ 한눈: <b>소속·멘토명·과정 호명 → (목적 깔고) 질문으로 듣기 → 공감·근거 → \"직접 오셔야\" → 양자택일 약속 → 바른 마무리·카톡.</b> 모든 단계가 질문으로 굴러가고, 설명은 잘게 쪼갠다.</blockquote>\r\n</div></div>\r\n\r\n\r\n</section>\r\n<section class=\"panel\" id=\"p3\">\r\n<!-- Part 3 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 3</span>멘트 라이브러리 (상황별 즉시 사용)</h4>\r\n<p class=\"intro\">Part 2 STEP 멘트를 상황별로 모은 복사용 카드. 방문명분·양자택일·바른마무리·근거공감은 Part 2 그대로 사용. 여기엔 <b>별도 주의가 필요한 4종.</b></p>\r\n\r\n<h3 class=\"sub3\">3-1. ★ 국비 → 일반 + 환급 전환 — ⚠️ 고객이익 가드</h3>\r\n<p class=\"t\">우리의 가장 강력하면서 <b>오용 시 가장 위험한</b> 패턴. <b>아래 4스텝 순서·조건을 벗어난 화법은 쓰지 않는다.</b> <span class=\"src s-our\">우리 69건</span></p>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>스텝</th><th>핵심</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>① 국비 적격 먼저 확인</td><td>\"국비는 구직 청년 대상, 9~6시 월~금 6~8개월 전일제예요.\" → <b>적격이고 본인이 원하면 막지 않는다.</b></td></tr>\r\n    <tr><td>② 부적합일 때만 일반</td><td>\"이미 다루실 줄 알면 기초 6개월은 아까울 수 있어요 / 직장 병행이면 전일제가 어렵죠.\"</td></tr>\r\n    <tr><td>③ 고객 손익으로 비교</td><td>\"일반은 시간·과목 선택(자부담) + 국민취업지원제도 환급으로 실부담이 줄어요.\"</td></tr>\r\n    <tr><td>④ 정확성 병기</td><td>\"정확한 금액·자격은 방문 또는 고용센터에서 확인해 드릴게요.\"</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<div class=\"box bad\"><span class=\"lbl\">⚠️ 위반</span> 국비 적격 고객을 무조건 자부담 일반으로 돌리는 화법 = 고객이익·컴플라이언스 위반 소지. \"고객에게 진짜 유리한 선택\"이 기준.</div>\r\n\r\n<h3 class=\"sub3\">3-2. 대리문의(부모) — 자녀 보호 프로토콜</h3>\r\n<ul class=\"t\">\r\n  <li><b>실수강자 정보</b>: \"방문자 체크가 필요해서 자녀분 성함·연락처 여쭤봐도 될까요?\"</li>\r\n  <li>⚠️ <b>자녀 동의 없이 자녀에게 직접 연락하지 않는다. 부모와만 소통.</b> (부모가 \"문자 보내지 마세요\" 하면 존중)</li>\r\n  <li><b>동반 방문</b>: \"직접 배우실 분이 봐야 정확해서, 함께 오시면 좋아요.\" / <b>부모 안심</b>: \"자료는 제가 다 챙겨드릴게요.\" <span class=\"src s-our\">우리 69건</span></li>\r\n</ul>\r\n\r\n<h3 class=\"sub3\">3-3. 가격 응대 · 3-4. 희소성</h3>\r\n<ul class=\"t\">\r\n  <li><b>가격</b>: \"원수강료 ○○만원, 지원받으시면 ○○만원대까지요.\" 정확 금액은 \"개인정보라 방문해서 조회.\" 진로고민형엔 투자가치로.</li>\r\n  <li><b>희소성(사실 기반만)</b>: \"예약제로 운영\" / \"자리 마감이 빠른 편\" / \"○○ 이벤트 할인은 기간 한정.\" <span class=\"ng\">⚠️ 없는 마감을 지어내지 않는다.</span> <span class=\"src s-our\">우리 69건</span></li>\r\n</ul>\r\n\r\n\r\n<!-- Part 4 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 4</span>대상별 대응 — 심리 3유형 × 현장 5상황</h4>\r\n<p class=\"intro\">속마음(심리)과 처한 상황은 <b>별개의 축</b>이라 교차한다 — 같은 시니어라도 진로고민형과 목적뚜렷형은 다르게. <span class=\"src s-our\">우리 69건</span></p>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>심리 3유형</th><th>속마음</th><th>대화 키</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>제도탐색형</td><td>\"지원받아 싸게/무료로\"</td><td>내일배움카드·환급에 민감 → 정확 안내 + 방문 조회</td></tr>\r\n    <tr><td>진로고민형</td><td>\"내가 될까, 방향 미정\"</td><td>끝까지 경청 → 투자가치·가능성으로 안심</td></tr>\r\n    <tr><td>목적뚜렷형</td><td>\"이 스킬/자격증을 이 기간에\"</td><td>군더더기 없이 적합 과정 → 빠른 방문 확정</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>현장 5상황</th><th>응대</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>대리문의</td><td>자녀 보호 프로토콜(3-2)·동반 방문·부모 안심</td></tr>\r\n    <tr><td>시니어/고령</td><td>\"나이 정해진 수업 아니에요, 누구나 천천히\" 안심 + 지원금 조회. 취미형은 취업형과 동기 구분</td></tr>\r\n    <tr><td>정규·전공 보충</td><td>\"학교는 이론, 학원은 실무\" 표준 멘트</td></tr>\r\n    <tr><td>AI 과정 문의 <span class=\"src s-our\">우리 69건</span></td><td>인입 급증 — \"클로드로 PPT·엑셀 자동화\"처럼 <b>활용 장면</b>으로 설명</td></tr>\r\n    <tr><td>지인추천·단체</td><td>추천인 신뢰 살려 빠른 라포, 동반 방문 유도</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 시니어/고령 (60대 직장인, 워드·엑셀 기초)</summary><div class=\"dlg\">\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">우리는 나이가 있어서 컴퓨터 세대도 아니고… 회사를 옮겼더니 컴퓨터를 안 하면 안 되는 상황이라. 워드·엑셀 기초만 배우면 돼요. 아직 초보야.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">잘하셨어요. PPT·워드·엑셀을 같이 배우는 기초반이 있는데, 난이도도 낮고 1개월이면 다 배우세요. 같은 목적으로 오시는 분들이 많은 반이에요.</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">시간이 몇 시에 있어요?</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">11시 반~1시 반(월~목)이나, 퇴근 후 7~10시 월수금 격일반이 있어요. 어떤 타임이 편하세요?</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">컴퓨터를 아직 많이 안 다뤄보셨으니 통화로는 이해가 어려우실 것 같아서, 퇴근 후 한번 방문하셔서 일정표랑 과목 정확히 안내받으시는 걸 추천드려요.</div></div>\r\n  <div class=\"note2\">→ \"같은 분들 많이 와요 / 난이도 낮아요\" 안심 + 시간대 맞춤 + \"통화론 어려우니 방문\" 명분.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 시니어(모스, 60대 직장인)</div>\r\n</div></details>\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 대리문의 (부모가 자녀 대신, 자녀 보호 프로토콜)</summary><div class=\"dlg\">\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어머님 안녕하세요. 자녀분 대신 문의 주신 걸로 확인되는데, 포토샵·디자인 자격증 쪽 희망하시는 걸까요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 처음이라 수업 따라가기 어려워서 기초 좀 배우고 싶대요. 대학교 1학년이에요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">관련 학과 학생이신가 봐요. 학교에선 체계적으로 안 배우다 보니 과제·팀플 때 많이 힘드셨을 거예요.</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 그렇대요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">전공생 실무반이 따로 있어요. 다만 어디까지 만들고 싶은지는 자녀분이 커리큘럼 보고 직접 선택하셔야 해서, 어머님이랑 자녀분이 같이 방문 상담 받으시는 게 좋아요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">방문자 체크가 필요해서 실수강자(자녀분) 성함·연락처가 필요해요. 자녀분 정보를 함부로 쓰진 않고요. 예약 문자는 어머님께 보내드리면 될까요?</div></div>\r\n  <div class=\"note2\">→ 부모 공감(팀플 힘듦) + \"자녀가 직접 선택해야\" 동반 방문 명분 + 실수강자 정보 확보 + 카톡은 부모께. = Part 3-2 자녀 보호 프로토콜 실증.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 대리문의(자녀 대신 부모)</div>\r\n</div></details>\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 정규·전공 보충 (광고학과 편입생)</summary><div class=\"dlg\">\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">강남 지점으로 광고 편집·모션그래픽 수강료 조회 남겨주셔서 연락드렸어요. 어떤 과정 필요하신지 여쭤볼게요.</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">광고 쪽 학과를 이번에 편입으로 들어가게 돼서, 빠르게 습득하려고 학원을 생각 중이에요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">1학기는 마치셨어요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">1학기 마쳤고 방학 때 습득하려고요. 근데 학교에선 이론 위주로 들어서….</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">전공자들이 방학마다 오는 이유가 그거예요. 학교는 디자인·마케팅 이론 위주라, 정작 프로그램은 학기 중에 유튜브 찾아가며 일일이 해야 해서 답답하거든요. 방학 때 툴 기초부터 잡고 다음 학기 넘어가시는 게 편해요.</div></div>\r\n  <div class=\"note2\">→ \"학교는 이론, 학원은 실무\" — 전공생 보충의 표준 명분.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 정규·전공(편입)</div>\r\n</div></details>\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — AI 과정 (은퇴 후 취미, 60대)</summary><div class=\"dlg\">\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">AI 에이전트로 문의 남겨주셔서 연락드렸어요. 어떻게 배워보고자 하세요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">요새 AI에 관심 있어서 오픈AI도 해봤는데, 물어보는 걸 잘 물어봐야 답이 나오니까 불편하더라고요. 나이도 많은데 할 수 있나 싶어서요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">프롬프트 작성법이나, 써보신 AI로 이미지·영상 만드는 수업이 있고요. 이번 달부터 시작하는 AI 에이전트 클로드 수업도 있어요. 저희는 나이대 정해진 수업이 아니라, 컴퓨터 좀 다루시면 충분히 가능해요. 이미 써보셨으니 큰 어려움 없으실 거예요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">취미로 한번 배워보시는 걸까요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그렇죠, 이 나이에 사업하려는 건 아니고. 은퇴한 지 2년 됐는데 시간도 많고 뭐 해볼 게 없나 싶어서요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">쉬시면서 새로 배워볼 일이 거의 없으실 텐데, 이런 거 배우면서 리프레시하면 도움 많이 되실 거예요. 수업이 어떻게 진행되는지, 방향이 맞는지 한번 방문해서 체크해 보시면 좋아요.</div></div>\r\n  <div class=\"note2\">→ AI 불안(\"나이 많은데 가능?\")에 \"나이대 정해진 수업 아니에요·이미 써보셔서 가능\" 안심 + 취미 동기 존중 + \"리프레시\" 공감. = AI 과정 × 시니어 취미 교차.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> AI 과정(은퇴 취미)</div>\r\n</div></details>\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 지인추천·단체 (3명 동반)</summary><div class=\"dlg\">\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아까 아침에 전화드렸더니 6시 반에 3명이 같이 가고 싶다고 했는데, 다른 부서에서 연락 준다더니 안 와서 다시 신청했어요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">제가 전달을 못 받았었네요, 죄송해요. 그럼 세 분 6시 반에 오시는 거죠? 상담 도와드리기 앞서 각 성함이랑 연락처가 필요한데, 어떤 분들이실까요?</div></div>\r\n  <div class=\"note2\">→ 누락된 연락을 사과로 회복 + 동반자 전원 성함·연락처 확보 + 방문 시간 재확정.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 지인추천(3명 동반)</div>\r\n</div></details>\r\n<blockquote>교차 예: \"AI 과정 + 시니어 취미형\" = 활용 장면 + 속도·안심 동시. \"제도탐색형 + 대리문의\" = 부모에게 정확 제도 + 자녀 동의 확보.</blockquote>\r\n\r\n\r\n<!-- Part 5 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 5</span>실증 — 우수 컨택 vs 반면교사</h4>\r\n<p class=\"intro\">\"같은 상황, 다른 결과\"가 가장 잘 박힌다. 실제 통화(고객 이니셜·직원 익명).</p>\r\n\r\n<h3 class=\"sub3\">5-1. 우리 우수 컨택 9건 <span class=\"src s-our\">우리 69건</span></h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>사례(상황)</th><th>배울 점</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>라포·진로고민(13분)</td><td>알바·부모지원·돈 고민까지 티키타카로 끌어냄 + 투자가치 전환</td></tr>\r\n    <tr><td>국비전환(3D모션, 18분)</td><td>국비 vs 일반+환급을 고객 손익으로 비교 후 날짜 확정</td></tr>\r\n    <tr><td>대리문의(전산회계)</td><td>부모 설득 + 실수강자 정보 + 비대면 등록 검토</td></tr>\r\n    <tr><td>시니어(모스/캐드 60대)</td><td>컴맹 안심·속도·평생교육지원금 — 취미형 동기 존중</td></tr>\r\n    <tr><td>관계·관리(미등록 회수)</td><td>월말 할인 + 전액환불 보장 안심 → 즉시 등록 전환</td></tr>\r\n    <tr><td>라포·취향 티키타카(9분)</td><td>레퍼런스 채널로 라포, \"대졸도 프리미어 못 다뤄요\" 안심</td></tr>\r\n    <tr><td>대표전화 즉시 클로징(3분)</td><td>방문 의사 인입 → 군더더기 없이 시간 확정(효율)</td></tr>\r\n    <tr><td>방문 명분(니즈 맞춤)</td><td>\"단순 등록 아니라 니즈 맞춰 상담 먼저\" → 포폴 보여주며 방문</td></tr>\r\n  </tbody>\r\n</table></div>\r\n\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 까다로운 상황 (즉시 클로징·불만 회복)</summary><div class=\"dlg\">\r\n  <div>① 방문 의사 분명한 인입 — 군더더기 없이</div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">대표 전화로 영상 편집 과정 문의 주셨는데, 오늘 바로 방문 상담 희망하신다고 전해 들었어요. 맞으실까요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그전에 어떤 영상 편집을 희망하시는지 여쭤봐도 될까요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">영상 편집 배우고 싶어서요. 포트폴리오를 쌓고 싶어서.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">취업 희망이신 거죠? 그럼 오늘 방문은 언제가 편하세요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">8시 반에서 9시쯤 괜찮을까요?</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">가능해요. 8시 30분에 뵙고 취업 상담 도와드릴게요. 영상도 유튜브·2D·3D 다양한데 어떤 쪽이세요?</div></div>\r\n  <div class=\"note2\">→ 방문 의사가 분명하면 과잉 설명 X. 목적 한 번 확인 → 바로 시간 확정 → 세부는 그 다음.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 대표전화 즉시 클로징(3분)</div>\r\n  <div>\r\n    <div>② 불만 고객 회복 — 감정 분리</div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저번에 남자분하고 상담했는데, 되게 성의 없이 신경질만 내더라고요. 여기 가면 안 되겠다 생각했어요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러셨구나. 담당자가 저로 변경됐고요. 불편하셨다면 제가 대신 사과드릴게요. 제가 천천히 다시 안내해 드릴게요.</div></div>\r\n    <div class=\"note2\">→ 감정을 분리하고 \"담당 변경 + 대신 사과 + 천천히 재안내\"로 신뢰 회복.</div>\r\n    <div class=\"box bad\"><span class=\"lbl\">⚠️ 단, 모방 금지</span> \"전 담당자가 그만뒀다\"는 식의 내부 사정은 말하지 않는다(Part 6-3). <b>\"담당이 저로 변경됐어요\"까지만.</b></div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 극성/불만 회복</div>\r\n  </div>\r\n</div></details>\r\n\r\n<details class=\"tk\"><summary>▸ 실제 티키타카 — 고관여·거절 상황 (고액등록·최초거절)</summary><div class=\"dlg\">\r\n  <div>① 고액·장기 과정 — 진지성 확인 + 전문 통찰</div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">건축 인테리어 과정 문의 주셨는데, 취업·창업이신지 학업 보충이신지 어디에 해당하세요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">취업 목적이요. 지금 산업디자인과 휴학 중이에요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">산디과 친구들 대부분 제품 디자인으로 많이 빠지는데, 사실 제품·가구보다 더 큰 산업 분야가 인테리어·실내 공간이에요. 취업에 더 유리하려고 넘어오는 경우도 있고요. 혹시 어떤 계기로 인테리어에 관심이 생기셨어요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">제품 쪽은 좀 아닌 것 같고, 인테리어가 그나마 관심이 있어서요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">진로가 아직 완전히 확정된 상태는 아니시군요. 학교 다니면서 배워본 툴은 있으세요?</div></div>\r\n  <div class=\"note2\">→ 고액·장기 과정일수록 \"어떤 계기로?\"로 진지성을 확인하고, 전공 흐름을 짚는 전문 통찰로 신뢰를 쌓음.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 고액등록(인테리어·취업)</div>\r\n  <div>\r\n    <div>② 최초 거절 — 압박 없이 문 다시 열기</div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">원래 바로 따려고 했는데 일정이 생겨서 지금 당장은 준비를 못 할 것 같아 미뤘어요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">필기는 보셨으니 2년 안에 실기를 보셔야 하는 상황이시죠. 지금 당장 시작 안 하셔도 돼요. 다만 이벤트로 40% 할인이 들어가는데, 수강권을 미리 보유해 두셨다가 원하시는 달에 배정받으실 수 있어요. 취득 못 하시면 재수강 1회권도 포함이고요.</div></div>\r\n    <div class=\"note2\">→ 거절을 존중(지금 안 하셔도 돼요)하면서 \"미리 잡아두면 손해 없다\"는 미래 옵션으로 부담 없이 문을 다시 엶.</div>\r\n    <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 최초거절(컴활 실기)</div>\r\n  </div>\r\n</div></details>\r\n\r\n<h3 class=\"sub3\">5-2. CS팀 우수 컨택 (익명) <span class=\"src s-keg\">CS 매뉴얼</span></h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>멘토(익명)</th><th>배울 점</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>요리홍대 책임멘토</td><td>질문마다 \"왜 묻는지\" 선안내 + 니즈 재확인. 대리문의엔 \"어머님도 당황스러우셨겠어요\" 공감</td></tr>\r\n    <tr><td>컴퓨터홍대 책임멘토 A</td><td>자격증 종류·시험 일정까지 짚는 전문성 → 신뢰. \"부모님과 상의하셨어요?\" 결정권자 확인</td></tr>\r\n    <tr><td>컴퓨터홍대 경력멘토 A</td><td>다과목 문의 → 관심 1개로 좁히기. 결석 불안엔 대면·비대면·온라인 3종 보강</td></tr>\r\n    <tr><td>컴퓨터홍대 책임멘토 B</td><td>\"필기는 학원에서 안 해요(공개문제 무료)\" — 정직하게 빼서 오히려 신뢰</td></tr>\r\n    <tr><td>요리홍대 경력멘토</td><td>본인 현업 경력 공유로 라포 → \"오셔서 저랑 얘기해 보시는 것도 좋고\"</td></tr>\r\n  </tbody>\r\n</table></div>\r\n\r\n<h3 class=\"sub3\">5-3. 반면교사 — 행동 패턴 (사람 아닌 행동을 본다)</h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th>패턴명</th><th>무엇이 문제</th><th>교훈</th></tr></thead>\r\n  <tbody>\r\n    <tr><td class=\"ng\">정보덤프형</td><td>목적 파악 없이 개강일·내일배움카드·시간표·가격 일방 나열</td><td>STEP 2 질문으로 열기의 정반대</td></tr>\r\n    <tr><td class=\"ng\">방문 미클로징</td><td>방문 명분 약하게 → \"알아보고 연락\"으로 종료</td><td>STEP 6 양자택일 부재</td></tr>\r\n    <tr><td class=\"ng\">소속·멘토명 누락</td><td>우수자조차 멘토명 빠뜨림</td><td>STEP 1 도입 4요소 끝까지</td></tr>\r\n    <tr><td class=\"ng\">감정 노출·내부사정</td><td>짜증 응대로 이탈 / \"그분 해촉되셔서\" 노출</td><td>STEP 4 + Part 6-3</td></tr>\r\n  </tbody>\r\n</table></div>\r\n<details class=\"tk\"><summary>▸ ❌ 실제 티키타카 — 정보덤프형 (이렇게 하면 안 된다)</summary><div class=\"dlg\">\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">일정이 어떻게 될까요?</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">5월 개강일이 다음 주에 있는데, 시작하시려는 시기가 어떻게 되세요?</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내일배움카드가 된다고 해서 그거 신청한 다음에 하려고요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">지금 신청 안 하셨어요? 재직자세요? 재직자분들은 내일배움카드 쓰기 어려울 수 있어요, 자부담이 발생해요.</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래도 내일배움카드로 거의 다 된다던데요.</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">되긴 하는데 시간만 맞으시면요. 나라에서 지정한 수업을 할지, 일반 수업으로 원하는 시간대에 할지 차이가 있어요.</div></div>\r\n  <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내일배움카드 시간이 어떻게 되는데요?</div></div>\r\n  <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">9시 반부터 6시 반, 월~금 나오셔야 하고…</div></div>\r\n  <div class=\"box bad\"><span class=\"lbl\">❌ 무엇이 문제였나</span> 고객 첫 질문에 <b>목적·상황 파악이 0</b> — 왜 배우려는지, 어떤 분야인지 묻지 않고 바로 제도·시간·가격으로 직진. 고객이 캐묻고 멘토는 끌려다니며 설명만 추가. = STEP 2 \"질문으로 열기\"의 정반대.</div>\r\n  <div class=\"box good\"><span class=\"lbl\">✅ 이렇게 했어야</span> \"어떤 작업에 쓰시려고요? 어떤 계기로 관심 갖게 되셨어요?\"부터 — 목적·상황을 먼저 듣고, 제도·시간은 그 다음에.</div>\r\n  <div class=\"src2\"><span class=\"src s-our\">우리 69건</span> 안좋은컨택(반면교사)</div>\r\n</div></details>\r\n<blockquote>우리·CS팀 우수자 모두 Part 2 STEP을 그대로 탄다 = 이 표준이 현장 실증과 1:1. 단 우수자도 STEP 1을 빠뜨릴 수 있으니 도입 4요소는 끝까지.</blockquote>\r\n\r\n\r\n<!-- Part 6 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 6</span>리스크·컴플라이언스 — 그대로 모방 금지</h4>\r\n<blockquote>우수 사례가 많지만, 실제 통화에서 <b>따라하면 안 되는 표현</b>도 관찰됐다. 정직하게 짚는 것이 곧 우리의 신뢰다. <span class=\"src s-our\">우리 69건</span></blockquote>\r\n\r\n<div class=\"box bad\"><span class=\"lbl\">6-1. 표시광고 — 보장성·단정 금지 <span class=\"src s-no\">⚠️모방금지</span></span><br>\r\n실제 나온 표현: <span class=\"ng\">\"포폴 만들면 대부분 취업 다 됩니다\" / \"합격률 82%\" / \"월급 따박따박\"</span> → 취업·합격을 <b>보장하듯</b> 말하지 않는다. <b>사실·범위</b>로: \"포트폴리오가 좋으면 취업에 크게 유리해요\", \"준비하시면 자격 취득까지 충분히 가능한 구성이에요.\"</div>\r\n\r\n<div class=\"box warn\"><span class=\"lbl\">6-2. 제도 안내 — 정확성 + \"확인\" 병기</span><br>\r\n국취제·실업급여·내일배움카드를 길고 단정적으로 설명하면 부정확 위험. 항상 <b>\"정확한 금액·자격은 방문/고용센터 확인\"</b> 병기. ⚠️ 국비 적격 고객을 자부담 일반으로 돌리는 화법은 컴플라이언스·고객이익 위반 소지(Part 3-1 가드).</div>\r\n\r\n<div class=\"box warn\"><span class=\"lbl\">6-3. 내부 사정·개인정보 일관성</span><br>\r\n고객 앞에서 직원·조직 사정 노출 금지(<span class=\"ng\">\"그분 해촉되셔서…\"</span> → \"담당이 저로 변경됐어요\"까지만). \"통화로 개인정보는 어려워요\"라며 나이·소득을 통화로 캐묻는 명분 불일치 금지.</div>\r\n\r\n<div class=\"box warn\"><span class=\"lbl\">6-4. KEG 존대어·표현 예절 <span class=\"src s-keg\">CS 매뉴얼</span></span><br>\r\n사물 존칭 금지(\"할인되십니다\"→\"할인됩니다\" / \"있으십니다\"→\"수강하실 수 있습니다\" / \"○만원이시구요\"→\"○만원입니다\"). 줄임말·은어 금지(\"인강\"→\"따즈아 온라인 강의\").</div>\r\n\r\n<h3 class=\"sub3\">6-5. 표현 가이드 (권장 어휘)</h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th class=\"ng\">지양</th><th class=\"og\">권장</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>보장·100%·전원·합격률 단정</td><td>유리·충분히 가능·많이들 그렇게</td></tr>\r\n    <tr><td>직원/조직 내부 사정</td><td>\"담당이 저로 변경됐어요\"까지만</td></tr>\r\n    <tr><td>사물 존칭(\"되십니다\")</td><td>\"됩니다\"</td></tr>\r\n  </tbody>\r\n</table></div>\r\n\r\n<div class=\"box good\"><span class=\"lbl\">★ 6-6. 실명·사례 사용 규칙</span><br>\r\n<b>고객</b> = 이니셜/상황 라벨로만, 식별정보 노출 0. <b>직원(멘토)</b> = 우리·CS팀 모두 실명 미노출, \"지점+역할\"로만. <b>반면교사</b> = 개인 비난이 아니라 <b>행동 패턴</b>으로(예: \"정보덤프형\"). 사람을 탓하는 게 아니라 행동을 고치는 자료.</div>\r\n\r\n\r\n</section>\r\n<section class=\"panel\" id=\"p4\">\r\n<!-- Part 7 -->\r\n<h4 class=\"sec\"><span class=\"pn\">Part 7</span>숙지·자가진단 (권장)</h4>\r\n\r\n<h3 class=\"sub3\">7-2. 통화 후 자가점검 (권장 5문)</h3>\r\n<p class=\"intro\">각 통화 뒤 스스로 체크해 보면 좋아요. 체크 상태는 이 브라우저에 저장됩니다.</p>\r\n<div class=\"checklist\" id=\"chk\">\r\n  <label><input type=\"checkbox\" data-k=\"c1\"> 질문으로 열었나 (목적부터 물었나)</label>\r\n  <label><input type=\"checkbox\" data-k=\"c2\"> 내 독백이 길지 않았나 (6:4 안쪽)</label>\r\n  <label><input type=\"checkbox\" data-k=\"c3\"> 6질문 중 빠뜨린 것은 없었나</label>\r\n  <label><input type=\"checkbox\" data-k=\"c4\"> 양자택일로 방문 약속을 잡았나</label>\r\n  <label><input type=\"checkbox\" data-k=\"c5\"> 바른마무리(끝인사 화답·카톡 약속)를 했나</label>\r\n  <button class=\"rst\">↺ 다음 통화용으로 초기화</button>\r\n  <div>다 못 했어도 괜찮아요. <b>다음 통화에서 개선할 1가지</b>만 정하면 됩니다.</div>\r\n</div>\r\n\r\n<h3 class=\"sub3\">7-3. 우수 ↔ 반면교사 한눈 대조</h3>\r\n<div class=\"tw\"><table class=\"ov\">\r\n  <thead><tr><th></th><th class=\"og\">✅ 잘한 컨택</th><th class=\"ng\">❌ 아쉬운 컨택</th></tr></thead>\r\n  <tbody>\r\n    <tr><td>관심</td><td>질문·경청으로 상황 전체를 들음</td><td>목적 확인 전 가격·일정부터 나열</td></tr>\r\n    <tr><td>관계</td><td>근거·공감으로 신뢰의 싹</td><td>대본 낭독·감정 노출</td></tr>\r\n    <tr><td>방문</td><td>\"와야 할 이유\" + 양자택일 약속</td><td>명분 약함 → \"알아보고 연락\"</td></tr>\r\n  </tbody>\r\n</table></div>\r\n\r\n<h3 class=\"sub3\">7-4. 자가진단 퀴즈 (권장 · 답을 누르면 즉시 확인)</h3>\r\n<div class=\"quiz\" id=\"quiz\"></div>\r\n\r\n\r\n</section>\r\n<section class=\"panel\" id=\"p5\">\r\n<h4 class=\"sec\"><span class=\"pn\">부록</span>★ 모범 통화 풀 스크립트 (가상·재구성)</h4>\r\n<p class=\"intro\">앞의 STEP·티키타카에서 검증된 <b>좋은 멘트만 모아</b> 도입부터 마무리까지 한 통화로 이어 붙인 <b>이상적 흐름</b>입니다. 특정 실제 통화가 아니라 <b>여러 우수 통화의 좋은 부분을 재구성</b>한 것 — 토씨가 아니라 <b>흐름</b>으로 익히세요. (시나리오: 비전공·진로고민 영상 편집 문의)</p>\r\n<details class=\"full\"><summary>★ 모범 통화 풀 스크립트 — 도입부터 마무리까지 (가상)</summary><div class=\"fbody\">\r\n  <div class=\"fnote\">⚠️ <b>가상·재구성</b>: 실제 한 통화가 아니라 우수 사례들의 좋은 멘트를 이어 붙인 모범 흐름. <span class=\"src s-our\">우리 69건</span> + <span class=\"src s-keg\">CS 매뉴얼</span></div>\r\n  <div class=\"dlg\">\r\n    <div class=\"stp\">STEP 1 · 오프닝 (도입 4요소)</div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">안녕하세요, ○○님 맞으실까요? 방금 문의 주신 SBS아카데미 컴퓨터아트학원 ○○ 멘토입니다. 영상 편집 과정으로 문의 주셨네요. 잠깐 통화 괜찮으세요? 정확히 안내드리려 몇 가지만 여쭤볼게요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 괜찮아요.</div></div>\r\n\r\n    <div class=\"stp\">STEP 2 · 파악 질문 (왜 묻는지 먼저)</div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">영상 편집 과정이 종류가 다양해서, 먼저 몇 가지 확인하고 ○○님 맞춤으로 안내드리려고요. 혹시 지금 학생이세요, 아니면 구직 중이실까요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">대학은 안 다니고, 일은 아직….</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇구나. 영상 편집은 어떤 계기로 관심 갖게 되셨어요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">옛날부터 관심 있었는데 전문적으로 배워보고 싶어서요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">좋네요. 그럼 나중에 취업도 생각 있으신 거예요? 다뤄보신 툴은 있으세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">취업도 하면 좋을 것 같아요. 툴은 거의 없어요.</div></div>\r\n\r\n    <div class=\"stp\">STEP 3 · 경청·티키타카 (일상으로)</div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">평소 일정은 어떻게 보내세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">카페 알바 하고 있어요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">요즘 카페 알바 들어가기 쉽지 않죠? 저도 옛날에 하려는데 바리스타 자격증까지 있어야 한다더라고요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">맞아요, 좀 어렵긴 했어요.</div></div>\r\n\r\n    <div class=\"stp b2\">STEP 4 · 근거·공감 (관계)</div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">안정적인 직업이 좋긴 한데, 배우는 것도 돈이 드니까 돈 좀 모으고 시작하려고요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">솔직히 말씀드리면, 돈 모아서 오겠다던 분 중에 실제로 온 분이 거의 없었어요. 대학 4년이면 학비만 3,600만 원인데 그 돈을 지금부터 모으긴 어렵잖아요. 오히려 대학을 안 갔으니 그만큼 여유가 있는 거예요. 그리고 이쪽은 비전공이 70% 가까이 돼요, 딱 ○○님 같은 분들이 많이 오세요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">자격증도 따고 싶은데, 그런 것도 봐주세요?</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼요. 자격증은 공부하다 보면 자연스럽게 따라와요. 다만 이쪽은 포트폴리오가 절대영역이라, 자격증 많아도 포폴이 별로면 안 뽑히고, 포폴이 좋으면 학벌 무시하고 들어가요.</div></div>\r\n\r\n    <div class=\"stp b2\">STEP 5 · 방문 명분 (전화의 한계)</div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래서 ○○님께 어떤 자격증을 딸 수 있고 어떤 방향으로 취업하는지, 학생들이 만든 포트폴리오를 직접 보여드리고 싶어요. 유선으로는 한계가 있어서, 직접 오시면 커리큘럼·취업처·준비물까지 하나하나 안내드려요. 상담은 비용이 들지 않으니 한번 오셔서 보시는 건 어때요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">혹시 내일배움카드 되나요?</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">내일배움카드 과정은 취준 청년 대상이라 9시~6시 전일제로 다니셔야 하고 기초부터 시작이에요. 그럼에도 \"국비로 듣고 싶어요\" 하시면 그 수업이 맞으시고요. \"지원만 되면 다른 수업도 괜찮아요\" 하시면 국민취업지원제도로 환급받으며 거의 무료에 가깝게 들으실 수 있어요. 오셔서 두 커리큘럼이랑 학생 포트폴리오 직접 보고 판단하시는 게 빨라요.</div></div>\r\n\r\n    <div class=\"stp b2\">STEP 6 · 방문 약속 + 바른 마무리</div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 내일이나 모레 중 언제가 편하세요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">모레 오후가 괜찮아요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">오후 2시·4시 중엔요?</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">2시요.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 모레 오후 2시로 잡아드릴게요. 당일 바로 결정하시는 건 추천 안 드려요, 모르던 얘기 듣고 고민이 필요하실 테니 편하게 오셔서 평소 만들어보고 싶던 영상 같이 보면서 얘기해요. 카톡으로 명함·약도·방문 일정·캘린더 보내드릴게요, 확인 답장 한 번만 주시면 돼요. 건물 ○층 인포데스크에 상담 예약했다고 성함만 말씀하시면 제가 바로 안내해 드릴게요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 알겠습니다. 감사합니다.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 모레 2시에 뵙겠습니다. 오늘도 좋은 하루 보내세요.</div></div>\r\n    <div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 감사합니다.</div></div>\r\n    <div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네, 감사합니다. <span class=\"mute\">(고객이 끊을 때까지 기다린 뒤 종료)</span></div></div>\r\n\r\n    <div class=\"stp\">STEP 7 · 복기 (통화 후 30초)</div>\r\n    <div class=\"note2\">내 발화 6:4 안쪽이었나 / 6질문 다 했나 / 양자택일로 약속 잡았나 / 바른마무리 화답했나 → 다음 통화에서 개선할 1가지만 메모.</div>\r\n  </div>\r\n</div></details>\r\n\r\n\r\n<h4 class=\"sec\"><span class=\"pn\">부록1-B</span>실제 우수 컨택 풀스크립트 — 우리 7 + CS팀 선정 10</h4><p class=\"intro\">위 가상 모범통화가 \"이상적 흐름\"이라면, 아래는 <b>실제 통화 전문 17건</b>(상황별·주제별). 고객 이니셜·직원 익명(지점+역할)·전화번호 마스킹. ⚠️ 표시 턴의 보장·단정 표현은 Part 6 기준으로 모방 금지.</p><h3 class=\"sub3\">A. 우리 우수 컨택 — 상황별 풀스크립트 <span class=\"src s-our\">우리 69건</span></h3>\r\n<p class=\"intro\">_research/08 전수분석에서 교재용 best로 선정된 실통화 전문. 고객 이니셜·직원 익명·전화번호 마스킹. STT 전사 특성상 어색한 문장이 있을 수 있음 — <b>토씨가 아니라 흐름</b>으로 읽기.</p>\r\n<details class=\"full\"><summary>🎧 라포·진로고민 (13분) <span>· 67턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 알바·부모지원·돈 고민까지 티키타카로 끌어내고 투자가치로 전환 — 관심·관계 교과서 <span class=\"mute\">(멘토 35·고객 32턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 여보세요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">여보세요 네 네 안녕하세요 혹시 서○은 님 맞으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">○은님 안녕하세요. 저희 연락드린 곳은 이전에 문의 주셨던 SBS 컴퓨터 학원에서 연락드렸어요. 네네네네 이전에 저희 SNS 통해서 저희 영상 과정으로 이제 최초 문의 주셨었는데 보니까 당시에 문의 주시고 관련 안내나 이런 것들을 못 받으셨던 것 같더라고요. 혹시 이후에 조금 영상 편집이나 이런 것들은 공부해 보셨나요? 이 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 네 마음은 있는데 아직 시작은 못 해 가지고 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">혹시 그러면 괜찮으시면 ○은 님 지금 학생분이실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">대학교는 안 다녀요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 지금 실례 안 되시면 지금 성년이시고 현재 대학교는 이제 별도로 재학 중이지 않은 상황이신 거고요. 네 그러면 ○은님 혹시 영상 편집은 좀 어떤 것 때문에 이제 관심 가지게 되신 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그 옛날부터 관심이 있었는데 좀 전문적으로 배워보고 싶어서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">정말요? 그러면 괜찮으시면 ○은님 지금 아무래도 별도로 이제 대학이나 이런 데 진학을 하지는 않으셨다고 하셔가지고 혹시 이제 영상 편집 좀 공부해서 추후 내 취업이나 이런 것들도 좀 관심이 있으신 상황이신 거예요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 하면 좋을 것 같아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">하면 좋은 상황이시고 근데 혹시 조금 현재 나이가 어떻게 되실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">지금 저 05년생이요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">05년생이시면 2 2인가요? 그렇구나 뭔가 지금 되게 공부 딱 시작해가지고 취업까지 조금 단계를 밟기 사실은 굉장히 좋은 나이대시기는 하거든요. 네 왜냐하면 이제 우리가 대부분 여자 친구들을 기준으로 뒀을 때 스무 살 때 이제 대학을 입학해 갖고 이제 스물셋 그리고 스물넷 2월쯤에 졸업을 하잖아요. 네 근데 영상 편집 분야 안에서도 말 그대로 영상 편집 쪽도 있고 이제 영상을 가지고 2D 애니메이션이나 3D 애니메이션을 만들어 볼 수 있는 그런 과정들도 있고 좀 다양하게 나뉘는데 그 안에서 비전공생들 기준으로는 한 1년에서 1년 반 정도 이제 공부 기간이 또 필요하기도 하거든요. 네 그러다 보니까 지금 사실 ○은 님께서 지금부터 조금 차근차근 준비해 보시면은 그 친구들 이제 같은 나이 또래 친구들 졸업 뭔가 일정이나 이런 것들보다 조금 더 빠르게 관련된 준비도 해 보실 수 있는 상황이시기는 해요. 네 혹시 지금 평소에는 조금 일정이나 이런 것들을 어떻게 쓰고 계세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저 알바하고 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">알바 하고 계세요? 네 알바는 혹시 언제 언제 하시는 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">근데 어제 막 시작해가지고 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어제부터 혹시 알바 무슨 알바 하나요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그냥 카페 알바 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">카페 알바 요즘 카페 알바 들어가기가 좀 괜찮아요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">좀 어렵긴 했는데 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠 아니 왜냐하면 저도 옛날에 카페 알바 좀 해보려고 그랬었는데 네 들어가려고 하니까 오히려 알바인데 경력이 있어야 되고 맞아요. 바리스타 자격증 있어야 되고 막 그러더라고요. 네 그럼 바리스타 자격증 이것도 공부해 보셨던 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니 있진 않은데 그냥 뽑아주셔가지고 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇구나 알바는 그럼 몇 시부터 몇 시까지 해요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저 다섯시까지 12시부터 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아 그 점심 때부터 오후 다섯시까지 그렇구나 그러면 혹시 ○은님 괜찮으시면 네 조금 영상 편집 쪽 관련해 가지고 관심도 있으신 상태고 그쪽 취업도 진행하게 되면 괜찮겠다라고 이제 말씀해 주셨잖아요. 네 그래도 사실 우리가 조금 인생에 있어서 알바는 사실 우리가 스쳐 지나가는 부분이다라고 볼 수 있을 텐데 취업은 좀 어떻게 준비하실 계획이 있으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">정확히 생각을 못 해봐서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아직 이렇게 그런 부분에 있어서 조금 정확하게 생각해 보신 건 없으세요? 네 그러면 그러면 제가 조금 다른 거 한번 여쭤볼 건데 네 그래도 ○은 님도 아마 이제 부모님께서 조금 약간 이런 거에 있어서 개방적이신 편이에요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 그냥 하고 싶은 거 하라고 하시는 입장이어서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">하고 싶은 거 그러니까 우리 딸 하고 싶은 거 해 이렇게 말씀해 주시는 입장이시군요. 네 근데 그러면 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">안정적인 직업이 좀 좋긴 하니까 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠 우리가 흔히 안정적인 직업이다라고 하면 이제 4대 보험 들어가고 월급 따박따박 나오고 약간 그런 것들 조금 선호를 많이 하시는데 그럼 ○은님 혹시 어쨌든 취업에는 누군가는 이제 대학이라는 전문 교육기관을 통해가지고 사실은 그것도 이제 다 취업까지 목표로 이어지는 것들이잖아요. 그럼 ○은 님은 혹시 한 언제쯤 내가 조금 취업을 해가지고 좀 이렇게 내가 전문적으로 돈을 벌고 해야 되겠다 이런 계획들 세운 거 있으세요? </div></div><div class=\"rsk\">⚠️ Part 6 주의 — 보장·단정성 표현. 흐름만 배우고 표현은 그대로 모방하지 않기.</div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">근데 어쨌든 제가 배우려고 하는 것도 다 돈이 들어가니까 좀 돈이 모 돈을 좀 모으고 나서 시작하고 싶었거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그랬구나. 근데 제가 솔직히 하나 말씀드릴까요? 제가 저도 이제 되게 많은 수강생 친구들을 여기서 만나왔고 네 그러면서 이제 취업까지 진행한 친구들도 상당히 많거든요. 저도 사실 일한 지가 좀 오래돼 가지고. 네 근데 그중에서 멘토님 저 돈 모아 갖고 올게요. 그래갖고 올 수 있는 친구가 사실은 한 명도 없었어요. 왜냐면 우리가 어떻게 조금 생각을 해봐야 되냐면 아까 제가 ○은 님 말씀드렸던 것처럼 누군가는 예를 들면 영상 편집 쪽으로 나중에 취업을 하고 싶어 가지고 대학이라는 교육기관을 이제 4년 동안 다니는 친구들도 있잖아요. 네 혹시 그 친구들 한 학기에 학비가 얼마나 들어가는지 알고 있어요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">많이 내는 건 알고 있어 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠 지금 그냥 네이버 기준으로 평균을 들었을 때 한 학기에서 한 400만 원에서 400만 원 정도 으로 보면 되거든요. 네 그러면 그 친구들이 4년 다니면서 학교에만 이제 3600만 원 정도의 돈이 들어가요. 근데 냉정하게 ○은님이 만약에 그 친구들이랑 동일한 뭔가 스펙이나 동일한 뭔가 조건들을 만들기 위해서 삼천육백만 원을 지금부터 모은다 그러면 못 모아요. 그래서 사실은 어떤 게 좀 필요하냐면 ○은 님은 아직은 사실 부모님의 지원이 필요한 상황이기도 해요. 오히려 반대로 생각해 보면 나는 지금 대학을 진학하지 않았기 때문에 그만큼 기회 비용이라는 게 조금 더 여유가 있는 상황이기도 하거든요. 네 실제로 저희 학원 같은 경우에는 별도로 대학을 진학하지 않고 저희 학원의 교육을 통해서 취업까지 지원하는 친구들도 상당히 많아요. 오히려 전공을 하고 오는 친구들보다 비전공인 상태로 오는 친구들이 훨씬 더 많은 교육 기관이기도 하거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 응 그 이유는 저희가 일반 입시 학원이나 이런 학원이 아니라 취업 전문 교육기관이기 때문에 더더욱 그런 이제 친구들이 굉장히 많이 오거든요. 네 그래서 혹시 ○은 님 그냥 괜찮으시면 저희가 상담을 진행함에 있어서 별도의 비용이 들어가거나 그러는 건 아니라서 ○은 님 괜찮으시면 혹시 조금 부모님이랑 같이 오셔가지고 영상 편집이나 ○은님이 혹시 이제 미래에 조금 가고자 하는 분야들 관련해가지고 한번 상담 진행해 보시고 네 그 과정 안에서 부모님이 그래 ○은아 너가 하고 싶으면 엄마가 이 정도는 도와줄게 하실 수도 있잖아요. 네 그럴 수도 있으니까 관련해가지고 저희 전문 교육 기관 상담 한번 받아보시는 건 어떠세요? 뭐 시간은 그렇게 오래 걸리지 않을 것 같고요. 비용이 별도로 들어가는 건 아니니까 ○은 님 괜찮으신 시간대에 한 번 뵈면 좋을 것 같아서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 혹시 학원 그러니까 어쨌든 수업을 하면서 네네네 제가 막 자격증도 좀 따주고 싶은데 혹시 그런 것도 자격증 같은 것도 혹시 같이 봐주시나요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼요. 왜냐하면 ○은님 저희 취업 전문 교육기관이라고 말씀드렸죠. 네 근데 이렇게 저는 확실하게 말씀드릴 수 있어요. 자격증은 우리가 이걸 공부하다 보면 자연스럽게 따라오게 되는 부분들이에요. 누군가는 자격증을 따려고 공부를 하시는 분들도 있는데 모든 공부의 목적은 이걸 내가 공부를 하니 자연스럽게 자격증들이 취득되는 거거든요. 그래서 영상 편집이라는 하나의 카테고리 안에서도 acp GTQ 멀티미디어 콘텐츠 제작 전문가 자격증 등등 되게 다양한 자격증 취득을 할 수가 있어요. 네 그래서 이쪽 공부하는 친구들도 아무리 못해도 과정 안에서 자격증 한 네다섯 개는 취득해가지고 취업까지 준비하기도 하거든요. 네 그리고 더더욱이 이쪽 분야는 혹시 포트폴리오라고 들어보셨어요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">여기는 포트폴리오가 가장 절대적인 영역이기도 해요. 오히려 그런 자격증들 막 되게 많은데 포트폴리오가 별 볼 일 없으면 뽑히지 않아요. 네 근데 반대로 자격증은 사실 비교적 몇 개 없는데 포트폴리오 퀄리티가 워낙에 좋으면 그것만 가지고 모든 학벌 이런 것들을 다 무시하고 들어갈 수 있는 분야이기도 하거든요. 네 응 그래서 관련해 가지고 ○은님께 제가 이 공부를 통해서 어떠한 자격증들을 취득할 수 있고 어떠한 이제 뭐 방향으로 취업을 진행을 할 수 있으며 그 과정 안에서는 어떤 것들에 대한 공부가 필요하다 이런 것들을 조금 자세하게 안내해 드리고 싶고 그리고 그 안에서 이왕이면 ○은 님만 저랑 상담을 진행하실 경우에는 ○은 님이 저랑 얘기하고 그래 내가 이게 너무 하고 싶던 거야라고 하더라도 이걸 막상 부모님께 전달하기가 되게 어려우실 거거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 그래서 ○은님이 정말 하고 싶다라고 하시면 부모님이랑 같이 조금 제가 뵙고 관련된 이야기를 한번 나눠보고 싶은데 ○은님 괜찮으시면 혹시 이번 주 중에 네 한번 부모님이랑 같이 오실 수 있는 일정이 있으신가요? 평일도 괜찮고 주말도 괜찮아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 근데 그 부모님 부모님이랑 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아직 상기 못 해 보셨죠? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래서 혹시 그러면 만약에 가면 저 혼자라도 가서 일단 상담을 받을 수 있나 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">맞아요. 그러면은 ○은님 이렇게 하시면 돼요. 네 ○은님 먼저 오셔가지고 저랑 간단하게 상담을 먼저 진행을 하시고 딱 만약에 ○은님이 결심이 섰어요. 네 근데 말하기가 어려워요. 그러면 저한테 도움 요청해 주시고 그 이후에 부모님이랑 2차 방문을 해 주셔도 괜찮아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 그러면 혹시 ○은님 일단 제가 ○은 님이라도 먼저 만나 뵙고 싶은데 네 일단 알바는 혹시 평일만 진행하시는 거예요? 월화수목금 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 일단 완전 초보여가지고 일단 월수만 나오라 하셔서 월수만 이번 주는 목요일 토요일 일요일만 시간 돼요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래요. 그러면은 금요일 목요일 목요일 혹시 그럼 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">금요일이요 금토일이요 목요일 날 제가 운동 있어가지고 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래요. 그럼 혹시 금요일 날 제가 한번 뵐까 싶은데 네 금요일날 오전 오후 중에는 시간이 언제 더 괜찮으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">오후가 괜찮아요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그쵸 오후가 더 좋죠. 다들 오후가 조금 더 편해하시더라고요. 그러면 십칠일 날 제가 조금 이 날은 아직 여유가 좀 있어 가지고 오후에 아 그래도 좀 늦지막히 일어나서 식사하시고 한 두시 정도 시간 어떠세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 괜찮아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">2시 시간 괜찮으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">○은님 우선은 저 같은 경우에도 상담 진행하고 당일 날 바로바로 뭔가 결정하시는 걸 추천드리지는 않아요. 네 왜냐하면 내가 모르는 부분에 대한 이야기를 분명히 그날 오셔갖고 듣게 되실 거고 네 그럼 그에 따른 나의 결심이라든가 고민이 충분히 필요하실 거거든요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 네 네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래서 그날은 그냥 마음 편하게 오셔가지고 네 평소에 내가 좀 즐겨보던 영상이라든가 네 이런 영상을 딱 봤을 때 나 이런 거 만들어보고 싶어 했던 것들 있잖아요. 네 그런 것들을 한번 같이 조금 자료들 보면서 이야기해보면 좋을 것 같거든요. 네네네. 그러면 제가 ○은 님 금요일날 2시에 만나 뵐 건데 잠시만요. 네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">○은님 제가 카카오톡으로 ○은님께 제 꺼 명함이랑 학원 오시는 약도 그리고 방문 일정 메시지랑 그 일정 한 번 더 체크하실 수 있게 카카오톡 캘린더 좀 같이 보내드릴게요. 네 혹시라도 시간 변경이나 일정 변경 필요하시다라고 하시면 지금 이 번호나 카카오톡으로 저한테 편하게 연락 주시면 되시거든요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 일단 이번 주 알바 처음 또 시작하셨는데 이번 주 일정 잘 마무리하시고 금요일날 2시에 뵙도록 하겠습니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 감사합니다. ○은님 오늘도 좋은 하루 되세요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 감사합니다.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 국비전환 — 고객이익 가드 (18분) <span>· 64턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 국비 vs 일반+환급을 고객 손익으로 비교 후 방문 클로징 — Part 3-1 4스텝 실증 <span class=\"mute\">(멘토 36·고객 28턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 여보세요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 여보세요 네 네 안녕하세요 혹시 김○님 되실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 안녕하세요 여기 쓰리디 모션 그래픽 전문가 과정으로 수강호랑 시간표 조회해 주신 SBS 컴퓨터 강남 학원에서 전화드렸어요. 네네 안녕하세요 혹시 저희 진 님께서 3D 모션 그래픽을 좀 어떤 목적이랑 활용을 위해서 좀 문의 주셨을까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그 모션 그래픽 디자이너 생각을 하고 있는데 제가 비전공자거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아 네네 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래가지고 뭐지 학원 다니면서 좀 배우고 가능하면 포트폴리오도 만들고 하고 싶은데 맞아요. 네네 그 뭐지? 내일배움카드 받고 고용 24 조회해 보니까 네 SBS 학원에 3월 17일부터 시작하는 과정 국비 지원되는 게 있는 것 같더라고요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">맞아요. 네네 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래서 그거 혹시 들을 수 있을까 해서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">가능하죠 혹시 지금 나이가 어떻게 되세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">지금 99년생이에요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 스물여덟 맞으실까요? 네네 네 이전에 영상 편집이라든지 포토샵 일러스트 이런 거 해보신 적 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아주 간단하게는 할 줄 알고 네 애프터 이펙트까지 다뤄본 적은 있거든요. 네네. 근데 c4d는 아예 안 달아보긴 했어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면 ○희 님께서 이것저것 김○ 외자 이름 맞으시죠? ○희 님이라고 불러드려도 될까요? 네네 ○희 님께서 이 3D 모션 그래픽 관련해서 이것저것 조금 많이 알아보신 티가 나요 그러면 그 3D 툴은 c4d만 알아보신 걸까요? 아니면 그 외에도 다른 프로그램 알아보신 게 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">다 알아보긴 했는데 일단 c4d를 배우는 쪽으로 생각을 하고 있었어. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">맞아요. 아무래도 14d가 현재 트렌드라든지 광고라든지 뭔가 브랜드 영상 이런 쪽에서 많이 쓰이고 있는데 취업 포트폴리오를 만들려면은 결국에는 그 3D에 대한 툴과 영상을 디자인할 수 있는 그 역량을 만들어 나가야 돼요. 모션 그래픽 디자이너다 보니 그러면은 이제 좀 희망하시는 취업처가 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">취업처는 영상 회사들이나 광고 쪽으로 갈 생각을 하고는 있거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러시구나 관심 있는 영상이 따로 있으신가요? 레퍼런스라든지 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">레퍼런스 아니 지금 딱히 생각나는 건 없는 것 같아 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래요. 그러면은 모션 그래픽은 단순히 영상 편집을 잘하고 단순히 예쁘다 이런 느낌보다는 좀 광고에 대한 감각적이라는 걸 감각적인 어떤가라든지 아니면은 연출이라든지 혹은 내가 브랜드 광고를 한다고 했을 때 그 무드를 어떻게 할 건지와 영상 또 속도가 좀 중요하잖아요. 네네 영상 부분 부분에 대한 걸 좀 잘 보여줄 수 있는 그런 프레임이라든지 어떻게 보면 기획적인 것도 중요하면서 영상 편집 감각 무드 속도 이런 거 다 중요하게 보는 곳인데 저희가 이제 보통 어도비 툴을 기본적으로 잡고 있어요. 포토샵 일러스트 프리미엄 애프터 이펙트 네 그래서 학원 상에서 포토샵 일러스트 이제 기초부터 바로 잡은 다음에 혹은 저는 기초는 되어 있습니다라고 하면은 그다음에 이후에 이제 디자인을 조금 더 테크니컬하게 더 이것저것 다양한 걸 경험해 볼 수 있게끔 더 디테일한 퀄리티를 만들어낼 수 있게끔 심화반이라든지 응용반 수업을 들으셔도 되시고요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 그러면서 뭔가 디자인도 좀 바로잡고 그다음에 c4디라고 하는 3D 툴도 배우면서 뭔가 하나의 모델링이라든지 랜더링이라든지 애니메이션 이런 것도 만들고 네 그다음에 이제 포트폴리오 사실 포트폴리오라고 하면은 저희가 결국에는 이제 취업 창에서 중요시하게 보는 부분이잖아요. 그래서 그런 것들을 이제 같이 해나가는 작업을 안내받아보시면 좋을 것 같은데 내일배움카드 얘기를 주셔서 내일배움카드라고 하면은 고용노동부에서 뭔가 국민에게 지급해 주는 지원 형태의 결제 카드인 거고요. 근데 그게 이제 현금으로 지급되는 게 아니라 포인트화 되어 있어서 내가 어떤 수업을 이걸 결제한다고 하면은 그 카드를 활용해서 결제할 때 안에 포인트 차감과 동시에 일정 어떤 자부담을 납부하는 방식으로 이루어져 있어요. </div></div><div class=\"ln m\"><div class=\"who\"> \"><div class=\"who\">멘토</div><div class=\"tx\">멀어요. 그러면 서울에 어디서 사실 예정이세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">광진구요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">광진구요 건대 입구 그쪽인가요? 네네 그래요. 그러면 생각보다 거리상으로는 많이 안 머신 것 같고 네 2월 25일 저희가 지금 겨울 방학 맞이해서 학생들 이제 수강 문의가 가장 많은 시즌과 좀 이제 이벤트 혜택 이런 것도 하고 있어서 한번 이제 상담 예약을 잡고 그때 이제 서울에 오셨을 때 알맞게 오신 김에 상담받아오시면 좋을 것 같은데 저희 상담 예약이 이제 예약제다 보니까 실시간 마감을 띠고 있는데요. 이제 그때 이때 예약을 했는데 다른 날로 변경하고 싶다라고 하면은 또 그 상황에 맞춰서 변경이라든지 그런 거는 가능해요. 네 다만 지금 겨울방학이다 보니 상담 예약이 실시간으로 마감이 빨라서 일단 그때 서울에 올라오시는 그 일자에 맞춰서 상담을 제가 도와드리고 혹은 서울에 그때 안 올라오실 수도 있는 거고 이틀 정도 밀릴 수도 있잖아요. 미리 연락만 저희 저희 이제 카톡으로 소통할 건데 미리 연락만 주시면은 이때가 아니라 이때로 변경하겠습니다. 다 가능합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 이십오일 중 몇 시 정도가 편하세요? 저희는 강남역 9번 출구 바로 앞에 위치하고 있는 학원이에요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">이십오일 말고 이십육일로 잡아주실 수 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">가능하죠. 잠시만요. 26일이면은 목요일 맞으실까요? 네 네 목요일 몇 시 정도 편하세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">목요일 이거 혹시 지금 관련해서 신청을 하거나 오후 2시 괜찮을까요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">잠시만 기다려 주세요. 네 저희가 네 오후 2시 가능합니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 그러면은 그렇게 도와주. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 알겠습니다. 제가 이대로 잡아드리고요. 평소에 이제 영상 편집 신 거 작업을 가져와주셔도 되시고 아니면 모션 그래픽 이제 3D 결과물 누군가가 만든 것 중에 핀터레스트 이미지라든지 유튜브 영상 중에서 ○희 님께서 전 약간 이런 느낌의 퀄리티를 희망합니다. 이런 느낌을 선호합니다. 그런 게 있다면은 같이 보여주세요. 그거에 맞춰서 조금 더 학원에서 알맞거나 필요하신 과정이 있다면 안내 도와드릴 거고 네 그 수업을 두 가지의 커리큘럼을 보여드리는 이유는 보통 내일배움카드 수업의 메리트는 무료 수업이거나 자부담이 적은 부분에 대한 메리트만 잡고 있어서 일반 수업에 대한 거를 ○희 님께서 360만 원 정도 이렇게 환급 확대가 이루어졌다고 가정했을 때 결국에는 동일하게 전액 무료에 가까이 수업을 하실 수 있는 커리큘럼으로 안내를 드릴 수 있어요. 그래서 오히려 좋은 게 있고 뭔가 애매한데 지원이 된다고 하면은 좋은데 지원받는 게 더 낫잖아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 그거에 대한 차이를 안내받아보시면 좋을 것 같아서 그때 오셨을 때 커리큘럼 두 가지 같이 비교해 드리고 또 이제 자부담은 ○희 님께서 하시는 건가요 아니면 부모님께서 수강 관련해서 도움을 주시는 건가요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">부모님께서 도움을 주시기는 할 거예요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래요. 그럼 아무래도 부모님께서 이제 지인 님께 도움을 주실 때 수강 관련해서 조금 부담이 되지 않게끔 그 선으로 안내 도와드릴 거여서 너무 그때 이제 금액적인 부분이라든지 크게 생각하고 오지 않으셔도 됩니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">알겠습니다. 그러면 저희 26일에 뵙는 걸로 할게요. 제가 카카오톡 추가해서 ○희 님께 상담 예약 메시지랑 위치와도 같이 보내드릴게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 감사합니다. 좋은 하루 보내세요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 대리문의 — 부모 응대 (12분) <span>· 91턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 부모 설득 + 실수강자 정보 확보 — Part 3-2 자녀 보호 프로토콜 실증 <span class=\"mute\">(멘토 46·고객 45턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">여보세요. 네 여보세요. 네 안녕하세요 여기 SBS 아카데미 컴퓨터 학원입니다. 네 네 지금 잠깐 통화 가능하실까 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">통화 괜찮아요? 예. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그럼 저희 학원으로 문의주셔가지고 안내차 연락드렸는데 지금 기초 회계 과정 문의 주셨잖아요. 네 그럼 정확히 이쪽을 공부를 희망하시는 파트라든지 이런 게 좀 어떻게 되세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그 공부를 희망하는 파트 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">이유 네 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">이유
