\n<p>공통 룰, 훅, 메모리 세 레이어로 작동한다.</p>\n<ul><li>\n공통 룰: <code>99_시스템\\common-core.md</code> 하나만 수정하면 다음 세션부터 전체 반영.\n</li><li>\n훅 (<code>%USERPROFILE%\\.claude\\settings.json</code>)\n<ul><li>\nSessionStart → 세션 열릴 때 common-core.md 자동 주입. <code>[COMMON-OK:해시]</code> 마커 확인.\n</li><li>\nPostToolUse(Write|Edit) → 파일 저장 시 인트라넷 금지문자 자동 검사.\n</li><li>\nPostToolUse(Write) → 파일 생성 완료 팝업.\n</li></ul>\n</li><li>\n메모리 (<code>memory\\MEMORY.md</code>) → 누적 피드백·참고 정보. 세션마다 자동 로드.\n</li></ul>\n<hr>\n<h4>스킬 트리거 목록</h4>\n<h5>인트라넷 기록</h5>\n<p><strong>sbs-consult-log</strong> → 방문·대면 상담 직후</p>\n<ul><li>\n모드1 퀵 (코드블럭, 파일저장 없음): &quot;상담일지&quot; / &quot;상담 끝&quot; / &quot;방문 끝&quot; / &quot;상담 정리&quot;\n</li><li>\n모드2 보고 (.md 저장): &quot;상담 보고&quot; / &quot;팀장 보고&quot; / &quot;상담 디테일&quot;\n</li><li>\n저장: <code>02_수강생관리\\[이름]님\\상담보고_이름_YYMMDD.md</code>\n</li></ul>\n<p><strong>sbs-contact-memo</strong> → 전화·비대면 컨텍 직후</p>\n<ul><li>\n모드1 퀵 (코드블럭, 파일저장 없음): &quot;컨텍메모&quot; / &quot;전화 끝&quot; / &quot;통화 끝&quot; / &quot;구디비&quot; / &quot;신규디비&quot;\n</li><li>\n모드2 보고 (.md 저장): &quot;컨텍 보고&quot; / &quot;컨텍 디테일&quot; / &quot;팀장 보고(컨텍)&quot;\n</li><li>\n저장: <code>02_수강생관리\\[이름]님\\컨텍보고_이름_YYMMDD.md</code>\n</li></ul>\n<p><strong>sbs-interview-log</strong> → 등록 수강생 면담 직후 (코드블럭만, 파일저장 없음)</p>\n<ul><li>\n트리거: &quot;면담일지&quot; / &quot;면담 끝&quot; / &quot;면담 정리&quot; / &quot;면담했어&quot;\n</li><li>\n작성 전 해당 수강생 폴더(<code>02_수강생관리\\[이름]님\\</code>) 자동 확인.\n</li></ul>\n<hr>\n<h5>블로그</h5>\n<p><strong>sbs-blog (A블로그, 품질형)</strong> → 에피소드 기반·네오 페르소나</p>\n<ul><li>\n트리거: &quot;블로그 써줘&quot; / &quot;포스팅 초안&quot; / &quot;네이버 글&quot;\n</li><li>\n저장: <code>03_BLOG\\blog_[과정명약어]_[YYMMDD].md</code>\n</li><li>\n출력: 파일 저장 + 코드블럭 본문 동시 출력\n</li></ul>\n<p><strong>sbs-blog-B (B블로그, 바이럴형)</strong> → 키워드+과정명만 있으면 즉시 작성</p>\n<ul><li>\n트리거: &quot;B블로그&quot; / &quot;바이럴&quot; / &quot;마케팅 글&quot; / &quot;빠르게 써줘&quot; / &quot;양산&quot;\n</li><li>\n저장: <code>03_BLOG\\blogB_[키워드약어]_[YYMMDD].md</code>\n</li></ul>\n<hr>\n<h5>업무 문서</h5>\n<p><strong>sbs-report</strong> → 교육·청강 보고서</p>\n<ul><li>\n트리거: &quot;보고서 만들어줘&quot; / &quot;교육 보고서&quot; / &quot;팀장님 교육 정리&quot;\n</li></ul>\n<p><strong>payment-guide</strong> → 결제 안내·등록 후속 처리·환불 대응</p>\n<ul><li>\n트리거: &quot;결제 안내&quot; / &quot;환불&quot; / &quot;등록 후 뭐 해야 해&quot; / &quot;클로징 다음&quot; / &quot;현영&quot;\n</li></ul>\n<p><strong>sbs-intranet</strong> → 인트라넷 절차 안내 (텍스트 즉시 참조)</p>\n<ul><li>\n트리거: &quot;인트라넷 어떻게 해&quot; / &quot;DB 등록&quot; / &quot;수강배정&quot; / &quot;원서 등록&quot; / &quot;학사메모&quot;\n</li></ul>\n<p><strong>personal-log</strong> → 업무 외 일상·진료 녹취 정리</p>\n<ul><li>\n트리거: &quot;일상 녹취&quot; / &quot;병원 정리&quot; / &quot;개인 기록&quot; / &quot;진료 정리&quot;\n</li><li>\n저장: <code>00_아델리 우체통\\personal-log_[situation]_[YYMMDD].md</code>\n</li></ul>\n<hr>\n<h5>안내 문자</h5>\n<p><strong>sbs-notice</strong> → 수강생 학사일정 안내 문자·메시지</p>\n<ul><li>\n트리거: &quot;개강 안내 문자&quot; / &quot;학사일정 안내&quot; / &quot;안내 메시지 만들어줘&quot; / &quot;문자 써줘&quot;\n</li></ul>\n<hr>\n<h4>파일 저장 경로 기준 (common-core.md 표준)</h4>\n<pre><code>블로그 초안       03_BLOG\\\n수강생 산출물     02_수강생관리\\[이름]님\\   ← &quot;님&quot; 필수\n개강안내·안내자료  01_안내용자료\\\n업무일지·시스템   99_시스템\\\n기타             00_아델리 우체통\\</code></pre>\n<p>인트라넷 입력용 기록(컨텍메모·상담일지·면담일지)은 파일저장 없이 코드블럭 출력만.</p>\n<hr>\n<h4>시스템 유지보수</h4>\n<p><strong>룰 수정</strong></p>\n<ul><li>\n<code>99_시스템\\common-core.md</code> 수정\n</li><li>\n세션 재시작 → <code>[COMMON-OK:해시]</code> 확인\n</li></ul>\n<p><strong>스킬 수정·추가</strong></p>\n<ul><li>\n<code>99_시스템\\10_스킬시스템\\skills_updated\\[스킬명]\\SKILL.md</code> 수정\n</li><li>\nClaude Code에 &quot;동기화해줘&quot; 입력 → AppData 자동 배포\n</li></ul>\n<p><strong>메모리 추가</strong></p>\n<ul><li>\n<code>memory\\[파일명].md</code> 작성 (frontmatter: name·description·type)\n</li><li>\n<code>memory\\MEMORY.md</code> 인덱스에 한 줄 추가\n</li></ul>\n<hr>\n<h4>현재 배포된 스킬 목록 (AppData 기준, 2026-07-31 정리 후 18종)</h4>\n<p>인트라넷 기록: sbs-consult-log · sbs-contact-memo · sbs-interview-log · sbs-contact-report</p>\n<p>블로그: sbs-blog · sbs-blog-B</p>\n<p>업무: sbs-report · payment-guide · sbs-intranet · personal-log · sbs-db-push · sbs-timetable-add · sbs-timeline</p>\n<p>안내: sbs-notice</p>\n<p>루틴: sbs-morning · sbs-lunch · sbs-checkout · sbs-checkin</p>\n<p>260731 폐지 11종(호출 실적 0회 기준): blog-image-generator · contact-log · sbs-course-table · sbs-duty · sbs-estimate · sbs-insta · sbs-judge · sbs-linktree · sbs-onboard · sbs-question · sbs-transcript. 견적서·시간표 xlsx는 사람이 직접 작성한다.</p>\n<p>시스템: skill-creator · consolidate-memory · schedule · setup-cowork · design-system</p>\n<p>문서: docx · pptx · xlsx · pdf</p>\n<p>260731 폐지 11종(호출 실적 0회 기준): blog-image-generator · contact-log · sbs-course-table · sbs-duty · sbs-estimate · sbs-insta · sbs-judge · sbs-linktree · sbs-onboard · sbs-question · sbs-transcript. 견적서·시간표 xlsx는 사람이 직접 작성한다.</p>\n<h3>클로드_세션가이드</h3>\n<h4>클로드 세션 사용 가이드 (2026-07-15, 오영선님 사용 데이터 기반)</h4>\n<p>현재 패턴 진단: 최근 1개월 151세션(7월 일평균 9개)으로 짧은 세션이 많고, 반대로 오늘 밤처럼 한 세션이 마라톤이 되기도 함. 둘 다 토큰 비효율임 → 세션이 길어질수록 매 응답이 이전 대화 전체를 이고 가서 비싸지고, 너무 짧으면 맥락 재설명 비용이 생김.</p>\n<h4>규칙 5개 (이것만)</h4>\n<ul><li>\n하루 3세션 구조로 고정\n</li><li>\n업무 세션(기본 모델): 상담 기록·안내문·분석 등 판단이 필요한 일. 아침 &quot;브리핑&quot;으로 시작\n</li><li>\n반복 세션(Sonnet): 시작하자마자 /model sonnet → 디비밀어·정리·스캔·DB갱신 몰아서 처리 후 종료\n</li><li>\n야간 세션(Sonnet): 퇴근 전 &quot;야간작업&quot; 한 마디로 무거운 것 위임하고 닫기\n</li></ul>\n<ul><li>\n한 세션 = 한 흐름\n</li></ul>\n<p>주제가 바뀌면(예: 상담 기록을 하다가 블로그로) 새 세션. 맥락은 메모리·보드·위키가 이어주므로 새 세션이 손해가 아님. 오늘 밤처럼 십수 개 주제를 한 세션에 쌓는 것이 가장 비싼 사용법임</p>\n<ul><li>\n긴 자료는 붙여넣지 말고 파일로\n</li></ul>\n<p>STT·엑셀은 파일 첨부(또는 다운로드에 두면 인박스가 수집) → 제가 필요한 부분만 읽음. 전문 붙여넣기는 그 세션 내내 토큰을 점유함</p>\n<ul><li>\n지시는 명령어 우선\n</li></ul>\n<p>브리핑 / 디비밀어 / 인입 확인 / 인박스 비워 / 누락 대조 / 주간스캔 / 수강생DB 갱신 / 야간작업 / 속도 측정 / 자동화 켜·꺼. 명령어에 규칙이 다 들어 있어 설명이 필요 없음</p>\n<ul><li>\n상태 확인은 /usage, 모델 전환은 /model, 스킬 갱신 반영은 /reload-skills\n</li></ul>\n<p>한도 불안하면 /usage 한 번이면 끝. 추측으로 불안해하지 않기</p>\n<h4>세션을 닫아도 되는 이유 (불안 대응)</h4>\n<ul><li>\n기억: 메모리 파일이 세션과 무관하게 유지됨(오늘 만든 규칙 전부 포함)\n</li><li>\n할 일: 보드+위젯이 들고 있음 / 변경 이력: CHANGELOG / 검증: 자가감사 로그\n</li><li>\n즉 세션은 소모품이고, 지식은 파일에 있음. 닫는 것을 아까워할 필요 없음\n</li></ul>\n<p>백로그 23번(클로드 활용 가이드)의 1부에 해당. 2부(공식 문서 기반 심화)는 예정대로 진행.</p>\n<h3>제미나이_활용가이드</h3>\n<h4>제미나이 활용 가이드 (2026-07-14 작성)</h4>\n<p>용도 분담 원칙 : 클로드 = 본진(파일·기록·인트라넷·자동화·수강생 데이터 접근 가능). 제미나이 = 이동 중·폰에서의 보조(음성 질문, 빠른 검색·요약, 문자 초안). 수강생 기록이 필요한 작업을 제미나이에 시키면 근거 없이 지어내므로 금지.</p>\n<h4>설정 방법 (1회, 2분)</h4>\n<ul><li>\n제미나이 앱/웹 → 설정 → &quot;저장된 정보(Saved info)&quot;에 아래 프롬프트 붙여넣기. 또는 Gem 만들기 → 이름 &quot;SBS비서&quot; → 지침에 붙여넣기\n</li><li>\n이후 모든 대화에 자동 적용됨\n</li></ul>\n<h4>붙여넣기용 시스템 프롬프트 (복사 시작~끝)</h4>\n<pre><code>너는 SBS아카데미 컴퓨터 강남 본점 경력멘토 오영선의 업무 보조다. 다음 규칙을 예외 없이 지켜라.\n\n1. 사실만 말한다. 수치·날짜·이름·과정명·수강료를 절대 지어내지 않는다. 모르면 &quot;확인 필요&quot;라고만 답한다. 추정이면 문장 앞에 (추정)을 붙인다.\n2. 두괄식으로 답한다. 결론 먼저, 근거는 뒤에. 답변은 짧게, 목록은 5개 이하.\n3. 나(오영선)에게는 격식 있는 보고체(&quot;~합니다&quot;)로 답한다. 업무 기록용 텍스트는 개조식(&quot;~함/됨&quot;)으로 쓴다.\n4. 고객 발송용 문자·카톡 초안은 결론+핵심정보를 줄바꿈으로 5~7줄 압축. 이모지·특수기호 금지. 서명은 &quot;오영선&quot; 실명만.\n5. 의료·병력 정보는 [건강 관련 정보]로만 표기한다.\n6. 수강생 개인정보·기록·수강료 관련 질문에는 &quot;이건 클로드(본진)에서 처리할 것&quot;이라고 답하고 임의로 지어내지 않는다.\n7. 내 지시가 모호해도 3개 이하의 해석 중 가장 그럴듯한 것을 고르고 (가정)을 명시한 뒤 바로 실행한다. 되묻기는 최대 1회.\n8. 한국 기준으로 답한다(한국시간, 한국 제도·용어). 국비 관련은 내일배움카드·국민취업지원제도 기준.</code></pre>\n<h4>제미나이에 시키기 좋은 것 / 금지</h4>\n<ul><li>\n좋음 : 통근 중 음성으로 아이디어 정리, 뉴스·트렌드 요약, 고객 문자 초안(발송 전 검토), 맞춤법, 간단 번역, 엑셀 함수 질문\n</li><li>\n금지 : 수강생 정보 관련 답변 생성, 수강료·일정 안내문(창작 위험), 인트라넷 절차(클로드 위키가 정본), 상담일지 작성(양식 어긋남)\n</li></ul>\n<h4>연동 팁</h4>\n<p>제미나이에서 만든 초안은 그대로 쓰지 말고 클로드 채팅에 붙여넣으며 &quot;검수해서 발송용으로&quot;라고 하면 정본 규칙(실명 서명·창작 금지·양식)으로 재검된다.</p>","x":"ai도구 클로드 제미나이 통합본 통합일 2026 07 18. 클로드·제미나이 가이드 3개를 한 파일로 합침(내용 무변경). 공통 룰 정본은 common core.md이며 이 파일은 사용법 안내임. 클로드_활용가이드 클로드 활용 가이드 → 2026 06 12 기준 (v3.2 cc) 시스템 구조 공통 룰, 훅, 메모리 세 레이어로 작동한다. 공통 룰: 99_시스템\\common core.md 하나만 수정하면 다음 세션부터 전체 반영. 훅 ( %userprofile%\\.claude\\settings.json ) sessionstart → 세션 열릴 때 common core.md 자동 주입. common ok:해시 마커 확인. posttooluse(write edit) → 파일 저장 시 인트라넷 금지문자 자동 검사. posttooluse(write) → 파일 생성 완료 팝업. 메모리 ( memory\\memory.md ) → 누적 피드백·참고 정보. 세션마다 자동 로드. 스킬 트리거 롬프트 붙여넣기. 또는 gem 만들기 → 이름 \"sbs비서\" → 지침에 붙여넣기 이후 모든 대화에 자동 적용됨 붙여넣기용 시스템 프롬프트 (복사 시작~끝) 너는 sbs아카데미 컴퓨터 강남 본점 경력멘토 오영선의 업무 보조다. 다음 규칙을 예외 없이 지켜라. 1. 사실만 말한다. 수치·날짜·이름·과정명·수강료를 절대 지어내지 않는다. 모르면 \"확인 필요\"라고만 답한다. 추정이면 문장 앞에 (추정)을 붙인다. 2. 두괄식으로 답한다. 결론 먼저, 근거는 뒤에. 답변은 짧게, 목록은 5개 이하. 3. 나(오영선)에게는 격식 있는 보고체(\"~합니다\")로 답한다. 업무 기록용 텍스트는 개조식(\"~함/됨\")으로 쓴다. 4. 고객 발송용 문자·카톡 초안은 결론+핵심정보를 줄바꿈으로 5~7줄 압축. 이모지·특수기호 금지. 서명은 \"오영선\" 실명만. 5. 의료·병력 정보는 건강 관련 정보 로만 표기한다. 6. 수강생 개인정보·기록·수강료 관련 질문에는 \"이건 클로드(본진)에서 처리할 것\"이라고 답하고 임의로 지어내지 않는다. 7. 내 지시가 모호해도 3개 이하의 해석 중 가장 그럴듯한 것을 고르고 (가정)을 명시한 뒤 바로 실행한다. 되묻기는 최대 1회. 8. 한국 기준으로 답한다(한국시간, 한국 제도·용어). 국비 관련은 내일배움카드·국민취업지원제도 기준. 제미나이에 시키기 좋은 것 / 금지 좋음 : 통근 중 음성으로 아이디어 정리, 뉴스·트렌드 요약, 고객 문자 초안(발송 전 검토), 맞춤법, 간단 번역, 엑셀 함수 질문 금지 : 수강생 정보 관련 답변 생성, 수강료·일정 안내문(창작 위험), 인트라넷 절차(클로드 위키가 정본), 상담일지 작성(양식 어긋남) 연동 팁 제미나이에서 만든 초안은 그대로 쓰지 말고 클로드 채팅에 붙여넣으며 \"검수해서 발송용으로\"라고 하면 정본 규칙(실명 서명·창작 금지·양식)으로 재검된다."},"99_시스템/03_학과지식/AI학과_레벨테스트_아델리ver_문제지.md":{"t":"AI학과 레벨테스트 문제지","s":"","g":[],"d":"2026-08-10","f":"학과 지식","l":[],"h":"<ul><li>\n상태: 정답과 해설이 파일에 없고 작성일 표기도\n</li></ul>\n<p>없다</p>\n<ul><li>\n핵심: AI학과 레벨테스트 객관식 문제지다.\n</li></ul>\n<p>프롬프트 1·프롬프트 2·AI 에이전트 기초·</p>\n<p>AI 에이전트 심화 4개 과정 각 10문항이다</p>\n<ul><li>\n주의: 파일명의 &quot;아델리&quot;는 구 페르소나이고\n</li></ul>\n<p>대외 표기는 네오로 통일한다</p>\n<h5>📘 프롬프트 1 과정 (10문항)</h5>\n<h4>Q1. 〔개념 응용〕 LLM이 할루시네이션을 일으키는 구조적 원인으로 가장 정확한 것은?</h4>\n<p>① AI 서버가 과부하 상태일 때 오류가 발생해서</p>\n<p>② 학습 데이터가 오래되어 최신 정보를 모르기 때문에</p>\n<p>③ 다음에 올 단어를 사실 여부가 아닌 확률적 자연스러움 기준으로 생성하기 때문에</p>\n<p>④ 유료 플랜에서만 사실 검증 기능이 작동하기 때문에</p>\n<h4>Q2. 〔두 개념 비교〕 제로샷 / 원샷 / 퓨샷 프롬프트를 예시 제공 개수 기준으로 올바르게 짝지은 것은?</h4>\n<p>① 제로샷=1개, 원샷=0개, 퓨샷=2개 이상</p>\n<p>② 제로샷=0개, 원샷=1개, 퓨샷=2개 이상</p>\n<p>③ 제로샷=0개, 원샷=2개, 퓨샷=5개 이상</p>\n<p>④ 세 가지 모두 예시 개수 무관하고 질문 길이로 구분한다</p>\n<h5>Q3. 〔실무 시나리오〕 &quot;블로그 글 써달라고 했는데 다 맞는 말 같던데요? 그냥 쓰면 되는 거 아닌가요?&quot;</h5>\n<p>위의 상황에 가장 적절한 응대는?</p>\n<p>① &quot;맞아요, AI 글은 그냥 쓰셔도 돼요&quot;</p>\n<p>② &quot;LLM은 사실 여부보다 말이 자연스러운지를 우선하기 때문에 틀린 정보도 그럴듯하게 쓸 수 있어요.&quot;</p>\n<p>③ &quot;AI 글은 믿으면 안 돼요, 직접 쓰세요&quot;</p>\n<p>④ &quot;유료 플랜이면 할루시네이션이 없어요&quot;</p>\n<h5>Q4. 〔함정 포함〕 멀티모달 AI의 특징을 가장 잘 설명한 사례는?</h5>\n<p>① 여러 언어를 동시에 번역하는 AI</p>\n<p>② 텍스트 입력을 받아 이미지를 생성하고, 분위기까지 분석해서 추가 제안을 해주는 AI</p>\n<p>③ 여러 사람이 동시에 접속할 수 있는 AI</p>\n<p>④ 멀티태스킹을 지원하는 고사양 컴퓨터용 AI</p>\n<h5>Q5. 〔두 개념 비교〕 뤼튼(wrtn)과 챗GPT의 포지셔닝 차이로 가장 정확한 것은?</h5>\n<p>① 뤼튼은 이미지 생성 전용, 챗GPT는 텍스트 전용이다</p>\n<p>② 뤼튼은 여러 생성형 AI를 한 곳에서 쓸 수 있는 중개 플랫폼이고, 챗GPT는 OpenAI가 만든 단일 대화형 AI다</p>\n<p>③ 챗GPT가 뤼튼의 하위 서비스다</p>\n<p>④ 둘 다 동일한 LLM을 사용해서 결과물이 같다</p>\n<h4>Q6. 〔개념 응용〕 같은 질문을 AI에게 여러 번 했을 때 답변이 매번 달라지는 문제를 해결하는 가장 효과적인 방법은?</h4>\n<p>① 더 빠른 인터넷 환경에서 사용한다</p>\n<p>② AI 계정을 새로 만든다</p>\n<p>③ 프롬프트에 톤·형식·길이·타깃 등 구체적인 기준을 추가한다</p>\n<p>④ 오전 시간대에만 AI를 사용한다</p>\n<h4>Q7. 〔실무 시나리오〕 &quot;AI POT 자격증이 국가자격증인가요?&quot;라는 질문에 가장 정확한 응대는?</h4>\n<p>① &quot;네, 고용노동부에서 인정하는 국가자격증이에요&quot;</p>\n<p>② &quot;자격증 효력이 없어서 이력서에 못 써요&quot;</p>\n<p>③ &quot;민간자격이지만 공식 등록된 자격이에요. 등록번호 2024-002196, 자격종류는 등록민간자격이고 AI 프롬프트 활용 능력을 증명하는 이력서 스펙으로 활용 가능해요&quot;</p>\n<p>④ &quot;뤼튼에서 발급하는 민간 수료증이에요&quot;</p>\n<h4>Q8. 〔함정 포함〕 AI 프롬프트 1 과정에서 챗봇 제작을 배우는 이유로 가장 적절한 것은?</h4>\n<p>① 챗봇을 판매해서 수익을 낼 수 있어서</p>\n<p>② 프롬프트 이론을 실제 결과물로 구현해보면서 LLM 활용 원리를 체득할 수 있어서</p>\n<p>③ 챗봇 제작이 AI POT 시험의 전부를 차지해서</p>\n<p>④ 챗GPT 계정 없이도 AI를 쓸 수 있게 되어서</p>\n<h4>Q9. 〔두 개념 비교〕 AI를 &quot;지식인처럼&quot; 쓰는 것과 &quot;업무 파트너처럼&quot; 쓰는 것의 차이를 가장 잘 설명한 것은?</h4>\n<p>① 지식인처럼 쓰는 게 더 효율적이다</p>\n<p>② 지식인처럼 쓰면 단순 질문-답변에 그치고,   업무 파트너처럼 쓰면 기획·분석·초안 작성·렌더링 요청 등   복합 업무를 맡길 수 있다</p>\n<p>③ 둘의 차이는 질문 길이뿐이다</p>\n<p>④ 유료 플랜에서만 업무 파트너처럼 쓸 수 있다</p>\n<h4>Q10. 〔실무 시나리오〕 &quot;AI가 빠르게 발전하는데, 지금 배워도 금방 쓸모없어지는 거 아닌가요?&quot; 라는 질문에 맞는 답변은?</h4>\n<p>① &quot;맞아요, AI는 너무 빨리 바뀌어서 지금 배우면 손해예요&quot;</p>\n<p>② &quot;커리큘럼이 자주 업데이트되는 건 맞지만,</p>\n<p>프롬프트 작성 원리와 AI 활용 사고방식 자체는</p>\n<p>도구가 바뀌어도 그대로 적용돼요.  지금 배우는 게 가장 빠른 거예요&quot;</p>\n<p>③ &quot;AI는 앞으로 10년간 변하지 않을 거예요&quot;</p>\n<p>④ &quot;커리큘럼이 바뀌면 무료로 재수강 가능해요&quot;</p>\n<h5>📗 프롬프트 2 과정 (10문항)</h5>\n<h4>Q1. 〔두 개념 비교〕</h4>\n<p>미드저니와 스테이블 디퓨전을</p>\n<p>실무 목적에 따라 구분한 것으로 가장 정확한 것은?</p>\n<p>① 미드저니는 무료·커스텀 가능,</p>\n<p>스테이블 디퓨전은 유료·고퀄리티다</p>\n<p>② 미드저니는 압도적 고퀄리티 유료 서비스로 상업용 이미지에 적합하고,</p>\n<p>스테이블 디퓨전은 오픈소스로 내 컴퓨터에 설치해</p>\n<p>자유롭게 커스텀할 수 있다</p>\n<p>③ 스테이블 디퓨전이 퀄리티가 더 높고 미드저니는 입문용이다</p>\n<p>④ 둘 다 어도비에서 만든 도구다</p>\n<h4>Q2. 〔함정 포함〕</h4>\n<p>컴파이(ComfyUI)를 스테이블 디퓨전과 함께 쓰는 이유로 가장 정확한 것은?</p>\n<p>① 컴파이가 스테이블 디퓨전보다</p>\n<p>퀄리티가 높은 별도의 AI 엔진이라서</p>\n<p>② 컴파이는 스테이블 디퓨전을 더 정밀하게 제어하는 인터페이스로,</p>\n<p>일관성 있는 이미지 생성과 정밀 제어에 특화되어 있어서</p>\n<p>③ 컴파이 없이는 스테이블 디퓨전 설치 자체가 불가능해서</p>\n<p>④ 컴파이가 저작권 문제를 자동으로 해결해줘서</p>\n<h4>Q3. 〔실무 시나리오〕</h4>\n<p>학생이 미드저니로 뽑은 이미지를 클라이언트 납품물에 사용했어요.</p>\n<p>클라이언트가 &quot;상업적으로 써도 되나요?&quot;라고 물었을 때</p>\n<p>가장 정확한 응대는?</p>\n<p>① &quot;AI가 만들었으니 저작권이 없어서 자유롭게 쓸 수 있어요&quot;</p>\n<p>② &quot;미드저니는 유료 플랜 기준 상업적 사용이 허용되지만,</p>\n<p>플랜 등급과 최신 이용약관을 반드시 확인해야 해요&quot;</p>\n<p>③ &quot;AI 이미지는 저작권법상 상업적 사용이 전면 금지예요&quot;</p>\n<p>④ &quot;미드저니는 어도비 라이선스를 따르므로</p>\n<p>무조건 유료 계약이 필요해요&quot;</p>\n<h4>Q4. 〔개념 응용〕</h4>\n<p>감마(Gamma)와 챗GPT를 함께 쓸 때</p>\n<p>가장 효율적인 워크플로우는?</p>\n<p>① 감마로 텍스트 논리를 잡고, 챗GPT로 슬라이드를 디자인한다</p>\n<p>② 챗GPT로 발표 내용의 구조·핵심 메시지를 다듬은 뒤,</p>\n<p>감마에 전달해서 슬라이드 디자인으로 완성한다</p>\n<p>③ 두 도구는 기능이 같아서 하나만 써도 결과가 동일하다</p>\n<p>④ 감마가 글쓰기에 더 강하므로 감마를 먼저 쓴다</p>\n<h4>Q5. 〔두 개념 비교〕</h4>\n<p>나노바나나와 미드저니의 차이로 가장 정확한 것은?</p>\n<p>① 나노바나나가 미드저니보다 이미지 퀄리티가 높다</p>\n<p>② 나노바나나는 무료, 미드저니는 유료라는 점만 다르다</p>\n<p>③ 미드저니는 독립 플랫폼(디스코드 기반)이고,</p>\n<p>나노바나나는 제미나이에 종속된 이미지 생성 전담 도구다</p>\n<p>④ 둘 다 구글이 만든 이미지 생성 AI다</p>\n<h4>Q6. 〔함정 포함〕</h4>\n<p>AI로 생성한 이미지의 저작권에 대한 설명 중 가장 정확한 것은?</p>\n<p>① AI가 만들었으므로 모든 AI 이미지는 저작권이 없다</p>\n<p>② AI 이미지는 생성한 사람에게 항상 저작권이 귀속된다</p>\n<p>③ 도구마다 라이선스 정책이 다르므로</p>\n<p>사용 전 반드시 이용약관을 확인해야 한다</p>\n<p>④ 유료 구독이면 저작권 문제가 자동으로 해결된다</p>\n<h4>Q7. 〔실무 시나리오〕</h4>\n<p>&quot;스테이블 디퓨전 무료라고 해서 설치했는데 너무 어려워요.</p>\n<p>그냥 미드저니 쓰면 되지 않나요?&quot;</p>\n<p>라고 학생이 말했어요. 가장 적절한 응대는?</p>\n<p>① &quot;맞아요, 스테이블 디퓨전은 전문가용이라</p>\n<p>일반인은 포기하는 게 맞아요&quot;</p>\n<p>② &quot;미드저니가 퀄리티는 압도적이지만 유료예요.</p>\n<p>스테이블 디퓨전은 무료로 내 컴퓨터에서 커스텀할 수 있다는 게 강점이고,</p>\n<p>컴파이를 함께 쓰면 정밀 제어도 가능해요.</p>\n<p>목적에 따라 두 도구를 구분해서 쓰는 법을 과정에서 배워요&quot;</p>\n<p>③ &quot;스테이블 디퓨전은 컴파이 없이는 아무것도 할 수 없어요&quot;</p>\n<p>④ &quot;둘 다 결과물이 동일하니까 편한 것만 쓰세요&quot;</p>\n<h4>Q8. 〔개념 응용〕</h4>\n<p>이미지 생성 AI에서 &quot;일관성 유지&quot;가 실무적으로 중요한 이유는?</p>\n<p>① AI 서버 비용을 줄일 수 있어서</p>\n<p>② 렌더링 속도가 빨라져서</p>\n<p>③ 브랜딩·캐릭터 제작처럼 동일한 스타일을 여러 컷에 걸쳐 유지해야</p>\n<p>실무 납품물로 쓸 수 있어서</p>\n<p>④ 일관성이 높을수록 저작권 문제가 자동으로 해결되어서</p>\n<h4>Q9. 〔두 개념 비교〕</h4>\n<p>Veo(베오)와 Runway를 현재 트렌드 기준으로 비교한 것으로 가장 정확한 것은?</p>\n<p>① Runway가 텍스트 이해도와 영상 퀄리티 모두에서 Veo를 앞선다</p>\n<p>② Veo와 Runway는 기능이 동일해서 어느 것을 써도 결과가 같다</p>\n<p>③ Veo의 텍스트 이해도와 영상 퀄리티가 우세하고,</p>\n<p>Runway는 현재 트렌드에서 밀리는 추세다</p>\n<p>④ Runway는 구글이 만든 영상 AI다</p>\n<h4>Q10. 〔실무 시나리오〕</h4>\n<p>학생이</p>\n<p>&quot;프롬프트 2에서 데이터분석 자동화도 배운다고 했는데,</p>\n<p>저는 디자인 하려고 왔는데 왜 그걸 배워야 해요?&quot;</p>\n<p>라고 물었어요. 가장 설득력 있는 응대는?</p>\n<p>① &quot;데이터분석은 선택 사항이라 안 배워도 돼요&quot;</p>\n<p>② &quot;AI로 디자인 소스만 뽑는 게 아니라,</p>\n<p>클라이언트 데이터를 분석해서 기획 방향을 잡고</p>\n<p>감마로 제안서까지 만드는 것이 실무 디자이너의 업무 범위예요.</p>\n<p>프롬프트 2는 AI를 '하나의 작업'이 아닌</p>\n<p>'전체 워크플로우'에 연결하는 과정이에요&quot;</p>\n<p>③ &quot;데이터분석 자동화 자격증이 있어야 취업이 돼요&quot;</p>\n<p>④ &quot;디자이너도 코딩은 필수라서 데이터 분석부터 배우는 거예요&quot;</p>\n<h5>📙 AI 에이전트 기초 과정 (10문항)</h5>\n<h4>Q1. 〔두 개념 비교〕</h4>\n<p>일반 AI(챗GPT 등)와 AI 에이전트의 가장 본질적인 차이는?</p>\n<p>① AI 에이전트는 이미지 생성에 특화되어 있다</p>\n<p>② 일반 AI는 더 비싼 서비스다</p>\n<p>③ 일반 AI는 답변만 제공하고 실행은 사람이 직접 하지만,</p>\n<p>AI 에이전트는 스스로 판단·실행·저장까지 자동 처리한다</p>\n<p>④ AI 에이전트는 인터넷 없이도 작동한다</p>\n<h4>Q2. 〔개념 응용〕</h4>\n<p>AI 에이전트의 3대 핵심 요소 중</p>\n<p>&quot;Human-in-the-loop&quot;가 반드시 필요한 이유는?</p>\n<p>① AI 속도가 느려서 사람이 중간에 도와줘야 해서</p>\n<p>② 구독 비용 승인 절차가 필요해서</p>\n<p>③ AI가 스스로 실행하는 만큼 잘못된 판단이 자동 실행될 위험이 있으므로,</p>\n<p>실행 전 인간의 최종 승인으로 안전을 확보하기 위해서</p>\n<p>④ AI가 언어를 이해 못 할 때를 대비해서</p>\n<h4>Q3. 〔함정 포함〕</h4>\n<p>AI 에이전트 구현에 현재 가장 최적화된 모델로</p>\n<p>강의에서 소개된 것은?</p>\n<p>① 챗GPT (OpenAI)</p>\n<p>② 제미나이 (Google)</p>\n<p>③ 뤼튼 (wrtn)</p>\n<p>④ 클로드 (Anthropic)</p>\n<h4>Q4. 〔실무 시나리오〕</h4>\n<p>&quot;AI 에이전트한테 회사 내부 자료를 맡기면</p>\n<p>개인정보가 유출될 것 같아서 못 쓰겠어요&quot;</p>\n<p>라고 학생이 말했어요. 가장 적절한 응대는?</p>\n<p>① &quot;맞아요, 회사 기밀은 절대 AI에 입력하면 안 돼요&quot;</p>\n<p>② &quot;개인정보보호법을 준수하는 구조로 설계되어 있고,</p>\n<p>해킹 외 일반 사용 범위에서는 위험이 낮아요.</p>\n<p>AI 활용 레벨이 올라갈수록 보안 관리 역량도 함께 성장해요&quot;</p>\n<p>③ &quot;유료 플랜이면 완벽하게 보안이 보장돼요&quot;</p>\n<p>④ &quot;걱정되시면 개인 자료를 가짜로 바꿔서 입력하시면 돼요&quot;</p>\n<h4>Q5. 〔두 개념 비교〕</h4>\n<p>코워크(Cowork)와 챗GPT의 차이를</p>\n<p>가장 정확하게 설명한 것은?</p>\n<p>① 코워크는 이미지 생성 전용, 챗GPT는 텍스트 전용이다</p>\n<p>② 코워크는 AI 에이전트 기반 업무 자동화 플랫폼으로</p>\n<p>반복 업무를 AI가 처리하도록 설계된 도구이고,</p>\n<p>챗GPT는 대화형 AI로 답변 제공 후 실행은 사람이 한다</p>\n<p>③ 챗GPT가 코워크의 상위 서비스다</p>\n<p>④ 둘 다 구독 없이 무료로 사용 가능하다</p>\n<h4>Q6. 〔개념 응용〕</h4>\n<p>&quot;AI 에이전트는 만능이라 무엇이든 완성물을 만들어준다&quot;</p>\n<p>는 주장의 문제점은?</p>\n<p>① 맞는 말이다. AI 에이전트는 실제로 모든 작업을 완성할 수 있다</p>\n<p>② AI 에이전트는 1차 소스 생성과 자동화에 강하지만,</p>\n<p>실무 수준의 완성물은 후반 작업(사람의 판단·편집)이 반드시 필요하다</p>\n<p>③ AI 에이전트는 텍스트만 처리할 수 있어서 완성물 개념이 없다</p>\n<p>④ AI 에이전트를 쓰면 오히려 품질이 낮아진다</p>\n<h4>Q7. 〔실무 시나리오〕</h4>\n<p>&quot;AI 에이전트 배우면 어떤 직종에서 쓸 수 있어요?&quot;</p>\n<p>라고 학생이 물었어요. 가장 설득력 있는 응대는?</p>\n<p>① &quot;주로 IT 개발자나 데이터 분석가에게만 필요해요&quot;</p>\n<p>② &quot;2026년까지 기업 앱의 40% 이상에 AI 에이전트 탑재가 전망돼요.</p>\n<p>반복 업무가 있는 모든 직종에서 활용 가능하고,</p>\n<p>모든 직원이 자율형 AI 비서를 운용하는 시대가 오고 있어요&quot;</p>\n<p>③ &quot;유튜버와 프리랜서에게만 실질적으로 유용해요&quot;</p>\n<p>④ &quot;아직 실무 도입 사례가 없어서 배워도 당장 쓰기 어려워요&quot;</p>\n<h4>Q8. 〔함정 포함〕</h4>\n<p>클로드(Claude)가 AI 에이전트 실무에서 강점을 갖는 이유로 가장 정확한 것은?</p>\n<p>① 챗GPT보다 훨씬 저렴해서</p>\n<p>② 구글 서비스와 연동이 잘 되어서</p>\n<p>③ 파일 생성·수정·저장을 자동 처리하고</p>\n<p>할루시네이션이 상대적으로 낮아 실무 신뢰도가 높아서</p>\n<p>④ 이미지 생성 능력이 가장 뛰어나서</p>\n<h4>Q9. 〔개념 응용〕</h4>\n<p>AGI(범용 인공지능)로의 진화 방향과</p>\n<p>AI 에이전트의 관계를 가장 잘 설명한 것은?</p>\n<p>① AGI는 AI 에이전트와 전혀 다른 별개의 기술이다</p>\n<p>② AI 에이전트는 스스로 문제 해결 경로를 탐색하고 목표를 완수하는 방향으로 발전하고 있으며,</p>\n<p>이것이 AGI로 가는 중간 단계다</p>\n<p>③ AGI가 완성되면 AI 에이전트는 쓸모없어진다</p>\n<p>④ AI 에이전트는 AGI보다 더 발전된 형태다</p>\n<h4>Q10. 〔실무 시나리오〕</h4>\n<p>AI 에이전트 기초 과정을 마친 학생이</p>\n<p>&quot;심화 과정도 들어야 하나요? 기초로 충분하지 않나요?&quot;</p>\n<p>라고 물었어요. 가장 적절한 응대는?</p>\n<p>① &quot;기초로 충분해요, 심화는 개발자용이에요&quot;</p>\n<p>② &quot;기초는 개념·원리·Cowork 활용까지예요.</p>\n<p>심화에서는 클로드 코드로 실제 파이프라인을 직접 구축하고,</p>\n<p>바이브코딩으로 자체 앱·웹 개발까지 연결해요.</p>\n<p>목표가 '이해'냐 '직접 구현'이냐에 따라 달라요&quot;</p>\n<p>③ &quot;심화 없이는 자격증을 못 따요&quot;</p>\n<p>④ &quot;기초와 심화 내용이 겹치는 게 많아서 큰 차이 없어요&quot;</p>\n<h5>📕 AI 에이전트 심화 과정 (10문항)</h5>\n<h4>Q1. 〔두 개념 비교〕</h4>\n<p>클로드(Claude)와 챗GPT를</p>\n<p>에이전트 실무 관점에서 비교한 것으로 가장 정확한 것은?</p>\n<p>① 챗GPT가 파일 자동 처리와 에이전트 구현에 더 특화되어 있다</p>\n<p>② 클로드는 파일 생성·수정·저장을 자동 처리하고</p>\n<p>할루시네이션이 상대적으로 낮지만 토큰 소모가 빠른 편이고,</p>\n<p>챗GPT는 범용성과 대화 능력이 강점이다</p>\n<p>③ 두 모델은 동일한 LLM을 기반으로 하므로 에이전트 성능이 같다</p>\n<p>④ 클로드는 텍스트 전용이라 파일 처리가 불가능하다</p>\n<h4>Q2. 〔개념 응용〕</h4>\n<p>클로드 코드로 이메일 자동 발송 파이프라인을 구성할 때</p>\n<p>올바른 실행 순서는?</p>\n<p>① 이메일 발송 → 주소록 읽기 → Yes/No 승인</p>\n<p>② Yes/No 승인 → gmail_server.js 구동 → 주소록 읽기 → 발송</p>\n<p>③ 로컬 주소록 읽기 → gmail_server.js 구동 → Yes/No 승인 루프 → 발송 실행</p>\n<p>④ gmail_server.js 구동 → 발송 → 사후 승인 확인</p>\n<h4>Q3. 〔함정 포함〕</h4>\n<p>바이브코딩(Vibe Coding)에 대한 설명으로 가장 정확한 것은?</p>\n<p>① 음악을 들으며 집중력을 높여 코딩하는 방법이다</p>\n<p>② 고급 개발자가 빠르게 코드를 최적화하는 기법이다</p>\n<p>③ 코딩 지식 없이 AI와 대화하며 코드를 작성·수정하는 방식으로,</p>\n<p>기초/심화로 난이도가 나뉜다</p>\n<p>④ C4D에서 모션 그래픽을 제작하는 워크플로우다</p>\n<h4>Q4. 〔실무 시나리오〕</h4>\n<p>바이브코딩으로 웹 페이지를 만들던 수강생이</p>\n<p>&quot;AI가 뽑아준 코드가 이상한 것 같아요&quot;라고 했어요.</p>\n<p>가장 적절한 응대는?</p>\n<p>① &quot;AI 코드는 항상 정확하니 그냥 쓰세요&quot;</p>\n<p>② &quot;기초 웹 지식이 없으면 바이브코딩은 불가능해요&quot;</p>\n<p>③ &quot;처음부터 다시 만들어달라고 하는 게 제일 빨라요&quot;</p>\n<p>④ &quot;오류 메시지나 이상한 부분을 AI에게 그대로 붙여넣고</p>\n<p>원인과 수정 방법을 다시 물어보면 돼요.</p>\n<p>이 디버깅 루프 자체가 바이브코딩의 핵심 과정이에요&quot;</p>\n<h4>Q5. 〔두 개념 비교〕</h4>\n<p>AI 에이전트 투트랙(트랙 A / 트랙 B)의 차이로 가장 정확한 것은?</p>\n<p>① 트랙 A는 무료, 트랙 B는 유료다</p>\n<p>② 트랙 A는 코딩 전공자 전용, 트랙 B는 일반인 전용이다</p>\n<p>③ 공통 선수과목(16h)은 같지만,</p>\n<p>트랙 A는 업무 자동화 실무 심화로,</p>\n<p>트랙 B는 AI 웹 포트폴리오 개발로 분기된다</p>\n<p>④ 트랙 B를 먼저 이수해야 트랙 A로 진입할 수 있다</p>\n<h4>Q6. 〔개념 응용〕</h4>\n<p>클로드 코드의 &quot;데이터 분석 → 보고서 자동 생성&quot; 파이프라인에서</p>\n<p>사람이 반드시 개입해야 하는 시점은?</p>\n<p>① 데이터 파일을 열기 전</p>\n<p>② 분석 알고리즘 코드를 직접 짜는 시점</p>\n<p>③ AI가 생성한 보고서 초안을 검수하고 최종 승인하는 시점</p>\n<p>④ 개입할 필요 없이 AI가 처음부터 끝까지 처리한다</p>\n<h4>Q7. 〔실무 시나리오〕</h4>\n<p>&quot;AI 에이전트 심화까지 다 배우면 개발자가 되는 건가요?&quot;</p>\n<p>라고 학생이 물었어요. 가장 정확한 응대는?</p>\n<p>① &quot;네, 이 과정 수료하면 주니어 개발자로 취업 가능해요&quot;</p>\n<p>② &quot;개발자가 되는 게 아니라,</p>\n<p>AI를 업무 파트너로 활용하는 역량을 갖추는 거예요.</p>\n<p>코드를 직접 짜는 게 아니라 AI에게 코드를 짜게 하고</p>\n<p>결과를 판단·검수하는 사람이 되는 과정이에요&quot;</p>\n<p>③ &quot;개발자보다 훨씬 더 전문적인 직종이 돼요&quot;</p>\n<p>④ &quot;코딩은 전혀 안 해도 되고 클릭만으로 앱을 만들 수 있어요&quot;</p>\n<h4>Q8. 〔함정 포함〕</h4>\n<p>기초 웹 지식(HTML/CSS 등)이 AI 에이전트 심화 과정에서 권장되는 이유는?</p>\n<p>① 자격증 취득 조건이라서</p>\n<p>② 웹 지식이 없으면 수강 자체가 불가능해서</p>\n<p>③ AI가 생성한 코드를 이해하고</p>\n<p>오류를 판별·수정 요청하는 데 기초 지식이 있으면</p>\n<p>훨씬 정밀하게 활용할 수 있어서</p>\n<p>④ 어도비 프로그램 사용에 필요한 선수지식이라서</p>\n<h4>Q9. 〔두 개념 비교〕</h4>\n<p>AI 파이프라인에서 &quot;AI 1차 소스 생성&quot;과 &quot;후반 작업&quot;의</p>\n<p>역할 분담으로 가장 정확한 것은?</p>\n<p>① AI가 후반 작업까지 완성하고, 사람은 최종 파일만 저장한다</p>\n<p>② AI는 초안·에셋·데이터 분석 등 1차 소스를 생성하고,</p>\n<p>사람은 이를 검수·편집해서 실무 퀄리티로 완성한다</p>\n<p>③ 사람이 완성물을 먼저 만들고 AI가 수정·보완한다</p>\n<p>④ AI와 사람의 역할을 나눌 필요 없이 AI가 전부 처리한다</p>\n<h4>Q10. 〔실무 시나리오〕</h4>\n<p>AI 에이전트 심화 수강생이</p>\n<p>&quot;구글 드라이브를 거점으로 스마트폰에서도</p>\n<p>PC 에이전트를 제어할 수 있다고 했는데, 실제로 가능한가요?&quot;</p>\n<p>라고 물었어요. 가장 정확한 응대는?</p>\n<p>① &quot;이론상으로만 가능하고</p>\n<p>실제 구현은 전문 개발자만 할 수 있어요&quot;</p>\n<p>② &quot;구글 드라이브를 거점으로 스마트폰·태블릿에서</p>\n<p>PC 에이전트를 원격 제어하는 기기 연동은</p>\n<p>클로드 코드 시연에서 실제로 소개된 기능이에요&quot;</p>\n<p>③ &quot;클로드 코드는 인터넷 연결 없이만 작동해서</p>\n<p>원격 제어가 불가능해요&quot;</p>\n<p>④ &quot;구글 드라이브 유료 플랜에서만 가능한 기능이에요&quot;</p>","x":"상태: 정답과 해설이 파일에 없고 작성일 표기도 없다 핵심: ai학과 레벨테스트 객관식 문제지다. 프롬프트 1·프롬프트 2·ai 에이전트 기초· ai 에이전트 심화 4개 과정 각 10문항이다 주의: 파일명의 \"아델리\"는 구 페르소나이고 대외 표기는 네오로 통일한다 📘 프롬프트 1 과정 (10문항) q1. 〔개념 응용〕 llm이 할루시네이션을 일으키는 구조적 원인으로 가장 정확한 것은? ① ai 서버가 과부하 상태일 때 오류가 발생해서 ② 학습 데이터가 오래되어 최신 정보를 모르기 때문에 ③ 다음에 올 단어를 사실 여부가 아닌 확률적 자연스러움 기준으로 생성하기 때문에 ④ 유료 플랜에서만 사실 검증 기능이 작동하기 때문에 q2. 〔두 개념 비교〕 제로샷 / 원샷 / 퓨샷 프롬프트를 예시 제공 개수 기준으로 올바르게 짝지은 것은? ① 제로샷=1개, 원샷=0개, 퓨샷=2개 이상 ② 제로샷=0개, 원샷=1개, 퓨샷=2개 이상 ③ 제로샷=0개, 원샷=2개, 퓨샷=5개 이상 ④ 세 가지 모두 예시 개수 무관하고 질문 길이로 구분한다 q3. 〔실무 시나리오〕 \"블로그 글 써달라고 했는데 다 맞는 말 같던데요? 그냥 쓰면 되는 거 아닌가요?\" 위의 상황에 가장 적절한 응대는? ① \"맞아요, ai 글은 그냥 쓰셔도 돼요\" ② \"llm은 사실 여부보다 말이 자연스러운지를 우선하기 때문에 틀린 정보도 그럴듯하게 쓸 수 있어요.\" ③ \"ai 글은 믿으면 안 돼요, 직접 쓰세요\" ④ \"유료 플랜이면 할루시네이션이 없어요\" q4. 〔함정 포함〕 멀티모달 ai의 특징을 가장 잘 설명한 사례는? ① 여러 언어를 동시에 번역하는 ai ② 텍스트 입력을 받아 이미지를 생성하고, 분위기까지 분석해서 추가 제안을 해주는 ai ③ 여러 사람이 동시에 접속할 수 있는 ai ④ 멀티태스킹을 지원하는 고사양 컴퓨터용 ai q5. 〔두 개념 비교〕 뤼튼(wrtn)과 챗gpt의 포지셔닝 차이로 가장 정확한 것은? ① 뤼튼은 이미지 생성 전용, 챗gpt는 텍스트 전용이다 ② 뤼튼은 여러 생성형 ai를 한 곳에서 쓸 수 있는 중개 플랫폼이고, 챗gpt는 openai가 만든 단일 대화형 ai다 ③ 챗gpt가 뤼튼의 하위 서비스다 ④ 둘 다 동일한 llm을 사용해서 결과물이 같다 q6. 〔개념 응용〕 같은 질문을 ai에게 여러 번 했을 때 답변이 매번 달라지는 문제를 해결하는 가장 효과적인 방법은? ① 더 빠른 인터넷 환경에서 사용한다 ② ai 계정을 새로 만든다 ③ 프롬프트에 톤·형식·길이·타깃 등 구체적인 기준을 추가한다 ④ 오전 시간대에만 ai를 사용한다 q7. 〔실무 시나리오〕 \"ai pot 자격증이 국가자격증인가요?\"라는 질문에 가장 정확한 응대는? ① \"네, 고용노동부에서 인정하는 국가자격증이에요\" ② \"자격증 효력이 없어서 이력서에 못 써요\" ③ \"민간자격이지만 공식 등록된 자격이에요. 등록번호 2024 002196, 자격종류는 등록민간자격이고 ai 프롬프트 활용 능력을 증명하는 이력서 스펙으로 활용 가능해요\" ④ \"뤼튼에서 발급하는 민간 수료증이에요\" q8. 〔함정 포함〕 ai 프롬프트 1 과정에서 챗봇 제작을 배우는 이유로 가장 적절한 것은? ① 챗봇을 판매해서 수익을 낼 수 있어서 ② 프롬프트 이론을 실제 결과물로 구현해보면서 llm 활용 원리를 체득할 수 있어서 ③ 챗봇 제작이 ai pot 시험의 전부를 차지해서 ④ 챗gpt 계정 없이도 ai를 쓸 수 있게 되어서 q9. 〔두 개념 비교〕 ai를 \"지식인처럼\" 쓰는 것과 \"업무 파트너처럼\" 쓰는 것의 차이를 가장 잘 설명한 것은? ① 지식인처럼 쓰는 게 더 효율적이다 ② 지식인처럼 쓰면 단순 질문 답변에 그치고, 업무 파트너처럼 쓰면 기획·분석·초안 작성·렌더링 요청 등 복합 업무를 맡길 수 있다 ③ 둘의 차이는 질문 길이뿐이다 ④ 유료 플랜에서만 업무 파트너처럼 쓸 수 있다 q10. 〔실무 시나리오〕 \"ai가 빠르게 발전하는데, 지금 배워도 금방 쓸모없어지는 거 아닌가요?\" 라는 질문에 맞는 답변은? ① \"맞아요, ai는 너무 빨리 바뀌어서 지금 배우면 손해예요\" ② \"커리큘럼이 자주 업데이트되는 건 맞지만, 프롬프트 작성 원리와 ai 활용 사고방식 자체는 도구가 바뀌어도 그대로 적용돼요. 지금 배우는 게 가장 빠른 거예요\" ③ \"ai는 앞으로 10년간 변하지 않을 거예요\" ④ \"커리큘럼이 바뀌면 무료로 재수강 가능해요\" 📗 프롬프트 2 과정 (10문항) q1. 〔두 개념 비교〕 미드저니와 스테이블 디퓨전을 실무 목적에 따라 구분한 것으로 가장 정확한 것은? ① 미드저니는 무료·커스텀 가능, 스테이블 디퓨전은 유료·고퀄리티다 ② 미드저니는 압도적 고퀄리티 유료 서비스로 상업용 이미지에 적합하고, 스테이블 디퓨전은 오픈소스로 내 컴퓨터에 설치해 자유롭게 커스텀할 수 있다 ③ 스테이블 디퓨전이 퀄리티가 더 높고 미드저니는 입문용이다 ④ 둘 다 어도비에서 만든 도구다 q2. 〔함정 포함〕 컴파이(comfyui)를 스테이블 디퓨전과 함께 쓰는 이유로 가장 정확한 것은? ① 컴파이가 스테이블 디퓨전보다 퀄리티가 높은 별도의 ai 엔진이라서 ② 컴파이는 스테이블 디퓨전을 더 정밀하게 제어하는 인터페이스로, 일관성 있는 이미지 생성과 정밀 제어에 특화되어 있어서 ③ 컴파이 없이는 스테이블 디퓨전 설치 자체가 불가능해서 ④ 컴파이가 저작권 문제를 자동으로 해결해줘서 q3. 〔실무 시나리오〕 학생이 미드저니로 뽑은 이미지를 클라이언트 납품물에 사용했어요. 클라이언트가 \"상업적으로 써도 되나요?\"라고 물었을 때 가장 정확한 응대는? ① \"ai가 만들었으니 저작권이 없어서 자유롭게 쓸 수 있어요\" ② \"미드저니는 유료 플랜 기준 상업적 사용이 허용되지만, 플랜 등급과 최신 이용약관을 반드시 확인해야 해요\" ③ \"ai 이미지는 저작권법상 상업적 사용이 전면 금지예요\" ④ \"미드저니는 어도비 라이선스를 따르므로 무조건 유료 계약이 필요해요\" q4. 〔개념 응용〕 감마(gamma)와 챗gpt를 함께 쓸 때 가장 효율적인 워크플로우는? ① 감마로 텍스트 논리를 잡고, 챗gpt로 슬라이드를 디자인한다 ② 챗gpt로 발표 내용의 구조·핵심 메시지를 다듬은 뒤, 감마에 전달해서 슬라이드 디자인으로 완성한다 ③ 두 도구는 기능이 같아서 하나만 써도 결과가 동일하다 ④ 감마가 글쓰기에 더 강하므로 감마를 먼저 쓴다 q5. 〔두 개념 비교〕 나노바나나와 미드저니의 차이로 가장 정확한 것은? ① 나노바나나가 미드저니보다 이미지 퀄리티가 높다 ② 나노바나나는 무료, 미드저니는 유료라는 점만 다르다 ③ 미드저니는 독립 플랫폼(디스코드 기반)이고, 나노바나나는 제미나이에 종속된 이미지 생성 전담 도구다 ④ 둘 다 구글이 만든 이미지 생성 ai다 q6. 〔함정 포함〕 ai로 생성한 이미지의 저작권에 대한 설명 중 가장 정확한 것은? ① ai가 만들었으므로 모든 ai 이미지는 저작권이 없다 ② ai 이미지는 생성한 사람에게 항상 저작권이 귀속된다 ③ 도구마다 라이선스 정책이 다르므로 사용 전 반드시 이용약관을 확인해야 한다 ④ 유료 구독이면 저작권 문제가 자동으로 해결된다 q7. 〔실무 시나리오〕 \"스테이블 디퓨전 무료라고 해서 설치했는데 너무 어려워요. 그냥 미드저니 쓰면 되지 않나요?\" 라고 학생이 말했어요. 가장 적절한 응대는? ① \"맞아요, 스테이블 디퓨전은 전문가용이라 일반인은 포기하는 게 맞아요\" ② \"미드저니가 퀄리티는 압도적이지만 유료예요. 스테이블 디퓨전은 무료로 내 컴퓨터에서 커스텀할 수 있다는 게 강점이고, 컴파이를 함께 쓰면 정밀 제어도 가능해요. 목적에 따라 두 도구를 구분해서 쓰는 법을 과정에서 배워요\" ③ \"스테이블 디퓨전은 컴파이 없이는 아무것도 할 수 없어요\" ④ \"둘 다 결과물이 동일하니까 편한 것만 쓰세요\" q8. 〔개념 응용〕 이미지 생성 ai에서 \"일관성 유지\"가 실무적으로 중요한 이유는? ① ai 서버 비용을 줄일 수 있어서 ② 렌더링 속도가 빨라져서 ③ 브랜딩·캐릭터 제작처럼 동일한 스타일을 여러 컷에 걸쳐 유지해야 실무 납품물로 쓸 수 있어서 ④ 일관성이 높을수록 저작권 문제가 자동으로 해결되어서 q9. 〔두 개념 비교〕 veo(베오)와 runway를 현재 트렌드 기준으로 비교한 것으로 가장 정확한 것은? ① runway가 텍스트 이해도와 영상 퀄리티 모두에서 veo를 앞선다 ② veo와 runway는 기능이 동일해서 어느 것을 써도 결과가 같다 ③ veo의 텍스트 이해도와 영상 퀄리티가 우세하고, runway는 현재 트렌드에서 밀리는 추세다 ④ runway는 구글이 만든 영상 ai다 q10. 〔실무 시나리오〕 학생이 \"프롬프트 2에서 데이터분석 자동화도 배운다고 했는데, 저는 디자인 하려고 왔는데 왜 그걸 배워야 해요?\" 라고 물었어요. 가장 설득력 있는 응대는? ① \"데이터분석은 선택 사항이라 안 배워도 돼요\" ② \"ai로 디자인 소스만 뽑는 게 아니라, 클라이언트 데이터를 분석해서 기획 방향을 잡고 감마로 제안서까지 만드는 것이 실무 디자이너의 업무 범위예요. 프롬프트 2는 ai를 '하나의 작업'이 아닌 '전체 워크플로우'에 연결하는 과정이에요\" ③ \"데이터분석 자동화 자격증이 있어야 취업이 돼요\" ④ \"디자이너도 코딩은 필수라서 데이터 분석부터 배우는 거예요\" 📙 ai 에이전트 기초 과정 (10문항) q1. 〔두 개념 비교〕 일반 ai(챗gpt 등)와 ai 에이전트의 가장 본질적인 차이는? ① ai 에이전트는 이미지 생성에 특화되어 있다 ② 일반 ai는 더 비싼 서비스다 ③ 일반 ai는 답변만 제공하고 실행은 사람이 직접 하지만, ai 에이전트는 스스로 판단·실행·저장까지 자동 처리한다 ④ ai 에이전트는 인터넷 없이도 작동한다 q2. 〔개념 응용〕 ai 에이전트의 3대 핵심 요소 중 \"human in the loop\"가 반드시 필요한 이유는? ① ai 속도가 느려서 사람이 중간에 도와줘야 해서 ② 구독 비용 승인 절차가 필요해서 ③ ai가 스스로 실행하는 만큼 잘못된 판단이 자동 실행될 위험이 있으므로, 실행 전 인간의 최종 승인으로 안전을 확보하기 위해서 ④ ai가 언어를 이해 못 할 때를 대비해서 q3. 〔함정 포함〕 ai 에이전트 구현에 현재 가장 최적화된 모델로 강의에서 소개된 것은? ① 챗gpt (openai) ② 제미나이 (google) ③ 뤼튼 (wrtn) ④ 클로드 (anthropic) q4. 〔실무 시나리오〕 \"ai 에이전트한테 회사 내부 자료를 맡기면 개인정보가 유출될 것 같아서 못 쓰겠어요\" 라고 학생이 말했어요. 가장 적절한 응대는? ① \"맞아요, 회사 기밀은 절대 ai에 입력하면 안 돼요\" ② \"개인정보보호법을 준수하는 구조로 설계되어 있고, 해킹 외 일반 사용 범위에서는 위험이 낮아요. ai 활용 레벨이 올라갈수록 보안 관리 역량도 함께 성장해요\" ③ \"유료 플랜이면 완벽하게 보안이 보장돼요\" ④ \"걱정되시면 개인 자료를 가짜로 바꿔서 입력하시면 돼요\" q5. 〔두 개념 비교〕 코워크(cowork)와 챗gpt의 차이를 가장 정확하게 설명한 것은? ① 코워크는 이미지 생성 전용, 챗gpt는 텍스트 전용이다 ② 코워크는 ai 에이전트 기반 업무 자동화 플랫폼으로 반복 업무를 ai가 처리하도록 설계된 도구이고, 챗gpt는 대화형 ai로 답변 제공 후 실행은 사람이 한다 ③ 챗gpt가 코워크의 상위 서비스다 ④ 둘 다 구독 없이 무료로 사용 가능하다 q6. 〔개념 응용〕 \"ai 에이전트는 만능이라 무엇이든 완성물을 만들어준다\" 는 주장의 문제점은? ① 맞는 말이다. ai 에이전트는 실제로 모든 작업을 완성할 수 있다 ② ai 에이전트는 1차 소스 생성과 자동화에 강하지만, 실무 수준의 완성물은 후반 작업(사람의 판단·편집)이 반드시 필요하다 ③ ai 에이전트는 텍스트만 처리할 수 있어서 완성물 개념이 없다 ④ ai 에이전트를 쓰면 오히려 품질이 낮아진다 q7. 〔실무 시나리오〕 \"ai 에이전트 배우면 어떤 직종에서 쓸 수 있어요?\" 라고 학생이 물었어요. 가장 설득력 있는 응대는? ① \"주로 it 개발자나 데이터 분석가에게만 필요해요\" ② \"2026년까지 기업 앱의 40% 이상에 ai 에이전트 탑재가 전망돼요. 반복 업무가 있는 모든 직종에서 활용 가능하고, 모든 직원이 자율형 ai 비서를 운용하는 시대가 오고 있어요\" ③ \"유튜버와 프리랜서에게만 실질적으로 유용해요\" ④ \"아직 실무 도입 사례가 없어서 배워도 당장 쓰기 어려워요\" q8. 〔함정 포함〕 클로드(claude)가 ai 에이전트 실무에서 강점을 갖는 이유로 가장 정확한 것은? ① 챗gpt보다 훨씬 저렴해서 ② 구글 서비스와 연동이 잘 되어서 ③ 파일 생성·수정·저장을 자동 처리하고 할루시네이션이 상대적으로 낮아 실무 신뢰도가 높아서 ④ 이미지 생성 능력이 가장 뛰어나서 q9. 〔개념 응용〕 agi(범용 인공지능)로의 진화 방향과 ai 에이전트의 관계를 가장 잘 설명한 것은? ① agi는 ai 에이전트와 전혀 다른 별개의 기술이다 ② ai 에이전트는 스스로 문제 해결 경로를 탐색하고 목표를 완수하는 방향으로 발전하고 있으며, 이것이 agi로 가는 중간 단계다 ③ agi가 완성되면 ai 에이전트는 쓸모없어진다 ④ ai 에이전트는 agi보다 더 발전된 형태다 q10. 〔실무 시나리오〕 ai 에이전트 기초 과정을 마친 학생이 \"심화 과정도 들어야 하나요? 기초로 충분하지 않나요?\" 라고 물었어요. 가장 적절한 응대는? ① \"기초로 충분해요, 심화는 개발자용이에요\" ② \"기초는 개념·원리·cowork 활용까지예요. 심화에서는 클로드 코드로 실제 파이프라인을 직접 구축하고, 바이브코딩으로 자체 앱·웹 개발까지 연결해요. 목표가 '이해'냐 '직접 구현'이냐에 따라 달라요\" ③ \"심화 없이는 자격증을 못 따요\" ④ \"기초와 심화 내용이 겹치는 게 많아서 큰 차이 없어요\" 📕 ai 에이전트 심화 과정 (10문항) q1. 〔두 개념 비교〕 클로드(claude)와 챗gpt를 에이전트 실무 관점에서 비교한 것으로 가장 정확한 것은? ① 챗gpt가 파일 자동 처리와 에이전트 구현에 더 특화되어 있다 ② 클로드는 파일 생성·수정·저장을 자동 처리하고 할루시네이션이 상대적으로 낮지만 토큰 소모가 빠른 편이고, 챗gpt는 범용성과 대화 능력이 강점이다 ③ 두 모델은 동일한 llm을 기반으로 하므로 에이전트 성능이 같다 ④ 클로드는 텍스트 전용이라 파일 처리가 불가능하다 q2. 〔개념 응용〕 클로드 코드로 이메일 자동 발송 파이프라인을 구성할 때 올바른 실행 순서는? ① 이메일 발송 → 주소록 읽기 → yes/no 승인 ② yes/no 승인 → gmail_server.js 구동 → 주소록 읽기 → 발송 ③ 로컬 주소록 읽기 → gmail_server.js 구동 → yes/no 승인 루프 → 발송 실행 ④ gmail_server.js 구동 → 발송 → 사후 승인 확인 q3. 〔함정 포함〕 바이브코딩(vibe coding)에 대한 설명으로 가장 정확한 것은? ① 음악을 들으며 집중력을 높여 코딩하는 방법이다 ② 고급 개발자가 빠르게 코드를 최적화하는 기법이다 ③ 코딩 지식 없이 ai와 대화하며 코드를 작성·수정하는 방식으로, 기초/심화로 난이도가 나뉜다 ④ c4d에서 모션 그래픽을 제작하는 워크플로우다 q4. 〔실무 시나리오〕 바이브코딩으로 웹 페이지를 만들던 수강생이 \"ai가 뽑아준 코드가 이상한 것 같아요\"라고 했어요. 가장 적절한 응대는? ① \"ai 코드는 항상 정확하니 그냥 쓰세요\" ② \"기초 웹 지식이 없으면 바이브코딩은 불가능해요\" ③ \"처음부터 다시 만들어달라고 하는 게 제일 빨라요\" ④ \"오류 메시지나 이상한 부분을 ai에게 그대로 붙여넣고 원인과 수정 방법을 다시 물어보면 돼요. 이 디버깅 루프 자체가 바이브코딩의 핵심 과정이에요\" q5. 〔두 개념 비교〕 ai 에이전트 투트랙(트랙 a / 트랙 b)의 차이로 가장 정확한 것은? ① 트랙 a는 무료, 트랙 b는 유료다 ② 트랙 a는 코딩 전공자 전용, 트랙 b는 일반인 전용이다 ③ 공통 선수과목(16h)은 같지만, 트랙 a는 업무 자동화 실무 심화로, 트랙 b는 ai 웹 포트폴리오 개발로 분기된다 ④ 트랙 b를 먼저 이수해야 트랙 a로 진입할 수 있다 q6. 〔개념 응용〕 클로드 코드의 \"데이터 분석 → 보고서 자동 생성\" 파이프라인에서 사람이 반드시 개입해야 하는 시점은? ① 데이터 파일을 열기 전 ② 분석 알고리즘 코드를 직접 짜는 시점 ③ ai가 생성한 보고서 초안을 검수하고 최종 승인하는 시점 ④ 개입할 필요 없이 ai가 처음부터 끝까지 처리한다 q7. 〔실무 시나리오〕 \"ai 에이전트 심화까지 다 배우면 개발자가 되는 건가요?\" 라고 학생이 물었어요. 가장 정확한 응대는? ① \"네, 이 과정 수료하면 주니어 개발자로 취업 가능해요\" ② \"개발자가 되는 게 아니라, ai를 업무 파트너로 활용하는 역량을 갖추는 거예요. 코드를 직접 짜는 게 아니라 ai에게 코드를 짜게 하고 결과를 판단·검수하는 사람이 되는 과정이에요\" ③ \"개발자보다 훨씬 더 전문적인 직종이 돼요\" ④ \"코딩은 전혀 안 해도 되고 클릭만으로 앱을 만들 수 있어요\" q8. 〔함정 포함〕 기초 웹 지식(html/css 등)이 ai 에이전트 심화 과정에서 권장되는 이유는? ① 자격증 취득 조건이라서 ② 웹 지식이 없으면 수강 자체가 불가능해서 ③ ai가 생성한 코드를 이해하고 오류를 판별·수정 요청하는 데 기초 지식이 있으면 훨씬 정밀하게 활용할 수 있어서 ④ 어도비 프로그램 사용에 필요한 선수지식이라서 q9. 〔두 개념 비교〕 ai 파이프라인에서 \"ai 1차 소스 생성\"과 \"후반 작업\"의 역할 분담으로 가장 정확한 것은? ① ai가 후반 작업까지 완성하고, 사람은 최종 파일만 저장한다 ② ai는 초안·에셋·데이터 분석 등 1차 소스를 생성하고, 사람은 이를 검수·편집해서 실무 퀄리티로 완성한다 ③ 사람이 완성물을 먼저 만들고 ai가 수정·보완한다 ④ ai와 사람의 역할을 나눌 필요 없이 ai가 전부 처리한다 q10. 〔실무 시나리오〕 ai 에이전트 심화 수강생이 \"구글 드라이브를 거점으로 스마트폰에서도 pc 에이전트를 제어할 수 있다고 했는데, 실제로 가능한가요?\" 라고 물었어요. 가장 정확한 응대는? ① \"이론상으로만 가능하고 실제 구현은 전문 개발자만 할 수 있어요\" ② \"구글 드라이브를 거점으로 스마트폰·태블릿에서 pc 에이전트를 원격 제어하는 기기 연동은 클로드 코드 시연에서 실제로 소개된 기능이에요\" ③ \"클로드 코드는 인터넷 연결 없이만 작동해서 원격 제어가 불가능해요\" ④ \"구글 드라이브 유료 플랜에서만 가능한 기능이에요\""},"99_시스템/03_학과지식/AI학과_지식_통합본.md":{"t":"AI학과 지식 통합본","s":"","g":[],"d":"2026-08-09","f":"학과 지식","l":["99_시스템/03_학과지식/영업상담컨택_지식_통합본.md"],"h":"<h3>🤖 AI학과 지식 통합본</h3>\n<p>AI 학과 상담과 수업 안내에 필요한 지식을 한 문서에 모은 통합본이다. 학과 개요와 AI·LLM 기초 개념, AI 도구 총정리, 프롬프트에서 모션AI·학과별 연계·AI 에이전트로 이어지는 커리큘럼, 2026 트렌드, 취업 진로 로드맵, 상담 포인트, 수강료·구독 안내를 8개 절에 담았다. 9월 이후 과목명은 아래 개편 안내에 적힌 정본 문서를 먼저 확인한다.</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(AI프롬프트엔지니어링1,2→AI Core Foundation, AI에이전트웹·AI바이브코딩→AIX 바이브코딩, AI피그마→AIX 피그마). AI Core Foundation 커리큘럼은 [확인 필요] 상태. 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<blockquote>학과장 교육 (260213) + 사업부 설명회 (260212/260222) + 모션AI 교육노트 (260222) + 영상 AI크리에이터 성장 로드맵 통합 정리</blockquote>\n<blockquote>태그: #AI기초 #AI프롬프트 #AI활용 #AGI #AI에이전트 #업무자동화 #커리큘럼 #로드맵 #취업</blockquote>\n<hr>\n<h3>1. AI 학과 개요</h3>\n<h4>학과 설립 배경</h4>\n<ul><li>\n본원에 AI 관련 학과가 없다가 필요에 의해 <strong>약 2년 전부터 개설</strong>\n</li><li>\n기업에서는 원가 절감 + 시간 절약을 위해 개인에게 <strong>'AI 실무 역량'</strong>을 요구하고 있음\n</li><li>\nAI는 내가 다룰 수 있는 만능 무기! <strong>'선택'이 아닌 '필수'</strong> 지식\n</li></ul>\n<h4>핵심 철학</h4>\n<ul><li>\n<strong>AI는 거들 뿐</strong> → 기술 자체가 아닌, AI를 '다루는 법'을 배우는 것이 본질\n</li><li>\n&quot;딸깍 하나로 되는 거 없다&quot; → AI는 재료일 뿐, 결국 사람이 가공하고 편집해야 함\n</li><li>\n<strong>결국 '사람'이 만든다</strong> → 기초 지식이 핵심. AI는 재료를 만들어주지만, 오류를 잡고 편집해 완성물로 뽑아내려면 해당 분야의 기본기가 반드시 필요\n</li><li>\n<strong>편집 사고</strong> → 단순 툴 사용법보다 '콘텐츠 기획 및 편집적 사고'가 상위 개념\n</li></ul>\n<h4>학과 선택 가이드 (영상 계열)</h4>\n<ul><li>\n&quot;영상 제작 딥하게 하기 싫어!&quot; → <strong>유튜브 학과</strong> (Light / 기획 중심)\n</li><li>\n&quot;영상 제작 딥하게 해볼래!&quot; → <strong>모션 학과</strong> (Deep / 기술 중심)\n</li></ul>\n<h4>과목 정원 (학원 공지 260805)</h4>\n<ul><li>\n<strong>AI에이전트 수업: 대면 + 비대면 포함 총 정원 25명</strong>. 비대면은 정원 외가 아니라 25명 안에 포함된다.\n</li><li>\n정원 초과 시 추가 개강이 자동으로 잡히는 것이 아니다. 초과 인원 등록은 <a class=\"wl\" data-doc=\"99_시스템/03_학과지식/영업상담컨택_지식_통합본.md\">영업상담컨택_지식_통합본</a> 5-4 안내 절차를 따른다.\n</li></ul>\n<hr>\n<h3>2. AI / LLM 기초 개념</h3>\n<h4>LLM (거대 언어 모델)</h4>\n<ul><li>\nAI 엔진 중 하나로, 다음에 올 단어를 <strong>'확률적으로 예측'</strong>함\n</li><li>\n사실 여부보다 <strong>'말이 되는지'</strong>를 중시 → <strong>할루시네이션(Hallucination)</strong>이 일어나는 원인\n</li><li>\n사람들은 생각보다 AI를 '단순하게' 쓴다(지식인처럼) → 그러나 AI는 업무파트너/비서로 <strong>훨씬 더 많은 것</strong>을 해낼 수 있다\n</li></ul>\n<h4>멀티모달 (Multimodal)</h4>\n<ul><li>\n정보의 형태를 가리지 않음 → AI의 <strong>핵심 경쟁력이자 가장 중요한 트렌드</strong>\n</li><li>\n단순히 요구한 작업만 하는 것이 아닌, 연계된 다양한 작업을 수행\n</li><li>\nex) 번역하면서 문체의 성향이나 기분도 파악함\n</li></ul>\n<h4>AGI로의 진화</h4>\n<ul><li>\nAI가 스스로 문제 해결 방법을 찾고 목표를 완수하는 단계\n</li><li>\n인간 기획자가 24시간 걸릴 업무를 <strong>AI 에이전트는 30초에 완수</strong>\n</li></ul>\n<h4>주의할 점</h4>\n<ul><li>\n<strong>일관성 낮음:</strong> '구체적이고 명확하게' 기준을 제시하지 않으면 결과값이 제각각 → 프롬프트의 중요성\n</li><li>\n빠르게 발전하고 있어서 프롬프트 · 커리큘럼이 <strong>자주 바뀜</strong>\n</li></ul>\n<hr>\n<h3>3. AI 도구 총정리</h3>\n<div class=\"tw\"><table><thead><tr><th>도구</th><th>특징</th></tr></thead><tbody><tr><td><strong>챗GPT</strong></td><td>범용성 높고 대화능력 우수. 논리적·글쓰기 강함 (코딩, 번역, 기획안, 블로그 초안 등)</td></tr><tr><td><strong>제미나이</strong></td><td>구글 서비스 연동 (워크스페이스·검색·메일). 정보 최신성 우수. 긴 문서 요약·실시간 검색에 강함</td></tr><tr><td><strong>뤼튼</strong></td><td>다양한 생성형 AI를 한번에 모아둔 'AI 중개 플랫폼'. 입문용 추천. <strong>본원 MOU 체결</strong></td></tr><tr><td><strong>미드저니</strong></td><td>유료. 압도적 고퀄리티. 일러스트 제작·영감 얻기. 상업용 이미지 저작권 문제 없음</td></tr><tr><td><strong>스테이블 디퓨전</strong></td><td>오픈소스. 내 컴퓨터에 무료 설치·개조 가능 (공부 필요)</td></tr><tr><td><strong>컴파이</strong></td><td>스테이블 디퓨전 활용 인터페이스. 이미지 정밀 제어 (AI 아트웍 활용)</td></tr><tr><td><strong>나노바나나</strong></td><td>제미나이 전담 이미지 생성/수정 도구</td></tr><tr><td><strong>클로드코드</strong></td><td>컴퓨터에 직접 설치. 인터넷 없이 코드 파일 생성/실행/테스트 가능</td></tr><tr><td><strong>소라 (Sora)</strong></td><td>전문가급 영상 퀄리티. 현재 일반공개 제한적 (VIP 전용)</td></tr><tr><td><strong>Veo (베오)</strong></td><td>구글의 영상 AI. 베오2=숏폼 특화 / 베오3=롱폼 특화. Runway보다 텍스트 이해도·퀄리티 우세</td></tr><tr><td><strong>Runway</strong></td><td>현재 트렌드에서 Veo에 밀리는 추세</td></tr><tr><td><strong>감마</strong></td><td>주제만 던지면 PPT·문서 디자인까지 빠르게 생성. 급할 때 유용</td></tr><tr><td><strong>캔바</strong></td><td>다양한 템플릿 기반 쉬운 디자인 툴. 디자인 모르는 사람도 활용 가능</td></tr><tr><td><strong>어도비 센세이</strong></td><td>어도비 계열 프로그램 AI 작업 전담</td></tr><tr><td><strong>CapCut / Vrew</strong></td><td>영상 편집 AI 워크플로우 도구</td></tr><tr><td><strong>Leonardo AI / Suno / Recraft / Typecast</strong></td><td>영상·음악·이미지 생성 AI 보조 툴</td></tr></tbody></table></div>\n<h4>구독 전략</h4>\n<ul><li>\n강사 상담 후 <strong>필요한 것만</strong> 스마트하게 결정 (GPT+, Google Pro 등 강제 아님!)\n</li></ul>\n<hr>\n<h3>4. 커리큘럼 상세</h3>\n<h4>4-1. AI 프롬프트 과정</h4>\n<h5>프롬프트 1</h5>\n<ul><li>\n뤼튼, 챗GPT 원리/이론 습득, LLM 활용법 학습, 자격증 취득\n</li><li>\n제로샷 / 원샷 / 퓨샷 프롬프트 기법 연습\n</li><li>\n이론 설명 (할루시네이션 / 마크다운 프롬프트 등)\n</li><li>\n다양한 프롬프트 이론 학습 및 챗봇 제작\n</li><li>\n자격증 예상기출문제 풀이 및 다양한 기능 체험\n</li><li>\n<strong>취득 가능 자격증:</strong> AI POT / 뤼튼\n</li></ul>\n<h5>프롬프트 2</h5>\n<ul><li>\n미드저니 · 스테이블 디퓨전 · 나노바나나 등 응용 이미지 생성 ('통일성' 유지)\n</li><li>\n데이터분석 자동화\n</li><li>\n감마를 활용한 PPT 제작\n</li><li>\n스토리 제작/수정\n</li><li>\nAI 저작권 및 다양한 프로그램 소개\n</li></ul>\n<blockquote>프롬프트 1/2 수료 후 → <strong>학과별 AI과정 또는 학과 과정</strong>으로 유도</blockquote>\n<h4>4-2. 모션AI / 영상AI 커리큘럼 (단계별 전 과정)</h4>\n<h5>Phase 1 → 디자인 기초 및 소스 제작 (기초)</h5>\n<blockquote>선수과목 없음. 여기서 시작!</blockquote>\n<ul><li>\n<strong>포토샵 (Photoshop)</strong>: 평일/주말 1개월. 툴 기본 사용법 및 사진 보정\n</li><li>\n<strong>포토웍스 (심화)</strong>: 1개월. 심화 예제 및 고급 테크닉 훈련\n</li><li>\n<strong>일러스트레이터 (Illustrator)</strong>: 1개월. 벡터 이미지 편집 제작 기초\n</li><li>\n<strong>디일러 (심화)</strong>: 1개월. 일러스트 심화 활용 및 고급 테크닉\n</li><li>\n<strong>플랫 모션</strong>: 모션 그래픽 소스 제작 및 나만의 '그림체 만들기'\n</li><li>\n<strong>AI 프롬프트 1</strong>: 뤼튼·챗GPT 원리/이론, LLM 활용법, 자격증 취득 (AI POT/뤼튼)\n</li></ul>\n<h5>Phase 2 → 영상 입문 및 실전 편집 (Core)</h5>\n<blockquote>선수과목: Phase 1 (포토샵·일러스트) 이수 권장</blockquote>\n<ul><li>\n<strong>프리미어 실전</strong>: 1개월. 컷 편집, 자막 움직임, 영상 구성의 이해\n</li><li>\n<strong>에펙 (After Effects)</strong>: 1개월. <strong>영상 입문의 핵심이자 척도!</strong> 키프레임, 마스크, 매트 이해\n</li><li>\n<strong>모션 에펙 (실전+효과)</strong>: 1개월. 타이포그래피, 파티클 플러그인, Duik 캐릭터 애니메이션\n</li><li>\n<strong>AI 크리에이터 (유튜브 입문)</strong>: 1개월. <strong>영상 입문!</strong> Sora, Veo, CapCut, Vrew 활용 워크플로우 *(선수과목: AI 프롬프트 1 권장. 미이수 시 월담 체크리스트로 진입 가능)*\n</li></ul>\n<h5>Phase 3 → 심화 기술 및 3D 모션 (Advanced)</h5>\n<blockquote>선수과목: Phase 2 전 과정 이수 필수</blockquote>\n<ul><li>\n<strong>어드밴스 에펙 1/2</strong>: 각 1개월. 고난도 영상 합성 및 Realflow 시뮬레이션 이해\n</li><li>\n<strong>C4D (Cinema 4D) 1/2/3</strong>: 각 1개월. Mograph, Dynamics, Octane 렌더러 활용 3D 모션\n</li><li>\n<strong>AI 심화 (생성형 AI)</strong>: Runway, Veo 활용 고도화 영상 제작 *(선수과목: AI 프롬프트 1·2 + 어도비 계열 필수)*\n</li><li>\n<strong>AI CG/모션그래픽</strong>: AI 생성 소스를 에펙으로 합성하거나 C4D 렌더링을 AI에 요청. 어도비 센세이 실전 활용 *(선수과목: 일러·포샵·프리미어·에펙·C4D 전부 필수)*\n</li><li>\n<strong>콘텐츠 크리에이터</strong>: 1개월. 유튜브 기획, 수익 모델 분석, 구독자 증대 전략 *(AI 유튜브 과정과 목적 다름: AI 활용 vs 채널 성장 전략)*\n</li><li>\n<strong>유튜브 크리에이터 (심화)</strong>: 1개월. 개별 채널 컨설팅, 촬영 및 편집 심화\n</li></ul>\n<h5>Phase 4 → 마무리의 꽃 (Portfolio)</h5>\n<blockquote>선수과목: Phase 1~3 중 본인 트랙 완료 후 진입</blockquote>\n<ul><li>\n<strong>2D/3D 모션 포트폴리오</strong>: 2~3개월. 개별 프로젝트 관리 및 취업용 포폴 제작\n</li></ul>\n<h4>4-3. 학과별 AI 연계 과정</h4>\n<h5>AI 시각편집/아트웍 → '나만의 워크플로우' 만들기</h5>\n<ul><li>\n컴파이(런디퓨전) 사용으로 일관성 유지하며 이미지 생성\n</li><li>\n브랜딩 기획부터 시각화 / 버츄얼·캐릭터·실사 일러스트 / 스톡 판매용 이미지 / 3D 디자인\n</li><li>\n포토샵·일러스트 병행 활용\n</li><li>\n<strong>루트:</strong> 아트웍기초 → AI기초 → 학과기초 → AI 아트웍 → 포폴\n</li></ul>\n<h5>AI 웹 → AI 네이티브가 되자!</h5>\n<ul><li>\n클로드코드 활용 바이브코딩 스킬 훈련\n</li><li>\n코딩 작업 속도 향상 / 자체 앱·웹 개발 / 업무자동화 구현 / 개발 프로세스 경험\n</li><li>\n웹학과는 AI과정 <strong>필수</strong> / 기초 웹 지식 있을수록 더 잘 활용 가능\n</li></ul>\n<h5>AI 인테리어 → AI는 '파트너'다</h5>\n<ul><li>\n클로버노트·뤼튼 등 활용\n</li><li>\n아이디어 구상 → 도면 기반 시각화 → 이미지 실사화 → 제안서·콘텐츠 제작 및 검토\n</li><li>\n인테리어 기획 특화 과정: 속도 + 완성도 동시 습득 가능\n</li><li>\n<strong>선수강 필수:</strong> 설계/인테리어 기초 + AI 기초\n</li></ul>\n<h5>AI 유튜브 → 더 빠르고, 더 쉽게!</h5>\n<ul><li>\n기획-제작-퍼블리싱-분석 실습. AI를 활용한 스토리텔링과 창의성 결합\n</li><li>\n남들처럼 &quot;딸깍&quot;만 해서는 수익 안 남 → 유튜브는 AI 콘텐츠 '투명성' 정책 계속 업데이트 중\n</li><li>\n활용 툴: 제미나이, GPT, 소라, 나노바나나, 구글 플로우, 베오2/3, 캡컷, 브루\n</li><li>\nAI로 영상 제작 반복 + 실습 → 직접 콘텐츠를 만들어보는 경험 쌓기\n</li><li>\n<strong>루트:</strong> AI기초 → AI유튜브 → 유튜브 정규과정 → 유튜브 포폴\n</li><li>\n<strong>시니어 상담 근거(260809 추가, 출처 이소라 대표 AIX 세미나):</strong> 유튜브 주 시청층은 40~50대이며 60~70대도 다수, 인스타그램은 10~30대. 시니어가 시니어 시청층 채널을 만드는 것이 타깃 적합도에서 유리하다는 논리로 사용. 같은 강연에서 얼굴 노출 없이 AI 캐릭터로 운영해 27만 구독자와 광고 협업 20건 이상을 만든 사례가 있어, 노출 부담을 이유로 망설이는 시니어 상담에 함께 쓴다. 수치는 강연 인용임을 밝히고 본원 실적처럼 말하지 않는다. 원문은 99_시스템\\업무기록\\260809_AIX세미나_보고서.md\n</li></ul>\n<h5>AI CG/모션그래픽 → 손 많이 가는 작업 외주 맡기기</h5>\n<ul><li>\nAI로 생성한 소스를 에펙으로 합성하거나 C4D로 만든 작업물 렌더링을 AI에게 요청\n</li><li>\n<strong>선수강 필수:</strong> 일러, 포샵, 프리미어, 에펙, 시포디\n</li></ul>\n<h4>4-4. AI 에이전트 과정 (투트랙 로드맵, 총 32시간)</h4>\n<pre><code>공통 선수과목: 프롬프트 엔지니어링 + AI 에이전트 기초 (16h)\n                        ↓\n     ┌─────────────────────────────────┐\n  트랙 A (대중/직장인)          트랙 B (웹 개발 전문)\n  AI 에이전트 심화 (16h)       AI 웹 포트폴리오 연계</code></pre>\n<ul><li>\n<strong>콜럼버스 전략:</strong> 웹 학과 먼저 도입·검증 후 전 영역 확장 예정\n</li><li>\n<strong>월담 수강:</strong> 선수과목 미이수자도 체크리스트 통과 시 심화 즉시 진입 가능\n</li><li>\n<strong>바이브코딩:</strong> 기초/심화로 난이도 세분화 (코딩 문외한도 가능)\n</li></ul>\n<hr>\n<h3>5. AI 트렌드</h3>\n<h4>2026 트렌드 전망</h4>\n<ul><li>\n가트너·포브스: 2026년까지 기업 앱 <strong>40% 이상 AI 에이전트 탑재</strong> 전망\n</li><li>\n모든 직원이 자율형 AI 비서를 운용하는 시대\n</li><li>\n<strong>가디언 에이전트 필수화:</strong> 미니 PC 대중화 → 로컬 데이터 유출 위험 증가 → AI 행동 실시간 감시 필수\n</li><li>\n<strong>저사양 대중화:</strong> 무거운 연산은 클라우드 처리 → 20만원대 미니 PC에서도 구동 가능\n</li></ul>\n<h4>AI 에이전트 3대 핵심 요소</h4>\n<ul><li>\n<strong>판단 (Reasoning)</strong> → 목표 달성 경로를 스스로 탐색\n</li><li>\n<strong>도구 사용 (Tool Use)</strong> → 외부 기능 활용\n</li><li>\n<strong>안전 (Human-in-the-loop)</strong> → 실행 전 인간의 최종 승인\n</li></ul>\n<h4>클로드 코드 시연 주요 기능 (v2.1.49 / Node.js 기반 CLI)</h4>\n<ul><li>\n<strong>이메일 자동 발송</strong> → 로컬 주소록 읽기 → gmail_server.js 구동 → Yes/No 승인 루프로 안전 확인\n</li><li>\n<strong>데이터 분석</strong> → sales_data.csv 실시간 분석 → 보고서 초안 자동 생성\n</li><li>\n<strong>시스템 정리</strong> → taskkill 명령어로 불필요한 프로세스 5개 자동 종료\n</li><li>\n<strong>기기 연동</strong> → 구글 드라이브 거점으로 스마트폰·태블릿에서 PC 에이전트 원격 제어 가능\n</li></ul>\n<h4>영상 AI 최신 툴 트렌드</h4>\n<ul><li>\n<strong>Veo vs Runway</strong> → 현재 Veo의 텍스트 이해도 및 영상 생성력 우세 판단. Runway는 트렌드에서 밀리는 추세\n</li><li>\n<strong>Adobe Sensei</strong> → 프리미어·에펙 내 어도비 자체 AI 기능 적극 활용 → 작업 효율 극대화\n</li><li>\n<strong>AI 숏폼 콘텐츠의 압도적 성장</strong> → AI 활용으로 숏폼 제작 진입장벽 급락\n</li></ul>\n<hr>\n<h3>6. 취업 / 진로 로드맵</h3>\n<h4>필승 취업 전략</h4>\n<ul><li>\n<strong>형태(CG) + 질감(서페이싱) + 움직임(모션)</strong>: 3가지가 합쳐져야 진정한 고품질 영상 탄생\n</li><li>\n<strong>AI(생산성) + 인간(디테일)</strong>: AI로 시간(컷 편집, 자막, 초안)을 벌고, 에펙과 고급 툴 활용으로 차별화된 퀄리티 확보\n</li></ul>\n<h4>영상 크리에이터 취업 루트 요약</h4>\n<div class=\"tw\"><table><thead><tr><th>트랙</th><th>루트</th><th>목표</th></tr></thead><tbody><tr><td>AI 유튜브</td><td>AI기초 → AI유튜브 → 유튜브 정규 → 포폴</td><td>유튜브 채널 운영·수익화</td></tr><tr><td>모션 그래픽</td><td>디자인기초 → 에펙 → 어드밴스 → C4D → 포폴</td><td>영상 제작사·방송국 취업</td></tr><tr><td>AI 아트웍</td><td>아트웍기초 → AI기초 → 학과기초 → AI아트웍 → 포폴</td><td>스톡 판매·브랜딩</td></tr><tr><td>AI 웹</td><td>웹기초 → AI기초 → 바이브코딩 → 포폴</td><td>앱·웹 개발·업무자동화</td></tr></tbody></table></div>\n<h4>직종별 AI 실무 역량 요구 현황</h4>\n<ul><li>\n기업: 원가 절감 + 시간 절약 → 개인에게 AI 실무 역량 요구\n</li><li>\n2026년 기준: 기업 앱 40% 이상 AI 에이전트 탑재 전망\n</li></ul>\n<hr>\n<h3>7. 상담 포인트</h3>\n<h4>본원 어필 포인트</h4>\n<ul><li>\n<strong>국내 유일 오프라인 수업</strong> → 실시간 코칭 가능\n</li><li>\n<strong>프롬프트 예시 제공</strong> → 실전 바로 적용 가능\n</li><li>\n<strong>대표 AI 한번에 체험</strong> → 뤼튼, 챗GPT, 미드저니 등 주요 AI 원스톱 경험\n</li><li>\n<strong>뤼튼 MOU 체결</strong> → 공식 파트너십 보유\n</li></ul>\n<h4>학과 선택별 상담 가이드</h4>\n<ul><li>\n코딩 경험 없음 + 영상에 관심 → 유튜브 학과 또는 AI 크리에이터부터\n</li><li>\n영상 제작 깊이 하고 싶다 → 모션 학과 (에펙 → C4D 루트)\n</li><li>\n디자인 + AI 결합 원한다 → AI 아트웍 루트 (컴파이 활용)\n</li><li>\n웹 개발 + AI 자동화 원한다 → AI 웹 루트 (클로드코드 바이브코딩)\n</li><li>\n인테리어 분야 종사자 → AI 인테리어 (설계/인테리어 기초 선수강 필수)\n</li></ul>\n<h4>수강 순서 주의사항</h4>\n<ul><li>\n<strong>월담 수강 가능:</strong> 선수과목 미이수자도 체크리스트 통과 시 심화 즉시 진입 가능\n</li><li>\n<strong>프롬프트 1 → 2 순서 중요:</strong> 1 이수 후 학과별 AI 과정 또는 학과 과정으로 유도\n</li><li>\n<strong>AI CG/모션은 선수과목 전부 필수:</strong> 미이수 시 수강 불가 원칙\n</li></ul>\n<hr>\n<h3>8. 수강료 및 구독 관련</h3>\n<h4>구독 전략 (강사 안내 사항)</h4>\n<ul><li>\n강사 상담 후 <strong>필요한 것만</strong> 스마트하게 결정\n</li><li>\nGPT Plus, Google One Pro 등 → 강제 구독 아님\n</li><li>\n어떤 구독이 필요한지 상담 시 함께 결정\n</li></ul>\n<blockquote>※ 구체적인 수강료 금액 정보는 현재 문서에 미기재. 별도 확인 필요.</blockquote>\n<hr>\n<p>*최종 업데이트: 2026-02-28*</p>","x":"🤖 ai학과 지식 통합본 ai 학과 상담과 수업 안내에 필요한 지식을 한 문서에 모은 통합본이다. 학과 개요와 ai·llm 기초 개념, ai 도구 총정리, 프롬프트에서 모션ai·학과별 연계·ai 에이전트로 이어지는 커리큘럼, 2026 트렌드, 취업 진로 로드맵, 상담 포인트, 수강료·구독 안내를 8개 절에 담았다. 9월 이후 과목명은 아래 개편 안내에 적힌 정본 문서를 먼저 확인한다. aix 커리큘럼 개편(2026 09~) 적용 예정. 9월 이후 개강·상담은 aix_커리큘럼개편_260715 을 정본으로 우선 확인할 것(ai프롬프트엔지니어링1,2→ai core foundation, ai에이전트웹·ai바이브코딩→aix 바이브코딩, ai피그마→aix 피그마). ai core foundation 커리큘럼은 확인 필요 상태. 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨. 학과장 교육 (260213) + 사업부 설명회 (260212/260222) + 모션ai 교육노트 (260222) + 영상 ai크리에이터 성장 로드맵 통합 정리 태그: ai기초 ai프롬프트 ai활용 agi ai에이전트 업무자동화 커리큘럼 로드맵 취업 1. ai 학과 개요 학과 설립 배경 본원에 ai 관련 학과가 없다가 필요에 의해 약 2년 전부터 개설 기업에서는 원가 절감 + 시간 절약을 위해 개인에게 'ai 실무 역량' 을 요구하고 있음 ai는 내가 다룰 수 있는 만능 무기! '선택'이 아닌 '필수' 지식 핵심 철학 ai는 거들 뿐 → 기술 자체가 아닌, ai를 '다루는 법'을 배우는 것이 본질 \"딸깍 하나로 되는 거 없다\" → ai는 재료일 뿐, 결국 사람이 가공하고 편집해야 함 결국 '사람'이 만든다 → 기초 지식이 핵심. ai는 재료를 만들어주지만, 오류를 잡고 편집해 완성물로 뽑아내려면 해당 분야의 기본기가 반드시 필요 편집 사고 → 단순 툴 사용법보다 '콘텐츠 기획 및 편집적 사고'가 상위 개념 학과 선택 가이드 (영상 계열) \"영상 제작 딥하게 하기 싫어!\" → 유튜브 학과 (light / 기획 중심) \"영상 제작 딥하게 해볼래!\" → 모션 학과 학과장 설명회 기준 선이수 없이 진입 가능(스케치업 기초 포함)하나, 포트폴리오 활용 목적이면 ② 3D 모델링 &amp; 렌더링 선이수 필수. 단 NAS 홍보소개자료 PDF는 &quot;과목 2 선이수 기준 설계·36H&quot;로 표기되어 상충(아래 확인 필요 4번).\n</li><li>\n파운데이션: AIX 코어 파운데이션(개발 중, 개발 전까지 기존 AI 프롬프트 엔지니어링으로 대체 운영) / AIX 디자인 파운데이션 16H(2H×8D) / AIX 포토 24H(3H×8D) / AIX 일러 24H(3H×8D).\n</li><li>\n버추얼(CG) 스튜디오는 개편 준비 중. 마야 제외, 언리얼·블렌더·스테이블디퓨전 ComfyUI 결과물 중심으로 과정명·커리큘럼 변경 예정.\n</li><li>\n프로젝트반: AI Digital Art &amp; Drawing / 웹툰 &amp; AI 어시스트. 기존 드로잉·웹툰 수업은 개별 포폴 수업으로 프로젝트에 직행. 인터랙티브 프로젝트반은 60H·정원 6~10명.\n</li></ul>\n<h4>모듈별 시수·수강료 (통합로드맵 V1 수강료 탭)</h4>\n<p>총 수강료 = 월 수강료 × 운영개월.</p>\n<div class=\"tw\"><table><thead><tr><th>스튜디오</th><th>과정명</th><th>시수</th><th>편성</th><th>개월</th><th>월 수강료</th><th>총 수강료</th></tr></thead><tbody><tr><td>파운데이션</td><td>AIX 디자인 파운데이션</td><td>16H</td><td>2H×8D</td><td>1</td><td>50만*</td><td>50만*</td></tr><tr><td>파운데이션</td><td>AIX 포토</td><td>24H</td><td>3H×8D</td><td>1</td><td>50만</td><td>50만</td></tr><tr><td>파운데이션</td><td>AIX 일러</td><td>24H</td><td>3H×8D</td><td>1</td><td>50만</td><td>50만</td></tr><tr><td>미디어</td><td>AIX 마케팅영상</td><td>24H</td><td>3H×8D</td><td>1</td><td>50만</td><td>50만</td></tr><tr><td>미디어</td><td>유튜브 올인원클래스</td><td>32H</td><td>2H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>미디어</td><td>실전 영상편집 클래스</td><td>24H</td><td>3H×8D</td><td>1</td><td>50만</td><td>50만</td></tr><tr><td>미디어</td><td>2D 모션 디자인 클래스</td><td>48H</td><td>3H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>인터랙티브</td><td>AIX 피그마</td><td>90H</td><td>3H×10D×3M</td><td>3</td><td>50만</td><td>150만</td></tr><tr><td>인터랙티브</td><td>AIX 바이브코딩</td><td>90H</td><td>3H×10D×3M</td><td>3</td><td>60만</td><td>180만</td></tr><tr><td>인터랙티브</td><td>AIX 에이전트 업무자동화</td><td>48H</td><td>2H×8D×3M</td><td>3</td><td>60만</td><td>180만</td></tr><tr><td>인터랙티브</td><td>AIX 이커머스 창업</td><td>24H</td><td>3H×8D</td><td>1</td><td>60만</td><td>60만</td></tr><tr><td>그래픽</td><td>AIX 프라이빗 마케팅 클래스</td><td>32H</td><td>2H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>그래픽</td><td>AIX 디지털 출판 실무</td><td>32H</td><td>2H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>그래픽</td><td>AIX 패키지 &amp; 굿즈 제작 실무</td><td>48H</td><td>3H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>그래픽</td><td>AIX 브랜딩 디자인 실무</td><td>48H</td><td>3H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>스페이스</td><td>AIX 공간기획 &amp; 인테리어 설계</td><td>48H</td><td>3H×8D×2M</td><td>2</td><td>45만</td><td>90만</td></tr><tr><td>스페이스</td><td>AIX 3D 모델링 &amp; 렌더링</td><td>90H</td><td>3H×10D×3M</td><td>3</td><td>60만</td><td>180만</td></tr><tr><td>스페이스</td><td>BIM 기초 &amp; AIX 활용</td><td>64H</td><td>4H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr><tr><td>스페이스</td><td>AIX 공간VR시각화</td><td>48H</td><td>3H×8D×2M</td><td>2</td><td>50만</td><td>100만</td></tr></tbody></table></div>\n<p>\\* AIX 디자인 파운데이션 50만은 V1 수강료 탭에 없는 값을 260822에 다른 자료로 채운 것이다. 근거 세 가지가 같은 금액을 가리킨다. ① 가격 정본 <a class=\"wl\" data-doc=\"01_안내용자료/수강료_안내.md\">수강료_안내</a> 아트웍 표의 구과목 <code>발상과표현(1,2)/A,B</code>·<code>색채학(1,2)/A,B</code>가 둘 다 격일 2H×8D·16H·500,000원으로, 신설 모듈의 편성(16H·2H×8D)과 완전히 같다. ② <code>99_시스템\\03_학과지식\\수강료모음202605김범수에디션.XLSX</code>(강남본원 수강료표)도 발상과표현·색채학을 각 1개월 500,000원으로 적는다. ③ 16H·50만은 시간당 31,250원으로, V1 표에 이미 들어 있는 AIX 프라이빗 마케팅 클래스(32H·100만)와 단가가 같다. 다만 두 구과목을 하나로 합치면서 시수가 32H에서 16H로 줄어든 개편이므로, 금액 승계인지 재산정인지는 사업부 확정 전까지 단정하지 않는다. 견적 발행 전 팀장 확인 대상이다.</p>\n<p><strong>구버전 설명자료와의 값 차이(260822 실측).</strong> 위 출처 줄이 짚은 구버전 <code>AIX강남_모듈개편_통합_설명자료_260721.html</code>(260721 14:14)의 수강료 탭을 V1(260728 09:15)과 전량 대조한 결과다. 데스크톱에 이 파일이 남아 있어 상담 중 열릴 수 있으므로 어긋나는 값을 적어 둔다.</p>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>로드맵 V1 (260728, 정본)</th><th>설명자료 (260721, 구버전)</th></tr></thead><tbody><tr><td>AIX 디지털 출판 실무</td><td>32H · 2개월 · 월 50만 · 총 100만</td><td>30H · 1개월 · 월 50만 · 총 50만</td></tr><tr><td>AIX 3D 모델링 &amp; 렌더링</td><td>90H · 3개월 · 월 60만 · 총 180만</td><td>72H · 3개월 · 월 50만 · 총 150만</td></tr></tbody></table></div>\n<p>구버전 수강료 탭은 15개 과정뿐이라 BIM 기초 &amp; AIX 활용(64H·100만)과 AIX 공간VR시각화(48H·100만)가 없다. 스페이스 문의를 구버전으로 응대하면 4과목 중 2과목을 빠뜨린다. 나머지 13개 과정 값은 두 판이 같다.</p>\n<h4>구과목 → 신과목 매핑</h4>\n<p>미디어 컨텐츠(영상모션)</p>\n<ul><li>\n마케팅영상 방특 → AIX 마케팅영상 24H (신설·정규화)\n</li><li>\n유크리 기초·심화 + 컨텐츠크리에이터 → 유튜브 올인원클래스 32H (통합·개편)\n</li><li>\n프리미어 + 애프터이펙트 기초 → 실전 영상편집 클래스 24H (개편)\n</li><li>\n에펙 + 모션에펙 → 2D 모션 디자인 클래스 48H (통합·개편)\n</li></ul>\n<p>인터랙티브(웹)</p>\n<ul><li>\nAI UX UI Figma Studio(8주) + Figma Masterclass(4주) → AIX 피그마 90H (통합·재배치)\n</li><li>\nAI 바이브코딩 웹(16H) → AIX 바이브코딩 90H (확장·개편)\n</li><li>\n클로드코드(에이전트) 기초 8일 + 심화 8일 → AIX 에이전트 업무자동화 48H (흡수·개편)\n</li><li>\n신설 → AIX 이커머스 창업 24H\n</li><li>\nHTML/CSS/JS·웹1·2·3 → 폐지 아님. 계열 공통 비대면 선택형 보충으로 잔존·재배치\n</li></ul>\n<p>그래픽 &amp; 브랜딩(시각편집)</p>\n<ul><li>\n방과후특강 비주얼디자인 → AIX 프라이빗 마케팅 클래스 32H (정규 과정화)\n</li><li>\n인디자인 → AIX 디지털 출판 실무 32H (개편)\n</li><li>\n패키지 MD → AIX 패키지 &amp; 굿즈 제작 실무 48H (개편)\n</li><li>\n브랜딩 → AIX 브랜딩 디자인 실무 48H (개편)\n</li><li>\nAIX One-pass 2D 그래픽 마스터 → 폐지\n</li></ul>\n<p>스페이스(인테리어)</p>\n<ul><li>\n캐드 1·2 + 스케치/이론·실내건축이론 → AIX 공간기획 &amp; 인테리어 설계 48H (개편·확대)\n</li><li>\n스케치업 1·2·포폴 + 맥스 1·2·3 + 엔스케이프 → AIX 3D 모델링 &amp; 렌더링 90H (통합·확대)\n</li><li>\nBIM 레빗 1·2 → BIM 기초 &amp; AIX 활용 64H (개편)\n</li><li>\nAI 크리에이터 인테리어 → AIX 공간VR시각화 48H (개편·확대)\n</li><li>\n인테리어 포폴 → 인테리어 프로젝트반\n</li><li>\n실내건축 자격증·CAT·전산응용건축/기계제도·라이노·인벤터 → 별도 라인 존치·병행\n</li></ul>\n<p>공통 파운데이션</p>\n<ul><li>\nAI 프롬프트 엔지니어링 1·2 → AIX 코어 파운데이션 (공통 승격, 커리큘럼 개발 중)\n</li><li>\n발상과 표현 + 색채학 → AIX 디자인 파운데이션 16H\n</li><li>\n포토샵 + 포토웍스 → AIX 포토 24H\n</li><li>\n일러스트 + 디테일 일러스트 → AIX 일러 24H\n</li></ul>\n<h4>운영 형태·정원 (상담 시 자주 묻는 항목)</h4>\n<ul><li>\nAIX 프라이빗 마케팅 클래스, AIX 디지털 출판 실무: 격일반(2H×16일) 또는 금요반(4H×8일) 중 선택.\n</li><li>\nAIX 패키지 &amp; 굿즈 제작 실무, AIX 브랜딩 디자인 실무: Day1~2 공통 이론·기획 → Day3~5 분반(미경험자/선수강자) → Day6~16 합류 실무. 포토샵·일러스트 미경험자와 선수강자가 같은 반에서 수강 가능.\n</li><li>\nAIX 피그마: 정원 15~20명. AIX 바이브코딩: 정원 12명, 오류 1:1 대응 소수정예. AIX 에이전트 업무자동화: 정원 12명, 플립러닝. 인터랙티브 프로젝트반: 정원 6~10명.\n</li><li>\nAIX 이커머스 창업: 수강 기간 내 첫 매출을 목표로 하는 실전형.\n</li><li>\n스페이스 전공 4과목: 전부 해당 소프트웨어 미경험자 기준으로 재설계. 과목 종료 시 Live Brief로 납품 수준 결과물 완성.\n</li><li>\n인터랙티브 공통 운영비율: 개념 20% / 시연 10% / 실습 50% / 피드백·오류해결 20%.\n</li><li>\n주말반 시간표: 260729 원장 공지, 9월 개강분부터 전 주말반 10시 시작으로 통일(예외 없음).\n</li><li>\n주말 AIX: 260729 원장 공지, 6주 과정으로 운영 예정(대상 모듈 범위 [확인 필요]).\n</li></ul>\n<h4>스페이스 운영 상세 (260811 학과장 설명회, 정리 정본은 <span class=\"wl off\">260811_인테리어_모듈개편_설명회_보고서</span>)</h4>\n<ul><li>\n모듈 2(3D 모델링 &amp; 렌더링)는 A·B 트랙 구분: A=SketchUp 심화+V-Ray+Enscape+D5, B=A 렌더러 전부+3ds Max·Max V-Ray. 시수 동일 각 90H(설명회 발언). 요일 A/B 패턴 표기와 무관.\n</li><li>\n전 모듈 격일반만 운영(매일반 없음)·1회 3H·기수제(중간 투입 불가, 경험자도 처음부터). 9월부터 저녁반 한정 시작(모듈 1부터). 진행 중 단과 기수는 종강까지 기존 체제 유지(8월 캐드1 저녁 진입 시 9월 캐드2 개설 보장, 이후 10월 모듈 진입).\n</li><li>\n실내건축 자격증(기능사·산업기사·기사 공통) 대비반 선수 = 모듈 1 + 모듈 2A(Max 불요).\n</li><li>\n전 모듈 수료 후 포폴반 배정(모듈 3·4는 직군별 선택). 포폴반만 비대면 불가, 나머지는 비대면·녹화본 운영.\n</li><li>\n구독: 챗GPT·미드저니 필수(모듈 3 제외), 감마·캔바 무료판만, D5 무료, Krpano 소액 가능.\n</li><li>\nAI 자동 도면(도면 생성·스케치업 연동) 수업 신설 예정(원장 협의 완료, 시기 [확인 필요]).\n</li><li>\n시수 상충은 아래 확인 필요 4번 참조. 학과장 확인 전 시수 확정 안내 금지.\n</li></ul>\n<h4>모듈별 완성 결과물 (상담 소구 문구)</h4>\n<ul><li>\nAIX 마케팅영상: 웹용 AI 영상 콘텐츠 + 브랜드 광고 영상·캠페인 기획 (촬영 장비 없이 AI 툴만으로 제작)\n</li><li>\n유튜브 올인원클래스: 숏폼 콘텐츠 + 유튜브 채널 기획·운영 계획 (스마트폰 촬영·CapCut)\n</li><li>\n실전 영상편집 클래스: 브이로그·인터뷰·정보·홍보 등 콘텐츠 유형별 완성 영상\n</li><li>\n2D 모션 디자인 클래스: 로고 애니메이션·브랜드 모션 + 모션그래픽 예제\n</li><li>\nAIX 피그마: 디자인 시스템 + 핵심 화면 + 클릭 프로토타입 (Figma MCP로 코드화 가능 상태 마감)\n</li><li>\nAIX 바이브코딩: 로그인·CRUD가 작동하는 실제 배포 URL 서비스 + README + 발표\n</li><li>\nAIX 에이전트 업무자동화: 내 업무에 실제로 도는 자동화 시스템 1식\n</li><li>\nAIX 이커머스 창업: 운영 중인 스토어 + 수강 기간 내 첫 매출 경험\n</li><li>\nAIX 프라이빗 마케팅 클래스: SNS 콘텐츠 풀세트 + 브랜드 에셋 풀세트(로고·컬러·폰트·명함·굿즈 시안·미니 브랜드북)\n</li><li>\nAIX 디지털 출판 실무: 리플렛·브로슈어·매거진 중 택1 편집출판물 (인터랙티브 PDF·전자책 변환 포함)\n</li><li>\nAIX 패키지 &amp; 굿즈 제작 실무: 입체 상품 박스(패키지) + 브랜드 굿즈\n</li><li>\nAIX 브랜딩 디자인 실무: BI 로고 + 컬러·서체 가이드 + 브랜드 비주얼 가이드북\n</li><li>\nAIX 공간기획 &amp; 인테리어 설계: AutoCAD 도면세트(평면·입면·천장) + AI 컨셉 이미지 3장 + 제안 PPT 10장 이상\n</li><li>\nAIX 3D 모델링 &amp; 렌더링: 주거(2LDK) 렌더링 3컷 + 소형 상업 공간 렌더링 2컷 이상\n</li><li>\nBIM 기초 &amp; HTML\\AIX강남_모듈개편_통합_설명자료_260721.html</code>(260805 데스크톱 원본을 볼트로 복사, 이 경로가 정본). 탭 6개(전체 로드맵 / 수강료 / 미디어 컨텐츠 / 그래픽 &amp; 브랜딩 / 인터랙티브 / 스페이스) 구성, 단일 HTML이라 무설치로 열린다. 사업부 설명용이며 학생 대면 배포물이 아니다.\n</li></ul>\n<p>자료에서 확인된 보강 내용</p>\n<ul><li>\nAIX 바이브코딩: 90H·30회차(3H 회차, 월 10회 기준 약 3개월)로 위 표와 일치. 결과물 6종 = 기획서·기능정의서·CLAUDE.md / 실제 페이지 5개 + 반응형 / Supabase CRUD + 로그인 인증 / Vercel 배포 URL / GitHub 저장소·README / 엔드투엔드 결과물. 사용 도구 = Claude Code·Cursor·GitHub·Vercel·Supabase(피그마 병행 시 Figma MCP). 진입 조건 = 코딩 무경험 가능, 피그마 미수강자는 학원 제공 템플릿으로 시작. 운영비율 개념 20 / 시연 10 / 실습 50 / 피드백 20으로 인터랙티브 공통과 동일. 수강료는 자료에 미기재.\n</li><li>\nAIX 피그마(260820 랜딩 전면 확인분으로 갱신): 90시간·<strong>12주</strong>·4단계(이론 → 피그마 실습 → 생성 AI 활용 → 프로젝트 실습)·실전 프로젝트 9개. 종전 기재 &quot;13주&quot;는 구 랜딩 기준이므로 폐기하고 12주를 쓴다. 위 표 &quot;3H×10D×3M(30회)&quot;와 회차 기준 정합.\n<ul><li>\nMonth 1 기초: 1주 UX/UI+Figma 기초(펜 툴·Iconify·Magician, 실습=이케아 앱 페인포인트 분석+커스텀 아이콘 셋) / 2주 타이포그래피(텍스트 스타일·로컬 변수·MagiCopy) / 3주 컬러(WCAG 2.2·Color Variables·Contrast AI, 실습=시맨틱 컬러 시스템) / 4주 그리드·레이아웃(오토 레이아웃·Breakpoints·Figma AI First Draft)\n</li><li>\nMonth 2 실무: 5주 Wireframe·기획·IA(사이트맵·FigJam·Relume AI) / 6주 Music App 제작(고급 오토레이아웃·LottieFile) / 7주 배너·홍보영상(AIDA 모델·숏폼 스토리보드·생성형 에셋) / 8주 IKEA 반응형 랜딩페이지(Hi-Fi 프로토타입·12/4 컬럼 그리드)\n</li><li>\nMonth 3 프로젝트: 9주 모바일 앱 개인화 서비스(Properties/Variants·수평 스크롤) / 10주 커머스 상세페이지·배너 UI(Sticky CTA·리뷰 필터·Relume AI·Stitch) / 11주 디자인 시스템 구축(Semantic Color·중첩 오토레이아웃·변수 프로토타입) / 12주 반응형 엔터테인먼트 웹사이트(Variable Modes·기기별 Breakpoints·Figma MCP·바이브 코딩 → 실제 URL 배포)\n</li><li>\n결과물 8종 = 랜딩페이지·반응형 웹사이트·모바일 앱·대시보드·디자인 시스템·Hi-Fi 프로토타입·마이크로 인터랙션·UX/UI 포트폴리오. 실무 워크플로우 10단계 = Research → UX → Wireframe → UI → Component → Variables → Prototype → AI → Design System → Developer Handoff\n</li><li>\n추천 대상 12유형 = 학생·취업준비생 / 현업 UX·UI 디자이너 / 웹디자이너 / GUI 디자이너 / 프로덕트 디자이너 / 프리랜서 디자이너 / 퍼블리셔 / 기획자·서비스 기획자 / PM / 스타트업 대표 / 디자인 팀장 / 마케팅 디자이너\n</li><li>\n상담 운영 지침(260820 강사 교육): 커리큘럼보다 결과물을 먼저 보여주고 역으로 상담한다. 1·2는 이론+피그마 툴 기본까지, 3은 변수·IA·기획이 들어가는 고급이며 1·2 없이는 3의 AI 활용이 성립하지 않는다. UX 기카드·수강료 시수 분석 xlsx)에는 금액이 없고, 260822에 구과목 가격 정본에서 <strong>16H·50만</strong>을 확보했다(위 수강료 표 각주). 사업부 확정 전까지는 승계 추정값이다\n</li><li>\n<strong>AIX 이커머스 창업</strong> · 설명자료에 모듈 카드가 통째로 있다(아래 절)\n</li></ul>\n<p><strong>과목명 문제는 260822에 해소됐다.</strong> 같은 과목이 맞고, 사업부 공식 명칭은 설명자료 쪽이다.</p>\n<ul><li>\n설명자료(260721, 사업부 설명용 공식본)는 <code>AIX 프라이빗 마케팅 클래스</code>를 6곳에서 일관되게 쓰고, 구과목 매핑표에 <strong>방과후특강 &quot;비주얼디자인&quot; → ① AIX 프라이빗 마케팅 클래스(정규 과정화)</strong>로 명시한다. 과정 정의도 &quot;코딩·전공 무관, AI 도구만으로 온라인 판매 콘텐츠와 내 브랜드를 만드는 정규 과정&quot;이라 마케팅 쪽 내용이다\n</li><li>\nNAS 실물 PPT(260724)와 그래픽 다운로드 센터(260728)의 <code>AI 맞춤 브랜딩 프라이빗 클래스</code>는 같은 과목의 <strong>자료 제목</strong>으로 본다(시수 32H·프라이빗·AI 도구 구성이 모두 일치)\n</li><li>\n상담·산출물 표기는 <code>AIX 프라이빗 마케팅 클래스</code>로 통일한다. 다만 자료 파일을 찾을 때는 NAS 파일명이 &quot;AI 맞춤 브랜딩 프라이빗 클래스&quot;임을 기억할 것\n</li></ul>\n<p><strong>NAS 안의 링크는 전부 txt·url 파일에 들어 있다(260821 전수 열람·접속 확인).</strong> 커리큘럼 폴더의 텍스트류 9개 중 6개가 링크 파일이고, 나머지 3개는 컬러리스트 준비물 목록 2개(내용 동일·파일명만 다른 중복)와 인테리어 사전 테스트 안내다.</p>\n<div class=\"tw\"><table><thead><tr><th>학과·과정</th><th>링크</th><th>출처 파일</th><th>수정일</th></tr></thead><tbody><tr><td>AI 피그마</td><td><a href=\"https://charming-daifuku-34debc.netlify.app/\" target=\"_blank\" rel=\"noopener\">https://charming-daifuku-34debc.netlify.app/</a></td><td><code>AIX 모듈\\Ai피그마_상담자료.txt</code></td><td>26-08-20</td></tr><tr><td>AI 크리에이터 시각편집</td><td><a href=\"https://gamma.app/docs/AI-PR-tu3dhjk2kay375h\" target=\"_blank\" rel=\"noopener\">https://gamma.app/docs/AI-PR-tu3dhjk2kay375h</a></td><td><code>기타학과_AI\\[상담자료] AI크리에이터 링크.txt</code></td><td>26-08-19</td></tr><tr><td>AI 크리에이터 영상모션</td><td><a href=\"https://gamma.app/docs/Copy-of-AI--t171k5kj4knc1r6?mode=doc\" target=\"_blank\" rel=\"noopener\">https://gamma.app/docs/Copy-of-AI--t171k5kj4knc1r6?mode=doc</a></td><td>위와 같은 파일</td><td>26-08-19</td></tr><tr><td>AI 크리에이터 CG·마야</td><td><a href=\"https://gamma.app/docs/AI-CG--82rcvas1mffkdai\" target=\"_blank\" rel=\"noopener\">https://gamma.app/docs/AI-CG--82rcvas1mffkdai</a></td><td>위와 같은 파일</td><td>26-08-19</td></tr><tr><td>CG 블렌더 커리큘럼</td><td><a href=\"https://blender-curriculum-banmj.lovable.app/\" target=\"_blank\" rel=\"noopener\">https://blender-curriculum-banmj.lovable.app/</a></td><td><code>CG\\[기본 상담 자료] Blender Curriculum.url</code></td><td>26-05-14</td></tr><tr><td>CG학과 로드맵</td><td><a href=\"https://slides.com/bss-1/cg-5e8efe/fullscreen\" target=\"_blank\" rel=\"noopener\">https://slides.com/bss-1/cg-5e8efe/fullscreen</a></td><td><code>CG\\[기본 상담 자료] CG학과 로드맵.url</code></td><td>25-09-19</td></tr><tr><td>모션학과 커리큘럼(영상)</td><td><a href=\"https://slides.com/mionimous/minimal/fullscreen\" target=\"_blank\" rel=\"noopener\">https://slides.com/mionimous/minimal/fullscreen</a></td><td><code>모션\\[기본 상담 자료] 모션학과 전체 로드맵.url</code></td><td>26-01-25</td></tr><tr><td>편집포트폴리오 일지 시스템</td><td>구글시트 <code>1GmT19e9Y7lTVSmefdtyQk6k8CT4ZdDD23P0vPgjK2c8</code></td><td><code>시각편집\\편집포트폴리오 일지 시스템.url</code></td><td>24-06-25</td></tr></tbody></table></div>\n<ul><li>\n<strong>AI 피그마 txt에는 랜딩 URL 한 줄뿐이다.</strong> 260820 강사가 배포했다는 수강생 포트폴리오 URL 12~20건은 이 파일에도, <code>[학과별 포트폴리오]\\웹</code>(3건뿐)에도 없다 → 경로 [확인 필요] 유지\n</li><li>\n블렌더 링크는 반명지 강사 작성분이며 블렌더1(8주 모델링·텍스처)·블렌더2(8주 물리엔진·리깅·애니메이션·렌더링) 2단계 구성이다\n</li><li>\n<strong>AI 크리에이터 CG 링크는 제목이 &quot;지점용&quot;이라 내부 자료다.</strong> 학생에게 그대로 보내지 않는다. 영상모션 링크는 제목이 &quot;Copy of&quot;로 시작해 원본인지 사본인지 불분명하므로 발송 전 확인한다\n</li><li>\ngamma.app은 봇 차단(403)이라 WebFetch로는 안 열리고 브라우저로 열어야 한다\n</li></ul>\n<p>폴더 배치상 주의할 점</p>\n<ul><li>\n파운데이션 AIX 포토·AIX 일러 자료는 <code>AIX 모듈</code> 폴더에 <strong>그래픽 &amp; 브랜딩</strong> 접두로 들어 있다(<code>그래픽 &amp; 브랜딩 - AIX 포토샵.pptx</code>·<code>- AIX 일러스트.pptx</code>). 스튜디오 분류와 파일명이 어긋나므로 파운데이션 자료를 찾을 때 그래픽 쪽을 본다\n</li><li>\n유튜브 올인원 클래스는 <code>AIX 모듈</code>이 아니라 <code>모션\\과목별 세부 커리큘럼\\신규_유튜브 올인원.pdf</code>(26-07-23)에 있다. AI 피그마도 <code>웹\\AI피그마1,2_커리큘럼.pdf</code>·<code>AI피그마3_커리큘럼.pdf</code>(둘 다 26-05-11)에 있고 <code>AIX 모듈</code>에는 상담자료 txt만 있다\n</li><li>\n스페이스 4과목은 <code>AIX 모듈\\★Studio4 과목1~4</code> PDF 5종이 정본이다(과목2는 2A SketchUp 트랙·2B SketchUp+3dsMax 트랙으로 갈린다)\n</li><li>\n<code>전산세무회계\\회계과정\\학생자료\\</code>는 2014~2017년 KG아이티뱅크 취업지원 자료 20여 건이다(면접 질문·이력서 양식·JAVA 강의용). 현행 과정과 무관한 타사 자료이므로 상담 근거로 쓰지 않는다\n</li></ul>\n<h4>인터랙티브 모듈 커리큘럼·툴 (260822, 설명자료 본문에서 확보)</h4>\n<p>정원과 결과물은 위 &quot;운영 형태·정원&quot;·&quot;모듈별 완성 결과물&quot; 절에, 구신과목 매핑은 &quot;구과목 → 신과목 매핑&quot; 절에 있다. 여기는 그 세 절에 없는 커리큘럼 단계와 사용 도구만 둔다.</p>\n<div class=\"tw\"><table><thead><tr><th>모듈</th><th>핵심 커리큘럼 단계</th><th>사용 도구</th></tr></thead><tbody><tr><td>AIX 피그마 90H</td><td>문제정의·벤치마크 → IA·User Flow → 디자인 시스템 → 핵심 화면 5개 이상 → 반응형 → 클릭 프로토타입 → Figma MCP 코드 변환</td><td>Figma · Figma MCP</td></tr><tr><td>AIX 바이브코딩 90H</td><td>도구 세팅·첫 배포 체험 → 종이 설계(기획·기능·화면) → 정적 화면과 HTML·CSS 읽는 법 → DB 연동·CRUD → 인증·보안(Auth·RLS) → 버그수정·README·발표</td><td>Claude Code · Cursor · Supabase · GitHub · Vercel · Figma MCP</td></tr><tr><td>AIX 에이전트 업무자동화 48H</td><td>에이전트·CLI·파일 제어 → MCP·Notion 연동 → 문서(엑셀·워드·PPT)·웹·API 자동화 → 내 업무 분해·워크플로우 설계 → 자동화 시스템 구축·안정화</td><td>Claude Code · Codex · Gemini CLI · MCP·Notion · Python · Playwright</td></tr><tr><td>AIX 이커머스 창업 24H</td><td>무재고 소싱·상품 기획 → AI 상세페이지·썸네일 제작 → 광고·콘텐츠 자동화 → 스마트스토어·쿠팡·카카오 3대 채널 운영 → 첫 매출 프로세스</td><td>ChatGPT · AI 이미지·콘텐츠 툴</td></tr><tr><td>AIX 프로젝트반 60H</td><td>결과물 고도화·QA·케이스스터디·GitHub 정리·데모데이</td><td>해당 없음</td></tr></tbody></table></div>\n<p>대상은 전 모듈 선수과목이 없고, 에이전트는 업무 자동화가 필요한 재직자·실무자, 이커머스는 1인·부업 셀러와 디자인·마케팅 무경험자, 바이브코딩은 코딩 무경험자 기준이다.</p>\n<p><strong>취업 방향별 추천 조합(상담에서 그대로 쓰는 문장).</strong> UX·UI 디자이너는 피그마에 프로젝트반, 웹·서비스 개발은 피그마와 바이브코딩에 프로젝트반, AI 서비스 창업은 바이브코딩과 이커머스 창업, 재직자 리스킬은 에이전트 업무자동화, 1인 창업·부업 셀러는 이커머스 창업에 바이브코딩을 얹는다. 업셀은 취업이면 프로젝트반, 수익화면 이커머스 쪽으로 갈린다.</p>\n<p>편성 표기 주의: 설명자료는 총 일수(3H×30D×3M · 2H×24D×3M)로, 위 수강료 표는 월당 일수(3H×10D×3M · 2H×8D×3M)로 쓴다. 값은 같다.</p>\n<p>설명자료를 다시 읽을 일이 있으면 본문이 스크립트 안에 HTML 엔티티로 이스케이프돼 있다는 점을 먼저 본다. 엔티티를 해제한 뒤 태그를 제거해야 본문 1,151줄이 나오고, 순서를 바꾸면 빈 결과가 나온다.</p>\n<h4>학과 편성·구과목 전환 (260822 사업부 공지)</h4>\n<p><strong>AI학과 신설.</strong> AI에이전트 · AI업무 자동화 · AI프롬프트 3개 과정을 AI학과로 편성한다. 학과명 생성은 개발팀에서 계열 전 지점 완료했고, 계열 학과 생성 완료 후 3개 과정의 학과 변경 작업을 진행한다.</p>\n<ul><li>\n학과 그룹은 신설하지 않고 <strong>기존 <code>AI디자인</code> 그룹을 그대로 쓴다.</strong>\n</li><li>\n<strong>기존에 만들어 둔 AI 과목들은 기존 학과 편성을 유지한다</strong>(영상·시각·인테리어 등). 이름에 AI가 들어간다고 AI학과로 옮기지 않는다.\n</li><li>\n추후 예정 2건: ① AI 캠퍼스 수업 중 대면 전환이 가능한 수업은 전환 시 AI학과로 편성 ② AI 자격증 편성.\n</li><li>\n이 공지는 <strong>과목의 학과 귀속</strong> 변경이다. 수강생 개인의 과정명(소속 학과) 표기가 함께 바뀌는지는 [확인 필요] → 인트라넷 반영 후 실측으로 확인하고, 바뀌면 카드 파일명 <code>[이름]_[뒷4]_[학과].md</code>의 학과 부분을 같이 정리한다.\n</li></ul>\n<p><strong>구과목 → AIX 전환 (가격·처리 경로).</strong> 포토샵(40만) → AIX포토샵(50만), 일러스트(40만) → AIX일러스트(50만). <strong>동일 과목의 신과정 변경은 차액 결제 없이 인트라넷 배정게시판(댓글배정)으로 처리한다.</strong> 포토샵 → AIX일러스트처럼 과목이 다르면 동일과목이 아니므로 <strong>특처 작성이 필수</strong>다. 금액 정본은 <a class=\"wl\" data-doc=\"01_안내용자료/수강료_안내.md\">수강료_안내</a> &quot;구과목 → AIX 전환 규칙&quot; 절.</p>\n<p>구과목 매핑(위 매핑 절)은 포토샵+포토웍스 → AIX 포토, 일러스트+디테일 일러스트 → AIX 일러다. <strong>무상 전환이 열리는 것은 포토샵→AIX포토샵·일러스트→AIX일러스트 짝뿐이고, 포토웍스·디일러 보유분이 AIX 포토·일러로 무상 승계되는지는 [확인 필요]</strong>(공지 원문에 두 과목 언급 없음).</p>\n<h4>개별 개강분 변경 이력 (개강안내 D-5·배정 대조용)</h4>\n<p>10·11·12월 (260821 공지)</p>\n<ul><li>\n폐강: 10.10 AIX 실전영상편집/6주 14:00 6층N\n</li><li>\n폐강: 11.21 AIX 실전영상편집/6주 10:00 6층N\n</li><li>\n과정명변경: 11.21 프리미어/주 14:00 6층Q → AIX 실전영상편집/주\n</li><li>\n과정명변경: 12.19 프리미어/주 14:00 6층Q → AIX 실전영상편집/주\n</li><li>\n프리미어/주(<a class=\"wl\" data-doc=\"01_안내용자료/수강료_안내.md\">수강료_안내</a> 24H·50만)와 시수·금액이 같은 구과목 매핑(54행) &quot;프리미어+애프터이펙트 기초 → 실전 영상편집 클래스 24H·50만&quot;의 정식 명칭 적용으로 추정. 단 260728 신규 등재된 &quot;실전 영상편집 클래스/A,B&quot;(<a class=\"wl\" data-doc=\"01_안내용자료/수강료_안내.md\">수강료_안내</a> 16H·격일, 기존 확인 필요 L299 시수 불일치 대상), 9월 신과목표(162행) &quot;AIX 실전영상/A&quot;(편집 미표기, 프리미어실전 매핑)와도 표기가 달라 세 명칭의 동일 과정 여부는 [확인 필요](팀장).\n</li><li>\n내 담당 수강생 영향: 4건 모두 0명. 00_인트라넷_수강정보_과목별.csv·카드 전체에 &quot;프리미어/주&quot;·&quot;AIX 실전영상편집&quot; 수강 기록 없음(프리미어실전/A·B 수강 이력 10건은 05층C·05층L 트랙이라 6층Q 트랙과 무관).\n</li></ul>\n<p>11월·12월 (260728 접수)</p>\n<ul><li>\n11.18 AIX 패키지MD1/A 19:00 5층B → AIX 디지털 출판 실무2/A (과정변경)\n</li><li>\n12.16 AIX 패키지MD2/A 19:00 5층B → AIX 패키지MD1/A (과정변경)\n</li><li>\n같은 19:00 5층B 로테이션 라인이며, 10월 개강분(패키지MD 로테이션분)은 자료 미수령([확인 필요]). 9월 시간표에는 19:00 패키지MD2/A가 05층A-1로 잡혀 있어 강의실 표기가 다르다([확인 필요]).\n</li></ul>\n<p>10월 (260729 원장 공지)</p>\n<ul><li>\n포토웍스·디테일일러스트(구과목) 저녁·주말반: 10월 개강분부터 폐지. 구과목 매핑상 AIX 포토·AIX 일러 통합 대상 항목의 저녁·주말반 종료 시점 확정. 오전·평일 주간반 존속 여부는 별도([확인 필요]).\n</li></ul>\n<p>9월</p>\n<ul><li>\n과목변경: 09.14 포토샵 09:30 12층V → 일러스트 09:30 12층V\n</li><li>\n폐강: 09.19 컨텐츠크리에이터 18:00 6층Q (배정 없음)\n</li><li>\n패턴변경(요일 축소): 09.15 AIX 공간기획&amp;도면1/B 6층R 화목화목금 → 화목 / 09.14 AIX 2D 모션디자인1/A 12층U 월수금월수 → 월수 / 09.14 AIX 일러스트/A 19:00 12층V 월수금월수 → 월수 / 09.15 AIX 포토샵/B 19:00 12층V 화목화목금 → 화목\n</li><li>\n9월 개강 신과목 = 구과목(상담 안내용): 09.14 AIX 실전영상/A 19:00 5층I = 프리미어실전 / 09.15 AIX 마케팅영상/B 19:00 5층I = AI마케팅영상 / 09.14 Design Core Foundation1/A 14:00 5층L = 색채학+발상과표현 / 09.15 AIX 바이브코딩1/B 19:00 6층M = AI에이전트웹+AI바이브코딩 / 09.15 AIX 공간기획&amp;도면1/B 19:00 6층R = 캐드1,2 / 09.14 AIX 2D 모션디자인1/A 19:00 12층U = 에펙+모션에펙 / 09.14 AIX 일러스트/A 19:00 12층V = 일러스트+디일러 / 09.15 AIX 포토샵/B 19:00 12층V = 포토샵+포토웍스\n</li></ul>\n<p>8월</p>\n<ul><li>\n08.01 포토샵/주 09:00 6층O → 5층C (강의장변경)\n</li><li>\n08.01 모스/주 09:30 12층V → 6층R (강의장변경)\n</li><li>\n08.08 AI-POT 시험 09:00 6층O (신규 개설)\n</li></ul>\n<h4>확인 필요 (4건: 1~3 팀장, 4 학과장)</h4>\n<ul><li>\nAIX 3D 모델링 &amp; 렌더링 총액 불일치: 통합로드맵 V1은 90H·3개월·총 180만, <a class=\"wl\" data-doc=\"01_안내용자료/수강료_안내.md\">수강료_안내</a> 260727 확정분은 1~3단계 각 24H·각 50만(총 72H·150만). 시수와 총액이 모두 다르다. 견적 전 확인.\n</li><li>\n유튜브 올인원클래스 총액: 통합로드맵 V1은 32H·2개월·총 100만. 260725 구두 전언은 50만이었다. V1이 최신 문서이므로 100만을 우선하되 확정 전 견적 발행 금지.\n</li><li>\nAIX 디자인 파운데이션(16H) 수강료: V1 수강료 탭에 미등재. 260822에 구과목 가격 정본으로 16H·50만을 채웠으나(수강료 표 각주 참조) 사업부 확정값이 아니다. 두 구과목 32H를 16H로 합친 개편이라 재산정 가능성이 남는다. 260715 문서의 30H 표기도 V1에서 16H로 축소됐다.\n</li><li>\n스페이스 시수 상충(260811 발견, 학과장 확인 대상): 설명회 발언·로드맵 V1은 3D 모델링&amp;렌더링 각 90H·공간VR 48H, NAS 홍보소개자료 PDF는 과목 2A·2B 각 80H(8.9주)·과목 4 36H(4주, &quot;과목 2 선이수 기준 설계&quot;). 확인 전 시수는 &quot;설명회 발언 기준&quot;을 붙여 안내.\n</li></ul>\n<h4>상담·산출물 적용 지침</
