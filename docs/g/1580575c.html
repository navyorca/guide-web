cad + 인벤터 콤보\". 전산응용기계제도기능사 (전응기) 국가기술자격 제한 없음 기계 제도 분야 cad 활용. bim 자격증 bim(레빗) 관련 전문 자격. 자격증 전략 인테리어 업계는 포트폴리오도 중요하지만 자격증 취득이 매우 중요 (성실함과 자기관리의 척도) 비전공자도 필수 취득 권장 기사는 자격 요건 충족 시 1달 만에도 가능하나, 비전공자는 실기 기초부터 최소 6개월 소요 추천 전략: 3년치 기출문제를 1년 다듬기 방식으로 공략 3. 프로그램·툴 비교 3 1. 2d 도면: autocad 건축, 기계, 인테리어 등 전 산업 분야의 기본이 되는 전자 제도 프로그램 건축물을 짓기 위한 정확한 2d 밑그림 역할 '실습'이 핵심 (명령어 암기보다 실무형 도면 작성 우선) 스케치업 포트폴리오의 밑바탕 3 2. 3d 모델링 방식 이해 방식 원리 특징 대표 프로그램 폴리곤 벽돌 쌓기 직선·직각 표현 우수. 곡선 표현은 폴리곤이 많아져 렌더링 오래 걸림. sketchup, 3ds max 넙스(nurbs) 선 구조 방식 선과 선을 연결해 자유자재로 곡선 표현 가능. rhino, 라이노 서브디비전 픽사(pixar) 고안 폴리곤+넙스 장점 결합. 3ds max 3 3. 주요 3d 프로그램 비교 프로그램 특징 주 용도 난이도 sketchup (스케치업) 폴리곤 방식. 빠르다, 쉽다, 업계 표준. 루비(플러그인)로 기능 확장 가능. 단점: 곡선 형태 깨지기 쉬움. 건축인테리어, 무대전시, vmd 하 (3d 중 가장 쉬움) rhino (라이노) 넙스 방식. 자유로운 곡선 표현. 캐드(오토데스크)와 완벽 호환. 제품 디자인, 산업디자인. 건축 곡선 디자인 수요 증가로 건축에도 사용 확대. 상 (배우기 어려움) inventor (인벤터) 기계 부품/설비 정밀 설계 특화. 라이노가 '겉포장'이면 인벤터는 '내부 부품'. 기계설계, 기계제도 중 3ds max 서브디비전 방식. 고퀄리티 3d 제작. 오토데스크 사 인수 (원래 별도). 건축인테리어 고퀄 작업, 대형 수주 프로젝트 상 maya 3ds max와 동일 회사(오토데스크). 영화·애니메이션 상 bim revit (레빗) 빌딩 인포메이션 모델링. 설계 쪽에 가까움. 물량산출·적산 가능(타일 개수·단가·총금액 자동 계산). 건축 인허가에 bim 도면 필수화. 건축설계, 시공 중상 참고: 카티아(자동차·항공기·조선), 솔리드웍스(일반기계·전자장비·의료기기)는 다쏘시스템즈 프로그램. 본원 강좌 없음. bim 수업은 희소성 높음. 특히 이 근방에서는 강남점에서만 수업 진행 → 상담 시 적극 어필할 것. 3 4. 렌더링 프로그램 비교 렌더러 특징 추천 대상 v ray (브이레이) 고퀄리티 실사 렌더링. 빛·색 온도 정밀 세팅 필요. 스케치업의 꽃. 실시간 렌더링 지원. 고퀄 결과물이 필요한 모든 수강생 enscape (엔스케이프) 스케치업 내장형 플러그인. 실시간 동기화. 빠르고 배우기 쉬움. 가성비 좋음. 빠른 확인·수정이 필요한 실무용 d5 언리얼엔진 기반, 물리 기반 렌더링(pbr). 재질 입히기 쉬움. 자체 클라우드에서 마감재·3d 컴포넌트 소스 제공. 인스타 감성 고화질 결과물에 강함. 고화질 비주얼 중심 포트폴리오 lumion (루미온) 기본 제공 어셋이 많음. 수목 표현, 실내 장면, 조경 표현 특화. 조경·건축 외관 렌더링 twinmotion (트윈모션) 루미온보다 기능 많고, 엔스케이프보다 사용 편리. 루미온·엔스케이프 중간 성격 4. 도면의 이해 및 현장 용어 4 1. 도면 종류 도면을 구분하는 기준: \"어느 방향에서 보느냐\" 평면도 (plan) ├─ 시선: 위에서 아래 (1.2m 높이에서 잘라 내려다봄) └─ 용도: 벽체·문·창문 위치 / 가구 배치 / 동선 파악 천정도 (rcp, reflected ceiling plan) ├─ 시선: 아래에서 위 (바닥에 누워 천장을 올려다본 거울상) ├─ 용도: 조명·에어컨·감지기·스프링클러 등 설비 배치 └─ 주의: 거울상(mirror image)이라 좌우가 반전됨 입면도 (elevation) ├─ 시선: 측면 (벽면을 정면/측면에서 바라봄) └─ 용도: 디자인 / 마감재 / 창문 모양 / 가구 높이 단면도 (section) ├─ 시선: 수직 절단면 (케이크처럼 잘라 내부 구조 확인) └─ 용도: 층고 / 천장 속 공간 / 바닥 두께 / 단열재 3줄 기억법: 평면도 → 위에서 (가구) / 천정도 → 아래에서 (조명) / 입면도 → 옆에서 (디자인) 4 2. 필수 수치 단위 모든 대화의 숫자는 mm(밀리미터) 다. 0 하나 빠지면 큰일 난다! t (두께, thickness) → 1t = 1mm ├─ \"유리 5t\" → 5mm 두께 유리 ├─ \"합판 9t\" → 9mm 두께 합판 └─ \"아크릴 3t\" → 3mm 전 (錢) → cm를 뜻하는 현장 은어 / 1전 = 1cm = 10mm ├─ \"한 5전 띄워\" → 5cm 간격 └─ \"2전 내려와\" → 2cm 아래로 평 (坪) → 면적 단위 / 1평 = 약 3.3㎡ / 계산: 가로m × 세로m ÷ 3.3 └─ 아파트 34평 / 타일 1평(박스 단위) 기준 높이 용어 ├─ gl ground level → 땅바닥 기준선 ├─ fl floor level → 마감 바닥 기준선 └─ ch ceiling height → 천장(반자) 높이 4 3. 자재 용어 뼈대 자재 ├─ 다루끼 (각목) 30×30mm (1치×1치) → 인테리어 뼈대. 가장 기본적으로 많이 쓰임. └─ 투바이 (2×4) 30×69mm → 다루끼보다 넓적하고 튼튼. 힘받는 벽체 기둥용. 면재 (판재) ├─ 석고보드 9.5t 기준 → 벽/천장 기본 바탕재. 도배/페인트 전에 붙임. 물에 약함. ├─ mdf (엠디) 나무 톱밥을 본드로 뭉친 판. 표면 매끄러워 필름/페인트용. 물에 닿으면 퉁퉁 붊. └─ 합판 (plywood) 얇은 나무 여러 겹. 나무결 보이고 튼튼. mdf보다 비쌈. 4 4. 현장 용어 구조 용어 (일본어 잔재) → 뜻을 알고 쓰는 것과 모르고 쓰는 것은 다르다. ├─ 덴조 (天井) → 천장 \"덴조 쳤냐?\" = 천장 공사 다 했냐? ├─ 가베 (壁) → 벽 \"가베 세운다\" = 가벽을 만든다 ├─ 하리 (梁) → 보 \"하리 때문에 더 못 올려요\" (가로 구조물) └─ 하시라 (柱) → 기둥 기둥 위치 확인 시 사용 공구 은어 ├─ 빠루 → 노루발 못뽑이. 철거할 때 쓰는 쇠막대기. ├─ 임팩 → 임팩트 드릴. 나사 박는 전동 드릴. ├─ 기리 → 드릴 날(비트). \"콘크리트 기리 가져와\" └─ 헤라 → 주걱. 퍼티 바르거나 시트지 밀 때. 작업 용어 ├─ 먹줄 → 기준선 표시. \"먹 때린다/놓는다\" = 공사 시작, 기준선 긋기 ├─ 메지 → 줄눈(타일 사이 틈). \"메지 넣었다\" = 타일 틈새를 시멘트로 채웠다 ├─ 단도리 → 준비·채비·정리. \"주변 단도리 좀 해라\" = 정리정돈 해라 ├─ 나라시 → 평탄화(바닥 고르기). \"바닥 나라시 해라\" ├─ 마감 → 최종 표면 처리. \"마감이 왜 이래?\" = 끝처리가 지저분하다 └─ 데나오시 → 재시공. 잘못 공사해서 뜯고 다시 하는 것. 5. 커리큘럼 5 1. 전체 학습 순서 (표준) 스케치 기초 (1개월) → cad 수업 (2개월) → sketchup 1·2 (2개월) → 렌더링 (v ray / enscape) → 포트폴리오 제작 (2~3개월) → 자격증 대비반 (3~6개월, 병행 가능) 진행 속도는 수강생마다 상이. 분석 → 도면 → 모델링/렌더링 순으로 진행. 5 2. 스케치업 포트폴리오 프로세스 (약 2개월) 1. 스케치업 1단계: cad에서 도면 가져오기(import) → 정리·걷어내기 2. 스케치업 2단계: 맵핑/렌더링 → 재질 입히기(iso 매트릭 등) → v ray / enscape 활용 3. 포트폴리오 기획: 사전조사부터 시작 (참고 사례: 젠틀몬스터 매장) 4. 제안서/기안서: ppt 등으로 최종 결과물 도출 팁: 인체 스케일(human scale)에 맞게 가구/사람 모델링 배치 후 view 확인(앉아보기) 중요. 5 3. 자격증 대비반 커리큘럼 1. 스케치 기초 (1개월) 2. cad 수업 (2개월) 3. 스케치업 (2개월) 4. 대비반 진입: 실내건축 기출문제 3~6개월 풀이 6. 취업·진로 포트폴리오 업계 취업 1순위 평가 요소 트렌드: 텍스트 위주 → 비주얼(visual) 중심 으로 변화 인테리어 업계에서는 포트폴리오 외에 자격증 과 공모전 수상 도 매우 중요 (성실함·자기관리의 척도) 전공자(3~4학년) 과정이지만 비전공자도 충분히 고퀄리티 제작 가능 포트폴리오는 '기획'이 핵심 스케치 원래 '손 제도'가 있었으나 현재는 '스케치'로 대체 시공 현장에서 현장 소장님과의 즉각적인 소통(커뮤니케이션) 수단으로 필수 내가 보는 시점과 구도에 대해 배우는 기본 개념 학습 방향: 테크닉(발상/전술)보다는 내용 에 집중 인테리어 업계 핵심 트렌드 '빨리 보여주고 빨리 수정하는' 리얼타임 방식이 대세 시간과 예산을 절약하기 위해 3d 프로그램으로 가상공간 시각화 기획 → 모델링 → 렌더링 속도가 경쟁력 소규모 인하우스: 스케치업만 사용하는 경우도 있음 대형 수주·규모 큰 회사: 3ds max 사용하는 경우 많음 7. 상담 포인트 핵심 포인트 요약 1. 건축인테리어는 '공간'을 다룬다 → 공간 디자인이 핵심 개념임을 먼저 설명 2. 캐드가 기초 → 모든 프로그램의 밑바탕. 캐드가 튼튼해야 스케치업이 예쁘게 붙음 3. 스케치업이 업계 표준 → 배우기 쉽고 빠름. 인테리어 업계 압도적 대세 4. 렌더링은 선택이 아니라 필수 → v ray, 엔스케이프, d5 등 수강생 목적에 맞게 추천 5. 자격증 + 포트폴리오 투트랙 → 둘 다 중요. 하나만 해서는 취업 경쟁력 약함 6. bim 희소성 강조 → 이 근방에서 강남점에서만 수업. 건축 인허가에 bim 필수화로 수요 증가 프로그램별 비유 (상담용) 프로그램 비유 autocad 모든 것의 시작, 전자 도면 (뼈대) sketchup 빠르게 벽돌 쌓기 (폴리곤 방식) rhino 매끄러운 겉포장 (넙스 방식) inventor 정교한 내부 부품 3ds max 토이스토리를 만든 프로그램. 하이퀄리티 전문용. v ray 스케치업의 꽃 자격증 비유 (상담용) 자격증 비유 cat 2급 받아쓰기 레벨 전산응용건축제도기능사 에세이(논문) 작성 레벨 기계제도기능사 cad + 인벤터 콤보 수업시간표 회차 시간 ① 09:30 ② 11:30 ③ 14:00 ④ 16:00 ⑤ 19:00~22:00 (프리랜서·직장인 팀, 평일/주말 활용) 8. 수강료 및 패키지 단위: 만원 (과목당 단가). 실제 등록 시 팀장님께 견적 확인 필수. 평일반 과목 세부 내용 수강료 스케치/이론 50 캐드 캐드1: 기본 cad 명령어, 도면 요소 제작 / 캐드2: 인테리어 도면 작성 45 스케치업 스케치업1: 기본 모델링, 루비 질감 적용 / 스케치업2: 브이레이 활용 실사 렌더링 50 맥스 (3ds max) 맥스1: 기본 명령어, 오브젝트 수정 / 맥스2: 기초 모델링, 주거공간 / 맥스3: 심화 모델링, 브이레이 50 엔스케이프 기본, 출력, 조명 세팅 25 인테리어 포트폴리오 60 스케치업 포트폴리오 60 인테리어 포트폴리오 기획 20 주말반 (압축 속성반) 과목 수강료 스케치/주 50 캐드 6주 정규 60% 수준 70 인벤터 30 라이노 70 전응건 (전산응용건축) 50 전응기 (전산응용기계) 60 cat 2급 20 bim1: 인터페이스 이해, 주택·생활시설 모델링 50 bim2: 캐드 도면 도입, 일람표, 도면화 50 스케치업1/주 · 스케치업2/주 미정 실내건축 자격증반 과목 내용 수강료 실내건축1 cad 작업 50 실내건축2 스케치업 작업 50 실내건축/기출 기출문제, 시험 대비반 1~3개월 50 방특(방과후특강) 과목 수강료 라이노1 40 라이노2 40 캐드1 30 캐드2 30 기본 참고 단가 기본 과목: 45~50만원 포트폴리오: 60만원 자격증반: 50만원 주말 압축 속성반 별도 운영 출처: 260206 팀장님 교육 / 260211 장원희팀장님 교육 정리 / 260222 기계설계총정리 / 260222 상담가이드 / 건축·인테리어 완전정복 통합 정리: 2026 02 28"},"99_시스템/03_학과지식/계열별_핵심_상담_치트키_2026_완결본.md":{"t":"계열별 핵심 상담 치트키 2026 완결본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<p>계열 7개(IT웹·디자인·영상·CG·건축·사무·행정)의 상담용 핵심 비유와 필수 용어를 한 장에 모은 치트키다.</p>\n<p>계열마다 비유 한 줄을 앞에 두고, 뉴비 멘토가 상담에서 바로 확인해야 할 상식과 주의점을 붙였다.</p>\n<h3>🌐 1. [IT/웹] 디자인 &amp; 퍼블리싱</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 웹사이트 제작은 인터넷 세상에 <strong>'내 집'</strong>을 짓는 과정입니다.</blockquote>\n<h4>🏗️ 3단계 공정 (건축 비유)</h4>\n<ul><li>\n<strong>HTML (뼈대)</strong>: 건물의 철근과 외벽. &quot;여기는 버튼, 여기는 그림&quot;이라고 위치를 잡는 설계도입니다.\n</li><li>\n<strong>CSS (인테리어)</strong>: 벽지 바르고 조명 달기. 글자 색, 크기, 버튼 모양을 예쁘게 꾸미는 작업입니다.\n</li><li>\n<strong>Javascript (지능/전기)</strong>: 벨 누르면 소리 나고, 스위치 켜면 불 들어오는 '동작'을 담당합니다. (연봉 결정의 핵심!)\n</li></ul>\n<h4>📌 뉴비 멘토 필독 상식</h4>\n<ul><li>\n<strong>반응형 웹</strong>: 기기(폰/PC) 크기에 따라 사이트가 자동으로 변신하는 것. (2026년 현재는 선택이 아닌 필수!)\n</li><li>\n<strong>영타 200타</strong>: 코딩은 영어 명령어를 직접 쳐야 합니다. <strong>영타가 느리면 수업 진도를 절대 못 따라가니</strong> 상담 시 꼭 체크하세요.\n</li></ul>\n<hr>\n<h3>🎨 2. [디자인] 시각편집 &amp; 아트웍</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 포토샵은 도구일 뿐, <strong>아트웍(드로잉)</strong>은 디자이너의 기초 체력입니다.</blockquote>\n<h4>🏋️ 디자인 기초 체력</h4>\n<ul><li>\n<strong>아트웍</strong>: 운동선수의 근력 운동과 같습니다. 드로잉 실력이 없으면 아무리 툴을 잘 써도 결과물이 촌스럽습니다.\n</li><li>\n<strong>포토샵 (비트맵)</strong>: 사진 보정/합성용. 작은 점(픽셀) 방식이라 확대하면 깨집니다.\n</li><li>\n<strong>일러스트 (벡터)</strong>: 로고/캐릭터 제작용. 수학적 선 방식이라 아무리 키워도 선명합니다.\n</li></ul>\n<h4>📌 상담 클로징 포인트</h4>\n<ul><li>\n<strong>3-6-9-12 법칙</strong>: 3개월(입문) ➡️ 6개월(모작) ➡️ 12개월(취업용 포폴 완성).\n</li><li>\n<strong>Non-PBR</strong>: 컴퓨터가 계산해주는 게 아니라 <strong>작가가 직접 빛과 그림자를 그리는</strong> 고난도 수작업 기술입니다.\n</li></ul>\n<hr>\n<h3>🎬 3. [영상] 모션그래픽</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 정지된 디자인에 <strong>'시간'</strong>과 <strong>'생명'</strong>을 불어넣어 화려하게 만드는 스타일리스트입니다.</blockquote>\n<h4>📌 주요 툴 및 용어</h4>\n<ul><li>\n<strong>에프터이펙트 (에펙)</strong>: 영상계의 포토샵. 자막 넣고 효과 주는 모든 영상의 필수 관문입니다.\n</li><li>\n<strong>C4D (시네마4D)</strong>: <strong>[스포츠카 🏎️]</strong>. 광고나 방송 로고처럼 세련된 3D 영상을 아주 빠르게 만들어냅니다.\n</li><li>\n<strong>OAP</strong>: 방송국 채널 로고나 프로그램 시작 영상. 모션그래픽의 꽃이라 불립니다.\n</li></ul>\n<hr>\n<h3>👾 4. [CG] 마야 &amp; VFX</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 영화 &lt;어벤져스&gt;처럼 세상에 없는 것을 <strong>무(無)에서 창조</strong>해내는 영역입니다.</blockquote>\n<h4>📌 주요 툴 및 용어</h4>\n<ul><li>\n<strong>마야 (Maya)</strong>: <strong>[덤프트럭 🚚]</strong>. 무겁고 어렵지만 안 되는 게 없습니다. 영화/게임 대작 제작의 글로벌 표준입니다.\n</li><li>\n<strong>리깅 (Rigging)</strong>: 만든 캐릭터 안에 <strong>뼈대와 관절</strong>을 심는 것. &quot;이걸 해야 캐릭터가 춤을 춥니다.&quot;\n</li><li>\n<strong>후디니 (Houdini)</strong>: <strong>[과학 실험실 🧪]</strong>. 물 터지고 건물 무너지는 효과를 만드는 '이과형' 끝판왕 프로그램입니다.\n</li></ul>\n<hr>\n<h3>🏗️ 5. [건축] 인테리어 &amp; 설계</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 도면은 설계자의 <strong>언어</strong>이고, 3D는 클라이언트를 향한 <strong>완벽한 설득</strong>입니다.</blockquote>\n<h4>📏 실무 필수 규칙</h4>\n<ul><li>\n<strong>무조건 mm(밀리미터)</strong>: 건축 현장에서 cm 쓰면 뉴비입니다. 무조건 <strong>'미리'</strong>라고 하세요. (1T = 1mm 두께)\n</li><li>\n<strong>CAD (캐드)</strong>: 연필 대신 컴퓨터로 그리는 정밀한 '설계도'입니다. 업계 공통어입니다.\n</li><li>\n<strong>스케치업</strong>: 도면을 보고 3D 공간을 가장 빠르고 쉽게 세워주는 도구입니다.\n</li></ul>\n<h4>🗺️ 도면 구분법</h4>\n<ul><li>\n<strong>평면도</strong>: 위에서 내려다본 그림. 가구 배치를 봅니다.\n</li><li>\n<strong>입면도</strong>: 벽면을 옆에서 본 그림. 벽 디자인과 마감재를 봅니다.\n</li></ul>\n<hr>\n<h3>📊 6. [사무] OA &amp; 전산세무회계</h3>\n<blockquote>[!info] <strong>핵심 비유</strong>: 엑셀은 직장인의 <strong>사원증</strong>이고, 회계는 자본주의의 <strong>기본 언어</strong>입니다.</blockquote>\n<h4>📌 자격증 핵심</h4>\n<ul><li>\n<strong>MOS 365</strong>: 2026년 개편! 엑세스 제외, <strong>엑셀/워드/PPT</strong> 3과목 집중. 국제 공인 자격증입니다.\n</li><li>\n<strong>컴활 1급</strong>: 국가 공인. MOS보다 훨씬 어렵지만 국내 취업 시 인정도가 가장 높습니다.\n</li><li>\n<strong>분개</strong>: 돈의 흐름을 왼쪽(차변)과 오른쪽(대변)에 나눠 적는 회계의 구구단입니다.\n</li></ul>\n<hr>\n<h3>💳 7. [행정] 국비 지원 (NCS)</h3>\n<blockquote>[!danger] <strong>경고: 멘토의 신뢰가 무너지는 지점 (상담 시 강조!)</strong></blockquote>\n<blockquote>&quot;알바나 취업 숨기고 수당 받으면 나중에 <strong>3~5배 벌금</strong> 폭탄 맞습니다.&quot;</blockquote>\n<ul><li>\n<strong>내배카</strong>: 국가가 주는 교육비 카드(바우처).\n</li><li>\n<strong>국취제</strong>: 공부하는 동안 나라에서 주는 생활비(수당).\n</li><li>\n<strong>부정수급</strong>: 훈련 도중 소득이 발생하면 무조건 행정실에 자진 신고해야 함을 고지하세요.\n</li></ul>","x":"계열 7개(it웹·디자인·영상·cg·건축·사무·행정)의 상담용 핵심 비유와 필수 용어를 한 장에 모은 치트키다. 계열마다 비유 한 줄을 앞에 두고, 뉴비 멘토가 상담에서 바로 확인해야 할 상식과 주의점을 붙였다. 🌐 1. it/웹 디자인 & 퍼블리싱 !info 핵심 비유 : 웹사이트 제작은 인터넷 세상에 '내 집' 을 짓는 과정입니다. 🏗️ 3단계 공정 (건축 비유) 1. html (뼈대) : 건물의 철근과 외벽. \"여기는 버튼, 여기는 그림\"이라고 위치를 잡는 설계도입니다. 2. css (인테리어) : 벽지 바르고 조명 달기. 글자 색, 크기, 버튼 모양을 예쁘게 꾸미는 작업입니다. 3. javascript (지능/전기) : 벨 누르면 소리 나고, 스위치 켜면 불 들어오는 '동작'을 담당합니다. (연봉 결정의 핵심!) 📌 뉴비 멘토 필독 상식 반응형 웹 : 기기(폰/pc) 크기에 따라 사이트가 자동으로 변신하는 것. (2026년 현재는 선택이 아닌 필수!) 영타 200타 : 코딩은 영어 명령어를 직접 쳐야 합니다. 영타가 느리면 수업 진도를 절대 못 따라가니 상담 시 꼭 체크하세요. 🎨 2. 디자인 시각편집 & 아트웍 !info 핵심 비유 : 포토샵은 도구일 뿐, 아트웍(드로잉) 은 디자이너의 기초 체력입니다. 🏋️ 디자인 기초 체력 아트웍 : 운동선수의 근력 운동과 같습니다. 드로잉 실력이 없으면 아무리 툴을 잘 써도 결과물이 촌스럽습니다. 포토샵 (비트맵) : 사진 보정/합성용. 작은 점(픽셀) 방식이라 확대하면 깨집니다. 일러스트 (벡터) : 로고/캐릭터 제작용. 수학적 선 방식이라 아무리 키워도 선명합니다. 📌 상담 클로징 포인트 3 6 9 12 법칙 : 3개월(입문) ➡️ 6개월(모작) ➡️ 12개월(취업용 포폴 완성). non pbr : 컴퓨터가 계산해주는 게 아니라 작가가 직접 빛과 그림자를 그리는 고난도 수작업 기술입니다. 🎬 3. 영상 모션그래픽 !info 핵심 비유 : 정지된 디자인에 '시간' 과 '생명' 을 불어넣어 화려하게 만드는 스타일리스트입니다. 📌 주요 툴 및 용어 에프터이펙트 (에펙) : 영상계의 포토샵. 자막 넣고 효과 주는 모든 영상의 필수 관문입니다. c4d (시네마4d) : 스포츠카 🏎️ . 광고나 방송 로고처럼 세련된 3d 영상을 아주 빠르게 만들어냅니다. oap : 방송국 채널 로고나 프로그램 시작 영상. 모션그래픽의 꽃이라 불립니다. 👾 4. cg 마야 & vfx !info 핵심 비유 : 영화 <어벤져스 처럼 세상에 없는 것을 무(無)에서 창조 해내는 영역입니다. 📌 주요 툴 및 용어 마야 (maya) : 덤프트럭 🚚 . 무겁고 어렵지만 안 되는 게 없습니다. 영화/게임 대작 제작의 글로벌 표준입니다. 리깅 (rigging) : 만든 캐릭터 안에 뼈대와 관절 을 심는 것. \"이걸 해야 캐릭터가 춤을 춥니다.\" 후디니 (houdini) : 과학 실험실 🧪 . 물 터지고 건물 무너지는 효과를 만드는 '이과형' 끝판왕 프로그램입니다. 🏗️ 5. 건축 인테리어 & 설계 !info 핵심 비유 : 도면은 설계자의 언어 이고, 3d는 클라이언트를 향한 완벽한 설득 입니다. 📏 실무 필수 규칙 무조건 mm(밀리미터) : 건축 현장에서 cm 쓰면 뉴비입니다. 무조건 '미리' 라고 하세요. (1t = 1mm 두께) cad (캐드) : 연필 대신 컴퓨터로 그리는 정밀한 '설계도'입니다. 업계 공통어입니다. 스케치업 : 도면을 보고 3d 공간을 가장 빠르고 쉽게 세워주는 도구입니다. 🗺️ 도면 구분법 1. 평면도 : 위에서 내려다본 그림. 가구 배치를 봅니다. 2. 입면도 : 벽면을 옆에서 본 그림. 벽 디자인과 마감재를 봅니다. 📊 6. 사무 oa & 전산세무회계 !info 핵심 비유 : 엑셀은 직장인의 사원증 이고, 회계는 자본주의의 기본 언어 입니다. 📌 자격증 핵심 mos 365 : 2026년 개편! 엑세스 제외, 엑셀/워드/ppt 3과목 집중. 국제 공인 자격증입니다. 컴활 1급 : 국가 공인. mos보다 훨씬 어렵지만 국내 취업 시 인정도가 가장 높습니다. 분개 : 돈의 흐름을 왼쪽(차변)과 오른쪽(대변)에 나눠 적는 회계의 구구단입니다. 💳 7. 행정 국비 지원 (ncs) !danger 경고: 멘토의 신뢰가 무너지는 지점 (상담 시 강조!) \"알바나 취업 숨기고 수당 받으면 나중에 3~5배 벌금 폭탄 맞습니다.\" 내배카 : 국가가 주는 교육비 카드(바우처). 국취제 : 공부하는 동안 나라에서 주는 생활비(수당). 부정수급 : 훈련 도중 소득이 발생하면 무조건 행정실에 자진 신고해야 함을 고지하세요."},"99_시스템/03_학과지식/교양기타지식.md":{"t":"교양기타지식","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>📚 교양 · 생산성 · 기타 지식</h3>\n<blockquote>[!tip] 📌 한 줄 요약</blockquote>\n<blockquote>자격증 · 경제 상식 · 4차 산업혁명 · AI 역설 · 언어 순화 · 옵시디언 활용법</blockquote>\n<blockquote>분야 상관없이 알아두면 쓸모 있는 지식 모음.</blockquote>\n<p><strong>목차</strong> · <span class=\"wl off\">#자격증 체계</span> · <span class=\"wl off\">#경제 8대 소득</span> · <span class=\"wl off\">#4차 산업혁명</span> · <span class=\"wl off\">#AI 생산성 역설</span> · <span class=\"wl off\">#언어 순화</span> · <span class=\"wl off\">#옵시디언 활용 가이드</span> · <span class=\"wl off\">#분야별 커리큘럼 &amp;amp; 수강료 총람</span></p>\n<hr>\n<h3>자격증 체계</h3>\n<blockquote>[!abstract] 자격증 종류, 헷갈리지 말자!</blockquote>\n<pre><code>🏛️ 종류별 구분\n├─ 국가전문자격    특정 요건(학력/경력/시험) 필요   예) 공인회계사, 공인중개사\n├─ 국가기술자격    필기 합격 후 실기 응시           예) 전산회계운용사, 컴퓨터활용능력\n└─ 민간국가공인    민간 운영이지만 국가 공인         예) 전산회계\n\n📈 등급 체계\n└─ 기능사 → 산업기사 → 기사\n   (기사 = 보통 4년제 졸업 또는 관련 경력 필요)</code></pre>\n<hr>\n<h3>경제 8대 소득</h3>\n<blockquote>[!abstract] 세금 부과 기준이 되는 8가지 소득 종류</blockquote>\n<pre><code>💰 8대 소득\n├─ 💵 이자 소득    은행 예금, 적금 등에서 받는 이자\n├─ 📈 배당 소득    주식 보유로 받는 배당금\n├─ 💼 근로 소득    회사에서 받는 월급/급여\n├─ 🏪 사업 소득    자영업/프리랜서 수입\n├─ 🧓 연금 소득    국민연금, 퇴직연금 등 연금 수령액\n├─ 🎲 기타 소득    위 항목에 포함 안 되는 일시적 소득\n├─ 🏠 양도 소득    부동산/주식 등 자산을 팔아서 생긴 차익\n└─ 🚪 퇴직 소득    직장 퇴직 시 받는 퇴직금</code></pre>\n<hr>\n<h3>4차 산업혁명</h3>\n<blockquote>[!abstract] 물리적·디지털·생물학적 공간의 경계가 희미해지는 <strong>기술 융합의 시대</strong></blockquote>\n<pre><code>🌐 핵심 3요소\n├─ 초연결 (Hyper-connectivity)   모든 사물과 인간이 네트워크로 연결  예) IoT, 5G\n├─ 초지능 (Hyper-intelligence)   기계가 스스로 학습하고 판단          예) AI, 빅데이터\n└─ 초융합 (Hyper-convergence)    기술 간 경계가 무너지고 새 가치 창출  예) 디지털 트윈\n\n🔍 일상 속 4차 산업혁명\n├─ 🖥️ 키오스크         유통 자동화의 상징. 디지털 소외 계층 배려 숙제.\n├─ 🤖 생성형 AI        단순 계산을 넘어 추론과 창작 수행. 4차 산업혁명의 핵심 엔진.\n├─ 🦾 휴머노이드        인간 형태의 로봇. 단순 노동 → 정서적·물리적 상호작용 지향.\n└─ 🥽 VR / 메타버스    가상과 현실의 경계가 모호해지는 확장판.</code></pre>\n<h4>교육 멘토에게 필요한 3가지 핵심 무기</h4>\n<blockquote>[!tip] 기술에 대체되지 않는 <strong>'독보적 가치'</strong> 를 구축하자.</blockquote>\n<pre><code>🤝 ① 하이터치 (High Touch)\n└─ AI가 진단할 수 없는 학생의 불안감과 동기를 어루만지는 정서적 교감과 공감 능력\n\n📊 ② 데이터 리터러시 (Data Literacy)\n└─ 방대한 교육 통계에서 맥락을 읽어 맞춤형 학습 전략을 제시하는 분석력\n\n🧭 ③ 윤리적 큐레이션\n└─ 정보의 홍수 속에서 공신력 있는 자료를 선별하고 AI 올바른 활용법을 제시하는 나침반 역할</code></pre>\n<hr>\n<h3>AI 생산성 역설</h3>\n<blockquote>[!warning] ⚠️ AI가 항상 생산성을 높여주는 건 아니다!</blockquote>\n<pre><code>📖 핵심 용어\n├─ AI 생산성 역설    AI 도입 후 기대했던 생산성 향상이 즉각 나타나지 않고\n│                    초기엔 오히려 정체/저하되는 현상\n├─ AI 수정 비용(ACC) AI 결과물의 오류를 식별·수정·재검증하는 데 드는\n│                    시간과 인지적 노력\n└─ 유사 생산성       빠르게 산출물을 만든 것처럼 보이지만,\n                     실제로는 수정 작업에만 시간을 쏟는 비효율 상태\n\n⚠️ 빠지기 쉬운 함정\n├─ 재작업의 늪    AI 결과가 미묘하게 어긋나 → 프롬프트 재입력 → 확인 → 수정 무한 반복\n├─ 역자동화       자동화 도구가 오히려 인간 수동 개입을 더 많이 요구하게 되는 주객전도 현상\n└─ HITL 병목      AI 처리 속도를 인간 검수자 속도가 따라가지 못해 전체 공정이 지연</code></pre>\n<blockquote>[!tip] 💡 <strong>편집세(Editing Tax) 고려하기</strong></blockquote>\n<blockquote>AI 작업 시간 외에 <strong>검수·수정 시간을 30~40% 추가</strong> 배정해야 납기 지연을 막을 수 있음.</blockquote>\n<blockquote>AI는 <strong>초안/아이디어용</strong>으로 한정. 계약서·수치 보고서는 처음부터 직접 작성.</blockquote>\n<hr>\n<h3>언어 순화</h3>\n<h4>중복 표현 (옥상옥)</h4>\n<pre><code>❌ 잘못된 표현     이유                          ✅ 올바른 표현\n족발 (足발)        '발 족(足)' + '발' 중복       → 돼지발 또는 족\n동해바다 (東海)    '바다 해(海)' + '바다' 중복   → 동해\n무궁화꽃 (無窮花)  '꽃 화(花)' + '꽃' 중복       → 무궁화\n매일매일 (每日)    '매일'이 반복 의미 포함        → 매일\n과반수 이상 (過半) '과반수' 자체가 절반 초과       → 과반수</code></pre>\n<h4>일본어 잔재 순화</h4>\n<pre><code>❌ 일본어 잔재   ✅ 올바른 우리말\n단도리 (段取り) → 채비, 준비, 정리\n쿠사리 (腐り)  → 면박, 비난, 핀잔\n간지 (感じ)    → 멋, 본새, 느낌\n뿜뿌/펌프질    → 충동질, 부추김\n시야게 (仕上げ) → 마무리, 끝손질</code></pre>\n<blockquote>[!tip] 💡 옥상옥 방지법 → &quot;똑같은 뜻의 한자와 우리말이 겹치지 않았나?&quot; 1초만 더 생각해보면 훌륭한 문장이 된다.</blockquote>\n<hr>\n<h3>옵시디언 활용 가이드</h3>\n<h4>핵심 단축키</h4>\n<pre><code>⌨️ 자주 쓰는 단축키\n├─ Ctrl + O           파일 찾기 (폴더 뒤지지 말고 파일명 검색!)\n├─ Ctrl + Shift + F   전체 검색 (해당 단어가 포함된 모든 문장 나열)\n├─ Ctrl + P           명령어 실행 (기능이 생각 안 나면 여기서 검색)\n├─ Ctrl + L           체크박스 생성 (현재 줄을 즉시 할 일 목록으로)\n└─ Ctrl + Enter       체크 완료 / 해제</code></pre>\n<h4>추천 태그 시스템</h4>\n<pre><code>🏷️ 상태 관리 태그\n├─ #할일     아직 시작하지 않은 업무\n├─ #진행중   상담 중이거나 자료 작성 중\n├─ #완료     종결된 업무 및 보고 완료\n├─ #중요     마감 임박 또는 팀장님 보고 사항\n└─ #공부     교육 영업 지식 및 제품 정보</code></pre>\n<h4>추천 플러그인 3선</h4>\n<pre><code>🧩 플러그인\n├─ 📋 Kanban       아이디어 진행 상태 관리  (아이디어 → 작성 중 → 발행 완료)\n├─ 📊 Dataview     흩어진 메모를 표나 리스트로 자동 소환. 각 노트 상단에 속성(Properties) 필수.\n└─ 📝 Templater    양식 통일. Alt + N 한 번으로 정해진 입력 틀 불러오기.</code></pre>\n<blockquote>[!tip] 💡 3가지 원칙</blockquote>\n<blockquote>1. <strong>기록보다 실행</strong> → 도구 세팅에 너무 많은 시간 쓰지 말 것</blockquote>\n<blockquote>2. <strong>데일리 노트 활용</strong> → 매일 아침 '오늘의 할 일'을 체크박스로 먼저 만들기</blockquote>\n<blockquote>3. <strong>검색의 생활화</strong> → 기억 안 나면 폴더 뒤지지 말고 <code>Ctrl + O</code> 로 검색!</blockquote>\n<hr>\n<h3>분야별 커리큘럼 &amp; 수강료 총람</h3>\n<blockquote>단위: 만원 (과목당 단가) · 💡 실제 등록 시 팀장님께 견적 확인 필수</blockquote>\n<pre><code>🎨 아트웍\n&gt; 전 과목 50만원 · 평일 14과목 / 주말 2과목\n\n📅 평일\n├─ 🖊️ 컨셉드로잉 1·2·3\n│     1 인체드로잉 기초 / 2 인체드로잉 기초 / 3 개인별 모작 연습\n├─ 🖥️ 디지털드로잉 1·2·3\n│     1·2 채색, 묘사 중심 / 3 개인별 모작 연습\n├─ 🎞️ 플랫모션 1·2\n│     1 다양한 소스 제작 / 2 개인별 창작 피드백\n├─ 📋 스토리보드 1·2\n│     1 이론 및 작업 / 2 개인별 창작 피드백\n├─ 💡 발상과표현 1·2\n│     1 공간감각, 질감 이해 / 2 디테일한 표현\n└─ 🌈 색채학 1·2\n      1 색채 기본 이론 / 2 분야별 색채 적용\n\n📅 주말\n├─ 🖊️ 컨셉드로잉  50\n└─ 🖥️ 디지털드로잉  50</code></pre>\n<pre><code>🖼️ 시각편집\n&gt; 기초 40~45 / 심화 55 / 포폴 60 · 📌 엔터디렉팅 폐강 → 편집포폴 과정에서 케어 가능\n\n📅 평일\n├─ 🔵 기초 (40)\n│     포토샵 기초 사용방법 / 일러스트 기초 사용방법\n├─ 🟡 중급 (45)\n│     인디자인 기초 사용방법\n│     포토웍스 심화 편집 합성\n│     디일러 복잡한 벡터이미지 소스 제작\n├─ 🔴 심화 (55)\n│     그래픽아트웍 포토+일러 스킬업 창작과정\n│     인포그래픽 정보 시각화\n│     패키지1 기획, 지기구조, 제품연출\n│     패키지2 3D 연출, VMD 이해\n│     브랜딩1 브랜딩 기획, 브랜딩 가이드\n│     브랜딩2 브랜드 아이덴티티 시스템 BIS\n└─ 📁 포트폴리오  60\n\n📅 주말\n├─ 포토샵  40 / 일러스트  40\n├─ 포토웍스  45 / 디일러  45\n├─ GTQ  20 / 그래픽기능사  30\n└─ 컬러리스트  60</code></pre>\n<pre><code>🎬 모션그래픽\n&gt; 에펙 계열 40~50 / 시포디 계열 60 / 주말 시포디 80\n\n📅 평일\n├─ 🎥 영상편집 기초\n│     프리미어  40\n├─ ✨ 에펙 계열 (50)\n│     에펙\n│     모션에펙 플러그인, 3D 카메라트래킹\n│     어드밴스에펙1 촬영 합성\n│     어드밴스에펙2 인포그래픽 영상화\n├─ 🧊 시포디 계열 (60)\n│     시포디1 기초모델링\n│     시포디2 UV, 렌더링, 리깅\n│     시포디3 모그라프\n│     시포디4 1~3 활용 프로젝트\n│     어드밴스시포디1 옥테인렌더\n│     어드밴스시포디2 리얼플로우\n├─ 📁 포폴 (60)\n│     모션포폴 2D / 시포디포폴 3D\n└─ 👴 고령자·유튜브반\n      유크리 기초·심화 (40) / 콘텐츠크리에이터 유튜브 젊은이반 (35)\n\n📅 주말\n├─ 프리미어  40 / 에펙 6주  70\n├─ 모션포폴  60\n└─ 시포디1 6주  80 / 시포디2 6주  80</code></pre>\n<pre><code>🤖 AI 크리에이터\n&gt; 프롬프트 60 / 분야별 응용 50 · 주말은 프롬프트만 운영\n\n📅 평일\n├─ 💬 프롬프트 (60)\n│     AI 프롬프트1 / AI 프롬프트2\n└─ 🎯 분야별 응용 (50)\n      AI 아트웍 / AI 시각디자인 / AI 인테리어\n      AI 모션 / AI CG / AI 유튜브\n\n📅 주말\n└─ AI 프롬프트1 (60) / AI 프롬프트2 (60)</code></pre>\n<pre><code>🖥️ 사무 / OA\n&gt; 기본 40 / 회계·세무 70~75 / 재경관리사 90\n\n📅 평일\n├─ 💻 MOS 워드, PPT, 엑셀  40\n├─ 📊 컴활 엑셀, 엑세스  40\n├─ 🧾 회계1급  70 / 세무2급  70\n└─ 📈 실무엑셀  20\n\n📅 주말\n├─ 💻 MOS  40 / 📊 컴활  40\n├─ 🧾 회계1급  70 / 세무1급 법인세 포함  75\n└─ 🏢 재경관리사 중견·대기업 목표  90</code></pre>\n<pre><code>🌙 방특 과정\n├─ 포토샵  30 / 포토웍스  32 / 일러스트  30 / 디일러  32\n├─ 라이노1  40 / 라이노2  40\n├─ 캐드1  30 / 캐드2  30\n├─ MOS  40 / 컴활  40\n└─ AI 프롬프트1  60 / AI 프롬프트2  60\n\n📺 따즈아 (온라인) 커버 가능 분야\n├─ 🎭 버츄얼강의  Live2D 활용\n├─ 💰 재경  과정 개설 X\n├─ 🌐 제페토  개설 O\n└─ 🖼️ 웹툰리소스·배경  스케치업, 블렌더</code></pre>\n<blockquote>[!note] 📎 출처: 교육팀 과정 설명회 + 김범수 멘토님 자료 · 정리: 펭토 | 2026-02-22</blockquote>","x":"📚 교양 · 생산성 · 기타 지식 !tip 📌 한 줄 요약 자격증 · 경제 상식 · 4차 산업혁명 · ai 역설 · 언어 순화 · 옵시디언 활용법 분야 상관없이 알아두면 쓸모 있는 지식 모음. 목차 · 자격증 체계 · 경제 8대 소득 · 4차 산업혁명 · ai 생산성 역설 · 언어 순화 · 옵시디언 활용 가이드 · 분야별 커리큘럼 & 수강료 총람 자격증 체계 !abstract 자격증 종류, 헷갈리지 말자! 🏛️ 종류별 구분 ├─ 국가전문자격 특정 요건(학력/경력/시험) 필요 예) 공인회계사, 공인중개사 ├─ 국가기술자격 필기 합격 후 실기 응시 예) 전산회계운용사, 컴퓨터활용능력 └─ 민간국가공인 민간 운영이지만 국가 공인 예) 전산회계 📈 등급 체계 └─ 기능사 → 산업기사 → 기사 (기사 = 보통 4년제 졸업 또는 관련 경력 필요) 경제 8대 소득 !abstract 세금 부과 기준이 되는 8가지 소득 종류 💰 8대 소득 ├─ 💵 이자 소득 은행 예금, 적금 등에서 받는 이자 ├─ 📈 배당 소득 주식 보유로 받는 배당금 ├─ 💼 근로 소득 회사에서 받는 월급/급여 ├─ 🏪 사업 소득 자영업/프리랜서 수입 ├─ 🧓 연금 소득 국민연금, 퇴직연금 등 연금 수령액 ├─ 🎲 기타 소득 위 항목에 포함 안 되는 일시적 소득 ├─ 🏠 양도 소득 부동산/주식 등 자산을 팔아서 생긴 차익 └─ 🚪 퇴직 소득 직장 퇴직 시 받는 퇴직금 4차 산업혁명 !abstract 물리적·디지털·생물학적 공간의 경계가 희미해지는 기술 융합의 시대 🌐 핵심 3요소 ├─ 초연결 (hyper connectivity) 모든 사물과 인간이 네트워크로 연결 예) iot, 5g ├─ 초지능 (hyper intelligence) 기계가 스스로 학습하고 판단 예) ai, 빅데이터 └─ 초융합 (hyper convergence) 기술 간 경계가 무너지고 새 가치 창출 예) 디지털 트윈 🔍 일상 속 4차 산업혁명 ├─ 🖥️ 키오스크 유통 자동화의 상징. 디지털 소외 계층 배려 숙제. ├─ 🤖 생성형 ai 단순 계산을 넘어 추론과 창작 수행. 4차 산업혁명의 핵심 엔진. ├─ 🦾 휴머노이드 인간 형태의 로봇. 단순 노동 → 정서적·물리적 상호작용 지향. └─ 🥽 vr / 메타버스 가상과 현실의 경계가 모호해지는 확장판. 교육 멘토에게 필요한 3가지 핵심 무기 !tip 기술에 대체되지 않는 '독보적 가치' 를 구축하자. 🤝 ① 하이터치 (high touch) └─ ai가 진단할 수 없는 학생의 불안감과 동기를 어루만지는 정서적 교감과 공감 능력 📊 ② 데이터 리터러시 (data literacy) └─ 방대한 교육 통계에서 맥락을 읽어 맞춤형 학습 전략을 제시하는 분석력 🧭 ③ 윤리적 큐레이션 └─ 정보의 홍수 속에서 공신력 있는 자료를 선별하고 ai 올바른 활용법을 제시하는 나침반 역할 ai 생산성 역설 !warning ⚠️ ai가 항상 생산성을 높여주는 건 아니다! 📖 핵심 용어 ├─ ai 생산성 역설 ai 도입 후 기대했던 생산성 향상이 즉각 나타나지 않고 │ 초기엔 오히려 정체/저하되는 현상 ├─ ai 수정 비용(acc) ai 결과물의 오류를 식별·수정·재검증하는 데 드는 │ 시간과 인지적 노력 └─ 유사 생산성 빠르게 산출물을 만든 것처럼 보이지만, 실제로는 수정 작업에만 시간을 쏟는 비효율 상태 ⚠️ 빠지기 쉬운 함정 ├─ 재작업의 늪 ai 결과가 미묘하게 어긋나 → 프롬프트 재입력 → 확인 → 수정 무한 반복 ├─ 역자동화 자동화 도구가 오히려 인간 수동 개입을 더 많이 요구하게 되는 주객전도 현상 └─ hitl 병목 ai 처리 속도를 인간 검수자 속도가 따라가지 못해 전체 공정이 지연 !tip 💡 편집세(editing tax) 고려하기 ai 작업 시간 외에 검수·수정 시간을 30~40% 추가 배정해야 납기 지연을 막을 수 있음. ai는 초안/아이디어용 으로 한정. 계약서·수치 보고서는 처음부터 직접 작성. 언어 순화 중복 표현 (옥상옥) ❌ 잘못된 표현 이유 ✅ 올바른 표현 족발 (足발) '발 족(足)' + '발' 중복 → 돼지발 또는 족 동해바다 (東海) '바다 해(海)' + '바다' 중복 → 동해 무궁화꽃 (無窮花) '꽃 화(花)' + '꽃' 중복 → 무궁화 매일매일 (每日) '매일'이 반복 의미 포함 → 매일 과반수 이상 (過半) '과반수' 자체가 절반 초과 → 과반수 일본어 잔재 순화 ❌ 일본어 잔재 ✅ 올바른 우리말 단도리 (段取り) → 채비, 준비, 정리 쿠사리 (腐り) → 면박, 비난, 핀잔 간지 (感じ) → 멋, 본새, 느낌 뿜뿌/펌프질 → 충동질, 부추김 시야게 (仕上げ) → 마무리, 끝손질 !tip 💡 옥상옥 방지법 → \"똑같은 뜻의 한자와 우리말이 겹치지 않았나?\" 1초만 더 생각해보면 훌륭한 문장이 된다. 옵시디언 활용 가이드 핵심 단축키 ⌨️ 자주 쓰는 단축키 ├─ ctrl + o 파일 찾기 (폴더 뒤지지 말고 파일명 검색!) ├─ ctrl + shift + f 전체 검색 (해당 단어가 포함된 모든 문장 나열) ├─ ctrl + p 명령어 실행 (기능이 생각 안 나면 여기서 검색) ├─ ctrl + l 체크박스 생성 (현재 줄을 즉시 할 일 목록으로) └─ ctrl + enter 체크 완료 / 해제 추천 태그 시스템 🏷️ 상태 관리 태그 ├─ 할일 아직 시작하지 않은 업무 ├─ 진행중 상담 중이거나 자료 작성 중 ├─ 완료 종결된 업무 및 보고 완료 ├─ 중요 마감 임박 또는 팀장님 보고 사항 └─ 공부 교육 영업 지식 및 제품 정보 추천 플러그인 3선 🧩 플러그인 ├─ 📋 kanban 아이디어 진행 상태 관리 (아이디어 → 작성 중 → 발행 완료) ├─ 📊 dataview 흩어진 메모를 표나 리스트로 자동 소환. 각 노트 상단에 속성(properties) 필수. └─ 📝 templater 양식 통일. alt + n 한 번으로 정해진 입력 틀 불러오기. !tip 💡 3가지 원칙 1. 기록보다 실행 → 도구 세팅에 너무 많은 시간 쓰지 말 것 2. 데일리 노트 활용 → 매일 아침 '오늘의 할 일'을 체크박스로 먼저 만들기 3. 검색의 생활화 → 기억 안 나면 폴더 뒤지지 말고 ctrl + o 로 검색! 분야별 커리큘럼 & 수강료 총람 단위: 만원 (과목당 단가) · 💡 실제 등록 시 팀장님께 견적 확인 필수 🎨 아트웍 전 과목 50만원 · 평일 14과목 / 주말 2과목 📅 평일 ├─ 🖊️ 컨셉드로잉 1·2·3 │ 1 인체드로잉 기초 / 2 인체드로잉 기초 / 3 개인별 모작 연습 ├─ 🖥️ 디지털드로잉 1·2·3 │ 1·2 채색, 묘사 중심 / 3 개인별 모작 연습 ├─ 🎞️ 플랫모션 1·2 │ 1 다양한 소스 제작 / 2 개인별 창작 피드백 ├─ 📋 스토리보드 1·2 │ 1 이론 및 작업 / 2 개인별 창작 피드백 ├─ 💡 발상과표현 1·2 │ 1 공간감각, 질감 이해 / 2 디테일한 표현 └─ 🌈 색채학 1·2 1 색채 기본 이론 / 2 분야별 색채 적용 📅 주말 ├─ 🖊️ 컨셉드로잉 50 └─ 🖥️ 디지털드로잉 50 🖼️ 시각편집 기초 40~45 / 심화 55 / 포폴 60 · 📌 엔터디렉팅 폐강 → 편집포폴 과정에서 케어 가능 📅 평일 ├─ 🔵 기초 (40) │ 포토샵 기초 사용방법 / 일러스트 기초 사용방법 ├─ 🟡 중급 (45) │ 인디자인 기초 사용방법 │ 포토웍스 심화 편집 합성 │ 디일러 복잡한 벡터이미지 소스 제작 ├─ 🔴 심화 (55) │ 그래픽아트웍 포토+일러 스킬업 창작과정 │ 인포그래픽 정보 시각화 │ 패키지1 기획, 지기구조, 제품연출 │ 패키지2 3d 연출, vmd 이해 │ 브랜딩1 브랜딩 기획, 브랜딩 가이드 │ 브랜딩2 브랜드 아이덴티티 시스템 bis └─ 📁 포트폴리오 60 📅 주말 ├─ 포토샵 40 / 일러스트 40 ├─ 포토웍스 45 / 디일러 45 ├─ gtq 20 / 그래픽기능사 30 └─ 컬러리스트 60 🎬 모션그래픽 에펙 계열 40~50 / 시포디 계열 60 / 주말 시포디 80 📅 평일 ├─ 🎥 영상편집 기초 │ 프리미어 40 ├─ ✨ 에펙 계열 (50) │ 에펙 │ 모션에펙 플러그인, 3d 카메라트래킹 │ 어드밴스에펙1 촬영 합성 │ 어드밴스에펙2 인포그래픽 영상화 ├─ 🧊 시포디 계열 (60) │ 시포디1 기초모델링 │ 시포디2 uv, 렌더링, 리깅 │ 시포디3 모그라프 │ 시포디4 1~3 활용 프로젝트 │ 어드밴스시포디1 옥테인렌더 │ 어드밴스시포디2 리얼플로우 ├─ 📁 포폴 (60) │ 모션포폴 2d / 시포디포폴 3d └─ 👴 고령자·유튜브반 유크리 기초·심화 (40) / 콘텐츠크리에이터 유튜브 젊은이반 (35) 📅 주말 ├─ 프리미어 40 / 에펙 6주 70 ├─ 모션포폴 60 └─ 시포디1 6주 80 / 시포디2 6주 80 🤖 ai 크리에이터 프롬프트 60 / 분야별 응용 50 · 주말은 프롬프트만 운영 📅 평일 ├─ 💬 프롬프트 (60) │ ai 프롬프트1 / ai 프롬프트2 └─ 🎯 분야별 응용 (50) ai 아트웍 / ai 시각디자인 / ai 인테리어 ai 모션 / ai cg / ai 유튜브 📅 주말 └─ ai 프롬프트1 (60) / ai 프롬프트2 (60) 🖥️ 사무 / oa 기본 40 / 회계·세무 70~75 / 재경관리사 90 📅 평일 ├─ 💻 mos 워드, ppt, 엑셀 40 ├─ 📊 컴활 엑셀, 엑세스 40 ├─ 🧾 회계1급 70 / 세무2급 70 └─ 📈 실무엑셀 20 📅 주말 ├─ 💻 mos 40 / 📊 컴활 40 ├─ 🧾 회계1급 70 / 세무1급 법인세 포함 75 └─ 🏢 재경관리사 중견·대기업 목표 90 🌙 방특 과정 ├─ 포토샵 30 / 포토웍스 32 / 일러스트 30 / 디일러 32 ├─ 라이노1 40 / 라이노2 40 ├─ 캐드1 30 / 캐드2 30 ├─ mos 40 / 컴활 40 └─ ai 프롬프트1 60 / ai 프롬프트2 60 📺 따즈아 (온라인) 커버 가능 분야 ├─ 🎭 버츄얼강의 live2d 활용 ├─ 💰 재경 과정 개설 x ├─ 🌐 제페토 개설 o └─ 🖼️ 웹툰리소스·배경 스케치업, 블렌더 !note 📎 출처: 교육팀 과정 설명회 + 김범수 멘토님 자료 · 정리: 펭토 2026 02 22"},"99_시스템/03_학과지식/모션학과_지식_통합본.md":{"t":"모션학과 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>🎬 모션학과 지식 통합본</h3>\n<p>모션학과의 정의와 활용 분야, 프로그램·툴, Phase 1~4 커리큘럼, 취업 진로, 상담 포인트, 용어 해설을 한 문서에 모은 지식 통합본이다.</p>\n<p>정지된 그래픽에 움직임과 효과를 더해 영상을 디자인하는 분야를 다루며, 에펙·시네마4D 파이프라인과 AI 시대 취업 전략까지 포함한다.</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(프리미어실전→AIX 실전영상, 에펙·모션에펙→AIX 2D모션디자인). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<blockquote>출처 파일: 260227 강의 보고서 / 260206 김석민 학과장 / 260211 장원희 팀장 / 260222 최○○ 과정교육 / 🎬_모션영상_학과_교육노트</blockquote>\n<blockquote>최종 통합: 2026-02-28</blockquote>\n<blockquote>태그: #모션그래픽 #에펙 #C4D #Cinema4D #커리큘럼 #취업진로 #상담가이드</blockquote>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>1-1. 정의</h4>\n<ul><li>\n<strong>모션그래픽</strong> = 모션(움직임) + 그래픽(디자인 요소) → 정지된 그래픽(텍스트, 이미지)에 움직임과 효과를 더해 <strong>영상을 디자인</strong>하는 것\n</li><li>\n핵심 원칙: &quot;안 움직이는 걸 만들 수 있어야 움직이는 걸 만든다!&quot;\n</li><li>\n<strong>모션학과 = CG학과에서 안 하는 거 다 한다!</strong>\n<ul><li>\nCG학과: 영화 VFX(Visual Effects) 중심, Maya 기반, 목적이 매우 뚜렷함\n</li><li>\n모션학과: CG를 제외한 주변의 모든 움직이는 영상 담당 (뉴스 사화, 지하철 광고판 등)\n</li></ul>\n</li></ul>\n<h4>1-2. 활용 분야 (OAP 포함)</h4>\n<div class=\"tw\"><table><thead><tr><th>분야</th><th>세부 내용</th></tr></thead><tbody><tr><td>방송</td><td>OAP(채널 ID, 예고편, 연령 고지, 로고 영상), 방송 타이틀</td></tr><tr><td>광고</td><td>TVC 광고, 그래픽으로만 이루어진 3D 모션 광고</td></tr><tr><td>영화/드라마</td><td>오프닝 타이틀 시퀀스, 실사+2D 그래픽 합성</td></tr><tr><td>뮤직비디오</td><td>실사 + 그래픽 합성</td></tr><tr><td>전시/미디어아트</td><td>프로젝션 매핑, 현대식 영상미 표현</td></tr><tr><td>인포그래픽</td><td>옥외광고, 지하철, 정보전달 영상</td></tr><tr><td>디지털 사이니지</td><td>전광판(DOOH), 키오스크</td></tr><tr><td>게임/웹/모바일</td><td>게임 영상, 웹·앱 UI 모션</td></tr></tbody></table></div>\n<ul><li>\n<strong>장점:</strong> 거의 모든 영상 분야에서 필요로 하므로 진출 분야가 매우 넓음\n</li></ul>\n<h4>1-3. 2D vs 3D 구분</h4>\n<ul><li>\n<strong>D = Dimension(차원)</strong> → 그림자와 입체감의 차이 외에는 기본 개념 동일\n</li><li>\n<strong>2D 모션 (평면):</strong> 인포그래픽, 타이포그래피, 평면적 트렌디 영상, 합성(사진→영상 활용)\n</li><li>\n<strong>3D 모션 (입체):</strong> 2D를 포함함. 모델링·라이팅·카메라·재질·시뮬레이션으로 실제 구현 불가능한 임팩트 있는 영상 제작 가능\n</li><li>\n<strong>관계:</strong> 3D를 더 완성도 있게 만들기 위해서는 2D를 잘 다룰 수 있어야 함. 보통 3D 작업물을 에펙으로 퀄업함.\n</li></ul>\n<hr>\n<h3>2. 프로그램 및 툴</h3>\n<h4>2-1. 전체 학과 사용 프로그램 흐름</h4>\n<pre><code>포토샵 → 일러스트레이터 → 애프터이펙트(2D) → 시네마4D(3D)\n└── 일러까지: 소스 제작 활용\n└── 에펙까지: 2D 과정\n└── 시포디: 3D 과정</code></pre>\n<ul><li>\n기본기 수업으로 추천: 색채학(색감) / 발상과표현(기본지식) / 해부학(움직임 표현) / 디지털드로잉 / 프리미어프로(유튜브 편집·자막 등)\n</li></ul>\n<h4>2-2. 프리미어 프로 (Premiere Pro)</h4>\n<ul><li>\n어도비사의 영상 편집 프로그램\n</li><li>\n<strong>1차 편집:</strong> 컷 편집, 자막 넣기 등\n</li><li>\n브이로그 등 영상미 중시 영상 제작 추천\n</li><li>\n진입장벽 낮음\n</li><li>\n간단 편집은 프리미어가 에펙보다 적합할 수 있음\n</li></ul>\n<h4>2-3. 애프터 이펙트 (After Effects, 에펙)</h4>\n<ul><li>\n어도비사의 영상 합성·편집 프로그램\n</li><li>\n<strong>2차 편집:</strong> 합성, 효과, 필터 적용 등\n</li><li>\n모션그래픽·영화·애니·광고산업의 필수 제작/합성 툴\n</li><li>\n활용: 타이포그래피, 정보전달, 게임방송, 버튜버, 예능 영상, FAKE 3D 등\n</li><li>\n프리미어보다 어려움\n</li></ul>\n<p><strong>에펙 핵심 기능</strong></p>\n<ul><li>\n레이어 구조\n</li><li>\n타임라인의 키프레임으로 움직임 제작\n</li><li>\n키프레임 그래프로 다이나믹 모션 제작 (★ 그래프 조절 = 모션감 결정)\n</li><li>\n마스크(Mask): 펜툴(Path) + 불리언(Boolean) 개념. 가리거나 나타나게 할 때 사용\n</li><li>\n이펙트 적용으로 다양한 연출 (플러그인 사용 가능)\n</li><li>\n익스프레션(표현식): 특정 수치를 입력해 움직임을 연결·확장\n</li><li>\n3D 레이어, 퍼펫 툴, 페어런트\n</li></ul>\n<p><strong>에펙 플러그인 목록</strong></p>\n<div class=\"tw\"><table><thead><tr><th>플러그인</th><th>기능</th></tr></thead><tbody><tr><td>트랩코드 (Trapcode / Particular)</td><td>눈·비·불꽃·먼지 등 입자(Particle) 생성. 화려한 효과 필수 플러그인</td></tr><tr><td>폼 (Form)</td><td>거품·보케 등. 파티큘러와 유사. 점·선·면으로 구성된 유기적 파티클 그리드</td></tr><tr><td>뉴턴 (Newton)</td><td>중력·물리 엔진. 중력 기반 오브젝트 동작</td></tr><tr><td>DUIK (듀익)</td><td>캐릭터 팔다리에 뼈를 심어주는(리깅) 무료 최강 플러그인</td></tr><tr><td>세이버 (Saber)</td><td>광선검·네온사인·광선 효과</td></tr><tr><td>루프플로우</td><td>물이나 옷 등이 흐르는 표현</td></tr><tr><td>오미노</td><td>글리치 표현</td></tr><tr><td>코노아</td><td>화면을 구부리거나 찌그러뜨림</td></tr></tbody></table></div>\n<h4>2-4. 시네마4D (Cinema 4D, 시포디)</h4>\n<ul><li>\nMaxon사 (지브러시·레드시프트·레드자이언트 인수) 모델링·애니메이션·렌더 소프트웨어\n</li><li>\n어도비와 자유롭게 연동 가능\n</li><li>\n빠른 시뮬레이션 속도\n</li><li>\n타 3D 툴 대비 가볍고 배우기 쉬움 / 직관적인 UX\n</li><li>\nxpresso(노드 기반)를 이용한 움직임 확장\n</li></ul>\n<p><strong>시포디 핵심 기능</strong></p>\n<ul><li>\n모델링: 기계적 형태(Hard Surface) vs 유기적 형태(Organic)\n</li><li>\n재질(Material)·라이팅(Lighting)·카메라(역동적 연출)\n</li><li>\n모그라프(MoGraph): 특정 오브젝트를 복사해 다양한 형태(군집체 등)로 표현\n</li><li>\n디포머(Deformer) 기능\n</li><li>\n시뮬레이션: Bullet(충돌)·Cloth(천)·Hair(털)\n</li><li>\n맵핑(오브젝트 감싸기)·리깅(생동감 있는 움직임)\n</li><li>\n렌더링(영상 출력)\n</li></ul>\n<p><strong>시포디 어드밴스드 플러그인</strong></p>\n<div class=\"tw\"><table><thead><tr><th>플러그인</th><th>기능</th></tr></thead><tbody><tr><td>옥테인 (Octane)</td><td>실시간 렌더러. 스탠다드 렌더러와 비교 불가한 실사 퀄리티. 실무용</td></tr><tr><td>리얼플로우 (RealFlow)</td><td>물·파도 등 고난이도 유체 시뮬레이션 끝판왕 툴</td></tr></tbody></table></div>\n<p><strong>시포디→에펙 파이프라인</strong></p>\n<blockquote>시포디로 3D 요소 작업(모델링/재질/라이팅/카메라/모션/렌더링) → 에펙으로 최종 렌더링(내부효과·플러그인·멀티패스를 활용한 후반작업)</blockquote>\n<h4>2-5. AI 도구</h4>\n<ul><li>\n<strong>주요 AI 툴:</strong> ChatGPT, Sora, Veo, CapCut, Vrew, Leonardo AI, Suno, Recraft, Typecast\n</li><li>\n<strong>어도비 센세이:</strong> 어도비 편집용 AI 보조 시스템 적극 활용\n</li><li>\n<strong>Veo vs Runway:</strong> Runway는 트렌드에서 밀리는 추세. Veo의 텍스트 이해도·영상 퀄리티 우세\n</li></ul>\n<hr>\n<h3>3. 커리큘럼</h3>\n<h4>3-1. 전체 로드맵 (1~12개월)</h4>\n<h5>Phase 1 → 디자인 기초 및 소스 제작</h5>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>기간</th><th>내용</th></tr></thead><tbody><tr><td>포토샵</td><td>평일/주말 1개월</td><td>툴 기본 사용법, 사진 보정</td></tr><tr><td>포토웍스 심화</td><td>1개월</td><td>심화 예제, 고급 테크닉</td></tr><tr><td>일러스트레이터</td><td>1개월</td><td>벡터 이미지 편집·제작 기초</td></tr><tr><td>디일러 심화</td><td>1개월</td><td>일러스트 심화 활용, 고급 테크닉</td></tr><tr><td>플랫 모션</td><td>-</td><td>모션 그래픽 소스 제작, 나만의 그림체 만들기</td></tr></tbody></table></div>\n<h5>Phase 2 → 영상 입문 및 실전 편집 (Core)</h5>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>기간</th><th>내용</th></tr></thead><tbody><tr><td>프리미어 실전</td><td>1개월</td><td>컷 편집, 자막 움직임, 영상 구성 이해</td></tr><tr><td>에펙 1 (기초) ⭐</td><td>1개월</td><td>&quot;영상 입문의 핵심이자 척도!&quot; 키프레임, 마스크, 매트 이해. <strong>에펙 1→2 반드시 순차 수강</strong></td></tr><tr><td>에펙 2 / 모션 에펙</td><td>1개월</td><td>3D 카메라, 타이포그래피, 파티클 플러그인(Trapcode), Duik 캐릭터 애니메이션. 야외 촬영 후 파티클·트래킹 시각 효과 합성</td></tr><tr><td>AI 크리에이터 (유튜브)</td><td>1개월</td><td>Sora, Veo, CapCut, Vrew 활용 워크플로우</td></tr></tbody></table></div>\n<h5>Phase 3 → 심화 기술 및 3D 모션 (Advanced)</h5>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>기간</th><th>내용</th></tr></thead><tbody><tr><td>어드밴스드 에펙 1</td><td>1개월</td><td>영화 산업 중심 묵직한 영상 합성. DSLR 촬영 소스 + 3D Camera Tracking으로 실사 합성</td></tr><tr><td>어드밴스드 에펙 2</td><td>1개월</td><td>정보 전달 중심 유동적 모션 인포그래픽. 단순 이미지가 아닌 '움직이는 정보' 표현</td></tr><tr><td>시포디 1</td><td>1개월</td><td>모델링 위주. 기계적 형태 vs 유기적 형태. &quot;회색 화면을 견뎌야 하는 고통의 첫 관문&quot;</td></tr><tr><td>시포디 2</td><td>1개월</td><td>룩뎁/애니: 재질·라이팅 이해, 렌더링 및 에펙 후반작업 기초. 리깅·텍스처·애니메이션. 가장 바쁘고 밀도 높은 달</td></tr><tr><td>시포디 3</td><td>1개월</td><td>MoGraph 집중 학습. 물리법칙 적용 Bullet(충돌)·Cloth(천)·Hair(털) 시뮬레이션</td></tr><tr><td>시포디 4</td><td>1개월</td><td>실전 프로젝트: 1~3 과정 종합. 모델링부터 컴포지팅까지 영상 모작 실습 완주</td></tr><tr><td>어드밴스드 시포디 1</td><td>1개월</td><td>옥테인 렌더러 심화 활용</td></tr><tr><td>어드밴스드 시포디 2</td><td>1개월</td><td>RealFlow 등 활용 고난이도 유체(물·파도) 시뮬레이션. 2D와 3D 융합 작업</td></tr><tr><td>콘텐츠 크리에이터</td><td>1개월</td><td>유튜브 기획, 수익 모델 분석, 구독자 증대 전략</td></tr><tr><td>유튜브 크리에이터 심화</td><td>1개월</td><td>개별 채널 컨설팅, 촬영·편집 심화</td></tr></tbody></table></div>\n<h5>Phase 4 → 포트폴리오</h5>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>기간</th><th>내용</th></tr></thead><tbody><tr><td>2D/3D 모션 포트폴리오</td><td>2~3개월</td><td>개별 프로젝트 관리, 취업용 포폴 제작. 1대1 대면 피드백으로 완성도 극대화</td></tr></tbody></table></div>\n<h4>3-2. 포트폴리오 제작 프로세스 (5단계)</h4>\n<blockquote>Tip: 주제 제한 없음. &quot;입력을 많이 해야 출력(아이디어)이 나온다&quot; → 레퍼런스 다다익선</blockquote>\n<ul><li>\n<strong>주제 설정 및 레퍼런스 수집</strong> → 트랜지션·요소 표현 등 다양한 소스를 머리에 입력. 하나만 보지 말 것\n</li><li>\n<strong>스토리보드 작성 (★ 가장 중요)</strong> → 단순 스케치가 아님. 구도·컬러·모션감 등 모든 결정을 끝내는 단계. 작업 진입 후에는 기술 해결에 바빠 디자인 고민 불가\n</li><li>\n<strong>모델링 및 재질 작업</strong> → 실무(광고) 수준의 퀄리티 필요. 한 번에 안 나옴, 여러 번 시도 후 최선 선택\n</li><li>\n<strong>씬 구성 및 모션 작업</strong> → 계획대로 배치하고 움직임 부여\n</li><li>\n<strong>렌더 및 후반 작업</strong> → 최종 렌더링 후 에펙(AE)으로 색보정(Color Correction) 및 효과 추가\n</li></ul>\n<hr>\n<h3>4. 취업 및 진로</h3>\n<h4>4-1. 주요 취업처 현실 분석</h4>\n<div class=\"tw\"><table><thead><tr><th>취업처</th><th>특징</th></tr></thead><tbody><tr><td>방송국</td><td>안정적이나 채용 규모(TO)가 적어 진입이 까다로움</td></tr><tr><td>광고·게임 회사</td><td>직접 제작이 아닌 기획 위주. 실제 제작은 외부 스튜디오에 외주 진행</td></tr><tr><td>외부 스튜디오</td><td>실제 영상 제작이 이루어지는 곳. 구현 능력이 핵심</td></tr></tbody></table></div>\n<h4>4-2. 취업 핵심 전략</h4>\n<ul><li>\n<strong>구현 능력 우선:</strong> 기획·연출보다 시각적 구현 능력을 먼저 키워야 함\n</li><li>\n<strong>2D 필수:</strong> 3D 단가가 매우 비싸기 때문에 실무에서는 2D 영상 수요가 훨씬 많음. 3D 전문 인력이라도 2D 서포트 능력 없으면 채용 경쟁력 크게 하락\n</li><li>\n<strong>포트폴리오:</strong> 본인 실력이 부족하면 진입 자체가 불가. 1대1 대면 피드백으로 완성도 극대화 필수\n</li></ul>\n<h4>4-3. AI 시대 취업 전략</h4>\n<ul><li>\n<strong>AI는 거들 뿐:</strong> AI 기술 자체보다 AI를 '다루는 법'을 배우는 것이 본질\n</li><li>\n<strong>올바른 AI 파이프라인:</strong>\n<ul><li>\nAI 영상 소스 생성 및 에셋 확보\n</li><li>\n애프터이펙트·시네마4D로 정교한 후반 작업 및 시각 효과 디테일 추가\n</li></ul>\n</li><li>\nAI로 시간(컷 편집·자막·초안)을 벌고, 에펙·고급 툴로 차별화된 퀄리티 확보 → 필승 취업 전략\n</li><li>\nSchool of Motion 트렌드 분석: AI 툴 발전 → 모션 디자이너의 역할은 단순 에셋 생성을 넘어 에펙·C4D를 활용한 세밀한 컴포지팅(합성)과 연출 교정으로 진화. 최종 결과물의 상업적 퀄리티를 완성하는 것은 여전히 2D/3D 툴의 숙련도에 달려있음\n</li></ul>\n<h4>4-4. 프리랜서 현실</h4>\n<ul><li>\n신입 프리랜서는 포트폴리오와 인맥이 없어 사실상 일 수주 불가\n</li><li>\n실무에서 충분한 경력을 쌓고 커넥션 100% 확보 후 전향해야 안전\n</li></ul>\n<hr>\n<h3>5. 상담 포인트</h3>\n<h4>5-1. 학과 선택 가이드</h4>\n<ul><li>\n&quot;영상 제작 딥하게 하기 싫어!&quot; → <strong>유튜브 학과</strong> (Light / 기획 중심)\n</li><li>\n&quot;영상 제작 딥하게 해볼래!&quot; → <strong>모션 학과</strong> (Deep / 기술 중심)\n</li><li>\n첫 질문: *&quot;어떤 영상 만들고 싶으세요?&quot;*\n</li></ul>\n<h4>5-2. 상담 시 팩트체크 포인트</h4>\n<ul><li>\n<strong>모션학과 목표는 '기획'이 아닌 '완벽한 시각적 구현'</strong> → 기획·연출보다 구현 능력이 먼저\n</li><li>\n<strong>3D 편식 주의</strong> → 2D 없는 3D는 경쟁력 없음. 광고 수요는 2D가 압도적\n</li><li>\n<strong>프리랜서 환상 방지</strong> → 신입 프리는 일 수주 사실상 불가. 실무 경력+커넥션 후 전향\n</li><li>\n<strong>AI 만능 환상 방지</strong> → AI 결과물만으로는 실무 퀄리티 불충분. 에펙·C4D 후가공 필수\n</li></ul>\n<h4>5-3. 현업 현실 공유 순서 (신뢰도 확보)</h4>\n<ul><li>\n현업 취업처별 현실 먼저 알려주기 (방송국·광고사·스튜디오 차이)\n</li><li>\n2D의 절대적 중요성 강조\n</li><li>\nAI 파이프라인 설명으로 미래지향적 학습 방향 제시\n</li><li>\n포트폴리오의 중요성과 1대1 피드백 시스템 소개\n</li></ul>\n<h4>5-4. 멘토 무기화 전략</h4>\n<ul><li>\n<strong>형태(CG) + 질감(서페이싱) + 움직임(모션):</strong> 3가지가 합쳐져야 진정한 고품질 영상\n</li><li>\n<strong>편집 사고:</strong> 단순 툴 사용법보다 &quot;콘텐츠 기획 및 편집적 사고&quot;가 상위 개념\n</li><li>\n<strong>AI(생산성) + 인간(디테일):</strong> 필승 취업 전략\n</li></ul>\n<hr>\n<h3>6. 용어 해설 (Glossary)</h3>\n<div class=\"tw\"><table><thead><tr><th>용어</th><th>설명</th></tr></thead><tbody><tr><td>OAP</td><td>On-Air Promotion. 방송국 영상 디자인(채널 ID, 예고편 등) 통칭. 모션그래픽 주요 진출 분야</td></tr><tr><td>키프레임 (Keyframe)</td><td>움직임의 '시점'과 '종점'을 찍는 것. 그 사이 속도 변화(텐션)를 그래프로 조절하는 것이 실력</td></tr><tr><td>마스크 (Mask)</td><td>에펙에서 오브젝트를 가리거나 나타나게 하는 기법. 펜툴(Path) + 불리언(Boolean) 개념</td></tr><tr><td>트랩코드 (Trapcode / Particular)</td><td>에펙에서 눈·비·불꽃·먼지 같은 파티클을 화려하게 만드는 필수 플러그인</td></tr><tr><td>DUIK (듀익)</td><td>에펙에서 캐릭터 팔다리에 뼈를 심어주는(리깅) 무료 최강 플러그인</td></tr><tr><td>3D 카메라 트래킹</td><td>컴퓨터가 촬영된 영상의 입체 공간을 분석해 가상 카메라를 만들어주는 기술. 영상 합성의 핵심</td></tr><tr><td>모그라프 (MoGraph)</td><td>C4D의 특정 오브젝트를 복사해 다양한 형태(군집체 등)로 표현하는 기능</td></tr><tr><td>렌더러 (Octane 등)</td><td>3D 데이터를 사진/영상으로 인화해주는 존재. '카메라 앱' 같은 역할</td></tr><tr><td>리얼플로우 (RealFlow)</td><td>물 튀기는 효과 만드는 끝판왕 시뮬레이션 툴</td></tr><tr><td>인포그래픽</td><td>정보전달 중심의 움직이는 그래픽. 옥외광고, 지하철 등에 활용</td></tr><tr><td>컴포지팅 (Compositing)</td><td>여러 영상·그래픽 소스를 합성하여 하나의 완성된 영상으로 만드는 후반 작업</td></tr><tr><td>Hard Surface</td><td>C4D에서 기계적·딱딱한 형태의 모델링</td></tr><tr><td>Organic</td><td>C4D에서 유기적·부드러운 형태의 모델링</td></tr><tr><td>프로젝션 매핑</td><td>건물이나 물체 표면에 영상을 투영하는 미디어아트 기법</td></tr></tbody></table></div>\n<hr>\n<h3>7. 참고 출처</h3>\n<ul><li>\nSchool of Motion → &quot;The Future of Motion Design&quot; (schoolofmotion.com/blog)\n</li><li>\n에펙 참고 자료: <a href=\"https://blog.naver.com/sbs_leesu/223830015202\" target=\"_blank\" rel=\"noopener\">https://blog.naver.com/sbs_leesu/223830015202</a>\n</li><li>\n시네마4D 용어 정리: 시포디 공식 홈페이지 참고\n</li></ul>","x":"🎬 모션학과 지식 통합본 모션학과의 정의와 활용 분야, 프로그램·툴, phase 1~4 커리큘럼, 취업 진로, 상담 포인트, 용어 해설을 한 문서에 모은 지식 통합본이다. 정지된 그래픽에 움직임과 효과를 더해 영상을 디자인하는 분야를 다루며, 에펙·시네마4d 파이프라인과 ai 시대 취업 전략까지 포함한다. aix 커리큘럼 개편(2026 09~) 적용 예정. 9월 이후 개강·상담은 aix_커리큘럼개편_260715 을 정본으로 우선 확인할 것(프리미어실전→aix 실전영상, 에펙·모션에펙→aix 2d모션디자인). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨. 출처 파일: 260227 강의 보고서 / 260206 김석민 학과장 / 260211 장원희 팀장 / 260222 최○○ 과정교육 / 🎬_모션영상_학과_교육노트 최종 통합: 2026 02 28 태그: 모션그래픽 에펙 c4d cinema4d 커리큘럼 취업진로 상담가이드 1. 학과 개요 1 1. 정의 모션그래픽 = 모션(움직임) + 그래픽(디자인 요소) → 정지된 그래픽(텍스트, 이미지)에 움직임과 효과를 더해 영상을 디자인 하는 것 핵심 원칙: \"안 움직이는 걸 만들 수 있어야 움직이는 걸 만든다!\" 모션학과 = cg학과에서 안 하는 거 다 한다! cg학과: 영화 vfx(visual effects) 중심, maya 기반, 목적이 매우 뚜렷함 모션학과: cg를 제외한 주변의 모든 움직이는 영상 담당 (뉴스 사화, 지하철 광고판 등) 1 2. 활용 분야 (oap 포함) 분야 세부 내용 방송 oap(채널 id, 예고편, 연령 고지, 로고 영상), 방송 타이틀 광고 tvc 광고, 그래픽으로만 이루어진 3d 모션 광고 영화/드라마 오프닝 타이틀 시퀀스, 실사+2d 그래픽 합성 뮤직비디오 실사 + 그래픽 합성 전시/미디어아트 프로젝션 매핑, 현대식 영상미 표현 인포그래픽 옥외광고, 지하철, 정보전달 영상 디지털 사이니지 전광판(dooh), 키오스크 게임/웹/모바일 게임 영상, 웹·앱 ui 모션 장점: 거의 모든 영상 분야에서 필요로 하므로 진출 분야가 매우 넓음 1 3. 2d vs 3d 구분 d = dimension(차원) → 그림자와 입체감의 차이 외에는 기본 개념 동일 2d 모션 (평면): 인포그래픽, 타이포그래피, 평면적 트렌디 영상, 합성(사진→영상 활용) 3d 모션 (입체): 2d를 포함함. 모델링·라이팅·카메라·재질·시뮬레이션으로 실제 구현 불가능한 임팩트 있는 영상 제작 가능 관계: 3d를 더 완성도 있게 만들기 위해서는 2d를 잘 다룰 수 있어야 함. 보통 3d 작업물을 에펙으로 퀄업함. 2. 프로그램 및 툴 2 1. 전체 학과 사용 프로그램 흐름 포토샵 → 일러스트레이터 → 애프터이펙트(2d) → 시네마4d(3d) └── 일러까지: 소스 제작 활용 └── 에펙까지: 2d 과정 └── 시포디: 3d 과정 기본기 수업으로 추천: 색채학(색감) / 발상과표현(기본지식) / 해부학(움직임 표현) / 디지털드로잉 / 프리미어프로(유튜브 편집·자막 등) 2 2. 프리미어 프로 (premiere pro) 어도비사의 영상 편집 프로그램 1차 편집: 컷 편집, 자막 넣기 등 브이로그 등 영상미 중시 영상 제작 추천 진입장벽 낮음 간단 편집은 프리미어가 에펙보다 적합할 수 있음 2 3. 애프터 이펙트 (after effects, 에펙) 어도비사의 영상 합성·편집 프로그램 2차 편집: 합성, 효과, 필터 적용 등 모션그래픽·영화·애니·광고산업의 필수 제작/합성 툴 활용: 타이포그래피, 정보전달, 게임방송, 버튜버, 예능 영상, fake 3d 등 프리미어보다 어려움 에펙 핵심 기능 레이어 구조 타임라인의 키프레임으로 움직임 제작 키프레임 그래프로 다이나믹 모션 제작 (★ 그래프 조절 = 모션감 결정) 마스크(mask): 펜툴(path) + 불리언(boolean) 개념. 가리거나 나타나게 할 때 사용 이펙트 적용으로 다양한 연출 (플러그인 사용 가능) 익스프레션(표현식): 특정 수치를 입력해 움직임을 연결·확장 3d 레이어, 퍼펫 툴, 페어런트 에펙 플러그인 목록 플러그인 기능 트랩코드 (trapcode / particular) 눈·비·불꽃·먼지 등 입자(particle) 생성. 화려한 효과 필수 플러그인 폼 (form) 거품·보케 등. 파티큘러와 유사. 점·선·면으로 구성된 유기적 파티클 그리드 뉴턴 (newton) 중력·물리 엔진. 중력 기반 오브젝트 동작 duik (듀익) 캐릭터 팔다리에 뼈를 심어주는(리깅) 무료 최강 플러그인 세이버 (saber) 광선검·네온사인·광선 효과 루프플로우 물이나 옷 등이 흐르는 표현 오미노 글리치 표현 코노아 화면을 구부리거나 찌그러뜨림 2 4. 시네마4d (cinema 4d, 시포디) maxon사 (지브러시·레드시프트·레드자이언트 인수) 모델링·애니메이션·렌더 소프트웨어 어도비와 자유롭게 연동 가능 빠른 시뮬레이션 속도 타 3d 툴 대비 가볍고 배우기 쉬움 / 직관적인 ux xpresso(노드 기반)를 이용한 움직임 확장 시포디 핵심 기능 모델링: 기계적 형태(hard surface) vs 유기적 형태(organic) 재질(material)·라이팅(lighting)·카메라(역동적 연출) 모그라프(mograph): 특정 오브젝트를 복사해 다양한 형태(군집체 등)로 표현 디포머(deformer) 기능 시뮬레이션: bullet(충돌)·cloth(천)·hair(털) 맵핑(오브젝트 감싸기)·리깅(생동감 있는 움직임) 렌더링(영상 출력) 시포디 어드밴스드 플러그인 플러그인 기능 옥테인 (octane) 실시간 렌더러. 스탠다드 렌더러와 비교 불가한 실사 퀄리티. 실무용 리얼플로우 (realflow) 물·파도 등 고난이도 유체 시뮬레이션 끝판왕 툴 시포디→에펙 파이프라인 시포디로 3d 요소 작업(모델링/재질/라이팅/카메라/모션/렌더링) → 에펙으로 최종 렌더링(내부효과·플러그인·멀티패스를 활용한 후반작업) 2 5. ai 도구 주요 ai 툴: chatgpt, sora, veo, capcut, vrew, leonardo ai, suno, recraft, typecast 어도비 센세이: 어도비 편집용 ai 보조 시스템 적극 활용 veo vs runway: runway는 트렌드에서 밀리는 추세. veo의 텍스트 이해도·영상 퀄리티 우세 3. 커리큘럼 3 1. 전체 로드맵 (1~12개월) phase 1 → 디자인 기초 및 소스 제작 과정 기간 내용 포토샵 평일/주말 1개월 툴 기본 사용법, 사진 보정 포토웍스 심화 1개월 심화 예제, 고급 테크닉 일러스트레이터 1개월 벡터 이미지 편집·제작 기초 디일러 심화 1개월 일러스트 심화 활용, 고급 테크닉 플랫 모션 모션 그래픽 소스 제작, 나만의 그림체 만들기 phase 2 → 영상 입문 및 실전 편집 (core) 과정 기간 내용 프리미어 실전 1개월 컷 편집, 자막 움직임, 영상 구성 이해 에펙 1 (기초) ⭐ 1개월 \"영상 입문의 핵심이자 척도!\" 키프레임, 마스크, 매트 이해. 에펙 1→2 반드시 순차 수강 에펙 2 / 모션 에펙 1개월 3d 카메라, 타이포그래피, 파티클 플러그인(trapcode), duik 캐릭터 애니메이션. 야외 촬영 후 파티클·트래킹 시각 효과 합성 ai 크리에이터 (유튜브) 1개월 sora, veo, capcut, vrew 활용 워크플로우 phase 3 → 심화 기술 및 3d 모션 (advanced) 과정 기간 내용 어드밴스드 에펙 1 1개월 영화 산업 중심 묵직한 영상 합성. dslr 촬영 소스 + 3d camera tracking으로 실사 합성 어드밴스드 에펙 2 1개월 정보 전달 중심 유동적 모션 인포그래픽. 단순 이미지가 아닌 '움직이는 정보' 표현 시포디 1 1개월 모델링 위주. 기계적 형태 vs 유기적 형태. \"회색 화면을 견뎌야 하는 고통의 첫 관문\" 시포디 2 1개월 룩뎁/애니: 재질·라이팅 이해, 렌더링 및 에펙 후반작업 기초. 리깅·텍스처·애니메이션. 가장 바쁘고 밀도 높은 달 시포디 3 1개월 mograph 집중 학습. 물리법칙 적용 bullet(충돌)·cloth(천)·hair(털) 시뮬레이션 시포디 4 1개월 실전 프로젝트: 1~3 과정 종합. 모델링부터 컴포지팅까지 영상 모작 실습 완주 어드밴스드 시포디 1 1개월 옥테인 렌더러 심화 활용 어드밴스드 시포디 2 1개월 realflow 등 활용 고난이도 유체(물·파도) 시뮬레이션. 2d와 3d 융합 작업 콘텐츠 크리에이터 1개월 유튜브 기획, 수익 모델 분석, 구독자 증대 전략 유튜브 크리에이터 심화 1개월 개별 채널 컨설팅, 촬영·편집 심화 phase 4 → 포트폴리오 과정 기간 내용 2d/3d 모션 포트폴리오 2~3개월 개별 프로젝트 관리, 취업용 포폴 제작. 1대1 대면 피드백으로 완성도 극대화 3 2. 포트폴리오 제작 프로세스 (5단계) tip: 주제 제한 없음. \"입력을 많이 해야 출력(아이디어)이 나온다\" → 레퍼런스 다다익선 1. 주제 설정 및 레퍼런스 수집 → 트랜지션·요소 표현 등 다양한 소스를 머리에 입력. 하나만 보지 말 것 2. 스토리보드 작성 (★ 가장 중요) → 단순 스케치가 아님. 구도·컬러·모션감 등 모든 결정을 끝내는 단계. 작업 진입 후에는 기술 해결에 바빠 디자인 고민 불가 3. 모델링 및 재질 작업 → 실무(광고) 수준의 퀄리티 필요. 한 번에 안 나옴, 여러 번 시도 후 최선 선택 4. 씬 구성 및 모션 작업 → 계획대로 배치하고 움직임 부여 5. 렌더 및 후반 작업 → 최종 렌더링 후 에펙(ae)으로 색보정(color correction) 및 효과 추가 4. 취업 및 진로 4 1. 주요 취업처 현실 분석 취업처 특징 방송국 안정적이나 채용 규모(to)가 적어 진입이 까다로움 광고·게임 회사 직접 제작이 아닌 기획 위주. 실제 제작은 외부 스튜디오에 외주 진행 외부 스튜디오 실제 영상 제작이 이루어지는 곳. 구현 능력이 핵심 4 2. 취업 핵심 전략 구현 능력 우선: 기획·연출보다 시각적 구현 능력을 먼저 키워야 함 2d 필수: 3d 단가가 매우 비싸기 때문에 실무에서는 2d 영상 수요가 훨씬 많음. 3d 전문 인력이라도 2d 서포트 능력 없으면 채용 경쟁력 크게 하락 포트폴리오: 본인 실력이 부족하면 진입 자체가 불가. 1대1 대면 피드백으로 완성도 극대화 필수 4 3. ai 시대 취업 전략 ai는 거들 뿐: ai 기술 자체보다 ai를 '다루는 법'을 배우는 것이 본질 올바른 ai 파이프라인: 1. ai 영상 소스 생성 및 에셋 확보 2. 애프터이펙트·시네마4d로 정교한 후반 작업 및 시각 효과 디테일 추가 ai로 시간(컷 편집·자막·초안)을 벌고, 에펙·고급 툴로 차별화된 퀄리티 확보 → 필승 취업 전략 school of motion 트렌드 분석: ai 툴 발전 → 모션 디자이너의 역할은 단순 에셋 생성을 넘어 에펙·c4d를 활용한 세밀한 컴포지팅(합성)과 연출 교정으로 진화. 최종 결과물의 상업적 퀄리티를 완성하는 것은 여전히 2d/3d 툴의 숙련도에 달려있음 4 4. 프리랜서 현실 신입 프리랜서는 포트폴리오와 인맥이 없어 사실상 일 수주 불가 실무에서 충분한 경력을 쌓고 커넥션 100% 확보 후 전향해야 안전 5. 상담 포인트 5 1. 학과 선택 가이드 \"영상 제작 딥하게 하기 싫어!\" → 유튜브 학과 (light / 기획 중심) \"영상 제작 딥하게 해볼래!\" → 모션 학과 (deep / 기술 중심) 첫 질문: \"어떤 영상 만들고 싶으세요?\" 5 2. 상담 시 팩트체크 포인트 1. 모션학과 목표는 '기획'이 아닌 '완벽한 시각적 구현' → 기획·연출보다 구현 능력이 먼저 2. 3d 편식 주의 → 2d 없는 3d는 경쟁력 없음. 광고 수요는 2d가 압도적 3. 프리랜서 환상 방지 → 신입 프리는 일 수주 사실상 불가. 실무 경력+커넥션 후 전향 4. ai 만능 환상 방지 → ai 결과물만으로는 실무 퀄리티 불충분. 에펙·c4d 후가공 필수 5 3. 현업 현실 공유 순서 (신뢰도 확보) 1. 현업 취업처별 현실 먼저 알려주기 (방송국·광고사·스튜디오 차이) 2. 2d의 절대적 중요성 강조 3. ai 파이프라인 설명으로 미래지향적 학습 방향 제시 4. 포트폴리오의 중요성과 1대1 피드백 시스템 소개 5 4. 멘토 무기화 전략 형태(cg) + 질감(서페이싱) + 움직임(모션): 3가지가 합쳐져야 진정한 고품질 영상 편집 사고: 단순 툴 사용법보다 \"콘텐츠 기획 및 편집적 사고\"가 상위 개념 ai(생산성) + 인간(디테일): 필승 취업 전략 6. 용어 해설 (glossary) 용어 설명 oap on air promotion. 방송국 영상 디자인(채널 id, 예고편 등) 통칭. 모션그래픽 주요 진출 분야 키프레임 (keyframe) 움직임의 '시점'과 '종점'을 찍는 것. 그 사이 속도 변화(텐션)를 그래프로 조절하는 것이 실력 마스크 (mask) 에펙에서 오브젝트를 가리거나 나타나게 하는 기법. 펜툴(path) + 불리언(boolean) 개념 트랩코드 (trapcode / particular) 에펙에서 눈·비·불꽃·먼지 같은 파티클을 화려하게 만드는 필수 플러그인 duik (듀익) 에펙에서 캐릭터 팔다리에 뼈를 심어주는(리깅) 무료 최강 플러그인 3d 카메라 트래킹 컴퓨터가 촬영된 영상의 입체 공간을 분석해 가상 카메라를 만들어주는 기술. 영상 합성의 핵심 모그라프 (mograph) c4d의 특정 오브젝트를 복사해 다양한 형태(군집체 등)로 표현하는 기능 렌더러 (octane 등) 3d 데이터를 사진/영상으로 인화해주는 존재. '카메라 앱' 같은 역할 리얼플로우 (realflow) 물 튀기는 효과 만드는 끝판왕 시뮬레이션 툴 인포그래픽 정보전달 중심의 움직이는 그래픽. 옥외광고, 지하철 등에 활용 컴포지팅 (compositing) 여러 영상·그래픽 소스를 합성하여 하나의 완성된 영상으로 만드는 후반 작업 hard surface c4d에서 기계적·딱딱한 형태의 모델링 organic c4d에서 유기적·부드러운 형태의 모델링 프로젝션 매핑 건물이나 물체 표면에 영상을 투영하는 미디어아트 기법 7. 참고 출처 school of motion → \"the future of motion design\" (schoolofmotion.com/blog) 에펙 참고 자료: https://blog.naver.com/sbs_leesu/223830015202 시네마4d 용어 정리: 시포디 공식 홈페이지 참고"},"99_시스템/03_학과지식/시각편집디자인_지식_통합본.md":{"t":"시각편집디자인 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>시각편집디자인학과 지식 통합본</h3>\n<p>시각편집디자인학과의 커리큘럼과 상담 논리를 한 문서에 모은 지식 통합본이다. 디자인의 목적과 시각디자인 분류,</p>\n<p>포토샵·일러스트레이터·인디자인 3대 툴, 단계별 심화 과정, 취업처와 자격증, 상담 전략을 다룬다.</p>\n<p>(태그 정리됨)</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(포토샵·포토웍스→AIX 포토샵, 일러스트·디일러→AIX 일러스트, 인디자인→AIX 디지털출판). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>디자인의 정의 및 목적</h4>\n<ul><li>\n디자인의 목적: <strong>실용성</strong>\n<ul><li>\n우리 생활을 <strong>편리</strong>하고, <strong>쾌적</strong>하고, <strong>아름답게</strong> 하기 위한 목적\n<ul><li>\n시각: 정보와 지식을 넓히고 보다 신속/정확하게 전달\n</li><li>\n제품: 제품 및 도구를 보다 다량으로, 안전하고 편리하게 생산\n</li><li>\n환경: 환경 및 공간을 보다 적합하게 만듦\n</li></ul>\n</li></ul>\n</li></ul>\n<h4>시각디자인의 분류</h4>\n<ul><li>\n<strong>편집:</strong> 한정된 크기의 1장의 면에 원하는 정보를 담는 것\n</li><li>\n<strong>영상:</strong> 한정된 크기의 여러 장의 면에 원하는 정보를 담는 것\n</li><li>\n<strong>웹:</strong> 여러 장의 면에 원하는 정보를 사용자가 선택하여 보게 담는 것\n</li><li>\n모든 시각디자인의 기초는 *1장의 면에 정보를 담는 것* - 한정된 공간에서 중요한 것을 파악하고 효과적으로 활용하는 능력이 핵심\n</li></ul>\n<h4>분야 위상</h4>\n<ul><li>\n<strong>시각디자인은 모든 디자인의 근본이자 메인(Main)이며 뿌리(Root)</strong>\n</li><li>\n아트웍 vs 시각편집: 아트웍은 예술(예술가/크리에이터)에 가깝고, 시각편집은 상업 디자인(비즈니스)에 최적화됨\n</li></ul>\n<hr>\n<h3>2. 커리큘럼</h3>\n<h4>편집디자인 과정 전체 구성</h4>\n<p>*(지점마다 상이할 수 있으니 확인 필요)*</p>\n<ul><li>\n<strong>발상과 표현, 색채학</strong>\n<ul><li>\n무엇이 중요한지 알고, 생각을 정리하며 적합한 표현 방법을 배움\n</li><li>\n색 고르기는 어려우므로 이론과 실습을 통해 상황과 요구에 맞는 색을 선택하는 훈련\n</li></ul>\n</li><li>\n<strong>기초/인체/캐릭터 드로잉</strong>\n<ul><li>\n잘 그리는 것뿐 아니라 이후 과정을 위해서도 필요함\n</li><li>\n프로그램을 다룰 수 있어도 완성도가 떨어지는 것을 방지\n</li></ul>\n</li><li>\n<strong>포토샵(PS) / 일러스트(AI) / 인디자인(ID)</strong>\n<ul><li>\n포토샵: 사진 편집\n</li><li>\n일러스트: 그림/벡터 이미지\n</li><li>\n인디자인: 글자/출판/편집 특화\n</li></ul>\n</li><li>\n<strong>포토웍스, 디일러, 인포그래픽</strong>\n</li><li>\n<strong>포트폴리오 (실무/실습 과정)</strong>\n</li></ul>\n<h4>단계별 심화 과정 상세</h4>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>기초 도구</td><td>PS, AI, ID의 명확한 차이 이해 및 기초 활용</td></tr><tr><td>심화</td><td>포토샵 어드밴스 과정 / '내 언어로 된 책' 제작</td></tr><tr><td>플랫 모션</td><td>애니메이션, 벡터 이미지 연동 / 변형·왜곡 방지가 핵심</td></tr><tr><td>이북(E-Pub)</td><td>캐릭터 어필 및 시대적 흐름 반영 / 스토리보드 기획력으로 AI 약점 보완</td></tr><tr><td>인포그래픽</td><td>정보의 시각화 / 픽토그램, 모션, 3D 연계 가능 / 일러스트 스스로 비주얼라이징</td></tr><tr><td>패키지 MD</td><td>바코드법, 지기구조, 소재, 폰트 학습 / 매장 전시(VMD), 홍보물 제작</td></tr><tr><td>브랜딩 (1개월)</td><td>'나'라는 브랜드 정의 / 브랜딩 I(경영 리뷰/이론) + 브랜딩 II(융합/심화)</td></tr><tr><td>포트폴리오 (4개월)</td><td>최종 과정 / 편집 포트폴리오 완성 / 인디자인 활용 극대화</td></tr></tbody></table></div>\n<h4>추가 보조 과정 (변화에 앞서가기 위한 선택)</h4>\n<ul><li>\n웹코딩, 애프터이펙츠(After Effects), 스케치업 등\n</li><li>\n3D 무업 프로그램, 3D 블렌더, 시네마 4D(C4D)로의 확장 가능\n</li></ul>\n<hr>\n<h3>3. 프로그램 및 툴</h3>\n<h4>핵심 3대 툴</h4>\n<div class=\"tw\"><table><thead><tr><th>툴</th><th>용도</th></tr></thead><tbody><tr><td>포토샵 (Photoshop, PS)</td><td>사진 편집, 이미지 합성, 어드밴스 과정 포함</td></tr><tr><td>일러스트레이터 (Illustrator, AI)</td><td>벡터 이미지, 인포그래픽, 캐릭터, 비주얼라이징</td></tr><tr><td>인디자인 (InDesign, ID)</td><td>출판·편집 특화, 북디자인, 포스터, 리플렛, 파일 관리</td></tr></tbody></table></div>\n<h4>확장 툴</h4>\n<ul><li>\n애프터이펙츠(AE): 플랫 모션, 애니메이션\n</li><li>\n3D 블렌더 / 시네마 4D (C4D): 패키지·인포그래픽 연계\n</li><li>\n웹코딩: 디지털 매체 대응\n</li></ul>\n<h4>디자이너 역량 포인트</h4>\n<ul><li>\n소스를 단순히 끌어다 쓰는 것이 아니라 <strong>직접 만들거나 수정할 줄 아는 능력</strong>이 중요\n</li><li>\n인디자인은 컴퓨터그래픽스운용기능사 취득에 유리하며 파일 관리에도 유용\n</li></ul>\n<hr>\n<h3>4. 취업 및 진로</h3>\n<h4>취업처 분류</h4>\n<ul><li>\n<strong>에이전시:</strong> 외주 중심 / 기획·발표·수주 역량 핵심\n</li><li>\n<strong>인하우스:</strong> 기업 내부 디자인팀\n</li><li>\n<strong>스튜디오:</strong> 전문 크리에이티브 스튜디오\n</li></ul>\n<h4>취업 동향</h4>\n<ul><li>\n현재 다양한 매체 변화 중: 광고/그래픽/문자/캐릭터/편집/POP 등\n</li><li>\n편집디자인은 '인쇄'에 국한되지 않음 - 디지털 매체로 영역 확장\n</li><li>\n신입사원은 많지만 <strong>경력직은 줄고 있음</strong> → 시각디자인의 중요성을 인지해야 함\n</li></ul>\n<h4>비전공자 특화 포인트</h4>\n<ul><li>\n마케팅 경험 등 기존 정보를 <strong>시각화(Visualization)하여 발표하는 능력</strong>이 취업 특화 포인트\n</li><li>\n비전공자일수록 비주얼라이징 훈련이 절실함\n</li><li>\n타 학과와의 협업·연계를 통한 시너지 창출 가능\n</li></ul>\n<h4>자격증</h4>\n<p><strong>국가기술자격증</strong></p>\n<div class=\"tw\"><table><thead><tr><th>자격증</th><th>비고</th></tr></thead><tbody><tr><td>컴퓨터그래픽스운영기능사</td><td>자격 불요(취득 용이)</td></tr><tr><td>전자출판기능사</td><td>자격 불요</td></tr><tr><td>컬러리스트 산업기사/기사</td><td>자격 필요</td></tr><tr><td>시각디자인 산업기사/기사</td><td>자격 필요</td></tr></tbody></table></div>\n<p><strong>민간자격증</strong></p>\n<ul><li>\nACP: 포토샵, 일러스트레이터, 인디자인\n</li><li>\nGTQ: 포토샵, 일러스트레이터, 인디자인\n</li><li>\n옥외광고사 2급\n</li></ul>\n<blockquote>자격증 자체를 크게 보지는 않으나, 학업 기간을 증명하는 수단으로 활용 가능</blockquote>\n<h4>포트폴리오</h4>\n<ul><li>\n디자인 계열은 포트폴리오 필수\n</li><li>\n좋은 포트폴리오는 면접의 참고서 (&quot;왜 이렇게 만들었나요?&quot; 등 질문에 대비)\n</li><li>\n포트폴리오는 본인의 PR 도구 - 내가 어떤 사람인지 어필\n</li><li>\n요즘은 목업과 템플릿이 많아 비슷해 보일 수 있으므로, <strong>제작 비화, 컨셉, 분석</strong> 등을 적극 활용해 차별화\n</li></ul>\n<hr>\n<h3>5. 상담 포인트</h3>\n<h4>상담 전략</h4>\n<ul><li>\n<strong>상담의 역순(Reverse):</strong> 뒷부분(포트폴리오/취업)부터 설명하는 것이 효과적 - 취업 기간을 단축하고 커리큘럼의 설득력을 높임\n</li><li>\n<strong>핵심 차별화:</strong> '명확하게' 모르는 상태(뭐하지?)를 '약속을 통한 훈련'으로 이끄는 기획력이 승부처\n</li></ul>\n<h4>타겟별 Needs 파악</h4>\n<ul><li>\n<strong>첫 컨택 시 전공/비전공 여부 확인 필수</strong>\n<ul><li>\n전공자: 기초 이해도가 높음\n</li><li>\n비전공자: 비주얼라이징 훈련이 절실 / 기존 경험(마케팅 등)을 시각화 능력으로 연결하는 접근\n</li></ul>\n</li><li>\n기초 이해부터 심화 과정까지, <strong>트렌드에 맞는 즉각적 학습 가능성</strong>을 어필\n</li><li>\n브레인스토밍: 반복 훈련과 피드백을 통한 자가 목표 설정 필수\n</li></ul>\n<h4>실전 사례</h4>\n<ul><li>\n원치 않는 곳이라도 포기하지 않으면 취업 가능\n</li><li>\n강사의 밀착 지도(캐리)로 수업을 적게 들어도 취업에 성공한 사례 있음\n</li></ul>\n<hr>\n<p>*작성일자: 2026-02-28 / 원본 파일: 260204_교육시각편집디자인학과 커리큘럼.md, 260222_시각편집디자인_과정커리큘럼.md*</p>","x":"시각편집디자인학과 지식 통합본 시각편집디자인학과의 커리큘럼과 상담 논리를 한 문서에 모은 지식 통합본이다. 디자인의 목적과 시각디자인 분류, 포토샵·일러스트레이터·인디자인 3대 툴, 단계별 심화 과정, 취업처와 자격증, 상담 전략을 다룬다. (태그 정리됨) aix 커리큘럼 개편(2026 09~) 적용 예정. 9월 이후 개강·상담은 aix_커리큘럼개편_260715 을 정본으로 우선 확인할 것(포토샵·포토웍스→aix 포토샵, 일러스트·디일러→aix 일러스트, 인디자인→aix 디지털출판). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨. 1. 학과 개요 디자인의 정의 및 목적 디자인의 목적: 실용성 우리 생활을 편리 하고, 쾌적 하고, 아름답게 하기 위한 목적 시각: 정보와 지식을 넓히고 보다 신속/정확하게 전달 제품: 제품 및 도구를 보다 다량으로, 안전하고 편리하게 생산 환경: 환경 및 공간을 보다 적합하게 만듦 시각디자인의 분류 편집: 한정된 크기의 1장의 면에 원하는 정보를 담는 것 영상: 한정된 크기의 여러 장의 면에 원하는 정보를 담는 것 웹: 여러 장의 면에 원하는 정보를 사용자가 선택하여 보게 담는 것 모든 시각디자인의 기초는 1장의 면에 정보를 담는 것 한정된 공간에서 중요한 것을 파악하고 효과적으로 활용하는 능력이 핵심 분야 위상 시각디자인은 모든 디자인의 근본이자 메인(main)이며 뿌리(root) 아트웍 vs 시각편집: 아트웍은 예술(예술가/크리에이터)에 가깝고, 시각편집은 상업 디자인(비즈니스)에 최적화됨 2. 커리큘럼 편집디자인 과정 전체 구성 (지점마다 상이할 수 있으니 확인 필요) 1. 발상과 표현, 색채학 무엇이 중요한지 알고, 생각을 정리하며 적합한 표현 방법을 배움 색 고르기는 어려우므로 이론과 실습을 통해 상황과 요구에 맞는 색을 선택하는 훈련 2. 기초/인체/캐릭터 드로잉 잘 그리는 것뿐 아니라 이후 과정을 위해서도 필요함 프로그램을 다룰 수 있어도 완성도가 떨어지는 것을 방지 3. 포토샵(ps) / 일러스트(ai) / 인디자인(id) 포토샵: 사진 편집 일러스트: 그림/벡터 이미지 인디자인: 글자/출판/편집 특화 4. 포토웍스, 디일러, 인포그래픽 5. 포트폴리오 (실무/실습 과정) 단계별 심화 과정 상세 단계 내용 기초 도구 ps, ai, id의 명확한 차이 이해 및 기초 활용 심화 포토샵 어드밴스 과정 / '내 언어로 된 책' 제작 플랫 모션 애니메이션, 벡터 이미지 연동 / 변형·왜곡 방지가 핵심 이북(e pub) 캐릭터 어필 및 시대적 흐름 반영 / 스토리보드 기획력으로 ai 약점 보완 인포그래픽 정보의 시각화 / 픽토그램, 모션, 3d 연계 가능 / 일러스트 스스로 비주얼라이징 패키지 md 바코드법, 지기구조, 소재, 폰트 학습 / 매장 전시(vmd), 홍보물 제작 브랜딩 (1개월) '나'라는 브랜드 정의 / 브랜딩 i(경영 리뷰/이론) + 브랜딩 ii(융합/심화) 포트폴리오 (4개월) 최종 과정 / 편집 포트폴리오 완성 / 인디자인 활용 극대화 추가 보조 과정 (변화에 앞서가기 위한 선택) 웹코딩, 애프터이펙츠(after effects), 스케치업 등 3d 무업 프로그램, 3d 블렌더, 시네마 4d(c4d)로의 확장 가능 3. 프로그램 및 툴 핵심 3대 툴 툴 용도 포토샵 (photoshop, ps) 사진 편집, 이미지 합성, 어드밴스 과정 포함 일러스트레이터 (illustrator, ai) 벡터 이미지, 인포그래픽, 캐릭터, 비주얼라이징 인디자인 (indesign, id) 출판·편집 특화, 북디자인, 포스터, 리플렛, 파일 관리 확장 툴 애프터이펙츠(ae): 플랫 모션, 애니메이션 3d 블렌더 / 시네마 4d (c4d): 패키지·인포그래픽 연계 웹코딩: 디지털 매체 대응 디자이너 역량 포인트 소스를 단순히 끌어다 쓰는 것이 아니라 직접 만들거나 수정할 줄 아는 능력 이 중요 인디자인은 컴퓨터그래픽스운용기능사 취득에 유리하며 파일 관리에도 유용 4. 취업 및 진로 취업처 분류 에이전시: 외주 중심 / 기획·발표·수주 역량 핵심 인하우스: 기업 내부 디자인팀 스튜디오: 전문 크리에이티브 스튜디오 취업 동향 현재 다양한 매체 변화 중: 광고/그래픽/문자/캐릭터/편집/pop 등 편집디자인은 '인쇄'에 국한되지 않음 디지털 매체로 영역 확장 신입사원은 많지만 경력직은 줄고 있음 → 시각디자인의 중요성을 인지해야 함 비전공자 특화 포인트 마케팅 경험 등 기존 정보를 시각화(visualization)하여 발표하는 능력 이 취업 특화 포인트 비전공자일수록 비주얼라이징 훈련이 절실함 타 학과와의 협업·연계를 통한 시너지 창출 가능 자격증 국가기술자격증 자격증 비고 컴퓨터그래픽스운영기능사 자격 불요(취득 용이) 전자출판기능사 자격 불요 컬러리스트 산업기사/기사 자격 필요 시각디자인 산업기사/기사 자격 필요 민간자격증 acp: 포토샵, 일러스트레이터, 인디자인 gtq: 포토샵, 일러스트레이터, 인디자인 옥외광고사 2급 자격증 자체를 크게 보지는 않으나, 학업 기간을 증명하는 수단으로 활용 가능 포트폴리오 디자인 계열은 포트폴리오 필수 좋은 포트폴리오는 면접의 참고서 (\"왜 이렇게 만들었나요?\" 등 질문에 대비) 포트폴리오는 본인의 pr 도구 내가 어떤 사람인지 어필 요즘은 목업과 템플릿이 많아 비슷해 보일 수 있으므로, 제작 비화, 컨셉, 분석 등을 적극 활용해 차별화 5. 상담 포인트 상담 전략 상담의 역순(reverse): 뒷부분(포트폴리오/취업)부터 설명하는 것이 효과적 취업 기간을 단축하고 커리큘럼의 설득력을 높임 핵심 차별화: '명확하게' 모르는 상태(뭐하지?)를 '약속을 통한 훈련'으로 이끄는 기획력이 승부처 타겟별 needs 파악 첫 컨택 시 전공/비전공 여부 확인 필수 전공자: 기초 이해도가 높음 비전공자: 비주얼라이징 훈련이 절실 / 기존 경험(마케팅 등)을 시각화 능력으로 연결하는 접근 기초 이해부터 심화 과정까지, 트렌드에 맞는 즉각적 학습 가능성 을 어필 브레인스토밍: 반복 훈련과 피드백을 통한 자가 목표 설정 필수 실전 사례 원치 않는 곳이라도 포기하지 않으면 취업 가능 강사의 밀착 지도(캐리)로 수업을 적게 들어도 취업에 성공한 사례 있음 작성일자: 2026 02 28 / 원본 파일: 260204_교육시각편집디자인학과 커리큘럼.md, 260222_시각편집디자인_과정커리큘럼.md"},"99_시스템/03_학과지식/아트웍학과_지식_통합본.md":{"t":"아트웍학과 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>🎨 아트웍학과 지식 통합본</h3>\n<p>아트웍학과의 커리큘럼과 상담 논리를 한 문서에 모은 지식 통합본이다. 드로잉 기초부터 디지털 드로잉, 심화 응용까지 단계별 과목과</p>\n<p>3-6-9-12 성장 로드맵, 취업 진로, 수강생 유형별 상담 포인트를 다룬다. 9월 이후 과목명은 아래 배너의 개편 정본을 먼저 확인한다.</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(색채학·발상과표현→Design Core Foundation, 패키지MD·브랜딩디자인→AIX 패키지MD·브랜딩실무). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<blockquote><strong>핵심 키워드</strong>: #기초체력 #3-6-9-12법칙 #Non-PBR #플랫모션 #취업로드맵</blockquote>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>아트웍학과란?</h4>\n<p>아트웍학과는 드로잉의 기초부터 디지털 드로잉, 심화 응용까지 단계적으로 학습하는 과정이다. 단순히 따라 그리는 것이 아닌, 기초적인 드로잉 연습을 통해 관찰력, 창조적 사고, 상상력을 키우는 것을 핵심 목표로 한다.</p>\n<ul><li>\n대상: 처음 드로잉을 접하는 수강생부터 포트폴리오 완성이 필요한 전공자까지\n</li><li>\n각 지점별로 커리큘럼 및 과목 상황에 따라 다르게 진행될 수 있음\n</li></ul>\n<h4>드로잉을 배워야 하는 이유</h4>\n<ul><li>\n<strong>디자인 트렌드</strong>: 드로잉은 단순 합성이나 영상 제작 외에도 다양한 분야에서 복합적으로 사용됨. 직접 소스를 그리는 능력이 필수 경쟁력\n</li><li>\n<strong>미적 감각</strong>: 재능이 아니라 '훈련된 관찰력'임. 어떤 이미지가 왜 좋아 보이는지 이해하고 감각을 향상시킬 수 있음. 관찰력과 분석력 기르기가 중요\n</li><li>\n<strong>형태감과 구도</strong>: 구도가 어긋나고 형태감이 무너지면 전체적인 퀄리티가 낮아 보이게 됨. 기초가 무너지면 아무리 화려한 효과를 줘도 퀄리티가 낮아 보임 (100의 실력이 있어야 70이 나옴)\n</li><li>\n<strong>Non-PBR 특화</strong>: 3D는 컴퓨터가 빛을 계산해주지만(PBR), 아트웍은 직접 빛을 그리는 법(Non-PBR)을 배워야 함\n</li></ul>\n<blockquote><strong>퀄리티 vs 완성도</strong></blockquote>\n<blockquote>- 퀄리티가 높다 = 잘 그렸다</blockquote>\n<blockquote>- 완성도가 높다 = 간단·심플하더라도 깔끔하고 끝맺음 있게 완결됨</blockquote>\n<hr>\n<h3>2. 커리큘럼</h3>\n<h4>① 기초 이론 (비전공자 필수 관문)</h4>\n<h5>발상과 표현 (아이디어 &amp; 익스프레션)</h5>\n<ul><li>\n입시미술이 아닌, 디자이너에게 필요한 시각적 표현능력을 키우는 전반적인 이론 교육\n</li><li>\n점, 선, 면을 통한 평면구성, 투시도, 원근법, 시점, 명암, 입체, 강조\n</li><li>\n로고, 타이포그래피, 다양한 드로잉 표현법, 아이디어 발상 이론 학습 및 실습\n</li><li>\n모션 및 시각디자인의 필수 코스\n</li></ul>\n<h5>색채학 (컬러그래피)</h5>\n<ul><li>\n컬러는 시각적인 모든 디자인의 핵심 요소 중 하나. &quot;디자인의 반은 색감&quot;\n</li><li>\n컬러에 대한 이론과 실습 병행: 색감, 배색 등 심도 있는 교육\n</li><li>\n디자이너는 용도와 목적, 작업에 맞는 컬러를 사용해야 함\n</li><li>\n상황별로 알맞은 컬러 배치 능력 향상\n</li><li>\n컬러리스트 자격증 희망자나 색 감각이 부족한 학생에게 강력 추천\n</li></ul>\n<hr>\n<h4>② 기초 핸드 드로잉</h4>\n<h5>기초 핸드 드로잉</h5>\n<ul><li>\n연필과 공책 사용. 관찰력과 형태감 훈련\n</li><li>\n사물에 대한 이해 및 형태감을 그려보면서 직접 시각적 경험을 통해 상상력을 자극하고 창의성을 함양\n</li><li>\n크로키를 통해 올바른 형태감, 빛 관찰을 통한 입체감, 모작을 통한 비율과 명암 표현력 향상 가능\n</li></ul>\n<h5>인체 해부학 (아나토미)</h5>\n<ul><li>\n인체를 중심으로 한 드로잉 실습을 통해 인체의 비례와 특징, 골격과 근육의 구조 등 습득\n</li><li>\n본인이 의도하는 캐릭터를 기획하고 드로잉할 수 있는 능력 개발\n</li><li>\n인체 구조와 근육에 대한 이해도 향상\n</li><li>\n이후 3D 캐릭터 모델링 제작 시 한 차원 높은 퀄리티의 작품 제작 가능\n</li></ul>\n<h5>조소</h5>\n<ul><li>\n3D 인체 모델링, 캐릭터 제작의 기초\n</li><li>\n인체의 골격, 근육 형태와 형태감 등을 익히고 조소 재료를 이용하여 직접 제작\n</li><li>\n인체의 기본적인 형태를 이해하고 다양한 응용을 통해 독창적 모델링 제작\n</li><li>\n3D 캐릭터 모델링의 기초가 되는 입체감 이해 과정\n</li><li>\n최종 목표: 포트폴리오와 작업 결과물 퀄리티 향상\n</li></ul>\n<hr>\n<h4>③ 디지털 드로잉</h4>\n<p>기존 핸드 드로잉과는 달리 디지털 장치(타블렛과 소프트웨어)를 사용하여 그림을 그리는 방식. 수정과 변형이 쉽다는 장점이 있으며, 기본적인 드로잉 실력이 뒷받침되어야 고퀄리티 이미지 제작 가능.</p>\n<ul><li>\n주요 툴: <strong>포토샵</strong> (툴 사용법보다 그림 실력 자체에 집중)\n</li><li>\n타블렛 사용 필수\n</li></ul>\n<h5>컨셉 드로잉 (Concept Art)</h5>\n<ul><li>\n최종 제작 전 구상하는 일러스트. 콘텐츠 제작을 위한 시각화 작업\n</li><li>\n판타지, SF 등의 비현실적 설정에서 많이 작업; 실물 주제라면 정확한 고증 필요\n</li><li>\n컨셉과 정확한 표현력이 가장 중요한 분야\n</li><li>\n캐릭터 및 배경 기획 단계에 해당\n</li></ul>\n<h5>일러스트</h5>\n<ul><li>\n주로 포토샵과 타블렛 사용\n</li><li>\n인물, 사물, 스케치부터 채색까지 자유로운 주제로 진행\n</li></ul>\n<h5>캐릭터 디자인</h5>\n<ul><li>\n캐릭터를 시각화하여 표현\n</li><li>\n팬시, 굿즈, 이모티콘 등 다양한 분야에서 널리 사용\n</li><li>\n트렌드와 캐릭터의 성격을 잘 나타내 매력적으로 표현하는 것이 중요\n</li></ul>\n<h5>매트 페인팅</h5>\n<ul><li>\n영상 혹은 CG 작업 시 가상의 환경 및 배경 제작을 위해 포토샵 등으로 다양한 합성 작업 진행\n</li><li>\n드로잉 표현력보다 투시도와 구도에 대한 이해가 더 중요\n</li><li>\n타블렛을 이용해야 효율적인 작업 가능\n</li></ul>\n<hr>\n<h4>④ 심화 및 응용</h4>\n<h5>플랫 모션 (Flat Motion) → 본원 독보적 강점</h5>\n<ul><li>\n영상 소스 직접 제작 + 본인만의 그림체 완성\n</li><li>\n루트: 컨셉드로잉 + 디지털드로잉 → 플랫모션 → 에프터이펙트 연계\n</li><li>\n취업 시장에서 대체 불가능한 스펙 형성\n</li></ul>\n<h5>스토리보드 (Storytelling)</h5>\n<ul><li>\n모션과정, 특히 2D 모션그래픽 수업에서 가장 중요한 과목\n</li><li>\n영상 기획, 앵글(구도), 콘티 제작. 기획자 및 유튜버 지망생 필수\n</li><li>\n관객의 시선을 사로잡고 마음을 움직이는 이야기 만드는 기술 학습\n</li><li>\n이야기를 성공적으로 어필하기 위한 피칭 실습 학습\n</li><li>\n다양한 구도, 스토리보드 용어, 구성요소에 대한 팁 학습\n</li><li>\n드로잉 기술이 없거나 포토샵 등의 프로그램을 몰라도 스토리텔링에 관심이 있다면 누구나 수강 가능\n</li><li>\n그림에 자신이 없는 수강생에게 적극 추천\n</li></ul>\n<h5>포트폴리오</h5>\n<ul><li>\n취업 및 프리랜서 활동을 위한 작업\n</li><li>\n기획, 구상, 컨셉 등의 프로세스를 거쳐 가장 높은 완성도로 진행\n</li><li>\n본인의 창작 이미지를 제작해야 하므로, 기초 핸드드로잉 및 디지털드로잉 기본기가 갖춰져야 고퀄리티 포트폴리오 제작 가능\n</li></ul>\n<hr>\n<h4>3-6-9-12 법칙 (성장 로드맵)</h4>\n<div class=\"tw\"><table><thead><tr><th>기간</th><th>단계</th><th>목표</th></tr></thead><tbody><tr><td>3개월</td><td>기초</td><td>형태감, 관찰력, 색채 기초</td></tr><tr><td>6개월</td><td>모작</td><td>기존 작품 모방하며 실력 향상</td></tr><tr><td>12개월</td><td>창작 / 취업</td><td>본인만의 창작 이미지 제작 및 취업 포트폴리오 완성</td></tr></tbody></table></div>\n<ul><li>\n처음부터 잘 그리는 사람은 많지 않음. 반복 훈련을 통해 창작 과정 심화\n</li><li>\n개인마다 필요한 기간은 다를 수 있음\n</li></ul>\n<hr>\n<h3>3. 취업 및 진로</h3>\n<h4>실무 회사 취업</h4>\n<ul><li>\n캐릭터 디자이너\n</li><li>\n그래픽 디자이너\n</li><li>\n아트 디렉터\n</li><li>\n웹툰 스튜디오\n</li><li>\n애니메이터\n</li></ul>\n<h4>아티스트 및 프리랜서</h4>\n<ul><li>\n일러스트레이터 작가\n</li><li>\n웹툰 작가 (등단)\n</li><li>\n이모티콘 작가\n</li><li>\n스토리보드 작가 (영화 / 광고 / 애니메이션)\n</li><li>\n학원 강사\n</li></ul>\n<hr>\n<h3>4. 상담 포인트</h3>\n<h4>수강생 유형별 맞춤 접근</h4>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>특징</th><th>상담 포인트</th><th>추천 멘트</th></tr></thead><tbody><tr><td><strong>전공생</strong></td><td>기본기 O / 퀄리티 부족</td><td>포트폴리오 업그레이드, 취업용 스킬 강조</td><td>&quot;기본기는 있으시니, 이제 '취업용 포폴' 퀄리티로 끌어올리셔야죠.&quot;</td></tr><tr><td><strong>비전공생</strong></td><td>기본기 X (지식 0)</td><td>흥미 유발, 기초의 중요성, 로드맵 제시</td><td>&quot;디자인의 시작은 드로잉입니다. 1년 뒤엔 본인 그림으로 취업하게 해드립니다.&quot;</td></tr><tr><td><strong>취미 / 입문</strong></td><td>흥미 위주</td><td>쉽고 재미있는 접근 (인스타툰 등)</td><td>&quot;웹툰이나 이모티콘 같은 가벼운 목표부터 시작해보시죠.&quot;</td></tr></tbody></table></div>\n<h4>설득 논리 핵심 포인트</h4>\n<ul><li>\n<strong>드로잉이 경쟁력</strong>: 그림을 잘 그리는 것도 중요하지만, 수업을 통해 제작한 이미지를 타 과목에서 어떻게 접목시켜 제작할지 방향성을 정하는 것도 매우 중요\n</li><li>\n<strong>미적 감각은 훈련</strong>: 타고난 재능이 아니라 훈련을 통해 향상 가능. 보는 눈이 트여야 디자인도 잘함\n</li><li>\n<strong>Non-PBR 강점</strong>: 3D(PBR)는 컴퓨터가 빛을 계산(사진 느낌)하지만, Non-PBR은 사람이 직접 빛을 그려 넣는(손그림 느낌) 방식으로 직접 명암을 그려 넣는 기술 전수\n</li></ul>\n<h4>학원 수강 메리트</h4>\n<ul><li>\n<strong>툴만 다루는 오퍼레이터 방지</strong>: 단순히 툴만 잘하는 사람이 아니라, 드로잉 실력을 갖춘 진짜 디자이너 양성\n</li><li>\n<strong>취업 강점 커리큘럼</strong>: 플랫모션 + 영상 편집 능력 조합으로 취업 시장에서 대체 불가능한 스펙 형성\n</li><li>\n<strong>Non-PBR 특화</strong>: 3D와 2D를 넘나드는 하이엔드 아티스트로 양성\n</li></ul>\n<hr>\n<h3>5. 자주 묻는 질문 (Q&amp;A)</h3>\n<p><strong>Q. 드로잉 한 달만 배우고 스토리보드 들어도 되나요?</strong></p>\n<p>A. 통상적으로 드로잉 과정을 끝내야 수월함. 부족하면 학과장님 상담 필요.</p>\n<p><strong>Q. 3D(PBR)랑 포토샵(Non-PBR) 차이가 뭐예요?</strong></p>\n<p>A. PBR은 컴퓨터가 빛을 계산(사진 느낌), Non-PBR은 사람이 직접 빛을 그려 넣는(손그림 느낌) 방식.</p>\n<hr>\n<h3>6. 기타</h3>\n<ul><li>\n드로잉: 컨셉아트, 일러스트, 그래픽디자인, 영상 제작 등 다양한 분야에서 사용되는 작업의 가장 기본이 되는 과정\n</li><li>\n디지털 드로잉은 다양한 분야에 접목해 사용 가능\n</li><li>\n스토리보드는 모든 영상 작업의 기초이자 핵심\n</li></ul>","x":"🎨 아트웍학과 지식 통합본 아트웍학과의 커리큘럼과 상담 논리를 한 문서에 모은 지식 통합본이다. 드로잉 기초부터 디지털 드로잉, 심화 응용까지 단계별 과목과 3 6 9 12 성장 로드맵, 취업 진로, 수강생 유형별 상담 포인트를 다룬다. 9월 이후 과목명은 아래 배너의 개편 정본을 먼저 확인한다. aix 커리큘럼 개편(2026 09~) 적용 예정. 9월 이후 개강·상담은 aix_커리큘럼개편_260715 을 정본으로 우선 확인할 것(색채학·발상과표현→design core foundation, 패키지md·브랜딩디자인→aix 패키지md·브랜딩실무). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨. 핵심 키워드 : 기초체력 3 6 9 12법칙 non pbr 플랫모션 취업로드맵 1. 학과 개요 아트웍학과란? 아트웍학과는 드로잉의 기초부터 디지털 드로잉, 심화 응용까지 단계적으로 학습하는 과정이다. 단순히 따라 그리는 것이 아닌, 기초적인 드로잉 연습을 통해 관찰력, 창조적 사고, 상상력을 키우는 것을 핵심 목표로 한다. 대상: 처음 드로잉을 접하는 수강생부터 포트폴리오 완성이 필요한 전공자까지 각 지점별로 커리큘럼 및 과목 상황에 따라 다르게 진행될 수 있음 드로잉을 배워야 하는 이유 1. 디자인 트렌드 : 드로잉은 단순 합성이나 영상 제작 외에도 다양한 분야에서 복합적으로 사용됨. 직접 소스를 그리는 능력이 필수 경쟁력 2. 미적 감각 : 재능이 아니라 '훈련된 관찰력'임. 어떤 이미지가 왜 좋아 보이는지 이해하고 감각을 향상시킬 수 있음. 관찰력과 분석력 기르기가 중요 3. 형태감과 구도 : 구도가 어긋나고 형태감이 무너지면 전체적인 퀄리티가 낮아 보이게 됨. 기초가 무너지면 아무리 화려한 효과를 줘도 퀄리티가 낮아 보임 (100의 실력이 있어야 70이 나옴) 4. non pbr 특화 : 3d는 컴퓨터가 빛을 계산해주지만(pbr), 아트웍은 직접 빛을 그리는 법(non pbr)을 배워야 함 퀄리티 vs 완성도 퀄리티가 높다 = 잘 그렸다 완성도가 높다 = 간단·심플하더라도 깔끔하고 끝맺음 있게 완결됨 2. 커리큘럼 ① 기초 이론 (비전공자 필수 관문) 발상과 표현 (아이디어 & 익스프레션) 입시미술이 아닌, 디자이너에게 필요한 시각적 표현능력을 키우는 전반적인 이론 교육 점, 선, 면을 통한 평면구성, 투시도, 원근법, 시점, 명암, 입체, 강조 로고, 타이포그래피, 다양한 드로잉 표현법, 아이디어 발상 이론 학습 및 실습 모션 및 시각디자인의 필수 코스 색채학 (컬러그래피) 컬러는 시각적인 모든 디자인의 핵심 요소 중 하나. \"디자인의 반은 색감\" 컬러에 대한 이론과 실습 병행: 색감, 배색 등 심도 있는 교육 디자이너는 용도와 목적, 작업에 맞는 컬러를 사용해야 함 상황별로 알맞은 컬러 배치 능력 향상 컬러리스트 자격증 희망자나 색 감각이 부족한 학생에게 강력 추천 ② 기초 핸드 드로잉 기초 핸드 드로잉 연필과 공책 사용. 관찰력과 형태감 훈련 사물에 대한 이해 및 형태감을 그려보면서 직접 시각적 경험을 통해 상상력을 자극하고 창의성을 함양 크로키를 통해 올바른 형태감, 빛 관찰을 통한 입체감, 모작을 통한 비율과 명암 표현력 향상 가능 인체 해부학 (아나토미) 인체를 중심으로 한 드로잉 실습을 통해 인체의 비례와 특징, 골격과 근육의 구조 등 습득 본인이 의도하는 캐릭터를 기획하고 드로잉할 수 있는 능력 개발 인체 구조와 근육에 대한 이해도 향상 이후 3d 캐릭터 모델링 제작 시 한 차원 높은 퀄리티의 작품 제작 가능 조소 3d 인체 모델링, 캐릭터 제작의 기초 인체의 골격, 근육 형태와 형태감 등을 익히고 조소 재료를 이용하여 직접 제작 인체의 기본적인 형태를 이해하고 다양한 응용을 통해 독창적 모델링 제작 3d 캐릭터 모델링의 기초가 되는 입체감 이해 과정 최종 목표: 포트폴리오와 작업 결과물 퀄리티 향상 ③ 디지털 드로잉 기존 핸드 드로잉과는 달리 디지털 장치(타블렛과 소프트웨어)를 사용하여 그림을 그리는 방식. 수정과 변형이 쉽다는 장점이 있으며, 기본적인 드로잉 실력이 뒷받침되어야 고퀄리티 이미지 제작 가능. 주요 툴: 포토샵 (툴 사용법보다 그림 실력 자체에 집중) 타블렛 사용 필수 컨셉 드로잉 (concept art) 최종 제작 전 구상하는 일러스트. 콘텐츠 제작을 위한 시각화 작업 판타지, sf 등의 비현실적 설정에서 많이 작업; 실물 주제라면 정확한 고증 필요 컨셉과 정확한 표현력이 가장 중요한 분야 캐릭터 및 배경 기획 단계에 해당 일러스트 주로 포토샵과 타블렛 사용 인물, 사물, 스케치부터 채색까지 자유로운 주제로 진행 캐릭터 디자인 캐릭터를 시각화하여 표현 팬시, 굿즈, 이모티콘 등 다양한 분야에서 널리 사용 트렌드와 캐릭터의 성격을 잘 나타내 매력적으로 표현하는 것이 중요 매트 페인팅 영상 혹은 cg 작업 시 가상의 환경 및 배경 제작을 위해 포토샵 등으로 다양한 합성 작업 진행 드로잉 표현력보다 투시도와 구도에 대한 이해가 더 중요 타블렛을 이용해야 효율적인 작업 가능 ④ 심화 및 응용 플랫 모션 (flat motion) → 본원 독보적 강점 영상 소스 직접 제작 + 본인만의 그림체 완성 루트: 컨셉드로잉 + 디지털드로잉 → 플랫모션 → 에프터이펙트 연계 취업 시장에서 대체 불가능한 스펙 형성 스토리보드 (storytelling) 모션과정, 특히 2d 모션그래픽 수업에서 가장 중요한 과목 영상 기획, 앵글(구도), 콘티 제작. 기획자 및 유튜버 지망생 필수 관객의 시선을 사로잡고 마음을 움직이는 이야기 만드는 기술 학습 이야기를 성공적으로 어필하기 위한 피칭 실습 학습 다양한 구도, 스토리보드 용어, 구성요소에 대한 팁 학습 드로잉 기술이 없거나 포토샵 등의 프로그램을 몰라도 스토리텔링에 관심이 있다면 누구나 수강 가능 그림에 자신이 없는 수강생에게 적극 추천 포트폴리오 취업 및 프리랜서 활동을 위한 작업 기획, 구상, 컨셉 등의 프로세스를 거쳐 가장 높은 완성도로 진행 본인의 창작 이미지를 제작해야 하므로, 기초 핸드드로잉 및 디지털드로잉 기본기가 갖춰져야 고퀄리티 포트폴리오 제작 가능 3 6 9 12 법칙 (성장 로드맵) 기간 단계 목표 : : : 3개월 기초 형태감, 관찰력, 색채 기초 6개월 모작 기존 작품 모방하며 실력 향상 12개월 창작 / 취업 본인만의 창작 이미지 제작 및 취업 포트폴리오 완성 처음부터 잘 그리는 사람은 많지 않음. 반복 훈련을 통해 창작 과정 심화 개인마다 필요한 기간은 다를 수 있음 3. 취업 및 진로 실무 회사 취업 캐릭터 디자이너 그래픽 디자이너 아트 디렉터 웹툰 스튜디오 애니메이터 아티스트 및 프리랜서 일러스트레이터 작가 웹툰 작가 (등단) 이모티콘 작가 스토리보드 작가 (영화 / 광고 / 애니메이션) 학원 강사 4. 상담 포인트 수강생 유형별 맞춤 접근 구분 특징 상담 포인트 추천 멘트 : : : : 전공생 기본기 o / 퀄리티 부족 포트폴리오 업그레이드, 취업용 스킬 강조 \"기본기는 있으시니, 이제 '취업용 포폴' 퀄리티로 끌어올리셔야죠.\" 비전공생 기본기 x (지식 0) 흥미 유발, 기초의 중요성, 로드맵 제시 \"디자인의 시작은 드로잉입니다. 1년 뒤엔 본인 그림으로 취업하게 해드립니다.\" 취미 / 입문 흥미 위주 쉽고 재미있는 접근 (인스타툰 등) \"웹툰이나 이모티콘 같은 가벼운 목표부터 시작해보시죠.\" 설득 논리 핵심 포인트 드로잉이 경쟁력 : 그림을 잘 그리는 것도 중요하지만, 수업을 통해 제작한 이미지를 타 과목에서 어떻게 접목시켜 제작할지 방향성을 정하는 것도 매우 중요 미적 감각은 훈련 : 타고난 재능이 아니라 훈련을 통해 향상 가능. 보는 눈이 트여야 디자인도 잘함 non pbr 강점 : 3d(pbr)는 컴퓨터가 빛을 계산(사진 느낌)하지만, non pbr은 사람이 직접 빛을 그려 넣는(손그림 느낌) 방식으로 직접 명암을 그려 넣는 기술 전수 학원 수강 메리트 툴만 다루는 오퍼레이터 방지 : 단순히 툴만 잘하는 사람이 아니라, 드로잉 실력을 갖춘 진짜 디자이너 양성 취업 강점 커리큘럼 : 플랫모션 + 영상 편집 능력 조합으로 취업 시장에서 대체 불가능한 스펙 형성 non pbr 특화 : 3d와 2d를 넘나드는 하이엔드 아티스트로 양성 5. 자주 묻는 질문 (q&a) q. 드로잉 한 달만 배우고 스토리보드 들어도 되나요? a. 통상적으로 드로잉 과정을 끝내야 수월함. 부족하면 학과장님 상담 필요. q. 3d(pbr)랑 포토샵(non pbr) 차이가 뭐예요? a. pbr은 컴퓨터가 빛을 계산(사진 느낌), non pbr은 사람이 직접 빛을 그려 넣는(손그림 느낌) 방식. 6. 기타 드로잉: 컨셉아트, 일러스트, 그래픽디자인, 영상 제작 등 다양한 분야에서 사용되는 작업의 가장 기본이 되는 과정 디지털 드로잉은 다양한 분야에 접목해 사용 가능 스토리보드는 모든 영상 작업의 기초이자 핵심"},"99_시스템/03_학과지식/암기노트_영상모션_웹.md":{"t":"암기노트 영상모션 웹","s":"","g":[],"d":"2026-08-10","f":"학과 지식","l":["99_시스템/03_학과지식/학과별_커리큘럼_수강료_트리.md","99_시스템/03_학과지식/AIX_모듈개편_정본.md"],"h":"<ul><li>\n상태: 작성일·갱신일 표기가 없다\n</li><li>\n핵심: 영상/모션 학과와 웹 디자인·퍼블리싱\n</li></ul>\n<p>학과의 상담 암기노트다</p>\n<ul><li>\n주의: 수강료·과목명은 <a class=\"wl\" data-doc=\"99_시스템/03_학과지식/학과별_커리큘럼_수강료_트리.md\">학과별_커리큘럼_수강료_트리</a>·\n</li></ul>\n<p><a class=\"wl\" data-doc=\"99_시스템/03_학과지식/AIX_모듈개편_정본.md\">AIX_모듈개편_정본</a>과 대조한 뒤 쓴다</p>\n<blockquote>영상/모션 학과 + 웹 디자인&amp;퍼블리싱 학과</blockquote>\n<hr>\n<h5>✅ 학과 선택 → 딱 2줄</h5>\n<div class=\"tw\"><table><thead><tr><th>이런 사람</th><th>이 학과</th></tr></thead><tbody><tr><td>영상 <strong>살짝</strong>만 하고 싶어</td><td><strong>유튜브 학과</strong> (Light / 기획 중심)</td></tr><tr><td>영상 <strong>제대로</strong> 파고 싶어</td><td><strong>모션 학과</strong> (Deep / 기술 중심)</td></tr></tbody></table></div>\n<hr>\n<h5>✅ 커리큘럼 흐름 (무조건 순서로 외우기)</h5>\n<blockquote>[!tip] 스토리: <strong>소스 만들기 → 편집 → 심화/3D → 포폴</strong></blockquote>\n<h4>Phase 1 | 소스 제작</h4>\n<ul><li>\n포토샵 → 포토웍스(심화) → 일러스트 → 디일러(심화) → <strong>플랫모션</strong>\n</li></ul>\n<h4>Phase 2 | 영상 편집 ⭐ CORE</h4>\n<ul><li>\n<strong>프리미어</strong> → 컷편집, 자막\n</li><li>\n<strong>에펙(After Effects)</strong> ⭐ → 키프레임·마스크·매트. <strong>&quot;영상 입문의 핵심이자 척도!&quot;</strong>\n</li><li>\n<strong>모션 에펙</strong> → 타이포그래피, 파티클, Duik 캐릭터 애니\n</li><li>\n<strong>AI 크리에이터</strong> → Sora·Veo·CapCut·Vrew\n</li></ul>\n<h4>Phase 3 | 심화·3D</h4>\n<ul><li>\n어드밴스 에펙 1/2 → <strong>C4D(시네마4D) 1/2/3</strong> (Mograph·Dynamics·Octane)\n</li></ul>\n<h4>Phase 4 | 포폴</h4>\n<ul><li>\n2D/3D 모션 포폴 (2~3개월)\n</li></ul>\n<hr>\n<h5>✅ 핵심 개념 → 이것만!</h5>\n<div class=\"tw\"><table><thead><tr><th>개념</th><th>한 줄 요약</th></tr></thead><tbody><tr><td><strong>AI는 거들 뿐</strong></td><td>AI=재료, 사람이 가공·편집</td></tr><tr><td><strong>에펙 = 척도</strong></td><td>에펙 잘하면 영상 실력 검증</td></tr><tr><td><strong>플랫 모션</strong></td><td>소스를 <strong>내가 직접</strong> 그려서 씀 (남의 거 ❌)</td></tr><tr><td><strong>형태+질감+움직임</strong></td><td>CG+서페이싱+모션 → 고품질 영상</td></tr><tr><td><strong>AI(생산성)+인간(디테일)</strong></td><td>AI로 시간 벌고, 에펙·C4D로 차별화 → 필승 전략</td></tr></tbody></table></div>\n<hr>\n<h5>✅ AI 영상 도구 비교</h5>\n<div class=\"tw\"><table><thead><tr><th>도구</th><th>특징</th></tr></thead><tbody><tr><td><strong>Sora</strong></td><td>오픈AI. 현재 VIP 전용</td></tr><tr><td><strong>Veo2</strong></td><td>구글. <strong>숏폼</strong> 특화</td></tr><tr><td><strong>Veo3</strong></td><td>구글. <strong>롱폼</strong> 특화</td></tr><tr><td><strong>Runway</strong></td><td>⚠️ 트렌드에서 <strong>밀리는 추세</strong></td></tr><tr><td><strong>CapCut / Vrew</strong></td><td>편집 AI 워크플로우 도구</td></tr><tr><td><strong>어도비 센세이</strong></td><td>어도비 계열 내장 AI</td></tr></tbody></table></div>\n<blockquote>[!warning] 시험 함정!</blockquote>\n<blockquote><strong>Runway ❌ 밀림 / Veo ✅ 우세</strong> → 텍스트 이해도·영상 퀄리티 모두 Veo 승</blockquote>\n<hr>\n<hr>\n<h5>✅ 핵심 비유 → 무조건 외우기</h5>\n<div class=\"tw\"><table><thead><tr><th>비유</th><th>실제 의미</th></tr></thead><tbody><tr><td><strong>홀 서빙</strong> (손님이 보는 곳)</td><td><strong>프론트엔드</strong> = 우리가 배우는 것</td></tr><tr><td><strong>주방</strong> (보이지 않는 곳)</td><td>백엔드 = 데이터 처리</td></tr><tr><td><strong>땅</strong></td><td>서버</td></tr><tr><td><strong>주소</strong></td><td>도메인</td></tr><tr><td><strong>칼질</strong></td><td>툴 사용법</td></tr><tr><td><strong>요리 실력</strong></td><td>디자인 감각 (본질)</td></tr></tbody></table></div>\n<hr>\n<h5>✅ 핵심 툴 4총사</h5>\n<div class=\"tw\"><table><thead><tr><th>툴</th><th>역할</th><th>방식</th></tr></thead><tbody><tr><td><strong>포토샵</strong></td><td>이미지 보정·웹 그래픽</td><td>비트맵</td></tr><tr><td><strong>일러스트레이터</strong></td><td>로고·아이콘·소스 제작</td><td>벡터 (안 깨짐)</td></tr><tr><td><strong>피그마(Figma)</strong></td><td>화면 설계·프로토타이핑</td><td>실무 1순위 기획 도구</td></tr><tr><td><strong>VS Code</strong></td><td>코딩 에디터</td><td>전 세계 전문가 표준</td></tr></tbody></table></div>\n<hr>\n<h5>✅ 커리큘럼 흐름</h5>\n<blockquote>[!tip] 스토리: <strong>UXUI 설계 → 퍼블리싱(Web 1~4) → 웹모션 → 포폴</strong></blockquote>\n<h4>1단계 | UXUI (피그마)</h4>\n<ul><li>\n<strong>UXUI 1</strong> → 피그마 기본 + 초기 설계\n</li><li>\n<strong>UXUI 2</strong> → 피그마 심화 + <strong>반응형 웹</strong> 설계 (다양한 기기 대응)\n</li></ul>\n<h4>2단계 | 웹 퍼블리싱 Web 1~4 ⭐ 핵심</h4>\n<div class=\"tw\"><table><thead><tr><th>과목</th><th>내용</th><th>키워드</th></tr></thead><tbody><tr><td><strong>Web 1</strong></td><td>웹 표준 문법 기초</td><td>기초 공사</td></tr><tr><td><strong>Web 2</strong></td><td>HTML5 + CSS3</td><td><strong>시멘틱 태그</strong>, SEO, 웹 접근성</td></tr><tr><td><strong>Web 3</strong></td><td>반응형 웹 구현</td><td>PC·모바일·태블릿 최적화</td></tr><tr><td><strong>Web 4</strong></td><td>동적 구현</td><td><strong>JS + jQuery + ES6(ECMA6)</strong></td></tr></tbody></table></div>\n<h4>심화</h4>\n<ul><li>\n<strong>웹모션</strong> → SVG 애니메이션으로 역동적인 인터랙션\n</li><li>\n<strong>웹 포폴</strong> → 자기소개 + 리뉴얼 사이트 2개 이상\n</li></ul>\n<hr>\n<h5>✅ 핵심 개념 → 이것만!</h5>\n<div class=\"tw\"><table><thead><tr><th>개념</th><th>설명</th></tr></thead><tbody><tr><td><strong>시멘틱 태그</strong></td><td>의미 있는 HTML 태그 → SEO·접근성 (Web 2)</td></tr><tr><td><strong>반응형 웹</strong></td><td>기기별 화면 최적화 (Web 3)</td></tr><tr><td><strong>ES6 (ECMA6)</strong></td><td>JS 최신 문법 = &quot;조종사 업그레이드 훈련&quot;</td></tr><tr><td><strong>SVG 애니메이션</strong></td><td>코드로 움직이는 웹 인터랙션 (웹모션)</td></tr><tr><td><strong>하이브리드 앱</strong></td><td>웹 배우면 앱 안의 웹도 구현 → 취업 범위 ↑</td></tr><tr><td><strong>Git</strong></td><td>작업 세이브 파일</td></tr><tr><td><strong>GitHub</strong></td><td>결과물 전시하는 인스타그램</td></tr></tbody></table></div>\n<hr>\n<hr>\n<h5>🎬 모션/영상</h5>\n<ul><li>\n학과 선택: <strong>가볍게=유튜브 / 깊게=모션</strong>\n</li><li>\n흐름: <strong>소스(플랫모션) → 에펙 → C4D → 포폴</strong>\n</li><li>\n에펙: <strong>영상 입문의 핵심이자 척도</strong>\n</li><li>\nAI 도구: <strong>Veo 우세 / Runway 밀림</strong>\n</li><li>\n플랫모션: <strong>소스 직접 제작, 남의 거 ❌</strong>\n</li></ul>\n<h5>🌐 웹</h5>\n<ul><li>\n툴: <strong>포샵(비트맵) / 일러(벡터) / 피그마(기획) / VS Code(코딩)</strong>\n</li><li>\n흐름: <strong>Web1 기초 → Web2 HTML5+CSS3 → Web3 반응형 → Web4 JS+ES6</strong>\n</li><li>\n프론트엔드: <strong>홀 서빙 = 우리가 배우는 것</strong>\n</li><li>\nES6: <strong>JS 최신 훈련 문법</strong>\n</li><li>\n하이브리드 앱: <strong>웹 배우면 앱도 됨 → 취업 범위 ↑</strong>\n</li></ul>\n<hr>\n<blockquote>💪 <strong>시험 잘 보고 와! 화이팅!</strong></blockquote>","x":"상태: 작성일·갱신일 표기가 없다 핵심: 영상/모션 학과와 웹 디자인·퍼블리싱 학과의 상담 암기노트다 주의: 수강료·과목명은 학과별_커리큘럼_수강료_트리 · aix_모듈개편_정본 과 대조한 뒤 쓴다 영상/모션 학과 + 웹 디자인&퍼블리싱 학과 ✅ 학과 선택 → 딱 2줄 이런 사람 이 학과 영상 살짝 만 하고 싶어 유튜브 학과 (light / 기획 중심) 영상 제대로 파고 싶어 모션 학과 (deep / 기술 중심) ✅ 커
