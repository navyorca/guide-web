금영수증</span><span class=\"tag\">가상계좌</span><span class=\"tag\">나이스</span><span class=\"tag\">입금자명의</span><span class=\"tag\">COD규정</span><span class=\"tag\">분납규정</span><span class=\"tag\">배정순서</span></p>\n<ul><li>\n<strong>할인율 제한</strong>: 최대 40% 초과 불가.\n</li><li>\n<strong>쿠폰 사용</strong>: 네이버 예약 쿠폰 / 리뷰 이벤트(5만)는 별도 사용 가능. (승인 받고 진행).\n</li><li>\n<strong>결제 수단별 지침</strong>:\n<ul><li>\n<ul><li>\n<strong>온라인 입금/현금</strong>: 현금영수증 발급 필수.\n</li><li>\n<strong>나이스 가상계좌</strong>: 고객이 직접 현금영수증 발급 신청.\n</li><li>\n<strong>카드 결제</strong>: 카드만 공제금 받고 내역 작성 필. 카드 제외 타 결제수단은 부분 취소 가능함.\n</li><li>\n<strong>입금자 명의</strong>: 최초 입금자/본인 명의만 가능 (아니면 관계 입증 제3자 서류 필수).\n</li></ul>\n</li></ul>\n</li><li>\n<strong>COD (Cash On Delivery) 규정</strong>:\n<ul><li>\n<ul><li>\n원칙적으로 불가, 배정 X.\n</li><li>\n유효기간: 등록한 주 주말까지.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>분납(할부) 규정</strong>: 첫 달에는 분납금만큼의 가격을 가진 1개 과목만 배정 가능. 확인 필요\n</li><li>\n<strong>배정 순서</strong>: 완납 기준 배정.\n</li></ul>\n<h5>2. 특수처리 프로세스 (중요)</h5>\n<p class=\"tags\"><span class=\"tag\">특수처리</span><span class=\"tag\">특처</span><span class=\"tag\">특처프로세스</span><span class=\"tag\">배정변경</span><span class=\"tag\">과목변경</span><span class=\"tag\">결제변경</span><span class=\"tag\">50퍼센트초과</span><span class=\"tag\">환불불가</span></p>\n<ul><li>\n<strong>재수강(4+1)</strong>: 4개 들으면 1개 무료(재수강권). 조건 되는지 확인\n</li><li>\n<strong>참여 수강</strong>: 미수강을 멘토 재량으로 수강권 지급. 단, 자리가 있어야 배정 가능(제일 아래 순위).\n</li><li>\n<strong>과목 변경</strong>: 차액 좀 할인 넣어서 받으면 상세 처리 내역 기재 필수.\n</li><li>\n<strong>결제 변경</strong>: 결제 수단 변경 시, 재결제 할 때 변경 내역(결제 종류) 및 변경 사유 '상세 기재' 필수.\n</li><li>\n<strong>특수처리 불가 사유</strong>: 학생이 수업 50% 이상 진행 시 배정 변경/환불 불가. 상세 내역 기재 필수. (공제금 관련 질문 필요).\n</li></ul>\n<h5>3. 특수처리 종류 (9가지)</h5>\n<p class=\"tags\"><span class=\"tag\">특처종류</span><span class=\"tag\">특처9가지</span><span class=\"tag\">배정변경</span><span class=\"tag\">과목변경</span><span class=\"tag\">따즈아환불</span><span class=\"tag\">수강료변경</span><span class=\"tag\">원서재등록</span><span class=\"tag\">지점이동</span><span class= 인트라넷_업무양식_절차_통합.md</code>에 보존.</p>\n<h5>지각</h5>\n<p>지각자 모든 DB제한(단 개인/당직/페북/구글/기타 문의 배정)</p>\n<p>비고: 개인/당직/페북/구글/기타 문의도 출근 후 배정시작. 지하철 연착 인정(20분 이상 연착 확인 시) 혹은 실시간 공유 플랫폼(X[구 트위터], 네이버 날씨CAST 등)에 조회되는 내용 확인 시 인정 가능.</p>\n<h5>순매출</h5>\n<p>1000 / 1200 / 1500 (경력 6개월 이하: 800 / 1000 / 1200)</p>\n<p>예외상황: 신혼여행, 입원 등 장기적 휴식 시 제한 수치 개별 조정. 주차별 -25% 완화 적용.</p>\n<p>비고: 이 외 기준에 있던 예외사항 없음. 휴직자의 경우 휴직 전월 영업결과 복귀 후 적용.</p>\n<h5>제한 반복·해제 시점</h5>\n<p>지각한 경우 → 다음날 또 제한</p>\n<p>미출근 경우 → 다음날 또 제한</p>\n<p>조퇴한 경우 → 조퇴 시점 이후 제한</p>\n<p>오전제외(보고건) 경우 → 출근 시점 이전까지 제한</p>\n<p>선배정은 디비제한 관계없이 배정</p>\n<h5>선배정 (경력 기준)</h5>\n<p>우측 해당 시 공식 선배정 1턴</p>\n<ul><li>\n전일 매출 500 이상 1위 선배정\n</li><li>\n누적 광고비 5만원 이상 사용 시 선배정\n</li><li>\n개인디비 5개당 선배정\n</li><li>\n네이버리뷰(10포인트당 / 영업월 기준 최대 2건)\n</li></ul>","x":"상위: 00_업무위키 · 통화량 기준 위키_입사교육본_변경사항 · 조회 절차 위키_통화량체크절차 db 제한내용 디비제한 db제한 순매출제한 지각제한 조퇴 선배정 디비단가 통화량 구버전 표(260504판: 디비단가 하얀색 50분·빨간색 80분, 특이사항·차감항목 포함)는 2026 07 30 폐기했다. 통화량 기준·차감 항목 현행본은 위키_입사교육본_변경사항 , 조회 절차는 위키_통화량체크절차 . 폐기 전 원문은 zz_아카이브\\260730_양식분리\\인트라넷_업무양식_절차_통합.md 에 보존. 지각 지각자 모든 db제한(단 개인/당직/페북/구글/기타 문의 배정) 비고: 개인/당직/페북/구글/기타 문의도 출근 후 배정시작. 지하철 연착 인정(20분 이상 연착 확인 시) 혹은 실시간 공유 플랫폼(x 구 트위터 , 네이버 날씨cast 등)에 조회되는 내용 확인 시 인정 가능. 순매출 1000 / 1200 / 1500 (경력 6개월 이하: 800 / 1000 / 1200) 예외상황: 신혼여행, 입원 등 장기적 휴식 시 제한 수치 개별 조정. 주차별 25% 완화 적용. 비고: 이 외 기준에 있던 예외사항 없음. 휴직자의 경우 휴직 전월 영업결과 복귀 후 적용. 제한 반복·해제 시점 지각한 경우 → 다음날 또 제한 미출근 경우 → 다음날 또 제한 조퇴한 경우 → 조퇴 시점 이후 제한 오전제외(보고건) 경우 → 출근 시점 이전까지 제한 선배정은 디비제한 관계없이 배정 선배정 (경력 기준) 우측 해당 시 공식 선배정 1턴 1. 전일 매출 500 이상 1위 선배정 2. 누적 광고비 5만원 이상 사용 시 선배정 3. 개인디비 5개당 선배정 4. 네이버리뷰(10포인트당 / 영업월 기준 최대 2건)"},"99_시스템/03_학과지식/건축인테리어학과_지식_통합본.md":{"t":"건축인테리어학과 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>🏗️ 건축·인테리어학과 지식 통합본</h3>\n<p>건축·인테리어학과 상담에 필요한 지식을 한 문서로 모았다. 학과 개요와 진출 분야, 자격증 체계, 캐드·스케치업·라이노·렌더러 등 프로그램 비교, 도면 종류와 현장 용어, 커리큘럼, 취업, 상담 포인트, 수강료를 다룬다. 9월 이후 개강·상담의 과목명은 AIX 커리큘럼 개편 정본을 먼저 확인한다.</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(캐드1,2→AIX 공간기획&amp;도면, 스케치업1,2→AIX 3D인테리어). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<blockquote>핵심 한 줄: <strong>도면(CAD) → 공간(SketchUp) → 실사(렌더링) → 포트폴리오</strong> 흐름을 잡으면 상담이 쉬워진다.</blockquote>\n<hr>\n<h3>1. 학과 개요 및 진로</h3>\n<h4>핵심 목표</h4>\n<ul><li>\n건축사무소 취업 (설계 + 시공)\n</li><li>\n최종 결과물: <strong>스케치업 기반 인테리어 포트폴리오</strong> (인테리어 디자인 + 제품 디자인 결합)\n</li></ul>\n<h4>진출 분야</h4>\n<ul><li>\n실내건축, 공간디자인, 산업디자인, 인테리어 디자인\n</li><li>\nVMD (Visual Merchandising Design → 시디와 인테리어 하이브리드)\n</li><li>\n무대·전시 디자인\n</li></ul>\n<h4>업무 흐름</h4>\n<ul><li>\n대기업·설계 중심: 건축사무소\n</li><li>\n소규모·전문: 인테리어 디자인 / 시공 회사\n</li></ul>\n<h4>작업 프로세스 전체 흐름</h4>\n<blockquote>비유: 요리 과정 → 기획(메뉴 구상) → 설계(계량) → 모델링(조리) → 렌더링(플레이팅) → 보정(필터)</blockquote>\n<pre><code>STEP 1  기획 &amp; 스케치    손 스케치, 레퍼런스 수집\nSTEP 2  2D CAD (뼈대)    정확한 치수의 도면 작도\nSTEP 3  3D SketchUp (살) 입체 공간 모델링\nSTEP 4  V-Ray / Enscape  재질/조명 입혀 실사처럼 렌더링\nSTEP 5  Photoshop        색감 조정 및 리터칭\nSTEP 6  제안서/기안서    PPT 등으로 최종 결과물 도출</code></pre>\n<blockquote>핵심 원칙: <strong>캐드(뼈대)가 튼튼해야 스케치업(살)이 예쁘게 붙는다!</strong></blockquote>\n<hr>\n<h3>2. 자격증 체계</h3>\n<h4>자격증 종류 및 등급</h4>\n<div class=\"tw\"><table><thead><tr><th>자격증</th><th>종류</th><th>응시 조건</th><th>설명</th></tr></thead><tbody><tr><td>CAT 2급</td><td>민간자격</td><td>제한 없음</td><td>제시된 3D 형상을 보고 CAD 명령어로 2D 투상도(정면·평면·측면)를 정확히 복원하는 능력 평가. &quot;받아쓰기 레벨&quot;. 매달 시험 있음.</td></tr><tr><td>CAT 1급</td><td>민간자격</td><td>-</td><td>3D 도면 작성</td></tr><tr><td>전산응용건축제도기능사 (전응건)</td><td>국가기술자격</td><td>제한 없음</td><td>건축 구조 원리 이해 필요. 평면도 하나로 벽체·지붕·온돌 바닥 등 상세 단면도·입면도를 스스로 설계. &quot;에세이(논문) 작성 레벨&quot;.</td></tr><tr><td>실내건축기능사</td><td>국가기술자격</td><td>제한 없음</td><td>필기/실기. 의류매장·오피스·북카페 등 설계.</td></tr><tr><td>실내건축산업기사</td><td>국가기술자격</td><td>전문대졸 / 실무 2년</td><td>위와 동일 수준 설계 + 요건 필요.</td></tr><tr><td>실내건축기사</td><td>국가기술자격</td><td>4년제졸 / 실무</td><td>아웃도어 매장·병원·공공시설·도서관 등 복합공간 설계.</td></tr><tr><td>기계제도기능사</td><td>국가기술자격</td><td>제한 없음</td><td>CAD(2D 도면) + 인벤터(3D 부품 모델링) 능력을 모두 평가. &quot;CAD + 인벤터 콤보&quot;.</td></tr><tr><td>전산응용기계제도기능사 (전응기)</td><td>국가기술자격</td><td>제한 없음</td><td>기계 제도 분야 CAD 활용.</td></tr><tr><td>BIM 자격증</td><td>-</td><td>-</td><td>BIM(레빗) 관련 전문 자격.</td></tr></tbody></table></div>\n<h4>자격증 전략</h4>\n<ul><li>\n인테리어 업계는 포트폴리오도 중요하지만 <strong>자격증 취득이 매우 중요</strong> (성실함과 자기관리의 척도)\n</li><li>\n비전공자도 필수 취득 권장\n</li><li>\n기사는 자격 요건 충족 시 1달 만에도 가능하나, 비전공자는 실기 기초부터 <strong>최소 6개월</strong> 소요 추천\n</li><li>\n전략: 3년치 기출문제를 1년 다듬기 방식으로 공략\n</li></ul>\n<hr>\n<h3>3. 프로그램·툴 비교</h3>\n<h4>3-1. 2D 도면: AutoCAD</h4>\n<ul><li>\n건축, 기계, 인테리어 등 <strong>전 산업 분야의 기본이 되는 전자 제도 프로그램</strong>\n</li><li>\n건축물을 짓기 위한 정확한 2D 밑그림 역할\n</li><li>\n'실습'이 핵심 (명령어 암기보다 실무형 도면 작성 우선)\n</li><li>\n스케치업 포트폴리오의 밑바탕\n</li></ul>\n<h4>3-2. 3D 모델링 방식 이해</h4>\n<div class=\"tw\"><table><thead><tr><th>방식</th><th>원리</th><th>특징</th><th>대표 프로그램</th></tr></thead><tbody><tr><td>폴리곤</td><td>벽돌 쌓기</td><td>직선·직각 표현 우수. 곡선 표현은 폴리곤이 많아져 렌더링 오래 걸림.</td><td>SketchUp, 3ds MAX</td></tr><tr><td>넙스(NURBS)</td><td>선 구조 방식</td><td>선과 선을 연결해 자유자재로 곡선 표현 가능.</td><td>Rhino, 라이노</td></tr><tr><td>서브디비전</td><td>픽사(Pixar) 고안</td><td>폴리곤+넙스 장점 결합.</td><td>3ds MAX</td></tr></tbody></table></div>\n<h4>3-3. 주요 3D 프로그램 비교</h4>\n<div class=\"tw\"><table><thead><tr><th>프로그램</th><th>특징</th><th>주 용도</th><th>난이도</th></tr></thead><tbody><tr><td>SketchUp (스케치업)</td><td>폴리곤 방식. 빠르다, 쉽다, 업계 표준. 루비(플러그인)로 기능 확장 가능. 단점: 곡선 형태 깨지기 쉬움.</td><td>건축인테리어, 무대전시, VMD</td><td>하 (3D 중 가장 쉬움)</td></tr><tr><td>Rhino (라이노)</td><td>넙스 방식. 자유로운 곡선 표현. 캐드(오토데스크)와 완벽 호환.</td><td>제품 디자인, 산업디자인. 건축 곡선 디자인 수요 증가로 건축에도 사용 확대.</td><td>상 (배우기 어려움)</td></tr><tr><td>Inventor (인벤터)</td><td>기계 부품/설비 정밀 설계 특화. 라이노가 '겉포장'이면 인벤터는 '내부 부품'.</td><td>기계설계, 기계제도</td><td>중</td></tr><tr><td>3ds MAX</td><td>서브디비전 방식. 고퀄리티 3D 제작. 오토데스크 사 인수 (원래 별도).</td><td>건축인테리어 고퀄 작업, 대형 수주 프로젝트</td><td>상</td></tr><tr><td>Maya</td><td>3ds MAX와 동일 회사(오토데스크).</td><td>영화·애니메이션</td><td>상</td></tr><tr><td>BIM Revit (레빗)</td><td>빌딩 인포메이션 모델링. 설계 쪽에 가까움. 물량산출·적산 가능(타일 개수·단가·총금액 자동 계산). 건축 인허가에 BIM 도면 필수화.</td><td>건축설계, 시공</td><td>중상</td></tr></tbody></table></div>\n<blockquote>참고: 카티아(자동차·항공기·조선), 솔리드웍스(일반기계·전자장비·의료기기)는 다쏘시스템즈 프로그램. 본원 강좌 없음.</blockquote>\n<blockquote>BIM 수업은 희소성 높음. 특히 이 근방에서는 <strong>강남점에서만 수업</strong> 진행 → 상담 시 적극 어필할 것.</blockquote>\n<h4>3-4. 렌더링 프로그램 비교</h4>\n<div class=\"tw\"><table><thead><tr><th>렌더러</th><th>특징</th><th>추천 대상</th></tr></thead><tbody><tr><td>V-RAY (브이레이)</td><td>고퀄리티 실사 렌더링. 빛·색 온도 정밀 세팅 필요. 스케치업의 꽃. 실시간 렌더링 지원.</td><td>고퀄 결과물이 필요한 모든 수강생</td></tr><tr><td>Enscape (엔스케이프)</td><td>스케치업 내장형 플러그인. 실시간 동기화. 빠르고 배우기 쉬움. 가성비 좋음.</td><td>빠른 확인·수정이 필요한 실무용</td></tr><tr><td>D5</td><td>언리얼엔진 기반, 물리 기반 렌더링(PBR). 재질 입히기 쉬움. 자체 클라우드에서 마감재·3D 컴포넌트 소스 제공. 인스타 감성 고화질 결과물에 강함.</td><td>고화질 비주얼 중심 포트폴리오</td></tr><tr><td>Lumion (루미온)</td><td>기본 제공 어셋이 많음. 수목 표현, 실내 장면, 조경 표현 특화.</td><td>조경·건축 외관 렌더링</td></tr><tr><td>Twinmotion (트윈모션)</td><td>루미온보다 기능 많고, 엔스케이프보다 사용 편리.</td><td>루미온·엔스케이프 중간 성격</td></tr></tbody></table></div>\n<hr>\n<h3>4. 도면의 이해 및 현장 용어</h3>\n<h4>4-1. 도면 종류</h4>\n<blockquote>도면을 구분하는 기준: <strong>&quot;어느 방향에서 보느냐&quot;</strong></blockquote>\n<pre><code>평면도 (Plan)\n├─ 시선: 위에서 아래 (1.2m 높이에서 잘라 내려다봄)\n└─ 용도: 벽체·문·창문 위치 / 가구 배치 / 동선 파악\n\n천정도 (RCP, Reflected Ceiling Plan)\n├─ 시선: 아래에서 위 (바닥에 누워 천장을 올려다본 거울상)\n├─ 용도: 조명·에어컨·감지기·스프링클러 등 설비 배치\n└─ 주의: 거울상(Mirror Image)이라 좌우가 반전됨\n\n입면도 (Elevation)\n├─ 시선: 측면 (벽면을 정면/측면에서 바라봄)\n└─ 용도: 디자인 / 마감재 / 창문 모양 / 가구 높이\n\n단면도 (Section)\n├─ 시선: 수직 절단면 (케이크처럼 잘라 내부 구조 확인)\n└─ 용도: 층고 / 천장 속 공간 / 바닥 두께 / 단열재</code></pre>\n<blockquote>3줄 기억법: 평면도 → 위에서 (가구) / 천정도 → 아래에서 (조명) / 입면도 → 옆에서 (디자인)</blockquote>\n<h4>4-2. 필수 수치 단위</h4>\n<blockquote>모든 대화의 숫자는 <strong>mm(밀리미터)</strong> 다. 0 하나 빠지면 큰일 난다!</blockquote>\n<pre><code>T (두께, Thickness) → 1T = 1mm\n├─ &quot;유리 5T&quot;   → 5mm 두께 유리\n├─ &quot;합판 9T&quot;   → 9mm 두께 합판\n└─ &quot;아크릴 3T&quot; → 3mm\n\n전 (錢) → cm를 뜻하는 현장 은어 / 1전 = 1cm = 10mm\n├─ &quot;한 5전 띄워&quot; → 5cm 간격\n└─ &quot;2전 내려와&quot;  → 2cm 아래로\n\n평 (坪) → 면적 단위 / 1평 = 약 3.3㎡ / 계산: 가로m × 세로m ÷ 3.3\n└─ 아파트 34평 / 타일 1평(박스 단위)\n\n기준 높이 용어\n├─ GL  Ground Level   → 땅바닥 기준선\n├─ FL  Floor Level    → 마감 바닥 기준선\n└─ CH  Ceiling Height → 천장(반자) 높이</code></pre>\n<h4>4-3. 자재 용어</h4>\n<pre><code>뼈대 자재\n├─ 다루끼 (각목)  30×30mm (1치×1치) → 인테리어 뼈대. 가장 기본적으로 많이 쓰임.\n└─ 투바이 (2×4)   30×69mm → 다루끼보다 넓적하고 튼튼. 힘받는 벽체 기둥용.\n\n면재 (판재)\n├─ 석고보드   9.5T 기준 → 벽/천장 기본 바탕재. 도배/페인트 전에 붙임. 물에 약함.\n├─ MDF (엠디)       나무 톱밥을 본드로 뭉친 판. 표면 매끄러워 필름/페인트용. 물에 닿으면 퉁퉁 붊.\n└─ 합판 (Plywood)   얇은 나무 여러 겹. 나무결 보이고 튼튼. MDF보다 비쌈.</code></pre>\n<h4>4-4. 현장 용어</h4>\n<pre><code>구조 용어 (일본어 잔재) → 뜻을 알고 쓰는 것과 모르고 쓰는 것은 다르다.\n├─ 덴조 (天井) → 천장   &quot;덴조 쳤냐?&quot; = 천장 공사 다 했냐?\n├─ 가베 (壁)   → 벽     &quot;가베 세운다&quot; = 가벽을 만든다\n├─ 하리 (梁)   → 보     &quot;하리 때문에 더 못 올려요&quot; (가로 구조물)\n└─ 하시라 (柱) → 기둥   기둥 위치 확인 시 사용\n\n공구 은어\n├─ 빠루  → 노루발 못뽑이. 철거할 때 쓰는 쇠막대기.\n├─ 임팩  → 임팩트 드릴. 나사 박는 전동 드릴.\n├─ 기리  → 드릴 날(비트). &quot;콘크리트 기리 가져와&quot;\n└─ 헤라  → 주걱. 퍼티 바르거나 시트지 밀 때.\n\n작업 용어\n├─ 먹줄   → 기준선 표시. &quot;먹 때린다/놓는다&quot; = 공사 시작, 기준선 긋기\n├─ 메지   → 줄눈(타일 사이 틈). &quot;메지 넣었다&quot; = 타일 틈새를 시멘트로 채웠다\n├─ 단도리 → 준비·채비·정리. &quot;주변 단도리 좀 해라&quot; = 정리정돈 해라\n├─ 나라시 → 평탄화(바닥 고르기). &quot;바닥 나라시 해라&quot;\n├─ 마감   → 최종 표면 처리. &quot;마감이 왜 이래?&quot; = 끝처리가 지저분하다\n└─ 데나오시 → 재시공. 잘못 공사해서 뜯고 다시 하는 것.</code></pre>\n<hr>\n<h3>5. 커리큘럼</h3>\n<h4>5-1. 전체 학습 순서 (표준)</h4>\n<pre><code>스케치 기초 (1개월)\n  → CAD 수업 (2개월)\n    → SketchUp 1·2 (2개월)\n      → 렌더링 (V-RAY / Enscape)\n        → 포트폴리오 제작 (2~3개월)\n          → 자격증 대비반 (3~6개월, 병행 가능)</code></pre>\n<blockquote>진행 속도는 수강생마다 상이. 분석 → 도면 → 모델링/렌더링 순으로 진행.</blockquote>\n<h4>5-2. 스케치업 포트폴리오 프로세스 (약 2개월)</h4>\n<ul><li>\n스케치업 1단계: CAD에서 도면 가져오기(Import) → 정리·걷어내기\n</li><li>\n스케치업 2단계: 맵핑/렌더링 → 재질 입히기(ISO 매트릭 등) → V-RAY / Enscape 활용\n</li><li>\n포트폴리오 기획: 사전조사부터 시작 (참고 사례: 젠틀몬스터 매장)\n</li><li>\n제안서/기안서: PPT 등으로 최종 결과물 도출\n</li></ul>\n<blockquote>팁: 인체 스케일(Human Scale)에 맞게 가구/사람 모델링 배치 후 View 확인(앉아보기) 중요.</blockquote>\n<h4>5-3. 자격증 대비반 커리큘럼</h4>\n<ul><li>\n스케치 기초 (1개월)\n</li><li>\nCAD 수업 (2개월)\n</li><li>\n스케치업 (2개월)\n</li><li>\n대비반 진입: 실내건축 기출문제 3~6개월 풀이\n</li></ul>\n<hr>\n<h3>6. 취업·진로</h3>\n<h4>포트폴리오</h4>\n<ul><li>\n<strong>업계 취업 1순위 평가 요소</strong>\n</li><li>\n트렌드: 텍스트 위주 → <strong>비주얼(Visual) 중심</strong>으로 변화\n</li><li>\n인테리어 업계에서는 포트폴리오 외에 <strong>자격증</strong>과 <strong>공모전 수상</strong>도 매우 중요 (성실함·자기관리의 척도)\n</li><li>\n전공자(3~4학년) 과정이지만 비전공자도 충분히 고퀄리티 제작 가능\n</li><li>\n포트폴리오는 '기획'이 핵심\n</li></ul>\n<h4>스케치</h4>\n<ul><li>\n원래 '손 제도'가 있었으나 현재는 '스케치'로 대체\n</li><li>\n시공 현장에서 현장 소장님과의 즉각적인 소통(커뮤니케이션) 수단으로 필수\n</li><li>\n내가 보는 시점과 구도에 대해 배우는 기본 개념\n</li><li>\n학습 방향: 테크닉(발상/전술)보다는 <strong>내용</strong>에 집중\n</li></ul>\n<h4>인테리어 업계 핵심 트렌드</h4>\n<ul><li>\n'빨리 보여주고 빨리 수정하는' <strong>리얼타임</strong> 방식이 대세\n</li><li>\n시간과 예산을 절약하기 위해 3D 프로그램으로 가상공간 시각화\n</li><li>\n기획 → 모델링 → 렌더링 속도가 경쟁력\n</li><li>\n소규모 인하우스: 스케치업만 사용하는 경우도 있음\n</li><li>\n대형 수주·규모 큰 회사: 3ds MAX 사용하는 경우 많음\n</li></ul>\n<hr>\n<h3>7. 상담 포인트</h3>\n<h4>핵심 포인트 요약</h4>\n<ul><li>\n<strong>건축인테리어는 '공간'을 다룬다</strong> → 공간 디자인이 핵심 개념임을 먼저 설명\n</li><li>\n<strong>캐드가 기초</strong> → 모든 프로그램의 밑바탕. 캐드가 튼튼해야 스케치업이 예쁘게 붙음\n</li><li>\n<strong>스케치업이 업계 표준</strong> → 배우기 쉽고 빠름. 인테리어 업계 압도적 대세\n</li><li>\n<strong>렌더링은 선택이 아니라 필수</strong> → V-RAY, 엔스케이프, D5 등 수강생 목적에 맞게 추천\n</li><li>\n<strong>자격증 + 포트폴리오 투트랙</strong> → 둘 다 중요. 하나만 해서는 취업 경쟁력 약함\n</li><li>\n<strong>BIM 희소성 강조</strong> → 이 근방에서 강남점에서만 수업. 건축 인허가에 BIM 필수화로 수요 증가\n</li></ul>\n<h4>프로그램별 비유 (상담용)</h4>\n<div class=\"tw\"><table><thead><tr><th>프로그램</th><th>비유</th></tr></thead><tbody><tr><td>AutoCAD</td><td>모든 것의 시작, 전자 도면 (뼈대)</td></tr><tr><td>SketchUp</td><td>빠르게 벽돌 쌓기 (폴리곤 방식)</td></tr><tr><td>Rhino</td><td>매끄러운 겉포장 (넙스 방식)</td></tr><tr><td>Inventor</td><td>정교한 내부 부품</td></tr><tr><td>3ds MAX</td><td>토이스토리를 만든 프로그램. 하이퀄리티 전문용.</td></tr><tr><td>V-RAY</td><td>스케치업의 꽃</td></tr></tbody></table></div>\n<h4>자격증 비유 (상담용)</h4>\n<div class=\"tw\"><table><thead><tr><th>자격증</th><th>비유</th></tr></thead><tbody><tr><td>CAT 2급</td><td>받아쓰기 레벨</td></tr><tr><td>전산응용건축제도기능사</td><td>에세이(논문) 작성 레벨</td></tr><tr><td>기계제도기능사</td><td>CAD + 인벤터 콤보</td></tr></tbody></table></div>\n<h4>수업시간표</h4>\n<div class=\"tw\"><table><thead><tr><th>회차</th><th>시간</th></tr></thead><tbody><tr><td>①</td><td>09:30</td></tr><tr><td>②</td><td>11:30</td></tr><tr><td>③</td><td>14:00</td></tr><tr><td>④</td><td>16:00</td></tr><tr><td>⑤</td><td>19:00~22:00 (프리랜서·직장인 팀, 평일/주말 활용)</td></tr></tbody></table></div>\n<hr>\n<h3>8. 수강료 및 패키지</h3>\n<blockquote>단위: 만원 (과목당 단가). 실제 등록 시 팀장님께 견적 확인 필수.</blockquote>\n<h4>평일반</h4>\n<div class=\"tw\"><table><thead><tr><th>과목</th><th>세부 내용</th><th>수강료</th></tr></thead><tbody><tr><td>스케치/이론</td><td>-</td><td>50</td></tr><tr><td>캐드</td><td>캐드1: 기본 CAD 명령어, 도면 요소 제작 / 캐드2: 인테리어 도면 작성</td><td>45</td></tr><tr><td>스케치업</td><td>스케치업1: 기본 모델링, 루비 질감 적용 / 스케치업2: 브이레이 활용 실사 렌더링</td><td>50</td></tr><tr><td>맥스 (3ds MAX)</td><td>맥스1: 기본 명령어, 오브젝트 수정 / 맥스2: 기초 모델링, 주거공간 / 맥스3: 심화 모델링, 브이레이</td><td>50</td></tr><tr><td>엔스케이프</td><td>기본, 출력, 조명 세팅</td><td>25</td></tr><tr><td>인테리어 포트폴리오</td><td>-</td><td>60</td></tr><tr><td>스케치업 포트폴리오</td><td>-</td><td>60</td></tr><tr><td>인테리어 포트폴리오 기획</td><td>-</td><td>20</td></tr></tbody></table></div>\n<h4>주말반 (압축 속성반)</h4>\n<div class=\"tw\"><table><thead><tr><th>과목</th><th>수강료</th></tr></thead><tbody><tr><td>스케치/주</td><td>50</td></tr><tr><td>캐드 6주 정규 60% 수준</td><td>70</td></tr><tr><td>인벤터</td><td>30</td></tr><tr><td>라이노</td><td>70</td></tr><tr><td>전응건 (전산응용건축)</td><td>50</td></tr><tr><td>전응기 (전산응용기계)</td><td>60</td></tr><tr><td>CAT 2급</td><td>20</td></tr><tr><td>BIM1: 인터페이스 이해, 주택·생활시설 모델링</td><td>50</td></tr><tr><td>BIM2: 캐드 도면 도입, 일람표, 도면화</td><td>50</td></tr><tr><td>스케치업1/주 · 스케치업2/주</td><td>미정</td></tr></tbody></table></div>\n<h4>실내건축 자격증반</h4>\n<div class=\"tw\"><table><thead><tr><th>과목</th><th>내용</th><th>수강료</th></tr></thead><tbody><tr><td>실내건축1</td><td>CAD 작업</td><td>50</td></tr><tr><td>실내건축2</td><td>스케치업 작업</td><td>50</td></tr><tr><td>실내건축/기출</td><td>기출문제, 시험 대비반 1~3개월</td><td>50</td></tr></tbody></
