개자료 pdf는 과목 2a·2b 각 80h(8.9주)·과목 4 36h(4주, \"과목 2 선이수 기준 설계\"). 확인 전 시수는 \"설명회 발언 기준\"을 붙여 안내. 상담·산출물 적용 지침 9월 이후 개강 과목은 이 문서의 신과목명·시수로 안내한다. 8월 이전 개강분은 기존 과목명·시수 유지. 과목명·시수·수강료는 위 표 그대로만 사용한다. 표에 없는 항목은 창작하지 않고 확인 필요 로 남긴다. 견적 발행 시 금액 정본은 수강료_안내 다. 이 문서와 다르면 인트라넷 실측을 확인한 뒤 발행한다. 확정 공지가 나오면 이 문서 → 수강료_안내 → 용어집 순으로 같은 흐름에서 갱신한다. 재검 권장: v0.1 기획단계 문서 기반이므로 확정 공지 시점에 전 항목 재대조가 필요하다."},"99_시스템/03_학과지식/CG영상3D_완전정복.md":{"t":"CG영상3D 완전정복","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>🎬 CG · 영상 · 3D 완전 정복</h3>\n<blockquote>[!tip] 📌 한 줄 요약</blockquote>\n<blockquote><strong>&quot;3D라고 다 같은 3D가 아니다.&quot;</strong> 목적이 다르면 툴도 다르고 진로도 다르다.</blockquote>\n<p><strong>목차</strong> · <span class=\"wl off\">#영상의 3대장</span> · <span class=\"wl off\">#폴리곤 vs 넙스</span> · <span class=\"wl off\">#소프트웨어 도감</span> · <span class=\"wl off\">#CG vs 모션 툴 호환성</span> · <span class=\"wl off\">#CG 제작 파이프라인</span> · <span class=\"wl off\">#실무 연계성</span> · <span class=\"wl off\">#현장 용어 사전</span> · <span class=\"wl off\">#노드(Node)</span> · <span class=\"wl off\">#진로 결정 가이드</span> · <span class=\"wl off\">#커리큘럼 &amp;amp; 수강료</span></p>\n<hr>\n<h3>영상의 3대장</h3>\n<blockquote>[!abstract] 세 분야는 <strong>목적</strong>이 다르다. 목적을 먼저 이해하면 모든 것이 풀린다.</blockquote>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>🎨 모션그래픽</th><th>🌌 CG</th><th>🎬 영상편집</th></tr></thead><tbody><tr><td><strong>한 줄 요약</strong></td><td>디자인을 <strong>움직이게</strong> 만든다</td><td>가짜를 <strong>진짜처럼</strong> 만든다</td><td>이야기를 <strong>재미있게</strong> 엮는다</td></tr><tr><td><strong>비유</strong></td><td>스타일리스트</td><td>창조주</td><td>요리사</td></tr><tr><td><strong>주요 분야</strong></td><td>광고, 방송 타이틀, 예능 자막</td><td>영화, 드라마, 게임 시네마틱</td><td>유튜버, 방송국 PD, 영화 편집</td></tr><tr><td><strong>성향</strong></td><td>트렌드 민감 · 센스 중요</td><td>끈기(장인 정신) · 디테일 중요</td><td>스토리텔링 · 구성력</td></tr><tr><td><strong>메인 툴</strong></td><td>After Effects · C4D</td><td>Maya · Houdini · ZBrush</td><td>Premiere · DaVinci</td></tr></tbody></table></div>\n<hr>\n<h3>폴리곤 vs 넙스</h3>\n<blockquote>[!warning] ⚠️ <strong>미술(엔터)용</strong>과 <strong>설계(제조)용</strong>은 뿌리부터 다르다. 모델링을 배우기 전에 방향부터 정해야 한다.</blockquote>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>🟦 폴리곤 (Polygon)</th><th>🔶 넙스 (NURBS)</th></tr></thead><tbody><tr><td><strong>개념</strong></td><td>점·선·면의 집합 = 레고 블록</td><td>수학적 곡선 = 자와 컴퍼스</td></tr><tr><td><strong>비유</strong></td><td>포토샵(픽셀) → 수정 자유</td><td>일러스트레이터(벡터) → 치수 정확</td></tr><tr><td><strong>용도</strong></td><td>게임 · 영화 · 애니 · 캐릭터</td><td>자동차 · 제품 · 건축 · 금형</td></tr><tr><td><strong>주요 툴</strong></td><td><code>Maya</code> <code>C4D</code> <code>Blender</code> <code>ZBrush</code></td><td><code>Rhino</code> <code>CAD</code> <code>Catia</code> <code>Solidworks</code></td></tr></tbody></table></div>\n<hr>\n<h3>소프트웨어 도감</h3>\n<blockquote>[!info] 학생 수준과 목표에 맞춰 적절한 '탈것'을 추천하자.</blockquote>\n<pre><code>🎬 엔터테인먼트 계열 → &quot;상상을 현실로&quot;\n├─ 🚛 Maya (마야)         업계 표준. 못 만드는 게 없음. 영화/애니 필수.\n├─ 🏎️ Cinema 4D (C4D)    모션그래픽 특화. 빠르고 예쁘게 나옴. 방송/광고 필수.\n├─ 🔪 ZBrush (지브러시)    찰흙 깎듯이 작업. 주름·근육 극한 디테일. 타블렛 필수.\n├─ 🧪 Houdini (후디니)     수학적/절차적 제어. 폭발·파도 등 거대한 효과.\n└─ 🆓 Blender (블렌더)     무료. 모델링·렌더링·합성 전부 가능.\n\n🏗️ 설계/엔지니어링 계열 → &quot;도면을 현실로&quot;\n├─ 🚛 Inventor (인벤터)        실용성 최고. 제조/설비 현장용.\n├─ 🚗 Solidworks (솔리드웍스)   가장 대중적. 기계 설계 표준.\n└─ 🏎️ Catia (카티아)            항공기·자동차 외관 초정밀 설계.\n\n🖥️ 렌더러 종류\n└─ 엔스케이프 · 브이레이 · 아놀드 · 키샷 · 언리얼 · 옥테인 · 레드시프트 · 엑스파티클</code></pre>\n<hr>\n<h3>CG vs 모션 툴 호환성</h3>\n<blockquote>[!check] 2D는 90% 겹친다. 메인 3D 툴이 다를 뿐!</blockquote>\n<pre><code>🤝 공통 툴 (Adobe 계열)\n└─ 포토샵 · 일러스트 · After Effects(AE) → CG / 모션 모두 사용\n\n🔀 갈림길 → 메인 3D 툴\n├─ 🌌 CG   → Maya  기능 방대, 영화/애니 표준  /  AE 역할: 🔧 마무리기 (색보정·합성 서브)\n└─ 🎨 모션 → C4D   직관적·빠름, 방송/광고 표준  /  AE 역할: 🌟 주인공 (메인 엔진)</code></pre>\n<hr>\n<h3>CG 제작 파이프라인</h3>\n<blockquote>[!abstract] 혼자 다 못 한다. 각 분야 전문가들이 협업하여 만든다.</blockquote>\n<pre><code>📋 PRE (기획)\n├─ 🖼️ 매트 페인팅  배경 구성\n└─ 🤖 AI로 시안 제작\n\n🔨 PRODUCTION (제작)\n├─ 🦴 Maya  모델링 (뼈/살) → 리깅 (관절 심기) → 애니메이션 (연기)\n└─ 🌊 Houdini  FX (특수효과)\n\n🎨 POST (후반)\n└─ 🎞️ Nuke  합성 (3D + 실사 합침)</code></pre>\n<blockquote>[!tip] 💼 포폴 전략</blockquote>\n<blockquote><strong>&quot;AI 시안 → Maya 모델링 → 에펙 합성 → 최종 영상&quot;</strong> 워크플로우 전체를 보여주면 <strong>제너럴리스트</strong>로 평가. 취업 깡패 구간!</blockquote>\n<hr>\n<h3>실무 연계성</h3>\n<blockquote>[!abstract] <strong>재료(CG)</strong> 를 다듬어 <strong>요리(편집)</strong> 하는데 <strong>최신 조리도구(AI)</strong> 를 쓰는 관계</blockquote>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>🌌 CG</th><th>🎬 시각편집</th><th>🤖 AI</th></tr></thead><tbody><tr><td><strong>역할</strong></td><td>Source Maker (자산 생성)</td><td>Finisher (최종 완성)</td><td>Accelerator (가속화)</td></tr><tr><td><strong>주요 작업</strong></td><td>모델링, 리깅, FX, 렌더링</td><td>컷 편집, 색보정, 합성, 자막</td><td>레퍼런스, 텍스처 생성</td></tr><tr><td><strong>툴</strong></td><td>Maya, Houdini, ZBrush</td><td>Premiere, AE, Nuke</td><td>Midjourney, Meshy</td></tr></tbody></table></div>\n<pre><code>🔗 교집합 포인트\n\n① 🌌+🎬 CG + 영상편집 → 합성 (Compositing)\n   └─ AE나 Nuke로 빛·색·배경 보정. CG 아는 편집자 = 취업 범위 2배\n\n② 🌌+🤖 CG + AI → 프리프로덕션 &amp; 텍스처링\n   ├─ AI로 빠르게 시안 → 그림 못 그려도 콘티 가능\n   └─ Meshy AI로 Base Mesh 생성 → 사람은 리토폴로지·디테일 집중\n\n③ 🎬+🤖 영상편집 + AI → 효율화\n   └─ 자동 자막 · 컷 편집점 자동 탐색 · 행인 제거 · 프레임 보간</code></pre>\n<hr>\n<h3>현장 용어 사전</h3>\n<pre><code>📦 제작 공정\n├─ 🏺 모델링 (Modeling)       찰흙 빚기 → 무(無)에서 유(有)의 형태를 만드는 것\n├─ 🍊 UV / 언랩 (Unwrap)      귤껍질 까기 → 3D 물체를 평면으로 쫙 펴는 작업\n├─ 🕸️ 토폴로지 (Topology)     그물망 짜기 → N-gon(5각형↑) 금지 → Quad(4각형) 국룰\n└─ 🦴 리깅 (Rigging)          뼈대 심기 → 관절·조절기를 심어 움직일 수 있게 만드는 것\n\n🎨 시각 효과\n├─ 💄 룩뎁 (LookDev)          화장 &amp; 조명빨 → 재질감·조명으로 화면 '때깔' 결정\n├─ 📸 렌더링 (Rendering)       사진 인화 → 데이터를 영상/이미지로 출력하는 것\n├─ 🖼️ 매트 페인팅              배경 그림 합성 → 촬영 불가능한 거대 풍경을 그림으로 그려 합성\n├─ 🍱 합성 (Compositing)       플레이팅 → 따로 만든 소스들을 하나로 합쳐 완성본 만들기. CG의 꽃\n└─ ⚙️ 절차적 (Procedural)      자동화 수식 → 수치 하나 바꾸면 연결된 모든 결과 자동 수정 (후디니 핵심)\n\n🎞️ 모션 전용\n└─ 🌀 모그라프 (Mograph)       C4D 필살기 → 도형들을 규칙적으로 촤라락 움직이게 하는 C4D 전용 기능</code></pre>\n<hr>\n<h3>노드(Node)</h3>\n<blockquote>[!info] 같은 이름, 완전히 다른 의미!</blockquote>\n<pre><code>🌐 웹 → Node.js\n├─ 의미: 자바스크립트 실행 엔진 (JS가 서버에서도 동작할 수 있게 해주는 환경)\n├─ 툴:  VS Code, 서버 환경\n└─ 비유: 🦾 햄스터(JS)의 강력한 갑옷\n\n🎬 CG → Node-based 워크플로우\n├─ 의미: 상자와 선으로 이어진 작업 흐름 (데이터 처리의 단계별 연결점)\n├─ 툴:  Houdini, Nuke, Blender (Shader)\n└─ 비유: 🧱 데이터를 요리하는 레고 블록</code></pre>\n<blockquote>[!quote] 상담 치트키 → &quot;노드 = <strong>'연결점'</strong>. 웹에서는 네트워크상 연결점, CG에서는 데이터 처리의 단계별 연결점.&quot;</blockquote>\n<hr>\n<h3>진로 결정 가이드</h3>\n<pre><code>🔍 관찰형 → CG (Maya)\n   └─ &quot;저 쇠 질감은 어떻게 내지? 빛이 어떻게 반사되지?&quot;\n      리얼리티 추구 · 디테일 집착 · 장인 정신\n\n✨ 감각형 → 모션그래픽 (C4D)\n   └─ &quot;화면 색감, 폰트 디자인, 음악에 맞춘 화려한 전환!&quot;\n      센스 추구 · 트렌드 민감 · 빠른 결과물\n\n📐 설계형 → 제품디자인 (Rhino)\n   └─ &quot;내가 디자인한 제품을 실제로 생산하고 싶다.&quot;\n      치수/제품 · 제조 현장 · 실물 생산</code></pre>\n<hr>\n<h3>커리큘럼 &amp; 수강료</h3>\n<blockquote>단위: 만원 (과목당 단가) · 💡 실제 등록 시 팀장님께 견적 확인 필수</blockquote>\n<pre><code>💼 CG (마야 / VFX)\n&gt; 기본 30~70 / 전문 트랙 전부 80 · ⚠️ 특강 12월 이후 폐강\n\n📅 평일 기본 과목\n├─ 🦴 마야 (70)\n│     마야1 기초 모델링 / 마야2 렌더링 / 마야3 리깅 애니\n├─ 🫧 블렌더 (50)\n│     블렌더1 기초 모델링 / 블렌더2 맵핑 렌더링\n├─ 🦖 크리처아트 1·2·3  해부학 기반 인체 조사 작업  (70)\n├─ 🏞️ 리얼타임렌더 (30)\n│     1 에셋 활용, 랜드스케이프 / 2 스플라인, PCG\n└─ 🖼️ 매트페인팅 (30)\n      1 기초합성, 공간구성 / 2 퀄리티업, 배경제작\n\n🎓 전문 트랙 (모두 80, 단계별 수강)\n├─ 🗿 모델링\n│     1 지브러시 기초, 해골제작\n│     2 카툰얼굴 제작\n│     3 실사 얼굴 제작\n│     4 더미활용 전신모델링\n│     5 마야 활용 의상제작, 마블러스 기초\n│     6 섭스턴스 활용 심화 텍스처링 / 포폴 6~9\n├─ 💡 룩뎁\n│     1 라이팅, 머티리얼 이해, UDIM 텍스처\n│     2 실사 텍스처링, 렌더링 후보정\n│     3 유리재질, 빛 이해\n│     4 언리얼 기초, 노드이해, 지형제작\n│     5 에셋 모듈 실내배치, 무비 렌더\n│     6 에셋 실외배치, 워터 플러그인, 카메라 설정 / 포폴 6~9\n├─ 🏃 애니\n│     1 12가지 모션법칙 / 2 걷기, 달리기\n│     3 페이셜리깅, 리프팅 / 4 다이나믹액션\n│     5 감정표현, 11초클럽 / 포폴 4~6\n├─ 🎞️ 합성\n│     1 누크 기본 인터페이스\n│     2 FX 효과보정, 매트레이어 / 3 실사 3D 합성\n│     4 언리얼 활용 합성 / 5 언리얼 합성, 포폴기획 / 포폴 3~5\n├─ 🔩 하드섭\n│     1 마야 심화모델링, UV\n│     2 지브러시 인터페이스, 마야-지브러시 연동\n│     3 섭스턴스페인터 기초 / 4 지브러시 환경모델링\n│     5 언리얼엔진 모델링, 텍스처 추출 / 포폴 6~9\n└─ 🌊 후디니\n      1 지오메트리 기초, 워크플로우\n      2 연기/불/눈 / 3 번개/붕괴 / 4 폭발/토네이도\n      5 물/강/바다 / 6 CFX/천/헤어/군중\n      7 트레이닝/준포폴 제작 / 포폴 6~9</code></pre>\n<blockquote>[!note] 📎 출처: 교육팀 과정 설명회 (김석민 학과장/모션, 변승수 학과장/CG) + 김범수 멘토님 자료 · 정리: 펭토 | 2026-02-22</blockquote>","x":"🎬 cg · 영상 · 3d 완전 정복 !tip 📌 한 줄 요약 \"3d라고 다 같은 3d가 아니다.\" 목적이 다르면 툴도 다르고 진로도 다르다. 목차 · 영상의 3대장 · 폴리곤 vs 넙스 · 소프트웨어 도감 · cg vs 모션 툴 호환성 · cg 제작 파이프라인 · 실무 연계성 · 현장 용어 사전 · 노드(node) · 진로 결정 가이드 · 커리큘럼 & 수강료 영상의 3대장 !abstract 세 분야는 목적 이 다르다. 목적을 먼저 이해하면 모든 것이 풀린다. 구분 🎨 모션그래픽 🌌 cg 🎬 영상편집 한 줄 요약 디자인을 움직이게 만든다 가짜를 진짜처럼 만든다 이야기를 재미있게 엮는다 비유 스타일리스트 창조주 요리사 주요 분야 광고, 방송 타이틀, 예능 자막 영화, 드라마, 게임 시네마틱 유튜버, 방송국 pd, 영화 편집 성향 트렌드 민감 · 센스 중요 끈기(장인 정신) · 디테일 중요 스토리텔링 · 구성력 메인 툴 after effects · c4d maya · houdini · zbrush premiere · davinci 폴리곤 vs 넙스 !warning ⚠️ 미술(엔터)용 과 설계(제조)용 은 뿌리부터 다르다. 모델링을 배우기 전에 방향부터 정해야 한다. 구분 🟦 폴리곤 (polygon) 🔶 넙스 (nurbs) 개념 점·선·면의 집합 = 레고 블록 수학적 곡선 = 자와 컴퍼스 비유 포토샵(픽셀) → 수정 자유 일러스트레이터(벡터) → 치수 정확 용도 게임 · 영화 · 애니 · 캐릭터 자동차 · 제품 · 건축 · 금형 주요 툴 maya c4d blender zbrush rhino cad catia solidworks 소프트웨어 도감 !info 학생 수준과 목표에 맞춰 적절한 '탈것'을 추천하자. 🎬 엔터테인먼트 계열 → \"상상을 현실로\" ├─ 🚛 maya (마야) 업계 표준. 못 만드는 게 없음. 영화/애니 필수. ├─ 🏎️ cinema 4d (c4d) 모션그래픽 특화. 빠르고 예쁘게 나옴. 방송/광고 필수. ├─ 🔪 zbrush (지브러시) 찰흙 깎듯이 작업. 주름·근육 극한 디테일. 타블렛 필수. ├─ 🧪 houdini (후디니) 수학적/절차적 제어. 폭발·파도 등 거대한 효과. └─ 🆓 blender (블렌더) 무료. 모델링·렌더링·합성 전부 가능. 🏗️ 설계/엔지니어링 계열 → \"도면을 현실로\" ├─ 🚛 inventor (인벤터) 실용성 최고. 제조/설비 현장용. ├─ 🚗 solidworks (솔리드웍스) 가장 대중적. 기계 설계 표준. └─ 🏎️ catia (카티아) 항공기·자동차 외관 초정밀 설계. 🖥️ 렌더러 종류 └─ 엔스케이프 · 브이레이 · 아놀드 · 키샷 · 언리얼 · 옥테인 · 레드시프트 · 엑스파티클 cg vs 모션 툴 호환성 !check 2d는 90% 겹친다. 메인 3d 툴이 다를 뿐! 🤝 공통 툴 (adobe 계열) └─ 포토샵 · 일러스트 · after effects(ae) → cg / 모션 모두 사용 🔀 갈림길 → 메인 3d 툴 ├─ 🌌 cg → maya 기능 방대, 영화/애니 표준 / ae 역할: 🔧 마무리기 (색보정·합성 서브) └─ 🎨 모션 → c4d 직관적·빠름, 방송/광고 표준 / ae 역할: 🌟 주인공 (메인 엔진) cg 제작 파이프라인 !abstract 혼자 다 못 한다. 각 분야 전문가들이 협업하여 만든다. 📋 pre (기획) ├─ 🖼️ 매트 페인팅 배경 구성 └─ 🤖 ai로 시안 제작 🔨 production (제작) ├─ 🦴 maya 모델링 (뼈/살) → 리깅 (관절 심기) → 애니메이션 (연기) └─ 🌊 houdini fx (특수효과) 🎨 post (후반) └─ 🎞️ nuke 합성 (3d + 실사 합침) !tip 💼 포폴 전략 \"ai 시안 → maya 모델링 → 에펙 합성 → 최종 영상\" 워크플로우 전체를 보여주면 제너럴리스트 로 평가. 취업 깡패 구간! 실무 연계성 !abstract 재료(cg) 를 다듬어 요리(편집) 하는데 최신 조리도구(ai) 를 쓰는 관계 구분 🌌 cg 🎬 시각편집 🤖 ai 역할 source maker (자산 생성) finisher (최종 완성) accelerator (가속화) 주요 작업 모델링, 리깅, fx, 렌더링 컷 편집, 색보정, 합성, 자막 레퍼런스, 텍스처 생성 툴 maya, houdini, zbrush premiere, ae, nuke midjourney, meshy 🔗 교집합 포인트 ① 🌌+🎬 cg + 영상편집 → 합성 (compositing) └─ ae나 nuke로 빛·색·배경 보정. cg 아는 편집자 = 취업 범위 2배 ② 🌌+🤖 cg + ai → 프리프로덕션 & 텍스처링 ├─ ai로 빠르게 시안 → 그림 못 그려도 콘티 가능 └─ meshy ai로 base mesh 생성 → 사람은 리토폴로지·디테일 집중 ③ 🎬+🤖 영상편집 + ai → 효율화 └─ 자동 자막 · 컷 편집점 자동 탐색 · 행인 제거 · 프레임 보간 현장 용어 사전 📦 제작 공정 ├─ 🏺 모델링 (modeling) 찰흙 빚기 → 무(無)에서 유(有)의 형태를 만드는 것 ├─ 🍊 uv / 언랩 (unwrap) 귤껍질 까기 → 3d 물체를 평면으로 쫙 펴는 작업 ├─ 🕸️ 토폴로지 (topology) 그물망 짜기 → n gon(5각형↑) 금지 → quad(4각형) 국룰 └─ 🦴 리깅 (rigging) 뼈대 심기 → 관절·조절기를 심어 움직일 수 있게 만드는 것 🎨 시각 효과 ├─ 💄 룩뎁 (lookdev) 화장 & 조명빨 → 재질감·조명으로 화면 '때깔' 결정 ├─ 📸 렌더링 (rendering) 사진 인화 → 데이터를 영상/이미지로 출력하는 것 ├─ 🖼️ 매트 페인팅 배경 그림 합성 → 촬영 불가능한 거대 풍경을 그림으로 그려 합성 ├─ 🍱 합성 (compositing) 플레이팅 → 따로 만든 소스들을 하나로 합쳐 완성본 만들기. cg의 꽃 └─ ⚙️ 절차적 (procedural) 자동화 수식 → 수치 하나 바꾸면 연결된 모든 결과 자동 수정 (후디니 핵심) 🎞️ 모션 전용 └─ 🌀 모그라프 (mograph) c4d 필살기 → 도형들을 규칙적으로 촤라락 움직이게 하는 c4d 전용 기능 노드(node) !info 같은 이름, 완전히 다른 의미! 🌐 웹 → node.js ├─ 의미: 자바스크립트 실행 엔진 (js가 서버에서도 동작할 수 있게 해주는 환경) ├─ 툴: vs code, 서버 환경 └─ 비유: 🦾 햄스터(js)의 강력한 갑옷 🎬 cg → node based 워크플로우 ├─ 의미: 상자와 선으로 이어진 작업 흐름 (데이터 처리의 단계별 연결점) ├─ 툴: houdini, nuke, blender (shader) └─ 비유: 🧱 데이터를 요리하는 레고 블록 !quote 상담 치트키 → \"노드 = '연결점' . 웹에서는 네트워크상 연결점, cg에서는 데이터 처리의 단계별 연결점.\" 진로 결정 가이드 🔍 관찰형 → cg (maya) └─ \"저 쇠 질감은 어떻게 내지? 빛이 어떻게 반사되지?\" 리얼리티 추구 · 디테일 집착 · 장인 정신 ✨ 감각형 → 모션그래픽 (c4d) └─ \"화면 색감, 폰트 디자인, 음악에 맞춘 화려한 전환!\" 센스 추구 · 트렌드 민감 · 빠른 결과물 📐 설계형 → 제품디자인 (rhino) └─ \"내가 디자인한 제품을 실제로 생산하고 싶다.\" 치수/제품 · 제조 현장 · 실물 생산 커리큘럼 & 수강료 단위: 만원 (과목당 단가) · 💡 실제 등록 시 팀장님께 견적 확인 필수 💼 cg (마야 / vfx) 기본 30~70 / 전문 트랙 전부 80 · ⚠️ 특강 12월 이후 폐강 📅 평일 기본 과목 ├─ 🦴 마야 (70) │ 마야1 기초 모델링 / 마야2 렌더링 / 마야3 리깅 애니 ├─ 🫧 블렌더 (50) │ 블렌더1 기초 모델링 / 블렌더2 맵핑 렌더링 ├─ 🦖 크리처아트 1·2·3 해부학 기반 인체 조사 작업 (70) ├─ 🏞️ 리얼타임렌더 (30) │ 1 에셋 활용, 랜드스케이프 / 2 스플라인, pcg └─ 🖼️ 매트페인팅 (30) 1 기초합성, 공간구성 / 2 퀄리티업, 배경제작 🎓 전문 트랙 (모두 80, 단계별 수강) ├─ 🗿 모델링 │ 1 지브러시 기초, 해골제작 │ 2 카툰얼굴 제작 │ 3 실사 얼굴 제작 │ 4 더미활용 전신모델링 │ 5 마야 활용 의상제작, 마블러스 기초 │ 6 섭스턴스 활용 심화 텍스처링 / 포폴 6~9 ├─ 💡 룩뎁 │ 1 라이팅, 머티리얼 이해, udim 텍스처 │ 2 실사 텍스처링, 렌더링 후보정 │ 3 유리재질, 빛 이해 │ 4 언리얼 기초, 노드이해, 지형제작 │ 5 에셋 모듈 실내배치, 무비 렌더 │ 6 에셋 실외배치, 워터 플러그인, 카메라 설정 / 포폴 6~9 ├─ 🏃 애니 │ 1 12가지 모션법칙 / 2 걷기, 달리기 │ 3 페이셜리깅, 리프팅 / 4 다이나믹액션 │ 5 감정표현, 11초클럽 / 포폴 4~6 ├─ 🎞️ 합성 │ 1 누크 기본 인터페이스 │ 2 fx 효과보정, 매트레이어 / 3 실사 3d 합성 │ 4 언리얼 활용 합성 / 5 언리얼 합성, 포폴기획 / 포폴 3~5 ├─ 🔩 하드섭 │ 1 마야 심화모델링, uv │ 2 지브러시 인터페이스, 마야 지브러시 연동 │ 3 섭스턴스페인터 기초 / 4 지브러시 환경모델링 │ 5 언리얼엔진 모델링, 텍스처 추출 / 포폴 6~9 └─ 🌊 후디니 1 지오메트리 기초, 워크플로우 2 연기/불/눈 / 3 번개/붕괴 / 4 폭발/토네이도 5 물/강/바다 / 6 cfx/천/헤어/군중 7 트레이닝/준포폴 제작 / 포폴 6~9 !note 📎 출처: 교육팀 과정 설명회 (김석민 학과장/모션, 변승수 학과장/cg) + 김범수 멘토님 자료 · 정리: 펭토 2026 02 22"},"99_시스템/03_학과지식/CG학과_지식_통합본.md":{"t":"CG학과 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>CG학과 지식 통합본</h3>\n<p>CG학과 상담에 필요한 지식을 한 문서로 모았다. 학과 개요와 작업 파이프라인, 마야·지브러쉬·후디니 등 툴 정리, 하드서피스·룩뎁·캐릭터 모델링·애니메이션·합성·후디니 FX 트랙별 커리큘럼, 취업 진로와 상담 포인트를 다룬다. 수강료는 이 문서에 없어 학과 담당자 확인이 필요하다.</p>\n<blockquote><strong>핵심 원칙</strong>: &quot;모든 문제는 미리 말하라. 용어 공부부터 해라&quot; (개념 정립 및 원활한 소통 필수).</blockquote>\n<blockquote>&quot;차별성은 기획력에서 나온다. AI한테 생각 외주 주지 마라.&quot;</blockquote>\n<blockquote>출처: 변승수 학과장 과정설명회 (260204 + 260226), 이성욱 강사 교육 (260222), 캐릭터모델링 교육 (260225), CG/블렌더 통합노트 (260219)</blockquote>\n<blockquote>최종 작성: 2026-02-28</blockquote>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>CG란?</h4>\n<p><strong>정의</strong>: Computer Graphics. 게임 시네마틱, 영화, 드라마 배경 등 컴퓨터로 만드는 모든 그래픽.</p>\n<p><strong>AI 시대에도 변하지 않는 것</strong></p>\n<ul><li>\nAI가 생산성을 높여주지만 각 파트 전문가의 <strong>협업 구조</strong>는 유지된다.\n</li><li>\n모델링 직군은 AI로 완전 대체되지 않는다. 보조 도구로 활용할 뿐.\n</li><li>\nAI 버튼 하나로 끝나지 않는다. 기획력이 없으면 AI에게 생각을 외주 주는 것.\n</li></ul>\n<blockquote>참고: 한국콘텐츠진흥원(KOCCA) 2024년 분석에 따르면, 생성형 AI는 3D 모델링 및 합성 단계의 작업 시간을 30% 이상 단축하는 보조 도구로 평가된다. 그러나 최종 완성도와 차별성은 <strong>창작자의 기획력</strong>에서 비롯된다.</blockquote>\n<hr>\n<h3>2. CG 작업 파이프라인</h3>\n<pre><code>콘티 / 기획\n      ↓\n모델링 / 텍스처 (자산 제작)\n      ↓\n리깅 (뼈대 심기)\n      ↓\n애니메이션 (움직임)\n      ↓\n렌더링 (영상화)\n      ↓\n합성 / 자막 (후반 작업)</code></pre>\n<ul><li>\n<strong>자료 공유</strong>: 수업 자료는 NAS(서버) 폴더에 업로드하여 공유. 예시 영상·교육 자료 링크 포함. 공부 및 상담 활용 가능.\n</li></ul>\n<hr>\n<h3>3. 툴 / 소프트웨어 총정리</h3>\n<h4>A. 메인 제작 툴</h4>\n<div class=\"tw\"><table><thead><tr><th>이름</th><th>별명(역할)</th><th>특징</th></tr></thead><tbody><tr><td><strong>Maya (마야)</strong></td><td>할리우드 감독</td><td>영화/애니메이션 업계 표준. 애니 기능 최강. 전 세계 표준.</td></tr><tr><td><strong>3ds Max (맥스)</strong></td><td>건축 소장</td><td>한국 게임/인테리어/건축 표준.</td></tr><tr><td><strong>Blender (블렌더)</strong></td><td>만능 알바생</td><td>무료. 모델링~영상까지 혼자 다 됨. 유튜버/1인 개발 선호.</td></tr><tr><td><strong>Houdini (후디니)</strong></td><td>특수효과 팀장</td><td>폭발, 파괴, 연기 등 FX 전문. 수학적 계산 필요.</td></tr><tr><td><strong>C4D (시네마4D)</strong></td><td>모션 디자이너</td><td>방송/광고 모션 그래픽 표준. 배우기 쉽고 예쁨.</td></tr></tbody></table></div>\n<h4>B. 특수 목적 툴 및 플러그인</h4>\n<div class=\"tw\"><table><thead><tr><th>이름</th><th>역할</th><th>비고</th></tr></thead><tbody><tr><td><strong>ZBrush (지브러쉬)</strong></td><td>조각가</td><td>타블렛으로 찰흙 빚듯 디테일(주름, 근육) 묘사. 유기체/무기체 모두 사용 가능. 고용량 처리 가능.</td></tr><tr><td><strong>Substance Painter (섭스턴스 페인터)</strong></td><td>3D 포토샵</td><td>포토샵의 3D 버전. 채색/질감. 마스크(Mask) 활용이 핵심.</td></tr><tr><td><strong>Marvelous (마블러스)</strong></td><td>의상 제작</td><td>옷/신발 등 실제와 똑같이 제작.</td></tr><tr><td><strong>Xgen (엑스젠)</strong></td><td>헤어 제작</td><td>눈썹 → 속눈썹 → 머리카락 순서. 다운 시 복구 안 됨 주의.</td></tr><tr><td><strong>RealFlow (리얼플로우)</strong></td><td>수도꼭지</td><td>물, 액체 시뮬레이션 끝판왕. (C4D 심화 과정 연계)</td></tr><tr><td><strong>Arnold / V-Ray / Redshift / Octane</strong></td><td>사진 작가</td><td>렌더러(Renderer). 때깔 좋은 조명과 색감 담당.</td></tr><tr><td><strong>Unreal Engine (언리얼)</strong></td><td>리얼타임 렌더링</td><td>게임용이지만 요즘은 구분 없이 씀.</td></tr><tr><td><strong>Nuke (누크)</strong></td><td>합성 전문</td><td>합성 트랙 핵심 도구.</td></tr><tr><td><strong>SketchUp (스케치업)</strong></td><td>배경 제작</td><td>현대물(학교/오피스) 배경 전용. 직선 위주, 빠름.</td></tr><tr><td><strong>After Effects (에프터이펙트)</strong></td><td>후반 합성</td><td>실무 스크린X 배경 확장 등에 활용.</td></tr></tbody></table></div>\n<h4>C. 핵심 기술 개념</h4>\n<ul><li>\n<strong>폴리곤 (Polygon)</strong>: 점/선/면으로 된 3D의 기본 단위. 반대 개념은 NURBS (설계/정밀).\n</li><li>\n<strong>토폴로지 (Topology)</strong>: 면 배열 최적화. 2단계 스무스까지 고려. 5각(N-gon) 이상 금지, 4각 유지.\n</li><li>\n<strong>UV 맵핑</strong>: 3D 모델을 '전개도'처럼 2D로 펴는 것. 텍스처링 필수 과정.\n</li><li>\n<strong>텍스처 페인팅</strong>: 포토샵 없이 3D 화면에서 바로 색칠하는 기능. 직관적, 이음새 없음.\n</li><li>\n<strong>리토폴로지 (Retopology)</strong>: 지브러쉬의 방대한 폴리곤을 각 과정에 맞게 면 정리하는 작업.\n</li><li>\n<strong>그리즈 펜슬 (Grease Pencil)</strong>: 블렌더 기능. 3D 공간에 2D 그림을 그리는 툴.\n</li><li>\n<strong>렌더링</strong>: 3D 공간에서 '사진을 찍는' 느낌.\n</li></ul>\n<h4>D. 블렌더 특성 (스케치업 vs 블렌더 비교)</h4>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>스케치업 (SketchUp)</th><th>블렌더 (Blender)</th></tr></thead><tbody><tr><td><strong>용도</strong></td><td>현대물(학교/오피스) 배경</td><td>판타지(로판)/자연물/이세계</td></tr><tr><td><strong>특징</strong></td><td>직선 위주, 빠름, 소스 배치</td><td>곡선 위주, 툰 쉐이딩(그림 느낌), 창작</td></tr></tbody></table></div>\n<p><strong>블렌더 과정의 정체</strong>: 모션(디자인)보다는 제작(Making) 중심. 핵심 기술: 모델링 → UV 맵핑 → 리깅 → 애니메이션. 추천 대상: 나만의 캐릭터(버튜버) 제작, 게임 에셋, 1인 크리에이터.</p>\n<hr>\n<h3>4. 하드서피스 모델링</h3>\n<h4>개념 정의</h4>\n<ul><li>\n<strong>하드서피스 (Hard Surface)</strong>: 기계, 자동차, 건축물 등 딱딱한 질감의 객체를 <strong>모델링(형태 제작)</strong>하는 기술. (형태/구조 중심)\n</li><li>\n<strong>서페이싱 (Surfacing)</strong>: 모델링된 결과물 위에 질감(Texture)과 재질(Shader)을 입히는 <strong>LookDev(룩뎁)</strong> 단계의 작업. (질감/표면 중심)\n</li><li>\n<strong>현업 실태</strong>: 구직 사이트에서 '서페이싱 아티스트' 공고 시 하드서피스 역량을 같이 보는 경우가 많아 혼용. (개념적 구분 필수: 형태 vs 질감)\n</li></ul>\n<h4>실무 워크플로우</h4>\n<ul><li>\n<strong>레퍼런스 수집</strong>: 아트스테이션(ArtStation) 등을 활용하여 2D/3D 레퍼런스 정밀 분석.\n</li><li>\n<strong>모델링 &amp; UV (Hard Surface)</strong>: 마야(Maya) 기초 → 하드서피스 모델링 → 도면 제작 및 UV 작업.\n</li><li>\n<strong>텍스처링 (서페이싱)</strong>: 섭스턴스 페인터(Substance Painter) 활용. 3D 포토샵 개념이며 '마스크(Mask)' 활용이 핵심.\n</li><li>\n<strong>룩뎁 (LookDev/Rendering)</strong>: 아놀드(Arnold), 브이레이(V-Ray), 언리얼 엔진(UE5) 등 활용. Environment(배경/환경) 구성 포함.\n</li></ul>\n<blockquote>&quot;언리얼 하려면 룩뎁 들어라!&quot; (현직자 및 강사 강조 사항)</blockquote>\n<h4>하드섭 트랙 단계별 커리큘럼</h4>\n<p><strong>대상</strong>: 자동차, 무기, 인테리어 소품 등 곡면 위주 하드섭</p>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>마야 심화 모델링, UV / 라이팅, 텍스처 (가이드)</td></tr><tr><td>2</td><td>지브러쉬 인터페이스, 마야-지브러쉬 연동 / 마야 조명 세팅</td></tr><tr><td>3</td><td>섭스턴스 페인터 기초 / 섭스턴스 활용, 렌더링, 스캔라인 (언리얼)</td></tr><tr><td>4</td><td>지브러쉬 환경 모델링 / 언리얼 (게임X, 기본 룰 습득)</td></tr><tr><td>5</td><td>언리얼 엔진 모델링, 텍스처 추출 / 포폴 6~9</td></tr></tbody></table></div>\n<blockquote>현재 5개월 과정이나 내용이 방대해 <strong>6개월로 개편 가능성 높음</strong>.</blockquote>\n<h4>룩뎁 트랙 단계별 커리큘럼</h4>\n<p><strong>룩뎁(LookDev)이란?</strong>: CG의 '조명발'. 5~6개월 과정으로 빛을 다루는 기술.</p>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>라이팅, 머티리얼, UDIM 텍스처</td></tr><tr><td>2</td><td>실사 텍스처링, 렌더링 후보정</td></tr><tr><td>3</td><td>유리 재질, 빛 이해</td></tr><tr><td>4</td><td>언리얼 기초, 노드 이해, 지형 제작</td></tr><tr><td>5</td><td>에셋 모듈 실내배치, 무비 렌더</td></tr><tr><td>6</td><td>에셋 실외배치, 워터 플러그인 / 포폴 6~9</td></tr></tbody></table></div>\n<hr>\n<h3>5. 캐릭터 모델링</h3>\n<h4>개념 정의</h4>\n<ul><li>\n<strong>캐릭터 모델링 (오가닉)</strong>: 사람이나 생물 등 곡선 위주의 유기적인 대상을 만드는 작업. (매우 어려움)\n</li><li>\n<strong>크리처 (Creature)</strong>: 정규 수업에서 제외. 업계에서는 크리처 담당만 따로 뽑지 않음. (업계는 만능 도비만 뽑음)\n</li><li>\n<strong>현업 실태</strong>: 서브컬처 쪽에서 수요 증가 중. 철저히 레퍼런스 기준으로 제작. (플레이브 등) 크리처 아트는 해부학 수강 필요.\n</li><li>\n<strong>하드서피스 상위버전</strong>: 캐릭터 모델링(오가닉)도 ZBrush로 형태를 빚고 Maya로 도면화하는 실무 워크플로우를 거치지만, 해부학 지식이 요구되기 때문에 하드서피스보다 더 어려움.\n</li></ul>\n<h4>실무 워크플로우</h4>\n<ul><li>\n<strong>지브러쉬 기초 (1개월 차)</strong>: 제로부터 시작. 해골을 만들어보면서 기초 실습 진행.\n</li><li>\n<strong>마야 병행</strong>: 카툰 캐릭터 등 제작 → 리토폴리 + UV 도면 작업 후 Export.\n</li><li>\n<strong>질감 표현 발전 (실사)</strong>: 섭스턴스 페인터에서 작업. 유료 브러쉬, 스캔 데이터(진짜 사람 피부 스캔) 등을 활용해 실무처럼 실습.\n</li><li>\n<strong>전신 모델링</strong>: 더미 모델링을 라이트박스에 넣고 직접 작업. 해부학 스킬 최대한 활용.\n</li><li>\n<strong>머리카락 / 포징</strong>: 엑스젠(Xgen) 사용. 눈썹 → 속눈썹 → 머리카락 순서. (다운 시 복구 안 됨 주의)\n</li><li>\n<strong>렌더링</strong>: 텍스처, 메테리얼 등 마지막에 작업. 여기서 포트폴리오 만들어 해외 취업도 가능.\n</li></ul>\n<h4>캐릭터 모델링 트랙 단계별 커리큘럼</h4>\n<p><strong>목표</strong>: 지브러쉬 + 마야로 실사 수준 캐릭터 완성</p>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>지브러쉬 기초, 해골 제작 (실사화 연구)</td></tr><tr><td>2</td><td>카툰 얼굴 제작</td></tr><tr><td>3</td><td>실사 얼굴 제작</td></tr><tr><td>4</td><td>더미 활용 전신 모델링</td></tr><tr><td>5</td><td>마야 활용 의상 제작, 마블러스 기초 (X-gen 헤어 + 마블러스 의상 + 레벨 체크)</td></tr><tr><td>6</td><td>섭스턴스 활용 심화 텍스처링 / 포폴 6~9</td></tr></tbody></table></div>\n<h4>툴별 역할 비교 (캐릭터 관점)</h4>\n<ul><li>\n<strong>Maya (마야)</strong>: 모델링 전용. 점/선/면 3D 좌표 기준의 지도 같은 느낌. 면 정리(리토폴리) 필수.\n</li><li>\n<strong>ZBrush (지브러쉬)</strong>: 스컬핑(조소) 프로그램. 형태를 여기서 빚고 마야에서 작업. (지브러쉬 7 : 마야 3 비중)\n</li><li>\n<strong>Blender (블렌더)</strong>: 마야와 지브러쉬의 혼합 느낌이나 한계 있음. 하다가 지브러쉬로 다시 오는 편.\n</li><li>\n<strong>Marvelous (마블러스)</strong>: 옷/신발 등 실제와 똑같이 제작.\n</li><li>\n<strong>Xgen (엑스젠)</strong>: 머리카락 제작 시 사용.\n</li></ul>\n<hr>\n<h3>6. AI 트렌드</h3>\n<h4>AI 활용 원칙 (CG 학과 기준)</h4>\n<ul><li>\nAI는 자료 수정, 검색, 아이디어 구체화 용도.\n</li><li>\n기획력이 없으면 AI에게 생각을 외주 주는 것과 같다.\n</li><li>\n상상력을 키워야 한다 → 발상과표현 수업 병행 추천.\n</li><li>\nAI는 작업 시간을 단축해주는 도구. 결국 AI가 만든 결과물을 다듬고 완성하는 것은 사람의 몫.\n</li></ul>\n<h4>Meshy AI 활용법</h4>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>Meshy AI로 기초 메시 생성</td></tr><tr><td>2</td><td>결과물을 마야로 가져옴</td></tr><tr><td>3</td><td>리토폴로지 및 면 배열 수정</td></tr><tr><td>주의</td><td>생성된 결과물 바로 사용 X. 반드시 수정 과정 거칠 것</td></tr></tbody></table></div>\n<h4>AI 관련 트렌드 용어</h4>\n<ul><li>\n<strong>AI 아바타 (AI Human)</strong>: 텍스트 입력하면 자동 생성. 교육/뉴스/효율 중심.\n<ul><li>\n주요 툴: <strong>HeyGen</strong>(언어 변환), <strong>D-ID</strong>(사진 1장으로 영상), <strong>Synthesia</strong>(정장 입은 아나운서).\n</li></ul>\n</li><li>\n<strong>버튜버 (Vtuber)</strong>: 사람이 장비 차고 직접 연기함 (Human in the loop). 팬덤/소통 중심.\n</li><li>\n<strong>Gen-AI Video</strong>: 텍스트로 영상 생성 (Sora, Runway).\n</li><li>\n<strong>로우 폴리곤 (Low-poly)</strong>: 각진 그래픽. 레트로(Y2K) 감성 + 최적화(가벼움) 때문에 인기.\n</li><li>\n<strong>2.5D 트렌드</strong>: 2D 이미지를 3D 공간에 투영하는 방식. 기업 활용 증가 중.\n</li><li>\n<strong>Higgsfield AI</strong>: AI 쪽 최신 동향 참고 도구.\n</li><li>\n<strong>AI 관련 커리큘럼</strong>: 개편 완료 후 추가 공지 예정 (260226 기준).\n</li></ul>\n<hr>\n<h3>7. 커리큘럼 전체 구성</h3>\n<h4>수강 구조</h4>\n<p><strong>기본 구조</strong>: 기초 → 심화 → 포트폴리오</p>\n<ul><li>\n애니메이션, 합성+매트 페인팅은 드로잉 선수 능력 크게 요구 안 함.\n</li><li>\n애니 / 합성은 순서 바뀌거나 동시 수강 가능.\n</li><li>\n기초/심화 시간 맞으면 동시 수강 OK.\n</li><li>\n11과정 이상 수강 예정이라면 사전 문의 필수.\n</li><li>\n<strong>수업 시간</strong>: 오전 / 저녁 반 구성.\n</li></ul>\n<h4>기초 과목</h4>\n<div class=\"tw\"><table><thead><tr><th>과목</th><th>주요 내용</th></tr></thead><tbody><tr><td>마야1</td><td>기초 모델링, UV 작업 방식 습득</td></tr><tr><td>마야2</td><td>UV 언랩, 렌더링 기본</td></tr><tr><td>마야3</td><td>기본 리깅, 애니메이션</td></tr><tr><td>블렌더1</td><td>기초 모델링</td></tr><tr><td>블렌더2</td><td>맵핑, 렌더링</td></tr><tr><td>크리처아트 1~3</td><td>해부학 기반</td></tr><tr><td>리얼타임렌더 1</td><td>에셋 활용, 랜드스케이프</td></tr><tr><td>리얼타임렌더 2</td><td>스플라인, PCG</td></tr><tr><td>매트페인팅 1</td><td>기초합성, 공간구성</td></tr><tr><td>매트페인팅 2</td><td>퀄리티업, 배경제작</td></tr></tbody></table></div>\n<blockquote>과정 개편 중 (260226 기준): 마야 기초 01 → UD/VD 작업 방식 개편 / 합성·매트페인팅 과정도 개편 중. 확정 후 공지 예정.</blockquote>\n<h4>트랙별 과정 요약</h4>\n<div class=\"tw\"><table><thead><tr><th>트랙</th><th>기간</th><th>포트폴리오</th></tr></thead><tbody><tr><td>하드서피스 + 룩뎁</td><td>5개월 (→6개월 개편 가능)</td><td>포폴 6~9</td></tr><tr><td>캐릭터 모델링</td><td>6개월 / 10일 수업</td><td>포폴 6~9</td></tr><tr><td>애니메이션</td><td>5개월</td><td>포폴 4~6</td></tr><tr><td>합성 (컴포짓)</td><td>5개월</td><td>포폴 3~5</td></tr><tr><td>후디니 FX</td><td>6~9개월 (기초까지)</td><td>포폴 6~9</td></tr></tbody></table></div>\n<h5>애니메이션 트랙</h5>\n<p><strong>특징</strong>: 이전 단계까지는 정지 상태 → 여기서부터 생명 부여.</p>\n<p><strong>조언</strong>: 모션 캡쳐가 있어도 애니메이팅 수정 능력은 반드시 필요.</p>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>12가지 모션 법칙</td></tr><tr><td>2</td><td>걷기, 달리기</td></tr><tr><td>3</td><td>페이셜 리깅, 리프팅</td></tr><tr><td>4</td><td>다이나믹 액션</td></tr><tr><td>5</td><td>감정 표현, 11초클럽 / 포폴 4~6</td></tr></tbody></table></div>\n<h5>합성 트랙 (컴포짓)</h5>\n<p><strong>역할</strong>: 배경 확장, 웨더링, 실무 스크린X 배경 확장.</p>\n<p><strong>주요 작업</strong>: 멀티 패스 합성, 로토(지우기), 크로마키.</p>\n<p><strong>필수 툴</strong>: 포토샵 + 마야 + 누크(Nuke).</p>\n<ul><li>\n낮에 포토샵하고 밤에 3D 툴 돌리는 루틴.\n</li></ul>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>누크(Nuke) 기본 인터페이스</td></tr><tr><td>2</td><td>FX 효과보정, 매트레이어</td></tr><tr><td>3</td><td>실사 3D 합성</td></tr><tr><td>4</td><td>언리얼 활용 합성</td></tr><tr><td>5</td><td>언리얼 합성, 포폴기획 / 포폴 3~5</td></tr></tbody></table></div>\n<h5>후디니 FX 트랙</h5>\n<p><strong>난이도</strong>: 높음. 탈락률 높음. 꾸준한 멘탈 관리 필요. 동시에 가장 성취감이 큰 분야.</p>\n<p><strong>기간</strong>: 기초(베이직)까지 6~9개월 소요.</p>\n<p><strong>Maya vs Houdini 차이</strong></p>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>Maya</th><th>Houdini</th></tr></thead><tbody><tr><td>방식</td><td>직접 조각 (Direct)</td><td>노드로 절차적 생성 (Procedural)</td></tr><tr><td>수정</td><td>직접 수정</td><td>입력값만 바꾸면 전체 자동 반영</td></tr><tr><td>강점</td><td>캐릭터, 애니메이션</td><td>물·불·바람·번개·폭발·군중 등 FX</td></tr></tbody></table></div>\n<p><strong>노드(Node)란?</strong>: 명령을 스크립트화한 블록. 중간 수치 하나만 바꿔도 연결된 전체 결과에 자동 반영됨.</p>\n<p><strong>후디니 FX 종류</strong></p>\n<ul><li>\n물·액체·바다\n</li><li>\n불·연기·눈\n</li><li>\n번개·붕괴·폭발\n</li><li>\n토네이도\n</li></ul>\n<p><strong>CFX (Character FX) → Vellum 시스템</strong></p>\n<ul><li>\n옷 (Vellum → 뻣뻣한 직물부터 부드러운 천까지)\n</li><li>\n털 (Hair)\n</li><li>\n군중 (Crowd)\n</li><li>\n중간 수강도 가능 (학과장 문의 필수)\n</li></ul>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>지오메트리 기초, 워크플로우</td></tr><tr><td>2</td><td>연기 / 불 / 눈</td></tr><tr><td>3</td><td>번개 / 붕괴</td></tr><tr><td>4</td><td>폭발 / 토네이도</td></tr><tr><td>5</td><td>물 / 강 / 바다</td></tr><tr><td>6</td><td>CFX / 천 / 헤어 / 군중</td></tr><tr><td>7</td><td>트레이닝 / 준포폴 제작 / 포폴 6~9</td></tr></tbody></table></div>\n<p><strong>준포폴 수준 과정</strong>: FX 드로잉 (7월) → 건물 파괴 효과 수준의 결과물 제작.</p>\n<h5>매트 페인팅 · 컴포짓</h5>\n<p><strong>수업 구조</strong>: 금요일 1:1 피드백 포트폴리오 수업 형태.</p>\n<p><strong>매트페인터 수업 시간</strong>: 오후 8시 30분반.</p>\n<p><strong>낮 시간대 추천 병행</strong>: 포토웍스 심화.</p>\n<p><strong>작업 흐름</strong></p>\n<pre><code>포토샵 배경 생성 → AI 활용 실사 리터칭 → 합성 → 퀄리티 극대화</code></pre>\n<p><strong>현업 트렌드</strong>: 매트페인팅 + 컴포짓 동시에 요구하는 업무 증가 추세.</p>\n<p><strong>핵심 도구</strong>: 포토샵 (이미지 합성의 업그레이드 버전 개념).</p>\n<hr>\n<h3>8. 취업 / 진로</h3>\n<h4>CG 학과에서 가능한 진로</h4>\n<ul><li>\n캐릭터 모델러\n</li><li>\n룩뎁 아티스트 / 서페이싱 아티스트\n</li><li>\n애니메이터\n</li><li>\nVFX / FX 아티스트\n</li><li>\n합성 아티스트 (Compositor)\n</li><li>\n매트 페인터\n</li><li>\nCG 제너럴리스트\n</li><li>\nAI 크리에이터 (AI 프롬프트 엔지니어)\n</li></ul>\n<h4>포트폴리오 원칙</h4>\n<ul><li>\n<strong>1:1 대면 피드백 원칙</strong>.\n</li><li>\n독학생 문의 시: <strong>작업물 먼저 받아서 학과장님께 전달 후 상담</strong> 진행.\n</li><li>\n기업은 모델링과 텍스처 다 할 수 있는 사람을 뽑는다.\n</li><li>\n렌더링 단계까지 완성 시 포트폴리오로 해외 취업도 가능.\n</li></ul>\n<h4>해외 취업</h4>\n<ul><li>\n<strong>이성욱 강사</strong>: 유학 경험 및 해외 취업 경력 보유. 해외 취업 상담 가능.\n</li></ul>\n<h4>특강 및 개인 상담</h4>\n<ul><li>\n수강생 요청 시 무료 특강 열림.\n</li><li>\n강사님이 유료 브러쉬 등의 자료 제공.\n</li><li>\n공모전 준비, 해외 취업 준비 등 개인별 필요한 정보 상담 가능.\n</li></ul>\n<hr>\n<h3>9. 상담 포인트</h3>\n<h4>핵심 상담 멘트</h4>\n<blockquote>&quot;기획력이 없으면 AI가 오히려 독이 됩니다. 저희 과정에서는 툴 사용법뿐 아니라 스스로 구상하고 표현하는 기획력까지 함께 키웁니다.&quot;</blockquote>\n<blockquote>&quot;AI는 작업 시간을 단축해주는 도구입니다. 결국 AI가 만든 결과물을 다듬고 완성하는 것은 사람의 몫입니다.&quot;</blockquote>\n<blockquote>&quot;모델링 직군은 AI로 완전히 대체되지 않습니다. 오히려 AI를 능숙하게 활용하는 CG 아티스트의 가치가 더 높아지고 있습니다.&quot;</blockquote>\n<h4>수강 전략 상담 시 체크리스트</h4>\n<ul><li>\n기초/심화 동시 수강 가능 여부 → 시간표 맞으면 OK.\n</li><li>\n11과정 이상 수강 예정이라면 사전 문의 필수.\n</li><li>\n독학생 포트폴리오 문의 → 작업물 받아서 학과장님께 먼저 확인.\n</li><li>\n하드섭 → 캐릭터 모델링 진행 시 <strong>기초 2단계 선수강 필수</strong> (병행은 강사와 상담 필요).\n</li><li>\n언리얼 수강 희망 → <strong>룩뎁 과정 선수강</strong> 강력 권장.\n</li><li>\nCFX 중간 수강 가능 여부 → <strong>학과장 문의 필수</strong>.\n</li><li>\n웹툰 작가 배경 제작 목적 → 현대물이면 스케치업, 판타지/이세계면 블렌더 추천.\n</li><li>\n크리처 아트 수강 희망 → 해부학 수강 필요, 정규 수업에선 별도 과정 없음 확인.\n</li></ul>\n<h4>강사 정보</h4>\n<ul><li>\n<strong>변승수 학과장</strong>: 핵심 원칙 강조 (용어 공부, 사전 소통). 상담 자료 멘토링 시 활용 OK.\n</li><li>\n<strong>이성욱 강사</strong>: CG학과 최고참 강사. 수강생과의 유대감 중시, 재미있는 수업 지향. 유학 경험 보유. 해외 취업 상담 가능.\n</li></ul>\n<hr>\n<h3>10. 수강료</h3>\n<blockquote>수강료 관련 정보는 현재 수집된 파일에 명시된 내용 없음. 수강 문의 시 학과 담당자에게 직접 확인 필요.</blockquote>\n<hr>\n<p>(태그 정리됨)</p>","x":"cg학과 지식 통합본 cg학과 상담에 필요한 지식을 한 문서로 모았다. 학과 개요와 작업 파이프라인, 마야·지브러쉬·후디니 등 툴 정리, 하드서피스·룩뎁·캐릭터 모델링·애니메이션·합성·후디니 fx 트랙별 커리큘럼, 취업 진로와 상담 포인트를 다룬다. 수강료는 이 문서에 없어 학과 담당자 확인이 필요하다. 핵심 원칙 : \"모든 문제는 미리 말하라. 용어 공부부터 해라\" (개념 정립 및 원활한 소통 필수). \"차별성은 기획력에서 나온다. ai한테 생각 외주 주지 마라.\" 출처: 변승수 학과장 과정설명회 (260204 + 260226), 이성욱 강사 교육 (260222), 캐릭터모델링 교육 (260225), cg/블렌더 통합노트 (260219) 최종 작성: 2026 02 28 1. 학과 개요 cg란? 정의 : computer graphics. 게임 시네마틱, 영화, 드라마 배경 등 컴퓨터로 만드는 모든 그래픽. ai 시대에도 변하지 않는 것 ai가 생산성을 높여주지만 각 파트 전문가의 협업 구조 는 유지된다. 모델링 직군은 ai로 완전 대체되지 않는다. 보조 도구로 활용할 뿐. ai 버튼 하나로 끝나지 않는다. 기획력이 없으면 ai에게 생각을 외주 주는 것. 참고: 한국콘텐츠진흥원(kocca) 2024년 분석에 따르면, 생성형 ai는 3d 모델링 및 합성 단계의 작업 시간을 30% 이상 단축하는 보조 도구로 평가된다. 그러나 최종 완성도와 차별성은 창작자의 기획력 에서 비롯된다. 2. cg 작업 파이프라인 콘티 / 기획 ↓ 모델링 / 텍스처 (자산 제작) ↓ 리깅 (뼈대 심기) ↓ 애니메이션 (움직임) ↓ 렌더링 (영상화) ↓ 합성 / 자막 (후반 작업) 자료 공유 : 수업 자료는 nas(서버) 폴더에 업로드하여 공유. 예시 영상·교육 자료 링크 포함. 공부 및 상담 활용 가능. 3. 툴 / 소프트웨어 총정리 a. 메인 제작 툴 이름 별명(역할) 특징 : : : maya (마야) 할리우드 감독 영화/애니메이션 업계 표준. 애니 기능 최강. 전 세계 표준. 3ds max (맥스) 건축 소장 한국 게임/인테리어/건축 표준. blender (블렌더) 만능 알바생 무료. 모델링~영상까지 혼자 다 됨. 유튜버/1인 개발 선호. houdini (후디니) 특수효과 팀장 폭발, 파괴, 연기 등 fx 전문. 수학적 계산 필요. c4d (시네마4d) 모션 디자이너 방송/광고 모션 그래픽 표준. 배우기 쉽고 예쁨. b. 특수 목적 툴 및 플러그인 이름 역할 비고 : : : zbrush (지브러쉬) 조각가 타블렛으로 찰흙 빚듯 디테일(주름, 근육) 묘사. 유기체/무기체 모두 사용 가능. 고용량 처리 가능. substance painter (섭스턴스 페인터) 3d 포토샵 포토샵의 3d 버전. 채색/질감. 마스크(mask) 활용이 핵심. marvelous (마블러스) 의상 제작 옷/신발 등 실제와 똑같이 제작. xgen (엑스젠) 헤어 제작 눈썹 → 속눈썹 → 머리카락 순서. 다운 시 복구 안 됨 주의. realflow (리얼플로우) 수도꼭지 물, 액체 시뮬레이션 끝판왕. (c4d 심화 과정 연계) arnold / v ray / redshift / octane 사진 작가 렌더러(renderer). 때깔 좋은 조명과 색감 담당. unreal engine (언리얼) 리얼타임 렌더링 게임용이지만 요즘은 구분 없이 씀. nuke (누크) 합성 전문 합성 트랙 핵심 도구. sketchup (스케치업) 배경 제작 현대물(학교/오피스) 배경 전용. 직선 위주, 빠름. after effects (에프터이펙트) 후반 합성 실무 스크린x 배경 확장 등에 활용. c. 핵심 기술 개념 폴리곤 (polygon) : 점/선/면으로 된 3d의 기본 단위. 반대 개념은 nurbs (설계/정밀). 토폴로지 (topology) : 면 배열 최적화. 2단계 스무스까지 고려. 5각(n gon) 이상 금지, 4각 유지. uv 맵핑 : 3d 모델을 '전개도'처럼 2d로 펴는 것. 텍스처링 필수 과정. 텍스처 페인팅 : 포토샵 없이 3d 화면에서 바로 색칠하는 기능. 직관적, 이음새 없음. 리토폴로지 (retopology) : 지브러쉬의 방대한 폴리곤을 각 과정에 맞게 면 정리하는 작업. 그리즈 펜슬 (grease pencil) : 블렌더 기능. 3d 공간에 2d 그림을 그리는 툴. 렌더링 : 3d 공간에서 '사진을 찍는' 느낌. d. 블렌더 특성 (스케치업 vs 블렌더 비교) 구분 스케치업 (sketchup) 블렌더 (blender) : : : 용도 현대물(학교/오피스) 배경 판타지(로판)/자연물/이세계 특징 직선 위주, 빠름, 소스 배치 곡선 위주, 툰 쉐이딩(그림 느낌), 창작 블렌더 과정의 정체 : 모션(디자인)보다는 제작(making) 중심. 핵심 기술: 모델링 → uv 맵핑 → 리깅 → 애니메이션. 추천 대상: 나만의 캐릭터(버튜버) 제작, 게임 에셋, 1인 크리에이터. 4. 하드서피스 모델링 개념 정의 하드서피스 (hard surface) : 기계, 자동차, 건축물 등 딱딱한 질감의 객체를 모델링(형태 제작) 하는 기술. (형태/구조 중심) 서페이싱 (surfacing) : 모델링된 결과물 위에 질감(texture)과 재질(shader)을 입히는 lookdev(룩뎁) 단계의 작업. (질감/표면 중심) 현업 실태 : 구직 사이트에서 '서페이싱 아티스트' 공고 시 하드서피스 역량을 같이 보는 경우가 많아 혼용. (개념적 구분 필수: 형태 vs 질감) 실무 워크플로우 1. 레퍼런스 수집 : 아트스테이션(artstation) 등을 활용하여 2d/3d 레퍼런스 정밀 분석. 2. 모델링 & uv (hard surface) : 마야(maya) 기초 → 하드서피스 모델링 → 도면 제작 및 uv 작업. 3. 텍스처링 (서페이싱) : 섭스턴스 페인터(substance painter) 활용. 3d 포토샵 개념이며 '마스크(mask)' 활용이 핵심. 4. 룩뎁 (lookdev/rendering) : 아놀드(arnold), 브이레이(v ray), 언리얼 엔진(ue5) 등 활용. environment(배경/환경) 구성 포함. \"언리얼 하려면 룩뎁 들어라!\" (현직자 및 강사 강조 사항) 하드섭 트랙 단계별 커리큘럼 대상 : 자동차, 무기, 인테리어 소품 등 곡면 위주 하드섭 단계 내용 : : 1 마야 심화 모델링, uv / 라이팅, 텍스처 (가이드) 2 지브러쉬 인터페이스, 마야 지브러쉬 연동 / 마야 조명 세팅 3 섭스턴스 페인터 기초 / 섭스턴스 활용, 렌더링, 스캔라인 (언리얼) 4 지브러쉬 환경 모델링 / 언리얼 (게임x, 기본 룰 습득) 5 언리얼 엔진 모델링, 텍스처 추출 / 포폴 6~9 현재 5개월 과정이나 내용이 방대해 6개월로 개편 가능성 높음 . 룩뎁 트랙 단계별 커리큘럼 룩뎁(lookdev)이란? : cg의 '조명발'. 5~6개월 과정으로 빛을 다루는 기술. 단계 내용 : : 1 라이팅, 머티리얼, udim 텍스처 2 실사 텍스처링, 렌더링 후보정 3 유리 재질, 빛 이해 4 언리얼 기초, 노드 이해, 지형 제작 5 에셋 모듈 실내배치, 무비 렌더 6 에셋 실외배치, 워터 플러그인 / 포폴 6~9 5. 캐릭터 모델링 개념 정의 캐릭터 모델링 (오가닉) : 사람이나 생물 등 곡선 위주의 유기적인 대상을 만드는 작업. (매우 어려움) 크리처 (creature) : 정규 수업에서 제외. 업계에서는 크리처 담당만 따로 뽑지 않음. (업계는 만능 도비만 뽑음) 현업 실태 : 서브컬처 쪽에서 수요 증가 중. 철저히 레퍼런스 기준으로 제작. (플레이브 등) 크리처 아트는 해부학 수강 필요. 하드서피스 상위버전 : 캐릭터 모델링(오가닉)도 zbrush로 형태를 빚고 maya로 도면화하는 실무 워크플로우를 거치지만, 해부학 지식이 요구되기 때문에 하드서피스보다 더 어려움. 실무 워크플로우 1. 지브러쉬 기초 (1개월 차) : 제로부터 시작. 해골을 만들어보면서 기초 실습 진행. 2. 마야 병행 : 카툰 캐릭터 등 제작 → 리토폴리 + uv 도면 작업 후 export. 3. 질감 표현 발전 (실사) : 섭스턴스 페인터에서 작업. 유료 브러쉬, 스캔 데이터(진짜 사람 피부 스캔) 등을 활용해 실무처럼 실습. 4. 전신 모델링 : 더미 모델링을 라이트박스에 넣고 직접 작업. 해부학 스킬 최대한 활용. 5. 머리카락 / 포징 : 엑스젠(xgen) 사용. 눈썹 → 속눈썹 → 머리카락 순서. (다운 시 복구 안 됨 주의) 6. 렌더링 : 텍스처, 메테리얼 등 마지막에 작업. 여기서 포트폴리오 만들어 해외 취업도 가능. 캐릭터 모델링 트랙 단계별 커리큘럼 목표 : 지브러쉬 + 마야로 실사 수준 캐릭터 완성 단계 내용 : : 1 지브러쉬 기초, 해골 제작 (실사화 연구) 2 카툰 얼굴 제작 3 실사 얼굴 제작 4 더미 활용 전신 모델링 5 마야 활용 의상 제작, 마블러스 기초 (x gen 헤어 + 마블러스 의상 + 레벨 체크) 6 섭스턴스 활용 심화 텍스처링 / 포폴 6~9 툴별 역할 비교 (캐릭터 관점) maya (마야) : 모델링 전용. 점/선/면 3d 좌표 기준의 지도 같은 느낌. 면 정리(리토폴리) 필수. zbrush (지브러쉬) : 스컬핑(조소) 프로그램. 형태를 여기서 빚고 마야에서 작업. (지브러쉬 7 : 마야 3 비중) blender (블렌더) : 마야와 지브러쉬의 혼합 느낌이나 한계 있음. 하다가 지브러쉬로 다시 오는 편. marvelous (마블러스) : 옷/신발 등 실제와 똑같이 제작. xgen (엑스젠) : 머리카락 제작 시 사용. 6. ai 트렌드 ai 활용 원칙 (cg 학과 기준) ai는 자료 수정, 검색, 아이디어 구체화 용도. 기획력이 없으면 ai에게 생각을 외주 주는 것과 같다. 상상력을 키워야 한다 → 발상과표현 수업 병행 추천. ai는 작업 시간을 단축해주는 도구. 결국 ai가 만든 결과물을 다듬고 완성하는 것은 사람의 몫. meshy ai 활용법 단계 내용 : : 1 meshy ai로 기초 메시 생성 2 결과물을 마야로 가져옴 3 리토폴로지 및 면 배열 수정 주의 생성된 결과물 바로 사용 x. 반드시 수정 과정 거칠 것 ai 관련 트렌드 용어 ai 아바타 (ai human) : 텍스트 입력하면 자동 생성. 교육/뉴스/효율 중심. 주요 툴: heygen (언어 변환), d id (사진 1장으로 영상), synthesia (정장 입은 아나운서). 버튜버 (vtuber) : 사람이 장비 차고 직접 연기함 (human in the loop). 팬덤/소통 중심. gen ai video : 텍스트로 영상 생성 (sora, runway). 로우 폴리곤 (low poly) : 각진 그래픽. 레트로(y2k) 감성 + 최적화(가벼움) 때문에 인기. 2.5d 트렌드 : 2d 이미지를 3d 공간에 투영하는 방식. 기업 활용 증가 중. higgsfield ai : ai 쪽 최신 동향 참고 도구. ai 관련 커리큘럼 : 개편 완료 후 추가 공지 예정 (260226 기준). 7. 커리큘럼 전체 구성 수강 구조 기본 구조 : 기초 → 심화 → 포트폴리오 애니메이션, 합성+매트 페인팅은 드로잉 선수 능력 크게 요구 안 함. 애니 / 합성은 순서 바뀌거나 동시 수강 가능. 기초/심화 시간 맞으면 동시 수강 ok. 11과정 이상 수강 예정이라면 사전 문의 필수. 수업 시간 : 이 유료 브러쉬 등의 자료 제공. 공모전 준비, 해외 취업 준비 등 개인별 필요한 정보 상담 가능. 9. 상담 포인트 핵심 상담 멘트 \"기획력이 없으면 ai가 오히려 독이 됩니다. 저희 과정에서는 툴 사용법뿐 아니라 스스로 구상하고 표현하는 기획력까지 함께 키웁니다.\" \"ai는 작업 시간을 단축해주는 도구입니다. 결국 ai가 만든 결과물을 다듬고 완성하는 것은 사람의 몫입니다.\" \"모델링 직군은 ai로 완전히 대체되지 않습니다. 오히려 ai를 능숙하게 활용하는 cg 아티스트의 가치가 더 높아지고 있습니다.\" 수강 전략 상담 시 체크리스트 기초/심화 동시 수강 가능 여부 → 시간표 맞으면 ok. 11과정 이상 수강 예정이라면 사전 문의 필수. 독학생 포트폴리오 문의 → 작업물 받아서 학과장님께 먼저 확인. 하드섭 → 캐릭터 모델링 진행 시 기초 2단계 선수강 필수 (병행은 강사와 상담 필요). 언리얼 수강 희망 → 룩뎁 과정 선수강 강력 권장. cfx 중간 수강 가능 여부 → 학과장 문의 필수 . 웹툰 작가 배경 제작 목적 → 현대물이면 스케치업, 판타지/이세계면 블렌더 추천. 크리처 아트 수강 희망 → 해부학 수강 필요, 정규 수업에선 별도 과정 없음 확인. 강사 정보 변승수 학과장 : 핵심 원칙 강조 (용어 공부, 사전 소통). 상담 자료 멘토링 시 활용 ok. 이성욱 강사 : cg학과 최고참 강사. 수강생과의 유대감 중시, 재미있는 수업 지향. 유학 경험 보유. 해외 취업 상담 가능. 10. 수강료 수강료 관련 정보는 현재 수집된 파일에 명시된 내용 없음. 수강 문의 시 학과 담당자에게 직접 확인 필요. (태그 정리됨)"},"99_시스템/03_학과지식/OA전산세무회계_지식_통합본.md":{"t":"OA전산세무회계 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<p>(태그 정리됨)</p>\n<hr>\n<h3>OA + 전산세무회계학과 지식 통합본</h3>\n<p>OA(사무자동화)와 전산세무회계 상담에 필요한 지식을 한 문서로 모았다. MOS 365에서 컴활 1급으로 이어지는 OA 자격증 로드맵, 전산회계 1급에서 전산세무 1급까지의 로드맵, FAT/TAT·재경관리사·ERP 등 관련 자격증, 커리큘럼과 세무 일정, 취업과 상담 포인트를 다룬다. 수강료는 이 문서에 없어 별도 확인이 필요하다.</p>\n<blockquote><strong>작성자</strong>: 펭토 | <strong>최종 통합일</strong>: 2026-02-28</blockquote>\n<blockquote><strong>출처 파일</strong>: 260127_OA자격증_MOS전산회계세무 / 260222_OA자격증 v.1 / 260222_가이드_전산세무회계 자격증 v.1</blockquote>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>1-1. 사무자동화(OA) 한 줄 요약</h4>\n<blockquote>&quot;엑셀 없이 입사하는 것은 총 없이 전쟁터에 나가는 것과 같다.&quot; (모든 직무의 필수 생존 기술)</blockquote>\n<ul><li>\n<strong>필수 프로그램</strong>: 엑셀(Excel), 파워포인트(PPT), 워드(Word), 액세스(Access - DB 관리)\n</li></ul>\n<h4>1-2. 전산세무회계 한 줄 요약</h4>\n<blockquote>&quot;회계는 답이 정해져 있는 객관적인 약속이자, 자본주의의 생존 기술이다.&quot;</blockquote>\n<ul><li>\n<strong>필수 프로그램 (양대 산맥)</strong>:\n<ul><li>\n<strong>케이렙 (KcLep)</strong>: 한국세무사회 자격시험용 표준 프로그램 (세무사 사무실 多)\n</li><li>\n<strong>스마트A (Smart A)</strong>: 더존(Douzone) 비즈온의 실무 프로그램 (일반 기업 90% 점유)\n</li><li>\n*학원에서는 두 프로그램을 모두 다뤄 취업 경쟁력을 높임*\n</li></ul>\n</li></ul>\n<h4>1-3. 자격증 체계 상식</h4>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>특징</th><th>예시</th></tr></thead><tbody><tr><td><strong>국가전문자격</strong></td><td>응시 자격 제한 있음</td><td>회계사, 세무사</td></tr><tr><td><strong>국가기술자격</strong></td><td>필기 합격 후 실기 응시</td><td>컴활, 사무자동화산업기사</td></tr><tr><td><strong>민간국가공인</strong></td><td>민간 주관이나 국가 효력 인정</td><td>전산세무회계, MOS</td></tr></tbody></table></div>\n<ul><li>\n<strong>등급 체계</strong>: 기능사 → 산업기사 → 기사\n</li></ul>\n<hr>\n<h3>2. OA 자격증 로드맵</h3>\n<blockquote><strong>Master Route</strong>: MOS 365 → 실무 엑셀 → 컴활 1급</blockquote>\n<h4>2-1. MOS 365 (입문 / 국제공인) - 평일/주말 1개월 과정</h4>\n<ul><li>\n<strong>타겟</strong>: 취준생, 사무 관련 업무 종사자\n<ul><li>\n보통 대학교 1학년 때 필요한 자격증을 취득하고, 대학교 2~3학년에 공모전/인턴 활동을 함\n</li></ul>\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n2026년부터 <strong>'MOS 365'로 개정</strong> (기존 액세스 제외 → 엑셀/워드/파워포인트 집중)\n</li><li>\n2년 단위로 갱신 필요\n</li><li>\n마이크로소프트가 인증하는 <strong>국제공인자격증</strong> → 해외업무 활용 가능\n</li><li>\n일부 대학에서 졸업요건으로 MOS 자격증 요구\n</li><li>\n실무나 활용범위 면에서 컴활 2급보다 유용함\n</li><li>\n컴활 1급과 과목이 겹치므로 <strong>선행 과정으로 권장</strong>\n</li><li>\n학원 내부에서 시험 응시 가능, 각 과목별 응시 가능, 수업 수강 시 <strong>응시료 할인 혜택</strong>\n</li><li>\n시험 종료 후 <strong>바로 성적 및 합격 여부 확인 가능</strong>\n</li><li>\nMOS + 컴활 1급 함께 수강 시 <strong>2달간 5개 자격증 취득</strong> 가능\n</li></ul>\n</li></ul>\n<h4>2-2. 실무 엑셀 (실무)</h4>\n<ul><li>\n<strong>목표</strong>: 시험용이 아닌 실제 현업 업무 처리 능력 배양\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n100% 실기 위주 수업\n</li><li>\n자격증 취득 후, 또는 취득 전 실무 감각 익히기용\n</li></ul>\n</li></ul>\n<h4>2-3. 컴퓨터활용능력 1급 (심화 / 국가기술) - 평일/주말 1개월 과정</h4>\n<ul><li>\n<strong>목표</strong>: 공기업/대기업 필수 스펙 달성 (가산점)\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n3과목 (컴퓨터일반, 엑셀, 액세스-DB), 70점 이상 합격\n</li><li>\n스프레드시트(엑셀) + 데이터베이스(액세스) 마스터\n</li><li>\n난이도 높음 → 단독 수강보다는 <strong>MOS 과목 선행 권장</strong>\n</li><li>\n본원 합격률 <strong>80~90% 보장</strong>, 자격증반에 한해 <strong>강의 녹화본 제공</strong> (학원 제공이나 멘토 재량)\n</li><li>\n2급은 변별력이 낮아 1급 또는 MOS 권장\n</li><li>\n공기업에서 매우 유리함 (가산점)\n</li></ul>\n</li></ul>\n<h4>2-4. 그 외 OA 관련 자격증</h4>\n<ul><li>\n<strong>ITQ</strong>: 아래아 한글 / 파워포인트 / 엑셀\n</li></ul>\n<hr>\n<h3>3. 전산세무회계 자격증 로드맵</h3>\n<blockquote><strong>Master Route</strong>: 전산회계 1급 → 전산세무 2급 → 전산세무 1급 (또는 재경관리사)</blockquote>\n<ul><li>\n<strong>주관</strong>: 한국세무사회\n</li><li>\n<strong>시험 구성</strong>: 80% 이론, 20% 실무 / 2개월 과정\n</li><li>\n<strong>시험 일정</strong>: 매 짝수 달에 시험 (회계와 세무는 오전/오후로 나눠 시험 → 병행학습 가능)\n</li><li>\n<strong>사용 프로그램</strong>: 케이렙(KcLep)\n</li><li>\n<strong>학원 강점</strong>:\n<ul><li>\n요약노트 제공 → 높은 합격률\n</li><li>\n법률용어 상세 설명으로 이해도 증진\n</li><li>\n다양한 실무예시 및 현장 실무 피드백\n</li><li>\n반복학습으로 이론 완성\n</li></ul>\n</li></ul>\n<h4>3-1. 전산회계 1급 (기초~중급) - 평일/주말 2개월 과정</h4>\n<ul><li>\n<strong>목표</strong>: 기업 경리 업무 수행 가능 (대학 3~4학년 수준)\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n전산회계 2급(전표관리/회계프로그램 운용/결산과 재무제표) 심화\n</li><li>\n<strong>분개(Journalizing)</strong>: '차변/대변'의 원리 완벽 이해 (회계의 구구단)\n</li><li>\n재무회계이론 / 원가회계이론 / 부가가치세(VAT)이론 학습\n<ul><li>\n부가가치세: 최종소비자가 구매하는 물건값에 이미 포함 → 과세 사업자는 세무서에 납부 의무 (기업이 세무사를 쓰는 이유)\n</li></ul>\n</li><li>\n원가계산 및 부가가치세 이론 학습\n</li><li>\n2급은 상고나 대학 교양 수준의 난이도라 메리트 없음 → <strong>1급 권장</strong>\n</li></ul>\n</li><li>\n<strong>상담 참고</strong>: 연령대가 높은 문의자는 전산회계 2급 수준 지식 보유 여부 확인 필수. 지식 없는 경우 전산회계 2급 온라인 강의 선행 추천\n</li></ul>\n<h4>3-2. 전산세무 2급 (심화 / 실무) - 평일 2개월 과정</h4>\n<ul><li>\n<strong>목표</strong>: 중견기업 입사 및 실무 처리 능력 (가장 수요 많음)\n<ul><li>\n*전 지점 공통 수강과목: 전산회계 1급 + 전산세무 2급*\n</li><li>\n*전산회계 1급 + 전산세무 2급 취득 (+ERP) 시 중견기업 입사 가능*\n</li></ul>\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n전산회계 1급 내용 심화\n</li><li>\n<strong>부가가치세 신고</strong>: 1월/7월 실무 업무 수행 가능 (세금계산서 발급, 부속서류 작성, 부가가치세신고서 작성 등)\n</li><li>\n<strong>원천징수/연말정산</strong>: 직원 급여 관리 및 세금 공제 기술 습득\n</li></ul>\n</li></ul>\n<h4>3-3. 전산세무 1급 (고급 / 관리자급) - 주말 2개월 과정</h4>\n<ul><li>\n<strong>목표</strong>: 법인세 처리(3월 결산) 및 중간 관리자급 역량\n<ul><li>\n취득 시 취업 하이패스. 관련 업무의 매니저, 장급으로 취직 가능\n</li></ul>\n</li><li>\n<strong>핵심 내용</strong>:\n<ul><li>\n전산세무 2급 심화 + <strong>법인세</strong> 학습\n</li><li>\n법인세 관련 수업 (법인세 신고 준비, 과목별 세무조정 등): 난이도 매우 높고 분량이 많음\n<ul><li>\n법인: 개별 단위(하나의 인격체처럼)로 취급하여 세법 별도 적용\n</li></ul>\n</li><li>\n난이도: 회계사, 공인중개사 수준으로 매우 어려움\n</li></ul>\n</li><li>\n<strong>우회 경로</strong>: 전산세무 1급 대신 재경관리사로 우회하는 경우도 많음\n</li></ul>\n<hr>\n<h3>4. MOS (Microsoft Office Specialist) 상세</h3>\n<ul><li>\n2026년부터 <strong>'MOS 365'로 개정</strong> (엑셀, 워드, 파워포인트 / 액세스 제외)\n</li><li>\n2년 단위 갱신 필요\n</li><li>\n마이크로소프트 국제공인자격증 → 해외 기업 인정\n</li><li>\n학원 자체 시험 응시 가능 + 수강 시 응시료 할인\n</li><li>\n시험 종료 후 즉시 성적/합격 여부 확인\n</li></ul>\n<hr>\n<h3>5. 관련 추가 자격증</h3>\n<h4>5-1. FAT / TAT (한국공인회계사회 주관)</h4>\n<ul><li>\n<strong>FAT</strong> (Financial Accounting Test / 재무회계):\n<ul><li>\nFAT 1급 ≒ 전산회계 1급, 회계관리 1급, 전산회계운용사 2급\n</li></ul>\n</li><li>\n<strong>TAT</strong> (Tax Accounting Test / 세무회계):\n<ul><li>\nTAT 1급 ≒ 전산세무 1급, 재경관리사, 전산회계운용사 1급\n</li></ul>\n</li><li>\n<strong>사용 프로그램</strong>: 더존 스마트A\n</li><li>\n전산세무회계와 이론 90% 동일 → 프로그램 사용법만 익혀 <strong>자격증 2개 동시 취득(쌍끌이 전략) 권장</strong>\n<ul><li>\n운전면허 비유: 1종 보통으로 트럭(케이렙)도 몰고 승용차(더존)도 몰 수 있듯이, 하나를 배우면 다른 하나는 프로그램 버튼 위치만 다를 뿐 쉽게 취득 가능\n</li></ul>\n</li></ul>\n<h4>5-2. 재경관리사 - 주말 2개월 과정 (강남지점만 개설)</h4>\n<ul><li>\n<strong>주관</strong>: 삼일회계법인 (공신력 높음 / 기업에 미치는 영향력 강함)\n</li><li>\n<strong>로드맵</strong>: 회계관리 2급 → 회계관리 1급 → 재경관리사\n</li><li>\n<strong>특징</strong>: 100% 이론 수업, 과정이 길어 시험 응시는 다음 회차 건너뛰고 응시 (예: 100회 응시했다면 102회 도전)\n</li><li>\n<strong>시험 일정</strong>: 연 8회 (1, 3, 5, 6, 7, 9, 11, 12월) 시행\n</li><li>\n<strong>개설 강좌</strong>: 재경관리사 강좌 / 회계관리 1급·2급 강좌 / 기출문제 풀이반\n</li></ul>\n<p>신수민 공부목적 취득목장</p>\n<p>주말에다니고싶어요</p>\n<h4>5-3. ERP (전사적 자원관리)</h4>\n<ul><li>\n정보관리사: 회계 / 인사 / 생산 / 물류로 구분\n</li><li>\n전산회계 1급 + 전산세무 2급 취득 후 ERP 추가 시 중견기업 입사 가능\n</li></ul>\n<h4>5-4. 전산회계운용사 (1~3급)</h4>\n<ul><li>\n필기: 과목당 40점 이상, 평균 60점 이상 합격\n<ul><li>\n3급 필기: 회계원리\n</li><li>\n2급 필기: 재무회계 / 원가회계\n</li><li>\n1급 필기: 재무회계 / 원가관리회계 / 세무회계\n</li></ul>\n</li><li>\n실기: 100점 만점에 70점 이상 합격\n</li></ul>\n<hr>\n<h3>6. 커리큘럼 (통합 정리)</h3>\n<div class=\"tw\"><table><thead><tr><th>과정</th><th>기간</th><th>시간대</th><th>핵심 내용</th></tr></thead><tbody><tr><td>MOS 365</td><td>1개월</td><td>평일/주말</td><td>엑셀/워드/PPT 국제공인</td></tr><tr><td>실무 엑셀</td><td>-</td><td>-</td><td>100% 실기, 현업 업무 처리</td></tr><tr><td>컴활 1급</td><td>1개월</td><td>평일/주말</td><td>엑셀+액세스, 공기업 가산점</td></tr><tr><td>전산회계 1급</td><td>2개월</td><td>평일/주말</td><td>경리 업무, 케이렙, 재무/원가/VAT</td></tr><tr><td>전산세무 2급</td><td>2개월</td><td>평일</td><td>부가세 신고, 원천징수/연말정산</td></tr><tr><td>전산세무 1급</td><td>2개월</td><td>주말</td><td>법인세 조정, 관리자급</td></tr><tr><td>재경관리사</td><td>2개월</td><td>주말</td><td>100% 이론, 강남지점 한정</td></tr></tbody></table></div>\n<hr>\n<h3>7. 실무자가 꼭 알아야 할 세무 일정</h3>\n<blockquote>출처: 국세청(NTS) 연간 주요 세무 일정</blockquote>\n<blockquote>&quot;왜 회계팀은 3월과 5월에 야근을 할까요? 이 흐름을 알아야 공부할 맛이 납니다.&quot;</blockquote>\n<div class=\"tw\"><table><thead><tr><th>시점</th><th>업무</th><th>비고</th></tr></thead><tbody><tr><td><strong>매월 10일</strong></td><td>원천세 신고</td><td>직원 월급에서 세금 공제 후 납부</td></tr><tr><td><strong>1월 &amp; 7월</strong></td><td>부가가치세 확정 신고</td><td>개인/법인 사업자 필수</td></tr><tr><td><strong>3월</strong></td><td>법인세 신고</td><td>12월 결산 법인의 1년치 세금 신고 (가장 중요)</td></tr><tr><td><strong>5월</strong></td><td>종합소득세 신고</td><td>개인사업자 및 프리랜서의 1년치 세금 신고</td></tr></tbody></table></div>\n<blockquote>Tip: 전산세무 2급/1급을 배우면 이 일정에 맞춰 직접 신고서를 작성할 수 있음</blockquote>\n<hr>\n<h3>8. 취업 / 진로</h3>\n<h4>8-1. 자격증 우대사항 (공신력)</h4>\n<ul><li>\n<strong>공무원 가산점</strong>: 경찰(2점), 해경(가산점), 군 기술행정병 등 가산점 인정\n</li><li>\n<strong>학점은행제</strong>: 자격증 취득 시 경영학 학점 인정\n</li><li>\n<strong>컴활 1급</strong>: 공기업에서 가산점으로 매우 유리\n</li><li>\n<strong>AI 활용능력</strong>: 요즘 기업에서 AI 활용 능력도 요구하므로 언급할 것\n</li></ul>\n<h4>8-2. 취업 분야</h4>\n<ul><li>\n<strong>기업 회계/재무팀</strong>: 모든 기업의 필수 부서 (안정성)\n</li><li>\n<strong>세무법인/회계사무소</strong>: 전문적인 세무 업무 수행 (경력 쌓기 좋음)\n</li><li>\n<strong>창업/프리랜서</strong>: 내 사업의 돈 흐름과 세금을 직접 관리\n</li></ul>\n<h4>8-3. 레벨별 취업 목표</h4>\n<div class=\"tw\"><table><thead><tr><th>자격증 수준</th><th>취업 가능 포지션</th></tr></thead><tbody><tr><td>전산회계 1급</td><td>기업 경리 업무 수행 가능</td></tr><tr><td>전산세무 2급 (+ERP)</td><td>중견기업 입사 가능</td></tr><tr><td>전산세무 1급</td><td>관련 업무 매니저/장급 취직 (취업 하이패스)</td></tr></tbody></table></div>\n<hr>\n<h3>9. 상담 포인트</h3>\n<h4>9-1. OA 자격증 관련</h4>\n<ul><li>\n<strong>Q. 디자인/인테리어 쪽인데 엑셀이 필요한가요?</strong>\n<ul><li>\nA. 필수입니다. 자재 단가 계산, 공사 스케줄 관리 등 실무는 전부 엑셀로 돌아갑니다.\n</li></ul>\n</li><li>\n<strong>Q. MOS와 컴활 중 뭐가 낫나요?</strong>\n<ul><li>\nA. 다다익선입니다. MOS로 기초와 실무 감각을 익히고(5개 자격증 취득 효과), 컴활 1급으로 스펙을 완성하는 루트가 베스트입니다.\n</li></ul>\n</li><li>\n<strong>어필 포인트</strong>: &quot;다른 사람들도 컴활 1급 자격증 다 갖고 있습니다!&quot; + 요즘 기업에서 AI 활용능력도 요구하므로 언급\n</li></ul>\n<h4>9-2. 전산세무회계 관련</h4>\n<ul><li>\n<strong>Q. 수학 못하는데 회계 어렵지 않나요?</strong>\n<ul><li>\nA. 수학(미적분)이 아닙니다. 산수(사칙연산)와 약속(규칙)입니다. 계산기가 다 해주니 걱정 마세요.\n</li></ul>\n</li><li>\n<strong>Q. 비전공자도 정말 가능한가요?</strong>\n<ul><li>\nA. 현직 세무사 사무실 직원의 상당수가 비전공자 출신입니다. 실무 중심 자격증이라 전공보다 '자격증 유무'와 '실무 능력'이 더 중요합니다.\n</li></ul>\n</li><li>\n<strong>Q. 전산세무와 AT(FAT/TAT)의 차이는?</strong>\n<ul><li>\nA. 운전면허와 같습니다. 1종 보통으로 트럭(케이렙)도 몰고 승용차(더존)도 몰 수 있듯이, 하나를 배우면 다른 하나는 프로그램 버튼 위치만 다를 뿐 쉽게 취득 가능합니다. (쌍끌이 전략)\n</li></ul>\n</li><li>\n<strong>연령대 높은 상담자 주의</strong>: 전산회계 2급 정도의 지식 보유 여부 확인 필수. 지식 없는 경우 전산회계 2급 온라인 강의 선행 추천\n</li></ul>\n<h4>9-3. 기타</h4>\n<ul><li>\n*모르는 건 메모하고 질문하기. 용어가 어려워서 공부 많이 필요*\n</li><li>\n전산회계/세무 수업 시 요약노트 제공 → 높은 합격률 어필\n</li><li>\n자격증반 수강생에 한해 강의 녹화본 제공 (학원 제공이나 멘토 재량임을 어필)\n</li></ul>\n<hr>\n<h3>10. 수강료 / 기타 운영 정보</h3>\n<ul><li>\n수강료 관련 정보는 별도 확인 필요 (파일 내 미기재)\n</li><li>\n<strong>MOS 응시료 할인</strong>: 학원 수강 후 응시 시 할인 혜택 있음\n</li><li>\n<strong>학원 내부 시험 응시</strong>: MOS는 학원 내부에서 시험 응시 가능 (각 과목별 응시 가능)\n</li><li>\n<strong>합격률 보장</strong>: 컴활 1급 본원 합격률 80~90%\n</li><li>\n<strong>강의 녹화본 제공</strong>: 컴활 자격증반에 한함 (멘토 재량)\n</li><li>\n<strong>재경관리사</strong>: 강남지점만 개설\n</li></ul>\n<h3>11. 공군 기본군사훈련단 일반직종 자격증 (병 특기분류 반영, 260805 수집)</h3>\n<p>출처: &quot;공군 기본군사훈련단 일반직종 자격증 - 병 특기분류 반영 자격증 및 전공 목록&quot; 표 이미지. 원본 파일 소재·배포처 [확인 필요]. 입대 예정 남성 고객 상담 시 &quot;자격증이 군 특기 배정에 반영된다&quot;는 근거 자료로 활용한다. 급수 구분은 자격증 자체 등급이 아니라 군 특기분류상 반영 등급이다.</p>\n<h4>11-1. 재정 특기병 (반영 전공: 회계)</h4>\n<ul><li>\n기사급 이상: 공인회계사, 세무사, 재경관리사\n</li><li>\n산업기사급: 세무회계 1급, 컴퓨터활용능력 1급, 회계관리 1급\n</li><li>\n기능사급: 세무회계 2급, 컴퓨터활용능력 2급, 회계관리 2급\n</li></ul>\n<h4>11-2. 인사교육 특기병 (반영 전공 없음)</h4>\n<ul><li>\n기사급 이상: 공인노무사, 법무사, 심리상담사 1급, 전문상담사 1급, 정보처리기사, 청소년상담사 1급\n</li><li>\n산업기사급: 비서 1급, 사무자동화산업기사, 사회복지사 1·2급, 심리상담사 2급, 전문상담사 2급, 전산회계운용사 1·2급, 정보처리산업기사, 청소년상담사 2·3급, 컴퓨터활용능력 1급, 행정사, 회계관리 1급\n</li><li>\n기능사급: ACP(Adobe Certified Professional), GTQ 1·2급(3급 미인정), ITQ OA MASTER, MOS MASTER, 디지털영상편집 1급, 문서실무사 1·2급, 워드프로세서, 전산회계운용사 3급, 정보기기운용기능사, 정보처리기능사, 컴퓨터활용능력 2급, 회계관리 2급\n</li></ul>\n<h4>11-3. 원본 음영 표시 항목</h4>\n<p>원본 표에서 두 가지 색(하늘색·주황색)으로 음영 처리된 항목이 있다. 범례가 표에 없어 색 구분 기준은 [확인 필요]. 음영 항목은 본원 개설 과정과 겹치는 자격증이다.</p>\n<ul><li>\n하늘색: 재경관리사, 컴퓨터활용능력 1급(재정·인사교육 공통), ACP, GTQ 1·2급, MOS MASTER\n</li><li>\n주황색: 컴퓨터활용능력 2급(재정·인사교육 공통), ITQ OA MASTER, 워드프로세서, 정보처리기사·정보처리산업기사·정보처리기능사\n</li></ul>\n<h4>11-4. 상담 활용 포인트</h4>\n<ul><li>\n본원 OA 과정만으로 커버되는 반영 자격증: 컴퓨터활용능력 1·2급, ITQ OA MASTER, MOS MASTER, 워드프로세서, 문서실무사, 재경관리사, 회계관리 1·2급, 전산회계운용사\n</li><li>\n디자인·영상 학과 연계: ACP, GTQ 1·2급, 디지털영상편집 1급 → 인사교육 특기 기능사급 반영\n</li><li>\n재정 특기 지망은 회계 계열(재경관리사·회계관리·세무회계) + 컴활 조합, 인사교육 특기 지망은 OA·정보처리·상담 계열 조합으로 매칭\n</li><li>\n반영 여부·기준 연도는 훈련단 공지 개정 가능성이 있으므로 확정 안내 금지, &quot;현재 배포 자료 기준&quot;으로 안내\n</li></ul>","x":"(태그 정리됨) oa + 전산세무회계학과 지식 통합본 oa(사무자동화)와 전산세무회계 상담에 필요한 지식을 한 문서로 모았다. mos 365에서 컴활 1급으로 이어지는 oa 자격증 로드맵, 전산회계 1급에서 전산세무 1급까지의 로드맵, fat/tat·재경관리사·erp 등 관련 자격증, 커리큘럼과 세무 일정, 취업과 상담 포인트를 다룬다. 수강료는 이 문서에 없어 별도 확인이 필요하다. 작성자 : 펭토 최종 통합일 : 2026 02 28 출처 파일 : 260127_oa자격증_mos전산회계세무 / 260222_oa자격증 v.1 / 260222_가이드_전산세무회계 자격증 v.1 1. 학과 개요 1 1. 사무자동화(oa) 한 줄 요약 \"엑셀 없이 입사하는 것은 총 없이 전쟁터에 나가는 것과 같다.\" (모든 직무의 필수 생존 기술) 필수 프로그램 : 엑셀(excel), 파워포인트(ppt), 워드(word), 액세스(access db 관리) 1 2. 전산세무회계 한 줄 요약 \"회계는 답이 정해져 있는 객관적인 약속이자, 자본주의의 생존 기술이다.\" 필수 프로그램 (양대 산맥) : 케이렙 (kclep) : 한국세무사회 자격시험용 표준 프로그램 (세무사 사무실 多) 스마트a (smart a) : 더존(douzone) 비즈온의 실무 프로그램 (일반 기업 90% 점유) 학원에서는 두 프로그램을 모두 다뤄 취업 경쟁력을 높임 1 3. 자격증 체계 상식 구분 특징 예시 국가전문자격 응시 자격 제한 있음 회계사, 세무사 국가기술자격 필기 합격 후 실기 응시 컴활, 사무자동화산업기사 민간국가공인 민간 주관이나 국가 효력 인정 전산세무회계, mos 등급 체계 : 기능사 → 산업기사 → 기사 2. oa 자격증 로드맵 master route : mos 365 → 실무 엑셀 → 컴활 1급 2 1. mos 365 (입문 / 국제공인) 평일/주말 1개월 과정 타겟 : 취준생, 사무 관련 업무 종사자 보통 대학교 1학년 때 필요한 자격증을 취득하고, 대학교 2~3학년에 공모전/인턴 활동을 함 핵심 내용 : 2026년부터 'mos 365'로 개정 (기존 액세스 제외 → 엑셀/워드/파워포인트 집중) 2년 단위로 갱신 필요 마이크로소프트가 인증하는 국제공인자격증 → 해외업무 활용 가능 일부 대학에서 졸업요건으로 mos 자격증 요구 실무나 활용범위 면에서 컴활 2급보다 유용함 컴활 1급과 과목이 겹치므로 선행 과정으로 권장 학원 내부에서 시험 응시 가능, 각 과목별 응시 가능, 수업 수강 시 응시료 할인 혜택 시험 종료 후 바로 성적 및 합격 여부 확인 가능 mos + 컴활 1급 함께 수강 시 2달간 5개 자격증 취득 가능 2 2. 실무 엑셀 (실무) 목표 : 시험용이 아닌 실제 현업 업무 처리 능력 배양 핵심 내용 : 100% 실기 위주 수업 자격증 취득 후, 또는 취득 전 실무 감각 익히기용 2 3. 컴퓨터활용능력 1급 (심화 / 국가기술) 평일/주말 1개월 과정 목표 : 공기업/대기업 필수 스펙 달성 (가산점) 핵심 내용 : 3과목 (컴퓨터일반, 엑셀, 액세스 db), 70점 이상 합격 스프레드시트(엑셀) + 데이터베이스(액세스) 마스터 난이도 높음 → 단독 수강보다는 mos 과목 선행 권장 본원 합격률 80~90% 보장 , 자격증반에 한해 강의 녹화본 제공 (학원 제공이나 멘토 재량) 2급은 변별력이 낮아 1급 또는 mos 권장 공기업에서 매우 유리함 (가산점) 2 4. 그 외 oa 관련 자격증 itq : 아래아 한글 / 파워포인트 / 엑셀 3. 전산세무회계 자격증 로드맵 master route : 전산회계 1급 → 전산세무 2급 → 전산세무 1급 (또는 재경관리사) 주관 : 한국세무사회 시험 구성 : 80% 이론, 20% 실무 / 2개월 과정 시험 일정 : 매 짝수 달에 시험 (회계와 세무는 오전/오후로 나눠 시험 → 병행학습 가능) 사용 프로그램 : 케이렙(kclep) 학원 강점 : 요약노트 제공 → 높은 합격률 법률용어 상세 설명으로 이해도 증진 다양한 실무예시 및 현장 실무 피드백 반복학습으로 이론 완성 3 1. 전산회계 1급 (기초~중급) 평일/주말 2개월 과정 목표 : 기업 경리 업무 수행 가능 (대학 3~4학년 수준) 핵심 내용 : 전산회계 2급(전표관리/회계프로그램 운용/결산과 재무제표) 심화 분개(journalizing) : '차변/대변'의 원리 완벽 이해 (회계의 구구단) 재무회계이론 / 원가회계이론 / 부가가치세(vat)이론 학습 부가가치세: 최종소비자가 구매하는 물건값에 이미 포함 → 과세 사업자는 세무서에 납부 의무 (기업이 세무사를 쓰는 이유) 원가계산 및 부가가치세 이론 학습 2급은 상고나 대학 교양 수준의 난이도라 메리트 없음 → 1급 권장 상담 참고 : 연령대가 높은 문의자는 전산회계 2급 수준 지식 보유 여부 확인 필수. 지식 없는 경우 전산회계 2급 온라인 강의 선행 추천 3 2. 전산세무 2급 (심화 / 실무) 평일 2개월 과정 목표 : 중견기업 입사 및 실무 처리 능력 (가장 수요 많음) 전 지점 공통 수강과목: 전산회계 1급 + 전산세무 2급 전산회계 1급 + 전산세무 2급 취득 (+erp) 시 중견기업 입사 가능 핵심 내용 : 전산회계 1급 내용 심화 부가가치세 신고 : 1월/7월 실무 업무 수행 가능 (세금계산서 발급, 부속서류 작성, 부가가치세신고서 작성 등) 원천징수/연말정산 : 직원 급여 관리 및 세금 공제 기술 습득 3 3. 전산세무 1급 (고급 / 관리자급) 주말 2개월 과정 목표 : 법인세 처리(3월 결 청양식","강사·학과장 전달과 중도투입은 팀장 경유이고, 팀장 보고는 수강생 이름 / 번호 한 줄로 시작한다.","99_시스템/01_업무규정/위키_전달요청양식.md"],["조직근무","강남지점은 3부서 9팀이고 본인 소속은 3-3팀 3명(최준 팀장·오영선 경력·김은일 경력, 260817 08월차 계획서 기준), 부서 번호는 2개월 주기 순위로 재배정되므로 항상 최신 계획서를 우선한다.","99_시스템/01_업무규정/위키_조직근무.md"],["줌비대면","줌링크 정본은 [[비대면 강의장 줌링크]](260630, 5층 A~H)이고, 비대면 불가 과목(현재 AI마케팅영상)은 개강안내에서 제외한다.","99_시스템/01_업무규정/위키_줌비대면.md"],["커리큘럼교재","커리큘럼 링크 정본은 [[커리큘럼 링크모음]], 교재·준비물 정본은 [[교재 및 준비물 안내]]이고, 강남지점은 자바·C언어·파이썬 과정을 운영하지 않는다.","99_시스템/01_업무규정/위키_커리큘럼교재.md"],["통화량체크절차","판정은 인트라넷 통계관리 → 직원별 통계에서 \"발신\" 구간의 통화시간으로 하고, 면제 여부는 통화량 체크리스트 구글시트(gid=0)에 본인 이름이 있는지로 확인한다.","99_시스템/01_업무규정/위키_통화량체크절차.md"],["특수처리","특처는 재수강(4+1)·참여수강·과목변경 3종이고, 채팅에 \"이름+유형\"만 주면 신청서 완성본이 코드블록으로 즉시 나온다.","99_시스템/01_업무규정/위키_특수처리.md"],["학사일정","현재 8차 사이클은 영업 07-15~08-12이고, 다음 8월차는 영업 08-13~09-14(08-13~17 휴가)다.","99_시스템/01_업무규정/위키_학사일정.md"],["할인따즈아","타지점 바우처는 100만원당 50만원짜리 1개씩 지급되고, 중퇴 시 바우처 공제금은 기존 수강료에서 차감한다.","99_시스템/01_업무규정/위키_할인따즈아.md"],["환불","나이스페이·계좌이체는 부분환불이 되어 공제금을 뺀 차액만 환불하고, 카드결제만 부분환불이 안 되어 전액 환불 후 공제금을 따로 받는다.","99_시스템/01_업무규정/위키_환불.md"],["DB배정 배대조","배정 순서는 재배정 → 턴 → 선배정이고, 대표는 전화 유입 급건이라 즉시 보고하며 댓글 배정은 운영부 처리라 배대조 대상이 아니다.","99_시스템/01_업무규정/위키_DB배정_배대조.md"]]],"s-form":["인트라넷 기입 양식","인트라넷에 그대로 옮겨 쓰는 틀입니다.",[["구인의뢰","#배대조업무 #구인의뢰 #구인의뢰양식 #취업의뢰","99_시스템/02_인트라넷양식/양식_구인의뢰.md"],["배대조 대표배정","#배대조 #대표배정 #디비심기 #디비배정","99_시스템/02_인트라넷양식/양식_배대조_대표배정.md"],["수수료율표","#수수료 #수수료율 #수수료율표 #인센티브","99_시스템/02_인트라넷양식/양식_수수료율표.md"],["영수증발급","#영수증 #교습비영수증 #영수증출력 #입금정보탭","99_시스템/02_인트라넷양식/양식_영수증발급.md"],["요청메모","#요청메모 #요청메모양식 #입금메모 #수납메모","99_시스템/02_인트라넷양식/양식_요청메모.md"],["원서작성 결제규정","#재수강 #재수강권 #댓글배정 #참여수강","99_시스템/02_인트라넷양식/양식_원서작성_결제규정.md"],["입상파","#입상파 #입상파양식 #수납보고 #매출보고","99_시스템/02_인트라넷양식/양식_입상파.md"],["재배정요청","#재배정 #재배정요청 #재배정양식 #오문의","99_시스템/02_인트라넷양식/양식_재배정요청.md"],["특처참고사항","#특처 #특별처리신청 #특별처리신청관리 #멘토변경","99_시스템/02_인트라넷양식/양식_특처참고사항.md"],["환불보고","#환불 #환불절차 #환불양식 #환불보고","99_시스템/02_인트라넷양식/양식_환불보고.md"],["DB제한내용","#디비제한 #DB제한 #순매출제한 #지각제한","99_시스템/02_인트라넷양식/양식_DB제한내용.md"]]],"s-kno function say(t){ live.textContent = t; }

/* ── 사이드 탭 ──────────────────────────────── */
function paintSide(active){
  /* 하단 탭바에 있던 이동을 사이드 맨 위로 옮겼다(260822) */
  var h = '<div class="jump">'
    + '<button type="button" data-jump="home">전체 문서 ' + KEYS.length + '건</button>'
    + '<button type="button" data-jump="find">검색 (단축키 /)</button>'
    + '<button type="button" data-jump="top">맨 위로</button>'
    + '</div>'
    + '<div class="secjump">' + IDS.map(function(id){
        return '<button type="button" data-jump="' + id + '">' + esc(DATA[id][0]) + '</button>';
      }).join('') + '</div>';
  IDS.forEach(function(id){
    var s = DATA[id];
    h += '<h2>' + esc(s[0]) + '<span class="cnt num">' + s[2].length + '</span></h2><ul>'
      + s[2].map(function(it){
          var on = it[2] === active;
          return '<li><a class="doc" href="#' + slug(it[2]) + '"' + (on ? ' aria-current="page"' : '') + '>'
            + esc(it[0]) + '</a></li>';
        }).join('') + '</ul>';
  });
  sidelist.innerHTML = h;
}

var menu = document.getElementById('menu'), veil = null;
function openSide(){
  if (!narrow.matches) return;
  side.hidden = false;
  document.getElementById('fab').hidden = true;   // 드로어 위에 맨 위로 버튼이 겹치지 않게
  menu.setAttribute('aria-expanded', 'true');
  veil = document.createElement('div');
  veil.className = 'veil';
  veil.addEventListener('click', closeSide);
  document.body.appendChild(veil);
  document.body.style.overflow = 'hidden';
  document.getElementById('sideclose').focus();
}
function closeSide(){
  if (!narrow.matches) return;
  side.hidden = true;
  menu.setAttribute('aria-expanded', 'false');
  if (veil) { veil.remove(); veil = null; }
  document.body.style.overflow = '';
  menu.focus();
}
menu.addEventListener('click', function(){ side.hidden ? openSide() : closeSide(); });
document.getElementById('sideclose').addEventListener('click', closeSide);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && narrow.matches && !side.hidden) closeSide(); });
function syncSide(){ side.hidden = narrow.matches; if (!narrow.matches && veil) { veil.remove(); veil = null; document.body.style.overflow = ''; } }
narrow.addEventListener ? narrow.addEventListener('change', syncSide) : narrow.addListener(syncSide);

/* ── 대문 ───────────────────────────────────── */
function paintHome(){
  var h = '<section class="band dark hero"><div class="wrap">'
    + '<p class="label">한 곳에서 찾기</p>'
    + '<h1>3-3팀 업무위키</h1>'
    + '<p>규정·인트라넷 양식·학과 지식·안내 자료의 <b>전문</b>이 이 안에 들어 있습니다. 따로 설치하거나 권한을 받지 않아도 읽으실 수 있습니다.</p>'
    + '<p>왼쪽 목록에서 문서를 고르거나, 위 검색창에 아는 낱말을 넣어 보시면 본문에서 찾아 드립니다. 어디서든 <kbd>/</kbd> 를 누르면 검색창으로 갑니다.</p>'
    + '<div class="stats">'
      + '<div class="stat"><div class="v num">' + KEYS.length + '</div><div class="l">실린 문서</div></div>'
      + '<div class="stat"><div class="v num">' + IDS.length + '</div><div class="l">분류</div></div>'
      + '<div class="stat"><div class="v">복사 버튼</div><div class="l">양식은 눌러서 바로 붙여넣기</div></div>'
    + '</div>'
    + recentHTML()
    + '</div></section>';

  IDS.forEach(function(id, i){
    var s = DATA[id], face = (i % 2 === 0) ? 'white' : 'paper';
    h += '<section class="band ' + face + '" id="' + id + '" aria-labelledby="' + id + '-h"><div class="wrap">'
      + '<div class="sec-head"><p class="label num">' + n2(s[2].length) + '건</p>'
      + '<h2 id="' + id + '-h">' + esc(s[0]) + '</h2><p>' + esc(s[1]) + '</p></div>'
      + (id === IDS[0] ? rowsHTML(s[2]) : cardsHTML(s[2], /양식/.test(s[0]), id))
      + '</div></section>';
  });
  main.innerHTML = h;
  paintSide(null);
  document.title = '업무위키';
}

/* 최근 본 문서. 자료를 다시 찾는 길을 짧게 만든다(있는 자료를 안 쓰게 되는 첫 이유가 다시 찾기 번거로움이라) */
function recent(){
  try { return JSON.parse(localStorage.getItem('wiki-recent') || '[]').filter(function(k){ return DOCS[k]; }); }
  catch(e){ return []; }
}
function pushRecent(key){
  try {
    var r = recent().filter(function(k){ return k !== key; });
    r.unshift(key);
    localStorage.setItem('wiki-recent', JSON.stringify(r.slice(0, 6)));
  } catch(e){}
}
function recentHTML(){
  var r = recent();
  if (!r.length) return '';
  return '<div class="recent"><p class="lb">최근에 보신 문서</p>'
    + r.map(function(k){ return '<a href="#' + slug(k) + '">' + esc(DOCS[k].t) + '</a>'; }).join('') + '</div>';
}

function rowsHTML(rows){
  return '<ol class="rows">' + rows.map(function(it, i){
    var d = DOCS[it[2]];
    var body = '<span class="t">' + esc(it[0]) + '</span>' + (it[1] ? '<span class="s">' + esc(it[1]) + '</span>' : '');
    return '<li><span class="badge num" aria-hidden="true">' + n2(i + 1) + '</span>'
      + (d ? '<a class="bd" href="#' + slug(it[2]) + '">' + body + '</a>' : '<span class="bd">' + body + '</span>')
      + '</li>';
  }).join('') + '</ol>';
}

/* 목록이 길면 8건만 펴 두고 나머지는 접는다. 한 화면에 다 쏟으면 오히려 안 읽힌다 */
var SHOWN = 8;
function cardsHTML(rows, withCopy, secId){
  var html = '<ul class="cards">' + rows.map(function(it, i){
    var d = DOCS[it[2]];
    var inner = '<span class="t">' + esc(it[0]) + '</span>' + (it[1] ? '<span class="s">' + esc(it[1]) + '</span>' : '');
    return '<li' + (i >= SHOWN ? ' hidden data-extra="' + secId + '"' : '') + '>' + (d
      ? '<a class="card" href="#' + slug(it[2]) + '">' + inner + '</a>'
        + (withCopy ? '<button class="quickcopy" type="button" data-copydoc="' + esc(it[2]) + '">양식 복사</button>' : '')
      : '<span class="card lock">' + inner + '</span>') + '</li>';
  }).join('') + '</ul>';
  if (rows.length > SHOWN) {
    html += '<button class="more" type="button" data-more="' + secId + '" aria-expanded="false">'
      + '나머지 ' + (rows.length - SHOWN) + '건 더 보기</button>';
  }
  return html;
}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-more]') : null;
  if (!b) return;
  var id = b.getAttribute('data-more');
  var open = b.getAttribute('aria-expanded') === 'true';
  var extra = document.querySelectorAll('[data-extra="' + id + '"]');
  [].slice.call(extra).forEach(function(li){ li.hidden = open; });
  b.setAttribute('aria-expanded', open ? 'false' : 'true');
  b.textContent = open ? ('나머지 ' + extra.length + '건 더 보기') : '접기';
});

function sectionOf(key){
  for (var i = 0; i < IDS.length; i++){
    var rows = DATA[IDS[i]][2];
    for (var j = 0; j < rows.length; j++) if (rows[j][2] === key) return IDS[i];
  }
  return null;
}

/* ── 문서 ───────────────────────────────────── */
function paintDoc(key){
  var d = DOCS[key];
  if (!d) { paintHome(); return; }
  var secId = sectionOf(key);
  var body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = d.h;

  var hs = body.querySelectorAll('h3, h4, h5'), toc = '';
  [].slice.call(hs).forEach(function(el, i){
    el.id = 'h' + i;
    toc += '<li><a href="#' + slug(key) + '|h' + i + '">' + esc(el.textContent) + '</a></li>';
  });

  // 복사 블록: 코드블록과 양식 블록에 버튼을 단다
  var blocks = body.querySelectorAll('pre');
  [].slice.call(blocks).forEach(function(pre, i){
    var wrapEl = document.createElement('div');
    wrapEl.className = 'block';
    var label = pre.getAttribute('data-form') ? '붙여넣기 양식' : '코드';
    wrapEl.innerHTML = '<div class="block-top"><span class="k">' + label + '</span>'
      + '<button class="copy" type="button" data-copy="' + i + '">복사</button></div>';
    pre.parentNode.insertBefore(wrapEl, pre);
    wrapEl.appendChild(pre);
  });

  main.innerHTML = '<section class="band paper"><div class="wrap"><article class="doc">'
    + '<a class="back" href="#">← 문서 목록</a>'
    + '<p class="label">' + esc(secId ? DATA[secId][0] : '문서') + '</p>'
    + '<h1>' + esc(d.t) + '</h1>'
    + '<ul class="meta"><li>갱신 ' + esc(d.d) + '</li><li>' + esc(d.f) + '</li></ul>'
    + (d.s ? '<p class="sum">' + esc(d.s) + '</p>' : '')
    + '<div class="docacts"><button class="copyall" id="copyall" type="button">문서 전문 복사</button>'
    + '<button class="more" id="copylink" type="button">이 문서 링크 복사</button></div>'
    + (toc ? '<nav class="toc" aria-label="문서 목차"><b>목차</b><ol>' + toc + '</ol></nav>' : '')
    + '</article></div></section>';

  var art = main.querySelector('.doc');
  art.appendChild(body);

  var also = (d.l || []).filter(function(k){ return DOCS[k]; });
  if (also.length){
    var el = document.createElement('div');
    el.className = 'also';
    el.innerHTML = '<b>이어지는 문서</b><ol class="rows">' + also.map(function(k, i){
      return '<li><span class="badge num" aria-hidden="true">' + n2(i + 1) + '</span>'
        + '<a class="bd" href="#' + slug(k) + '"><span class="t">' + esc(DOCS[k].t) + '</span></a></li>';
    }).join('') + '</ol>';
    art.appendChild(el);
  }

  document.getElementById('copyall').addEventListener('click', function(){
    copyText(body.innerText.trim(), this, '문서 전문');
  });
  document.getElementById('copylink').addEventListener('click', function(){
    copyText(location.origin + location.pathname + '#' + slug(key), this, '문서 링크');
  });

  /* 절마다 복사 버튼. 필요한 절만 떠서 붙여넣는 쪽이 실제 쓰임에 맞다 */
  [].slice.call(body.querySelectorAll('h3, h4, h5')).forEach(function(hEl){
    var btn = document.createElement('button');
    btn.className = 'icb';
    btn.type = 'button';
    btn.title = '이 절 복사';
    btn.setAttribute('aria-label', hEl.textContent.trim() + ' 절 복사');
    btn.innerHTML = COPY_SVG;
    btn.addEventListener('click', function(){
      var buf = [hEl.textContent.trim()], el = hEl.nextElementSibling;
      var stop = hEl.tagName === 'H3' ? ['H3'] : (hEl.tagName === 'H4' ? ['H3', 'H4'] : ['H3', 'H4', 'H5']);
      while (el && stop.indexOf(el.tagName) < 0) { buf.push(el.innerText.trim()); el = el.nextElementSibling; }
      copyText(buf.join('\n').replace(/\n{3,}/g, '\n\n'), btn, '절');
    });
    hEl.appendChild(btn);
  });

  paintSide(key);
  pushRecent(key);
  document.title = d.t + ' · 업무위키';
  window.scrollTo(0, 0);
  main.focus();
}

/* 목록에서 바로 복사 (양식 절). 문서를 열지 않아도 붙여넣을 수 있게 한다 */
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-copydoc]') : null;
  if (!b) return;
  var d = DOCS[b.getAttribute('data-copydoc')];
  if (!d) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = d.h;
  copyText(tmp.innerText.replace(/\n{3,}/g, '\n\n').trim(), b, d.t);
});

/* ── 복사 ───────────────────────────────────── */
/* 맞춤링크와 같은 아이콘 두 벌: 복사 → 체크로 바뀌었다가 돌아온다 */
var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function copyText(text, btn, what){
  var icon = btn.classList.contains('icb');
  var done = function(){
    var old = icon ? btn.innerHTML : btn.textContent;
    if (icon) { btn.innerHTML = CHECK_SVG; btn.classList.add('ok'); }
    else { btn.textContent = '복사됨'; btn.classList.add('done'); }
    say(what + '을 복사했습니다.');
    setTimeout(function(){
      if (icon) { btn.innerHTML = old; btn.classList.remove('ok'); }
      else { btn.textContent = old; btn.classList.remove('done'); }
    }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(text, done); });
  } else fallback(text, done);
}
function fallback(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ say('복사하지 못했습니다. 길게 눌러 직접 복사해 주세요.'); }
  document.body.removeChild(ta);
}
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.copy') : null;
  if (!b) return;
  var pre = b.closest('.block').querySelector('pre');
  copyText(pre.innerText.replace(/\n$/, ''), b, '양식');
});

/* ── 검색 ───────────────────────────────────── */
function snippet(text, v){
  var i = text.indexOf(v);
  if (i < 0) return '';
  var a = Math.max(0, i - 40), b = Math.min(text.length, i + v.length + 70);
  return '<span class="x">' + (a > 0 ? '… ' : '') + esc(text.slice(a, i))
    + '<mark>' + esc(text.slice(i, i + v.length)) + '</mark>'
    + esc(text.slice(i + v.length, b)) + (b < text.length ? ' …' : '') + '</span>';
}
function paintSearch(v){
  var hit = [];
  KEYS.forEach(function(k){
    var d = DOCS[k];
    if ((d.t + ' ' + d.s + ' ' + d.g.join(' ')).toLowerCase().indexOf(v) >= 0) { hit.push([k, '']); return; }
    var s = snippet(d.x, v);
    if (s) hit.push([k, s]);
  });
  main.innerHTML = '<section class="band paper"><div class="wrap">'
    + '<div class="sec-head"><p class="label num">' + hit.length + '건</p><h2>검색: ' + esc(v) + '</h2>'
    + '<p>제목과 실린 본문에서 함께 찾았습니다.</p></div>'
    + (hit.length
      ? '<ul class="cards res">' + hit.map(function(h){
          return '<li><a class="card" href="#' + slug(h[0]) + '"><span class="t">' + esc(DOCS[h[0]].t) + '</span>' + h[1] + '</a></li>';
        }).join('') + '</ul>'
      : '<div class="none"><p>제목과 본문에서 찾지 못했습니다. 다른 낱말로 한 번 더 찾아 보시거나, 아래 분류에서 살펴보실 수 있습니다.</p>'
        + '<div class="secjump">' + IDS.map(function(id){
            return '<button type="button" data-jump="' + id + '">' + esc(DATA[id][0]) + ' ' + DATA[id][2].length + '건</button>';
          }).join('') + '</div></div>')
    + '</div></section>';
  paintSide(null);
  say('검색 결과 ' + hit.length + '건');
}

function route(){
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (narrow.matches && !side.hidden) closeSide();
  if (!h) { q.value = ''; paintHome(); return; }
  var parts = h.split('|');
  if (DOCS[parts[0]]) {
    paintDoc(parts[0]);
    if (parts[1]) { var el = document.getElementById(parts[1]); if (el) el.scrollIntoView(); }
  } else paintHome();
}
window.addEventListener('hashchange', route);

/* 어디서든 / 로 검색, Esc로 빠져나오기 */
document.addEventListener('keydown', function(e){
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === 'Escape' && document.activeElement === q && q.value) { q.value = ''; route(); }
});

q.addEventListener('input', function(){
  var v = q.value.trim().toLowerCase();
  if (!v) { route(); return; }
  paintSearch(v);
});

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-doc]') : null;
  if (!t) return;
  var key = t.getAttribute('data-doc');
  if (!DOCS[key]) return;
  e.preventDefault();
  location.hash = slug(key);
});

/* ── 사이드 안 빠른 이동 · 맨 위로 ── */
var fab = document.getElementById('fab');
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-jump]') : null;
  if (!b) return;
  var t = b.getAttribute('data-jump');
  if (t === 'home') { q.value = ''; location.hash = ''; window.scrollTo({ top: 0 }); }
  else if (t === 'find') { if (narrow.matches) closeSide(); q.focus(); q.select(); }
  else if (t === 'top') { window.scrollTo({ top: 0 }); }
  else { if (location.hash) { location.hash = ''; setTimeout(function(){ goSection(t); }, 60); } else goSection(t); }
  if (narrow.matches && t !== 'find') closeSide();
});
function goSection(id){
  var el = document.getElementById(id);
  if (el) el.scrollIntoView();
}
window.addEventListener('scroll', function(){
  fab.hidden = window.scrollY < 600;
}, { passive:true });
fab.addEventListener('click', function(){ window.scrollTo({ top: 0 }); q.blur(); });

/* 글씨 크기는 읽는 사람이 정한다(유니버설 디자인). 보통 → 크게 → 아주 크게 순환, 선택은 기기에 남는다 */
var SIZES = [{ k:'m', label:'보통', scale:1 }, { k:'l', label:'크게', scale:1.15 }, { k:'xl', label:'아주 크게', scale:1.3 }];
var tsz = document.getElementById('tsz'), sizeIdx = 0;
try { var sk = localStorage.getItem('wiki-size'); if (sk) sizeIdx = Math.max(0, SIZES.map(function(s){ return s.k; }).indexOf(sk)); } catch(e){}
function applySize(){
  var s = SIZES[sizeIdx];
  document.documentElement.style.setProperty('--scale', s.scale);
  tsz.textContent = s.scale === 1 ? '가' : '가+';
  tsz.setAttribute('aria-label', '글씨 크기 ' + s.label + '. 눌러서 바꿉니다');
  tsz.title = '글씨 크기 ' + s.label;
}
tsz.addEventListener('click', function(){
  sizeIdx = (sizeIdx + 1) % SIZES.length;
  try { localStorage.setItem('wiki-size', SIZES[sizeIdx].k); } catch(e){}
  applySize();
  say('글씨 크기를 ' + SIZES[sizeIdx].label + '로 바꿨습니다.');
});
applySize();

var thm = document.getElementById('thm');
try { var sv = localStorage.getItem('wiki-theme'); if (sv) document.documentElement.setAttribute('data-theme', sv); } catch(e){}
thm.addEventListener('click', function(){
  var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('wiki-theme', n); } catch(e){}
  say(n === 'dark' ? '어두운 화면' : '밝은 화면');
});

syncSide();
route();
</script>
