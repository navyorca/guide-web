<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>업무위키</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Inter:wght@400;700&display=swap">
<style>
  /* 업무위키 · 3-3팀 내부 매뉴얼.
     260822 접근성 개편: 문서 이동을 사이드 탭으로 옮기고(좁은 화면은 드로어), 양식은 복사 버튼으로 바로 쓴다.
     구조 기조는 design-system 7절(면 교대 · 섹션 머리 3단 · 아래만 진한 카드 · 원형 배지 · 알약).
     배색은 앨리스블루 바탕 · 화이트 카드 · 네이비 면 · 페리윙클과 베이비블루 강조(민트 미사용).
     가독성 기준(본문 19px · 최소 16px · weight 300 금지 · 줄높이 1.8 · keep-all)이 위 기조보다 앞선다.
     본문·목록은 wiki-build.js가 만든다. DOCS·DATA 마커 사이는 손대지 않는다. */
  :root{
    --paper:#F0F8FF; --white:#FFFFFF;
    --ink:#0B1220; --ink-2:#2C3444;
    --line:#C3CAD8; --line-soft:#E1EAF6;
    --brand:#2F6BFF; --brand-ink:#1642C4; --brand-soft:#E4ECFF;
    --brand-deep:#122A5E; --ink-deep:#0A1128;
    --peri:#A7B4F0; --baby:#9CD3F5;
    --ok-bg:#E4ECFF; --ok-ink:#1642C4;
    --sh-sm:0 2px 8px rgba(10,17,40,.06);
    --sh-md:0 12px 32px rgba(10,17,40,.10);
    --side:284px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A1128; --white:#141C31;
      --ink:#F0F3FA; --ink-2:#C9D3E8;
      --line:#3B4770; --line-soft:#222C49;
      --brand:#5B8CFF; --brand-ink:#B7C6FF; --brand-soft:#1D2F5E;
      --brand-deep:#12224A; --ink-deep:#060B18;
      --peri:#B7C1F5; --baby:#A7D8F7;
      --ok-bg:#1D2F5E; --ok-ink:#B7C6FF;
      --sh-sm:0 2px 8px rgba(0,0,0,.36); --sh-md:0 12px 32px rgba(0,0,0,.46);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1128; --white:#141C31;
    --ink:#F0F3FA; --ink-2:#C9D3E8;
    --line:#3B4770; --line-soft:#222C49;
    --brand:#5B8CFF; --brand-ink:#B7C6FF; --brand-soft:#1D2F5E;
    --brand-deep:#12224A; --ink-deep:#060B18;
    --peri:#B7C1F5; --baby:#A7D8F7;
    --ok-bg:#1D2F5E; --ok-ink:#B7C6FF;
    --sh-sm:0 2px 8px rgba(0,0,0,.36); --sh-md:0 12px 32px rgba(0,0,0,.46);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none!important; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } *{ transition:none!important; animation:none!important; } }
  /* --scale = 읽는 사람이 고른 글씨 배율(보통 1 · 크게 1.15 · 아주 크게 1.3) */
  body{ margin:0; background:var(--paper); color:var(--ink);
    font-size:calc(19px * var(--scale, 1)); font-weight:400; line-height:1.8; word-break:keep-all;
    font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; }
  .num{ font-family:Inter,system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  a{ color:var(--brand-ink); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--brand); outline-offset:3px; border-radius:4px; }
  .sr{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .skip{ position:absolute; left:16px; top:-100px; z-index:80; padding:14px 22px; background:var(--white);
    border:2px solid var(--brand-ink); border-radius:999px; font-size:17px; font-weight:700; }
  .skip:focus{ top:12px; }

  /* ── 상단 막대 ─────────────────────────────── */
  .top{ position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:2px solid var(--line); }
  @supports (background:color-mix(in srgb, red, blue)){
    .top{ background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(10px); }
  }
  .top-in{ max-width:1440px; margin:0 auto; padding:12px 32px; display:flex; align-items:center; gap:14px; }
  @media (max-width:720px){ .top-in{ padding:10px 20px; gap:10px; } }
  .menu{ flex:none; min-width:48px; height:48px; padding:0 14px; border:2px solid var(--line); border-radius:999px;
    background:var(--white); color:var(--ink); font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  .menu:hover{ border-color:var(--brand-ink); color:var(--brand-ink); }
  @media (min-width:1080px){ .menu{ display:none; } }
  .logo{ display:flex; align-items:center; gap:10px; min-height:44px; font-size:22px; font-weight:800; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; }
  .logo:hover{ text-decoration:none; }
  .logo em{ font-style:normal; font-size:16px; font-weight:700; color:var(--brand-ink); background:var(--brand-soft); border-radius:999px; padding:5px 13px; }
  @media (max-width:900px){ .logo em{ display:none; } }
  .find{ flex:1; min-width:0; display:flex; justify-content:flex-end; }
  .find input{ width:100%; max-width:420px; min-height:48px; padding:0 20px; font-size:17px; font-weight:500;
    font-family:inherit; color:var(--ink); background:var(--white); border:2px solid var(--line); border-radius:999px; }
  .find input::placeholder{ color:var(--ink-2); }
  .find input:hover{ border-color:var(--brand-ink); }
  .thm{ flex:none; width:48px; height:48px; border:2px solid var(--line); border-radius:999px; background:var(--white);
    color:var(--ink); font-size:18px; font-family:inherit; cursor:pointer; }
  .thm:hover{ border-color:var(--brand-ink); color:var(--brand-ink); }

  /* ── 사이드 탭 ─────────────────────────────── */
  .shell{ max-width:1440px; margin:0 auto; display:block; }
  @media (min-width:1080px){ .shell{ display:grid; grid-template-columns:var(--side) 1fr; align-items:start; } }
  .side{ background:var(--white); border-right:2px solid var(--line); }
  @media (min-width:1080px){
    .side{ position:sticky; top:73px; height:calc(100dvh - 73px); overflow-y:auto; padding:28px 20px 40px; }
  }
  @media (max-width:1079px){
    .side{ position:fixed; inset:0 auto 0 0; width:min(88vw,340px); z-index:60; padding:24px 20px 40px;
      overflow-y:auto; box-shadow:var(--sh-md); }
    .side[hidden]{ display:none!important; }
    .veil{ position:fixed; inset:0; z-index:55; background:rgba(10,17,40,.5); }
  }
  .side .close{ display:none; }
  @media (max-width:1079px){
    .side .close{ display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:10px 20px;
      margin-bottom:20px; border:2px solid var(--line); border-radius:999px; background:var(--paper);
      font-family:inherit; font-size:17px; font-weight:700; color:var(--ink); cursor:pointer; }
  }
  .side .all{ display:block; padding:12px 16px; margin-bottom:8px; border-radius:12px; background:var(--brand-soft);
    color:var(--brand-ink); font-size:17px; font-weight:700; }
  .side h2{ margin:24px 0 6px; font-size:16px; font-weight:700; color:var(--ink-2); }
  .side ul{ list-style:none; margin:0; padding:0; }
  .side a.doc{ display:block; padding:10px 16px; border-radius:12px; font-size:17px; font-weight:500; line-height:1.55; color:var(--ink-2); }
  .side a.doc:hover{ background:var(--brand-soft); color:var(--brand-ink); text-decoration:none; }
  .side a.doc[aria-current="page"]{ background:var(--brand-ink); color:#FFFFFF; font-weight:700; }
  .side .cnt{ float:right; font-size:16px; font-weight:700; color:var(--ink-2); }

  /* ── 면 교대 ───────────────────────────────── */
  .band{ padding:96px 0; }
  @media (max-width:720px){ .band{ padding:72px 0; } }
  .band.paper{ background:var(--paper); }
  .band.white{ background:var(--white); }
  .band.dark{ background:var(--ink-deep); color:#FFFFFF; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 32px; }
  @media (max-width:720px){ .wrap{ padding:0 20px; } }

  .hero{ padding:96px 0; }
  @media (max-width:720px){ .hero{ padding:72px 0; } }
  .hero .label{ margin:0 0 10px; font-size:17px; font-weight:700; letter-spacing:.06em; line-height:1.5; color:var(--baby); }
  .hero h1{ margin:0 0 18px; font-size:clamp(26px,3.4vw,34px); font-weight:800; line-height:1.35; letter-spacing:-.01em; color:#FFFFFF; }
  .hero p{ margin:0 0 14px; max-width:700px; font-size:19px; font-weight:500; line-height:1.8; color:#E3E9F6; }
  .hero p b{ color:var(--baby); font-weight:700; }
  .stats{ display:flex; flex-wrap:wrap; gap:12px; margin-top:36px; }
  .stat{ min-width:150px; padding:20px 24px; border:2px solid rgba(255,255,255,.24); border-radius:20px; }
  .stat .v{ font-size:32px; font-weight:800; line-height:1.3; color:#FFFFFF; }
  .stat .l{ font-size:16px; font-weight:500; color:#C7D2E8; }

  .sec-head{ margin:0 0 44px; }
  .sec-head .label{ margin:0 0 6px; font-size:17px; font-weight:700; letter-spacing:.06em; line-height:1.5; color:var(--brand-ink); }
  .sec-head h2{ margin:0 0 12px; font-size:25px; font-weight:800; line-height:1.42; letter-spacing:-.01em; }
  .sec-head p{ margin:0; max-width:700px; font-size:19px; font-weight:400; color:var(--ink-2); }

  .rows{ list-style:none; margin:0; padding:0; }
  .rows li{ display:flex; gap:20px; align-items:flex-start; padding:18px 4px; border-bottom:2px solid var(--line); }
  .rows li:first-child{ border-top:2px solid var(--line); }
  .badge{ flex:none; width:44px; height:44px; border:2px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; }
  /* 번호 행 링크도 터치 타깃 44px를 채운다 */
  .rows .bd{ flex:1; min-width:0; color:inherit; text-decoration:none; display:flex; flex-direction:column;
    justify-content:center; min-height:44px; padding:4px 0; }
  .rows a.bd:hover .t{ color:var(--brand-ink); }
  .rows .t{ display:block; font-size:19px; font-weight:700; line-height:1.5; }
  .rows .s{ display:block; margin-top:2px; font-size:17px; color:var(--ink-2); line-height:1.65; }

  /* 하단 고정 탭바 · 맨 위로 (맞춤링크에서 가져온 편의, 폰 엄지 도달 범위) */
  /* 아이콘 복사 버튼 (맞춤링크 .c-copy 방식: 보이는 크기는 작게, 터치면은 44px) */
  .icb{ position:relative; width:30px; height:30px; flex:none; display:inline-flex; align-items:center; justify-content:center;
    margin-left:8px; padding:0; border:0; border-radius:8px; background:none; color:var(--ink-2); cursor:pointer; vertical-align:middle; }
  /* 터치면은 넓히되 좌우로만 넓힌다. 위아래로 44px을 잡으면 윗줄·아랫줄 글자를 가로챈다 */
  .icb:before{ content:""; position:absolute; left:50%; top:50%; width:44px; height:34px; transform:translate(-50%,-50%); }
  .icb:hover{ color:var(--brand-ink); background:var(--brand-soft); }
  .icb.ok{ color:var(--brand-ink); background:var(--ok-bg); }
  .icb svg{ width:18px; height:18px; }
  /* 제목 줄에 붙는 아이콘은 글줄 흐름을 따르게 둔다(겹침 방지) */
  .doc .body h3 .icb, .doc .body h4 .icb, .doc .body h5 .icb{ position:relative; top:-2px; }
  .doc .body h3, .doc .body h4, .doc .body h5{ display:block; }
  .doc .body h3 .icb, .doc .body h4 .icb, .doc .body h5 .icb{ opacity:.6; }
  .doc .body h3:hover .icb, .doc .body h4:hover .icb, .doc .body h5:hover .icb, .icb:focus-visible{ opacity:1; }
  .docacts{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 30px; }

  /* 사이드 안 빠른 이동 (260822: 하단 탭바를 걷어내고 사이드로 합쳤다) */
  .side .jump{ display:grid; gap:8px; margin:0 0 20px; }
  .side .jump button{ min-height:48px; padding:12px 16px; border:2px solid var(--line); border-radius:12px;
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:17px; font-weight:700;
    text-align:left; cursor:pointer; }
  .side .jump button:hover{ border-color:var(--brand-ink); color:var(--brand-ink); }
  .side .secjump{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; }
  .side .secjump button{ min-height:44px; padding:10px 16px; border:2px solid var(--line); border-radius:999px;
    background:var(--white); color:var(--ink-2); font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .side .secjump button:hover{ border-color:var(--brand-ink); color:var(--brand-ink); }
  /* 검색이 빈손일 때도 같은 알약으로 분류 이동을 준다(막다른 길을 만들지 않는다) */
  .none .secjump{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .none .secjump button{ min-height:48px; padding:12px 20px; border:2px solid var(--brand-ink); border-radius:999px;
    background:var(--white); color:var(--brand-ink); font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  .none .secjump button:hover{ background:var(--brand-ink); color:#FFFFFF; }
  .none p{ margin:0; }
  .fab{ position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:44;
    min-height:48px; padding:12px 20px; border:2px solid var(--line); border-radius:999px; background:var(--white);
    color:var(--ink); font-family:inherit; font-size:16px; font-weight:700; box-shadow:var(--sh-md); cursor:pointer; }
  @media (min-width:1080px){ .fab{ bottom:24px; } }

  /* 긴 목록은 접어 둔다 (맞춤링크 details 패턴) */
  .more{ min-height:48px; margin-top:16px; padding:12px 24px; border:2px solid var(--brand-ink); border-radius:999px;
    background:var(--white); color:var(--brand-ink); font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  .more:hover{ background:var(--brand-ink); color:#FFFFFF; }

  .cards{ list-style:none; margin:0; padding:0; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:820px){ .cards{ grid-template-columns:1fr 1fr; } }
  .card{ display:block; height:100%; padding:24px 26px; background:var(--white); border-radius:20px;
    border-bottom:2px solid var(--ink); box-shadow:var(--sh-sm); color:var(--ink); }
  .band.white .card{ background:var(--paper); }
  .card:hover{ box-shadow:var(--sh-md); border-bottom-color:var(--brand); text-decoration:none; }
  .card .t{ display:block; font-size:19px; font-weight:700; line-height:1.5; }
  .card:hover .t{ color:var(--brand-ink); }
  .card .s{ display:block; margin-top:6px; font-size:17px; font-weight:400; line-height:1.65; color:var(--ink-2); }
  .card.lock{ border-bottom-color:var(--line); box-shadow:none; }
  /* 목록에서 바로 쓰는 복사 (양식 절) */
  .cards li{ display:flex; flex-direction:column; gap:10px; }
  .cards li .card{ flex:1; }
  .quickcopy{ align-self:flex-start; min-height:44px; padding:10px 20px; border:2px solid var(--brand-ink);
    border-radius:999px; background:var(--white); color:var(--brand-ink);
    font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .quickcopy:hover{ background:var(--brand-ink); color:#FFFFFF; }
  .quickcopy.done{ background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-ink); }

  /* 최근 본 문서 */
  .recent{ display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  .recent a{ min-height:44px; display:inline-flex; align-items:center; padding:10px 20px; border-radius:999px;
    border:2px solid rgba(255,255,255,.28); color:#FFFFFF; font-size:17px; font-weight:700; }
  .recent a:hover{ background:#FFFFFF; color:var(--ink-deep); border-color:#FFFFFF; text-decoration:none; }
  .recent .lb{ width:100%; margin:0 0 2px; font-size:16px; font-weight:700; color:var(--baby); }
  kbd{ font-family:Inter,system-ui,sans-serif; font-size:16px; font-weight:700; background:rgba(255,255,255,.16);
    border-radius:8px; padding:2px 8px; }

  /* ── 문서 ──────────────────────────────────── */
  /* 읽는 화면은 맞춤링크처럼 한 손 폭·큰 글씨로 (260822) */
  .doc{ max-width:720px; font-size:calc(19px * var(--scale,1)); line-height:1.8; }
  .doc .body p, .doc .body li{ font-size:calc(19px * var(--scale,1)); line-height:1.8; }
  .back{ display:inline-block; margin:0 0 26px; padding:11px 20px; border:2px solid var(--line); border-radius:999px;
    background:var(--white); font-size:17px; font-weight:700; color:var(--ink-2); }
  .back:hover{ border-color:var(--brand-ink); color:var(--brand-ink); text-decoration:none; }
  .doc .label{ margin:0 0 8px; font-size:17px; font-weight:700; letter-spacing:.06em; line-height:1.5; color:var(--brand-ink); }
  .doc h1{ margin:0 0 14px; font-size:clamp(25px,3vw,30px); font-weight:800; line-height:1.35; letter-spacing:-.01em; }
  .doc .meta{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; padding:0; list-style:none; }
  .doc .meta li{ font-size:16px; font-weight:700; color:var(--ink-2); background:var(--line-soft); border-radius:999px; padding:6px 15px; }
  .doc .sum{ margin:0 0 30px; padding:24px 26px; background:var(--brand-soft); border-radius:20px;
    font-size:calc(19px * var(--scale,1)); font-weight:500; line-height:1.8; color:var(--ink); }
  .toc{ margin:0 0 36px; padding:22px 28px 24px; background:var(--white); border:2px solid var(--line); border-radius:20px; }
  .toc b{ display:block; margin-bottom:10px; font-size:17px; font-weight:700; color:var(--ink-2); }
  .toc ol{ margin:0; padding-left:24px; }
  .toc li{ font-size:18px; line-height:1.9; }

  .copyall{ display:inline-flex; align-items:center; gap:8px; min-height:48px; margin:0 0 30px; padding:12px 24px;
    border:0; border-radius:999px; background:var(--brand-ink); color:#FFFFFF;
    font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  .copyall:hover{ background:var(--brand-deep); }
  .copyall.done{ background:var(--ok-bg); color:var(--ok-ink); }

  .body h3{ margin:46px 0 14px; font-size:26px; font-weight:800; line-height:1.4; letter-spacing:-.01em;
    padding-bottom:10px; border-bottom:2px solid var(--line); scroll-margin-top:150px; }
  .body h4{ margin:34px 0 10px; font-size:23px; font-weight:700; line-height:1.45; scroll-margin-top:150px; }
  .body h5, .body h6{ margin:28px 0 8px; font-size:20px; font-weight:700; line-height:1.5; scroll-margin-top:150px; }
  .body p{ margin:0 0 16px; }
  .body ul, .body ol{ margin:0 0 18px; padding-left:24px; }
  .body li{ margin:0 0 10px; }
  .body li > ul{ margin:10px 0 0; }
  .body strong{ font-weight:700; }
  .body code{ background:var(--brand-soft); color:var(--brand-ink); border-radius:12px; padding:2px 8px; font-size:17px; font-weight:500; font-family:inherit; }

  /* 복사 가능한 블록 */
  .block{ position:relative; margin:0 0 22px; background:var(--white); border:2px solid var(--line); border-radius:20px; }
  .block-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px 12px 22px;
    border-bottom:2px solid var(--line); }
  .block-top .k{ font-size:16px; font-weight:700; color:var(--ink-2); }
  .copy{ min-height:44px; padding:10px 20px; border:2px solid var(--brand-ink); border-radius:999px;
    background:var(--brand-ink); color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .copy:hover{ background:var(--brand-deep); border-color:var(--brand-deep); }

학</td><td>-</td><td>-</td><td>20H</td><td>-</td><td>300,000</td></tr><tr><td>디일러/방학</td><td>-</td><td>-</td><td>20H</td><td>-</td><td>320,000</td></tr></tbody></table></div>\n<h5>AIX 개편 신규·변경 (260727 확정분)</h5>\n<p><strong>구과목 → AIX 전환 규칙 (260822 사업부 공지)</strong></p>\n<ul><li>\n포토샵 400,000 → <strong>AIX포토샵 500,000</strong> / 일러스트 400,000 → <strong>AIX일러스트 500,000</strong>\n</li><li>\n<strong>동일 과목</strong>을 신과정으로 바꾸는 것은 <strong>차액 결제 없이 인트라넷 배정게시판(댓글배정)으로 변경 가능</strong>하다. 10만원 차액을 청구하지 않는다.\n</li><li>\n<strong>동일 과목이 아니면 특처 작성 필수.</strong> 예) 포토샵(40만) → AIX일러스트(50만)는 과목이 다르므로 댓글배정 불가.\n</li><li>\n적용 판단은 보유 과목명 기준이다. 포토샵 보유자는 AIX포토샵으로만, 일러스트 보유자는 AIX일러스트로만 무상 전환된다.\n</li></ul>\n<p>수강료는 단계(1과목) 기준. 단계 표기가 1~3이면 3개월 연속 수강 시 총액은 단계 수강료 × 단계 수. 구과목 편성은 개편 적용 전까지 위 표를 계속 사용한다.</p>\n<p>과정 구조·시수·구과목 매핑 정본은 <a class=\"wl\" data-doc=\"99_시스템/03_학과지식/AIX_모듈개편_정본.md\">AIX_모듈개편_정본</a>. 아래 표에 없는 AIX 과정의 수강료는 그 문서의 통합로드맵 V1 표를 참조한다(260728 기준: 마케팅영상 24H 50만 · 유튜브 올인원클래스 32H 100만 · 실전 영상편집 24H 50만 · 2D 모션 48H 100만 · 피그마 90H 150만 · 바이브코딩 90H 180만 · 포토 24H 50만 · 일러 24H 50만 · 공간기획&amp;인테리어 설계 48H 90만 · BIM 기초 64H 100만 · 공간VR시각화 48H 100만).</p>\n<p><strong>웹</strong></p>\n<div class=\"tw\"><table><thead><tr><th>과정명</th><th>격일</th><th>회당</th><th>일수</th><th>총시간</th><th>개월</th><th>수강료</th></tr></thead><tbody><tr><td>AIX 에이전트 업무자동화1~3/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>3</td><td>600,000</td></tr><tr><td>AIX 이커머스 창업/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>-</td><td>600,000</td></tr></tbody></table></div>\n<p><strong>시각편집</strong></p>\n<div class=\"tw\"><table><thead><tr><th>과정명</th><th>격일</th><th>회당</th><th>일수</th><th>총시간</th><th>개월</th><th>수강료</th></tr></thead><tbody><tr><td>AIX포토샵</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>1</td><td>500,000</td></tr><tr><td>AIX일러스트</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>1</td><td>500,000</td></tr><tr><td>AIX 프라이빗 마케팅 클래스1~2/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>2</td><td>500,000</td></tr><tr><td>AIX 패키지&amp;굿즈 제작 실무1~2/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>2</td><td>500,000</td></tr><tr><td>AIX 디지털 출판 실무1,2/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>2</td><td>500,000</td></tr><tr><td>AIX 브랜딩 디자인 실무1,2/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>2</td><td>500,000</td></tr></tbody></table></div>\n<p><strong>모션영상</strong></p>\n<div class=\"tw\"><table><thead><tr><th>과정명</th><th>격일</th><th>회당</th><th>일수</th><th>총시간</th><th>개월</th><th>수강료</th></tr></thead><tbody><tr><td>실전 영상편집 클래스/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>-</td><td>500,000</td></tr><tr><td>2D 모션디자인 클래스(1,2)/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>2</td><td>500,000</td></tr></tbody></table></div>\n<p><strong>아트웍</strong></p>\n<div class=\"tw\"><table><thead><tr><th>과정명</th><th>격일</th><th>회당</th><th>일수</th><th>총시간</th><th>개월</th><th>수강료</th></tr></thead><tbody><tr><td>AIX애니메이션/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>-</td><td>600,000</td></tr></tbody></table></div>\n<p><strong>인테리어</strong></p>\n<div class=\"tw\"><table><thead><tr><th>과정명</th><th>격일</th><th>회당</th><th>일수</th><th>총시간</th><th>개월</th><th>수강료</th></tr></thead><tbody><tr><td>AIX 3D 모델링 &amp; 렌더링1~3/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>3</td><td>500,000</td></tr><tr><td>BIM 기초&amp;AIX활용(1~2)/A,B</td><td>격일</td><td>3H</td><td>8D</td><td>24H</td><td>2</td><td>500,000</td></tr><tr><td>AIX 공간VR시각화(1~2)/A,B</td><td>격일</td><td>2H</td><td>8D</td><td>16H</td><td>2</td><td>600,000</td></tr></tbody></table></div>\n<p>[확인 필요] 3D 모델링 &amp; 렌더링은 260728 통합로드맵 V1에서 90H·3개월·총 180만(월 60만)으로 표기됐다. 위 표(72H·총 150만)와 시수·총액이 모두 다르므로 견적 발행 전 팀장 확인.</p>\n<p>[확인 필요] 260728 신규 과목 3건이 통합로드맵 V1 표기와 시수·총액이 다르다. 실전 영상편집: 신규 16H(2H×8일) vs 로드맵 24H. BIM 기초: 신규 총 48H(24H×2단계) vs 로드맵 64H. 공간VR시각화: 신규 총 32H·120만(16H×2단계, 각 60만) vs 로드맵 48H·100만. 견적·개강안내 발행 전 팀장 확인.</p>\n<p>변경 이력(260822): 포토샵·일러스트 구과목(각 40만) → AIX포토샵·AIX일러스트(각 50만) 확정. 동일과목 전환은 차액 없이 배정게시판 처리, 타과목 전환은 특처 필수(위 전환 규칙 절).</p>\n<p>변경 이력(260728): 신규 5과목 추가 → 실전 영상편집 클래스/A,B(2H×8일·50만), 2D 모션디자인 클래스(1,2)/A,B(3H×8일·각 50만), AIX애니메이션/A,B(2H×8일·60만), BIM 기초&amp;AIX활용(1~2)/A,B(3H×8일·각 50만), AIX 공간VR시각화(1~2)/A,B(2H×8일·각 60만). 격일 편성은 /A,B 표기(A=월수·B=화목) 기준으로 반영.</p>\n<p>변경 이력(260727): AIX 디지털 출판 실무/A,B 45만 단일 → 1,2 단계 분할·각 50만(2H×8일). AIX 브랜딩 디자인 실무1,2/A,B 각 55만 → 각 50만.</p>\n<p>브랜딩 디자인 실무 회당·일수는 사용자 제공 정보에 없어 260727 통합자료(총 48H·2개월) 기준 단계당 24H로 산정. 3H×8일 편성은 [확인 필요].</p>","x":"수강료 수강료표 가격 정가 회당시간 시수 수업시간 견적 컴퓨터 강남 본점 과정·수강료 정본(1과목 기준). 수강료 단위는 원. 회당=1회 수업시간, 일수=수업 일수, 총시간=시수, 개월=수강기간(개월), 격일/주 공란은 매일반 또는 미표기. 개강안내 수업시간은 이 표의 회당 시간으로 확정한다(예: 포토샵/a,b 격일 3h → 저녁반 19:00 시작이면 22:00 종강). 추정 금지, 표에 있으면 그대로 사용. 평일 아트웍 과정명 격일 회당 일수 총시간 개월 수강료 컨셉드로잉/a,b 격일 2h 8d 16h 600,000 디지털드로잉/포폴/a,b 격일 2h 8d 16h 600,000 발상과표현(1,2)/a,b 격일 2h 8d 16h 500,000 색채학(1,2)/a,b 격일 2h 8d 16h 500,000 플랫모션/a,b 격일 2h 8d 16h 500,000 스토리보드/a,b 격일 2h 8d 16h 500,000 ai크리에이터 아트웍 격일 2h 8d 16h 600,000 웹툰&ai어시스트/ab 24h 600,000 시각편집 과정명 격일 회당 일수 총시간 개월 수강료 포토샵 2h 16d 32h 400,000 일러스트 2h 16d 32h 400,000 포토샵/a,b 격일 3h 10d 30h 400,000 일러스트/a,b 격일 3h 10d 30h 400,000 디일러 2h 16d 32h 450,000 디일러/a,b 격일 3h 10d 30h 450,000 포토웍스 2h 16d 32h 450,000 포토웍스/a,b 격일 3h 10d 30h 450,000 그래픽아트웍 2h 16d 32h 550,000 그래픽아트웍/a,b 3h 10d 30h 550,000 인디자인 2h 16d 32h 450,000 패키지md(1,2) 2h 16d 32h 2 550,000 패키지md1,2/a,b 격일 3h 10d 30h 2 550,000 인포그라피 2h 16d 32h 550,000 인포그라피/a,b 격일 3h 10d 30h 550,000 브랜딩디자인(1,2) 2h 16d 32h 2 550,000 편집포폴 2h 16d 32h 600,000 편집포폴/a,b 3h 10d 30h 600,000 ai크리에이터 시각편집 격일 2h 8d 16h 600,000 웹 과정명 격일 회당 일수 총시간 개월 수강료 웹(1~4) 2h 16d 32h 4 450,000 웹(1~4)/a,b 격일 3h 10d 30h 4 450,000 ux/ui(1,2) 2h 16d 32h 2 500,000 ux/ui(1,2)/a,b 격일 3h 10d 30h 2 500,000 uxui포폴/a,b 3h 10d 30h 500,000 웹포트폴리오 2h 16d 32h 500,000 ai바이브코딩 웹 금 4h 4d 16h 600,000 ai에이전트 웹/ab 16h 600,000 ai피그마(1,2,3)/a,b 3h 10d 30h 2 500,000 모션영상 과정명 격일 회당 일수 총시간 개월 수강료 시포디(1,2,3,4) 2h 16d 32h 4 600,000 시포디(1,2,3,4)/a,b 격일 3h 10d 30h 4 600,000 에 ix포토샵으로만, 일러스트 보유자는 aix일러스트로만 무상 전환된다. 수강료는 단계(1과목) 기준. 단계 표기가 1~3이면 3개월 연속 수강 시 총액은 단계 수강료 × 단계 수. 구과목 편성은 개편 적용 전까지 위 표를 계속 사용한다. 과정 구조·시수·구과목 매핑 정본은 aix_모듈개편_정본 . 아래 표에 없는 aix 과정의 수강료는 그 문서의 통합로드맵 v1 표를 참조한다(260728 기준: 마케팅영상 24h 50만 · 유튜브 올인원클래스 32h 100만 · 실전 영상편집 24h 50만 · 2d 모션 48h 100만 · 피그마 90h 150만 · 바이브코딩 90h 180만 · 포토 24h 50만 · 일러 24h 50만 · 공간기획&인테리어 설계 48h 90만 · bim 기초 64h 100만 · 공간vr시각화 48h 100만). 웹 과정명 격일 회당 일수 총시간 개월 수강료 aix 에이전트 업무자동화1~3/a,b 격일 2h 8d 16h 3 600,000 aix 이커머스 창업/a,b 격일 3h 8d 24h 600,000 시각편집 과정명 격일 회당 일수 총시간 개월 수강료 aix포토샵 격일 3h 8d 24h 1 500,000 aix일러스트 격일 3h 8d 24h 1 500,000 aix 프라이빗 마케팅 클래스1~2/a,b 격일 2h 8d 16h 2 500,000 aix 패키지&굿즈 제작 실무1~2/a,b 격일 3h 8d 24h 2 500,000 aix 디지털 출판 실무1,2/a,b 격일 2h 8d 16h 2 500,000 aix 브랜딩 디자인 실무1,2/a,b 격일 3h 8d 24h 2 500,000 모션영상 과정명 격일 회당 일수 총시간 개월 수강료 실전 영상편집 클래스/a,b 격일 2h 8d 16h 500,000 2d 모션디자인 클래스(1,2)/a,b 격일 3h 8d 24h 2 500,000 아트웍 과정명 격일 회당 일수 총시간 개월 수강료 aix애니메이션/a,b 격일 2h 8d 16h 600,000 인테리어 과정명 격일 회당 일수 총시간 개월 수강료 aix 3d 모델링 & 렌더링1~3/a,b 격일 3h 8d 24h 3 500,000 bim 기초&aix활용(1~2)/a,b 격일 3h 8d 24h 2 500,000 aix 공간vr시각화(1~2)/a,b 격일 2h 8d 16h 2 600,000 확인 필요 3d 모델링 & 렌더링은 260728 통합로드맵 v1에서 90h·3개월·총 180만(월 60만)으로 표기됐다. 위 표(72h·총 150만)와 시수·총액이 모두 다르므로 견적 발행 전 팀장 확인. 확인 필요 260728 신규 과목 3건이 통합로드맵 v1 표기와 시수·총액이 다르다. 실전 영상편집: 신규 16h(2h×8일) vs 로드맵 24h. bim 기초: 신규 총 48h(24h×2단계) vs 로드맵 64h. 공간vr시각화: 신규 총 32h·120만(16h×2단계, 각 60만) vs 로드맵 48h·100만. 견적·개강안내 발행 전 팀장 확인. 변경 이력(260822): 포토샵·일러스트 구과목(각 40만) → aix포토샵·aix일러스트(각 50만) 확정. 동일과목 전환은 차액 없이 배정게시판 처리, 타과목 전환은 특처 필수(위 전환 규칙 절). 변경 이력(260728): 신규 5과목 추가 → 실전 영상편집 클래스/a,b(2h×8일·50만), 2d 모션디자인 클래스(1,2)/a,b(3h×8일·각 50만), aix애니메이션/a,b(2h×8일·60만), bim 기초&aix활용(1~2)/a,b(3h×8일·각 50만), aix 공간vr시각화(1~2)/a,b(2h×8일·각 60만). 격일 편성은 /a,b 표기(a=월수·b=화목) 기준으로 반영. 변경 이력(260727): aix 디지털 출판 실무/a,b 45만 단일 → 1,2 단계 분할·각 50만(2h×8일). aix 브랜딩 디자인 실무1,2/a,b 각 55만 → 각 50만. 브랜딩 디자인 실무 회당·일수는 사용자 제공 정보에 없어 260727 통합자료(총 48h·2개월) 기준 단계당 24h로 산정. 3h×8일 편성은 확인 필요 ."},"01_안내용자료/용어집.md":{"t":"용어 i></ul>\n<hr>\n<h5>2. 특수처리 프로세스 (중요)</h5>\n<ul><li>\n<strong>재수강(4+1)</strong>: 4개 들으면 1개 무료(재수강권). 조건 되는지 확인\n</li><li>\n<strong>참여 수강</strong>: 미수강을 멘토 재량으로 수강권 지급. 단, 자리가 있어야 배정 가능(제일 아래 순위).\n</li><li>\n<strong>과목 변경</strong>: 차액 좀 할인 넣어서 받으면 상세 처리 내역 기재 필수.\n</li><li>\n<strong>결제 변경</strong>: 결제 수단 변경 시, 재결제 할 때 변경 내역(결제 종류) 및 변경 사유 '상세 기재' 필수.\n</li><li>\n<strong>특수처리 불가 사유</strong>: 학생이 수업 50% 이상 진행 시 배정 변경/환불 불가. 상세 내역 기재 필수. (공제금 관련 질문 필요).\n</li></ul>\n<hr>\n<h5>3. 특수처리 종류 (9가지)</h5>\n<ul><li>\n<strong>배정 변경</strong>: 포토샵① → 포토샵② 등 분반/시간 변경.\n</li><li>\n<strong>과목 변경</strong>: 다른 과목으로 변경.\n</li><li>\n<strong>따즈아 환불/결제 변경</strong>: *주의: 따즈아는 온라인이라 규정이 다를 수 있음.*\n</li><li>\n<strong>재수강/참여수강</strong>: 위 항목 참조.\n</li><li>\n<strong>수강료 변경 + 원서 재등록</strong>.\n</li><li>\n<strong>지점 이동</strong>.\n</li><li>\n<strong>전형 변경</strong>: 입학 전형 등 변경.\n</li><li>\n<strong>이수강 환불</strong>.\n</li><li>\n<strong>중퇴</strong>: 중도 포기.\n</li></ul>\n<hr>\n<h5>4. 기타 행정 및 시스템 주의사항</h5>\n<ul><li>\n<strong>인트라넷</strong>: 현재 인트라넷 관련 업무 불가.\n</li><li>\n<strong>과목명 기재</strong>: 운영부는 과목 정보 모름. 반드시 '인트라넷 기준'으로 과목명 작성할 것.\n</li><li>\n<strong>리마인드</strong>: 기본 행정 업무 팀장님께 다시 물어보기.\n</li></ul>\n<hr>","x":"상태: 2026 02 05 입사 교육 참고자료다. 현행 정본은 위키_원서결제규정 · 위키_특수처리 이고 상충하면 위키가 우선한다 핵심: 할인율은 최대 40%를 넘지 못한다. 온라인 입금과 현금은 현금영수증이 필수다. 네이버 예약 쿠폰과 리뷰 이벤트(5만)는 승인 후 별도 사용이 된다 주의: 본문의 \"인트라넷 관련 업무 불가\"는 작성 당시 상태를 적은 것이다 반드시 팀장님께 행정쪽 기본교육 받을 것 리마인드 미리 배워두면 나중에 이해가 쉬움. 일단 뭐든 물어보고 진행할 것. 행정교육 운영부 결제규정 특수처리 원서작성 1. 원서 작성 및 결제 규정 할인율 제한 : 최대 40% 초과 불가. 쿠폰 사용 : 네이버 예약 쿠폰 / 리뷰 이벤트(5만)는 별도 사용 가능. (승인 받고 진행). 결제 수단별 지침 : 온라인 입금/현금 : 현금영수증 발급 필수. 나이스 가상계좌 : 고객이 직접 현금영수증 발급 신청. 카드 결제 : 카드만 공제금 받고 내역 작성 필. 카드 제외 타 결제수단은 부분 취소 가능함. 입금자 명의 : 최초 입금자/본인 명의만 가능 (아니면 관계 입증 제3자 서류 필수). cod (cash on delivery) 규정 : 원칙적으로 불가, 배정 x. 유효기간: 등록한 주 주말까지. 분납(할부) 규정 : 첫 달에는 분납금만큼의 가격을 가진 1개 과목만 배정 가능. 확인 필요 배정 순서 : 완납 기준 배정. 2. 특수처리 프로세스 (중요) 재수강(4+1) : 4개 들으면 1개 무료(재수강권). 조건 되는지 확인 참여 수강 : 미수강을 멘토 재량으로 수강권 지급. 단, 자리가 있어야 배정 가능(제일 아래 순위). e\">DB는 소화 능력이 전제 · 통화량(일 컨택 시도) = 팀장 재량(강제 아님) · 상세 = M2 §1-5</div>\n</div>\n\n<!-- 컨테스트 -->\n<h4 class=\"sec\">신인 컨테스트 (상담자료 누적 → W7 실시 → W8 완료)</h4>\n<div class=\"contest\">\n  <h3>🏆 교육과정 발표 컨테스트</h3>\n  <div class=\"flow\">\n    <span class=\"step\">상담자료 매주 누적(W2~)</span><span class=\"arr\">→</span>\n    <span class=\"step\">교육과정 1개 선별</span><span class=\"arr\">→</span>\n    <span class=\"step\">발표 / 브리핑(W7 실시)</span><span class=\"arr\">→</span>\n    <span class=\"step\">점수화</span><span class=\"arr\">→</span>\n    <span class=\"step\">완료·시상(W8)</span>\n  </div>\n  <ul>\n    <li><b>재료</b> · 본인 상담자료 매주 1개 + 학과별 주 1개(W3~)가 출품작으로 누적</li>\n    <li><b>점수화(초안)</b> · 과정 이해도 · 상담자료 완성도 · 발표/브리핑 전달력 · 3관(관심·관계) 반영 · 설득력</li>\n    <li><b>활용</b> · 경력전환 판정 근거 + 동기부여(시상) / 선별 풀 = 인트라넷 과정교육 영상 5개(컴자격·아트웍·편집·웹·모션)</li>\n  </ul>\n</div>\n\n<!-- 영상 카탈로그 -->\n<h4 class=\"sec\">인트라넷 교육 영상 카탈로그 — ★ 유익 큐레이션 (총 18개 · 4분류)</h4>\n<div class=\"note\">출처: 신인사원교육.xlsx · <b>JY 유익 큐레이션(2026-06-06)</b> — 전체 44개 중 <b>미운영·중복·비핵심 26개 제외</b>, 꼭 필요한 <b>18개</b>만 시청 · <b>영상교육 1일 1개 시청 + 정리</b>(핵심 3줄 + 상담 포인트 1) · W1~W4 ≈ 18영업일에 완결</div>\n<div class=\"vgrid\">\n  <div class=\"vcat\"><div class=\"vh\"><span class=\"vn\">마케팅</span><span class=\"vc\">2</span></div>\n    <ul><li>마케팅 교육(블로그 마케팅) <span class=\"who\">· 배○○ 팀장 · ▶10,911</span></li><li>🎯 사업부 전체업무 흐름(마케팅→DB→컨택→상담→매출→학생관리)+바이럴 <span class=\"who\">· 이○○ 부장 · <b>W1 필견</b></span></li></ul></div>\n  <div class=\"vcat core\"><div class=\"vh\"><span class=\"vn\">★ 컨택/상담</span><span class=\"vc\">5</span></div>\n    <ul><li>컨택1 기본+구DB <span class=\"who\">· 김○○ 부장</span></li><li>컨택2 어려운문의·대표전화 <span class=\"who\">· 김○○ 원장</span></li><li>상담1 기본+수강료·할인율 <span class=\"who\">· 김○○ 부장</span></li><li>상담2 어려운상담·COD <span class=\"who\">· 이○○ 부장</span></li><li>입시문의 대응 <span class=\"who\">· 경○○ 부장</span></li></ul></div>\n  <div class=\"vcat core\"><div class=\"vh\"><span class=\"vn\">★ 학생관리</span><span class=\"vc\">5</span></div>\n    <ul><li>학생관리 추가등록·친추+클레임 <sp
