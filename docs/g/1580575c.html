25턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 현업 경력 공유 라포 + 카톡 약속·끝인사 화답 <span class=\"mute\">(멘토 25·고객 0턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">여보세요. 여보세요. 아 네. 김○윤님 맞으실까요? 고객: 네.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">네. 아 네. 안녕하세요. 저희 양식기능사 쪽으로 문의 남겨주신 코리아 요리학원입니다. 네. 간단하게 안내차 연락드렸는데 지금 통화 괜찮으실까요? 고객: 네. 괜찮아요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 네, 알겠습니다. 일단은 코리아 요리학원에서 요리 교육 총괄 맡고 있는 ○○○ 멘토라고 하구요. 양식 기능사 문의 남겨주셨는데 어떤 게 궁금하셔서 문의 남겨주신 건지 얘기해 주시면은 제가 그거 토대로 안내 한번 해드릴게요. → 정확한 멘토명, 전화 연락드린 이유, 고객 문의를 확인하는 멘트로 컨택 상담을 정중한 도입부로 시작했습니다. 고객: 아 그 이론 수업이랑 실기 수업이랑 같이 하나요?</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">이미 좀 알아보셨네요? 양식기능사 쪽으로. 일단은 이론 수업은 저희는 따로 안하고요. 아직 양식기능사 필기 취소 안 하신 상태인 거죠. 고객: 네,</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">그러면 혹시 양식 기능사 배워보시려는 목적이 취미, 취업, 창업, 진학 중에 어떤 거에 좀 가까우실까요? 고객: 취업이요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">취업이요. 그럼 제가 몇 가지 한번 여쭤볼 건데 혹시 나이가 어떻게 되시는 거였는지 여쭤봐도 될까요? 고객: 저 21살이요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">21살이시고 네, 네 취업 희망하시는 거면 이쪽으로 배워보시거나 해보신 적이 있으신 걸까요? 고객: 어렸을 때부터 한식을 했었어요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">어렸을 때부터 한식을 하셨다고요? 배워보신 거예요. 고객: 네</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 어 그러면은 좀 전공 하실 실력이나 이런 건 좀 있으신 거네요. → 적극적인 연계 질문으로 고객의 학습 경험도를 구체적으로 파악하려고 하였습니다. 고객: 네, 알겠습니다.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">그래서 일단은 저희는 이론은 따로 수업은 하고 있지 않고 저희 기능사 시험 봐보신 적이 있으신 거예요? 고객: 그 한식은 필기만 보고 실기에서 떨어졌어요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 그래요. 혹시 (시험 관련 추가 질문) → 시험 대비 가능한 요약본 및 온라인 수강권 제공을 안내했습니다. 고객: 네 취업을 희망하시는데 혹시 군대 다녀오셨나요?</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 군대 갔다 와서 취업하려고 고객: 아 그런데 다녀오세요. 미리 좀 준비를 해놓으시려고 하는 건가요?</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">네, 네 어 영장 나오셨어요? 고객: 6월 달이다.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 6월 달에 가세요. 아이고 알겠습니다. 그래서 일단은 기능사 같은 경우에는 그렇게 이론은 그런 식으로 진행되고 실기는 학원에서 직접 수업 진행되고 있어요. 만약에 배워보시게 되면은 생각해보신 일정이 따로 있으신 거예요. 고객: 지금 제가 뭐 하는 게 없어서 일정은 따로 생각 안 해보고</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 지금 따로 뭐 하고 계신 건 아예 없으신 거예요. 그러면은 지금 시간 괜찮으시면은 저도 왜냐면, 군대를 취사병으로 가실 예정인가요? 아 저도 군대를 취사병으로 나왔거든요. 그리고 저도 이제 요리를 했었던 사람이라서 워커힐 호텔에서 10년, 5년 정도 일을 하고 헤드셰프까지 했었던 사람이라서 만약에 취업을 희망하시거나 아니면 이쪽으로 진로를 정하고 싶다라고 하시면은 한번 오셔서 저랑 얘기해 보시는 것도 좋고 사실은 요리학원이잖아요. → 군대 보직 이야기와 쉐프로의 현업 경력(워커힐 호텔 헤드셰프)을 언급하여 고객과의 공감대 형성을 시도한 좋은 예입니다. 고객: 네</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">그래가지고 학원이 이제 위생 상태라던지 아니면 어떤 수업이 있는지 언제가 수업이 괜찮은지 저희가 수업이 막 월화수목금토일 다 있고 아침, 점심, 저녁 다 있거든요. 강의장만 7개가 있는 대형 학원이어서 그래가지고 한번 오셔서 일정이나 이런 것도 맞춰보고 어떻게 준비하면 좋을지도 제가 피드백을 해드릴 수가 있어서 저희 학원이 홍대입구역 2번 출구 옆에 있는 학원인데 혹시 출발하시면은 어느 쪽에 좀 출발하시는 걸까요? → 대면 상담 내용을 미리 예고하여, 고객의 지점 방문을 권유했습니다. 고객: 저 석계역이요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">석계역이요. 네, 네 아 노원 옆에 그쪽 말씀하시는 거 맞죠? 고객: 네 맞아요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">아 아 그러면은 그렇게 오래 걸리진 않네요. 고객: 내일 괜찮으세요?</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">네 내일 괜찮아요. 내일 그러면 오전이랑 오후 중에 언제가 좀 더 편하세요? 고객: 오후가 좀 더 편해요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">오후에 제가 3시에 상담이 비어 있어요. 그때 괜찮으세요? 고객: 네, 네 괜찮아요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">그러면은 제가 이거 학원이 요리학원이어가지고 음식이랑 어린 학생들이 있다 보니까 방문자 등록을 해드려야 되거든요. 제가 이거 지금 전화 끊고 나서 방문자 등록하고 혹시 이 번호로 카카오톡 하시나요? 고객: 네 카카오톡 해요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">카카오톡으로 제 명함이랑 학원 약도 그리고 이제 예약 안내 문자 보내드릴 거고요. 저희 학원 홍대입구역 2번 출구에서 나와서 왼쪽에 있는 바로 큰 건물이고 고층용 엘리베이터 타셔서 15층 올라오시면 저희 15층 전층 다 사용하고 있거든요. → 초행길인 고객을 배려하여 지점 위치를 구체적으로 안내했습니다. 고객: 네</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">거기 인포데스크에 저 ○○○ 멘토님이랑 상담하러 왔다라고 얘기해 주시면은 안내해 주실 거예요. → 첫 방문인 고객을 배려하여 인포데스크 문의 방법을 상세 안내했습니다. 고객: 네, 알겠습니다.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">알겠습니다. 그럼 내일 오후 3시로 제가 방문자 등록해드릴게요. 고객: 알겠습니다.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 경력멘토</div><div class=\"tx\">내일 뵙겠습니다. 고객: 네, 네 1. 정확한 멘토명·소속·연락 이유 안내 → 정중한 도입부로 컨택 상담 시작 2. 학습 목적(취미/취업/창업/진학) 탐색 질문으로 맞춤 상담 기반 마련 3. 적극적인 연계 질문으로 고객의 학습 경험도(한식 경력·기능사 응시 이력) 구체적으로 파악 4. 군대 보직 이야기와 쉐프 현업 경력(워커힐 호텔 헤드셰프)을 공유하여 고객과 공감대 형성 5. 대면 상담 내용 미리 예고(일정·위생·수업 피드백) → 고객의 지점 방문 니즈 제고 6. 대형 학원 특장점(강의장 7개, 월~일·아침~저녁 전 시간대) 자연스럽게 어필 7. 고객 거주지(석계역) 확인 후 방문 거리 부담 해소 8. 내일 오후 3시로 방문 일정 확정 → 바른 마무리 9. 방문자 등록 필요 이유 설명(요리학원 위생·안전) 후 카카오톡으로 명함·약도·예약 문자 발송 안내 10. 초행길 고객 배려 → 지점 위치(홍대입구역 2번 출구, 고층 엘리베이터, 15층) 상세 안내 11. 인포데스크에 담당 멘토명(○○○)으로 문의하는 방법 안내 → 친절한 마무리</div></div></div></div></details>\r\n</section>\r\n<section class=\"panel\" id=\"p6\">\r\n<h4 class=\"sec\"><span class=\"pn\">부록2</span>🗓️ 시기별 영업 스피치 — 방문명분 보강 라이브러리</h4>\r\n<p class=\"intro\">컨택 STEP 5(방문 명분)·STEP 6(클로징)에서 \"<b>지금 이 시기라 더 유리하다</b>\"는 명분을 얹는 카드. 시기(시즌)를 먼저 진단하고 해당 멘트를 뼈대로 변형해 쓰세요. 총 25개 · 컴퓨터강남 영업 스피치 취합본. <span class=\"src s-our\">영업 스피치</span></p>\r\n<div class=\"box warn\"><span class=\"lbl\">★ 사용 원칙</span> 멘트는 낭독 대본이 아니라 <b>뼈대</b>. <b>OO·ㅇ월·40%</b> 등은 실제 과목·월·지원율로 치환. 모든 멘트는 <b>폐쇄형 클로징</b>(방문 약속)으로 끝남 = Part 2 STEP 6와 동일.</div>\r\n<details class=\"season\" open><summary>🗓️ 결산마감 (월말) · 8개<span class=\"sdesc\">월말 접수마감·프로모션·말일 2배 혜택 시즌</span></summary><div class=\"sbody\">\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">1</span><span class=\"skk\">ㅇ월 수업에 대한 접수마감은 ㅇ일까지입니다. 해당 기간내 접수시 추가 혜택 제공 가능</span></div><div class=\"skm\">고객님, 6월 수업 접수 마감이 6월 말일까지인데요! 이 기간 안에 접수해주시면 추가 혜택까지 챙겨드릴 수 있어서요. 혹시 오늘이나 내일 중에 방문 한번 가능하실까요? 마감 전에 미리 자리 잡아두시는 걸 추천드려요!</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">2</span><span class=\"skk\">월말 프로모션: 홈페이지에서 확인하셨는지요? 월말까지 최대 40% 할인 프로모션을 진행 중입니다.</span></div><div class=\"skm\">혹시 홈페이지에서 확인해보셨을지 모르겠는데, 지금 월말까지 최대 40% 할인 프로모션을 진행하고 있어요! 이번 달 안에만 적용되는 혜택이라, 가급적 이 기간에 상담받으시면서 혜택까지 챙기시면 좋을 것 같아 말씀드립니다. 혹시 오늘이나 내일 중에 시간 괜찮으신 날 있으실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">3</span><span class=\"skk\">월말 기간이라 이번 달 배정된 수강지원 혜택을 먼저 소진하고 있는 상황. 월말 안에 방문 상담만 진행하셔도 적용 가능 여부 확인 가능, 방문하셔서 커리큘럼 체크</span></div><div class=\"skm\">지금이 월말이다 보니 이번 달에 배정된 수강 지원 혜택을 먼저 소진하고 있는 상황이에요. 그래서 월말 안에 방문 상담만 진행하셔도 적용 가능한지 바로 확인해드릴 수 있거든요! 오셔서 커리큘럼도 같이 체크해보시면 좋으니, 혹시 오늘내일 중에 잠깐 들르실 수 있으실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">4</span><span class=\"skk\">6월 교육지원금이 남은 상태이기 때문에 방문만 해주시더라도 추가적인 수강료 지원가능</span></div><div class=\"skm\">마침 6월 교육 지원금이 아직 남아 있는 상태라, 방문만 해주셔도 추가로 수강료 지원을 받으실 수 있어요! 이번 달 안에 소진해야 하는 혜택이라 미리 말씀드리는 건데, 혹시 가까운 날짜에 한번 방문 가능하실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">5</span><span class=\"skk\">이전달 문의주신 분들 대상으로 현재 최대지원가능. 최소 30~50%</span></div><div class=\"skm\">지난달에 문의 주셨던 분들 대상으로 지금 최대 30~50%까지 지원이 가능한 상황이에요! 고객님도 해당되셔서 미리 안내드리는 건데, 혜택 적용되는 동안 상담 한번 받아보시는 걸 추천드려요. 혹시 오늘이나 내일 중에 시간 어떠세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">6</span><span class=\"skk\">1월 신년, 2월 설날, 3월 개학 등 월별 컨셉 + 말일 2배 스피치</span></div><div class=\"skm\">매달 그 시기에 맞는 혜택이 있는데요, 예를 들어 1월엔 신년, 2월엔 설날, 3월엔 개학 시즌 프로모션처럼요! 특히 월말, 말일 즈음엔 혜택이 두 배로 커지는 시기라 지금처럼 월말에 결정하시는 게 가장 유리하세요. 혹시 이번 달 가기 전에 상담 잡아드려도 될까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">7</span><span class=\"skk\">어떤 업종이든 월말에는 추가지원이 있다. 우리도 그렇다</span></div><div class=\"skm\">사실 어느 업종이든 월말이 되면 마감 실적 때문에 추가 지원이 들어가잖아요? 저희도 마찬가지라 지금 이 시기에 오시는 분들께 혜택을 더 많이 챙겨드리고 있어요. 그래서 가급적 월말 넘기기 전에 상담받으시는 걸 추천드립니다. 혹시 오늘내일 괜찮으세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">8</span><span class=\"skk\">월말까지 알아보실겸 방문 주시기만 하여도 10% 수강비 지원</span></div><div class=\"skm\">저희가 월말까지 방문해주시는 모든 분들께 10% 수강료 지원을 해드리고 있는데요! 혹시 오늘이나 내일 방문 괜찮으신 날 있으실까요? 가급적이면 혜택 받아가시면 좋을 것 같아 말씀드립니다!</div></div>\r\n</div></details>\r\n<details class=\"season\"><summary>🚪 영업마감 (개강일) · 7개<span class=\"sdesc\">정규 개강일 전후 일주일·잔여석·마지막 등록 타이밍</span></summary><div class=\"sbody\">\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">1</span><span class=\"skk\">매월 정규개강일 기준 일주일 이내 기간 등록시 추가적인 혜택제공</span></div><div class=\"skm\">저희가 매월 정규 개강일 기준으로 일주일 이내에 등록하시는 분들께 추가 혜택을 드리고 있어요! 개강이 얼마 안 남았을 때가 오히려 혜택이 좋거든요. 혹시 이번 개강 맞춰서 시작해보실 생각 있으시면 오늘내일 중에 상담 한번 나오실 수 있을까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">2</span><span class=\"skk\">개강 전 잔여석 할인: 개강 임박 시 잔여석을 할인가로 안내, 다른 과정에도 동일 적용. 최대 30~40%</span></div><div class=\"skm\">지금 개강이 임박해서 남은 잔여석을 할인가로 안내해드리고 있는데요, 최대 30~40%까지 적용돼요! 다른 과정도 동일하게 가능하시고요. 자리가 많지 않다 보니 가급적 빨리 상담받으시는 게 좋은데, 혹시 가까운 날에 방문 가능하실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">3</span><span class=\"skk\">이번 달 등록 마감 전까지 상담 오시는 분들은 개강 일정 우선 배정 가능, 수강료 지원도 최대 00%까지 체크</span></div><div class=\"skm\">이번 달 등록 마감 전에 상담 오시는 분들은 개강 일정에 맞춰 우선 배정을 받으실 수 있고, 수강료 지원도 최대 OO%까지 체크해드릴 수 있어요! 마감 임박이라 자리가 빠듯한데, 혹시 오늘이나 내일 잠깐 상담 시간 내실 수 있으세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">4</span><span class=\"skk\">개강일이 얼마남지 않아 자리마감이 빠르며, 개강전 소진되지 않은 교육지원금으로 선착순 혜택적용</span></div><div class=\"skm\">지금 개강일이 얼마 안 남은 상황이라 자리 마감이 굉장히 빠르게 되고 있어요. 그리고 개강 전에 아직 소진되지 않은 교육 지원금을 선착순으로 적용해드리고 있어서요! 늦으면 혜택도 자리도 놓치실 수 있으니 가급적 오늘내일 중에 상담 나오시는 걸 추천드려요!</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">5</span><span class=\"skk\">방문만 해주시더라도 온라인강의 상품권 지원</span></div><div class=\"skm\">지금은 방문만 해주셔도 온라인 강의 상품권을 지원해드리고 있어요! 부담 갖지 마시고 커리큘럼 구경하러 오신다는 마음으로 들르셔도 좋으니, 혹시 가까운 날에 방문 한번 가능하실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">6</span><span class=\"skk\">개강일 추가모집 / 잔여석 추가할인 / 마지막 등록 너만받는 할인</span></div><div class=\"skm\">개강일 맞춰서 마지막 추가 모집을 하고 있는데요, 잔여석에 한해서 추가 할인까지 들어가요! 정말 마지막 등록 타이밍에만 드리는 혜택이라 이번 기회 놓치시면 다음 개강까지 기다리셔야 하거든요. 혹시 오늘내일 상담 가능하세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">7</span><span class=\"skk\">개강일이 2~3일 남은 시점</span></div><div class=\"skm\">현재 OO과목 개강일이 바로 코앞이다 보니 정원이 거의 다 차서 자리가 빠듯하게 남아 있는 상황인데요! 혹시 가급적이면 오늘, 내일쯤 상담 나오실 수 있을까요? 자리가 확보 안 되면 수업 참여가 어려워서 미리 말씀드립니다!</div></div>\r\n</div></details>\r\n<details class=\"season\"><summary>☀️ 성수기 (방학) · 10개<span class=\"sdesc\">여름·겨울방학 정원 마감·대학생 지원·동반 등록</span></summary><div class=\"sbody\">\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">1</span><span class=\"skk\">비용도 비용이지만 정원제 수업대비 자리 부족 발생 가능. 안전한 자리배정 및 얼리버드 혜택에 따른 추가 혜택 제공</span></div><div class=\"skm\">방학 시즌엔 정원제 수업이다 보니 생각보다 자리가 빨리 차서 부족해지는 경우가 많아요. 그래서 미리 안전하게 자리 배정받으시면 얼리버드 추가 혜택까지 챙겨드리고 있거든요! 혹시 방학 때 수업 생각 있으시면 자리 있을 때 미리 상담 한번 받아보시는 게 어떠세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">2</span><span class=\"skk\">정원 마감 안내: 방학 준비 학생들이 미리 신청, 개강 직전엔 이미 마감 다수. 동반 수강 추천: 함께 공부할 분 있는지 미리 안내</span></div><div class=\"skm\">방학을 준비하는 학생분들이 미리미리 과정을 알아보고 신청하셔서, 정작 개강 직전에 오시면 이미 마감되는 경우가 정말 많아요. 그래서 미리 자리 잡아두시는 걸 추천드려요! 그리고 혹시 함께 공부하실 친구분이 있으시면 같은 스케줄로 등록도 가능하니 같이 오실 분 계실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">3</span><span class=\"skk\">7~9월 방학기간이라 문의 많고, 소수인원 수업이라 잔여석 적음. 빠르게 상담 통해 과정설정 및 일정조율 필요</span></div><div class=\"skm\">지금 7월부터 9월까지가 방학 기간이라 문의가 정말 많은 시기예요. 대부분 소수 인원으로 수업을 진행하다 보니 남은 자리가 얼마 없거든요! 그래서 빠르게 상담을 통해 과정이랑 일정을 먼저 조율해두시는 게 좋은데, 혹시 이번 주 중에 시간 괜찮으신 날 있으실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">4</span><span class=\"skk\">여름방학기간 내 대학생은 학생증 증빙시 대학생 대상 수강료 지원가능</span></div><div class=\"skm\">여름방학 기간엔 대학생 친구분들 대상으로 학생증만 증빙해주시면 별도로 수강료 지원이 가능해요! 혹시 대학생이시라면 이 혜택 꼭 챙기시는 게 좋으니, 방문하실 때 학생증 지참하셔서 상담 한번 받아보시겠어요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">5</span><span class=\"skk\">방학땐 수업만 열면 수강생이 와서 할인이 높지 않다. 방학특강 과목신청 / 친구랑 함께 등록하여 추가할인</span></div><div class=\"skm\">사실 방학 때는 수업만 열어도 수강생이 많이 오는 시기라 할인 폭이 평소보다 크진 않아요. 그래도 방학 특강으로 신청하시거나 친구분이랑 함께 등록하시면 추가 할인을 챙겨드리고 있거든요! 혹시 같이 들으실 분 있으시면 미리 말씀해주세요. 더 좋은 조건으로 안내드릴게요!</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">6</span><span class=\"skk\">지금 안하면 다음학기 또 힘들다</span></div><div class=\"skm\">지금 방학 때 미리 해두지 않으시면 다음 학기 시작되면 또 학업이랑 병행하느라 시간 내기가 훨씬 어려워지세요. 그래서 시간 여유 있는 지금이 사실 제일 좋은 타이밍이거든요! 혹시 이번 방학 안에 시작하시는 걸로 한번 상담받아보시는 게 어떠세요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">7</span><span class=\"skk\">학원 바쁜시기는 여름/겨울방학. 학부모님들 5월부터 미리 알아봄. 컴퓨터 개수에 맞는 인원 모집이라 정원 확보가 중요</span></div><div class=\"skm\">아시겠지만 학원이 가장 바쁜 시기가 여름방학, 겨울방학이에요. 특히 학부모님들은 5월부터 미리 알아보시거든요! 그리고 컴퓨터 학원 특성상 컴퓨터 대수에 맞춰서만 인원을 모집하다 보니 정원 안에 자리 확보해두시는 게 정말 중요해요. 그래서 미리 상담받으시길 추천드리는데 혹시 가까운 날에 시간 되실까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">8</span><span class=\"skk\">공부하기 제일 좋은 시기는 방학 / 휴학 / 휴직 기간. 업무 병행은 한계, 지금이 목표 달성에 좋은 시즌</span></div><div class=\"skm\">사실 공부하기 제일 좋은 시기가 방학이나 휴학, 휴직 기간이에요. 아무래도 업무랑 병행하면서 하기엔 한계가 있다 보니까요! 지금이 목표를 제대로 달성하시기에 가장 좋은 시즌이라 이 기회에 집중해서 끝내시는 걸 추천드려요. 혹시 상담 한번 잡아드려도 될까요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">9</span><span class=\"skk\">매달 프로모션 있지만 1년에 2번 여름/겨울방학 할인혜택이 제일 큼. 그래서 지금 결정해야 하는 이유</span></div><div class=\"skm\">솔직하게 말씀드리면 저희가 매달 프로모션은 진행하고 있어요. 하지만 1년에 딱 두 번, 여름방학이랑 겨울방학 때 할인 혜택이 가장 커요! 그래서 지금이 바로 결정하시기 가장 좋은 시기라고 말씀드리는 거예요. 혜택 클 때 시작하시는 게 이득이니 이번 방학에 맞춰 상담받아보시겠어요?</div></div>\r\n<div class=\"spk\"><div class=\"sk\"><span class=\"skn\">10</span><span class=\"skk\">대학생 방학기간 필요한 과정들 무료특강</span></div><div class=\"skm\">방학 기간엔 대학생분들께 필요한 과정들로 무료 특강도 운영하고 있어요! 부담 없이 들어보시면서 분위기도 보실 수 있으니 혹시 관심 있으시면 일정 안내해드릴게요. 방학 때 시간 여유 있으실 때 한번 참여해보시는 게 어떠세요?</div></div>\r\n</div></details>\r\n</section>\r\n<footer>\r\n  <b>컨택 표준 매뉴얼</b> — 전 영업멘토 공용 · v2 · 2026-06-13<br>\r\n  출처: 우리 18지점 실통화 69건 전수 분석 · CS팀 매뉴얼(정합) · 검증된 영업 연구(SPIN·Gong) · 시기별 영업 스피치 취합(부록2). 원본 불변, 인용·추출만.<br>\r\n  ⚠️ 고객은 이니셜, 직원은 익명 처리. CS팀 PDF 원문은 대외비. 외부 배포 시 컴플라이언스 확인.\r\n  <div class=\"legend\">\r\n    <span><span class=\"src s-our\">우리 69건</span> 척추</span>\r\n    <span><span class=\"src s-keg\">CS 매뉴얼</span> 정합·보강</span>\r\n    <span><span class=\"src s-th\">영업이론</span> 참고</span>\r\n    <span><span class=\"src s-eq\">≡</span> 독립 수렴</span>\r\n    <span><span class=\"src s-sp\">영업 스피치</span> 시기별 명분</span>\r\n    <span><span class=\"src s-no\">⚠️모방금지</span> 위반 사례</span>\r\n  </div>\r\n</footer>\r\n</div></div>\r\n</div>\r\n\r\n","x":"☰ 📞 컨택 표준 매뉴얼 전 영업멘토 공용 · v2 📖 기초·원리 part 0~1 · 왜+삼관 🧭 표준 프로세스 part 2 · step 0~7 💬 멘트·대응·실증 part 3~6 ✅ 자가진단 part 7 🎧 부록1 · 모범 통화 가상 1 + 실제 17 🗓️ 부록2 · 시기별 스피치 결산·개강·성수기 26 우리 69건 척추 · cs 매뉴얼 정합 · 영업이론 참고 영업 스피치 시기별 명분(부록2) 고객=이니셜 · 직원=익명 컨택 표준 매뉴얼 전 영업멘토 공용 · 감이 아니라 데이터 — 우리 18지점 실통화 69건 전수 분석 + cs팀 매뉴얼(정합) 척추 우리 69건 정합·보강 cs 매뉴얼 실측 발화 멘토 74 : 고객 26 → 타깃 6:4 컨택의 목적 = 방문 약속 하나 step마다 ▸ 실제 티키타카 펼쳐보기 ★ 한 장 치트시트 — 이것만 외워도 됩니다 컨택 = 방문 약속 하나. (설명·가격·등록 아님) 발화 멘토 6 : 고객 4 (독백 금지) step 0 사전준비 : 문의 과정·유형 가설 1개 step 1 오프닝 : 본인확인 → 소속+멘토명 → 과정 호명 → 통화허락+질문예고 step 2 파악질문 : \"왜 묻는지\" 깔고 → 목적·신분·동기·취업·툴·일정 step 3 경청 : 한 토막 듣고 되받기 / 설명을 질문으로 쪼개기 step 4 근거·공감 : 공감 선행 → 근거(포폴=절대영역) → 칭찬 step 5 방문명분 : \"전화론 한계, 오시면 정확·유리하게\" (명분 1~2개) step 6 클로징 : 내일/모레 → 오전/오후 → ○시 → 카톡 + 바른마무리(끝인사 화답) step 7 복기 : 다음 통화에서 개선할 1가지 지양: 100%·전원취업·합격률 단정 / 사물존칭(\"되십니다\") / 내부사정 노출 / 국비 적격자 자부담 유도 상세 = part 2(step) · part 3(멘트) · part 6(지양). 자가진단 = part 7. part 0 왜 이 매뉴얼인가 — 권위와 근거 0-1. 컨택의 단 하나의 목적 = \"방문 약속\" 컨택(전화·문자)의 목적은 상품 설명도, 가격 안내도, 등록 성사도 아닙니다. 오직 하나, 고객이 학원에 직접 오기로 약속하게 만드는 것 입니다. 우리 69건 ≡ cs 매뉴얼 우리 멘토 전원이 이미 이렇게 합니다: \"전화로는 감이 안 오실 것 같아요\", \"통화로는 남는 자료가 없으니까\", \"비주얼 커리큘럼·결과물·일정표를 직접 보고 결정하시는 게…\" 우리 69건 cs팀 공식 정의도 동일: \"컨택 상담의 목적 = 고객의 학원 방문 상담 유도.\" cs 매뉴얼 그래서 컨택에서 모든 설명을 끝내려 하면 오히려 진다. \"전화로는 다 못 드린다 → 오시면 정확·유리하게 드린다\" 가 방문을 만든다. 0-2. 이 매뉴얼은 무엇으로 만들어졌나 (출처 3종) 출처 무엇 역할 우리 69건 우리 18지점 실통화 녹취 전수 분석(전 부서) 척추 — 모든 표준의 1차 근거 cs 매뉴얼 전국 사업부 컨택 가이드 + ai 컨택 인사이트 정합·보강 — 회사 표준과 일치 증명 영업이론 spin(3.5만 콜)·gong(2.5만 콜) 등 참고 — 왜 이게 통하는지 이 표준은 누가 시켜서가 아니라, 우리가 실제로 잘하고 있는 것을 데이터로 확인 한 결과다. 그리고 그것이 cs팀 전국 표준과도 1:1로 맞아떨어졌다(독립 수렴 = 신뢰). 0-3. ★ 우리가 가장 먼저 고쳐야 할 한 가지 — 발화 비중 우리 69건을 화자별 글자수로 실측한 결과: 우리 69건 멘토 74 : 고객 26 ← 멘토가 고객보다 약 3배 더 말한다 잘한 컨택조차 멘토 73~76 : 고객 24~27 ← \"잘한\" 통화도 멘토가 압도적으로 많이 말함 즉 우리의 공통 약점은 독백형 설명 이다. 잘하는 멘토조차 말이 많다. 영업 이론 대조 영업이론 : gong — 골든 비율 ≈ 영업자 43 : 고객 57(진짜 차이는 비율 아닌 주고받는 횟수 ) / spin — 성공한 콜은 고객이 더 말한다(영업자가 질문하니까). 타깃 = 멘토 6 : 고객 4. 비율 숫자를 외우라는 게 아니다. 핵심은 ① 질문으로 열기 ② 설명을 질문으로 쪼개 독백 없애기 ③ 고객이 \"사실은요…\"를 꺼내게 하는 것. 우리 69건 영업이론 📚 잠깐 — spin·gong 이 두 이론이 뭔가요? (펼쳐서 근거 확인) ⚠️ 참고용 외부 근거 : 우리 표준은 우리 69건 이 1차 근거다. spin·gong은 \"왜 우리 방식이 통하는지\" 를 외부 검증 연구로 뒷받침할 뿐. 둘 다 결론은 같다 — \"영업자가 말을 줄이고, 질문으로 고객이 말하게 하라.\" 🟦 spin selling — 질문의 순서 이론 닐 라컴(neil rackham)이 실제 영업 통화 3.5만 건 을 분석해 만든 이론(책 『spin selling』, 1988). 핵심 발견: 성공한 통화일수록 고객이 더 많이 말한다 — 영업자가 질문을 잘 던지기 때문. spin = 질문 4단계의 머리글자. 우리 step과 거의 1:1로 겹친다. 단계 무엇 우리 매뉴얼 대응 s — situation 상황 \"지금 학생이세요, 구직 중이세요?\" step 2 파악 질문 p — problem 문제 \"혼자 배우려니 어디서 막히세요?\" step 2~3 관심 끌어내기 i — implication 시사 \"그렇게 1년 더 흐르면 어떨까요?\" 방문 명분 만들기 n — need-payoff 해결보상 해결되면 좋은 점을 고객 입으로 가치 인식 → 방문 약속 교훈: 정보를 쏟아붓지(독백) 말고 , 질문 순서로 고객이 스스로 필요를 말하게 하라. 🟩 gong — 말하기 비율 의 데이터 gong.io = 미국의 영업 통화 분석 ai 회사. 실제 콜 2.5만 건+ 을 분석한 실측 통계 (이론서가 아님). 골든 비율 ≈ 영업자 43 : 고객 57 — 성공한 통화의 평균 말하기 비중. 영업자가 덜 말한다. 단, gong 자신의 결론: 진짜 차이는 비율이 아니라 \"주고받는 횟수\" — 짧게 묻고→듣고→다시 묻는 핑퐁 이 자주 일어나야 한다. 🔗 그래서 우리 \"멘토 6 : 고객 4\"는? 이론치(gong 43:57)는 인바운드+방문예약+국비/가격 안내가 섞인 우리 컨택엔 너무 고객 쪽 → 비현실적. 우리 실측(멘토 74~76:고객 24~26)은 멘토 독백 과다. 그래서 타깃 6:4 = 두 극단의 중간 . 핵심은 숫자가 아니라 독백 제거 = gong의 \"주고받는 횟수 늘리기\"와 같은 결론. 한 줄 요약 — spin 은 \"질문을 이 순서로 던져라\"(방법), gong 은 \"그러면 고객이 더 말하고 그게 계약으로 이어진다\"(데이터 증명). 둘 다 우리의 \"독백 말고 질문으로 쪼개라\" 를 외부에서 보증한다. part 1 삼관(三關) 프레임 — 관심 → 관계 → 관리 모든 컨택·상담을 관통하는 메타 프레임. 우리 69건 관(關) 무엇 컨택에서 관심 왜·무엇·상황을 알려는 마음. 질문으로 고객의 솔직한 이야기 (\"사실은요 제가…\")를 끌어냄 ★ 컨택의 무대 관계 그 이야기에 근거·공감으로 답하며 트는 신뢰의 싹 ★ 컨택의 무대 관리 등록 이후 사람을 함께 끌고 가는 단계 컨택 아님(나중) 1-1. 컨택의 무대 = \"관심 → 관계\" 두 단계뿐 관리는 제일 나중(등록 이후). 컨택에서 관리까지 가려 하면 부담만 준다. 컨택이 할 일: 질문으로 이야기를 끌어내고(관심) → 근거·공감으로 신뢰를 만들고(관계) → \"방문해야 할 이유 + 오면 얻을 게 있다\"는 인식을 심어 → 방문 약속. 1-2. 발화 리듬 — 독백 금지, 설명을 질문으로 쪼개기 관심·관계는 질문으로 굴러간다. 국비·가격 같은 긴 설명이 나올 때가 독백 위험 구간. 한 토막 말하고 → \"이런 상황 맞으세요?\" 로 되받고 → 다음 토막. 고객이 \"사실은요…\" 를 꺼내면 잘 가고 있는 것. 우리 69건 영업이론 part 2 ★ 표준 프로세스 — 8블록 (사전준비 step 0 + 7단계) 이게 우리 컨택의 기본형. 우리 69건이 예외 없이 이 골격으로 흐르고, cs팀 공식 가이드(도입→탐색질문→과정안내→방문확정→마무리)와 구조가 1:1로 일치 한다. 우리 69건 ≡ cs 매뉴얼 멘트는 토씨가 아니라 골격 으로 익힌다(낭독 x). 0 사전 준비 (통화 전 30초) db에서 문의 과정·유입경로·연령대·시간 을 보고 어떤 유형일지 가설 1개. (어떤 화법으로 갈지 미리 정함) 우리 69건 오프닝에서 과정명을 곧장 부르려면 이 준비가 있어야 한다. ❌ 정보덤프형 — 준비 없이 전화 → 고객이 \"일정 어떻게 돼요?\" 물으면 끌려다니며 정보만 나열. ☐ 문의 과정·유형 가설 1개를 갖고 전화를 거는가? 1 오프닝 첫 30초 — 도입 4요소 ①본인확인 \"안녕하세요, ○○님 맞으실까요?\" ②소속+즉시성 \"방금 문의 주신 sbs아카데미 컴퓨터아트학원 ○○ 멘토입니다.\" ③과정 호명 \"[모션 포트폴리오 / 실내건축 자격증]으로 문의 주셨네요.\" ④통화허락+질문예고 \"잠깐 통화 괜찮으세요? 정확히 안내드리려 몇 가지만 여쭤볼게요.\" 우리 69건 오프닝 표준문형(거의 토씨까지 동일) / cs 매뉴얼 도입 = 첫인사·수신자 확인·소속/성명·용건·통화 가능. 우리 69건 ≡ cs 매뉴얼 ✅ 모범 \"남겨주신 내용 보니 ○○ 고민이 크신 것 같아요\"(배경 깔기) ❌ 반면교사 정보덤프형 — 소속·라포 건너뛰고 \"5월 개강 다음 주인데 언제 시작?\" / 소속·멘토명 누락 — cs팀 우수자조차 멘토명을 빠뜨려 cs팀이 지적. 우수자도 빠뜨리는 1순위 실수. cs 매뉴얼 ☐ 소속 + 멘토명 을 말했는가 / 문의 과정을 호명했는가? ▸ 실제 티키타카 보기 (실통화 발췌·순화) 멘토 안녕하세요, 서○○님 맞으실까요? 이전에 저희 sbs 컴퓨터학원에 영상 과정으로 문의 주셨는데, 그때 안내를 못 받으신 것 같더라고요. 혹시 그 뒤로 영상 편집은 좀 공부해 보셨어요? 고객 마음은 있는데 아직 시작은 못 했어요. → 소속·과정 호명 + 즉시성을 한 호흡에, 곧장 질문으로 연결. 우리 69건 진로고민형(13분) 2 파악 질문 (관심) — 6질문 + \"왜 묻는지 먼저\" 가격·과정을 꺼내기 전에 아래 6개로 고객을 먼저 말하게 한다. ★ 질문 목적 먼저 cs 매뉴얼 — 바로 묻지 말고 \"종류가 다양해서, 먼저 몇 가지 확인하고 ○○님 맞춤으로 안내드리려고요.\" 후 질문. cs 매뉴얼 질문 5쌍 cs 매뉴얼 (❌ 바로 묻기 → ✅ 목적 깔고) 항목 ❌ 바로 묻기 ✅ 목적 깔고 묻기 동기 \"알아보시는 이유가 뭐예요?\" \"어떤 방향으로 안내드리면 좋을지, 관심 가지시게 된 계기가 있으실까요?\" 거주지 \"어느 지역 거주하세요?\" \"저희가 ○○역 앞이라 통학 거리실까요? 시간대 안내드리려고요.\" 학년·신분 \"몇 학년이세요?\" \"국비 지원이 학년에 따라 달라서요, 현재 몇 학년 재학 중이세요?\" 툴 숙련 \"컴퓨터 얼마나 다뤄요?\" \"맞는 난이도 안내드리려고요, 컴퓨터 사용 경험 좀 여쭤볼게요.\" 목적 \"목적이 뭐죠?\" \"방향이 달라질 수 있어서요, 취미에 가까운지 진로까지 염두에 두시는지요?\" 우리 6질문 체크리스트 우리 69건 질문 포인트 q1 목적 \"어디에 활용 하려고요?\" (가장 먼저 — 취업/취미/진학/보충) q2 신분·상태 \"학생 / 구직 / 재직 어디세요?\" (지원제도 분기 핵심) q3 동기 \"왜 이 분야를 배우려 하세요?\" (계기 = 공감 포인트) q4 취업 목표 \"취업은 어디까지 알아보셨어요?\" q5 툴 경험 \"다뤄보신 툴 있으세요?\" (언급 툴 중심 전문성) q6 일정 \"언제부터 원하세요?\" (이달→잔여석 / 다음달→1년 시간표) 쿠션어 cs 매뉴얼 : 질문 앞에 \"실례지만 / 괜찮으시다면 / 혹시 / 번거로우시겠지만.\" ✅ 모범 \"과목이 20가지 넘어서 정확한 안내 위해 몇 가지 여쭤볼게요\" 후 목적부터. ❌ 정보덤프형 파악질문 0 → 바로 개강일·내일배움카드·시간표·가격 일방 나열. ☐ 가격·과정 꺼내기 전에 목적부터 물었는가 / \"왜 묻는지\"를 깔았는가? ▸ 실제 티키타카 보기 (실통화 발췌·순화) 멘토 혹시 지금 학생이세요? 고객 대학교는 안 다녀요. 멘토 그럼 영상 편집은 어떤 계기로 관심 갖게 되셨어요? 고객 옛날부터 관심 있었는데 전문적으로 배워보고 싶어서요. 멘토 그렇구나. 그럼 나중에 취업도 생각 있으신 거예요? 고객 하면 좋을 것 같아요. 멘토 현재 나이가 어떻게 되세요? 고객 05년생이요. → 신분 → 동기 → 취업 → 나이. 답을 되짚으며 한 겹씩, 가격·과정 얘기 전에. 우리 69건 진로고민형(13분) 3 경청·티키타카 — 발화 리듬 한 토막 듣고 \"아 그러시구나, 그럼 ~?\" 로 되받는다. 독백 금지. 고객이 \"사실은요…\" 를 꺼내면 잘 가는 것. 우리 69건 국비·가격 긴 설명이 나올 때 → 질문으로 쪼갠다. 공감어 cs 매뉴얼 답을 그냥 받지 마라: 고객 \"○역이요\" → ❌\"아 네.\" → ✅\"오! 저희가 ○번 출구 바로 앞이에요.\" ❌ 정보덤프형 고객이 되물어도 설명만 추가, 질문으로 열지 않음. ☐ 내 독백이 길지 않았나(질문으로 쪼갰나) / 고객이 솔직한 이야기를 꺼냈나? ▸ 실제 티키타카 보기 (실통화 발췌·순화) 멘토 평소 일정은 어떻게 쓰고 계세요? 고객 알바하고 있어요. 멘토 무슨 알바 하세요? 고객 그냥 카페 알바요. 멘토 요즘 카페 알바 들어가기 좀 괜찮아요? 고객 좀 어렵긴 했는데…. 멘토 그렇죠. 저도 옛날에 카페 알바 하려는데, 경력에 바리스타 자격증까지 있어야 한다더라고요. 고객 맞아요. → 과정 얘기로 직진하지 않고 고객 일상으로 들어가 라포. 짧게 주고받으며 독백을 만들지 않음. 우리 69건 진로고민형(13분) 4 근거·공감 (관계) 공감 선행 : \"비전공이 70%세요\" / \"딱 그런 분들 많이 오세요\" → 안심. 우리 69건 근거(챌린저) : \"취업은 포트폴리오가 절대영역이에요. 자격증 몇 개보다 포폴이 좋으면 들어가요\" / \"자격증은 실무 하면 자연히 따라와요.\" 칭찬 : \"미리 준비하시다니 성실하시네요.\" ⚠️ keg 존대어 cs 매뉴얼 사물존칭 금지(\"할인되십니다\"❌→\"할인됩니다\"✅) / 줄임말 금지(\"인강\"❌→\"따즈아 온라인 강의\"✅) / 보장 단정 금지(part 6). ✅ 모범 비전공·전공생 고민에 공감 선행 후 근거 / 자녀 대신 온 고객에 \"스스로 준비하다니 대견하다\" 칭찬 + 부모 안심. ❌ 감정 노출 이전 담당자 짜증 응대로 고객 이탈 → 회복은 \"담당이 저로 변경됐어요, 불편하셨다면 대신 사과드려요.\" ☐ 공감을 먼저 했나 / 사물존칭·보장 단정을 안 썼나? ▸ 실제 티키타카 보기 (실통화 발췌·순화) 고객 자격증도 같이 봐주시나요? 멘토 그럼요. 자격증은 공부하다 보면 자연스럽게 따라와요. 다만 이쪽은 포트폴리오가 절대영역이라, 자격증이 많아도 포폴이 별로면 안 뽑히고, 반대로 포폴이 좋으면 학벌 무시하고 들어가요. 고객 (배우는 것도 돈이 드니까) 돈 좀 모으고 시작하려고요. 멘토 솔직히 말씀드리면, 돈 모아서 오겠다던 분 중에 실제로 온 분이 거의 없었어요. 대학 4년이면 학비만 3,600만 원인데 그 돈을 지금부터 모으긴 어렵잖아요. 오히려 대학을 안 갔으니 그만큼 여유가 있는 거예요. → 공감으로 받은 뒤 챌린저식 근거(포폴=절대영역)·투자가치로 전환. 보장 단정은 쓰지 않음. 우리 69건 진로고민형(13분) 5 방문 명분 + 전환 (전화의 한계) \"유선으로는 한계가 있어서요. 직접 오시면 학생들 포트폴리오 보여드리고 커리큘럼·취업처·준비물까지 하나하나 안내드려요.\" 우리 69건 방문 명분 라이브러리 7종 cs 매뉴얼 (상황 맞는 1~2개) 명분 멘트 커리큘럼 보안 \"커리큘럼이 외부 반출이 안 돼요. 오셔서 직접 보셔야 정확해요.\" 지원금 방문조회 \"지원금은 사람마다 달라서요, 신분증 가져오시면 정확히 조회해 드려요.\" 국비 비교 \"국비 종류가 여러 개라, 방문해서 ○○님께 맞는 걸로 비교해 드릴게요.\" 경험도 진단 \"어느 정도 다루시는지 봐야 기초·심화 어디부터인지 정확해요. 작업물 가져오시면 체크해 드려요.\" 상담 무게 선고지 \"지원제도랑 전반 안내드리다 보니 40분~1시간 정도 걸려요.\" 멘토 경력 \"저도 그쪽 현업이었어서 어떻게 준비하면 좋을지 직접 피드백 드릴게요.\" 현장 가치·마감 \"위생·시설·수업 방식은 오셔야 보여요 / 방학이라 실시간 정원 마감을 같이 확인하셔야 해요.\" ❌ 방문 미클로징 방문 명분 약하게 줘서 고객이 \"알아보고 연락드릴게요\"로 종료. ☐ \"와야 할 이유\"를 1~2개 구체적으로 줬는가? ▸ 실제 티키타카 보기 — ★ 국비전환 고객이익 가드 + 부모 동반 고객 내일배움카드로 들을 수 있는 과정 있던데요. 멘토 내일배움카드 과정은 디자인도 잠깐, 3d도 얕게 배우는 구성이라 취준 목적엔 좀 안 맞아요. 그럼에도 \"저는 내일배움카드로 듣고 싶어요\" 하시면 그 수업이 맞으시고요. \"지원만 되면 다른 수업도 괜찮아요\" 하시면, 국민취업지원제도로 월 60씩 6개월 360만 원 환급받으면서 전문 과정을 거의 무료에 가깝게 들으실 수 있어요. 멘토 오셔서 두 커리큘럼이랑, 학생들이 만든 포트폴리오를 직접 눈으로 보고 판단하시는 게 빨라요. → ★ 적격자를 막지 않고(\"국비 원하면 그 수업이 맞다\") + 고객 손익(환급)으로 비교 → 방문. = part 3-1 국비전환 4스텝 가드의 실증. 우리 69건 국비전환(3d모션, 18분) 멘토 상담은 비용이 들지 않으니, 괜찮으시면 부모님과 같이 오셔서 한번 받아보시는 건 어때요? 그 과정에서 부모님이 \"이 정도는 도와줄게\" 하실 수도 있잖아요. → 진로고민형엔 \"부모 동반 + 비용 없음\"이 자연스러운 방문 명분. 우리 69건 진로고민형(13분) 6 방문 약속 — 폐쇄형 클로징 + 바른 마무리 결제가 아니라 \"방문 약속\"이 목표. 열린 질문 x → 양자택일 로 좁힌다. 우리 69건 ≡ cs 매뉴얼 ①날짜 \"내일이나 모레 중 언제가 편하세요?\" ②시간대 \"오전·오후 중엔요?\" → \"그럼 내일 저녁 8시 / 모레 7시 중 어떠세요?\" ③확정+카톡 \"○시로 잡아드릴게요. 통화 끝나면 예약 문자·약도·명함 카톡으로 보내드려요.\" 실패 회복 \"혹시 짧게라도 어려우실까요? 방문하셔야 커리큘럼·할인을 제 권한으로 더 챙겨드릴 수 있거든요.\" → 안 되면 \"번호 남겨둘 테니 필요할 때 연락 주세요\"(관계 유지). ★ 바른 마무리 — 끝인사 ≠ 끝, 상담의 완성 cs 매뉴얼 ▶ 방문 예정 (5단) ▶ 방문 거절 (4단) ① \"○월 ○일 ○시 방문 예정으로 예약 도와드렸습니다.\" ① \"고민해보시고 궁금하시면 언제든 편하게 연락주세요.\" ② \"일정·위치는 카톡으로 남겨드릴게요, 확인 답장 한 번만.\" ② \"추후 프로모션·일정 변동 있을 때 연락드려도 괜찮으실까요?\" ③ \"○층 인포데스크에 성함만 말씀해주시면 됩니다.\" ③ \"오늘 문의주신 과정 정보 사이트를 카톡으로 남겨드릴게요.\" ④ \"방문하신 분께 드리는 혜택도 그 날 함께 안내드릴게요.\" ④ \"문의 주셔서 감사드리고, 좋은 하루 보내세요.\" ⑤ \"그럼 ○시에 뵙겠습니다. 조심히 오세요, 좋은 하루 보내세요.\" — 끝인사 화답(공통) 내가 끝인사를 건넸어도 고객이 되이어 건네는 끝인사에 화답 하고, 고객이 끊을 때까지 기다린다(먼저 끊지 않기). ❌ 정보만 안내만 하고 \"고민해보시고 연락주세요\"로 마무리 → 약속 못 잡음. ☐ 양자택일로 약속을 잡았나 / 끝인사 화답하고 카톡을 약속했나? ▸ 실제 티키타카 보기 — 양자택일·유연 대응·카톡·배웅·인포데스크 멘토 금요일 오전·오후 중엔 언제가 편하세요? 고객 오후가 괜찮아요. 멘토 그럼 17일 오후 2시 어떠세요? 고객 네 괜찮아요. 멘토 당일 바로 결정하시는 건 추천 안 드려요. 모르던 얘기를 듣고 고민이 필요하실 테니, 편하게 오셔서 평소 만들어보고 싶던 영상 같이 보면서 얘기해요. → 양자택일로 시간 확정 + \"당일 결정 안 하셔도 된다\"로 부담 제거(오히려 신뢰). 고객 혹시 저 혼자라도 가서 상담받을 수 있나요? 멘토 그럼요. 먼저 혼자 오셔서 상담하시고, 결심 서면 부모님과 2차 방문하셔도 돼요. → 조건이 막히면 더 쉬운 방문으로 길을 열어 약속 유지. 멘토 카톡으로 명함·약도·방문 일정·캘린더 보내드릴게요. 변경 필요하시면 편하게 연락 주세요. 이번 주 알바 처음 시작하셨는데 잘 마무리하시고, 금요일 2시에 뵐게요. 좋은 하루 되세요. → 카톡 풀세트 약속 + 고객 근황을 챙기는 따뜻한 배웅. 우리 69건 진로고민형(13분) 멘토 (다른 통화) 고층 엘리베이터 타고 ○층 올라오셔서, 인포데스크에 상담 예약하셨다고 성함만 말씀해주시면 안내해 드릴게요. → 초행 고객 배려한 인포데스크 안내가 cs팀 우수컨택 채택 포인트. cs 매뉴얼 익명 우수컨택 7 복기 (성장) 통화 끝나고 30초 자가점검(권장): 발화 6:4였나 / 6질문 빠뜨림 / 양자택일 했나 / 바른마무리 화답했나. 우리 69건 다음 통화에서 개선할 1가지만 정한다. ★ 한눈: 소속·멘토명·과정 호명 → (목적 깔고) 질문으로 듣기 → 공감·근거 → \"직접 오셔야\" → 양자택일 약속 → 바른 마무리·카톡. 모든 단계가 질문으로 굴러가고, 설명은 잘게 쪼갠다. part 3 멘트 라이브러리 (상황별 즉시 사용) part 2 step 멘트를 상황별로 모은 복사용 카드. 방문명분·양자택일·바른마무리·근거공감은 part 2 그대로 사용. 여기엔 별도 주의가 필요한 4종. 3-1. ★ 국비 → 일반 + 환급 전환 — ⚠️ 고객이익 가드 우리의 가장 강력하면서 오용 시 가장 위험한 패턴. 아래 4스텝 순서·조건을 벗어난 화법은 쓰지 않는다. 우리 69건 스텝 핵심 ① 국비 적격 먼저 확인 \"국비는 구직 청년 대상, 9~6시 월~금 6~8개월 전일제예요.\" → 적격이고 본인이 원하면 막지 않는다. ② 부적합일 때만 일반 \"이미 다루실 줄 알면 기초 6개월은 아까울 수 있어요 / 직장 병행이면 전일제가 어렵죠.\" ③ 고객 손익으로 비교 \"일반은 시간·과목 선택(자부담) + 국민취업지원제도 환급으로 실부담이 줄어요.\" ④ 정확성 병기 \"정확한 금액·자격은 방문 또는 고용센터에서 확인해 드릴게요.\" ⚠️ 위반 국비 적격 고객을 무조건 자부담 일반으로 돌리는 화법 = 고객이익·컴플라이언스 위반 소지. \"고객에게 진짜 유리한 선택\"이 기준. 3-2. 대리문의(부모) — 자녀 보호 프로토콜 실수강자 정보 : \"방문자 체크가 필요해서 자녀분 성함·연락처 여쭤봐도 될까요?\" ⚠️ 자녀 동의 없이 자녀에게 직접 연락하지 않는다. 부모와만 소통. (부모가 \"문자 보내지 마세요\" 하면 존중) 동반 방문 : \"직접 배우실 분이 봐야 정확해서, 함께 오시면 좋아요.\" / 부모 안심 : \"자료는 제가 다 챙겨드릴게요.\" 우리 69건 3-3. 가격 응대 · 3-4. 희소성 가격 : \"원수강료 ○○만원, 지원받으시면 ○○만원대까지요.\" 정확 금액은 \"개인정보라 방문해서 조회.\" 진로고민형엔 투자가치로. 희소성(사실 기반만) : \"예약제로 운영\" / \"자리 마감이 빠른 편\" / \"○○ 이벤트 할인은 기간 한정.\" ⚠️ 없는 마감을 지어내지 않는다. 우리 69건 part 4 대상별 대응 — 심리 3유형 × 현장 5상황 속마음(심리)과 처한 상황은 별개의 축 이라 교차한다 — 같은 시니어라도 진로고민형과 목적뚜렷형은 다르게. 우리 69건 심리 3유형 속마음 대화 키 제도탐색형 \"지원받아 싸게/무료로\" 내일배움카드·환급에 민감 → 정확 안내 + 방문 조회 진로고민형 \"내가 될까, 방향 미정\" 끝까지 경청 → 투자가치·가능성으로 안심 목적뚜렷형 \"이 스킬/자격증을 이 기간에\" 군더더기 없이 적합 과정 → 빠른 방문 확정 현장 5상황 응대 대리문의 자녀 보호 프로토콜(3-2)·동반 방문·부모 안심 시니어/고령 \"나이 정해진 수업 아니에요, 누구나 천천히\" 안심 + 지원금 조회. 취미형은 취업형과 동기 구분 정규·전공 보충 \"학교는 이론, 학원은 실무\" 표준 멘트 ai 과정 문의 우리 69건 인입 급증 — \"클로드로 ppt·엑셀 자동화\"처럼 활용 장면 으로 설명 지인추천·단체 추천인 신뢰 살려 빠른 라포, 동반 방문 유도 ▸ 실제 티키타카 — 시니어/고령 (60대 직장인, 워드·엑셀 기초) 고객 우리는 나이가 있어서 컴퓨터 세대도 아니고… 회사를 옮겼더니 컴퓨터를 안 하면 안 되는 상황이라. 워드·엑셀 기초만 배우면 돼요. 아직 초보야. 멘토 잘하셨어요. ppt·워드·엑셀을 같이 배우는 기초반이 있는데, 난이도도 낮고 1개월이면 다 배우세요. 같은 목적으로 오시는 분들이 많은 반이에요. 고객 시간이 몇 시에 있어요? 멘토 11시 반~1시 반(월~목)이나, 퇴근 후 7~10시 월수금 격일반이 있어요. 어떤 타임이 편하세요? 멘토 컴퓨터를 아직 많이 안 다뤄보셨으니 통화로는 이해가 어려우실 것 같아서, 퇴근 후 한번 방문하셔서 일정표랑 과목 정확히 안내받으시는 걸 추천드려요. → \"같은 분들 많이 와요 / 난이도 낮아요\" 안심 + 시간대 맞춤 + \"통화론 어려우니 방문\" 명분. 우리 69건 시니어(모스, 60대 직장인) ▸ 실제 티키타카 — 대리문의 (부모가 자녀 대신, 자녀 보호 프로토콜) 멘토 어머님 안녕하세요. 자녀분 대신 문의 주신 걸로 확인되는데, 포토샵·디자인 자격증 쪽 희망하시는 걸까요? 고객 네, 처음이라 수업 따라가기 어려워서 기초 좀 배우고 싶대요. 대학교 1학년이에요. 멘토 관련 학과 학생이신가 봐요. 학교에선 체계적으로 안 배우다 보니 과제·팀플 때 많이 힘드셨을 거예요. 고객 네, 그렇대요. 멘토 전공생 실무반이 따로 있어요. 다만 어디까지 만들고 싶은지는 자녀분이 커리큘럼 보고 직접 선택하셔야 해서, 어머님이랑 자녀분이 같이 방문 상담 받으시는 게 좋아요. 멘토 방문자 체크가 필요해서 실수강자(자녀분) 성함·연락처가 필요해요. 자녀분 정보를 함부로 쓰진 않고요. 예약 문자는 어머님께 보내드리면 될까요? → 부모 공감(팀플 힘듦) + \"자녀가 직접 선택해야\" 동반 방문 명분 + 실수강자 정보 확보 + 카톡은 부모께. = part 3-2 자녀 보호 프로토콜 실증. 우리 69건 대리문의(자녀 대신 부모) ▸ 실제 티키타카 — 정규·전공 보충 (광고학과 편입생) 멘토 강남 지점으로 광고 편집·모션그래픽 수강료 조회 남겨주셔서 연락드렸어요. 어떤 과정 필요하신지 여쭤볼게요. 고객 광고 쪽 학과를 이번에 편입으로 들어가게 돼서, 빠르게 습득하려고 학원을 생각 중이에요. 멘토 1학기는 마치셨어요? 고객 1학기 마쳤고 방학 때 습득하려고요. 근데 학교에선 이론 위주로 들어서…. 멘토 전공자들이 방학마다 오는 이유가 그거예요. 학교는 디자인·마케팅 이론 위주라, 정작 프로그램은 학기 중에 유튜브 찾아가며 일일이 해야 해서 답답하거든요. 방학 때 툴 기초부터 잡고 다음 학기 넘어가시는 게 편해요. → \"학교는 이론, 학원은 실무\" — 전공생 보충의 표준 명분. 우리 69건 정규·전공(편입) ▸ 실제 티키타카 — ai 과정 (은퇴 후 취미, 60대) 멘토 ai 에이전트로 문의 남겨주셔서 연락드렸어요. 어떻게 배워보고자 하세요? 고객 요새 ai에 관심 있어서 오픈ai도 해봤는데, 물어보는 걸 잘 물어봐야 답이 나오니까 불편하더라고요. 나이도 많은데 할 수 있나 싶어서요. 멘토 프롬프트 작성법이나, 써보신 ai로 이미지·영상 만드는 수업이 있고요. 이번 달부터 시작하는 ai 에이전트 클로드 수업도 있어요. 저희는 나이대 정해진 수업이 아니라, 컴퓨터 좀 다루시면 충분히 가능해요. 이미 써보셨으니 큰 어려움 없으실 거예요. 멘토 취미로 한번 배워보시는 걸까요? 고객 그렇죠, 이 나이에 사업하려는 건 아니고. 은퇴한 지 2년 됐는데 시간도 많고 뭐 해볼 게 없나 싶어서요. 멘토 쉬시면서 새로 배워볼 일이 거의 없으실 텐데, 이런 거 배우면서 리프레시하면 도움 많이 되실 거예요. 수업이 어떻게 진행되는지, 방향이 맞는지 한번 방문해서 체크해 보시면 좋아요. → ai 불안(\"나이 많은데 가능?\")에 \"나이대 정해진 수업 아니에요·이미 써보셔서 가능\" 안심 + 취미 동기 존중 + \"리프레시\" 공감. = ai 과정 × 시니어 취미 교차. 우리 69건 ai 과정(은퇴 취미) ▸ 실제 티키타카 — 지인추천·단체 (3명 동반) 고객 아까 아침에 전화드렸더니 6시 반에 3명이 같이 가고 싶다고 했는데, 다른 부서에서 연락 준다더니 안 와서 다시 신청했어요. 멘토 제가 전달을 못 받았었네요, 죄송해요. 그럼 세 분 6시 반에 오시는 거죠? 상담 도와드리기 앞서 각 성함이랑 연락처가 필요한데, 어떤 분들이실까요? → 누락된 연락을 사과로 회복 + 동반자 전원 성함·연락처 확보 + 방문 시간 재확정. 우리 69건 지인추천(3명 동반) 교차 예: \"ai 과정 + 시니어 취미형\" = 활용 장면 + 속도·안심 동시. \"제도탐색형 + 대리문의\" = 부모에게 정확 제도 + 자녀 동의 확보. part 5 실증 — 우수 컨택 vs 반면교사 \"같은 상황, 다른 결과\"가 가장 잘 박힌다. 실제 통화(고객 이니셜·직원 익명). 5-1. 우리 우수 컨택 9건 우리 69건 사례(상황) 배울 점 라포·진로고민(13분) 알바·부모지원·돈 고민까지 티키타카로 끌어냄 + 투자가치 전환 국비전환(3d모션, 18분) 국비 vs 일반+환급을 고객 손익으로 비교 후 날짜 확정 대리문의(전산회계) 부모 설득 + 실수강자 정보 + 비대면 등록 검토 시니어(모스/캐드 60대) 컴맹 안심·속도·평생교육지원금 — 취미형 동기 존중 관계·관리(미등록 회수) 월말 할인 + 전액환불 보장 안심 → 즉시 등록 전환 라포·취향 티키타카(9분) 레퍼런스 채널로 라포, \"대졸도 프리미어 못 다뤄요\" 안심 대표전화 즉시 클로징(3분) 방문 의사 인입 → 군더더기 없이 시간 확정(효율) 방문 명분(니즈 맞춤) \"단순 등록 아니라 니즈 맞춰 상담 먼저\" → 포폴 보여주며 방문 ▸ 실제 티키타카 — 까다로운 상황 (즉시 클로징·불만 회복) ① 방문 의사 분명한 인입 — 군더더기 없이 멘토 대표 전화로 영상 편집 과정 문의 주셨는데, 오늘 바로 방문 상담 희망하신다고 전해 들었어요. 맞으실까요? 고객 네네. 멘토 그전에 어떤 영상 편집을 희망하시는지 여쭤봐도 될까요? 고객 영상 편집 배우고 싶어서요. 포트폴리오를 쌓고 싶어서. 멘토 취업 희망이신 거죠? 그럼 오늘 방문은 언제가 편하세요? 고객 8시 반에서 9시쯤 괜찮을까요? 멘토 가능해요. 8시 30분에 뵙고 취업 상담 도와드릴게요. 영상도 유튜브·2d·3d 다양한데 어떤 쪽이세요? → 방문 의사가 분명하면 과잉 설명 x. 목적 한 번 확인 → 바로 시간 확정 → 세부는 그 다음. 우리 69건 대표전화 즉시 클로징(3분) ② 불만 고객 회복 — 감정 분리 고객 저번에 남자분하고 상담했는데, 되게 성의 없이 신경질만 내더라고요. 여기 가면 안 되겠다 생각했어요. 멘토 그러셨구나. 담당자가 저로 변경됐고요. 불편하셨다면 제가 대신 사과드릴게요. 제가 천천히 다시 안내해 드릴게요. → 감정을 분리하고 \"담당 변경 + 대신 사과 + 천천히 재안내\"로 신뢰 회복. ⚠️ 단, 모방 금지 \"전 담당자가 그만뒀다\"는 식의 내부 사정은 말하지 않는다(part 6-3). \"담당이 저로 변경됐어요\"까지만. 우리 69건 극성/불만 회복 ▸ 실제 티키타카 — 고관여·거절 상황 (고액등록·최초거절) ① 고액·장기 과정 — 진지성 확인 + 전문 통찰 멘토 건축 인테리어 과정 문의 주셨는데, 취업·창업이신지 학업 보충이신지 어디에 해당하세요? 고객 취업 목적이요. 지금 산업디자인과 휴학 중이에요. 멘토 산디과 친구들 대부분 제품 디자인으로 많이 빠지는데, 사실 제품·가구보다 더 큰 산업 분야가 인테리어·실내 공간이에요. 취업에 더 유리하려고 넘어오는 경우도 있고요. 혹시 어떤 계기로 인테리어에 관심이 생기셨어요? 고객 제품 쪽은 좀 아닌 것 같고, 인테리어가 그나마 관심이 있어서요. 멘토 진로가 아직 완전히 확정된 상태는 아니시군요. 학교 다니면서 배워본 툴은 있으세요? → 고액·장기 과정일수록 \"어떤 계기로?\"로 진지성을 확인하고, 전공 흐름을 짚는 전문 통찰로 신뢰를 쌓음. 우리 69건 고액등록(인테리어·취업) ② 최초 거절 — 압박 없이 문 다시 열기 고객 원래 바로 따려고 했는데 일정이 생겨서 지금 당장은 준비를 못 할 것 같아 미뤘어요. 멘토 필기는 보셨으니 2년 안에 실기를 보셔야 하는 상황이시죠. 지금 당장 시작 안 하셔도 돼요. 다만 이벤트로 40% 할인이 들어가는데, 수강권을 미리 보유해 두셨다가 원하시는 달에 배정받으실 수 있어요. 취득 못 하시면 재수강 1회권도 포함이고요. → 거절을 존중(지금 안 하셔도 돼요)하면서 \"미리 잡아두면 손해 없다\"는 미래 옵션으로 부담 없이 문을 다시 엶. 우리 69건 최초거절(컴활 실기) 5-2. cs팀 우수 컨택 (익명) cs 매뉴얼 멘토(익명) 배울 점 요리홍대 책임멘토 질문마다 \"왜 묻는지\" 선안내 + 니즈 재확인. 대리문의엔 \"어머님도 당황스러우셨겠어요\" 공감 컴퓨터홍대 책임멘토 a 자격증 종류·시험 일정까지 짚는 전문성 → 신뢰. \"부모님과 상의하셨어요?\" 결정권자 확인 컴퓨터홍대 경력멘토 a 다과목 문의 → 관심 1개로 좁히기. 결석 불안엔 대면·비대면·온라인 3종 보강 컴퓨터홍대 책임멘토 b \"필기는 학원에서 안 해요(공개문제 무료)\" — 정직하게 빼서 오히려 신뢰 요리홍대 경력멘토 본인 현업 경력 공유로 라포 → \"오셔서 저랑 얘기해 보시는 것도 좋고\" 5-3. 반면교사 — 행동 패턴 (사람 아닌 행동을 본다) 패턴명 무엇이 문제 교훈 정보덤프형 목적 파악 없이 개강일·내일배움카드·시간표·가격 일방 나열 step 2 질문으로 열기의 정반대 방문 미클로징 방문 명분 약하게 → \"알아보고 연락\"으로 종료 step 6 양자택일 부재 소속·멘토명 누락 우수자조차 멘토명 빠뜨림 step 1 도입 4요소 끝까지 감정 노출·내부사정 짜증 응대로 이탈 / \"그분 해촉되셔서\" 노출 step 4 + part 6-3 ▸ ❌ 실제 티키타카 — 정보덤프형 (이렇게 하면 안 된다) 고객 일정이 어떻게 될까요? 멘토 5월 개강일이 다음 주에 있는데, 시작하시려는 시기가 어떻게 되세요? 고객 내일배움카드가 된다고 해서 그거 신청한 다음에 하려고요. 멘토 지금 신청 안 하셨어요? 재직자세요? 재직자분들은 내일배움카드 쓰기 어려울 수 있어요, 자부담이 발생해요. 고객 그래도 내일배움카드로 거의 다 된다던데요. 멘토 되긴 하는데 시간만 맞으시면요. 나라에서 지정한 수업을 할지, 일반 수업으로 원하는 시간대에 할지 차이가 있어요. 고객 내일배움카드 시간이 어떻게 되는데요? 멘토 9시 반부터 6시 반, 월~금 나오셔야 하고… ❌ 무엇이 문제였나 고객 첫 질문에 목적·상황 파악이 0 — 왜 배우려는지, 어떤 분야인지 묻지 않고 바로 제도·시간·가격으로 직진. 고객이 캐묻고 멘토는 끌려다니며 설명만 추가. = step 2 \"질문으로 열기\"의 정반대. ✅ 이렇게 했어야 \"어떤 작업에 쓰시려고요? 어떤 계기로 관심 갖게 되셨어요?\"부터 — 목적·상황을 먼저 듣고, 제도·시간은 그 다음에. 우리 69건 안좋은컨택(반면교사) 우리·cs팀 우수자 모두 part 2 step을 그대로 탄다 = 이 표준이 현장 실증과 1:1. 단 우수자도 step 1을 빠뜨릴 수 있으니 도입 4요소는 끝까지. part 6 리스크·컴플라이언스 — 그대로 모방 금지 우수 사례가 많지만, 실제 통화에서 따라하면 안 되는 표현 도 관찰됐다. 정직하게 짚는 것이 곧 우리의 신뢰다. 우리 69건 6-1. 표시광고 — 보장성·단정 금지 ⚠️모방금지 실제 나온 표현: \"포폴 만들면 대부분 취업 다 됩니다\" / \"합격률 82%\" / \"월급 따박따박\" → 취업·합격을 보장하듯 말하지 않는다. 사실·범위 로: \"포트폴리오가 좋으면 취업에 크게 유리해요\", \"준비하시면 자격 취득까지 충분히 가능한 구성이에요.\" 6-2. 제도 안내 — 정확성 + \"확인\" 병기 국취제·실업급여·내일배움카드를 길고 단정적으로 설명하면 부정확 위험. 항상 \"정확한 금액·자격은 방문/고용센터 확인\" 병기. ⚠️ 국비 적격 고객을 자부담 일반으로 돌리는 화법은 컴플라이언스·고객이익 위반 소지(part 3-1 가드). 6-3. 내부 사정·개인정보 일관성 고객 앞에서 직원·조직 사정 노출 금지( \"그분 해촉되셔서…\" → \"담당이 저로 변경됐어요\"까지만). \"통화로 개인정보는 어려워요\"라며 나이·소득을 통화로 캐묻는 명분 불일치 금지. 6-4. keg 존대어·표현 예절 cs 매뉴얼 사물 존칭 금지(\"할인되십니다\"→\"할인됩니다\" / \"있으십니다\"→\"수강하실 수 있습니다\" / \"○만원이시구요\"→\"○만원입니다\"). 줄임말·은어 금지(\"인강\"→\"따즈아 온라인 강의\"). 6-5. 표현 가이드 (권장 어휘) 지양 권장 보장·100%·전원·합격률 단정 유리·충분히 가능·많이들 그렇게 직원/조직 내부 사정 \"담당이 저로 변경됐어요\"까지만 사물 존칭(\"되십니다\") \"됩니다\" ★ 6-6. 실명·사례 사용 규칙 고객 = 이니셜/상황 라벨로만, 식별정보 노출 0. 직원(멘토) = 우리·cs팀 모두 실명 미노출, \"지점+역할\"로만. 반면교사 = 개인 비난이 아니라 행동 패턴 으로(예: \"정보덤프형\"). 사람을 탓하는 게 아니라 행동을 고치는 자료. part 7 숙지·자가진단 (권장) 7-2. 통화 후 자가점검 (권장 5문) 각 통화 뒤 스스로 체크해 보면 좋아요. 체크 상태는 이 브라우저에 저장됩니다. 질문으로 열었나 (목적부터 물었나) 내 독백이 길지 않았나 (6:4 안쪽) 6질문 중 빠뜨린 것은 없었나 양자택일로 방문 약속을 잡았나 바른마무리(끝인사 화답·카톡 약속)를 했나 ↺ 다음 통화용으로 초기화 다 못 했어도 괜찮아요. 다음 통화에서 개선할 1가지 만 정하면 됩니다. 7-3. 우수 ↔ 반면교사 한눈 대조 ✅ 잘한 컨택 ❌ 아쉬운 컨택 관심 질문·경청으로 상황 전체를 들음 목적 확인 전 가격·일정부터 나열 관계 근거·공감으로 신뢰의 싹 대본 낭독·감정 노출 방문 \"와야 할 이유\" + 양자택일 약속 명분 약함 → \"알아보고 연락\" 7-4. 자가진단 퀴즈 (권장 · 답을 누르면 즉시 확인) 부록 ★ 모범 통화 풀 스크립트 (가상·재구성) 앞의 step·티키타카에서 검증된 좋은 멘트만 모아 도입부터 마무리까지 한 통화로 이어 붙인 이상적 흐름 입니다. 특정 실제 통화가 아니라 여러 우수 통화의 좋은 부분을 재구성 한 것 — 토씨가 아니라 흐름 으로 익히세요. (시나리오: 비전공·진로고민 영상 편집 문의) ★ 모범 통화 풀 스크립트 — 도입부터 마무리까지 (가상) ⚠️ 가상·재구성 : 실제 한 통화가 아니라 우수 사례들의 좋은 멘트를 이어 붙인 모범 흐름. 우리 69건 + cs 매뉴얼 step 1 · 오프닝 (도입 4요소) 멘토 안녕하세요, ○○님 맞으실까요? 방금 문의 주신 sbs아카데미 컴퓨터아트학원 ○○ 멘토입니다. 영상 편집 과정으로 문의 주셨네요. 잠깐 통화 괜찮으세요? 정확히 안내드리려 몇 가지만 여쭤볼게요. 고객 네, 괜찮아요. step 2 · 파악 질문 (왜 묻는지 먼저) 멘토 영상 편집 과정이 종류가 다양해서, 먼저 몇 가지 확인하고 ○○님 맞춤으로 안내드리려고요. 혹시 지금 학생이세요, 아니면 구직 중이실까요? 고객 대학은 안 다니고, 일은 아직…. 멘토 그렇구나. 영상 편집은 어떤 계기로 관심 갖게 되셨어요? 고객 옛날부터 관심 있었는데 전문적으로 배워보고 싶어서요. 멘토 좋네요. 그럼 나중에 취업도 생각 있으신 거예요? 다뤄보신 툴은 있으세요? 고객 취업도 하면 좋을 것 같아요. 툴은 거의 없어요. step 3 · 경청·티키타카 (일상으로) 멘토 평소 일정은 어떻게 보내세요? 고객 카페 알바 하고 있어요. 멘토 요즘 카페 알바 들어가기 쉽지 않죠? 저도 옛날에 하려는데 바리스타 자격증까지 있어야 한다더라고요. 고객 맞아요, 좀 어렵긴 했어요. step 4 · 근거·공감 (관계) 고객 안정적인 직업이 좋긴 한데, 배우는 것도 돈이 드니까 돈 좀 모으고 시작하려고요. 멘토 솔직히 말씀드리면, 돈 모아서 오겠다던 분 중에 실제로 온 분이 거의 없었어요. 대학 4년이면 학비만 3,600만 원인데 그 돈을 지금부터 모으긴 어렵잖아요. 오히려 대학을 안 갔으니 그만큼 여유가 있는 거예요. 그리고 이쪽은 비전공이 70% 가까이 돼요, 딱 ○○님 같은 분들이 많이 오세요. 고객 자격증도 따고 싶은데, 그런 것도 봐주세요? 멘토 그럼요. 자격증은 공부하다 보면 자연스럽게 따라와요. 다만 이쪽은 포트폴리오가 절대영역이라, 자격증 많아도 포폴이 별로면 안 뽑히고, 포폴이 좋으면 학벌 무시하고 들어가요. step 5 · 방문 명분 (전화의 한계) 멘토 그래서 ○○님께 어떤 자격증을 딸 수 있고 어떤 방향으로 취업하는지, 학생들이 만든 포트폴리오를 직접 보여드리고 싶어요. 유선으로는 한계가 있어서, 직접 오시면 커리큘럼·취업처·준비물까지 하나하나 안내드려요. 상담은 비용이 들지 않으니 한번 오셔서 보시는 건 어때요? 고객 혹시 내일배움카드 되나요? 멘토 내일배움카드 과정은 취준 청년 대상이라 9시~6시 전일제로 다니셔야 하고 기초부터 시작이에요. 그럼에도 \"국비로 듣고 싶어요\" 하시면 그 수업이 맞으시고요. \"지원만 되면 다른 수업도 괜찮아요\" 하시면 국민취업지원제도로 환급받으며 거의 무료에 가깝게 들으실 수 있어요. 오셔서 두 커리큘럼이랑 학생 포트폴리오 직접 보고 판단하시는 게 "},"99_시스템/01_업무규정/위키_개강안내_상담면담예약.md":{"t":"개강안내 상담면담예약","s":"개강안내는 sbs-notice 양식과 AIX 신과목명 기준을 따르고, 아래 예약 가능 시간은 오영선 개인 운영 규칙이라 다른 멘토에게 적용되지 않는다.","g":["개강안내","상담예약","면담예약","결석","보강","인강보충","재수강권"],"d":"2026-08-22","f":"규정·절차","l":["99_시스템/01_업무규정/위키_특수처리.md"],"h":"<h5>개강안내·상담/면담 예약</h5>\n<p class=\"tags\"><span class=\"tag\">개강안내</span><span class=\"tag\">상담예약</span><span class=\"tag\">면담예약</span><span class=\"tag\">결석</span><span class=\"tag\">보강</span><span class=\"tag\">인강보충</span><span class=\"tag\">재수강권</span></p>\n<h5>개강안내</h5>\n<ul><li>\n개강안내 <span class=\"wl off\">개강안내</span>(260529) 및 sbs-notice 스킬(이모지·불릿 금지, 개강일정 최상단).\n</li><li>\n9월 이후 개강분은 AIX 신과목명·3시간 격일 기준으로 작성한다.\n</li><li>\n<span class=\"wl off\">AIX_커리큘럼개편_260715</span>의 개별 변경(9월 패턴변경·8월 강의장변경)을 대조한다(sbs-notice AIX 섹션, 260716 반영).\n</li><li>\n수강생 문의 응대는 <span class=\"wl off\">AIX개편_문의응대</span>.\n</li></ul>\n<h5>예약 가능 시간 (오영선 개인 운영 · 260804 v1.3)</h5>\n<ul><li>\n아래는 오영선 본인이 정한 예약 그리드이며 팀 규정이 아니다. 다른 멘토는 각자 방식으로 예약을 잡는다.\n</li><li>\n월~금 공통으로 상담=짝수 시 10/14/16/18, 면담=홀수 시 11/13/15/17/19.\n</li><li>\n12시는 점심으로 열지 않고 요일 예외도 없다.\n</li><li>\n그리드 밖 시각은 열지 않는다(당직일만 20시 이후 상황 판단).\n</li><li>\n예약 확정 안내문 양식 <span class=\"wl off\">★ 상담예약 일정안내</span>(260630)·<span class=\"wl off\">면담예약 일정안내</span>(260616) 두 파일은 확정분 복붙 전용이라 가능 시간 블록을 넣지 않는다.\n</li><li>\n시각 정본 <span class=\"wl off\">프로젝트_23팀_정시퇴근_260715</span> &quot;시간 주권 루틴&quot;.\n</li></ul>\n<h5>학생 하네스·결석 보전</h5>\n<ul><li>\n학생 하네스: 안내문 최상단에 손해 보는 조건을 먼저 둔다(sbs-notice, 이정빈 선차감 미독 사례).\n</li><li>\n셀프서비스 허브 <span class=\"wl off\">수강생_필수정보_링크모음</span>를 공지로 고정해 반복 문의를 링크로 리다이렉트한다.\n</li><li>\n개인 사정 결석은 보강이 아니라 인강 자율 보충이 기본.\n</li><li>\n결측분 보전 옵션(최준 팀장 안내 260717): 재수강권 제공(권장) 또는 강사 협의 참여수강(대기 최하 순위, 만석 시 오프라인 불가·비대면 수강).\n</li><li>\n상세 <span class=\"wl off\">feedback_셀프서비스하네스</span>, 참여수강 절차는 <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_특수처리.md\">위키_특수처리</a>.\n</li></ul>","x":"상위: 00_업무위키 개강안내·상담/면담 예약 개강안내 상담예약 면담예약 결석 보강 인강보충 재수강권 한 줄: 개강안내는 sbs notice 양식과 aix 신과목명 기준을 따르고, 아래 예약 가능 시간은 오영선 개인 운영 규칙이라 다른 멘토에게 적용되지 않는다. 개강안내 개강안내 개강안내 (260529) 및 sbs notice 스킬(이모지·불릿 금지, 개강일정 최상단). 9월 이후 개강분은 aix 신과목명·3시간 격일 기준으로 작성한다. aix_커리큘럼개편_260715 의 개별 변경(9월 패턴변경·8월 강의장변경)을 대조한다(sbs notice aix 섹션, 260716 반영). 수강생 문의 응대는 aix개편_문의응대 . 예약 가능 시간 (오영선 개인 운영 · 260804 v1.3) 아래는 오영선 본인이 정한 예약 그리드이며 팀 규정이 아니다. 다른 멘토는 각자 방식으로 예약을 잡는다. 월~금 공통으로 상담=짝수 시 10/14/16/18, 면담=홀수 시 11/13/15/17/19. 12시는 점심으로 열지 않고 요일 예외도 없다. 그리드 밖 시각은 열지 않는다(당직일만 20시 이후 상황 판단). 예약 확정 안내문 양식 ★ 상담예약 일정안내 (260630)· 면담예약 일정안내 (260616) 두 파일은 확정분 복붙 전용이라 가능 시간 블록을 넣지 않는다. 시각 정본 프로젝트_23팀_정시퇴근_260715 \"시간 주권 루틴\". 학생 하네스·결석 보전 학생 하네스: 안내문 최상단에 손해 보는 조건을 먼저 둔다(sbs notice, 이정빈 선차감 미독 사례). 셀프서비스 허브 수강생_필수정보_링크모음 를 공지로 고정해 반복 문의를 링크로 리다이렉트한다. 개인 사정 결석은 보강이 아니라 인강 자율 보충이 기본. 결측분 보전 옵션(최준 팀장 안내 260717): 재수강권 제공(권장) 또는 강사 협의 참여수강(대기 최하 순위, 만석 시 오프라인 불가·비대면 수강). 상세 feedback_셀프서비스하네스 , 참여수강 절차는 위키_특수처리 ."},"99_시스템/01_업무규정/위키_결제안내.md":{"t":"결제안내","s":"입금 계좌는 기업은행 [사내 전용], 예금주 (주)에스씨에이아카데미강남이다.","g":["결제","계좌","계좌번호","결제선생","카드결제","가상계좌"],"d":"2026-08-08","f":"규정·절차","l":["99_시스템/01_업무규정/위키_입사교육본_변경사항.md"],"h":"<h5>결제 안내</h5>\n<p class=\"tags\"><span class=\"tag\">결제</span><span class=\"tag\">계좌</span><span class=\"tag\">계좌번호</span><span class=\"tag\">결제선생</span><span class=\"tag\">카드결제</span><span class=\"tag\">가상계좌</span></p>\n<ul><li>\n계좌: 기업은행 [사내 전용], 예금주 (주)에스씨에이아카데미강남.\n</li><li>\n온라인 카드결제·나이스·계좌이체·키인결제.\n</li><li>\n결제선생은 첨부 확인.\n</li><li>\n멘트 명의는 <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_입사교육본_변경사항.md\">위키_입사교육본_변경사항</a> 참조.\n</li><li>\n정본 <span class=\"wl off\">결제안내+안내멘트</span>(260508).\n</li></ul>","x":"상위: 00_업무위키 결제 안내 결제 계좌 계좌번호 결제선생 카드결제 가상계좌 한 줄: 입금 계좌는 기업은행 064 077190 01 051, 예금주 (주)에스씨에이아카데미강남이다. 계좌: 기업은행 064 077190 01 051, 예금주 (주)에스씨에이아카데미강남. 온라인 카드결제·나이스·계좌이체·키인결제. 결제선생은 첨부 확인. 멘트 명의는 위키_입사교육본_변경사항 참조. 정본 결제안내+안내멘트 (260508)."},"99_시스템/01_업무규정/위키_계열간디비규정.md":{"t":"계열간디비규정","s":"타계열 과목만 언급하면 전환 컨택 금지·즉각 토스이고, 어기면 매출 전액이 타계열로 이관되고 디비 제한 페널티가 붙는다.","g":["계열간","게임계열","타계열토스"],"d":"2026-08-08","f":"규정·절차","l":[],"h":"<h5>계열간 디비규정 (컴퓨터 vs 게임)</h5>\n<p class=\"tags\"><span class=\"tag\">계열간</span><span class=\"tag\">게임계열</span><span class=\"tag\">타계열토스</span></p>\n<ul><li>\n타계열 과목만 언급 시 전환 컨택 금지·즉각 토스.\n</li><li>\n게임행: 기획·프로그래밍·유니티·언리얼·원화·일러스트·웹툰·웹소설.\n</li><li>\n컴퓨터행: CG·영화·영상·인테리어·애니메이션·영상편집·유튜브.\n</li><li>\n양쪽 언급 시 자계열 위주 상담 가능(타계열 비방 절대 금지).\n</li><li>\n마케팅에 타계열 핵심 키워드 금지(언리얼·유니티·게임·웹툰 등).\n</li><li>\n부정 시 매출 전액 타계열 이관 + 디비 제한 페널티(적용판 [확인 필요]).\n</li></ul>","x":"상위: 00_업무위키 계열간 디비규정 (컴퓨터 vs 게임) 계열간 게임계열 타계열토스 한 줄: 타계열 과목만 언급하면 전환 컨택 금지·즉각 토스이고, 어기면 매출 전액이 타계열로 이관되고 디비 제한 페널티가 붙는다. 타계열 과목만 언급 시 전환 컨택 금지·즉각 토스. 게임행: 기획·프로그래밍·유니티·언리얼·원화·일러스트·웹툰·웹소설. 컴퓨터행: cg·영화·영상·인테리어·애니메이션·영상편집·유튜브. 양쪽 언급 시 자계열 위주 상담 가능(타계열 비방 절대 금지). 마케팅에 타계열 핵심 키워드 금지(언리얼·유니티·게임·웹툰 등). 부정 시 매출 전액 타계열 이관 + 디비 제한 페널티(적용판 확인 필요 )."},"99_시스템/01_업무규정/위키_당직규정.md":{"t":"당직규정","s":"당직 지원·변경은 금요일 18시 마감이고, 당직·배정 명단 순번은 매월 바뀌므로 시트를 실시간 확인한다.","g":["당직","주말당직","내사턴","OA턴","추석당직","당직페널티"],"d":"2026-08-21","f":"규정·절차","l":[],"h":"<h5>당직 규정 (영업활동일정표 탭, 월별 갱신)</h5>\n<p class=\"tags\"><span class=\"tag\">당직</span><span class=\"tag\">주말당직</span><span class=\"tag\">내사턴</span><span class=\"tag\">OA턴</span><span class=\"tag\">추석당직</span><span class=\"tag\">당직페널티</span></p>\n<ul><li>\n당직 지원·변경은 금요일 18시 마감.\n</li><li>\n주말 당직 토 09:30~15:00·일 10:00~15:00(연장 ~18:00 각 3명).\n</li><li>\n주말당직은 오전반차·조퇴 불가.\n</li><li>\n지각자는 당직일 디비 전체 제한.\n</li><li>\n당직 지원 후 결근 1차=차주 지원 불가, 2차=추가 페널티(불가피 시 변상돈 부장 보고+증빙).\n</li><li>\n내사턴=전월 총매출 순위, 종료 시 처음부터(네이버예약 포함).\n</li><li>\nOA턴=자격증+회계 과목 분할 배정, 동시유입 시 OA+공식과목=공식·OA+기타=OA.\n</li><li>\n추석 연휴(10월): 3·4·8·9일 근무 09:30~15:00, 추가당직 15~18시(최소 2명).\n</li><li>\n명절 착신전환자 1명은 연휴 대표 중 DB 3개 선택+나머지 순차 배정.\n</li><li>\n당직·배정 명단 순번은 매월 바뀌므로 시트 실시간 확인.\n</li><li>\n당직일 식대 1만원 지급(평일 당직=저녁식대, 주말 당직=점심식대).\n</li><li>\n식대 카드와 영수증은 반드시 인포에 제출. 영수증 상단에 날짜+사용자 이름+식대카드 번호 기재.\n</li><li>\n식대 한도 초과분은 본인 부담.\n</li></ul>","x":"상위: 00_업무위키 당직 규정 (영업활동일정표 탭, 월별 갱신) 당직 주말당직 내사턴 oa턴 추석당직 당직페널티 한 줄: 당직 지원·변경은 금요일 18시 마감이고, 당직·배정 명단 순번은 매월 바뀌므로 시트를 실시간 확인한다. 당직 지원·변경은 금요일 18시 마감. 주말 당직 토 09:30~15:00·일 10:00~15:00(연장 ~18:00 각 3명). 주말당직은 오전반차·조퇴 불가. 지각자는 당직일 디비 전체 제한. 당직 지원 후 결근 1차=차주 지원 불가, 2차=추가 페널티(불가피 시 변상돈 부장 보고+증빙). 내사턴=전월 총매출 순위, 종료 시 처음부터(네이버예약 포함). oa턴=자격증+회계 과목 분할 배정, 동시유입 시 oa+공식과목=공식·oa+기타=oa. 추석 연휴(10월): 3·4·8·9일 근무 09:30~15:00, 추가당직 15~18시(최소 2명). 명절 착신전환자 1명은 연휴 대표 중 db 3개 선택+나머지 순차 배정. 당직·배정 명단 순번은 매월 바뀌므로 시트 실시간 확인. 당직일 식대 1만원 지급(평일 당직=저녁식대, 주말 당직=점심식대). 식대 카드와 영수증은 반드시 인포에 제출. 영수증 상단에 날짜+사용자 이름+식대카드 번호 기재. 식대 한도 초과분은 본인 부담."},"99_시스템/01_업무규정/위키_디비권한규정.md":{"t":"디비권한규정","s":"스틸은 최근 컨택일 포함 15일 경과 시 가능하고, 내사·네이버예약은 모든 권한에 우선하며, 권한 기간은 턴별·지점 내외별로 다르다.","g":["디비규정","권한기간","스틸","생산","토스","내사","네이버예약","컨텍우선순위"],"d":"2026-08-08","f":"규정·절차","l":[],"h":"<h5>디비 권한 규정 (운영계획 시트 정본, 2026-07-15 스캔 + 07-16 재확인)</h5>\n<p class=\"tags\"><span class=\"tag\">디비규정</span><span class=\"tag\">권한기간</span><span class=\"tag\">스틸</span><span class=\"tag\">생산</span><span class=\"tag\">토스</span><span class=\"tag\">내사</span><span class=\"tag\">네이버예약</span><span class=\"tag\">컨텍우선순위</span><span class=\"tag\">디비제한</span></p>\n<ul><li>\n출처: <a href=\"https://docs.google.com/spreadsheets/d/19neak6Cw6EB9TsHKKY7NyTl1o2kvcTVjONSNIbdGORs/edit\" target=\"_blank\" rel=\"noopener\">컴퓨터강남 운영계획 시트</a> (변상돈 부장, 절대 편집 금지·읽기 전용).\n</li><li>\n수치 변동 가능성 있으므로 판정 전 시트 재확인.\n</li></ul>\n<h5>턴별 권한 기간 (지점 내)</h5>\n<ul><li>\n전화안받음 3일\n</li><li>\n재컨택 10일\n</li><li>\n상담완료(미등록) 30일+재컨택 10일\n</li><li>\nCOD 영구\n</li><li>\n등록 영구(수업 종료까지)\n</li><li>\n종강=종강일 포함 30일, 이후 마지막 관리일지 포함 30일\n</li><li>\n중퇴=즉시 상실 후 마지막 컨택일 포함 30일\n</li><li>\n재수강만·국비만 남은 학생=종강생과 동일\n</li><li>\n온강만=COD와 동일\n</li></ul>\n<h5>턴별 권한 기간 (지점 간)</h5>\n<ul><li>\n전화안받음=도착일 포함 3일\n</li><li>\n재컨택=마지막 컨택일 포함 10일\n</li><li>\n상담완료 10일+재컨택 10일\n</li><li>\nCOD 30일+재컨택 10일\n</li><li>\n등록=수업 종료까지 영구\n</li><li>\n종강·중퇴=즉시 상실 후 관리일지 포함 10일\n</li><li>\n온강만=1개월\n</li></ul>\n<h5>핵심 규칙</h5>\n<ul><li>\n스틸은 최근 컨택일 포함 15일 경과 시 가능(개인·추천·수강생목록은 스틸 금지).\n</li><li>\n생산은 유선만 인정(카톡 금지).\n</li><li>\n부정 메모 1차 1주·2차 1개월 디비 제한.\n</li><li>\n내사·네이버예약은 모든 권한에 우선(상담 전 기존 권한자 전달 필수).\n</li><li>\n대표는 수신 2시간 내 기입(퇴근 후 익일 10시).\n</li><li>\n재배정은 당일 19시 내 확인분만(+1시간 유예).\n</li><li>\n토스는 단일 토스턴(증빙+고객 동의 필수).\n</li><li>\n상세 전문은 시트 디비규정 탭.\n</li></ul>\n<h5>컨텍 우선순위 (2026-07-19 최준 팀장 구두)</h5>\n<ul><li>\n① 대표(출처에 수신시각 기재, 예 &quot;대표(16:05:53)&quot;)\n</li><li>\n② 네이버예약\n</li><li>\n③ 출처에 링크가 기재된 DB(수강료조회 팝업류, DB단가 집계 대상)\n</li><li>\n이 3종을 우선 컨텍하고 링크 없는 출처([페이스북Meta]_(국비) 류)는 후순위.\n</li><li>\n상세 <span class=\"wl off\">reference_컨텍우선순위</span>.\n</li></ul>","x":"상위: 00_업무위키 디비 권한 규정 (운영계획 시트 정본, 2026 07 15 스캔 + 07 16 재확인) 디비규정 권한기간 스틸 생산 토스 내사 네이버예약 컨텍우선순위 디비제한 한 줄: 스틸은 최근 컨택일 포함 15일 경과 시 가능하고, 내사·네이버예약은 모든 권한에 우선하며, 권한 기간은 턴별·지점 내외별로 다르다.  class=\"wl off\">00_영업액션판</span>로 분리 유지.\n</li><li>\n카드 규칙 정본 <span class=\"wl off\">00_카드표준양식_v2_260717</span>.\n</li><li>\n과목 개편은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>(9월 시행, 신과목명·시수).\n</li></ul>\n<h5>기록 파일 규칙 (2026-07-20)</h5>\n<ul><li>\n학사일지·면담일지는 학생당 1파일([이름]님 학사일지.md / [이름]님 면담일지.md)로 누적한다.\n</li><li>\nCHANGELOG처럼 날짜 H5 헤더(##### YYYY-MM-DD) 내림차순(최신이 맨 위)으로 기록한다.\n</li><li>\n날짜별 개별 파일은 만들지 않는다(구 개별 파일 10건은 zz_아카이브\\260720_면담일지_병합 보관).\n</li><li>\n날짜 미기입 이관 기록은 [확인 필요] 표기.\n</li></ul>\n<h5>기록 규정 (2026-07-16 확인)</h5>\n<ul><li>\n완납 수강생은 DB창에서 갱신하지 않고 학사일지에만 갱신한다.\n</li><li>\nDB창 갱신 대상은 미완납·COD·컨텍 단계뿐.\n</li><li>\n내사방문·면담일지는 별도 수동 입력이라 기록 분산 주의(sbs-checkin이 4소스 교차 대조로 미기입 검출).\n</li></ul>\n<h5>권한 규정 (2026-07-16 확인)</h5>\n<ul><li>\n권한 상실 시 내 COD·종강 수강생도 공용디비로 전환될 수 있다(계열사 규정 엄격).\n</li><li>\nCOD 잔금 전환·종강 추가등록 제안은 권한기간 안에 해야 하는 시한부 업무.\n</li><li>\n감지는 sbs-checkin이 내수강생목록 이탈·담당 변경으로 수행.\n</li><li>\n권한기간·스틸 기준은 운영계획 시트 디비규정(변상돈 부장, <span class=\"wl off\">00_HOME</span> 외부 링크) 참조.\n</li></ul>\n<h5>학부모·학생 반복 문의 대응 (2026-07-19 신설)</h5>\n<ul><li>\n&quot;지금 뭐 듣고 있어요&quot; 류 문의마다 인트라넷 찾아 카톡 답장하는 반복업무는, 학생별 실시간 수강현황 무설치 웹페이지(진행중·완료·배정대기 상태 + 상단 공지배너)로 대체 가능.\n</li><li>\n학생 카드 데이터 기반으로 제작, 정보 바뀌면 같은 링크로 재발행(URL 유지).\n</li><li>\n이 아이디어는 시간표 웹(navyorca.github.io/timetable-web, 학생별 고정 링크·재배포 시 URL 불변)으로 제품화 완료(sbs-timetable-add 스킬).\n</li><li>\n초기 프로토타입(개강안내_라이브.html 2건)은 260729 정리로 아카이브 이동.\n</li></ul>","x":"상위: 00_업무위키 수강생 관리 체계 (2026 07 16 재편) 수강생db 수강생명단 폴더구조 폴더명 카드양식 cod 가등록 수강현황 라이브페이지 한 줄: 02_수강생관리는 본류·cod·환불·종강·디비 5개 폴더로 나뉘고, 폴더명은 \"이름 연락처4 4 학과 원서번호\"가 필수이며, 수강생 현황 정본은 00_수강생db 하나다. 폴더·카드 구조 폴더 구조: 02_수강생관리 = 본류(등록·재원) / cod(가등록, 수납 0·1만원) / 환불 / 종강(추가등록 후보) / 디비(미등록 컨텍·문의, 파일만·개별 폴더 금지). 폴더명은 \"이름 연락처4 4 학과 원서번호\" 필수(예: 오영선 2897 9816 아트웍 999999, 2026 07 19 v4 개정, 가나다순 조회용). 원서번호 미확보 시 \"원서미정\". 견적 파일 없는 재원 폴더는 맨 끝 \"견적서x\"를 붙이고, 견적서 저장 시 즉시 제거한다. 통합 폴더 금지. 카드 속성 15키+분류(정규/단과/특별관리/추등). 수강생 현황·관리티어(연령대·정규건·특별관리)·보관/디비 특별관리·오프라인 현황판·강의별 역인덱스는 전부 00_수강생db 단일 정본( /위키_조직근무.md\">위키_조직근무</a>).\n</li><li>\n260822 정리: 퇴사자(2026-02 퇴사) 표기는 좌석·명단에서 모두 지웠다.\n</li></ul>\n<h5>통화량 기준</h5>\n<ul><li>\n현행은 260812 공유본이다.\n</li><li>\n기준 30분(팀장 20분, 경력 이상 30분), 상담률 55%·DB단가 50만 자율.\n</li><li>\n당일 상담 3건·매출 400만 면제, 3주차 40% 미만 시 +15분.\n</li><li>\n차감 없음. 260612 변경본의 차감 항목(상담·추가등록 20분, 당일·COD 30분, 배정·대표조 20분, 블로그 15분 최대 2건)은 260812 폐기.\n</li><li>\n구버전 표(260504판 하얀색 50분·빨간색 80분)는 260730 폐기했으므로 통화량 수치는 이 항목이 정본이다.\n</li><li>\n잔여 DB제한 규정은 <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_DB제한내용.md\">양식_DB제한내용</a>.\n</li><li>\n조회 절차는 <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_통화량체크절차.md\">위키_통화량체크절차</a>.\n</li></ul>\n<h5>결제 안내 멘트</h5>\n<ul><li>\n260822 확인: <span class=\"wl off\">결제안내+안내멘트</span> 본문에 퇴사자 명의는 남아 있지 않다. 발송 명의는 오영선으로 쓴다.\n</li></ul>","x":"상위: 00_업무위키 입사 교육본에서 바뀐 사항 (우선 확인) 구버전주의 변경사항 한 줄: 입사 교육본은 구버전이므로 소속 팀(3 3팀)·통화량 기준(2026 06 12 변경본)·결제 안내 멘트 명의 세 가지는 이 문서가 정본이다. 소속 팀 현재 3 3팀(최준 팀장, 오영선/네오). 260817 부서 번호 재배정으로 2 3팀에서 바뀌었다(2개월 주기 부서 순위, 인트라넷 실측 확인). 팀 인원은 최준 팀장·오영선·김은일 3인이다. 인원 변동은 인트라넷 인사 명단으로 확인한다( 위키_조직근무 ). 260822 정리: 퇴사자(2026 02 퇴사) 표기는 좌석·명단에서 모두 지웠다. 통화량 기준 현행은 260812 공유본이다. 기준 30분(팀장 20분, 경력 이상 30분), 상담률 55%·db단가 50만 자율. 당일 상담 3건·매출 400만 면제, 3주차 40% 미만 시 +15분. 차감 없음. 260612 변경본의 차감 항목(상담·추가등록 20분, 당일·cod 30분, 배정·대표조 20분, 블로그 15분 최대 2건)은 260812 폐기. 구버전 표(260504판 하얀색 50분·빨간색 80분)는 260730 폐기했으므로 통화량 수치는 이 항목이 정본이다. 잔여 db제한 규정은 양식_db제한내용 . 조회 절차는 위키_통화량체크절차 . 결제 안내 멘트 260822 확인: 결제안내+안내멘트 본문에 퇴사자 명의는 남아 있지 않다. 발송 명의는 오영선으로 쓴다."},"99_시스템/01_업무규정/위키_전달요청양식.md":{"t":"전달요청양식","s":"강사·학과장 전달과 중도투입은 팀장 경유이고, 팀장 보고는 수강생 이름 / 번호 한 줄로 시작한다.","g":["학사요청","강사전달","학과장전달","중도투입","팀장보고","DB삭제","토스요청","재배정요청"],"d":"2026-08-08","f":"규정·절차","l":[],"h":"<h5>전달·요청 양식 (2026-07-15 신설)</h5>\n<p class=\"tags\"><span class=\"tag\">학사요청</span><span class=\"tag\">강사전달</span><span class=\"tag\">학과장전달</span><span class=\"tag\">중도투입</span><span class=\"tag\">팀장보고</span><span class=\"tag\">DB삭제</span><span class=\"tag\">토스요청</span><span class=\"tag\">재배정요청</span></p>\n<h5>강사·학과장 전달 (팀장 경유)</h5>\n<ul><li>\n아래 양식으로 작성해 팀장님께 전달.\n</li></ul>\n<pre><code>&lt;학과&gt;\n수강생 이름 / 번호 / 담당 멘토\n과목 / 시간 / 강사님 성함\n\n- 내용\n\n- 요청사항</code></pre>\n<h5>팀장 질문·보고 양식 (최준 팀장 지시)</h5>\n<ul><li>\n무엇을 묻든 <code>수강생 이름 / 번호</code> 한 줄, 그 아래 <code>보고드릴 사항 또는 질문</code> 순서로 쓴다.\n</li><li>\n맥락 설명부터 시작하지 않는다.\n</li></ul>\n<h5>중도투입</h5>\n<ul><li>\n중도투입은 학과장 승인 사항이라 팀장께 선보고한다(승인 없이 진행 금지).\n</li><li>\n사유는 &quot;오늘 상담건&quot;이 아니라 &quot;개강 후 상담건으로 중도투입&quot;으로 적는다(2026-07-18 최준 팀장 수정 지시).\n</li><li>\n결석분 보충 방법(인강 자율 보충 등)을 같은 글에 함께 적는다.\n</li><li>\n실제 예시(2026-07-18 이제훈 건, 팀장 수정 반영 후 확정본):\n</li></ul>\n<pre><code>&lt;인테리어학과&gt;\n\n이제훈 / 010-****-**** / 오영선멘토\n과목: 7.18 캐드/6주 09:30 이원준강사님\n\n- 내용:  7월 18일 캐드6주반 개강 후 상담건으로 중도투입학사요청드립니다. 이전 강의는 인강으로 보충하기로 하셨습니다.</code></pre>\n<h5>DB 삭제·토스·재배정 요청 (재배정방)</h5>\n<ul><li>\n필드는 DB창 조회로 채우고 녹취·카톡 캡처 첨부.\n</li><li>\n팀/부장이 재배정방에서 확인 올려주면 그때 DB창에서 삭제 실행.\n</li><li>\n<strong>재배정은 공식 DB만.</strong>\n</li><li>\n유형 3종(삭제 및 토스요청건·재배정 요청·삭제 요청건) 공통 필드: 이름 / 번호 / 유입시간 / 유입과목 / 희망지점 / 담당자 / 디비분류 / 토스진행 고객동의여부 / 컨택 및 특이사항.\n</li><li>\n간단형(줄): <code>이름 / 번호 / 원담당 채널 / 사유(본인아님 등)</code>.\n</li><li>\n삭제·발송은 사용자 실행.\n</li><li>\n상세 <span class=\"wl off\">feedback_DB삭제재배정_양식</span>.\n</li></ul>","x":"상위: 00_업무위키 전달·요청 양식 (2026 07 15 신설) 학사요청 강사전달 학과장전달 중도투입 팀장보고 db삭제 토스요청 재배정요청 한 줄: 강사·학과장 전달과 중도투입은 팀장 경유이고, 팀장 보고는 수강생 이름 / 번호 한 줄로 시작한다. 강사·학과장 전달 (팀장 경유) 아래 양식으로 작성해 팀장님께 전달. <학과 수강생 이름 / 번호 / 담당 멘토 과목 / 시간 / 강사님 성함 내용 요청사항 팀장 질문·보고 양식 (최준 팀장 지시) 무엇을 묻든 수강생 이름 / 번호 한 줄, 그 아래 보고드릴 사항 또는 질문 순서로 쓴다. 맥락 설명부터 시작하지 않는다. 중도투입 중도투입은 학과장 승인 사항이라 팀장께 선보고한다(승인 없이 진행 금지). 사유는 \"오늘 상담건\"이 아니라 \"개강 후 상담건으로 중도투입\"으로 적는다(2026 07 18 최준 팀장 수정 지시). 결석분 보충 방법(인강 자율 보충 등)을 같은 글에 함께 적는다. 실제 예시(2026 07 18 이제훈 건, 팀장 수정 반영 후 확정본): <인테리어학과 이제훈 / 010 / 오영선멘토 과목: 7.18 캐드/6주 09:30 이원준강사님 내용: 7월 18일 캐드6주반 개강 후 상담건으로 중도투입학사요청드립니다. 이전 강의는 인강으로 보충하기로 하셨습니다. db 삭제·토스·재배정 요청 (재배정방) 필드는 db창 조회로 채우고 녹취·카톡 캡처 첨부. 팀/부장이 재배정방에서 확인 올려주면 그때 db창에서 삭제 실행. 재배정은 공식 db만. 유형 3종(삭제 및 토스요청건·재배정 요청·삭제 요청건) 공통 필드: 이름 / 번호 / 유입시간 / 유입과목 / 희망지점 / 담당자 / 디비분류 / 토스진행 고객동의여부 / 컨택 및 특이사항. 간단형(줄): 이름 / 번호 / 원담당 채널 / 사유(본인아님 등) . 삭제·발송은 사용자 실행. 상세 feedback_db삭제재배정_양식 ."},"99_시스템/01_업무규정/위키_조직근무.md":{"t":"조직근무","s":"강남지점은 3부서 9팀이고 본인 소속은 3-3팀 3명(최준 팀장·오영선 경력·김은일 경력, 260817 08월차 계획서 기준), 부서 번호는 2개월 주기 순위로 재배정되므로 항상 최신 계획서를 우선한다.","g":["조직도","부서원","팀구성","종이원서","DB양식시트"],"d":"2026-08-17","f":"규정·절차","l":["99_시스템/01_업무규정/공지_필독_업무총정리.md","99_시스템/01_업무규정/위키_입사교육본_변경사항.md"],"h":"<h5>조직·근무</h5>\n<p class=\"tags\"><span class=\"tag\">조직도</span><span class=\"tag\">부서원</span><span class=\"tag\">팀구성</span><span class=\"tag\">종이원서</span><span class=\"tag\">DB양식시트</span></p>\n<h5>부서 번호 재배정 (260817)</h5>\n<ul><li>\n부서 순위를 2개월마다 매겨 부서 번호를 재배정한다(오영선님 전언 260817). 팀 구성원이 그대로여도 번호가 바뀌므로 번호는 최신 계획서·인트라넷으로 확인한다.\n</li><li>\n본인 팀은 2-3팀 → 3-3팀으로 변경됐다. 인트라넷 실측: 수강생 목록 수당자란 &quot;3-3팀-오영선&quot;, 학사일지 작성부서 &quot;3-3팀&quot;(260817 09:38 조회).\n</li><li>\n종전 3-3팀(신○○ 팀장 팀)은 2-3팀으로 이동했다.\n</li><li>\n아래 260714 명단은 재배정 전 값이라 참고용으로만 남긴다. 현행 명단은 다음 절이 정본이다.\n</li></ul>\n<h5>부서원 현황 (현행, 260817 인사 명단 기준)</h5>\n<ul><li>\n출처: 인트라넷 인사 명단(AIX강남 사업부 재직 31명, 260817 오영선님 제공). 직급은 이 명단이 정본이며, 주차별 매출 목표는 운영계획 시트 매출계획서 탭(08월차, 사이클 08/13~09/14)에서 본다.\n</li><li>\n1-1팀 6명: 변상돈 부장(19-11-21), 김태희 책임(23-02-15), 김수찬(25-02-10)·전민지(25-07-28)·강채림(25-08-01) 경력, 이성구 신인(26-07-06)\n</li><li>\n1-2팀 5명: 천현정 팀장(23-10-23), 백경록 선임(24-04-16), 한태준(26-01-21)·윤화준(26-01-21)·최태선(26-03-16) 경력\n</li><li>\n2-1팀 4명: 이광현 부장(26-02-11), 이건 책임(24-05-07), 이현정(26-03-09)·송은지(26-04-21) 경력\n</li><li>\n2-2팀 4명: 주재규 팀장(21-01-27), 유병주 선임(24-05-13, 계획서상 휴직), 홍세희(24-01-31)·강길언(25-11-21) 경력\n</li><li>\n2-3팀 3명: 신○○ 팀장(22-09-26), 윤전식 경력(26-06-08), 최정윤 신인(26-07-27)\n</li><li>\n3-1팀 3명: 표명길 부장(24-09-19), 공태리 책임(22-07-22, 계획서상 휴직), 라호형 선임(23-12-07)\n</li><li>\n3-2팀 2명: 장원희 팀장(21-12-08), 김범수 경력(24-10-24)\n</li><li>\n3-3팀(본인 팀) 3명: 최준 팀장(23-06-26), 오영선 경력(26-01-26), 김은일(26-06-23, 경력 전환 시행일 26-08-18)\n</li><li>\n3-4팀 1명: 나승호 팀장(26-07-15)\n</li><li>\n팀 수는 9팀이다(구 명단의 10팀에서 변동, 1-3팀 소멸).\n</li><li>\n계획서와 어긋나는 값(직급은 인사 명단 우선): 이건 책임(계획서 경력), 김범수 경력(계획서 선임), 윤화준은 계획서 1-2팀 명단에 줄이 없다.\n</li><li>\n인트라넷 계정명은 동명이인 구분 접미 숫자가 붙는다(최준3·김태희8·전민지5·표명길5 등). 사람 이름으로 쓸 때는 숫자를 뗀다.\n</li></ul>\n<h5>부서원 현황 (2026-07-14 기준, 재배정 전 참고용)</h5>\n<ul><li>\n출처: 컴퓨터강남_매출계획서_2026년07월 2부서.xlsx(작성 표명길 부장), 강남지점 3부서 10팀.\n</li><li>\n인원 변동(퇴사·입사)이 잦아 조직 정보는 항상 최신 문서 우선(오영선님 확인 260716).\n</li><li>\n구버전 문서(공지_필독_업무총정리 등)와 다르면 이 현황이 기준이며, 더 최신 명단이 나오면 이 항목을 교체한다.\n</li><li>\n시트 집계 표기는 35명(경력 30·신입 5)이나 명단 실카운트는 37명(휴직 1 포함).\n</li><li>\n2부서 실인원: 2-1팀 3명, 2-2팀 2명, 2-3팀 3명(260812), 2-4팀 1명(신설) = 총 9명(공태리 책임 휴직 제외, 260716 확인 후 260812 갱신).\n</li><li>\n시트의 2부서 신입 소계 1은 오기 확정(당시 실제 신입 3명).\n</li><li>\n1부서(경력 11·신입 3): 1-1팀 변상돈 부장, 김태희 책임, 김수찬·전민지·강채림 경력, 김건희·이성구 신인 / 1-2팀 천현정 팀장, 한태준·윤화준·백경록·최태선 경력 / 1-3팀 김장현 팀장, 박수봉 신인 (충원예정 2)\n</li><li>\n2부서(실인원 10, 260716 확인): 2-1팀 3명 = 표명길 부장, 라호형 선임, 공윤경 신인 + 공태리 책임 휴직(실인원 제외) (충원예정 1) / 2-2팀 2명 = 장원희 팀장, 김범수 경력 (충원예정 2) / 2-3팀(본인 팀) 3명(260812 기준) = 최준 팀장, 오영선 경력, 김은일 (충원 계획 [확인 필요]) / 2-4팀(신설) 1명 = 나승호 팀장 (충원예정 3)\n</li><li>\n3부서(경력 11·신입 1): 3-1팀 이광현 부장, 이건·이현정·김성곤·송은지 경력 (충원예정 1) / 3-2팀 주재규 팀장, 유병주 선임, 홍세희·강길언 경력 (충원예정 1) / 3-3팀 신○○ 팀장, 김도완 경력, 윤전식 신인 (충원예정 2)\n</li></ul>\n<h5>본인 팀(3-3팀, 구 2-3팀) 변경점</h5>\n<ul><li>\n김은일: 경력 전환 시행일은 2026-08-18이다. 08-17까지는 신인 신분이고, 인사 명단·08월차 계획서의 경력멘토 표기는 전환 예정분이 먼저 반영된 것이다.\n</li><li>\n08월차 계획서상 본인 팀 목표(만원): 최준 2,500 · 오영선 2,500 · 김은일 2,000, 팀 합계 7,000.\n</li><li>\n오영선 주차별 목표: 1주 400 · 2주 600 · 3주 800 · 4주 700.\n</li><li>\n오영선 목표 데이터: 공식문의 50 · 개인문의 5 · 목표문의 55 · 목표상담 30 · 개인광고 10.\n</li><li>\n주차 구분(08월차): 1주차 9일 08/13~08/23 · 2주차 6일 08/24~08/30 · 3주차 6일 08/31~09/06 · 4주차 7일 09/07~09/14.\n</li><li>\n7월차 값(참고): 최준 2500·오영선 2500·김은일 200, 오영선 문의 55·상담 33·개인광고 10.\n</li></ul>\n<h5>근무·작성 원칙</h5>\n<ul><li>\n소속 3-3팀(260817 재배정, 구 2-3팀).\n</li><li>\nDB·상담 작성 원칙: DB 양식 구글시트 수기작성(본인 DB·본인 상담, 나머지 운영부 지원).\n</li><li>\n일지 미작성 시 내사로 이관될 수 있음.\n</li><li>\n종이원서·견적서는 인트라넷 정식 과목명 기재.\n</li><li>\n인트라넷은 전자원 강생_필수정보_링크모음</span>(260716 신설, 공지 2종: 필수정보+강의장별 줌. 장문 카톡 잘림·줌 오입장 대응).\n</li></ul>","x":"상위: 00_업무위키 줌·비대면 줌 줌링크 비대면 강의장링크 필수정보링크 한 줄: 줌링크 정본은 비대면 강의장 줌링크 (260630, 5층 a~h)이고, 비대면 불가 과목(현재 ai마케팅영상)은 개강안내에서 제외한다. 정본 비대면 강의장 줌링크 (260630, 5층 a~h 회의id·비밀번호·url). 비대면 불가 과목은 개강안내 시 제외(현재 ai마케팅영상). 줌링크파일.xlsx(260513)는 구버전. 비대면 강의장 링크 하단 비대면a/b 모순 표는 삭제 완료(c언어·자바·파이썬 미운영 확인, 260716). 수강생 고정 공지용 링크 모음 수강생_필수정보_링크모음 (260716 신설, 공지 2종: 필수정보+강의장별 줌. 장문 카톡 잘림·줌 오입장 대응)."},"99_시스템/01_업무규정/위키_커리큘럼교재.md":{"t":"커리큘럼교재","s":"커리큘럼 링크 정본은 [[커리큘럼 링크모음]], 교재·준비물 정본은 [[교재 및 준비물 안내]]이고, 강남지점은 자바·C언어·파이썬 과정을 운영하지 않는다.","g":["커리큘럼","교재","준비물","교재몰","AIX개편"],"d":"2026-08-08","f":"규정·절차","l":["99_시스템/01_업무규정/위키_DB배정_배대조.md","01_안내용자료/커리큘럼 링크모음.md","01_안내용자료/교재 및 준비물 안내.md"],"h":"<h5>커리큘럼·교재</h5>\n<p class=\"tags\"><span class=\"tag\">커리큘럼</span><span class=\"tag\">교재</span><span class=\"tag\">준비물</span><span class=\"tag\">교재몰</span><span class=\"tag\">AIX개편</span></p>\n<ul><li>\n전산회계·세무 교재는 강사 OT 안내, 색채학·발상과표현은 예제파일 없음.\n</li><li>\n교재몰 고객센터 02-6951-4217.\n</li><li>\n강남지점은 자바·C언어·파이썬 과정 미운영(260716 오영선님 확인) → 해당 문의는 &quot;없는 과목 문의&quot; 절차(<a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_DB배정_배대조.md\">위키_DB배정_배대조</a>: 확인 후 연락, 재배정 요청) 적용.\n</li><li>\nAIX 신과목 교재·수강료는 확정 전 [확인 필요](확답 금지, 확정 시 각 정본에 등재).\n</li><li>\n커리큘럼 링크 정본 <a class=\"wl\" data-doc=\"01_안내용자료/커리큘럼 링크모음.md\">커리큘럼 링크모음</a>(260630).\n</li><li>\n교재·준비물 <a class=\"wl\" data-doc=\"01_안내용자료/교재 및 준비물 안내.md\">교재 및 준비물 안내</a>(260629, kedustore 링크).\n</li><li>\nAIX 개편(9월 시행) 과목명·시수는 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>, 문의 응대 멘트는 <span class=\"wl off\">AIX개편_문의응대</span>(260716 신설).\n</li></ul>","x":"상위: 00_업무위키 커리큘럼·교재 커리큘럼 교재 준비물 교재몰 aix개편 한 줄: 커리큘럼 링크 정본은 커리큘럼 링크모음 , 교재·준비물 정본은 교재 및 준비물 안내 이고, 강남지점은 자바·c언어·파이썬 과정을 운영하지 않는다. 전산회계·세무 교재는 강사 ot 안내, 색채학·발상과표현은 예제파일 없음. 교재몰 고객센터 02 6951 4217. 강남지점은 자바·c언어·파이썬 과정 미운영(260716 오영선님 확인) → 해당 문의는 \"없는 과목 문의\" 절차( 위키_db배정_배대조 : 확인 후 연락, 재배정 요청) 적용. aix 신과목 교재·수강료는 확정 전 확인 필요 (확답 금지, 확정 시 각 정본에 등재). 커리큘럼 링크 정본 커리큘럼 링크모음 (260630). 교재·준비물 교재 및 준비물 안내 (260629, kedustore 링크). aix 개편(9월 시행) 과목명·시수는 aix_커리큘럼개편_260715 , 문의 응대 멘트는 aix개편_문의응대 (260716 신설)."},"99_시스템/01_업무규정/위키_통화량체크절차.md":{"t":"통화량체크절차","s":"판정은 인트라넷 통계관리 → 직원별 통계에서 \"발신\" 구간의 통화시간으로 하고, 면제 여부는 통화량 체크리스트 구글시트(gid=0)에 본인 이름이 있는지로 확인한다.","g":["통화량","직원별통계","녹취","통화면제"],"d":"2026-08-12","f":"규정·절차","l":["99_시스템/01_업무규정/위키_입사교육본_변경사항.md","99_시스템/01_업무규정/위키_DB배정_배대조.md"],"h":"<h5>통화량 체크 절차 (2026-07-16 신설)</h5>\n<p class=\"tags\"><span class=\"tag\">통화량</span><span class=\"tag\">직원별통계</span><span class=\"tag\">녹취</span><span class=\"tag\">통화면제</span></p>\n<ul><li>\n판정용 실측 데이터는 인트라넷 통계관리에서 조회한다.\n</li><li>\n경로: 통계관리 탭 → 직원별 통계 → 날짜 범위 지정 → 팀선택 전체 → 직원선택 본인 이름 → 검색.\n</li><li>\n판정 기준은 &quot;발신&quot; 구간의 통화시간(수신 아님).\n</li><li>\n우측 다운로드 버튼으로 내려받기 가능.\n</li><li>\n녹취·통화이력 원본은 녹취사이트 <a href=\"http://218.54.139.200:8080/\" target=\"_blank\" rel=\"noopener\">http://218.54.139.200:8080/</a> (ID·PW 자동저장, 로그인 팝업 닫고 로그인 버튼)에서 확인.\n</li><li>\n면제 여부는 통화량 체크리스트 구글시트(gid=0)에서 확인하며, 시트에 본인 이름이 있으면 해당 기간 면제(사유·기간 표기).\n</li><li>\n오영선은 2026-07-15~07-19 상담률55% 면제.\n</li><li>\n인트라넷은 반응이 느려 브라우저 자동조작 부적합, 데이터 확보는 수동·붙여넣기로 한다.\n</li><li>\n기준 수치는 통화량 기준(2026-06-12 변경본, <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_입사교육본_변경사항.md\">위키_입사교육본_변경사항</a>) 참조.\n</li></ul>\n<h5>통화량·페널티 기준 (260812 공유본)</h5>\n<ul><li>\n통화량 30분, 차감 없음(팀장 20분, 경력 이상 30분).\n</li><li>\n자율 조건 2종: 상담률 55% 이상, DB단가 50만 이상.\n</li><li>\n판정은 매주 월요일 영업일지 검색 기준으로 한다.\n</li><li>\n면제: 당일 상담 3건 이상, 당일 매출 400만 이상.\n</li><li>\n페널티: 영업 3주차 시작 월요일 영업일지 기준 상담률 40% 미만이면 +15분.\n</li><li>\n부장은 통화량 기준이 없으나 페널티는 적용한다.\n</li><li>\n3주차 40% 미만 인원은 상담률 40% 회복 시점부터 페널티를 삭제한다.\n</li><li>\nDB단가 50만 이상이면 상담률 40% 미만이어도 페널티 없음.\n</li><li>\n모든 기준은 영업일지 주차 기준으로 적용한다.\n</li><li>\n선배정 요건은 <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_DB배정_배대조.md\">위키_DB배정_배대조</a>.\n</li></ul>","x":"상위: 00_업무위키 통화량 체크 절차 (2026 07 16 신설) 통화량 직원별통계 녹취 통화면제 한 줄: 판정은 인트라넷 통계관리 → 직원별 통계에서 \"발신\" 구간의 통화시간으로 하고, 면제 여부는 통화량 체크리스트 구글시트(gid=0)에 본인 이름이 있는지로 확인한다. 판정용 실측 데이터는 인트라넷 통계관리에서 조회한다. 경로: 통계관리 탭 → 직원별 통계 → 날짜 범위 지정 → 팀선택 전체 → 직원선택 본인 이름 → 검색. 판정 기준은 \"발신\" 구간의 통화시간(수신 아님). 우측 다운로드 버튼으로 내려받기 가능. 녹취·통화이력 원본은 녹취사이트 http://218.54.139.200:8080/ (id·pw 자동저장, 로그인 팝업 닫고 로그인 버튼)에서 확인. 면제 여부는 통화량 체크리스트 구글시트(gid=0)에서 확인하며, 시트에 본인 이름이 있으면 해당 기간 면제(사유·기간 표기). 오영선은 2026 07 15~07 19 상담률55% 면제. 인트라넷은 반응이 느려 브라우저 자동조작 부적합, 데이터 확보는 수동·붙여넣기로 한다. 기준 수치는 통화량 기준(2026 06 12 변경본, 위키_입사교육본_변경사항 ) 참조. 통화량·페널티 기준 (260812 공유본) 통화량 30분, 차감 없음(팀장 20분, 경력 이상 30분). 자율 조건 2종: 상담률 55% 이상, db단가 50만 이상. 판정은 매주 월요일 영업일지 검색 기준으로 한다. 면제: 당일 상담 3건 이상, 당일 매출 400만 이상. 페널티: 영업 3주차 시작 월요일 영업일지 기준 상담률 40% 미만이면 +15분. 부장은 통화량 기준이 없으나 페널티는 적용한다. 3주차 40% 미만 인원은 상담률 40% 회복 시점부터 페널티를 삭제한다. db단가 50만 이상이면 상담률 40% 미만이어도 페널티 없음. 모든 기준은 영업일지 주차 기준으로 적용한다. 선배정 요건은 위키_db배정_배대조 ."},"99_시스템/01_업무규정/위키_특수처리.md":{"t":"특수처리","s":"특처는 재수강(4+1)·참여수강·과목변경 3종이고, 채팅에 \"이름+유형\"만 주면 신청서 완성본이 코드블록으로 즉시 나온다.","g":["특처","재수강","참여수강","과목변경","배정변경","댓글배정","종로이관"],"d":"2026-08-19","f":"규정·절차","l":["99_시스템/02_인트라넷양식/양식_특처참고사항.md","99_시스템/02_인트라넷양식/양식_원서작성_결제규정.md"],"h":"<h5>특수처리 (재수강·참여수강·과목변경)</h5>\n<p class=\"tags\"><span class=\"tag\">특처</span><span class=\"tag\">재수강</span><span class=\"tag\">참여수강</span><span class=\"tag\">과목변경</span><span class=\"tag\">배정변경</span><span class=\"tag\">댓글배정</span><span class=\"tag\">종로이관</span></p>\n<h5>유형별 규정</h5>\n<ul><li>\n재수강(4+1): 원서 차수 기준 4과목 수강 시 들었던 과목 중 1과목 재수강 가능(댓글배정).\n</li><li>\n4과목 미충족자가 동일 과목 재수강 신청 시 특처 작성.\n</li><li>\n참여수강: 원서 등록 과목이 아닌 다른 과목 제공은 참여수강 특처(자리 있어야 배정, 최하 순위).\n</li><li>\n과목 변경: 차액에 할인 반영 후 상세 처리내역 기재 필수.\n</li><li>\n절차 참고 <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_특처참고사항.md\">양식_특처참고사항</a>(팀장 전달 파일 참조), 유형 9종·프로세스는 <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_원서작성_결제규정.md\">양식_원서작성_결제규정</a>.\n</li><li>\n관련 원문 PDF: 과목변경특처 참고양식·참여수강 특처 예시·배정변경특처 참고양식·특처 배정제외 양식(99_시스템).\n</li></ul>\n<h5>특처 작성 (2026-07-16 확정)</h5>\n<ul><li>\n채팅에 &quot;이름+유형(배정변경/참여수강/과목변경)&quot;만 주면 클로드가 카드 속성에서 값을 조회해 신청서 완성본을 코드블록으로 즉시 출력.\n</li><li>\n배정변경 경량 건은 특처 없이 댓글배정으로 처리 가능(이서영 사례), 정식 건은 특처 상신(노준하 사례).\n</li><li>\n필드 매핑 정본 <span class=\"wl off\">00_카드표준양식_v2_260717</span>.\n</li></ul>\n<h5>댓글배정 양식 (과목/시간 배정신청)</h5>\n<ul><li>\n필드는 원서번호·학생명·연락처·요청일·캠퍼스(1캠퍼스)·요청.\n</li><li>\n요청 칸과 특처 변경전·변경후 칸은 같은 문구를 쓴다(2026-08-03 오영선님 실사용 예시 확정).\n</li><li>\n기본형 <code>[MM.DD] [과목명/코드] [HH:MM] 배정 → [MM.DD] [과목명/코드] [HH:MM] 배정</code>.\n</li><li>\n변형은 신규 배정(좌변에 재수강·합성포폴 등 권리 근거) · <code>[과목명/코드] 미배정 → ... 배정</code> · 취소 <code>[MM.DD] [과목명/코드] [HH:MM] → 미배정</code> · 단독 요청(따즈아 30일 요청).\n</li><li>\n수강생 카드 본문의 수강정보는 이 양식과 특처 양식에 그대로 옮겨지는 형식으로 쓴다(2026-08-03 오영선님 지시).\n</li><li>\n예시 정본 <span class=\"wl off\">00_카드표준양식_v2_260717#요청·변경 문구 형식</span>, 표기 규칙 정본 <span class=\"wl off\">00_카드표준양식_v2_260717#수강정보 표기 규칙</span>.\n</li><li>\n원본 캡처 99_시스템\\02_인트라넷양식\\과목배정 안뜰때 댓글배정 쓰는 법.png.\n</li></ul>\n<h5>종로이관 학생 재수강 지원 (260819 공지)</h5>\n<ul><li>\n최근 종로에서 넘어온 학생의 재수강 과목 지원은 특처 작성이 아닌 배정창 작성을 통해 처리한다.\n</li><li>\n무분별한 재수강 지원을 확인하는 절차: 운영부에서 해당 학생 종로지점 원서를 체크해 최초 몇 과목을 등록했는지 확인한다.\n</li><li>\n이슈 사항 시 운영부 서룡부장 통해 체크, 그 외 별도 특이사항은 표명길부장 통해 메신저로 전달한다.\n</li><li>\n종로-&gt;강남 지점이동 학생 재수강권 요청은 인트라넷 배정게시판으로 요청하며, 요청 시 '종로 지점이동 학생 재수강권'을 추가 기입한다.\n</li></ul>","x":"상위: 00_업무위키 특수처리 (재수강·참여수강·과목변경) 특처 재수강 참여수강 과목변경 배정변경 댓글배정 종로이관 한 줄: 특처는 재수강(4+1)·참여수강·과목변경 3종이고, 채팅에 \"이름+유형\"만 주면 신청서 완성본이 코드블록으로 즉시 나온다. 유형별 규정 재수강(4+1): 원서 차수 기준 4과목 수강 시 들었던 과목 중 1과목 재수강 가능(댓글배정). 4과목 미충족자가 동일 과목 재수강 신청 시 특처 작성. 참여수강: 원서 등록 과목이 아닌 다른 과목 제공은 참여수강 특처(자리 있어야 배정, 최하 순위). 과목 변경: 차액에 할인 반영 후 상세 처리내역 기재 필수. 절차 참고 양식_특처참고사항 (팀장 전달 파일 참조), 유형 9종·프로세스는 양식_원서작성_결제규정 . 관련 원문 pdf: 과목변경특처 참고양식·참여수강 특처 예시·배정변경특처 참고양식·특처 배정제외 양식(99_시스템). 특처 작성 (2026 07 16 확정) 채팅에 \"이름+유형(배정변경/참여수강/과목변경)\"만 주면 클로드가 카드 속성에서 값을 조회해 신청서 완성본을 코드블록으로 즉시 출력. 배정변경 경량 건은 특처 없이 댓글배정으로 처리 가능(이서영 사례), 정식 건은 특처 상신(노준하 사례). 필드 매핑 정본 00_카드표준양식_v2_260717 . 댓글배정 양식 (과목/시간 배정신청) 필드는 원서번호·학생명·연락처·요청일·캠퍼스(1캠퍼스)·요청. 요청 칸과 특처 변경전·변경후 칸은 같은 문구를 쓴다(2026 08 03 오영선님 실사용 예시 확정). 기본형 mm.dd 과목명/코 /p>\n<h5>보고·기재 절차</h5>\n<ul><li>\n항목: 담당멘토·등록일(최초결제일)·수강생·연락처·수강 전후·등록과정(학과명)·등록금액·공제내역·실환불액·결제수단·중퇴사유(객관적)·참여수강 제공 여부.\n</li><li>\n계좌이체는 계좌·현금영수증 필요(COD 계좌이체 포함).\n</li><li>\n환불일지 팀장 컨펌 후 기재 → 중퇴요청(원서번호·수강생명, 앱 거부) → 중퇴방 게시.\n</li><li>\n정본 양식 <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_환불보고.md\">양식_환불보고</a>(260628), 기재는 <span class=\"wl off\">환불일지</span> 참조.\n</li><li>\n공제·환불 스크립트 <span class=\"wl off\">환불안내 공제금 안내 스크립트</span>.\n</li></ul>\n<h5>결제수단별 부분환불 (260803 오영선님 확인)</h5>\n<ul><li>\n나이스페이·계좌이체는 부분환불이 되므로 공제금을 뺀 차액만 환불하면 되고, 학생에게 공제금을 따로 결제받지 않는다.\n</li><li>\n카드결제만 부분환불이 안 되어 전액 환불 후 공제금을 별도로 받는다.\n</li><li>\n환불 안내 전에 결제수단을 먼저 확인하고, 나이스페이·계좌이체 건에 공제금 결제를 요구하지 않는다.\n</li></ul>\n<h5>사전 방지</h5>\n<ul><li>\n환불은 사전 방지가 전부: 결제 후 15~30분 재상담·영수증 출력·사유 먼저(변상돈 교리, payment-guide).\n</li><li>\n손해 앵커(30% 미만=1/3 공제·50% 이상=환불·배정변경 불가·KEG 할인권 회수)는 멘토 상담용으로 <span class=\"wl off\">feedback_환불방지교리</span> 참조.\n</li><li>\n후속 기한은 이행까지 추적한다(<span class=\"wl off\">feedback_이탈후속추적</span>, 00_영업액션판).\n</li></ul>","x":"상위: 00_업무위키 환불 환불 중퇴 공제 환불일지 환불보고양식 한 줄: 나이스페이·계좌이체는 부분환불이 되어 공제금을 뺀 차액만 환불하고, 카드결제만 부분환불이 안 되어 전액 환불 후 공제금을 따로 받는다. 보고·기재 절차 항목: 담당멘토·등록일(최초결제일)·수강생·연락처·수강 전후·등록과정(학과명)·등록금액·공제내역·실환불액·결제수단·중퇴사유(객관적)·참여수강 제공 여부. 계좌이체는 계좌·현금영수증 필요(cod 계좌이체 포함). 환불일지 팀장 컨펌 후 기재 → 중퇴요청(원서번호·수강생명, 앱 거부) → 중퇴방 게시. 정본 양식 양식_환불보고 (260628), 기재는 환불일지 참조. 공제·환불 스크립트 환불안내 공제금 안내 스크립트 . 결제수단별 부분환불 (260803 오영선님 확인) 나이스페이·계좌이체는 부분환불이 되므로 공제금을 뺀 차액만 환불하면 되고, 학생에게 공제금을 따로 결제받지 않는다. 카드결제만 부분환불이 안 되어 전액 환불 후 공제금을 별도로 받는다. 환불 안내 전에 결제수단을 먼저 확인하고, 나이스페이·계좌이체 건에 공제금 결제를 요구하지 않는다. 사전 방지 환불은 사전 방지가 전부: 결제 후 15~30분 재상담·영수증 출력·사유 먼저(변상돈 교리, payment guide). 손해 앵커(30% 미만=1/3 공제·50% 이상=환불·배정변경 불가·keg 할인권 회수)는 멘토 상담용으로 feedback_환불방지교리 참조. 후속 기한은 이행까지 추적한다( feedback_이탈후속추적 , 00_영업액션판)."},"99_시스템/01_업무규정/위키_DB배정_배대조.md":{"t":"DB배정 배대조","s":"배정 순서는 재배정 → 턴 → 선배정이고, 대표는 전화 유입 급건이라 즉시 보고하며 댓글 배정은 운영부 처리라 배대조 대상이 아니다.","g":["배대조","배정","대표디비","선배정","종강생","없는과목"],"d":"2026-08-22","f":"규정·절차","l":["99_시스템/02_인트라넷양식/양식_배대조_대표배정.md","99_시스템/02_인트라넷양식/양식_재배정요청.md","99_시스템/01_업무규정/위키_통화량체크절차.md"],"h":"<h5>DB 배정 (배대조)</h5>\n<p class=\"tags\"><span class=\"tag\">배대조</span><span class=\"tag\">배정</span><span class=\"tag\">대표디비</span><span class=\"tag\">선배정</span><span class=\"tag\">종강생</span><span class=\"tag\">없는과목</span></p>\n<h5>배정 순서·유입 구분</h5>\n<ul><li>\n배정 순서: 재배정 → 턴 → 선배정(선배정은 아침에 팀장 처리).\n</li><li>\n배대조 당번 근무는 09:30~18:00이다(260817 오영선님 확인). 그날은 종일 배정 업무라 상담·면담을 함께 잡지 않는 편이 낫다(오영선 개인 운영 기준).\n</li><li>\n대표=전화 유입(급건, 즉시 보고), 공식·페북·구글·OA·기타=DB창 문의.\n</li><li>\nSE는 구글, FE는 페북, 대표만 전달.\n</li><li>\nOA는 대표로 들어와도 OA로 심는다(회계·세무 포함).\n</li><li>\nCOD 포함 완납 이력 시 팀장에게 수강권 생존 여부 확인(타지점 COD 30일, 재컨텍 기준 10일).\n</li><li>\n종강생은 해당 지점 담당 멘토에게 사업부 더블 요청.\n</li><li>\n없는 과목 문의는 &quot;확인 후 연락드리겠습니다&quot; 후 종료하고 재배정 요청.\n</li><li>\n정본 <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_배대조_대표배정.md\">양식_배대조_대표배정</a>(260430), <a class=\"wl\" data-doc=\"99_시스템/02_인트라넷양식/양식_재배정요청.md\">양식_재배정요청</a>(260501).\n</li></ul>\n<h5>선배정 우선순위·요건 (260812 공유본)</h5>\n<ul><li>\n우선순위: 매출 → 리뷰 → 상담건수 → 개인/추천등록(3건) → 재배정.\n</li><li>\n선배정 요건 4종.\n</li><li>\n1) 일자별 상담 3건 이상 중 상위 2명 → 1건씩 선배정.\n</li><li>\n2) 일자별 매출 400만 이상 중 상위 2명 → 1건씩 선배정.\n</li><li>\n3) 주차별 상담률 70% 이상 상위 3명 → 다음 주 매일 1건씩 선배정.\n</li><li>\n4) 개인·추천 문의 등록 3건(COD 포함) → 디비 선배정 1건.\n</li><li>\n주말은 토·일을 하루로 묶어 계산한다.\n</li><li>\n면담은 면담일지로 집계한다.\n</li><li>\n기존 키워드 소진 5만원과 개인문의 건당 선배정은 삭제됐다.\n</li><li>\n모든 기준은 영업일지 주차 기준으로 적용한다.\n</li><li>\n통화량·페널티 연동 기준은 <a class=\"wl\" data-doc=\"99_시스템/01_업무규정/위키_통화량체크절차.md\">위키_통화량체크절차</a>.\n</li></ul>\n<h5>디비 삭제·조작 페널티</h5>\n<ul><li>\n디비 삭제 및 조작 발견 시 페널티 2주 전체 제한.\n</li></ul>\n<h5>댓글 배정 (260803 오영선님 확인)</h5>\n<ul><li>\n댓글 배정은 운영부 처리다.\n</li><li>\n멘토·팀 배정 턴에 포함되지 않으므로 댓글 유입 건을 배대조·재배정 요청 대상으로 올리지 않는다.\n</li><li>\n관련 문의는 운영부로 넘긴다.\n</li></ul>","x":"상위: 00_업무위키 db 배정 (배대조) 배대조 배정 대표디비 선배정 종강생 없는과목 한 줄: 배정 순서는 재배정 → 턴 → 선배정이고, 대표는 전화 유입 급건이라 즉시 보고하며 댓글 배정은 운영부 처리라 배대조 대상이 아니다. 배정 순서·유입 구분 배정 순서: 재배정 → 턴 → 선배정(선배정은 아침에 팀장 처리). 배대조 당번 근무는 09:30~18:00이다(260817 오영선님 확인). 그날은 종일 배정 업무라 상담·면담을 함께 잡지 않는 편이 낫다(오영선 개인 운영 기준). 대표=전화 유입(급건, 즉시 보고), 공식·페북·구글·oa·기타=db창 문의. se는 구글, fe는 페북, 대표만 전달. oa는 대표로 들어와도 oa로 심는다(회계·세무 포함). cod 포함 완납 이력 시 팀장에게 수강권 생존 여부 확인(타지점 cod 30일, 재컨텍 기준 10일). 종강생은 해당 지점 담당 멘토에게 사업부 더블 요청. 없는 과목 문의는 \"확인 후 연락드리겠습니다\" 후 종료하고 재배정 요청. 정본 양식_배대조_대표배정 (260430), 양식_재배정요청 (260501). 선배정 우선순위·요건 (260812 공유본) 우선순위: 매출 → 리뷰 → 상담건수 → 개인/추천등록(3건) → 재배정. 선배정 요건 4종. 1) 일자별 상담 3건 이상 중 상위 2명 → 1건씩 선배정. 2) 일자별 매출 400만 이상 중 상위 2명 → 1건씩 선배정. 3) 주차별 상담률 70% 이상 상위 3명 → 다음 주 매일 1건씩 선배정. 4) 개인·추천 문의 등록 3건(cod 포함) → 디비 선배정 1건. 주말은 토·일을 하루로 묶어 계산한다. 면담은 면담일지로 집계한다. 기존 키워드 소진 5만원과 개인문의 건당 선배정은 삭제됐다. 모든 기준은 영업일지 주차 기준으로 적용한다. 통화량·페널티 연동 기준은 위키_통화량체크절차 . 디비 삭제·조작 페널티 디비 삭제 및 조작 발견 시 페널티 2주 전체 제한. 댓글 배정 (260803 오영선님 확인) 댓글 배정은 운영부 처리다. 멘토·팀 배정 턴에 포함되지 않으므로 댓글 유입 건을 배대조·재배정 요청 대상으로 올리지 않는다. 관련 문의는 운영부로 넘긴다."},"99_시스템/01_업무규정/팀위키_결제_환불_규정.md":{"t":"결제 환불 규정","s":"","g":[],"d":"2026-08-12","f":"규정·절차","l":[],"h":"<h3>결제·환불 규정과 대응 순서</h3>\n<p>갱신 2026-08-12 · 정리 오영선 · 계좌번호와 학생 발송 문안은 이 문서에 싣지 않습니다(담당 멘토 정본으로 확인).</p>\n<h4>결제 방식 안내</h4>\n<ul><li>\n우선순위: 결제선생(COD)·온라인카드(나이스)·계좌이체가 1순위 / 이니시스는 온라인 결제 시 / 키인(원격카드)은 마지막 수단(막힌 카드 사례가 있어 우선 권유 금지)\n</li><li>\n현금영수증은 개인용·사업자용 구분을 등록 전에 확인합니다. 모르는 사항은 팀장·선배에게 즉시 확인합니다.\n</li><li>\n요청메모 양식:\n</li></ul>\n<pre><code>COD:      MM.DD (이름) COD OO만원\n키인:     MM.DD (이름) 카드 OO만원\n나이스:   MM.DD (이름) 나이스 OO만원\n계좌이체: MM.DD (이름) 기업 OO만원 현영:(번호)\n자진발급: MM.DD 기업 1만원 (이름) 현영: 자진발급\n잔금:     MM.DD (이름) 기업 OO만원 현영:(번호) ← 잔금</code></pre>\n<ul><li>\n따즈아 결제는 동일 계좌를 쓰므로 요청메모에 &quot;따즈아&quot;를 구분 표기합니다.\n</li></ul>\n<h4>현금 결제 후속 처리 (순서 엄수)</h4>\n<ul><li>\n요청메모에 입금 정보 기입\n</li><li>\n입금 확인\n</li><li>\n운영관리 방문자 체크 여부 확인\n</li><li>\n안 됐으면 직접 체크\n</li><li>\n원서 정보 잔액방 작성\n</li></ul>\n<ul><li>\n운영관리 경로: 운영관리 → 수강생목록 → 이름 검색 → 요청문의 → 보기 → 원서요청 내역 등록 창\n</li><li>\n잔액방 형식은 <code>(원서번호) (수강생명)</code> 만. 요청메모 내용과 혼동하지 않습니다.\n</li></ul>\n<h4>등록 직후 재상담 (15~30분 골든타임)</h4>\n<p>등록 후 15~30분 안에 재상담합니다. 결제 전엔 과해 보이는 내용도 결제 후엔 자연스럽습니다.</p>\n<ul><li>\n난이도: 어려운 게 당연하고, 막히면 멘토에게 바로 연락하도록 안내\n</li><li>\n일정: 시간대 교차 수강·비대면·개인 녹화(OBS) 옵션 안내\n</li><li>\n혜택 체감: 원수강료 대비 납부액을 수치로 보여주기(할인율 말만으로는 크기를 모름)\n</li></ul>\n<p>등록 즉시 학사일지 영수증 출력(원수강료+할인 납부액 표기)을 습관화합니다. 환불 분쟁에서 가장 강한 근거입니다.</p>\n<h4>환불 요청 대응</h4>\n<ul><li>\n수강 전 환불: 영수증 제시 → 원수강료와 납부액을 함께 보여주기 → 공제 기준을 항목별로 정리해 안내(통보식 금지)\n</li><li>\n수강 후 환불: 사유부터 진지하게 청취 → &quot;항목별로 정리해 드릴게요&quot;로 시작 → 공제 얘기를 먼저 꺼내지 않기\n</li><li>\n손해 앵커(멘토 상담용, 학생 발송 금지): 공제는 수업 진행 구간 기준이며 진행 30% 미만은 원수강료의 1/3 공제, 50% 이상 진행 시 환불·배정변경 불가. 할인권 회수(불가 시 1매당 50만 차감), 과목 수 감소 시 패키지 할인율 소급 재산정. 계속 수강이 유리함을 수치로 설득하고 인강 보충·시간표 변경으로 유도합니다.\n</li></ul>\n<h4>결제수단별 부분환불 (공제금 처리 분기점)</h4>\n<ul><li>\n나이스페이·계좌이체: 부분환불 가능 → 공제금을 뺀 차액만 환불하고, 학생에게 공제금을 따로 결제받지 않습니다\n</li><li>\n카드결제: 부분환불 불가 → 전액 환불 후 공제금을 별도 납입받는 방식만 가능\n</li><li>\n환불 안내 전에 결제수단부터 확인합니다.\n</li></ul>\n<h4>환불 처리 절차</h4>\n<ul><li>\n팀장 보고 후 환불 협의\n</li><li>\n환불일지 작성(인트라넷, 양식: 수강생명/원서번호/환불사유/환불금액/공제내역/처리일자)\n</li><li>\n공제금 처리(위 분기 적용, 계좌 환불 시 입금증 보관)\n</li><li>\n중퇴 요청(운영관리 → 수강생목록 → 중퇴요청)\n</li><li>\n환불현황 확인\n</li></ul>\n<p>국취제(국비) 관련 환불은 취소 시 재가입 제한 등 학생 불이익이 커서 홀드 후 팀장 상의를 권장합니다.</p>\n<h4>헷갈리기 쉬운 포인트</h4>\n<ul><li>\n키인 결제가 막힌 수강생이 있음 → 결제선생·계좌이체 먼저 권유\n</li><li>\n현금영수증 개인/사업자 구분은 등록 전 확인\n</li><li>\n잔액방 전송 내용과 요청메모 내용은 다름(혼동 금지)\n</li><li>\n방문자 체크 누락은 원서 누락으로 이어짐 → 입금 확인 직후 필수\n</li><li>\n&quot;어플로 확인하세요&quot; 식 안내 금지(책임 소재 불명확) → 직접 전송 유지\n</li><li>\n개강 안내는 주말 전 완료\n</li></ul>","x":"결제·환불 규정과 대응 순서 갱신 2026 08 12 · 정리 오영선 · 계좌번호와 학생 발송 문안은 이 문서에 싣지 않습니다(담당 멘토 정본으로 확인). 결제 방식 안내 우선순위: 결제선생(cod)·온라인카드(나이스)·계좌이체가 1순위 / 이니시스는 온라인 결제 시 / 키인(원격카드)은 마지막 수단(막힌 카드 사례가 있어 우선 권유 금지) 현금영수증은 개인용·사업자용 구분을 등록 전에 확인합니다. 모르는 사항은 팀장·선배에게 즉시 확인합니다. 요청메모 양식: cod: mm.dd (이름) cod oo만원 키인: mm.dd (이름) 카드 oo만원 나이스: mm.dd (이름) 나이스 oo만원 계좌이체: mm.dd (이름) 기업 oo만원 현영:(번호) 자진발급: mm.dd 기업 1만원 (이름) 현영: 자진발급 잔금: mm.dd (이름) 기업 oo만원 현영:(번호) ← 잔금 따즈아 결제는 동일 계좌를 쓰므로 요청메모에 \"따즈아\"를 구분 표기합니다. 현금 결제 후속 처리 (순서 엄수) 1. 요청메모에 입금 정보 기입 2. 입금 확인 3. 운영관리 방문자 체크 여부 확인 4. 안 됐으면 직접 체크 5. 원서 정보 잔액방 작성 운영관리 경로: 운영관리 → 수강생목록 → 이름 검색 → 요청문의 → 보기 → 원서요청 내역 등록 창 잔액방 형식은 (원서번호) (수강생명) 만. 요청메모 내용과 혼동하지 않습니다. 등록 직후 재상담 (15~30분 골든타임) 등록 후 15~30분 안에 재상담합니다. 결제 전엔 과해 보이는 내용도 결제 후엔 자연스럽습니다. 1. 난이도: 어려운 게 당연하고, 막히면 멘토에게 바로 연락하도록 안내 2. 일정: 시간대 교차 수강·비대면·개인 녹화(obs) 옵션 안내 3. 혜택 체감: 원수강료 대비 납부액을 수치로 보여주기(할인율 말만으로는 크기를 모름) 등록 즉시 학사일지 영수증 출력(원수강료+할인 납부액 표기)을 습관화합니다. 환불 분쟁에서 가장 강한 근거입니다. 환불 요청 대응 수강 전 환불: 영수증 제시 → 원수강료와 납부액을 함께 보여주기 → 공제 기준을 항목별로 정리해 안내(통보식 금지) 수강 후 환불: 사유부터 진지하게 청취 → \"항목별로 정리해 드릴게요\"로 시작 → 공제 얘기를 먼저 꺼내지 않기 손해 앵커(멘토 상담용, 학생 발송 금지): 공제는 수업 진행 구간 기준이며 진행 30% 미만은 원수강료의 1/3 공제, 50% 이상 진행 시 환불·배정변경 불가. 할인권 회수(불가 시 1매당 50만 차감), 과목 수 감소 시 패키지 할인율 소급 재산정. 계속 수강이 유리함을 수치로 설득하고 인강 보충·시간표 변경으로 유도합니다. 결제수단별 부분환불 (공제금 처리 분기점) 나이스페이·계좌이체: 부분환불 가능 → 공제금을 뺀 차액만 환불하고, 학생에게 공제금을 따로 결제받지 않습니다 카드결제: 부분환불 불가 → 전액 환불 후 공제금을 별도 납입받는 방식만 가능 환불 안내 전에 결제수단부터 확인합니다. 환불 처리 절차 1. 팀장 보고 후 환불 협의 2. 환불일지 작성(인트라넷, 양식: 수강생명/원서번호/환불사유/환불금액/공제내역/처리일자) 3. 공제금 처리(위 분기 적용, 계좌 환불 시 입금증 보관) 4. 중퇴 요청(운영관리 → 수강생목록 → 중퇴요청) 5. 환불현황 확인 국취제(국비) 관련 환불은 취소 시 재가입 제한 등 학생 불이익이 커서 홀드 후 팀장 상의를 권장합니다. 헷갈리기 쉬운 포인트 키인 결제가 막힌 수강생이 있음 → 결제선생·계좌이체 먼저 권유 현금영수증 개인/사업자 구분은 등록 전 확인 잔액방 전송 내용과 요청메모 내용은 다름(혼동 금지) 방문자 체크 누락은 원서 누락으로 이어짐 → 입금 확인 직후 필수 \"어플로 확인하세요\" 식 안내 금지(책임 소재 불명확) → 직접 전송 유지 개강 안내는 주말 전 완료"},"99_시스템/01_업무규정/팀위키_시작하기.md":{"t":"시작하기","s":"","g":[],"d":"2026-08-22","f":"규정·절차","l":[],"h":"<h3>팀자료방 시작하기</h3>\n<p>2-3팀 공용 위키·자료방입니다. 옵시디언에서 이 폴더를 볼트로 열거나, 쓰시던 볼트와 별개로 참조하시면 됩니다.</p>\n<h4>쓰는 법</h4>\n<ul><li>\n위키 읽기: 인트라넷_절차(예정) · 결제_환불_규정(예정) · 신입_온보딩_키트(예정) (00_위키 폴더, 문서 생성 후 위키링크 복원)\n</li><li>\n폰에서 보기: 드라이브 앱 미리보기(텍스트) 또는 옵시디언 모바일로 열람합니다\n</li><li>\n드라이브에서 이 폴더에 별표를 눌러 두면 &quot;중요 문서함&quot;에 고정되어 링크 없이 바로 찾습니다\n</li><li>\n자료 공유: 본인 이름 폴더에 노트를 만들거나 파일을 끌어다 넣습니다\n</li><li>\n번거롭거나 반복되는 일 메모도 환영합니다. 자동화·개선 후보로 검토해 퇴근 시간을 앞당기는 데 씁니다\n</li><li>\n반영: 자료방에 올라온 것 중 공용 가치가 있는 내용은 오영선이 위키로 정리합니다\n</li></ul>\n<h4>규칙</h4>\n<ul><li>\n쓰기는 본인 폴더에만 합니다. 위키와 다른 사람 폴더는 열람만 하고, 수정 요청은 오영선에게 주세요\n</li><li>\n수강생 실명·연락처·결제정보는 넣지 않습니다. 학생 정보의 정본은 인트라넷입니다\n</li><li>\n대용량 영상은 드라이브 링크 메모로 대체합니다\n</li><li>\n같은 파일을 동시에 편집하면 충돌 사본이 생길 수 있어, 남의 문서는 열람만 합니다\n</li></ul>\n<h4>예정</h4>\n<ul><li>\n기록 양식 모음(컨텍메모·상담일지·면담일지)\n</li><li>\n학과 지식·커리큘럼 안내\n</li><li>\n개강안내 문자 양식\n</li></ul>\n<p>관리: 오영선 · 문서 요청·수정 제안은 카톡 또는 본인 폴더 메모로 남겨 주세요.</p>","x":"팀자료방 시작하기 2 3팀 공용 위키·자료방입니다. 옵시디언에서 이 폴더를 볼트로 열거나, 쓰시던 볼트와 별개로 참조하시면 됩니다. 쓰는 법 위키 읽기: 인트라넷_절차(예정) · 결제_환불_규정(예정) · 신입_온보딩_키트(예정) (00_위키 폴더, 문서 생성 후 위키링크 복원) 폰에서 보기: 드라이브 앱 미리보기(텍스트) 또는 옵시디언 모바일로 열람합니다 드라이브에서 이 폴더에 별표를 눌러 두면 \"중요 문서함\"에 고정되어 링크 없이 바로 찾습니다 자료 공유: 본인 이름 폴더에 노트를 만들거나 파일을 끌어다 넣습니다 번거롭거나 반복되는 일 메모도 환영합니다. 자동화·개선 후보로 검토해 퇴근 시간을 앞당기는 데 씁니다 반영: 자료방에 올라온 것 중 공용 가치가 있는 내용은 오영선이 위키로 정리합니다 규칙 쓰기는 본인 폴더에만 합니다. 위키와 다른 사람 폴더는 열람만 하고, 수정 요청은 오영선에게 주세요 수강생 실명·연락처·결제정보는 넣지 않습니다. 학생 정보의 정본은 인트라넷입니다 대용량 영상은 드라이브 링크 메모로 대체합니다 같은 파일을 동시에 편집하면 충돌 사본이 생길 수 있어, 남의 문서는 열람만 합니다 예정 기록 양식 모음(컨텍메모·상담일지·면담일지) 학과 지식·커리큘럼 안내 개강안내 문자 양식 관리: 오영선 · 문서 요청·수정 제안은 카톡 또는 본인 폴더 메모로 남겨 주세요."},"99_시스템/01_업무규정/팀위키_신입_온보딩_키트.md":{"t":"신입 온보딩 키트","s":"","g":[],"d":"2026-08-12","f":"규정·절차","l":[],"h":"<h3>신입 온보딩 키트</h3>\n<p>갱신 2026-08-12 · 정리 오영선 · 원칙: 답을 주기보다 찾는 곳을 알려 줍니다. 위키에서 먼저 찾고, 없으면 그때 질문합니다.</p>\n<h4>자주 막히는 것 10 (선제 안내)</h4>\n<ul><li>\n담당 판정: DB 담당자 표기에서 서브담당이 있으면 서브가 실권자. 메인만 보고 컨텍하면 권한 침범\n</li><li>\nDB 재컨택 처리: 결과메모가 오늘 날짜인 건은 상담결과 유지+날짜만 이월, 상담예정 건은 절대 변경 금지, 저장은 비가역\n</li><li>\n개강안내 D-5 규칙: 개강 5일 전 발송, 5일 전이 주말이면 그 전 금요일. 강사명 생략, 이모지 금지\n</li><li>\n통화량 기준: 기준 30분(1개월차 20분), 당일 상담 3건·매출 400만 면제. 구버전 표(50/80분)와 혼동 주의, 최신 기준은 팀 공지 우선\n</li><li>\n배대조: 재배정 → 턴 → 선배정 순서. 대표=전화 유입 급건 즉시 보고. OA는 대표로 와도 OA로 심는다\n</li><li>\n할인 상한 40% + 네이버 리뷰(5만)는 별도. COD는 원칙 불가·배정 제외·유효기간은 등록 주 주말까지\n</li><li>\n원서등록 전 운영계획표에서 과목명·수강료 재확인. 원서번호 생성 후 잔액방 전송\n</li><li>\n내사방문일지 매일 퇴근 전 작성 → 누락 시 상담 실적 집계에서 빠짐\n</li><li>\n컨텍 기록 양식: ★컨텍후/★상담완료 상태값, 개조식(~함/됨), 이모지·불릿 금지\n</li><li>\n학사메모는 수강생이 못 보므로 솔직하게. 멘토 변경은 팀장 승인 필수\n</li></ul>\n<h4>멘토링 세션 커리큘럼 (30분 × 3회)</h4>\n<ul><li>\n1회차 &quot;하루의 뼈대&quot;: 출근(브리핑·금일 상담 확인) → DB 재컨택 → 컨텍 → 일지 마감. 위 1·2·8번 실습\n</li><li>\n2회차 &quot;컨텍에서 등록까지&quot;: 컨텍메모 → 방문 유도 → 상담일지 → COD·잔금 관리. 익명화한 실전 기록 1건을 함께 읽기\n</li><li>\n3회차 &quot;등록 후가 진짜&quot;: 개강안내 D-5, 월 1회 면담, 추가등록 제안 타이밍(종강 D-14)\n</li></ul>\n<h4>일일 자가 체크 5</h4>\n<ul><li>\n[ ] 오늘 내 DB 재컨택 처리했다 (상담예정 건 안 건드림)\n</li><li>\n[ ] 통화 후 5분 내 컨텍메모 남겼다\n</li><li>\n[ ] 내사방문일지 작성했다\n</li><li>\n[ ] 내일 개강 수강생 안내 나갔는지 확인했다\n</li><li>\n[ ] 막힌 것 1개를 위키에서 먼저 찾아봤다 (없으면 그때 질문)\n</li></ul>\n<h4>질문 응대 원칙 (선배 멘토용)</h4>\n<ul><li>\n1차 응답은 위키 링크로 안내합니다. 같은 질문이 2회 나오면 위키에 없다는 뜻이므로 위키에 추가합니다\n</li><li>\n판단이 필요한 질문(할인 예외·특수 케이스)만 팀장 에스컬레이션. 신입에게도 이 구분을 가르칩니다\n</li><li>\n본인 실전 사례를 1개씩 곁들이면 신뢰 형성에 효과적입니다\n</li></ul>\n<h4>인트라넷 매뉴얼 rev3 핵심 절차 요약</h4>\n<ul><li>\nDB 유입 6구분: ① 내사(네이버 실시간예약·직접방문, 인터뷰용지 받아 등록) ② 대표(학원 대표번호 유입, 배정·당직 담당이 DB창 직접등록·중복 가능) ③ 공식(공식홈·네이버검색 등 광고, DB목록 자동등록) ④ 구글/페북(ga/fa/fb/at/ig/re 시작 링크) ⑤ 개인(블로그·카톡 등 개인채널 → 절대 컨텍 금지) ⑥ 대문/추천(지인·부모 대신 문의 → 소유자 승인 없이 컨텍 불가). 기타/중복(소화불가 과목·이름or번호+IP중복)은 팀장 확인\n</li><li>\n신규DB 컨텍: 사이트관리 DB목록 → 우측상단 등록 → 문의DB상담정보 검색으로 더블(중복) 조회 → 없으면 등록(더블 시 팀장 확인)\n</li><li>\n결과메모 규칙: 컨텍만=재컨텍요망 / 상담예정=날짜+★00:00 / 상담완료=날짜+재컨텍예정일 / COD=날짜+금액(콤마 없이) / 완납=날짜X+총수강료(콤마 없이). 상담내용은 재컨텍 실수 방지를 위해 최대한 상세 기록\n</li><li>\n잔여DB 권한기한: 상담완료 30일 / 재컨텍요망 15일 / COD·완납·개인·추천은 컨텍 금지. 기한 초과 타인 DB는 규정 확인 후, 모르면 팀장 확인\n</li><li>\n원서·결제: 원서작성(인터뷰 선작성 필수) → 팀장 승인 후 결제요청. COD·계좌이체는 원서등록 단계에서 요청메모 기입. 교육상품권 최대 3만원\n</li><li>\n학사 흐름: 결제확인 → 학사메모 등록 → 수강배정(임의배정 금지, 상담 시 협의 또는 최소 개강 1주 전). 재배정 차액 발생 시 특별처리신청서 후 차액 납부\n</li><li>\n등록안내(개강 D-3까지 필수): 스마트러닝앱 + 교재(필수과목 위주) + 온라인 30일권 + 비대면 강의실 안내 + 개강안내·메모\n</li><li>\n당직 마감(21~22시 2명): 5·6층 강의실 소등·경비설정, 마감일지 카톡 발송(수납액/환불액/실매출/대표착신자/내일상담건수/최종퇴실자)\n</li><li>\n환불: 카드=부분취소 불가(공제금 납입 후 전액환불, 영업일 3~5일), 계좌이체=부분취소 가능. 환불일지 작성 후 중퇴요청. 공제내역은 변경 전/후 모두 기재. 국취제 환불은 홀드 권장\n</li><li>\n견적: 매월 운영계획표 수강료 확인. 견적서=과목명·기간·원수강료·할인내역·COD 시 납부/잔여 표기\n</li></ul>\n<h4>기준 충돌 시</h4>\n<p>절차·화면 경로는 입사 매뉴얼(rev3)이 상세하지만, 팀·통화량·결제 기준은 최신 공지와 이 위키가 우선입니다. 계열사명(SBS아카데미 AIX학원 강남지점)·과목명(AIX 개편) (개강 d 3까지 필수): 스마트러닝앱 + 교재(필수과목 위주) + 온라인 30일권 + 비대면 강의실 안내 + 개강안내·메모 당직 마감(21~22시 2명): 5·6층 강의실 소등·경비설정, 마감일지 카톡 발송(수납액/환불액/실매출/대표착신자/내일상담건수/최종퇴실자) 환불: 카드=부분취소 불가(공제금 납입 후 전액환불, 영업일 3~5일), 계좌이체=부분취소 가능. 환불일지 작성 후 중퇴요청. 공제내역은 변경 전/후 모두 기재. 국취제 환불은 홀드 권장 견적: 매월 운영계획표 수강료 확인. 견적서=과목명·기간·원수강료·할인내역·cod 시 납부/잔여 표기 기준 충돌 시 절차·화면 경로는 입사 매뉴얼(rev3)이 상세하지만, 팀·통화량·결제 기준은 최신 공지와 이 위키가 우선입니다. 계열사명(sbs아카데미 aix학원 강남지점)·과목명(aix 개편)은 2026 07 15 이후 신규 기준으로 봅니다."},"99_시스템/01_업무규정/팀위키_인트라넷_절차.md":{"t":"인트라넷 절차","s":"","g":[],"d":"2026-08-12","f":"규정·절차","l":[],"h":"<h3>인트라넷(운영관리시스템) 절차</h3>\n<p>갱신 2026-08-12 · 정리 오영선 · 값이 어긋나면 인트라넷 실제 화면과 팀장 공지가 우선입니다.</p>\n<h4>주요 메뉴 구조</h4>\n<pre><code>인트라넷 (코리아교육그룹 운영관리시스템)\n├── DB관리\n│   ├── 내 DB 목록\n│   ├── 공식 DB 목록\n│   └── DB 신규등록\n├── 운영관리\n│   ├── 수강생목록\n│   ├── 원서등록\n│   ├── 수강과정 등록\n│   ├── 학사메모 등록\n│   └── 환불현황\n├── 일지관리\n│   ├── 내사방문일지\n│   ├── 학사일지\n│   ├── 강사일지\n│   └── 개강일지\n├── 매출관리\n│   └── 일별 마감현황\n└── 강의시간표\n    ├── 평일반 시간표\n    └── 주말반 시간표</code></pre>\n<h4>DB 신규등록</h4>\n<ul><li>\n경로: DB관리 → DB 신규등록\n</li><li>\n필수 입력: 고객명 / 연락처(010-**<strong>-</strong>** 형식) / 문의 과목 / 유입 경로 / 메모(첫 컨텍 요약) / 담당 멘토\n</li><li>\n등록 후 더블(중복)조회 자동 알림을 확인합니다. 이미 있는 DB면 등록 불가, 해당 멘토에게 알림이 갑니다.\n</li></ul>\n<h4>원서등록</h4>\n<ul><li>\n경로: 운영관리 → 원서등록\n</li><li>\n필수 입력: 수강생명 / 생년월일 / 연락처 / 과정·과목명 / 수강료(원수강료·할인내역·납부금액) / 결제방식(카드·계좌이체·COD·온라인) / 담당 멘토\n</li><li>\n원서번호 자동 생성 → 잔액방 전송 형식은 <code>(원서번호) (수강생명)</code> 만 씁니다.\n</li><li>\n주의: 등록 전 운영계획표에서 과목명·수강료를 재확인합니다.\n</li></ul>\n<h4>수강과정 등록</h4>\n<ul><li>\n경로: 운영관리 → 수강생목록 → 수강생 선택 → 수강과정 등록\n</li><li>\n입력: 과목명(강의시간표 과목명 기준) / 개강일·종강일 / 강의실 / 강사명 / 배정 방식(일반·수동)\n</li></ul>\n<h4>수강배정 3종</h4>\n<ul><li>\n일반배정: 시스템 자동 배정. 일반적인 경우\n</li><li>\n수동배정: 멘토가 강의실·시간 직접 지정. 특수 요청·시간 조정 시\n</li><li>\n재배정: 기존 배정 취소 후 재등록. 강의실·과목 변경 시\n</li><li>\n재배정 순서 엄수: 기존 배정 취소 → 수강생에게 변경 안내 발송 → 새 배정 등록\n</li></ul>\n<h4>내사방문일지</h4>\n<ul><li>\n경로: 일지관리 → 내사방문일지 → 날짜 선택 → 신규 등록\n</li><li>\n입력: 상담 일시 / 상담자명 / 문의 과목 / 상담 구분(내방·전화·온라인) / 내용 요약 / 후속 액션(예약·재상담·등록 등)\n</li><li>\n매일 퇴근 전 작성합니다. 누락 시 상담 실적 집계에서 빠집니다.\n</li></ul>\n<h4>학사메모</h4>\n<ul><li>\n경로: 운영관리 → 수강생목록 → 이름 검색 → 학사메모 등록\n</li><li>\n기재 기준: 수강생 요청(일정 변경·비대면·강의실 변경), 특이사항(환불 의사·민원·컨디션), 후속 액션 필요 사항\n</li><li>\n양식:\n</li></ul>\n<pre><code>YYYY.MM.DD(요일) [멘토: 이름]\n내용: (요청·특이사항 간략 기재)\n후속: (액션 또는 없음)</code></pre>\n<h4>수강생 정보 확인</h4>\n<ul><li>\n경로: 운영관리 → 수강생목록 → 이름 또는 연락처 검색\n</li><li>\n확인 가능: 원서번호 / 등록 과목·기간 / 수강료 납부 현황(잔금 여부) / 담당 멘토 / 학사메모 이력 / 수강배정 내역\n</li></ul>\n<h4>멘토 변경</h4>\n<ul><li>\n팀장 사전 승인\n</li><li>\n기존 멘토 인수인계\n</li><li>\n인트라넷에서 담당 멘토 변경 처리\n</li><li>\n수강생에게 변경 안내 발송\n</li></ul>\n<pre><code>안녕하세요, [이름]님. SBS아카데미 강남점입니다.\n담당 멘토가 [이전 멘토명]에서 [새 멘토명] 멘토로 변경되었습니다.\n앞으로 수강 관련 문의는 [새 멘토명] 멘토([연락처])에게 연락해 주세요.\n잘 부탁드립니다!</code></pre>\n<h4>헷갈리기 쉬운 포인트</h4>\n<ul><li>\n원서번호는 원서등록 후 자동 생성 → 잔액방 전송 전 번호를 반드시 확인\n</li><li>\n수동배정 없이 일반배정만 하면 강의실 지정이 안 되는 경우 있음 → 확인 필수\n</li><li>\n내사방문일지 미작성이면 상담 실적 집계 누락 → 매일 퇴근 전 작성\n</li><li>\n학사메모는 수강생이 볼 수 없음 → 솔직하게 기재해도 됨\n</li><li>\n멘토 변경은 반드시 팀장 승인 후 진행, 임의 변경 금지\n</li></ul>","x":"인트라넷(운영관리시스템) 절차 갱신 2026 08 12 · 정리 오영선 · 값이 어긋나면 인트라넷 실제 화면과 팀장 공지가 우선입니다. 주요 메뉴 구조 인트라넷 (코리아교육그룹 운영관리시스템) ├── db관리 │ ├── 내 db 목록 │ ├── 공식 db 목록 │ └── db 신규등록 ├── 운영관리 │ ├── 수강생목록 │ ├── 원서등록 │ ├── 수강과정 등록 │ ├── 학사메모 등록 │ └── 환불현황 ├── 일지관리 │ ├── 내사방문일지 │ ├── 학사일지 │ ├── 강사일지 │ └── 개강일지 ├── 매출관리 │ └── 일별 마감현황 └── 강의시간표 ├── 평일반 시간표 └── 주말반 시간표 db 신규등록 경로: db관리 → db 신규등록 필수 입력: 고객명 / 연락처(010 형식) / 문의 과목 / 유입 경로 / 메모(첫 컨텍 요약) / 담당 멘토 등록 후 더블(중복)조회 자동 알림을 확인합니다. 이미 있는 db면 등록 불가, 해당 멘토에게 알림이 갑니다. 원서등록 경로: 운영관리 → 원서등록 필수 입력: 수강생명 / 생년월일 / 연락처 / 과정·과목명 / 수강료(원수강료·할인내역·납부금액) / 결제방식(카드·계좌이체·cod·온라인) / 담당 멘토 원서번호 자동 생성 → 잔액방 전송 형식은 (원서번호) (수강생명) 만 씁니다. 주의: 등록 전 운영계획표에서 과목명·수강료를 재확인합니다. 수강과정 등록 경로: 운영관리 → 수강생목록 → 수강생 선택 → 수강과정 등록 입력: 과목명(강의시간표 과목명 기준) / 개강일·종강일 / 강의실 / 강사명 / 배정 방식(일반·수동) 수강배정 3종 일반배정: 시스템 자동 배정. 일반적인 경우 수동배정: 멘토가 강의실·시간 직접 지정. 특수 요청·시간 조정 시 재배정: 기존 배정 취소 후 재등록. 강의실·과목 변경 시 재배정 순서 엄수: 기존 배정 취소 → 수강생에게 변경 안내 발송 → 새 배정 등록 내사방문일지 경로:
