다. 네 알겠습니다. 네 감사합니다.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 시니어·고령 (6분) <span>· 30턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 컴맹 안심·난이도·같은 목적 수강생 — 시니어 응대 표준 <span class=\"mute\">(멘토 15·고객 15턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 여보세요. 아 네 안녕하세요 조○○ 님이시죠? 네 네 안녕하세요 여기 컴퓨터 학원 네 맞습니다. 컴퓨터 학원입니다. 아 네 그 피피 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내가 이제 우리는 나이가 있어 갖고 사실 컴퓨터 세대도 아니고 이제 밑에 이제 직원이나 이제 우리 애들 자식들하고 했는데 제가 최근에 이제 우리 회사에 우리 옮겼더니 네네 얘는 컴퓨터 안 하면 안 되는 그런 상황이야. 그렇죠. 그래서 그래서 이제 제가 주로 하는 거는 이제 워드나 엑셀 정도 기초만 배우면 돼요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 바로 님만 배우면 돼. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">파워 페이트나 이런 거는 이런 건 직원들이 하는 거고 네네. 간단한 거는 이제 이 직원인데 의존할 수 없는 입장이 많더라고 그래서 내가 하루 늦게 컴퓨터 좀 배워보려고 아직은 아직은 초보야. 아니 사용을 안 했어. 컴퓨터 안 했어요. 시키면 다 됐기 때문에 안 했다고 우리가 우리 세대가 되게 애매모호한 세대야. 그래서 내가 좀 배우고 있으려고 전화했어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래 잘하셨습니다. 일단은 그러면은 학원에서 PPT랑 워드랑 엑셀을 같이 배울 수 있는 기초반이 있어요. 일단 선생님과 같은 목적으로 기초 사업 프로그램 배우고 싶으신 분들이 많이 들어가는 반인데 이거 같은 경우에는 난이도도 낮고 1개월이라는 교육 기간 내에 PPT랑 워드랑 엑셀을 다 배울 수 있어 가지고 활용도가 되게 좋은 반이라고 생각하시면 될 것 같아요. 거리가 좀 가까우신 편이세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">나 대치동이야 우리 집은 근데 내가 직장은 여의도야. 여기도 여기서 집에 오는 길 올 때 배우든지 내가 다 그거는 자유로우니까는요. 시간이 몇 시 몇 시 몇 시에 있어요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어 저희가 잠시만요. 오월달 기준으로는 열한시 반부터 한시 반 월요일부터 목요일 수업이 있고요. 예 또는 퇴근 이후에 오실 수 있는 7시부터 10시 수업으로 월수 월수금격일반도 있는데 두 개 중에 어떤 타임대가 편하세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">7시에서 10시요 네 오후가 낫긴 내가 11시 반 월요일 날 11시 반에 내가 다른 거 하나 강의 듣는 게 있어 갖고 월요일 11시 반이 안 되네. 11시 반이나 1시 반도 좋은데 그럼 밥을 못 먹잖아 점심을 못 먹잖아 매번 그래 하면 저녁을 해야 될 것 같아요. 그럼 지금 저녁 여의도에도 있어요 여의도에도 있어요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아니 없어요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">없어요. 네 그럼 강남에 집에 오다가 올 때 하면 되는데 네 월수 월수요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">월수월수금으로 금요일이 격주에 한번 있는데요. 선생님 이걸 제가 한번 제안드리고 싶은 게 일단은 두 가지 방법이 있는데 지금 컴퓨터를 잘 못 다루시는 상태라고 하셔가지고 통화로 얘기 오가는 건 사실 많이 이해가 어려우실 것 같아서 한 번 차례 퇴근 이후에 방문하셔가지고 정확하게 안내받으시고 일정표랑 어떤 과목 공부하는지 그리고 저희 수강생한테 어떤 것들이 있는 선생님께서 공부함에 있어서 저희가 어떤 걸 도움을 줄 수 있는지 이걸 먼저 대면 상담을 통해서 안내받아보는 방법도 있고 또는 비대면으로 결제 비대면 등록 방법도 있긴 한데 저는 사실 1번은 조금 더 추천드리는 편이거든요. 그래서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">수강료는 얼마예요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">수강료는 저희 원수강료 기준으로 녹화본 강의 포함된 강의가 40만 원인데 여기서 지원받으시면은 지원 혜택 조회는 해드릴 거고 개인 사업자는 법인 사업자 분이세요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니야 개인이에요. 아니 사업자가 아니고 그냥 개인이에요. 직장인 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아 그러면은 재직자 대상 수강료 지원 혜택 조회는 해 봐 드릴 건데 이게 개인정보보호법상 통화로 몇 년생이고 이런 게 오갈 수는 없어요. 네 저희가 지금 20주년 이벤트 하고 있어 가지고 방문만 하시더라도 추가적인 수강료 지원 혜택이라든지 이런 거 제공해 드릴 거 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">나이가 있으면 혜택이 있나요? 나이 많은 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">맞아요. 몇 년생이세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">나 오십육 년생 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 시니어 라인 분들은 저희가 평생교육 지원금 혜택 장학 제도가 따로 있어 가지고 그걸로 신분증 지참해서 방문해 주시면 조회해 드릴게요. 예예예 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그 주차할 수 있어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아 주차 가능합니다. 건물 지하에 바로 있고요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면은 제가 내비 하나 찍어 갈 수 있게끔 주소나 학원 이름이나 주소 하나만 좀 부탁드립니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 근데 제가 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내가 네이버에 그냥 검색한 거라서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래요. 제가 일단 오늘은 불가능하고 내일 같은 경우에는 완전 오전 타임 가능한데 혹시 11시 괜찮으세요? 내일 예 그럼 내일 열한시 후 점심 전에 끝내드릴게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">열한시 그렇지 열한시 그러면 열한시 이전은요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">열시 가능합니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">야 10시 네 차라리 10시가 낫겠네. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">내일 10시가 좋으실까요? 예예예 알겠습니다. 그럼 제가 내일 10시로 상담 예약을 먼저 잡아드리고 선생님께서 방문에 참고하실 수 있도록 예약 문자랑 약도는 따로 발송을 해드릴 테니까 내일 뵙고 제가 자세한 안내 도와드리는 걸로 하겠습니다. 알았어요. 알겠습니다. 그럼 통화 끊고 잠시만요. 제가 카톡 추가되는지 한번 볼게요. 주소 해 주세요. 아 네 카톡 보내드릴게요. 네 네 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 라포·취향 티키타카 (9분) <span>· 85턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 레퍼런스 채널로 라포 + &quot;대졸도 프리미어 못 다뤄요&quot; 안심 — 취미→니즈 구체화 <span class=\"mute\">(멘토 43·고객 42턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 여보세요 안녕하세요 김○정 님 맞으실까요? 네 네 저희 SNS 통해서 그 영상 편집 과정 문의 주신 SBS 아카데미입니다. 네 네 혹시 잠시 통화 가능하실까요? 네 네네 현재 좀 어떤 상황에서 이 영상 편집 공부 희망하시는 걸까요? 네 이 영상 편집 공부 어떤 이유로 희망하고 계실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 그냥 관심 있어서요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">좀 관심이 있으시고요. 그러면은 이 영상 편집 쪽으로 취미 취업 아니면 업무 보충 되게 다양할 것 같은데 희망하시는 이유가 혹시 좀 어떤 이유 때문이실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">취미로요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">취미로 좀 희망하시고요 그럼 좀 이걸로 통해서 유튜브를 좀 해보고 싶으신 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 그 그렇죠 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어 그럼 네 유튜브로 좀 희망하시는 거 맞으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">왜냐하면 영상 쪽이 워낙 분야가 다양하다 보니까 한번 여쭤본 거고요. 네 그럼 ○정 님께서 좀 취미로 만들어보고 싶으신 영상물이 혹시 있으세요? 뭐 예를 들어 저 이런 이런 유튜버 팬인데 저 이런 분처럼 만들어 보고 싶어요 같은 거요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 어 어 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">정말 편하게도 괜찮아 어떤 분은 게임 유튜버도 말하고 어떤 분은 강민경도 말씀하시고 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">다양해요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">우주아마나 심창민 그런 영상 좋아하거든요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그 우주 하마 님 아마 배틀그라운드 하시는 분 아니에요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그쵸 근데 옛날에 했었는데 요새는 종합 게임 유튜버로 바뀌어서 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러네요. 지금 검색만 했는데 이상하다. 예전만 해도 배틀그라운드 밖에 없었는데 썸네일에 하나도 안 보이네요. 이제 그리고 이제 신창민 같은 분으로 조금 더 희망하시고요 편집도 네 음 혹시 그럼 관련해서 뭐 영상 편집 공부해보신 적은 있으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 학교를 영산고등학교 나오긴 했는데 이제 잘 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">못해서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 잘 배우지는 않았어요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">괜찮아요 학교에서 이론을 많이 알려주지 프로그램을 친절하게 처음부터 끝까지 알려주는 편은 아니라서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그렇죠 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래서 아마 ○정 님 같은 분들이 되게 많이 와요. 참고로 대학교 졸업해서도 트리미어 못 다루시는 분들 되게 많아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">놀랍게도 그래서 아마 또 문의를 주신 것 같네요. 네 네 그러면 ○정 님께서 일단 그 고등학교 쪽을 영상 쪽에 나오고 대학 지금 졸업 중이신 거 아니면 뭐 어떤 거 하고 계세요? 어떤 사항이신 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">대학은 졸업하고 그냥 알바하고 있어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 나중에 결국 우리 알바만 하고 살 거 아니라면은 결국 취업이란 걸 해야 될 텐데 취업도 좀 유튜브 영상 편집자로 좀 막 희망 중이세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 하면 좋죠 저는 근데 그게 마음대로 되는 게 아니니까 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">왜냐하면 저희가 대형 전문 취업 학원이기도 하기 때문에 우리가 공부를 통해서 포트폴리오 만들면 취업 연계나 MOU 맺은 회사로 인턴도 보내드려요. 네 근데 또 그런 것도 또 하나서 혹시 김블루 아세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 알죠? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">아시죠? 우즈하마랑 한때 같이 또 컸었던 베틀 갈란드 하면서 그분 유튜브 영상 편집자를 저희 학원에서 구인구직해가지고 저희 학원 수강생이 지금 일을 하고 있어요. 실제로 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그런 식으로도 ○정 님이 원하는 스트리머 또는 원하는 외주 작업 프리랜서로도 일을 할 수 있기 때문에 충분히 공부를 한다면 그리고 ○정 님이 물론 대학교를 나왔으면 나왔고 졸업을 했다는 뜻은 이쪽 분야에 아직 관심이 있다는 뜻인 거잖아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">응 그렇기 때문에 그 전공 살려서 충분히 공부하면 본인이 희망하는 영상 쪽으로 취업은 충분히 가능해요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">혹시 ○정 님 프로그램 좀 어떤 거 다뤄보셨어요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">프리미어 조금 해봤어요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">프림이요 애팩은요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">안 해봤어요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">앱텍은 안 해봤어요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">학교에서 살짝 배웠던 것 같긴 한데 근데 잘 기억이 안 나요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠 그럼 포토샵이나 일러스트는요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그것도 해보긴 했는데 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">해보긴 했는데 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 다 까먹어서 잘 못하겠어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">잠깐 발만 담가 놓은 게요. 세상에 왜냐하면 보통 신창맨 같은 경우에는 포토샵으로 이제 눕기 따가지고 이미지 보여주는 경우가 많고 우주하마 같은 분들은 이제 게임 유튜브다 보니까 막 자막이 따라다니고 막 그러잖아요. 임팩트적인 거 네 그런 거 보통 프리미어로 힘드니까 애프터 임팩트로 하거든요. 네 그래서 한번 여쭤본 건데 이거 기초도 한번 해야 될 필요는 있겠네요. 대학교에서 안 잡혀 있다라고 한다면은 그러면 지금 ○정님께서는 아르바이트 한다고 하셨는데 혹시 몇 시부터 몇 시 정도까지 뭐 하세요? 일은 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">10시부터 한 여섯시까지요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">까지 그러면 공부 같은 경우에는 좀 저녁 시간대로 희망하고 계실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 근데 저녁에도 있나요? 그런 게 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 당연히 있죠. 저희 아침 점심 그리고 오후 저녁 시간대 그리고 주말도 있어요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래서 희망하시는 데 맞춰서 당연히 스케줄도 짜드릴 거고요. 그럼 ○정 님께서는 언제 언제 요일에 좀 일을 하세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저희 월화 쉬고 다 일해요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">월화시고 오히려 이제 월화에 쉬시면 그럼 충분히 저녁 시간대로 도와드리면 괜찮을 것 같고요. 그럼 혹시 저희 강남 본원에 연락을 주셨는데 거리는 좀 가까우실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 집에서 30분이면 가요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어 아르바이트도 그럼 그 근처예요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 알바는 서울대입구 쪽이요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">서울대 입구 쪽이면 또 가깝네요. 그나마 강남이래요 네 그럼 음 그럼 이제 저희가 보통은 이제 결국에는 지금 필요한 게 뭐 프로그램도 프로그램이지만 ○정 님이 결국에 취업을 희망한다면은 이쪽 분야로 저희 학원이 무료로 취업 상담 및 진로 상담도 같이 도와드리고 있어요. 네 그래서 ○정 님만 괜찮다라고 한다면 당연히 이게 만약에 진행할 경우에는 본인도 어떤 커리큘럼 어떤 공부 그리고 어떤 결과물을 내가 이 공부 통해서 낼 수 있는지도 확인이 필요하잖아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그리고 또한 아까 말했던 그 김블루 있죠 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그분이 어떻게 공부했는지도 아마 ○정 님이면 좀 궁금하지 않을까도 싶고요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">궁금해요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어 아니 아니요. 아직 아직은 안 궁금해요. 그래요. 예 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">위에네요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">편집 공부하다 보면 더 관심이 생기면 그때 궁금하지 않을까요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어련히 따라올 것 같다라는 거죠. 알아서 이렇게 아니야 뭐 그럴 수 있죠 뭐 사람마다 다른 거니까요. 그러면은 결국에 근데 그런 부분들은 결국 본인이 봐야 느낄 수 있는 거잖아요. 우리 ○정 님이 커리큘럼이나 그래서 이거를 보통 내방 상담 통해서 이렇게 자세하게 좀 상담을 도와드리고 있어요. 네 혹시 ○정 님 괜찮으면은 내일이나 수요일 내일은 쉬신다고 하셨잖아요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">혹시 1시 정도에 내방 가능해요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 괜찮아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 내일 잠시만요. 괜찮으면은 내일 1시로 좀 상담 일정 잡아드릴 거고 ○정 님 이 전화번호로 제가 상담 일정 문자랑 약도 보내드릴까 해요. 네 그래서 혹시라도 일정 변동 사항 생기시면은 꼭 한 번만 미리 말씀해 주시고 추가로 ○정 님이 만들고 싶은 영상물이 있다라고 한다면 그거 하나만 갖고 와 주세요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">알겠습니다. 이른 아침부터 전화 받아주셔서 감사하고 내일 한번 뵐게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 어 근데 궁금한 게 혹시 비용이 많이 들지 않나요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">이거 같은 경우에는 국비 지원 혹시 들어보셨어요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">국비 지원 통해서 본인 수강료 부담은 많이 줄어들 거예요. 그래서 막 진짜 대학교 한 학기 등록비 막 그렇게 안 나올 거니까 걱정 안 하셔도 돼요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">왜요? 막 500만 원 600만 원 생각하신 거예요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니요. 근데 대학도 국가장학금 나와서 거의 공짜로 다녔었는데 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">이거 부분은 국민 취업 지원 제도라고 있어요. 그래서 그 부분들은 제가 내일 같이 안내 도와드리면서 설명해 드릴게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 알겠습니다. 회장님 내일 뵐게요. 네 네.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 대표전화 즉시 클로징 (3분) <span>· 25턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 방문 의사 분명한 인입 → 군더더기 없이 목적 확인·시간 확정 — 효율 모범 <span class=\"mute\">(멘토 12·고객 13턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">여보세요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 여보세요. 곽○지 님 맞으실까요? 네네 네 저희 대표 전화 통해서 저희 영상 편집 과정 문의해 주신 SBS 아카데미 교육 담당자 ○○○ 멘토입니다. 네 네 일단은 전달받은 걸로는 오늘 좀 바로 방문해서 좀 상담 희망한다고 전해 들었는데 맞으실까요? 네 네네 일단 그전에 좀 어떤 상황에서 정확히 어떤 영상 편집 희망 하는지 한번 여쭤봐도 괜찮으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네이버로 봤는데 제가 포토샵이랑 AI 그리고 영상 편지 몇 개 커리큘럼이 있더라고요. 네 그래가지고 이제 영상 편집을 좀 배우고 싶어서 연관된 거랑 해서 네 배우려고 하는데 그거를 좀 구체적으로 이제 설명을 좀 듣고 싶어서 네 상담을 요청드리긴 했거든요. 이쪽으로 좀 포트폴리오를 쌓고 싶어서 제가 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">포트폴리오 혹시 그럼 지금 이 공부가 취업을 희망하시는 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">치열 희망하시고 그럼 ○지 님 오늘 혹시 방문은 언제가 좀 편하실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">오늘 한 8시 반에서 9시쯤 혹시 괜찮으실까요? 시간 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">저녁이요? 네네 그러면은 좀 일찍은 가능한 8시나 7시나 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">제가 8시에는 일정이 있어가지고 방문이 어려울 것 같아서요. 좀 그 시간대는 좀 어려우실까요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">가능해요. 네 그럼 8시 30분에는 괜찮으세요? 네네네. 그럼 8시 30분에 뵙고 제가 취업 상담 영상 관련돼서 한번 도와드리고 추가로 그 영상 쪽이라고 한다면은 유튜브 2D 3D 다양한데 어떤 쪽이실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">유튜브를 일단 기본적으로 좀 배우고 좀 투디랑 3D도 좀 나중에 배울 수 있으면 배우고 싶긴 하거든요. 아니면 같이 배울 수도 있나요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">근데 당연히 보통은 취업 요즘의 니즈 자체도 td보다는 3D가 취업자가 훨씬 넓다 보니까. 네 3D를 많이 선호하시긴 해요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">AI 툴 이용해서 쓰는 걸까요? 그게 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">실제로는 3D 2도 배우고요. AI를 활용한 3D 영상 편집하는 것도 배우는 수업도 있어요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어떤 걸 어떤 걸 주로 다른 분들은 같이 혹시 배우시나요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">대부분 다 네 보통은 영상 편집 쪽으로 취업을 하고 싶다라고 한다면은 네 보통은 2D보다는 3D 쪽 즉 3D 모션 그래픽 쪽으로 취업처를 많이 준비를 하세요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">왜냐하면 취업률이 훨씬 더 높기 때문에 네 가능하고 그럼 근데 혹시 그 ○지 님께서 현재 지금 취업 준비생이신 걸까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">취업 준비생이시고 그럼 이쪽으로 비전공자이신 거죠? 네 네 그럼 이 내용을 바탕으로 상담도 해드리기로 하고 오늘 여덟시 전에도 일정이 다 있으신 거죠? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">8시에 이제 제가 끝나가지고 일정이 금방 가긴 하는데 강남에서 최대한 8시 반 맞춰서 이제 최대한 빨리 도착하려고 해보도록 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">알겠습니다. 그럼 최대한 맞춰서 도와드릴 거고 그러면 그날 제가 오늘 좀 이따 8시 반에 뵙고 상담 자세하게 도와드릴게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 방문 명분 — 니즈 맞춤 <span>· 38턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — &quot;단순 등록이 아니라 니즈 맞춰 상담 먼저&quot; → 포폴 보여주며 방문 유도 <span class=\"mute\">(멘토 20·고객 18턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 안녕하세요 민○○ 님 되실까요? 저희 SBS 아카데미 학원입니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 안녕하세요 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 안녕하세요 저희 학원 측으로 모션 포트폴리오 문의를 남겨주셔가지고 안내차 연락드렸는데 잠깐 통화 괜찮으세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네네. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">좋습니다. 보통 포트폴리오 만들 이렇게 문의 주시는 분들은 취업이나 이직 준비하시는 분들이 되게 많은데 혹시 ○○ 님은 어떤 상황으로 이렇게 남겨주신 걸까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저도 취업이나 대학원 준비로 포트폴리오를 만들고 싶은 건데요. 네네 근데 제가 관련 수요를 못 다뤄 가지고 이 포트폴리오 과정은 그러면 기본을 할 줄 알아야 참여하는 과정인 건가요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">보통 그렇기는 한데 ○○ 님께서 좀 쓰셔야 되는 툴이 어떻게 되시는 거예요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">애프터 이펙트나 그런 거를 배워야 되는 상황이면 네 그럼 저한테 적합한 좀 과정을 추천해 주실 수 있어요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">일단은 저희 학원은 단순히 등록하고 수업 받고 이런 시스템보다는 네 어쨌든 개개인마다 원하는 그 결괏값이 다들 다르시잖아요. 네 그래서 거기에 맞는 교육 과정을 먼저 설명드리고 설정한 다음에 그다음에 수업 진행하는 형식이라서 일단은 ○○ 님 좀 상황에 맞춰가지고 상담을 먼저 도와드리고 있어요. 지금 취업이나 대학원 진학 때문에 포트폴리오가 필요하다고 하셨는데 보통 그런 경우에는 2D 모션 그래픽이나 3D 모션 그래픽 중 선택을 하고 하시긴 하거든요. 네 근데 이제 보통 대학원이나 취업하시는 경우에 3D 쪽으로 많이 하긴 하는데 ○○ 님은 좀 원하는 스타일이 따로 있나요? 2D 3D 이런 식으로 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니요. 아직 크게는 없는데 네 그냥 대략적으로 영상 관련해서 영상 일단 미디어 아트나 그쪽으로 배우고 싶은 거거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러면은 일단은 기본적인 어도비 프로그램인 포토샵 일러스트 아니면 앱 탭 요 정도는 기본으로 할 줄 아셔야 되고요. 네 이제 조금 더 좋은 회사나 이런 쪽으로 좀 좋은 급여로 받고 싶으신 거면은 시네마 포디를 제일 많이 써요. 이 모션 포트폴리오 쪽은 네 그래서 그거 관련된 것들까지 같이 안내를 드리는 게 좋을 것 같긴 한데 일단은 ○○ 님께서 뭔가 정확한 니즈가 있거나 이런 게 아니다 보니까 네 저희 학원생들 수강하고 포트폴리오 관에서 만드는 그 포트폴리오들이 있을 거잖아요. 네 그래서 여러 가지 보여드리면서 ○○ 님이 어떤 스타일에 좀 맞는 건지 체크를 한 다음에 네 그다음에 2D인지 아니면 3D인지 구분을 하고 거기에 이제 필요한 툴을 좀 추천을 드리는 식으로 한번 진로 상담을 먼저 해보는 게 제일 좋을 것 같긴 해요. 네 근데 그러면은 일단은 대학교 자체는 4년은 수료를 하신 걸까요? 대학교는 다니고 계시는 거죠 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네. 대학 졸업했고 네 일을 하다가 지금 퇴사를 한 상황이거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">재직을 하셨으면 혹시 관련해서 재직하신 걸까요? 유모션 그래픽 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니요 아니요 아니 전혀 다른 분야여서 네네 그래서 제가 지금 비전공자인 상태에서 새로 시작하는 거거든요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">비전공인 거예요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 저는 미술을 하긴 했는데 전혀 다른 분야였어 가지고 네 비전공자인 상황입니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">미술은 하셨어요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">근데 요즘에는 이런 모션 그래픽 디자인 계열에서는 미술 쪽 많이 쳐주거든요. 네 그래서 제일 이제 디자이너한테 부족한 게 좀 아트웍 쪽인 거라서 툴만 쓸 수 있으신 분들만 있다 보니까 그래서 그런 아트웍크적인 소양을 가지고 있는 분들이면 오히려 채용할 때 좀 유리한 편이 있어서 그 파인아트 순수 미술 쪽이신 거예요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 맞아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러시군요. 요즘 파인아트 하시는 분들이 이런 것들 많이 문의를 주셔서 그러면 대학 전공이나 이런 것들은 좀 나이스한 상황인 거고 네 이제 ○○ 님께서 좀 메인이 되는 툴 정도 먼저 배우시는 게 제일 좋긴 한데 네 그 부분은 한 번 방문해서 안내를 드리는 게 좋을 것 같아요. 저희가 방문 상담 예약제로 운영을 하다 보니까 지금 그러면 재직은 혹시 아예 안 하고 계신 상황인 걸까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 맞아요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그러시군요. 혹시 실업급여나 뭐 이런 것들은 받아보고 계세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아니요. 실업급여는 안 받고 있고 네. 지금 내일배움카드만 발급해 있는 상황이에요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그렇죠. 그래서 이렇게 취업 준비하시는 분들 내일배움카드 활용을 또 많이 하는데 아마 ○○ 님께서 이런 것들을 사용을 잘 안 해보셨을 거예요. 네. 그래서 그거를 어떻게 쓰는 건지 그리고 국비 지원도 내일배움카드뿐만 아니라 다른 지원 제도들도 되게 많거든요. 요즘은 네 그래서 그런 것들은 어떤 거 있는 건지 그리고 어떻게 활용하는 건지 그런 것도 종합적으로 안내를 드리려고 하면 드리면 좋을 것 같아서 일단은 카드는 발급을 받으신 거잖아요. 네 네네 카드 챙겨서 오시면 그거 관련된 지원금도 조회해 드려요. 네 한번 요번 주 중에 방문 가능하신 날짜 있으세요? 오늘 괜찮다고 하시면 오늘도 괜찮고 아니면 금요일까지 그 일정 사이에 괜찮은 날짜 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">오늘은 몇 시에 돼요? </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">어 잠시만요. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">제가 한시 두시 이때는 일정이 있고 그 이후로는 다 괜찮거든요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그래요. 네 그러면 한 5시쯤도 돼요. 혹시 5시 5시쯤요 네. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 5시 괜찮으셔서 오늘 날짜 5시로 예약 도와드릴 거고 저희가 강남역 9번 출구 메가박스 건물 5층에 있거든요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네네 잘 모르실 수 있으니까 지도 예약도는 제가 보내드리고 네 혹시나 유튜브나 인스타그램으로 네 좀 이런 거 만들고 싶은데 싶은 거 있으면 그냥 캡처를 하시던 저장을 하시던 해가지고 보여주시면 더 도움 되긴 하거든요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네네 </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">그래서 혹시나 그런 거 있으면 한번 오늘 와서 보여주시겠어요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 알겠습니다. 5시로 예약 도와드리고 다시 뵙겠습니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">멘토</div><div class=\"tx\">네 감사합니다.   clovanote.naver.com</div></div></div></div></details>\r\n<h3 class=\"sub3\">B. CS팀 선정 우수 컨택 — 전 10건 풀스크립트 <span class=\"src s-keg\">CS 매뉴얼</span></h3>\r\n<p class=\"intro\">CS팀이 AI 컨택 인사이트로 선정한 전국 우수 컨택 전건. 주제(도입·질문과 목적·공감·상담태도·바른마무리)별 정렬. 직원 익명(지점+역할).</p>\r\n<details class=\"full\"><summary>🎧 바른 컨택 도입부 <span>· 59턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 도입 4요소(본인확인·소속·용건·통화허락)의 CS팀 선정 모범 <span class=\"mute\">(멘토 30·고객 29턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 여보세요. 전화번호 네 전화받았으니까 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 안녕하세요. 혹시 이○성 님 맞으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 맞습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 이사님 안녕하세요. 여기 SBS 아카데미 웹툰 학원에서 연락드렸는데요. 네 네 어제 저녁쯤에 저희 학원 홈페이지 통해서 웹툰 과정으로 그리고 웹툰 피리 과정까지 함께해서 수강료 조회로 문의 남겨주셔서 연락을 드렸습니다. 네 네 해당 과정 담당하고 있는 이정영 멘토라고 하는데요. 혹시 지금 과정에 대해서 좀 안내를 해드리려고 하는데 잠시 통화 괜찮으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">시간이 얼마 정도 걸릴까요? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">한 5분 10분 정도면 될 것 같습니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">죄송합니다. 지금 그러면 좀 빠르게 수강료는 어떻게 되는지 좀 알 수 있을까요? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">저희 이게 안내를 해드리려고 했던 게 웹툰 과정과 그리고 수강료 지원을 좀 안내를 해드리려고 했던 건데요. 네 저희가 고용센터에서 고용노동부에서 인정을 받은 우수 훈련 기관이에요. 네 네 그러면서 수강료를 어느 정도 지원을 받을 수 있는 제도들이 좀 있거든요. 네 네 그래서 혹시 해당되는 부분이 좀 있는지도 여쭤봐야 될 부분이 좀 있는데 실례지만 지금 현재 몇 년생이실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">98년생입니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">98년생이시고요. 그러면 대학교는 지금 졸업이 되신 상태실까요? 네 졸업했습니다. 알겠습니다. 혹시 그러면 지금 일을 하고 계시는 상황일까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아저 지금 취업 준비 중입니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">취업 준비생이시고요. 그러면 제도 사용할 수 있는 제도들이 많이 있을 것 같아요. 국민 취업 지원 제도라든지 근데 다만 이제 해당 과정에서 이쪽 분야로 취업을 하려고 하시는 분들로 대상으로 저희가 국비를 지원해 드리고 있거든요. 네 혹시 웹툰 쪽으로 취업을 좀 생각을 하고 계시는 걸까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 PD 쪽 생각하고 있습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그래요. 그러면 수강료 지원을 좀 많이 받아보실 수 있으실 거예요. 네 네 지금 그러면 기존에 대학교 전공이 좀 어디 쪽이세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">일본 대학에서 스토리 만화를 전공했습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그래요. 보통 이제 저희가 국비 조건을 좀 보는 기준이 나이라든지 그리고 학과가 연관성이 있는지 그리고 취업을 준비하고 있는 취준생인지 여부를 체크를 합니다. 근데 조건에 다 부합이 되기 때문에 웬만큼 지원을 다 받아보실 수 있을 것 같아요. 네 네 다만 이제 몇 개월 정도 취업 준비 기간을 설정하고 있는지 그리고 PD 과정 같은 경우에 또 CP사라든지 스튜디오 그리고 플랫폼 이쪽 어떤 계열로 취업을 지금 목표를 잡고 있는지에 따라서 교육 과정들이 조금 더 다릅니다. 다르다라는 거는 기간이 좀 짧아질 수도 있고 좀 더 길어질 수도 있어요. 네 네 혹시 어느 정도 지금 생각을 하고 있는 단계인지 여쭤봐도 괜찮을까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">플랫폼 같은 경우에는 아무래도 좀 규모가 있는데도 노르는 보고 있지만은 그래도 이게 일단 될 수 있는 한 어느 정도 조회수가 나올 수 있는 곳이면 어디든지 괜찮다는 입장입니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그러면 CP사 쪽이라기보다는 일단 첫 구직 자체를 플랫폼 쪽으로 좀 바라보고 있는 상황일까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 다 그렇습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그럼 웹툰을 좀 그려보거나 드로잉을 해보신 경험이 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 스토리 만화 쪽이라서 그림 쪽은 그렇게 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">일반적으로 PD 준비하시는 분들이 그림 쪽은 이제 원래 취업을 하게 되면 채색이라든지 선화 이런 작가 파트가 따로 있어요. 네 그래서 네 시나리오 작가분과 피디님과 콘티를 어떻게 설정할 건지 이런 내용을 구상하면서 상의를 하는 직종이거든요. 네 네 그래서 스토리 연출 시나리오 과정과 그리고 피디 과정 이렇게 입문을 많이 하시고요. 네 네 스토리 과정은 보통 6개월 정도 배우는 편이고 연출 PD 과정은 한 4개월에서 6개월 정도 이렇게 배우는 편이거든요. 네 네 저희가 그리고 평일 반이 있고 주말반이 있기 때문에 실수가 조금 더 다릅니다. 그래서 기간이 조금 차이가 날 수도 있고요. 다만 이제 좀 더 내가 스펙업을 좀 하고 싶다고 한다면 스케치업이라고 혹시 들어보셨을까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">들어본 것 같습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 스케치업과 그리고 드로잉을 한 번도 해보신 적이 없으세요? 그러면 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그로잉 해본 적은 있으니 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그래요. 포토샵과 클립 스튜디오 중에 어떤 걸 좀 사용해 보셨나요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">글래스 저기 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">잘하셨네요. 보통 이제 클튜랑 포토샵을 둘 다 다룰 줄 아는 분들을 보통 채용을 많이 하고요. 네 그리고 스케치업이라는 이제 배경 모델에 쓰이는 그런 배경 디자인에 쓰이는 웹툰의 네 그런 프로그램도 활용할 줄 아는 여부가 있을수록 조금 더 유리하기는 합니다. 네 네 다만 이제 저희 학원에서는 이 웹툰 회사 스튜디오와 취업을 연계하고 있는 기관이에요. 네 네 그래서 뭐 원하시는 플랫폼이 있거나 스튜디오가 있다면은 좀 더 거기에 맞춰서 취업을 좀 준비할 수 있게끔 도와드리는 부분도 있고요. 네 네 어느 정도는 이런 학원이다라고 설명을 좀 해드리고 있는데 예상하셨던 그런 내용들이 좀 맞으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">어느 정도 유지를 하는 것 같네요. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">일단 수강료는 한 6개월 정도 다니는 경우에는 거의 전액을 지원받으실 수 있을 정도로 해당 사항이 잘 부합이 되세요. 네 다만 이제 욕심에 따라서 한 6개월 정도는 더 준비하시는 경우가 많기 때문에 대부분 네 그래서 그 부분은 따로 이제 또 지원을 받을 수 있는 제도들도 함께 조회해서 알아봐 드릴 수가 있거든요. 네 네 혹시 지금 취업 준비생이라고 하신다면 알바는 좀 하고 계시는 상황일까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아르바이트 통역 알바 속으로 하고 있습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">프리랜서이신 거죠? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 일단은 아르바이트만 하고 있습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">4대 보험이 안 들어가시는 게 맞죠? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">4대 보험 그거는 기간이 좀 길어가지고 들어갈 수도 있을 것 같은데 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">어 그것도 한번 체크 한번 해 주시면 좋을 것 같고요. 한번 학원에 오셔서 국비 신청이나 조회를 좀 같이 도와드릴 수가 있어요. 저희가 고용센터랑도 연계가 되고 있는 학원이라서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 그러면은 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">학원에 한번 일정을 잡아서 방문을 해보시는 게 제일 좋을 것 같은데 네 이번 주 내로 좀 편하신 일정이 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">이번 주 내로는 좀 어려울 것 같고요. 혹시 전화상으로는 전화상으로는 대략적인 수강료에 대해서 말해줄 수 없는 건가요? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그 지금 일단 4대 보험 유무를 체크해 봐야 돼요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면 4대보험 요를 되는 경우 안 되는 경우 이렇게 두 가지가 알려줬던 건가요? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">사실 지금 제가 초반에 여쭤봤던 나이라든지 그런 부분들은 다 해당이 되는데요. 4대 보험 유무에 따라서 지원금이 달라져요. 그리고 주 몇 시간 정도 근무를 하는지에 따라서도 달라지고 다만 그 제일 중요한 거는 이제 배우려고 하는 기간이에요. 네 네 지금 어떤 쪽으로 취업을 하려고 하는지 이제 PD 쪽이라는 거는 정해져 있지만 PD 쪽 취업을 한다는 게 또 계열이 좀 여러 가지가 있거든요. 네 그거에 따라서 배워야 하는 그런 수업 내용들이 좀 더 추가가 될 수도 있고요. 네 그렇다 보니 네 저희가 이제 시각적으로 준비되어 있는 그런 커리큘럼도 있지만 보통 일반적으로 어떤 회사에 가려면 어떤 식으로 준비를 해야 되는지 이런 정리되어 있는 자료들이 있어요. 네 네 그걸 보시고 나는 이쪽으로 생각을 하고 있어요라고 얘기를 해 주신다면 그거에 맞게끔 교육 기간을 안내를 해드릴 거예요. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그래야 이제 교육 기간이 정해지고 그래야 지원금이 얼마큼 선정이 될지를 교육 기간에 따라서 달라지기 때문에 그걸 안내를 해드릴 수가 있어서 제가 한번 방문을 해보시는 게 좀 더 정확할 거다라고 말씀드린 겁니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 일단 알겠습니다. 그러면은 면담 같은 경우에는 일요일에 가능한 건가요? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 주말에도 주말에 수업이 있어요. 웹툰 피디의 경우에는요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">오케이 네 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 그러면 다음 이번 주 일요일로 좀 예약을 도와드릴까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">이번 주 일요일은 좀 일정이 있을 것 같고 다음 혹시 오후 몇 시까지 하시는지 할 수 있을까? </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">오후 7시까지 하고 주말에는 7시까지 하고요. 평일에는 10시까지 해요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그럼 잠깐 평일에 10시면은 화물 면담 하면은 소요 시간이 되죠 어떻게 되면 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">1시간 정도 걸릴 것 같은데요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면은 평일 9시에도 될 것 같긴 한데 </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">내일 혹시 방문 가능하세요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">내일 한번 일정 조정해서 방문해 보도록 하겠습니다. 힘들 것 같으면은 힘들 힘들 것 같으면은 문자로 말씀드리겠습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">그러면 제가 카톡으로 제 명함이랑 상담 예약 내용이랑 그리고 약도도 함께 첨부해 드릴게요. 살고 계시는 지역이 신촌역과 좀 가까우실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">심천 연신내에 있다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">많이 가깝네요. 네 알겠습니다. 우선은 상담하게 되면은 저희가 배우는 내용이 중요하잖아요. 네. 네 커리큘럼이랑 강사님 이력이랑 그리고 수업 방식이나 그리고 커리큘럼을 집중적으로 안내해 드릴 거고 취업 연계나 그리고 채용 정보도 함께 제가 봐드릴 거예요. 그리고 국비도 산정을 해 드릴 거고요. 일단 내일 한번 연락 주시면은 제가 최대한 일정 조율해 드리도록 하겠고 카톡 남겨드릴게요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 알겠습니다. 감사합니다. </div></div><div class=\"ln m\"><div class=\"who\">게임신촌 팀장</div><div class=\"tx\">네 네.   clovanote.naver.com</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 질문과 목적 ① <span>· 20턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 질문마다 &quot;왜 묻는지&quot; 선안내 + 니즈 재확인 <span class=\"mute\">(멘토 15·고객 5턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">네 여보세요. 네 아 네 안녕하세요. ○화님 맞으실까요? 아 네 아 네. 저희 문의 남겨주셔서 연락드린 코리아 요리 아트 아카데미 홍대 지점 교육 총괄하고 있는 ○○○ 책임이라고 합니다. 아 네. 지금 혹시 통화 괜찮으실까요? 아 괜찮으시고 어떤 거 조금 궁금하셔서 문의 남겨주셨을까요?</div></div><div class=\"note2\">※ 정확한 소속, 지점명 및 멘토명 소개 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">정통 서양 요리 (네)</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">이쪽으로 조금 과정에 대해서 궁금하셔가지고, 문의 남겨주신 걸까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 그 아예 처음이라 한번 배워보고 싶어서</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 그러시구나. 그러면은 제가 정확하게 도와드리기 위해서 몇 가지 조금 여쭤볼 건데요. 이제 과목이 조리학과가 20가지가 넘다 보니까 정확한 과목 특정 위해 가지고 몇 가지 여쭤볼 건데 일단은 이쪽으로는 처음 배워보시는 거예요. 요리를?</div></div><div class=\"note2\">※ 탐색 질문이 필요한 이유 안내 후 인터뷰 시작 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 아예 처음이요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아예 처음이시고 그러면은 저희가 요리를 배우시는 분들이 계기가 조금 다양한데 취업이나 창업 쪽 생각하시는 분들도 있고 아니면 취미 쪽 생각하시는 분들도 있고 여러 가지가 있잖아요. 진학 쪽 생각하시는 분들도 있고 여러 가지가 있는데, 어느 쪽으로 조금 생각을 하신 걸까요?</div></div><div class=\"note2\">※ 탐색 질문(학습 목적)을 묻는 이유 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">집에서 간단하게 해먹을 수 있게 그냥 취미 같은 걸로</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 취미 같은 걸로 하는 거. 그런데 이제 서양 요리 쪽을 선택하신 게 조금 단순히 내가 양식을 조금 좋아하니까라고 생각을 하신 걸까요? 아니면은 또 다른 이유가 있으실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">제가 파스타를 좋아해서</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 파스타를 좋아해서 아 좋습니다. 왜냐하면, 선택해주신 정통 서양 요리라는 품목 자체가 조금 서양 요리만 딥하게 들어가는 케이스에요. 그래서 A부터 Z까지 해가지고 계란 요리부터 해서 플레이팅이나 아니면은 재료 손질 방법, 이론적인 부분들도 같이 들어가는 수업이다 보니까 사실상 내가 취미성으로 조금 맛있게 해먹고 싶다, 집에서 해먹고 싶다라고 하면은 사실 취미성 수업이 오히려 더 잘 맞아요. 거기 안에서도 양식 파스타라던가 스테이크나 이런 것들도 들어가고, 양식뿐만 아니고 한식 배우고 싶으면 한식 배우고 일식 배우고 싶으면 일식 배우고 이렇게 선택할 수 있는 게 있는데, 양식을 딥하게 들어가고 싶으신 거예요? 아니면 여러 가지 선택해가지고 조금 만들고 싶은 것만 배워보고 싶으신 거예요? 고객: 저는 딥하게 들어가면 좋아해가지고. 처음부터 좀 이름 같은 거 배워서 나중에 응용도 할 수 있으니까 그런 거 배워서</div></div><div class=\"note2\">※ 희망 과정(서양요리) 관심계기를 물은 이유 설명 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 딥하게 들어가는 거 좋아하세요. 아 네. 그러면 정통 서양 요리가 맞을 수 있을 것 같아요. 보통 이제 여러 가지 다양하게 내가 원하는 것만 배우고 싶어요라고 하시는 분들이 많아가지고, 그래서 한번 여쭤봤고요. 그러면은 거주하시는 쪽은 어느 쪽이세요? 고객: 저도 지금 양천구 거주하고 있습니다.</div></div><div class=\"note2\">※ 고객 니즈에 대한 동의 표현 후 질문의 의도 설명 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 양천구면 홍대가 가장 가깝기는 하네요. 일단은 저희 양식 쪽으로 들어간다라고 하면 달걀 요리부터 해가지고 샌드위치, 파스타도 생면 건면 이런 것들도 있고, 그다음에 소, 닭, 돼지 이렇게 해가지고 비프랭 전부터 시작해가지고 랍스터 하는 것들도 있고, 오리 가슴살 스테이크나 라장 여러 가지 있거든요. 그래서 그 부분 같은 경우에는 조금 디테일하게 들어간다라고 봐주시면 좋을 것 같고요. 일정들이 조금 다양하게 들어가 있어요. 저희가 대형 학원이다 보니까 평일 반도 있고 주말 반도 있고 여러 가지가 있는데, 혹시 뭐 언제부터 배워보고 싶다라고 생각하시는 일정은 따로 있으실까요? 고객: 혹시 그 1번 배우면은 어느 정도까지 수업이 어느 정도 길이에요? 날짜가, 수업 배우는 기간 말씀하시는 거죠.</div></div><div class=\"note2\">※ 학습 과정 및 강의 일정 안내 후 희망 수강 일정 확인 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">기간 같은 경우에는 한 달 정도 봐주시면 돼요. 기간이 그렇게 길진 않아요. 고객: 그러면 주말이 편할 거 같아요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 주말이 조금 더 편하시고 그러면은 언제부터 배울 수 있다라는 시기는 따로 있으실까요? 아니면은 바로도 가능하다, 뭐 이런 게 있으실까요? 고객: 저는 바로도 가능해요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 바로도 가능하시고 좋습니다. 그러면은 일정이랑 스케줄이랑, 그다음에 품목들도 한번 보시기는 하셔야 되잖아요. 어떻게 만드는지, 품목들이 어떤 게 있는지 이런 거 보시고 정하시는 게 가장 좋을 것 같기는 한데, 일단은 저희가 이게 외부로 커리큘럼이 반출이 안 돼요. 왜냐면, 뺏겨가는 경우가 너무 많아서. 그래서 어차피 수업 이렇게 궁금하다라고 하시면은 시설도 보셔야 되고 수업하는 방식이나 이런 것들도 안내해 드리려면 보시는 게 정확한데 만약에 오신다라고 하면 다음 주 중에 혹시 가능하실까요? 고객: 그러면 다음 주 잠깐 설명 들으러 가는 건가요? 아니면 그때부터 바로 수업을?</div></div><div class=\"note2\">※ 지점 방문이 추가적으로 필요한 이유 설명 후 일정 조율(1) <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">설명 들으러 오는 거죠. 어떻게 돼 있고 이런 것도 보시고, 그다음에 만약에 지원금이 들어갈 수도 있어요. 이렇게 지원금이 새다 보니까 좀 많이 나오는 부분들이 있는데, 그 부분도 조회하러 오시는 게 좋아요. 그거는 신분증 한번 가져오시면 조회가 가능하거든요. 그래서 신분증 한번 가지고 오시면은 제가 정확하게 금액 안내나 이런 것도 가능하다 보니까 사람들마다 지원금 들어가는 게 조금씩은 달라서요. 고객: 그러면은 31일 날 가면 되나요?</div></div><div class=\"note2\">※ 지점 방문이 필요한 이유 안내(2) <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">31일 주말 가능하신 걸까요? 언제든 상관없고요. 그럼 제일 빠르게 되면 언제? 고객: 월요일 화요일</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">월요일 화요일도 가능합니다. 27일로 드리겠습니다. 27일 날 저희가 예약제로 진행이 되고 있어서 시간대가, 만약에 27일 날 오시면은 제가 오전에는 11시 가능하고요. 오후에는 3시 이후에 가능한데 몇 시가 조금 편하실까요? 고객: 3시로 할게요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 3시로 네 좋습니다. 그러면은 제가 카카오톡으로 명함이랑 약도 보내드릴 텐데 그 부분 한번 확인해주시면 되고, 오실 때 신분증 꼭 가지고 오시면은 제가 정확하게 안내해드릴 수 있다 보니까 그 부분만 참고 부탁드리도록 하겠습니다. 네 감사합니다. 그러면 제가 정리해서 한번 보내드릴 거고요. 저희가 15층 고층에 위치해 있어요. 그래서 오실 때는 15층 고층 엘리베이터 탑승하시고, 인포데스크에다가 성함 말씀해주시면, 상담 오셨다고 말씀해 주시면 금방 안내 도와드릴 거예요. 고객: 알겠습니다. 네 감사합니다. 1. 정확한 소속·지점·이름 소개 → 신뢰감 형성 2. 탐색 질문 필요 이유 안내 → 고객 협조 유도 3. 학습 목적(취미/취업/창업/진학) 파악 → 맞춤 추천 기반 마련 4. 관심 과정 선택 계기 확인 → 니즈 심층 파악 5. 고객 니즈에 동의 표현 후 다음 질문 의도 설명 → 신뢰 구축 6. 학습 과정·일정 안내 후 희망 수강 일정 확인 → 방문 연결 준비 7. 방문 필요 이유 명확하게 설명(커리큘럼 보안, 지원금 조회) → 방문 동기 부여 8. 방문 일정 조율 및 신분증 지참 안내 → 실질적 준비 사항 전달 9. 초행길 고객을 위한 층수 및 인포데스크 안내 → 세심한 배려 표현</div></div><div class=\"note2\">※ 초행길인 고객을 배려한 지점 층수 및 인포데스크 문의 방법 안내 <span class=\"mute\">(CS팀 주석)</span></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 질문과 목적 ② <span>· 36턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 대리문의에 &quot;어머님도 당황스러우셨겠어요&quot; 공감 + 목적 깔고 질문 <span class=\"mute\">(멘토 26·고객 10턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">여보세요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 네 여보세요. 아 네 안녕하세요. 그 홍○희님 맞으실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네, 네 그런데 저희 아들</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아들 예</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아들 그 쿠킹 클래스 그거 신청하려고 연락드린 거예요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 그럼</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">제 이름이 홍다이고요. 예 저희 아들은 강규범이에요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 그러셨구나. 안 그래도 한 번 더 문의를 남겨주셔가지고, 일단은 저는 교육 총괄하고 있는 ○○○ 책임이라고 하고요. 이제 저희 코리아 요리 아트 아카데미 홍대 지점으로 문의 남겨주시기는 했는데 가장 가까운 지점이 홍대 지점은 맞으실까요?</div></div><div class=\"note2\">※ 정확한 소속, 지점명 그리고 멘토명 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 집이 여기 장안동이거든요. 동대문구 장안동이요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 그러면은 이쪽이 가깝기는 할 텐데 그러면은 이쪽 쿠킹 클래스 쪽으로 어떤 부분들 궁금하셔서 문의 남겨주셨을까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">얘가 지금 이번에 (네) 입학하거든요. 요리 푸드 조리학과 고등학교에 들어갔는데</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">네, 그러면은</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그 전에 연습을 좀 예 맞아요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 그러시구나. 그러면은 제가 정확하게 도와드리기 위해서 몇 가지 여쭤볼 텐데 이제 고1로 올라가는 거죠.</div></div><div class=\"note2\">※ 탐색 질문이 필요한 이유 안내 후 정확한 학년(나이) 확인 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 네</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">학교는 혹시 어느 쪽으로 진학했을까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">대경</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">대경고등학교</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 대경 뭐냐면 생활과학고요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">아 재경생활과학 오. 아 그러면은 이쪽으로 이렇게 진학을 한다라고 했을 때 그 전에 경험해보거나 이런 거는 있을까요? 요리를 배워봤다거나 고객(학부모): 관련해서 배워본 적은 없고 지가 쿠키도 만들어보고 집에서 그렇게 한 거밖에 없어요. 그런데 여기에 갑자기 관심을 가져가지고, 갑자기 학교를 여기를 가게 됐거든요. 그 전부터 요리에 관심은 있었는데, 그냥 취미로만 하겠다고 그랬는데 그냥 여기 고등학교 가려고 했는데 그냥 갑자기 간다 그래가지고</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">어머님도 당황스러우실 것 같아요. 좋습니다. 그러면 고객(학부모): 그래서 요리를 좀 만들 걸 좋아하고 이러는 편이에요.</div></div><div class=\"note2\">※ 고객의 말에 대한 정서적 공감 표현 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">예, 예 아 그러시구나. 조금 요리를 좋아하고, 이쪽으로 이제 진학을 결정했다고 했을 때 대학 관련해서라던지 뭐 이런 쪽으로 호텔조리학과 가고 싶어 하거든요. 고객(학부모): 호텔조리학과 가고 싶어 하거든요.</div></div><div class=\"ln m\"><div class=\"who\">요리홍대 책임멘토</div><div class=\"tx\">호텔조리학과, 그러면은 조금 준비를 해야 되는 부분들이 있기는 한데 혹시 이 친구가 공부 성적은 좋을까요? 고객(학부모): 성적이요. 그냥 괜찮은 편이에요.</div></div><div class=\"note2\">※ 고객 문의에 대한 동의 표현 후 후속 질문 진행 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">요리홍 름 소개 → 신뢰감 형성 2. 탐색 질문 필요 이유 안내 후 정확한 학년(나이) 확인 → 맞춤 상담 기반 마련 3. 고객의 말에 대한 정서적 공감 표현 → 어머님의 불안감 해소 4. 고객 문의(호텔조리학과 진학)에 대한 동의 표현 후 후속 질문 진행 → 니즈 심층 파악 5. 지점 방문이 추가적으로 필요한 이유 설명 후 일정 조율 → 방문 동기 부여 6. 실수강자(자녀) 성함 및 연락처가 필요한 이유 설명 후 확인 → 방문 등록 안내 7. 방문 상담 시 도움드릴 수 있는 내용 사전 안내 (궁금한 점 적어오기 제안) → 고객 준비 유도 8. 방문 상담 내용 선 안내 및 카카오톡 발송 안내 → 명확한 다음 단계 제시</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 질문과 목적 ③ <span>· 34턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 자격증 종류·시험 일정까지 짚는 전문성 + 결정권자 확인 <span class=\"mute\">(멘토 30·고객 4턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 여보세요. 안○준님 맞으실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 맞습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 네 안녕하세요. 연락드린 곳은 SBS 아카데미 컴퓨터아트학원 홍대점, ○○○ 멘토입니다.</div></div><div class=\"note2\">※ 정확한 소속, 지점명 및 멘토명 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네, 네,</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 그 저희 학원에 오토캐드 문의주셔서 안내차 연락드렸어요.</div></div><div class=\"note2\">※ 유선 연락드린 이유 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네,</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네, 네. 일단은 저희 이제 좀 자세하게 과정 안내 도와드리려고 하는데 정확하게 이제 ○준님께서 이거 배워보시려는 목적이 어떻게 되실까요?</div></div><div class=\"note2\">※ 탐색 질문(학습 목적) 의도 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그냥 지금 자격증을 하나 따놓으려고요. 다른 목적 없이 그냥 듣는 거거든요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 자격증이요. 그 캐드 자격증이 좀 종류가 다양해서 그러는데 좀 목표하시는 자격증이 있으세요? 고객(본인): 오토캐드 자격증이 또 여러 가지가 나뉘는 건가요?</div></div><div class=\"note2\">※ 목표 자격증을 묻는 탐색 질문 의도 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 맞아요. 그러니까 민간 자격증도 있고 이제 국가 기능사 자격증도 있고 하는데 고객(본인): 네, 뭐 국가 기능사 그걸로 따려고 하는데</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네, 그러면은 이제 그거는 전산 응용 건축제도 기능사라고 하는 자격증이 있어요. 그 전산 응용 건축제도 기능사라는 자격증이 패드 하나를 가지고 보는 자격증이 되시는데 이거 취득하셔서 뭐 업무에 보충을 하시려는 건지 뭐 이직을 하시려는 건지 그런 목적은 있으세요? 고객(본인): 아니요. 그런 목적은 따로 없습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">그런 목적은 따로 없으신 거고요. 아 그러면 이거 전산 응용 건축제도 기능사라는 자격증이 1년에 4번밖에 시험이 없는데 이것도 혹시 알고 계셨어요? 고객(본인): 어 아니요. 아예 모르고요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네, 네, 그러면 조금 전으로 돌아와서 캐드는 혹시 활용 가능하실까요? 고객(본인): 아니요. 실제 처음이에요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네, 네 처음이신데, 처음 따야 될 때 꼭 민간으로 따야 되는 거는 아니고 전산 응용 건축제도 기능사도 기능사다 보니까 자격 요건은 따로 없어요. 그래서 바로 이거 시험 보셔도 되는데, 이 시험을 보려면 최대한 활용해야 할 부분들이 있어서 저희가 상세하게 알려드릴 거고요. 이거 시험 자체가 필기랑 실기가 나뉘어져 있거든요. 고객(본인): 어 회사 회사요. (학생입니다.)</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">직장인이신 거죠. (학생 아니시고 학생이신 거고) 고객(본인): 학생 아 학생이에요. 죄송해요, 직장인 아니시고 학생이신 거고.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 그러면 지금은 방학이실 텐데 네, 이거 이제 어쨌든 3월 달에 개강하실 거고, 학원에서 수강하시는 스케줄은 어떻게 생각해보셨어요? 고객(본인): 아 제가 지금 휴학계를 낸 상태여서 언제든지 상관이 없는 상황입니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 휴학 하셨어요. 예 언제까지 하세요. 혹시 고객(본인): 일단 이번 학년은 통으로 휴학을 할 예정입니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">이번 학년이요. 그러면은 이미 이제 휴학을 해서 한 약 1년 정도 아 그러면 알바는 혹시 따로 하세요. 고객(본인): 아니요. 안 합니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">알바 안 하시면 저희가 수업이 평일 반, 주말 반, 오전, 오후, 저녁 반 좀 세세하게 나뉘어져 있어서 수업 들으시면 평일 중에서는 언제를 더 선호하세요? 고객(본인): 평일 오후가</div></div><div class=\"note2\">※ 희망 수강 시간대 질문 의도 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">오후면 시간이 혹시 어떻게 될까요? 오후면은 2시부터도 수업이 있고 4시부터도 있고 6시부터도 있고 고객(본인): 하루 편할 것 같네요. 오후 시간대로요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">그러면 저희가 평일 오후라고 하면은 하루에 2시간씩 수업을 진행을 하시고요. 가장 빠르게 개강을 하는 일정은 2월 2일 개강하는 일정인데 수업은 언제부터 가능한지, 언제부터 듣고 싶은지 이런 것들은 생각해 보셨어요? 고객(본인): 개강하는 날에 맞춰서 들으려고 했는데. 2월 2일 개강이면 그때부터 들을 수 있을 거 같습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">괜찮으세요? 그러면 일단은 스케줄은 2월 2일 개강 일정을 참고해 주시고. 제가 그냥 궁금해서 여쭤보는 건데 지금 혹시 학과가 어디 쪽이세요? 고객(본인): 건설 시스템 공학과라고, 원래 이름이 토목공학과인데</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 그쪽이구나. 네, 네, 네, 제가 지금 이렇게 말씀해 주시는 것들 체크해보고 저희 학원이 지금 2월 달은 어쨌든 지금 휴학하셨지마는 다른 학생분들은 지금 방학이어서 학생분들이 좀 몰릴 때이기는 하거든요. 그래서 저희 학원 인원하고 실시간으로 인원이 어떻게 마감이 됐는지 이런 것들 체크 한번 해보시고, 지금 시험에 대해서 따로 서치를 해보셨다거나 하는 거는 아니신 것 같아가지고, 저희 이제 시험 준비를 한다고 하면은 어떤 식으로 준비를 해야 하는지 시험 일정이랑 이런 것들을 저희가 상세하게 알려드릴 거고, 그리고 이제 지금 학생이신데, 이런 학원 다닌다는 거에 대해서 부모님하고도 상의해 보셨어요? 고객(본인): 예 상의 다 하고 지금 그거 하는 거거든요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 아 상의 다 하시고 알아보신 거예요. 그러면 학원 다니시는 거에 발생되는 수강료도 부모님 지원 받으시는 걸까요? 고객(본인): (네, 부모님께서 지원해 주시는 거 맞으세요?) 알겠습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">그러면 어쨌든 저희가 지금 신년 맞이 프로모션을 진행하고도 있는데, 지금 1학년이라고 하셨죠? 고객(본인): 예 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">1학년이어도 학생증 나오지 않았어요? 고객(본인): 학생증이요. 네, 네 학생증 있습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 학생증 있으세요? 그러면 학생증 가지고 오시면 저희 휴학생이셔도 학생 할인 적용 가능하시기 때문에 이런 식으로 프로모션을 ○준님께서 받아보실 수 있는 프로모션, 그리고 다 받아본다 했을 때 정확하게 ○준님께서 캐드를 기초에서부터 배워서 자격증 따는 것까지 수강료가 얼마인지 이런 것들을 학원 방문 상담 통해서 자세하게 안내를 도와드릴 거예요. 고객(본인): 아 예, 그러면 네, 네 그럼 방문 상담은 언제 가능할까요?</div></div><div class=\"note2\">※ 지점 방문이 필요한 이유 및 목적 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">방문 같은 경우에는 저하고 시간 약속을 좀 잡아주셔야 되는데 혹시 내일도 가능하세요? 고객(본인): 네 가능합니다.</div></div><div class=\"note2\">※ 방문 예약이 사전에 필요한 이유 안내 후 일정 조율 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아 그러면 혹시 ○준님 거주하시는 쪽이 저희 홍대랑 가까우세요? 고객(본인): 이탈 단지 쪽입니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">아, 그러면은 어 맞아 2시 어떠세요. 고객(본인): 2시 네 좋습니다. 괜찮으세요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">그럼 제가 내일 오후 2시로 ○준님 상담 일정 예약을 도와드리고 혹시 ○준님 해당 번호 카카오톡 활용하실까요? 고객(본인): 아 네, 네 합니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">카카오톡으로 저희 상담 일정 안내 문자하고 학원 약도하고, 같이 남겨드릴 거라서 그거 확인 한 번만 해주시고요. 혹시 지금 제가 좀 전반적으로 안내를 드리기는 했는데 추가적으로 더 궁금하신 거 있으실까요? 고객(본인): 지금 당장은 없습니다.</div></div><div class=\"note2\">※ 통화 종료 전 추가 문의 여부 확인 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">지금 당장은 없으세요? 알겠습니다. 혹시나 궁금한 거 생기시면은 메모해뒀다가 내일 오셔서 저한테 질문해주시면 되시고, 제가 카톡 남겨드리고요. 저희 내일 오후 2시 상담 때 만나 뵙도록 할게요. 고객(본인): 예, 알겠습니다. 네 감사합니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토</div><div class=\"tx\">네 감사합니다. 1. 정확한 소속·지점·이름 소개 → 신뢰감 형성 2. 유선 연락드린 이유 명확히 안내 → 고객 불필요한 긴장 해소 3. 탐색 질문(학습 목적) 의도 안내 후 진행 → 맞춤 상담 기반 마련 4. 목표 자격증 탐색 질문 의도 안내 → 자격증 종류(민간/국가기능사) 구분 후 적합 과정 안내 5. 희망 수강 시간대 질문 의도 안내 → 고객 일정에 맞는 수업 추천 6. 지점 방문이 필요한 이유 및 목적 안내(수강료·프로모션·할인) → 방문 동기 부여 7. 방문 예약이 사전에 필요한 이유 안내 후 일정 조율 → 내일 오후 2시로 확정 8. 통화 종료 전 추가 문의 여부 확인 → 고객 미결 사항 없이 마무리</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 질문과 목적 ④ <span>· 36턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 다과목 문의를 관심 1개로 좁히기 + 보강 3종 안내 <span class=\"mute\">(멘토 31·고객 5턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 여보세요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">네 여보세요. 문○진님 맞으실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 맞는데 어떻게 전화 주셨을까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 네 안녕하세요. 연락드린 곳 스케치업과 모션 그래픽 과정 등으로 좀 문의주신 SBS 아카데미 컴퓨터아트학원 홍대점, ○○○ 멘토라고 합니다.</div></div><div class=\"note2\">※ 소속명 및 멘토명 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 네 안녕하세요. 혹시 지금 잠시 통화 좀 가능하실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">아 네 가능해요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 네 담당자로서 수업 안내차 전화드렸고요. 일단 우선 몇 가지 여쭤보고 선생님께 맞는 수업 있는지 좀 안내 도와드릴게요.</div></div><div class=\"note2\">※ 유선 연락드린 이유, 탐색 질문이 필요한 이유 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네, 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">좀 찍어주신 과목이 엄청 많아서요. 고객(본인): 아 저거 많이 찍었나요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">스케치업이랑 모션 그래픽, 2D 모션 그래픽, 애프터 이펙트 이렇게 찍어주셨거든요. 그래서 어느 쪽에 조금 관심이 있으신 건지 목적성 좀 여쭙고 싶은데요. 고객(본인): 음 저는 애프터 이펙트 쪽이요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">애프터 이펙트 쪽이요. 애프터 이펙트 쪽으로 이제 조금 취미처럼 해보고 싶으신 건지 아니면 나아가서 취업까지 좀 잘하시는 건지요. 고객(본인): 아 제가 지금은 대학생이라서 취미 정도로..</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 취미 정도로요. 아 그러면은 관련된 학교라던가 학과 전공하고 계실까요? 고객(본인): 아 제가 미대인데 그 가구 디자인 쪽 하고 있어요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 가구 디자인이요. 네, 네 그래서 스케치업을 먼저 생각했는데 계속 배우고 싶었던 쪽이 애프터 이펙트 쪽이어서 아 정말요. 그 가구 디자인에서 스케치업을 찍어주셨으면 스케치업 좀 다뤄보셨을까요? 고객(본인): 아니요. 스케치업은 막 그렇게 다뤄보진 않았고 그냥 기본 정도요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">지금 몇 학년이세요? ○진님 고객(본인): 저 이제 2학년 끝나고요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 이제 3학년 올라가시는 거고요. 그럼 애프터 이펙트는 어떻게 관심을 가지게 됐죠? 보통 영상 편집 쪽이나 이렇게 말해주시는데 정확하게 애프터 이펙트를 집어주신 이유가 있으신지 해서요. 고객(본인): 아 제가 그냥 예전부터 관심 있던 부모랑 영상 위주로..</div></div><div class=\"note2\">※ 관심계기를 묻는 이유 안내 후 탐색 질문 진행 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">혹시 나가야 되는 일수나 이런 게 있나요? 평일에 저희 한 달만 하신다고 하시면 16회 떨어지는 거거든요. 그래서 또 2월은 구정이 껴 있다 보니까 평일 거의 다 나오신다고 보시면 되거든요. 수강하시게 되면은 고객(본인): 아 그 제가 선택해서 나갈 수는 없고 이미 커리가 있는 건가요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">이제 저희가 개강일이 정해져 있고 16회차를 맞추다 보니까 선택해서 딱딱 나오는 수업은 1대1 과외가 아니다 보니깐요. 정원 문제가 있고 그래서 정확하게 좀 나와주셔야 되는 거. 네. 그런데 이제 만약 빈 날이 있다고 하시면은 저희 온라인 강의도 30일 같이 넣어드리고 있어요. 그래서 빈 수업들은 그렇게 보강하시거나 못 나오시는 날은 비대면 수업까지도 진행을 하고 있어서 대면 수업, 비대면 수업, 온라인 강의 이렇게 3가지로 최대한 보강하실 수 있게 도와드리고 있거든요. 고객(본인): 네, 네</div></div><div class=\"note2\">※ 온라인·비대면 수업 제공 어필 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">그렇게 하셨을 때 그럼 시간은 좀 어느 정도가 괜찮으세요? 혹시 어느 시간대가 있을까요? 지금 애프터 이펙트 수업을 들으신다고 하시면은 2시 수업이랑 8시 수업 있으시거든요. 고객(본인): 그 2시가 오후랑 오전 아 둘 다 오후인 거죠?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">네, 2시 오후 2시랑 오후 8시예요. 에펙만 딱 들으시려면 그렇게 진행되고 있거든요. 고객(본인): 아 그러면 혹시 그 커리가 한 개를 같이 공통으로 모든 사람이 만드는 건가요? 아니면 자유롭게 만드는 건가요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">방금 말씀해주신 커리큘럼 반은 포트폴리오 반에 좀 더 가까운 반이거든요. 그래서 그쪽은 자유롭게 됩니다. 저희 에펙 반은 일단 기능적으로 먼저 배우셔야 되잖아요. 가장 기초부터 배우시는 분들은 기능적인 문제로 들어가실 거예요. F2가 뭔지, 효과를 어떻게 넣어야 되는지 이런 수업들 배우실 거거든요. 그런데 만약 그런 기본 정도는 알고 좀 더 합성이나 이펙트 쪽을 배워보고 싶다 하시면은 F2 심화반부터 들어가셔도 되고요. 고객(본인): 네, 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">3주차에 맞죠. 네 3주차에. 음 그러면 이틀 수업이 목, 금에는 있거든요. 그때는 비대면 들으시고 첫 주차 여행이 조금 걸리는데 그때는 이제 저희가 온라인 강의 같이 넣어드리는 건데 그때로 그냥 일단 보강해 보시고 들어가시는 방법이 있고요. 그리고 첫 주차에는 이미 좀 다행히도 애프터 이펙트를 아시는 상태니까 조금 기능적인 문제로 들어가실 거라서 못 따라갈 것 같지는 않긴 하거든요. 배워보시면 2주차부터 들어가고 1주차에는 온라인 강의로 좀 보강을 하고 뭐 나갔는지 그렇게 좀 진행하시는 방식으로 가시면 좋을 것 같긴 하거든요. 그리고 일단은 1이 너무 쉬우실 수도 있을 것 같아요. 그때 애프터 이펙트 특강은 얼마큼 들으셨어요? 고객(본인): 그런데 막 엄청 오래한 건 아니고 한 6번 나갔는데, 한 번 할 때 한 4시간씩 해서</div></div><div class=\"note2\">※ 과정 안내 후 후속 질문(고객 학습 단계/경험) 진행 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">그러면은 오히려 2만 들으셔도 될 것 같긴 하거든요. 1이 아니라 그냥 2 들으셔도 될 것 같은데, 일단 그런 부분을 교재나 이런 거 보면서 다 하실 수 있으면은 1 들으셔도 좀 의미 없잖아요. 그래서 2 드시는 게 좋을 것 같은데, 2는 지금 시간이 6시랑 11시 반 이렇게 있거든요. 고객(본인): 11시 반이요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">네, 11시 반이랑 6시. 그러니까 11시 반 오전 11시 반입니다. 고객(본인): 아 그럼 11시 반 시에</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">네, 네. 11시 반이나 6시 반 그렇게 되시고 일단 1주차 여행은 아예 다 완전 계획이 되신 거죠. 고객(본인): 네, 네 그거는 뭐 이제 어쩔 수 없는 상황에서</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">그렇게 보강을 하시는 방향성으로 가시면 될 것 같은데, 그러면 혹시 그 2를 수강한다고 했을 때 수강료가 어떻게 되나요? 고객(본인): 16회 다시 말씀해 주시겠어요. 아 그 16회 초 듣는다고 하면 수강료가 어떻게 될까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 수강료요. 저희 원 수강료는 지금 50만원으로 책정되어 있거든요? 50만원 책정됐는데 지금 겨울방학 얼리버드 프로모션 진행 중이어서 대학생이신 거죠. 고객(본인): 네</div></div><div class=\"note2\">※ 프로모션 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">에펙을 들으셔도 괜찮을 것 같거든요. 효과를 많이 넣고 싶으시면은 그런데 그게 이제 지금 어느 정도 하시는지 정확하게는 제가 인지가 안 돼 있어 가지고, 그래서 한번 여태까지 하셨던 거 있으시죠? 그런데 그게 막 최근에 한 게 아니라 좀 옛날에 했던 거라서 완전 기본적인 것들이에요. 그냥 그래서 저희하고 커리큘럼 먼저 보시고 합성·혜택을 배우실지 그렇게 좀 들어가시면 좋을 것 같긴 한데요. 고객(본인): 그러면 방문해서 좀 보고 그게 제일 괜찮을 것 같은데, 혹시 방문 가능하신 날짜나 시간이 있으실까요?</div></div><div class=\"note2\">※ 지점 방문이 필요한 이유 안내 후 방문 권유 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">혹시 내일 가능한가요? 고객(본인): 내일 몇 시쯤 괜찮으세요? 한 4시쯤</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">오후 4시쯤이요. 네 잠시만요. 네 ○진님 내일 4시쯤 가능하실 것 같거든요. 혹시 카톡 하실까요? 선생님 제가 카톡으로 그러면은 방문 상담 예약 문자랑 저희하고 약도 한번 보내드릴게요. 고객(본인): 아 네, 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">일단은 상황 보시고 저희 학원이랑 맞는지, 다른 수업들은 어떤 게 괜찮은지 이런 것도 자세하게 안내 도와드릴 거고요. 일단 저희 학원 위치 알고 계실까요? 고객(본인): 아니요. 그냥 홍대에 있다길래</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">저희 홍대입구역 8번출구에 롯데시네마 건물 있거든요. 고객(본인): 아 네, 네</div></div><div class=\"note2\">※ 초행길인 고객을 배려한 지점 위치 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">거기 6층 건물을 저희 학원이 다 쓰고 있어가지고 일단 약도 보시고 찾아오시는데 문제없으실 것 같아요. 제가 방문 예약 문자랑 약도 카톡으로 좀 안내 도와드릴 테니까요. 혹시 내일 오실 때 변동사항 있으시면 꼭 좀 먼저 말씀해 주시고, 그리고 만드셨던 거 혹시 그런 거 좀 이제 보여주실 거 가져오시면은 좀 더 좋은 상담 될 것 같아서 챙겨와 주시면 너무 감사하겠습니다. 고객(본인): 네 그런데 이거 혹시 만들었던 거가 뭐 이렇게 유튜브 보고 예제 막 파일 다운받아서 이런 것도 되나요?</div></div><div class=\"note2\">※ 지점 층수 안내 / 방문 시 준비물 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">아 네 일단은 어느 정도 하는지가 제일 궁금한 포인트고요. 어느 정도 다룰 수 있는지 저희하고 커리큘럼에 맞춰서 이 정도는 다룰 수 있는지 그것 좀 체크 도와드릴게요. 고객(본인): 네, 네, 네</div></div><div class=\"note2\">※ 방문 상담 내용 안내 <span class=\"mute\">(CS팀 주석)</span></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">그러면 내일 뵙고 또 자세하게 설명드리도록 하겠습니다. 고객(본인): 아 네, 알겠습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 A</div><div class=\"tx\">네 감사합니다. 내일 뵙겠습니다. 1. 소속명 및 멘토명 명확히 안내 → 신뢰감 형성 2. 유선 연락드린 이유 및 탐색 질문 필요한 이유 안내 → 고객 협조 유도 3. 다수 문의 과목 중 관심 분야 파악 (스케치업/모션그래픽/애프터이펙트) → 목적성 확인 4. 관심계기를 묻는 이유 안내 후 탐색 질문 진행 → 학습 동기 심층 파악 5. 온라인·비대면 수업 제공 어필 → 결석 우려 고객의 불안 해소 6. 과정 안내 후 고객 학습 단계·경험 확인 → 기초/심화반 적합 과정 추천 7. 지점 방문이 필요한 이유 안내 후 방문 권유 → 내일 오후 4시로 일정 확정 8. 초행길 고객을 배려한 지점 위치(홍대입구역 8번출구 롯데시네마) 및 층수 안내 9. 방문 시 준비물 안내(기존 작업물 지참) 및 방문 상담 내용 사전 안내</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 적극적인 공감표현 <span>· 40턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 답을 그냥 받지 않고 한 번 더 얹는 공감어 — STEP 3·4 모범 <span class=\"mute\">(멘토 20·고객 20턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">여보세요. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네 여보세요. 예예. 예 안녕하세요. 김○준 님 맞으실까요? 예예예. 네 저희 SBS 아카데미 게임학원 ○○○ 팀장이라고 합니다. 예예예. 저희 월요일로 좀 문의 주셔가지고 전달받았는데 ○준 님께서 좀 배우시려는 걸까요? 예예. 네 일단 저희가 목적이 좀 어떠신지에 따라서 과정 안내가 좀 다른데 혹시 뭐 배우셔 가지고 스킬업이라든지 1인 게임 개발이라든지 아니면 취업이라든지 좀 어떤 쪽으로 좀 생각 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">1인 게임 개발 쪽이고요. 네 그다음에 제가 이제 강의도 나가는데 학교에 네네 그래서 언니 수업 하는 데 도움이 될까 싶어서 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네네 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면서 1인 개발도 하고 게임 개발도 하고요. 예 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네 이해했습니다. 그럼 혹시 신뢰가 안 된다면 지금 강의가 어떤 강의실까요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 제주대학교 융합 디자인 학과에 이제 강의를 나가고 있고요. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네네 그리고 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">이제 제가 이제 별도로 네 이제 따로 이제 게임을 한번 만들어보고 싶어서요. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">내일 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">집은 분당인 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">분당이시고요. 네 일단 저희가 많이 많이들 이제 게임 개발을 이제 혼자 한번 해보고 싶으 신 분들도 많이 오시고 아니면 어떻게 보면 이제 1인 게임 개발이면서 동시에 이제 좀 스킬업의 개념도 좀 있으신 거잖아요. 예 예. 그리고 업무 보충의 개념이셔 가지고 예예 맞네. 그러면은 혹시 ○준님께선 기존에 개발을 좀 해보신 적이 있으실까요? </div></div><div class=\"ln c\"><div class=\"who\ =\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">금요일 저희가 오전 11시랑 오후 2시 이후로는 다 가능하세요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면 내일 4시 반 내일 그러면 한 2시에 네 찾아뵐까요? </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네 2시로 그럼 예약 도와드리고 혹시 신뢰가 안 된다면 지금 나이가 혹시 어떻게 되실까요? 저희가 나이에 제한은 없는데요. 저희가 이제 아무래도 이렇게 문의를 주셨고 그리고 1인 게임 개발에 좀 관심 있으신 분들 이제 전체적으로 좀 조사 차원으로 여쭤보는 거라서 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">저 나이는 좀 많습니다. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">저희 이제 나이대는 굉장히 다양하세요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 예예 50대 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네 알겠습니다. 그리고 분당에 거주하고 계신다고 말씀하셨고 네 그러면은 사용자님 십일월 일일 오후 2시로 예약을 도와드리고요. 저희 이제 분당 서현역 5번 출구 앞에 있어요. 혹시 거리 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">잘 압니다. 여기서 운동도 다니고 이래가지고 서현역에서 여기서 산 지 오래돼서 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">그러세요. 네 알겠습니다. 그럼 오실 때 혹시 자차 이용하시나요? </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예. 자차도 있는데 주차 어려우면 여기다 댈 때는 많아요. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">네네. 혹시나 자차 이용하실 경우에는 저희 건물 지하 주차장 이용하시면 되시고요. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">그러면 그러면 만약에 일요일 날 네 제가 이제 수업할 때는 그러면 주차는 그럼 가능한 거네. </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">어 주차 가능하세요 </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 알겠어 </div></div><div class=\"ln m\"><div class=\"who\">게임분당 팀장</div><div class=\"tx\">맞습니다. 네 그러면은 ○준 님 제가 카카오톡으로 상담 예약 문자랑 약도랑 제 명함 보내드리고요. 오시기 전에 좀 궁금하신 점 있으신 부분 있으시면은 좀 미리 메모를 해오셔도 좋습니다. </div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">예 저는 이거 사실은 제가 원니얼에서 네 c++ 빼놓고는 조금씩은 알아요. 네 그러니까 잘하는 div></details>\r\n<details class=\"full\"><summary>🎧 바른 마무리 ① <span>· 25턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — &quot;필기는 학원에서 안 해요(공개문제 무료)&quot; — 정직하게 빼서 오히려 신뢰 <span class=\"mute\">(멘토 20·고객 5턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네 안녕하세요. 네 안녕하세요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 네 여보세요. 안녕하세요. 언제 들리시나요? 아 앞에 안 들렸다가 들려서요, 죄송합니다. 그 이○영님 맞으실까요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네,</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">네, 그 컬러리스트 관련해서 이제 수강료 문의 주셨던 SBS 아카데미 ○○○ 멘토라고 하구요. 안내차 전화드렸어요. 이게 이제 그 컬러리스트 개인마다 수준이나 목적이 다르시다 보니까 거기에 따라서 공부 기간이나 이제 수강료가 좀 차이가 날 수 있어서요. 지금 어떻게 좀 궁금하셔서 문의 주셨던 상황이죠. → 멘토명, 용건 안내 및 탐색 질문 목적을 안내하며 안정적으로 컨택 상담을 시작했습니다.</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">전 취업할 때 포트폴리오나 이런 거 넣으려고 문의드렸었어요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">그러면은 따로 취업하실 취업 준비가 되시는 건데 목표 회사라던가 분야라던가 이런 게 정해져 있는 상황이신가요?</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">회사는 따로 없고 분야는 상품 기획 MD 쪽이요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">상품 기획 MD쪽으로 보고 있고요.</div></div><div class=\"ln c\"><div class=\"who\">고객</div><div class=\"tx\">네,</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">네, 이쪽이시고 혹시나 아무래도 이미 알고 계시겠지만, 컬러리스트 같은 경우에 다 경력 요건이 있다 보니까 그런 쪽으로는 이미 다 적용이 돼 있으신 상황이신가 봐요. 전공을 하셨다거나 아니면 근무 경력이 있으시다거나 고객: 그 건국대학교 산업 디자인 학과 4년제 졸업했어요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 네. 완벽하시네요. 기준 조건은. 4년제 바로 졸업하셨으니까 기사 자격 바로 되어있으시니까 네, 그쪽이시고 그러면 전공이신만큼 기본 뭐 입시 미술이라든가 이런 것도 다 경험하셨겠네요. → 고객 답변에 대한 호응 후 자연스러운 연계 질문을 진행했습니다. 고객: 그런데 제가 입시 미술을 안 하고 들어가 가지고</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 정말요 그러면 성적으로 들어가신 건가요? 고객: 네 맞아요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 그러셨구나 그러면 컬러리스트는 아시다시피 이게 실기 같은 경우에 이게 직접 하잖아요. 이렇게 실기로 막 손으로 하는 것들이다 보니까 그런 거 관련해가지고는 그런 대비 공부나 이런 게 전혀 안 되는 상황일까요? → 고객 학습 경험에 대한 상세 답변을 자연스럽게 리드했습니다. 고객: 그런데 고등학교는 또 디자인 고등학교를 나왔어가지고 기초는 있는데 컬러 쪽으로는 따로 한 게 없어서</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 그러면 실기 이런 것들이 아주 새로운 건 아니겠네요. 기본은 있으신 거고. 그 고등학교 디자인 계열 나오신 거고 그 이후로는 대학교 전공으로 이어지셨고요. 그러면 실기 공부는 있으시고 컬러리스트 관련해서는 딱히 없으신 거네요. 그러면 2회차 시험 정도를 목표로 보시는 게 맞을 것 같아요. → 고객 상황에 적합한 시험 대비 일정을 구체적으로 언급, 상담의 신뢰도를 전달했습니다. 고객: 그러면 필기랑 실기가 둘 다 합쳐서 4주에서 5주라고 말씀해주시는 걸까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">저희는 이제 그 시험 대비는 실기 위주로 잡혀 있습니다. 아 예 그리고 이거는 이제 어딜 가나 실기 위주로 많이 잡히게 되는 게 일단은 그 필기 내용이나 이런 것들은 기본적으로 좀 문제은행 방식으로 나오게 되고요. 그래서 여기 기출 문제나 이런 것들이 이미 그 홈페이지 들어가시게 되면 공개 문제로 해가지고 문제 은행들이 공개가 되어 있거든요. 그래서 자료실에서 무료로 보실 수 있다 보니까 저희 학원뿐만 아니라 제대로 된 학원이라면 필기는 다루지는 않기는 합니다. 대신에 이제 실기는 운영을 하고요. 그리고 실기 준비하면서 이제 절반 정도는 필기가 외워야 되는 내용들이 나오긴 하는데 나머지 한 절반 정도는 실기에서 실기를 알면 또 풀 수 있는 그런 문제들이거든요. 배색을 물어본다던가 이런 것들이라 실기 하시게 되면 또 알게 되는 내용들이어서 실기 공부랑 필기를 좀 동시에 해주시면 훨씬 더 효율이 나오시긴 할 거예요. → 실기 위주로 구성된 시험대비반에 대한 당위성을 상세 안내했습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">3월 14일 개강 예정이시고 주말 반이다 보니까 주말 수업 시간은 오전 10시부터 오후 2시까지 운영을 하고요. 그리고 토요일, 일요일 이렇게 다 나오게 되는 상황입니다. 고객: 10시부터 2시까지요</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">네 맞습니다. 그렇게 잡히시고 공부 기간은 말씀드린 것처럼 4주에서 한 5주 정도 잡히신다고 보면 되고요. 그렇게 되고 비용대 같은 경우에는 오셨을 때 이제 어떤 공부 계획 가지시냐에 따라서 그 할인율이나 공부 기간은 좀 달라지실 수 있는데, 일단 할인율이 적용 안 된 원 수강료 기준이라고 한다면, 한 50만 원대 정도라고 보시면 되고요. 여기서 할인이라던가 이런 것들은 이제 그 상황에 맞춰서 적용이 되시는데 저희 아마 그 홈페이지 프로모션 내용 보고 연락 주셨을 것 같아요. 이게 프로모션이 3월 전까지 이루어지는 거라서요. 혹시나 상담을 이제 3월 전에 오셔서 공부 계획 잡으신다고 하면 그 프로모션 할인율 적용되는 거라 혜택들도 같이 볼 수 있는 쪽입니다. 그래서 최대로 적용받으면 할인율 거의 한 40%에서 50%까지도 적용받는 게 가능합니다. → 3월 내 방문 시 적용되는 할인 혜택을 언급함으로써 고객의 지점 방문 니즈를 높였습니다. 고객: 알겠습니다. 혹시 그 내일 배움 카드는 적용 가능한가요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 내일 배움 카드 이렇게 물어보시는 거 보니까 아마 국비지원 쪽은 처음 해보시는 쪽이신가 봐요. 고객: 네 아 네</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">말씀하셨던 내일 배움 카드뿐만 아니라 국비 지원 종류들이 여러 가지 질문들이 있으신데요. 저희는 인제 그쪽으로 이제 지원을 맞춰서 도와드릴 예정이긴 합니다. 그렇게 비교하시면 좋죠? → 고객 문의(수강료 국비 지원)에 맞춘 학원 자체 지원 및 국비 지원 비교 안내를 지점 방문 안내 내용으로 언급했습니다. 고객: 네, 알겠습니다. 혹시 학원에 가서 상담받아보려고 하는데 지금 일정을 잡으면 되는 걸까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">네, 저희 상담은 예약제로 운영이 되고 있어서 만약에 뵙는다고 하면 혹시 그 오전 시간대가 편하실까요? 아니면 오후 시간대가 좋으실까요? 고객: 오후 시간대요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">오후 시간대가 좋으시고요. 일단은 체크를 하면 만약에 내일 뵙는다고 하면요. 내일 같은 경우에는 오후 2시에 뵙거나 아니면 내일은 오후 6시, 6시에 도착했구나. 내일 오후 2시만 가능하고요. 그리고 수요일 같은 경우에는 오후 2시 반이랑 그리고 그 시간 이후로도 저녁 시간대도 수요일 날은 비어 있고요. 화요일이랑 수요일 요때가 오후 시간대로 비어 있긴 하네요. 고객: 혹시 수요일 오후 4시 가능할까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">네, 수요일 오후 4시는 비어 있어서 가능하십니다. 그럼 제가 수요일 4시로 해서 상담 일정 잡아드리고요. 카톡으로 상담 확정 내용이랑 학원 위치 약도 같이 보내드릴게요. 그래서 요걸로 통해가지고 방문을 해주시면, 되고요. 저희 학원이 홍대 입구역 근처에 위치하고 있는데, 혹시 사시는 곳은 어디실까요? 여기까지 오시는 데는 거리가 괜찮으실까요? → 지점 위치를 언급하며 자연스럽게 고객 거주 지역을 확인하는 탐색 질문을 시도했습니다. 고객: 30분 정도 걸려요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아 거리 자체랑 가까우시네요. 다행입니다. 알겠습니다. 그러면 제가 요걸로 해서 카톡 전달드리고 이제 수요일 날 뵙도록 하겠습니다. 그날 뭐 궁금하신 내용이 있다거나 아니면 취업 관련해가지고 이제 뭐 다룰 수 있는 게 있거나 하면 뭐 포트폴리오 준비하거나 하는 게 있으실 수 있을 것 같아요. 예 그런 것들도 좀 갖고 와주시면 훨씬 더 도움이 되실 수 있을 것 같고요. 고객: 네, 알겠습니다. 혹시 방문해서 지금 전화 주신 분이랑 같이 상담이 가능한 걸까요?</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">아니면 예 맞습니다. 제가 맞춰서 도와드릴 예정이고요. 예 오셨을 때 6층에 상담 오셨다고 말씀 주시면 제가 뵙도록 하겠습니다. → 첫 방문하는 고객을 배려하여 방문 시 인포데스크 문의 방법을 안내했습니다. 고객: 네, 알겠습니다. 네 확인 감사합니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 책임멘토 B</div><div class=\"tx\">그럼 좋은 저녁 되시고 카톡 전달드릴게요. 감사합니다. 고객: 네 1. 멘토명·용건 안내 및 탐색 질문 목적 안내 → 안정적으로 컨택 상담 시작 2. 고객 답변에 대한 호응 후 자연스러운 연계 질문 진행 → 상담 흐름 유지 3. 고객 학습 경험에 대한 상세 답변을 자연스럽게 리드 → 수준 파악 후 맞춤 안내 4. 고객 상황에 적합한 시험 대비 일정(2회차) 구체적으로 언급 → 상담 신뢰도 전달 5. 실기 위주 시험대비반 구성에 대한 당위성 상세 안내 → 커리큘럼 납득 유도 6. 지점 특장점(취업률 1위·취업 데이터·진로 상담) 구체적으로 어필 → 방문 니즈 제고 7. 3월 내 방문 시 적용되는 할인 혜택(최대 40~50%) 언급 → 방문 동기 강화 8. 고객 문의(내일배움카드·국비 지원)에 맞춘 비교 안내를 방문 상담 내용으로 연결 9. 지점 위치 언급 후 자연스럽게 거주 지역 확인하는 탐색 질문 시도 10. 방문 시 포트폴리오 등 준비물 안내 → 내실 있는 상담 유도 11. 첫 방문 고객 배려 → 6층 인포데스크 문의 방법 안내로 친절하게 마무리</div></div></div></div></details>\r\n<details class=\"full\"><summary>🎧 바른 마무리 ② <span>· 26턴</span></summary><div class=\"fbody\"><div class=\"fnote\"><b>배울 점</b> — 마무리 5단 모범. 단 ⚠️ 멘토명 누락은 CS팀도 지적 — 도입 4요소 반면교사 겸용 <span class=\"mute\">(멘토 26·고객 0턴 · 실통화 전문, 익명화)</span></div><div class=\"dlg\"><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">네 여보세요. 고객: 네 여보세요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">네, 네, 네 ○영님 맞으시죠. 고객: 네 맞습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">네, 연락드린 곳은 SBS 아카데미 컴퓨터 아트학원 홍대점이고요. 저희 쪽 GTQ 자격증 문의를 주셨는데 저희 쪽으로 이렇게 문의를 주시는 분들마다 좀 목적이랑 목표가 조금 다양해서 거기에 맞는 교과 과정 조금 안내를 드릴 건데 ○영님은 좀 어떤 목적으로 GTQ 과정을 조금 알아보고 계신 거예요. → 정확한 소속명 안내 및 탐색 질문이 필요한 이유를 안내한 멘트입니다. (단, 멘토명 안내가 누락되어서 아쉽습니다.) 고객: 제가 포토샵이나 일러스트 같은 거를 할 수 있는데, 조금 더 심화적으로 다룰 수 있고 다양한 툴을 사용해보고 싶어가지고 그러면 일단 자격증 준비를 해볼까 해서 일단 신청을 드린 거예요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">아 그러면은 지금 현업에서 채용을 하고 계신가요? 아니면 학생이실까요? 고객: 아니면은 산업에서 사용하고 있는 중이긴 한데 그 사진 보정이랑 그래픽 정도라고만 생각해주시면 될 것 같습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">아 그래서 사진 쪽으로 주로 이제 편집 쪽으로 하시고 계신 거예요. 고객: 사진 쪽만 국한돼서 하고싶은 게 아니고 다양하게 좀 다양한 툴을 익히고 싶어서 원래 이제 현업이 있으면 쓰는 툴만 쓰게 되잖아요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">그렇죠. 그렇죠. 고객: 다양한 툴을 좀 배우고 싶고 알고 싶어가지고 그래서 문의 드렸습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">네, 그러면은 과정을 그럼 조금 간단히 먼저 안내 드릴 건데 지금 저희 쪽에서 진행하고 있는 가장 기본적인 수업 중의 하나가 이제 포토샵이랑 일러스트 요 과정이에요. 그리고 요 과정이 이제 DTP 자격증을 따실 수 있는 건데 저희 이제 수업이 그냥 뭐 포토샵 수업이면 포토샵이라고 이렇게 뭉뚱그려서 진행을 하고 있는 거는 아니고 아까 이제 ○영님이 말씀하신 것처럼 나는 좀 기능을 조금 더 다채롭게 사용하고 싶다 그러면은 그래서 저희는 이 반이 기초반, 심화반 아니면 디자이너반 이런 식으로 나눠져 있어요. 그래서 교과 과정에 단계별로 맞게 들어가실 건데 맨 처음에는 기초반에서는 ACP라는 자격증을 따실 수 있는데, 내가 한 심화 정도는 되면은 이제 DTP라는 거 따실 수 있고 저희가 이제 2개 다 이제 시험장이기 때문에 이거 배워보시면서 그냥 주말에 나와가지고, 시험까지 그냥 연달아서 바로 할 수 있는 이런 일정이 가능해요. → 단계별 교육 과정(기초반/심화반/디자이너반) 안내를 상세히 진행했습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">그러면 지금 직장인이신 거면은 9시에서 6시까지 고정적인 일을 하시나요? 아니면 조금 유동적으로 고객: 고정적인 일을 하고 있습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">아 그러면 저희 수업이 가장 빠른 게 9시 반 수업이고 11시 반, 2시, 4시, 6시, 8시 이렇게 2시간씩 촘촘하게 진행하고 있는 대형 학원인데 그럼 수업을 이제 수강을 하실 때는 저녁 6시나 8시 이 타임이 편하신 거예요. 주말은. → 고객 여건 확인 후 자연스러운 후속 질문을 연계하여 진행했습니다. 고객: 아 네, 그렇습니다. 주말도 괜찮습니다.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">아 주말도 괜찮고 네 저희 보통 이제 직장인분들은 이제 6시나 8시 타임 요때 많이 이용을 하시고 그다음에 주말에도 이제 배우실 수가 있어가지고 이제 원하는 가능한 타임이 들어가셔서 이제 구체적으로 배우시면 됐고 그리고 이제 이거를 현업에서 사용하시는 분들은 이걸 정말 잘 사용하기 위함이기 때문에 포토샵이랑 일러스트를 나중에 좀 포트폴리오나 이런 걸 만들어서 좀 이직까지 좀 생각하시는 분들이 계신데, 지금은 조금 활용에 조금 더 가까우신가요? 아니면 나중에 이직 쪽으로도 생각하시나요? 고객: 뭐 나중에는 이직을 좀 조금 생각해볼 수 있을 것 같습니다. 약 1년 정도 있다가요.</div></div><div class=\"ln m\"><div class=\"who\">컴퓨터홍대 경력멘토 B</div><div class=\"tx\">아 그러면 이제 1년 뒤에 이제 이직을 생각하신다고 하면 포토샵이랑 일러스트 같은 경우에는 디자인 수업에서 가장 중심에 있는 프로그램이다 보니까 여기에서 좀 중심을 잡고 거기에 맞게 ○영님이 그런 방향성은 여기에 그 중심을 두고서 어떤 거를 하냐에 따라서 조금 달라질 수는 있어요. 그래서 내가 만약에 나는 시각 편집적으로 조금 제대로 해보고 싶다 하면은 뭐 피그마나 요즘에는 또 AI도 많이 접목이 되고 있기 때문에 AI 이런 식으로 하면은 나중에 취업하실 때 방향성을 조금 더 넓힐 수가 있거든요. 말 그대로 이거를 잘 사용을 하시면서 나중에 이제 디자인을 잘 하시려는 분들은 이런 것까지 다 이렇게 좀 확장해가지고 하시다 보면 나중에 취업이나 이런 부분도 유리하기 때문에 제가 그런 부분을 잘 설명을 드릴 건데 오늘 주
