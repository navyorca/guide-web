"이탈방지","추가등록","학생하네스","골든타임","신인멘토","롤플레잉","상담평가"],"d":"2026-08-22","f":"학과 지식","l":["99_시스템/03_학과지식/AI학과_지식_통합본.md"],"h":"<h3>📋 영업·상담·컨택 지식 통합본</h3>\n<p>영업·상담·컨택 업무 교육 내용을 한 문서에 모은 통합본이다. 신입 교육 핵심과 컨택 매뉴얼·스크립트, 고객응대 매너, CRM·DB 관리, 업무 전반 정리, 취업지원 서비스, 부가수당 체계, 예상 기출문제 암기, 환불·이탈·추등 운영 교리, 신인멘토 상담 롤플레잉 평가 체크리스트를 10개 절에 담았다.</p>\n<blockquote><strong>출처 파일:</strong> 260128_영업스킬_고객응대매너CS / 260204_신인교육_줌 / 260222_영업스킬_업무총정리 / 260222_영업스킬_컨택업무매뉴얼 / 260222_영업스킬_CRM고객관리 / 260222_취업지원_포폴반 / 신인교육_학생관리·부가수당 / 컨텍 교육 보고서 / 구DB 컨텍 전략 교육 보고서 / 260225_줌_사업부_직무기본교육 / 신인사원_마케팅_교육_실무가이드 / 전체과목_시험암기노트</blockquote>\n<blockquote><strong>작성:</strong> 통합 정리본 (2026-02-28)</blockquote>\n<hr>\n<h3>1. 신입 교육 핵심</h3>\n<h4>1-1. 회사 인프라 및 직급 체계</h4>\n<ul><li>\n<strong>개원:</strong> 2006년 (20주년)\n</li><li>\n<strong>브랜드 라인업:</strong> 컴퓨터 디자인·자격증, 게임 원화, 뷰티(올댓뷰티), 요리·바리스타, IT 독립 브랜드(해킹·백엔드), 승무원, 엔터테인먼트, 펫뷰티, 마케팅(엠노베이션), 온라인 강의(따즈아)\n</li><li>\n<strong>직급 체계:</strong> 신입 → 경력(매출 200만) → 선임(3억) → 책임(7억) → 팀장(인사권) → 부장·원장(지점 경영)\n</li><li>\n<strong>사업부 3대 비전:</strong> 급여(노력한 성과만큼 보상), 명예(신입→원장 수직 성장), 보람(수강생 인생을 바꾸는 과정)\n</li><li>\n<strong>소속:</strong> 컴퓨터 강남지점 사업부 4-3팀\n</li></ul>\n<h4>1-2. 신입 성장 법칙</h4>\n<ul><li>\n<strong>양질전환의 법칙:</strong> 업무 철학이 형성되는 입사 초기 1년은 효율보다 압도적 '양'에 집중 → 하기 싫은 일도 수행해 업무 근육을 키울 때 질적 성장 발생\n</li><li>\n<strong>자가진단과 기록:</strong> 모든 과정을 수치화하여 기록·분석 → 내가 어떻게 말하고 행동하는지 객관적 파악 → 나만의 업무 역사 구축\n</li><li>\n<strong>메타인지:</strong> 아는 것과 모르는 것을 명확히 구분, 남에게 완벽히 설명할 수 있을 때 진짜 실력\n</li><li>\n<strong>선의의 씨앗:</strong> 동료·타 부서와의 조화와 배려는 결국 나에게 돌아옴. 노력을 적절히 생색내어 존재감 어필도 필요\n</li><li>\n<strong>페르소나 설정:</strong> '멘토 네오'처럼 업무와 일상의 자아를 분리 → 신입 기간 감정 소모 최소화, 멘탈 보호\n</li></ul>\n<blockquote>&quot;프로는 상상하는 대로 되고, 아마추어는 걱정하는 대로 된다.&quot;</blockquote>\n<h4>1-3. 영업 마인드</h4>\n<ul><li>\n<strong>영업의 정의:</strong> 영리 활동을 위한 모든 소통(문의·상담·케어)이 곧 영업. 수강생은 회사가 아닌 <strong>멘토 개인의 신뢰도</strong>를 보고 등록\n</li><li>\n<strong>멘토의 사명감:</strong> 단순 판매자가 아닌, 학생을 올바른 길로 인도하는 '담임 선생님' 마인드\n</li><li>\n<strong>입체적 지식 습득:</strong> 인트라넷 정보에 만족하지 말고 트렌드·취업 전망·공모전 정보 등 +@ 배경지식 능동적 학습\n</li><li>\n<strong>실무 숙달:</strong> 커리큘럼·시간표·수강료·할인율 견적 즉시 안내 가능하도록 숙달\n</li><li>\n<strong>트렌드 공략:</strong> AI와 시니어 교육 수요 파악 → 상담에 적극 활용\n</li><li>\n<strong>핵심 사고 전환:</strong> 복잡한 상황일수록 쉽게, 심플하게, 긍정적으로 생각. 모르는 것은 적극 질문, 모든 과정 기록\n</li></ul>\n<blockquote>&quot;쉽게, 심플하게, 긍정적으로 생각하자!&quot;</blockquote>\n<h4>1-4. 차별화 전략</h4>\n<ul><li>\n<strong>핑크펭귄 전략:</strong> 똑같은 경쟁자 사이에서 나만의 색깔로 눈에 띄는 존재가 되기 → '나만이 할 수 있는 것'을 만들 것\n</li><li>\n<strong>구르메 패키지 전략:</strong> 일반 과정에 프리미엄을 섞어 고단가 패키지 이점 소구\n</li><li>\n<strong>리스크 강조:</strong> 혜택 설명보다 배우지 않았을 때의 리스크를 강하게 어필\n</li><li>\n<strong>질문 기법:</strong> 단답형 질문 → 과거 경험 질문 → 상상하게 만드는 질문으로 유도\n</li><li>\n<strong>더닝-크루거 효과 인지:</strong> 능력이 부족할수록 자신을 과대평가하고, 실력이 늘수록 '절망의 계곡'을 거침 → 슬럼프는 성장 과정\n</li><li>\n<strong>AI 프롬프트 6요소:</strong> 전제·목표·맥락·요청·형식·제약의 6형식 구조화 질문으로 AI 활용\n</li></ul>\n<hr>\n<h3>2. 컨택 매뉴얼 / 스크립트</h3>\n<h4>2-1. 컨택의 목표와 본질</h4>\n<ul><li>\n<strong>목표:</strong> 고객 니즈 파악 + 방문 상담 예약 (정보 전달이 목적이 아님)\n</li><li>\n<strong>본질:</strong> 상대에 대한 궁금증에서 시작 → 제한적인 정보 제공으로 상대가 궁금해하고 기대를 갖게 만들기\n</li><li>\n<strong>원칙:</strong> AI 챗봇이 아니므로 단순 스크립트 나열 금지 → 역지사지의 대화로 고객 니즈 파악\n</li><li>\n<strong>핵심:</strong> 어디까지나 컨텍은 상담 유도가 목적\n</li></ul>\n<h4>2-2. 컨택 전 준비</h4>\n<ul><li>\n수업 과정 숙지\n</li><li>\n나만의 스크립트 준비\n</li><li>\n고객 정보 사전 확인\n</li></ul>\n<h4>2-3. 말투와 언어 표현</h4>\n<ul><li>\n<strong>기조:</strong> 부드러운 말투 → 상냥하게, 천천히, 또박또박\n</li><li>\n<strong>미니꼬리 활용:</strong> '~아', '~오' 어미 사용\n</li><li>\n<strong>맞장구:</strong> &quot;아아, 그러시군요~&quot; (자주 쓰이는 공감 톤)\n</li><li>\n<strong>전화 특성:</strong> 비언어적 표현이 제한 → 말투와 멘트가 아주 중요\n</li><li>\n<strong>호칭:</strong> 고객을 '성함+님'으로 호칭 (사모님·사장님 금지)\n<ul><li>\n&quot;고객님, 제가 고객님을 ㅁㅁㅁ님으로 불러드려도 괜찮으실까요? 원하시는 호칭이 있으시면 말씀해주세요.&quot;\n</li></ul>\n</li></ul>\n<h4>2-4. 상담 실명제 (인삿말 스크립트)</h4>\n<pre><code>&quot;안녕하세요, ㅁㅁㅁ님 맞으실까요?\nSBS아카데미 컴퓨터학원 강남지점입니다.\n문의하신 (관심과정) 과정 담당하고 있는 오영선 멘토입니다.&quot;</code></pre>\n<ul><li>\n<strong>대표DB:</strong> 전화를 남겨서 컨택\n</li><li>\n<strong>일반DB:</strong> 문의/마케팅 인입 → 모르는 번호라서 통화거절·방어적 태도 가능 → 목적(용건)과 의도를 분명하게 안내\n</li></ul>\n<pre><code>&quot;기다려주셔서 감사합니다. 통화 가능하실까요?\n문의 주신 과정은 학습 목적이나 단계별로 수업이 다양해서\n자세한 안내를 드리기 위해 전화 드렸어요~&quot;</code></pre>\n<h4>2-5. 탐색 질문 (고객 니즈 파악)</h4>\n<p><strong>쿠션 표현:</strong> 혹시 / 실례지만 / 괜찮으시다면 / 번거로우실 수 있지만</p>\n<div class=\"tw\"><table><thead><tr><th>탐색 항목</th><th>질문 예시</th><th>파악 목적</th></tr></thead><tbody><tr><td>재직 여부</td><td>&quot;지금 회사 재직 중이실까요?&quot;</td><td>평일/오전오후/주말 여건 파악</td></tr><tr><td>연령</td><td>&quot;나이가 어떻게 되세요?&quot;</td><td>국비지원 등 자격 조건 확인</td></tr><tr><td>거주지</td><td>&quot;거주지가 어떻게 되세요?&quot;</td><td>접근 가능 지점 파악</td></tr><tr><td>학습 계기</td><td>&quot;배우셔야 하는 이유가 있으실까요?&quot;</td><td>동기 및 니즈 파악</td></tr><tr><td>학습 기간</td><td>&quot;생각하고 계신 학습 기간은 어떻게 되세요~?&quot;</td><td>과정 설계 기준</td></tr></tbody></table></div>\n<h4>2-6. 방문 유도 멘트</h4>\n<ul><li>\n&quot;유선상 안내도 가능하지만 비대면이다 보니, 직접 시각자료와 함께 설명드리는 게 조금 더 이해하시기 편하실 것 같아요~&quot;\n</li><li>\n&quot;오시는 김에 강의실과 학원 시설을 직접 보여드리면 좋을 것 같아요~&quot;\n</li><li>\n&quot;수업 시간대가 워낙 다양해서 직접 뵙고 커리큘럼을 같이 세워볼 수 있을 것 같아요~ 혹시 방문 가능하실까요?&quot;\n</li><li>\n로드맵 비교 분석, 전문용어 언급, 학원 내 행사 언급으로 방문 욕구 자극\n</li><li>\n<strong>이벤트 활용:</strong> 담당자 특별 할인, 리뷰 작성 혜택(5만원) 어필\n</li></ul>\n<h4>2-7. 마무리 멘트</h4>\n<p><strong>방문 확정 시:</strong></p>\n<pre><code>&quot;메가박스 건물 5층으로 올라오셔서 인포데스크에 성함만 말씀해주세요.\n그럼 ㅁㅁ일 ㅁ시에 뵙겠습니다. 감사합니다~&quot;</code></pre>\n<p><strong>미결 시:</strong></p>\n<pre><code>&quot;끝까지 챙겨드리기 → 고민이 많으신 것 같아요.\n좋은 소식 있을 때 한번 더 연락드려도 될까요?\n궁금한 점이 생기실 때 카톡으로도 상담이 가능하니 편히 말씀주세요.&quot;</code></pre>\n<h4>2-8. 컨택 마음가짐</h4>\n<ul><li>\n거절에 대한 두려움 갖지 말 것 → 실전 과정에서 거절은 당연한 것\n</li><li>\n컨택은 확률 싸움 → 많은 시도 통해 본인만의 통계 데이터 구축\n</li><li>\n선배 멘토들의 녹취를 들어보며 학습하되 반드시 정답이 아님을 인지 → 본인만의 스타일 만들기\n</li><li>\n<strong>중꺾그마(중요한 건 꺾여도 그냥 하는 마음)</strong>, <strong>스트롱스트롱(이건 나를 강하게 만들어 주는 수련이다)</strong>\n</li></ul>\n<hr>\n<h3>3. 고객응대 매너 (CS)</h3>\n<h4>3-1. MOT (결정적 순간) 이해</h4>\n<ul><li>\n<strong>정의:</strong> 고객과 만나는 15초의 순간. 직원 한 명의 태도가 기업 전체를 대표하는 판단 기준\n</li><li>\n<strong>코리아교육그룹 MOT 흐름:</strong>\n<ul><li>\n지점 직원의 전화를 받는 순간\n</li><li>\n지점 내부로 진입(방문 시작)\n</li><li>\n인터뷰 담당자 만남\n</li><li>\n교육 인터뷰 신청서를 받음\n</li><li>\n<strong>교육멘토와 처음 만남</strong> ← 핵심\n</li><li>\n<strong>교육멘토와 상담 시작</strong> ← 핵심\n</li><li>\n결제 진행\n</li><li>\n교육 관련 추가 안내 전달 받음\n</li><li>\n지점 나가는 순간(방문 종료)\n</li></ul>\n</li></ul>\n<ul><li>\n<strong>MOT 관리 3요소:</strong>\n<ul><li>\n<strong>하드웨어:</strong> 기업의 환경과 분위기, 위치, 브랜드, 외관\n</li><li>\n<strong>휴먼웨어:</strong> 직원의 표정과 말투, 응대 태도, 용모복장, 자세, 소통능력, 마인드, 업무전문성\n</li><li>\n<strong>소프트웨어:</strong> 모든 업무의 절차 및 기간(A/S, 불평업무, 고객관리, 만족도조사, 시스템 등)\n</li></ul>\n</li></ul>\n<h4>3-2. 고객 심리 이해</h4>\n<div class=\"tw\"><table><thead><tr><th>심리 법칙</th><th>내용</th><th>대응 전략</th></tr></thead><tbody><tr><td><strong>인지부하</strong></td><td>한번에 처리할 수 있는 정보량 초과 시 판단력 저하</td><td>단순명료한 정보 전달</td></tr><tr><td><strong>초두효과</strong></td><td>처음 제시된 정보가 더 잘 기억되고 큰 영향</td><td>첫인상 관리 철저</td></tr><tr><td><strong>후광효과</strong></td><td>한 가지 긍정적 특징으로 전체를 좋게 평가</td><td>초반 전문성 어필</td></tr><tr><td><strong>메러비안의 법칙</strong></td><td>시각 55%, 청각 38%, 말의 내용 7%</td><td>비언어적 요소 집중 관리</td></tr></tbody></table></div>\n<h4>3-3. 접객 자세</h4>\n<ul><li>\n<strong>복장:</strong> 세미정장, 청결, 단정함, 기업 배지 <strong>왼쪽 상단</strong> 착용\n</li><li>\n<strong>기본:</strong> 청결한 의류, 과한 향수 지양, 탈취제 사용\n</li><li>\n<strong>자세:</strong> 바른 자세 유지, 배려하는 마음\n</li></ul>\n<p><strong>인사 종류:</strong></p>\n<div class=\"tw\"><table><thead><tr><th>종류</th><th>방법</th><th>상황</th></tr></thead><tbody><tr><td>목례</td><td>가볍게 머리만 숙이거나 미소 짓는 눈인사</td><td>모르는 사람, 통화 중</td></tr><tr><td>약례</td><td>허리를 살짝 굽히는 정도</td><td>얼굴 익음, 실내, 회의 출입</td></tr><tr><td>보통례</td><td>허리를 반쯤 숙임</td><td>고객을 만날 때</td></tr><tr><td>정중례</td><td>머리가 배꼽까지 내려오도록 깊이 숙임</td><td>감사나 사과, 직장 상사, VIP</td></tr></tbody></table></div>\n<h4>3-4. 엘리베이터·계단 매너</h4>\n<p><strong>엘리베이터:</strong></p>\n<ul><li>\n상석: 문에서 가장 먼 곳\n</li><li>\n내가 먼저 버튼 조작, 먼저 타고 가장 늦게 내리기\n</li><li>\n내릴 때 고객 먼저 내리기\n</li><li>\n내부에서 통화·대화 금지\n</li></ul>\n<p><strong>계단:</strong></p>\n<ul><li>\n안내자가 되면 출입구 열기(문 잡아주기)\n</li><li>\n코너·방향은 손으로 방향 가리키기\n</li><li>\n상급자와 동행 시 내가 뒤에\n</li></ul>\n<h4>3-5. 명함 예절</h4>\n<p><strong>건넬 때:</strong> 아랫사람 → 윗사람 / 직원 → 고객 / 방문한 곳에서는 내가 먼저</p>\n<ul><li>\n일어서서 인사말과 함께 건네기\n</li><li>\n두 손으로, 내 이름과 소속 말하기\n</li></ul>\n<p><strong>받을 때:</strong></p>\n<ul><li>\n명함 받고 상대의 직함과 이름을 불러준 다음 명함 건네기\n</li><li>\n<strong>명함은 바로 넣지 말고 테이블 위에 올려놓고 대화</strong>\n</li><li>\n명함지갑에 상시 소지, 더럽거나 구겨진 것 금지\n</li></ul>\n<h4>3-6. 호칭과 경어</h4>\n<ul><li>\n높임말 잘 쓰기 (사물 높임 금지: &quot;이 과정은 마감입니다&quot; O / &quot;이 과정은 마감이세요&quot; X)\n</li><li>\n거리두기: 고객과 과하게 친해져 무례를 범하지 말 것\n</li><li>\n첫 대면 시 원하시는 호칭이 있는지 반드시 확인\n</li></ul>\n<h4>3-7. 비즈니스 매너</h4>\n<ul><li>\n마감은 기한 엄수가 제일 중요\n</li><li>\n출퇴근 시 데스크 깨끗하게 정리하고 PC 끄기\n</li><li>\n개인정보 보호 엄수\n</li><li>\n자리 비울 때 상사에게 보고 + 주위에 알리기\n</li><li>\n해촉 결심(퇴사) 시 최소 3일 전에 직속 상사에게 말씀드릴 것\n</li><li>\n중요한 내용은 이메일로 (팀장님 참조 필수 → 나중의 증빙자료)\n</li></ul>\n<h4>3-8. CS Q&amp;A</h4>\n<ul><li>\n자리에서 화장 고치기: 립밤, 핸드크림 정도는 OK\n</li><li>\n화장실 등 회사 밖에서 고객과 마주칠 때: 미소가 있는 눈인사 (화장실에서는 굳이 안해도 OK)\n</li><li>\n퇴근 시 팀장님 부재: 메모 또는 메신저 남기기\n</li><li>\n상담 완료 고객 배웅: 엘리베이터 앞까지 안내 + 버튼 눌러서 문 닫히는 것까지 확인\n</li></ul>\n<hr>\n<h3>4. CRM / DB 관리</h3>\n<h4>4-1. DB 유형 및 확인 방법</h4>\n<div class=\"tw\"><table><thead><tr><th>DB 유형</th><th>설명</th></tr></thead><tbody><tr><td><strong>공식 홈페이지 문의 DB</strong></td><td>사이트 관리 메뉴에서 확인. 개인 유입 시 멘토 이름 노출, 공식 유입 시 원장님 성함 노출</td></tr><tr><td><strong>내사(방문) DB</strong></td><td>직접 방문한 고객</td></tr><tr><td><strong>대표전화 DB</strong></td><td>대표번호로 문의한 고객</td></tr><tr><td><strong>URL 유입 DB</strong></td><td>개인 마케팅 링크 통해 유입된 고객</td></tr></tbody></table></div>\n<ul><li>\n<strong>신입 배정:</strong> 수습 기간 내 개인 마케팅 + 구 DB(사후 상담용) 배정\n</li></ul>\n<h4>4-2. 상담 이력 작성 원칙</h4>\n<ul><li>\n누구나 열람 가능하므로 <strong>고객 비하·주관적 생각·부정적 묘사 절대 금지</strong>\n</li><li>\n보고서처럼 객관적으로 작성\n</li><li>\n컨택 내용 정밀하게 기입 → 상담 시 성공 확률을 높이는 가장 강력한 무기\n</li></ul>\n<h4>4-3. 구DB 컨텍 전략</h4>\n<ul><li>\n<strong>구DB 정의:</strong> 최종 컨텍일 기준 15일 지난 것 (DB창 3~5페이지쯤 위치)\n</li><li>\n<strong>재컨택 기준:</strong> 최신순/공식/당직인 것 중에서 컨텍\n</li><li>\n<strong>개대추 금지:</strong> 구DB 컨텍 시 개인·대문·추천 건드리면 안 됨 (권한 매우 중요)\n</li><li>\n<strong>난이도:</strong> 이미 한 번 반려한 사람들이므로 '입구컷' 가능 → 너무 낙담 말고 다음으로\n</li><li>\n<strong>스크립트:</strong> 보통 팀장님이 짜주심 → 녹취 다운로드 후 분석 (사이트관리-DB목록-구분 탭에서 '상담예정, 상담자' 클릭)\n</li><li>\n<strong>유연한 대응:</strong> 수강료와 시간표는 수강생 상황에 맞춰 최대한 조율 가능함을 어필. 신규 과정이나 시간표 어필\n</li></ul>\n<h4>4-4. 국비 지원 문의 대응</h4>\n<ul><li>\n내일배움카드의 자부담금(약 300만)과 수강 제한의 실상 인지\n</li><li>\n상대는 정확한 정보 없음 → '남들이 혜택 받는다길래 나도 받고 싶어서 되는지 안 되는지'를 제일 중요하게 여김\n</li><li>\n무조건 안 된다고 하지 말고 → 본원 메리트 강조 (고퀄리티·탄탄한 커리큘럼·최신 트렌드 반영)\n</li></ul>\n<h4>4-5. 시스템 접속 경로</h4>\n<div class=\"tw\"><table><thead><tr><th>시스템</th><th>경로</th></tr></thead><tbody><tr><td>교육 영상</td><td>로그인 &gt; [대시보드] &gt; [계열게시판] &gt; [신입교육영상]</td></tr><tr><td>시험 응시</td><td>[인사관리] &gt; [평가관리] &gt; [멘토교육] (CBT 시험)</td></tr><tr><td>자료 열람</td><td>[바탕화면] &gt; [나스] &gt; [1. 에듀케이션] (과목 정보·커리큘럼)</td></tr><tr><td>녹취 다운로드</td><td>사이트관리-DB목록-구분 탭에서 '상담예정, 상담자' 클릭</td></tr></tbody></table></div>\n<ul><li>\n<strong>공식 사이트:</strong> <code>sbsdesign.kr</code> / <code>[사내 전용]-academy.net</code>\n</li><li>\n<strong>내선번호:</strong> 02-3482-9078\n</li></ul>\n<h4>4-6. 추천 업무 루틴</h4>\n<div class=\"tw\"><table><thead><tr><th>시간대</th><th>업무</th></tr></thead><tbody><tr><td>오전 10시~11시</td><td>다 바쁨 → 블로그 포스팅 위주</td></tr><tr><td>오전 11시~12시</td><td>녹취록 들으며 구DB 오전 목표 정하고 실습 → 팀장님께 피드백</td></tr><tr><td>오후</td><td>구DB 오후 목표 정하고 실습 / 블로그 / 기타 업무 처리</td></tr></tbody></table></div>\n<hr>\n<h3>5. 업무 전반 정리</h3>\n<h4>5-1. 근무 기본 정보</h4>\n<ul><li>\n<strong>소속:</strong> 컴퓨터 강남지점 사업부 4-3팀\n</li><li>\n<strong>좌석:</strong> 입구=최준 팀장님 - 나 - 벽 (260822 갱신, 퇴사자 자리 제외)\n</li><li>\n<strong>일반 근무:</strong> 점심 12:00~13:00 / 18:00 컴퓨터 종료 후 팀장님 보고 후 퇴근\n</li><li>\n<strong>당직:</strong> 11:00 출근~21:00 퇴근 (점심 당직 12:00~13:00)\n</li><li>\n<strong>급여:</strong> 식대 없음, 3.3% 원천징수, 25일 지급\n</li></ul>\n<h4>5-2. 학원 경쟁력 (상담 시 어필 포인트)</h4>\n<ul><li>\n합리적인 가격으로 확실한 취업 보장\n</li><li>\n빠른 트렌드 반영, 베테랑 강사진, 취업지원팀\n</li><li>\n교육혁신위원회 운영, AI 시연회 준비 등 전문성과 규모\n</li><li>\n규모가 크고 시간표가 많아 '시간표 스위칭' 가능\n</li><li>\n악플이 많아도 많은 수강생 유지 = 높은 만족도의 증명\n</li></ul>\n<h4>5-3. 보안 주의</h4>\n<ul><li>\n<strong>계열 대표 명의 사칭 피싱메일 주의:</strong> 회사에서는 대표 및 임원 명의로 개인정보를 요청하는 일이 절대 없음\n</li></ul>\n<h4>5-4. 정원 초과 등록 원칙 (학원 공지 260805)</h4>\n<ul><li>\n정원이 찬 과목(&quot;수업 터졌다&quot;)이라고 해서 추가 개강이 당연히 잡히는 것이 아니다. 추가 개강을 전제로 안내하지 않는다.\n</li><li>\n초과 정원 상태에서 등록을 진행할 때는 초과라는 사실과 그에 따른 수강 조건을 먼저 안내한 뒤 등록한다.\n</li><li>\n과목별 정원은 인트라넷 강의시간표 셀의 정원·배정 값으로 확인한다. AI에이전트는 대면+비대면 합산 25명(<a class=\"wl\" data-doc=\"99_시스템/03_학과지식/AI학과_지식_통합본.md\">AI학과_지식_통합본</a>).\n</li></ul>\n<hr>\n<h3>6. 취업지원 서비스 (포폴반 대상)</h3>\n<h4>6-1. 포트폴리오 과정 분류</h4>\n<p><strong>포트폴리오가 있는 과정:</strong></p>\n<ul><li>\n시각편집 / 웹(UX·UI·웹) / 모션(모션2D·시포디) / 아트웍(디지털드로잉) / CG(마야·룩뎁+모델링·애니·합성) / 인테리어(스케치업·인테리어)\n</li></ul>\n<p><strong>NAS 저장 경로:</strong> [NAS] - [1 - SBS_Mentor] - [5. 취업지원]</p>\n<h4>6-2. 기업 형태별 특징</h4>\n<div class=\"tw\"><table><thead><tr><th>형태</th><th>특징</th></tr></thead><tbody><tr><td><strong>인하우스</strong> (회사 자체)</td><td>제네럴리스트 → 다양한 업무 수행</td></tr><tr><td><strong>에이전시</strong> (클라이언트 대행)</td><td>스페셜리스트 → 특정 분야 전문, 외주 중심</td></tr></tbody></table></div>\n<h4>6-3. 취업지원 프로세스</h4>\n<ul><li>\n<strong>대상:</strong> 취업 의사가 있는 포폴 반 수강생\n</li><li>\n<strong>기간:</strong> 무료, 종강일로부터 3개월간 (포폴 추가 수강 시 기간 연장)\n</li><li>\n<strong>지원 상세:</strong>\n<ul><li>\n입사지원 서류 및 면접 클래스 → 회사·개인 맞춤 자소서 첨삭 (만족도 최상)\n</li><li>\n모의 체크\n</li><li>\n모의 면접\n</li><li>\n개별 구글 시트 관리 → 피드백 시트 관리 (포폴 완료 시 알려줄 것)\n</li></ul>\n</li><li>\n<strong>핵심:</strong> 본인이 열심히 해야 취업이 됨\n</li></ul>\n<hr>\n<h3>7. 부가수당 체계</h3>\n<h4>7-1. 수수료 개념</h4>\n<ul><li>\n<strong>급여:</strong> 고정값, 정기적으로 받는 수당\n</li><li>\n<strong>수수료:</strong> 변수값, 일의 결과에 따라 <strong>규모를 바꿀 수 있는 형태</strong>\n</li><li>\n<strong>부가수당 3종:</strong> 광고자 매출 + ACP + 따즈아\n</li></ul>\n<h4>7-2. 사업부 수수료 기준</h4>\n<p><strong>신입:</strong></p>\n<ul><li>\n영업활동비: 영업일(Working Day) × 8만 원\n</li><li>\n개인 광고 매출 수수료: 순매출의 <strong>5%</strong>\n</li><li>\n개인 매출 수수료: 월 순매출 200만 원 초과분 × <strong>10%</strong>\n</li><li>\n기타 수수료: ACP 등 별도 기준\n</li></ul>\n<p><strong>경력:</strong></p>\n<ul><li>\n신인 영업활동비 없어지고 순매출 수수료 적용\n</li><li>\n개인 광고 매출 수수료: 순매출의 <strong>5%</strong>\n</li></ul>\n<h4>7-3. 광고자 매출</h4>\n<ul><li>\n<strong>개념:</strong> 소속 지점 외 타지역 마케팅으로 DB 유입 → 매출 발생 시 납부액의 <strong>5% 수수료</strong>\n</li><li>\n<strong>전국 17개 지점 보유</strong> (강남·홍대·부산·부평·대구·대전·광주·수원·구월·일산·울산·노원·분당·종로·안산·천안·안양)\n</li><li>\n<strong>지역 전략:</strong> 핫스팟(경쟁 치열) 피하고 <strong>사이드 지역 중심 선점</strong> (반경 5~15km 중첩 지역)\n<ul><li>\n예) 홍대가 치열하면 → 양재·선릉·서초 등 한적한 쪽으로\n</li></ul>\n</li></ul>\n<p><strong>광고자 매출 처리 절차:</strong></p>\n<ul><li>\n디비 사이트 관리창에서 납부 확인\n</li><li>\n수당자에게 광고자 입력 요청 (다우메신저)\n</li><li>\n광고자 매출 입력 확인 (인트라넷)\n<ul><li>\n환불의 경우 자동 공제\n</li></ul>\n</li></ul>\n<h4>7-4. ACP (Adobe Certified Professional)</h4>\n<ul><li>\n<strong>정의:</strong> Adobe 공인 <strong>국제인증 자격증</strong>\n</li><li>\n<strong>응시 과목:</strong> 포토샵·일러스트·인디자인·프리미어·에프터이펙트 등\n</li><li>\n<strong>합격 기준:</strong> 1,000점 만점 중 <strong>700점</strong> 달성\n</li></ul>\n<p><strong>Professional 취득 과목 조합:</strong></p>\n<div class=\"tw\"><table><thead><tr><th>분야</th><th>필수 + 선택</th></tr></thead><tbody><tr><td><strong>Visual Design</strong></td><td>포토샵(필수) + 일러스트 or 인디자인</td></tr><tr><td><strong>Video Design</strong></td><td>프리미어(필수) + 포토샵 or 에펙</td></tr><tr><td><strong>Web Design</strong></td><td>드림위버(필수) + 애니메이트 or 포토샵</td></tr></tbody></table></div>\n<p><strong>ACP 월드챔피언십:</strong></p>\n<ul><li>\n코리아교육그룹 자체 공모전 브랜드: <strong>BNW</strong> (<a href=\"http://www.bnwcontest.com\" target=\"_blank\" rel=\"noopener\">http://www.bnwcontest.com</a>)\n</li><li>\nACP 자격증 소지자만 참가 가능\n</li></ul>\n<p><strong>응시료 기준 (할인 적용):</strong></p>\n<p>1과목 7만 / 2과목 13만 / 3과목 19만 / 4과목 25만 / 5과목 31만</p>\n<ul><li>\n꼭 수료 후 결제할 필요 없음 → 상담 단계에서도 어필하여 응시료 결제 유도 가능\n</li><li>\n건당 5천~1만 원 수수료 수령 가능\n</li></ul>\n<h4>7-5. 따즈아 (부가수당의 꽃)</h4>\n<ul><li>\n<strong>공식 사이트:</strong> <a href=\"https://www.ddazua.com\" target=\"_blank\" rel=\"noopener\">https://www.ddazua.com</a>\n</li><li>\n<strong>정의:</strong> 코리아교육그룹의 모든 교육이 깃든 전문 인터넷 강의 플랫폼\n</li><li>\n<strong>비중:</strong> 부가수당 중 약 <strong>90%</strong> 차지 (가장 중요)\n</li></ul>\n<p><strong>따즈아 필수 이해 항목:</strong></p>\n<ul><li>\n회원가입 방법\n</li><li>\n코드번호 입력 방법\n</li><li>\n어디에 어떤 강의가 있는지\n</li><li>\n오프라인 수업과의 싱크 (학생 관리)\n</li></ul>\n<p><strong>따즈아 수수료 인센티브 구조:</strong></p>\n<p>*일반기간 (1~5월, 7~11월):*</p>\n<div class=\"tw\"><table><thead><tr><th>오프라인 순매출</th><th>따즈아 수수료율</th></tr></thead><tbody><tr><td>2,000만 미만</td><td>25%</td></tr><tr><td>2,000만 이상</td><td>35%</td></tr><tr><td>3,000만 이상</td><td>40%</td></tr><tr><td>4,000만 이상</td><td>45%</td></tr></tbody></table></div>\n<p>*방학기간 (6월, 12월):*</p>\n<div class=\"tw\"><table><thead><tr><th>오프라인 순매출</th><th>따즈아 수수료율</th></tr></thead><tbody><tr><td>3,000만 미만</td><td>25%</td></tr><tr><td>3,000만 이상</td><td>35%</td></tr><tr><td>4,000만 이상</td><td>40%</td></tr><tr><td>5,000만 이상</td><td>45%</td></tr></tbody></table></div>\n<p><strong>수수료 계산 예시 (일반기간):</strong></p>\n<ul><li>\n오프라인 순매출 4,000만 + 따즈아 순매출 500만 달성 시\n</li><li>\n오프라인 수수료: 4,000만 × 13% = <strong>520만 원</strong>\n</li><li>\n따즈아 수수료: 500만 × 45% = <strong>225만 원</strong>\n</li><li>\n합산: <strong>745만 원</strong> (+ ACP·광고자 매출 추가 시 더욱 증가)\n</li></ul>\n<h4>7-6. 부가수당 핵심 요약</h4>\n<ul><li>\n따즈아가 부가수당의 90% → 가장 중요\n</li><li>\n지역 마케팅은 핫스팟 피하고 사이드 지역 선점\n</li><li>\nACP는 상담 단계에서도 어필하여 응시료 결제 유도 가능\n</li><li>\n오프라인 + 인강(따즈아) 결합으로 매출 증대\n</li><li>\n성수기(6·12월)와 일반 구간 인센 기준이 다름 → 반드시 구분\n</li></ul>\n<hr>\n<h3>8. 예상 기출문제 핵심 암기</h3>\n<p><strong>Q. 광고자 매출 수수료는 납부액의 몇 퍼센트?</strong> → 5%</p>\n<p><strong>Q. 광고자 매출 발생 시 절차는?</strong> → 디비 사이트 관리창 확인 → 다우메신저로 해당 지역에 매출 입력 요청 → 인트라넷 매출 입력 확인</p>\n<p><strong>Q. 따즈아가 부가수당 중 차지하는 비중은?</strong> → 약 90%</p>\n<p><strong>Q. 일반기간 오프라인 순매출 3,000만 이상 시 따즈아 수수료율은?</strong> → 40%</p>\n<p><strong>Q. ACP 합격 기준 점수는?</strong> → 1,000점 만점 중 700점 이상</p>\n<p><strong>Q. Visual Design Professional 과목 조합은?</strong> → 포토샵(필수) + 일러스트 or 인디자인</p>\n<p><strong>Q. 구DB 재컨택 기준 기간은?</strong> → 최종 컨텍일 기준 15일 이상 경과</p>\n<p><strong>Q. 경력 멘토 전환 매출 기준은?</strong> → 월 순매출 200만 원 달성</p>\n<h3>9. 환불·이탈·추등 운영 교리 (공통 룰 v3.25에서 이관, 260728)</h3>\n<p class=\"tags\"><span class=\"tag\">환불방지</span><span class=\"tag\">이탈방지</span><span class=\"tag\">추가등록</span><span class=\"tag\">학생하네스</span><span class=\"tag\">골든타임</span></p>\n<p>원문은 common-core v3.25 &quot;환불·이탈·추등 운영 원칙&quot; 섹션. 세션 주입 슬림화(v4.0)로 전문을 이곳에 보관하고, common-core에는 요약만 남긴다.</p>\n<p>세 목표(환불예방·이탈방지·추가등록)는 분리된 업무가 아니라 하나의 흐름이다. 근거 교리는 변상돈 부장 환불 사전방지(99_시스템\\업무기록\\260323_변상돈부장님_신인교육_보고서.md)와 이광연 부장 상담전환(99_시스템\\업무기록\\260401_단과상담자세_보고서.md)이다.</p>\n<p>환불은 사전 방지가 전부다. 결제 후 15~30분 재상담이 골든타임(난이도·일정 대안·혜택 수치 안내), 등록 즉시 학사일지 교습비 영수증 출력(분쟁 최강 근거), 환불 문의 시 사유 먼저 묻고 정리된 형태로 안내(공제 먼저 꺼내면 싸움). 환불 손해 앵커(수업 진행구간 공제, 30% 미만=원수강료 1/3, 50% 이상=환불·배정변경 불가, KEG 할인권 회수·할인율 재산정)는 멘토 상담용이며 학생에게 그대로 발송하지 않는다.</p>\n<p>후속 이행 추적: 기록의 후속 기한은 이행 여부까지 추적한다(SWOT 약점 해소). 상담·컨텍 기록 시 후속 기한을 캘린더·영업액션판에 등록하고, 미이행은 sbs-checkin·현황판에서 검출한다.</p>\n<p>학생 하네스: 학생이 물어보게 두지 않고 스스로 확인·해결하도록 자료를 설계한다(답 대신 찾는 곳을 준다). 안내문은 최상단에 오해하면 손해 보는 조건을 먼저 둔다(sbs-notice, 이정빈 선차감 미독 사례). 개인 사정 결석은 보강이 아니라 인강 자율 보충이 기본이고, 보강은 강사 사정 휴강에 한한다. 학생 대면 문구는 단호한 정책을 쿠션어로 감싸 클레임을 예방한다.</p>\n<p>퇴근 후 카톡은 읽지 않거나 내용 파악까지만 하고 답장은 출근 후 처리한다(변상돈 원칙). 반복 문의는 셀프서비스 링크로 리다이렉트한다.</p>\n<h3>10. 신인멘토 상담 롤플레잉 평가 체크리스트 (260805 수집)</h3>\n<p class=\"tags\"><span class=\"tag\">신인멘토</span><span class=\"tag\">롤플레잉</span><span class=\"tag\">상담평가</span><span class=\"tag\">코칭</span></p>\n<p>출처: &quot;신인멘토 상담 롤플레잉 평가 체크리스트&quot; 표 이미지(엑셀 양식 추정). 작성자·배포처 [확인 필요]. 대상은 신인멘토 2개월 3주차(W7), 목적은 방문 대면 상담 역량 점검이며 상담 롤플레잉 주 2회와 연계한다. 입력란은 소속·이름·평가일·평가자, 항목 점수, 총평이고 합계·등급은 자동 계산된다.</p>\n<p>점수 기준: 1 매우 미흡 / 2 미흡 / 3 보통 / 4 우수 / 5 매우 우수. 15개 항목, 75점 만점.</p>\n<h4>평가 항목 15개</h4>\n<ul><li>\n첫인상·라포 형성 → 환대 인사·자기소개·아이스브레이킹으로 편안한 분위기를 만들고 상담 소요시간을 사전 안내했는가\n</li><li>\n사전 정보 활용 → 컨텍 시 파악한 니즈·상황(CRM 메모)을 상담 도입부에 자연스럽게 언급하여 준비된 상담임을 보여줬는가\n</li><li>\n니즈 심화 탐색 → 수강 목적·목표·직무·기간·예산 등 등록 판단에 필요한 조건을 질문으로 심화 파악했는가\n</li><li>\n학과·과정 매칭 제안 → 고객 니즈에 맞는 학과별 상담자료를 활용해 최적 교육과정을 근거와 함께 매칭 제안했는가\n</li><li>\n시각자료·커리큘럼 설명 → 커리큘럼·포트폴리오·수강 사례 등 시각자료를 활용해 과정의 가치를 구체적으로 전달했는가\n</li><li>\n취업·진로 비전 제시 → 수료 후 취업처·직무·연봉 수준 등 고객이 그릴 수 있는 미래상을 구체적 사례로 제시했는가\n</li><li>\n국비·장학 설계 → 내일배움카드 조회·지원 항목을 현장에서 확인하고, 고객 조건에 맞는 최적 지원 구조를 설계했는가\n</li><li>\n자부담금 제시 타이밍 → 가치 전달(과정·비전)이 충분히 이뤄진 후 자부담금을 제시했는가 (금액 먼저 노출 금지)\n</li><li>\n이의제기 대응 → 비싸다·시간이 없다·다른 곳과 비교하겠다 등 반론에 공감 후 근거 있는 재설득을 했는가\n</li><li>\n긴급성·희소성 활용 → 개강 임박·잔여석·사전등록 혜택 마감 등 구체적 근거로 당일 결정의 이점을 제시했는가\n</li><li>\n등록 클로징 시도 → 상담 종료 전 등록(또는 가등록·사전등록)을 명확히 권유하는 클로징을 반드시 시도했는가\n</li><li>\n보류 고객 후속 설계 → 즉시 등록이 안 될 경우 재방문·재통화 일시를 구체적으로 확정하고 리마인드 채널을 확보했는가\n</li><li>\n경청·발화 균형 → 일방적 설명이 아닌 질문·확인 중심으로 진행하고 고객의 말을 끊지 않았는가\n</li><li>\n톤앤매너·전문성 → 복장·태도·화법이 전문가답고, 과장·허위 없이 신뢰 기반으로 상담했는가\n</li><li>\n상담 기록·마무리 → 상담 결과(니즈·제안 과정·자부담금·후속 일정)를 CRM 기입 가능 수준으로 정리하고 배웅 인사까지 완료했는가\n</li></ul>\n<h4>등급·후속 조치</h4>\n<ul><li>\n등급(자동): S 68~75 / A 60~67 / B 49~59 / C 38~48 / D 37 이하\n</li><li>\nC 이하(48점 이하) → 상담 롤플레잉 주 2회 유지 + 상담자료 보강 후 재평가\n</li><li>\nB 이상 → 실전 상담 투입 유지, 미흡 항목 개별 코칭\n</li><li>\n총평은 관리자가 작성\n</li></ul>\n<h4>활용 메모</h4>\n<p>항목 7·8·10·11이 본원 클로징 교리(가치 선행 후 금액 제시, 당일 결정 근거, 클로징 필수 시도)와 직결되고, 항목 12·15는 환불·이탈 방지 교리의 후속 이행 추적과 같은 축이다. 신인 코칭 시 위 두 섹션을 함께 제시한다.</p>","x":"📋 영업·상담·컨택 지식 통합본 영업·상담·컨택 업무 교육 내용을 한 문서에 모은 통합본이다. 신입 교육 핵심과 컨택 매뉴얼·스크립트, 고객응대 매너, crm·db 관리, 업무 전반 정리, 취업지원 서비스, 부가수당 체계, 예상 기출문제 암기, 환불·이탈·추등 운영 교리, 신인멘토 상담 롤플레잉 평가 체크리스트를 10개 절에 담았다. 출처 파일: 260128_영업스킬_고객응대매너cs / 260204_신인교육_줌 / 260222_영업스킬_업무총정리 / 260222_영업스킬_컨택업무매뉴얼 / 260222_영업스킬_crm고객관리 / 260222_취업지원_포폴반 / 신인교육_학생관리·부가수당 / 컨텍 교육 보고서 / 구db 컨텍 전략 교육 보고서 / 260225_줌_사업부_직무기본교육 / 신인사원_마케팅_교육_실무가이드 / 전체과목_시험암기노트 작성: 통합 정리본 (2026 02 28) 1. 신입 교육 핵심 1 1. 회사 인프라 및 직급 체계 개원: 2006년 (20주년) 브랜드 라인업: 컴퓨터 디자인·자격증, 게임 원화, 뷰티(올댓뷰티), 요리·바리스타, it 독립 브랜드(해킹·백엔드), 승무원, 엔터테인먼트, 펫뷰티, 마케팅(엠노베이션), 온라인 강의(따즈아) 직급 체계: 신입 → 경력(매출 200만) → 선임(3억) → 책임(7억) → 팀장(인사권) → 부장·원장(지점 경영) 사업부 3대 비전: 급여(노력한 성과만큼 보상), 명예(신입→원장 수직 성장), 보람(수강생 인생을 바꾸는 과정) 소속: 컴퓨터 강남 거주지 \"거주지가 어떻게 되세요?\" 접근 가능 지점 파악 학습 계기 \"배우셔야 하는 이유가 있으실까요?\" 동기 및 니즈 파악 학습 기간 \"생각하고 계신 학습 기간은 어떻게 되세요~?\" 과정 설계 기준 2 6. 방문 유도 멘트 \"유선상 안내도 가능하지만 비대면이다 보니, 직접 시각자료와 함께 설명드리는 게 조금 더 이해하시기 편하실 것 같아요~\" \"오시는 김에 강의실과 학원 시설을 직접 보여드리면 좋을 것 같아요~\" \"수업 시간대가 워낙 다양해서 직접 뵙고 커리큘럼을 같이 세워볼 수 있을 것 같아요~ 혹시 방문 가능하실까요?\" 로드맵 비교 분석, 전문용어 언급, 학원 내 행사 언급으로 방문 욕구 자극 이벤트 활용: 담당자 특별 할인, 리뷰 작성 혜택(5만원) 어필 2 7. 마무리 멘트 방문 확정 시: \"메가박스 건물 5층으로 올라오셔서 인포데스크에 성함만 말씀해주세요. 그럼 ㅁㅁ일 ㅁ시에 뵙겠습니다. 감사합니다~\" 미결 시: \"끝까지 챙겨드리기 → 고민이 많으신 것 같아요. 좋은 소식 있을 때 한번 더 연락드려도 될까요? 궁금한 점이 생기실 때 카톡으로도 상담이 가능하니 편히 말씀주세요.\" 2 8. 컨택 마음가짐 거절에 대한 두려움 갖지 말 것 → 실전 과정에서 거절은 당연한 것 컨택은 확률 싸움 → 많은 시도 통해 본인만의 통계 데이터 구축 선배 멘토들의 녹취를 들어보며 학습하되 반드시 정답이 아님을 인지 → 본인만의 스타일 만들기 중꺾그마(중요한 건 꺾여도 그냥 하는 마음) , 스트롱스트롱(이건 나를 강하게 만들어 주는 수련이다) 3. 고객응대 매너 (cs) 3 1. mot (결정적 순간) 이해 정의: 고객과 만나는 15초의 순간. 직원 한 명의 태도가 기업 전체를 대표하는 판단 기준 코리아교육그룹 mot 흐름: 1. 지점 직원의 전화를 받는 순간 2. 지점 내부로 진입(방문 시작) 3. 인터뷰 담당자 만남 4. 교육 인터뷰 신청서를 받음 5. 교육멘토와 처음 만남 ← 핵심 6. 교육멘토와 상담 시작 ← 핵심 7. 결제 진행 8. 교육 관련 추가 안내 전달 받음 9. 지점 나가는 순간(방문 종료) mot 관리 3요소: 하드웨어: 기업의 환경과 분위기, 위치, 브랜드, 외관 휴먼웨어: 직원의 표정과 말투, 응대 태도, 용모복장, 자세, 소통능력, 마인드, 업무전문성 소프트웨어: 모든 업무의 절차 및 기간(a/s, 불평업무, 고객관리, 만족도조사, 시스템 등) 3 2. 고객 심리 이해 심리 법칙 내용 대응 전략 인지부하 한번에 처리할 수 있는 정보량 초과 시 판단력 저하 단순명료한 정보 전달 초두효과 처음 제시된 정보가 더 잘 기억되고 큰 영향 첫인상 관리 철저 후광효과 한 가지 긍정적 특징으로 전체를 좋게 평가 초반 전문성 어필 메러비안의 법칙 시각 55%, 청각 38%, 말의 내용 7% 비언어적 요소 집중 관리 3 3. 접객 자세 복장: 세미정장, 청결, 단정함, 기업 배지 왼쪽 상단 착용 기본: 청결한 의류, 과한 향수 지양, 탈취제 사용 자세: 바른 자세 유지, 배려하는 마음 인사 종류: 종류 방법 상황 목례 가볍게 머리만 숙이거나 미소 짓는 눈인사 모르는 사람, 통화 중 약례 허리를 살짝 굽히는 정도 얼굴 익음, 실내, 회의 출입 보통례 허리를 반쯤 숙임 고객을 만날 때 정중례 머리가 배꼽까지 내려오도록 깊이 숙임 감사나 사과, 직장 상사, vip 3 4. 엘리베이터·계단 매너 엘리베이터: 상석: 문에서 가장 먼 곳 내가 먼저 버튼 조작, 먼저 타고 가장 늦게 내리기 내릴 때 고객 먼저 내리기 내부에서 통화·대화 금지 계단: 안내자가 되면 출입구 열기(문 잡아주기) 코너·방향은 손으로 방향 가리키기 상급자와 동행 시 내가 뒤에 3 5. 명함 예절 건넬 때: 아랫사람 → 윗사람 / 직원 → 고객 / 방문한 곳에서는 내가 먼저 일어서서 인사말과 함께 건네기 두 손으로, 내 이름과 소속 말하기 받을 때: 명함 받고 상대의 직함과 이름을 불러준 다음 명함 건네기 명함은 바로 넣지 말고 테이블 위에 올려놓고 대화 명함지갑에 상시 소지, 더럽거나 구겨진 것 금지 3 6. 호칭과 경어 높임말 어떤 강의가 있는지 4. 오프라인 수업과의 싱크 (학생 관리) 따즈아 수수료 인센티브 구조: 일반기간 (1~5월, 7~11월): 오프라인 순매출 따즈아 수수료율 2,000만 미만 25% 2,000만 이상 35% 3,000만 이상 40% 4,000만 이상 45% 방학기간 (6월, 12월): 오프라인 순매출 따즈아 수수료율 3,000만 미만 25% 3,000만 이상 35% 4,000만 이상 40% 5,000만 이상 45% 수수료 계산 예시 (일반기간): 오프라인 순매출 4,000만 + 따즈아 순매출 500만 달성 시 오프라인 수수료: 4,000만 × 13% = 520만 원 따즈아 수수료: 500만 × 45% = 225만 원 합산: 745만 원 (+ acp·광고자 매출 추가 시 더욱 증가) 7 6. 부가수당 핵심 요약 따즈아가 부가수당의 90% → 가장 중요 지역 마케팅은 핫스팟 피하고 사이드 지역 선점 acp는 상담 단계에서도 어필하여 응시료 결제 유도 가능 오프라인 + 인강(따즈아) 결합으로 매출 증대 성수기(6·12월)와 일반 구간 인센 기준이 다름 → 반드시 구분 8. 예상 기출문제 핵심 암기 q. 광고자 매출 수수료는 납부액의 몇 퍼센트? → 5% q. 광고자 매출 발생 시 절차는? → 디비 사이트 관리창 확인 → 다우메신저로 해당 지역에 매출 입력 요청 → 인트라넷 매출 입력 확인 q. 따즈아가 부가수당 중 차지하는 비중은? → 약 90% q. 일반기간 오프라인 순매출 3,000만 이상 시 따즈아 수수료율은? → 40% q. acp 합격 기준 점수는? → 1,000점 만점 중 700점 이상 q. visual design professional 과목 조합은? → 포토샵(필수) + 일러스트 or 인디자인 q. 구db 재컨택 기준 기간은? → 최종 컨텍일 기준 15일 이상 경과 q. 경력 멘토 전환 매출 기준은? → 월 순매출 200만 원 달성 9. 환불·이탈·추등 운영 교리 (공통 룰 v3.25에서 이관, 260728) 환불방지 이탈방지 추가등록 학생하네스 골든타임 원문은 common core v3.25 \"환불·이탈·추등 운영 원칙\" 섹션. 세션 주입 슬림화(v4.0)로 전문을 이곳에 보관하고, common core에는 요약만 남긴다. 세 목표(환불예방·이탈방지·추가등록)는 분리된 업무가 아니라 하나의 흐름이다. 근거 교리는 변상돈 부장 환불 사전방지(99_시스템\\업무기록\\260323_변상돈부장님_신인교육_보고서.md)와 이광연 부장 상담전환(99_시스템\\업무기록\\260401_단과상담자세_보고서.md)이다. 환불은 사전 방지가 전부다. 결제 후 15~30분 재상담이 골든타임(난이도·일정 대안·혜택 수치 안내), 등록 즉시 학사일지 교습비 영수증 출력(분쟁 최강 근거), 환불 문의 시 사유 먼저 묻고 정리된 형태로 안내(공제 먼저 꺼내면 싸움). 환불 손해 앵커(수업 진행구간 공제, 30% 미만=원수강료 1/3, 50% 이상=환불·배정변경 불가, keg 할인권 회수·할인율 재산정)는 멘토 상담용이며 학생에게 그대로 발송하지 않는다. 후속 이행 추적: 기록의 후속 기한은 이행 여부까지 추적한다(swot 약점 해소). 상담·컨텍 기록 시 후속 기한을 캘린더·영업액션판에 등록하고, 미이행은 sbs checkin·현황판에서 검출한다. 학생 하네스: 학생이 물어보게 두지 않고 스스로 확인·해결하도록 자료를 설계한다(답 대신 찾는 곳을 준다). 안내문은 최상단에 오해하면 손해 보는 조건을 먼저 둔다(sbs notice, 이정빈 선차감 미독 사례). 개인 사정 결석은 보강이 아니라 인강 자율 보충이 기본이고, 보강은 강사 사정 휴강에 한한다. 학생 대면 문구는 단호한 정책을 쿠션어로 감싸 클레임을 예방한다. 퇴근 후 카톡은 읽지 않거나 내용 파악까지만 하고 답장은 출근 후 처리한다(변상돈 원칙). 반복 문의는 셀프서비스 링크로 리다이렉트한다. 10. 신인멘토 상담 롤플레잉 평가 체크리스트 (260805 수집) 신인멘토 롤플레잉 상담평가 코칭 출처: \"신인멘토 상담 롤플레잉 평가 체크리스트\" 표 이미지(엑셀 양식 추정). 작성자·배포처 확인 필요 . 대상은 신인멘토 2개월 3주차(w7), 목적은 방문 대면 상담 역량 점검이며 상담 롤플레잉 주 2회와 연계한다. 입력란은 소속·이름·평가일·평가자, 항목 점수, 총평이고 합계·등급은 자동 계산된다. 점수 기준: 1 매우 미흡 / 2 미흡 / 3 보통 / 4 우수 / 5 매우 우수. 15개 항목, 75점 만점. 평가 항목 15개 1. 첫인상·라포 형성 → 환대 인사·자기소개·아이스브레이킹으로 편안한 분위기를 만들고 상담 소요시간을 사전 안내했는가 2. 사전 정보 활용 → 컨텍 시 파악한 니즈·상황(crm 메모)을 상담 도입부에 자연스럽게 언급하여 준비된 상담임을 보여줬는가 3. 니즈 심화 탐색 → 수강 목적·목표·직무·기간·예산 등 등록 판단에 필요한 조건을 질문으로 심화 파악했는가 4. 학과·과정 매칭 제안 → 고객 니즈에 맞는 학과별 상담자료를 활용해 최적 교육과정을 근거와 함께 매칭 제안했는가 5. 시각자료·커리큘럼 설명 → 커리큘럼·포트폴리오·수강 사례 등 시각자료를 활용해 과정의 가치를 구체적으로 전달했는가 6. 취업·진로 비전 제시 → 수료 후 취업처·직무·연봉 수준 등 고객이 그릴 수 있는 미래상을 구체적 사례로 제시했는가 7. 국비·장학 설계 → 내일배움카드 조회·지원 항목을 현장에서 확인하고, 고객 조건에 맞는 최적 지원 구조를 설계했는가 8. 자부담금 제시 타이밍 → 가치 전달(과정·비전)이 충분히 이뤄진 후 자부담금을 제시했는가 (금액 먼저 노출 금지) 9. 이의제기 대응 → 비싸다·시간이 없다·다른 곳과 비교하겠다 등 반론에 공감 후 근거 있는 재설득을 했는가 10. 긴급성·희소성 활용 → 개강 임박·잔여석·사전등록 혜택 마감 등 구체적 근거로 당일 결정의 이점을 제시했는가 11. 등록 클로징 시도 → 상담 종료 전 등록(또는 가등록·사전등록)을 명확히 권유하는 클로징을 반드시 시도했는가 12. 보류 고객 후속 설계 → 즉시 등록이 안 될 경우 재방문·재통화 일시를 구체적으로 확정하고 리마인드 채널을 확보했는가 13. 경청·발화 균형 → 일방적 설명이 아닌 질문·확인 중심으로 진행하고 고객의 말을 끊지 않았는가 14. 톤앤매너·전문성 → 복장·태도·화법이 전문가답고, 과장·허위 없이 신뢰 기반으로 상담했는가 15. 상담 기록·마무리 → 상담 결과(니즈·제안 과정·자부담금·후속 일정)를 crm 기입 가능 수준으로 정리하고 배웅 인사까지 완료했는가 등급·후속 조치 등급(자동): s 68~75 / a 60~67 / b 49~59 / c 38~48 / d 37 이하 c 이하(48점 이하) → 상담 롤플레잉 주 2회 유지 + 상담자료 보강 후 재평가 b 이상 → 실전 상담 투입 유지, 미흡 항목 개별 코칭 총평은 관리자가 작성 활용 메모 항목 7·8·10·11이 본원 클로징 교리(가치 선행 후 금액 제시, 당일 결정 근거, 클로징 필수 시도)와 직결되고, 항목 12·15는 환불·이탈 방지 교리의 후속 이행 추적과 같은 축이다. 신인 코칭 시 위 두 섹션을 함께 제시한다."},"99_시스템/03_학과지식/웹학과_지식_통합본.md":{"t":"웹학과 지식 통합본","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h3>💻 웹학과 지식 통합본</h3>\n<p>웹학과 상담과 수업 안내에 필요한 지식을 한 문서에 모은 통합본이다. 웹 디자인의 정의와 업무 흐름, 비전공자 눈높이의 IT·웹 기초 상식, 포토샵부터 웹 포트폴리오까지의 커리큘럼과 과목별 설명, 프로그램·언어 정리, 취업 분야와 인재상, 상담 Q&amp;A와 비유 치트키, 수강료·패키지 안내를 8개 절에 담았다. 9월 이후 과목명은 아래 개편 안내에 적힌 정본 문서를 먼저 확인한다.</p>\n<blockquote>AIX 커리큘럼 개편(2026-09~) 적용 예정. 9월 이후 개강·상담은 <span class=\"wl off\">AIX_커리큘럼개편_260715</span>을 정본으로 우선 확인할 것(AI에이전트웹·AI바이브코딩→AIX 바이브코딩, AI피그마→AIX 피그마). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨.</blockquote>\n<blockquote><strong>목적</strong>: 웹학과 관련 모든 학습 노트, 강의 필기, 상담 가이드, 커리큘럼 자료를 하나로 통합한 완결판.</blockquote>\n<blockquote><strong>출처</strong>: 문의준 팀장님 필기, 서우정 학과장님 수업, 김○○ 강사님 교육, 멘토 강의 노트 등 통합 정리.</blockquote>\n<p><strong>목차</strong></p>\n<ul><li>\n<span class=\"wl off\">#1. 학과 개요</span>\n</li><li>\n<span class=\"wl off\">#2. IT · 웹 기초 상식</span>\n</li><li>\n<span class=\"wl off\">#3. 커리큘럼 전체 구조</span>\n</li><li>\n<span class=\"wl off\">#4. 과목별 상세 설명 (웹디자인 · 퍼블리싱)</span>\n</li><li>\n<span class=\"wl off\">#5. 프로그램 · 언어 설명</span>\n</li><li>\n<span class=\"wl off\">#6. 취업 및 진로</span>\n</li><li>\n<span class=\"wl off\">#7. 상담 포인트</span>\n</li><li>\n<span class=\"wl off\">#8. 수강료 · 패키지 안내</span>\n</li></ul>\n<hr>\n<h3>1. 학과 개요</h3>\n<h4>1-1. 웹 디자인이란?</h4>\n<blockquote><strong>&quot;웹 디자인은 그림만 그리는 게 아니라, 기술로 구현하는 것입니다.&quot;</strong></blockquote>\n<ul><li>\n<strong>공식</strong>: Design (시각적 표현) + Coding (기술적 구현)\n</li><li>\n<strong>목표</strong>: HTML5와 CSS3 웹 표준 기술을 익혀, 내가 디자인한 것을 실제 웹사이트로 만들어내는 능력 배양.\n</li><li>\n<strong>정의</strong>: 웹은 관리하고 구축하는 영역. 어떤 디바이스(PC, 모바일 등)에서도 최적화된 화면을 송출해야 함.\n</li></ul>\n<h4>1-2. 업무 흐름 (Process)</h4>\n<pre><code>기획(Planning) → 디자인(Design) → 퍼블리싱(Publishing) → 개발(Dev)</code></pre>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>직군</th><th>역할</th></tr></thead><tbody><tr><td>기획</td><td>UX 디자이너, 기획자</td><td>건축으로 치면 '설계도'를 만드는 최상위 단계</td></tr><tr><td>디자인</td><td>웹 디자이너</td><td>기획자가 만든 설계도를 시각화</td></tr><tr><td>퍼블리싱</td><td>웹 퍼블리셔</td><td>디자인과 개발의 가교. 디자이너의 시안을 코드로 변환하여 웹에 띄움</td></tr><tr><td>개발</td><td>프론트엔드 / 백엔드 개발자</td><td>뒷단의 데이터 처리</td></tr></tbody></table></div>\n<h4>1-3. 우리 학원의 정체성</h4>\n<ul><li>\n<strong>우리 학과는 '디자인' 위주</strong> → 백엔드의 복잡한 계산보다 <strong>시각적 완성도</strong>와 <strong>유니버설 디자인(웹 접근성)</strong>에 집중.\n</li><li>\n<strong>핵심 양성 인재</strong>: 디자인 감각과 코딩 논리를 모두 갖춘 <strong>웹 퍼블리셔</strong>.\n</li><li>\n<strong>차별점</strong>: 실무 투입 속도가 가장 빠른 직군. 퍼블리셔 출신은 디자인 안목과 HTML 구조 기초가 뛰어나 현업에서 선호하는 상급 인재.\n</li></ul>\n<hr>\n<h3>2. IT · 웹 기초 상식</h3>\n<h4>2-1. 코딩 문맹 탈출 (비전공자 눈높이 설명)</h4>\n<blockquote>상담 필살기: &quot;코딩, 어렵게 생각 마세요. 주방에서 일어나는 일과 똑같아요.&quot;</blockquote>\n<h5>언어의 3단계</h5>\n<div class=\"tw\"><table><thead><tr><th>종류</th><th>설명</th></tr></thead><tbody><tr><td>자연어 (Natural Language)</td><td>한국어, 영어처럼 <strong>'사람'</strong>이 쓰는 말</td></tr><tr><td>기계어 (Machine Language)</td><td>0과 1로 된 <strong>'컴퓨터'</strong>의 말</td></tr><tr><td>프로그래밍 언어</td><td>사람의 말(자연어)을 컴퓨터(기계어)가 알아듣게 <strong>'번역'</strong>해주는 중간 언어</td></tr></tbody></table></div>\n<h5>번역 방식: 컴파일러 vs 인터프리터</h5>\n<ul><li>\n<strong>컴파일러 (Compiler = 번역가):</strong>\n<ul><li>\n<ul><li>\n책 한 권을 처음부터 끝까지 다 번역해서 완성본을 만드는 방식.\n</li><li>\n실행 속도는 빠르지만, 오타 하나 고치려면 책을 처음부터 번역해야 해서 수정이 번거로움. (Java, C언어 등)\n</li></ul>\n</li></ul>\n</li><li>\n<strong>인터프리터 (Interpreter = 동시 통역사):</strong>\n<ul><li>\n<ul><li>\n셰프가 주문서 읽듯이, 한 줄 한 줄 읽으면서 바로바로 실행하는 방식.\n</li><li>\n웹(Web)은 손님(사용자) 반응을 보고 바로바로 화면을 고쳐야 하기 때문에 이 방식을 씀. (JavaScript, Python 등)\n</li></ul>\n</li></ul>\n</li></ul>\n<h5>객체 지향 (OOP) &amp; 붕어빵 이론</h5>\n<ul><li>\n<strong>설명</strong>: 옛날에는 코드를 줄줄이 썼다면, 이제는 <strong>'부품(객체)'</strong>을 만들어서 조립함.\n</li><li>\n<strong>클래스 (Class = 붕어빵 기계/틀)</strong>: &quot;밀가루 반죽 넣고 팥 넣어서 굽는다&quot;는 설계도.\n</li><li>\n<strong>객체 (Object = 갓 구운 붕어빵)</strong>: 틀에서 찍혀 나온 실제 붕어빵(슈크림맛, 팥맛).\n<ul><li>\n<ul><li>\n붕어빵 100개를 만들 때, 100번 처음부터 만드는 게 아니라 '틀(Class)' 하나만 잘 만들어두면 계속 찍어낼 수 있음.\n</li></ul>\n</li></ul>\n</li></ul>\n<hr>\n<h4>2-2. 웹 삼위일체 (집 짓기 프로세스)</h4>\n<div class=\"tw\"><table><thead><tr><th>기술</th><th>역할</th><th>비유</th></tr></thead><tbody><tr><td><strong>HTML5 (Structure)</strong></td><td>뼈대와 구조 담당. <code>&lt;video&gt;</code>, <code>&lt;audio&gt;</code> 등 자체 재생 가능</td><td>건물의 철근 뼈대 (철근)</td></tr><tr><td><strong>CSS3 (Skin)</strong></td><td>색상, 크기, 레이아웃 담당. 코드만으로 고급 효과 구현</td><td>인테리어 마감재 (벽지/가구)</td></tr><tr><td><strong>JavaScript (Action)</strong></td><td>동적 기능 담당. 클릭·스크롤에 반응</td><td>전기 배선 &amp; 스위치</td></tr></tbody></table></div>\n<h5>HTML의 역사 (HTML5인 이유)</h5>\n<ul><li>\n<strong>옛날 (HTML 4.01)</strong>: 동영상을 보려면 '플래시'나 '액티브X' 같은 별도 도구 필요. &quot;개인 숟가락 지참 필수.&quot;\n</li><li>\n<strong>혁명 (HTML5)</strong>: 별도 프로그램 없이 HTML 하나만으로 동영상/음악 재생 가능. &quot;숟가락 제공.&quot; 숫자 5는 <strong>'표준의 완성'</strong>을 뜻함.\n</li></ul>\n<h5>CSS의 역사 (CSS3인 이유)</h5>\n<ul><li>\n<strong>옛날 (CSS 1, 2)</strong>: 둥근 모서리 하나 만들려면 포토샵으로 잘라 붙이는 노가다가 필요. &quot;장비 부족.&quot;\n</li><li>\n<strong>혁명 (CSS3)</strong>: 그림자, 애니메이션 등 고급 효과를 <strong>이미지 없이 코드만으로 구현</strong>. &quot;최첨단 조리 도구.&quot;\n</li></ul>\n<hr>\n<h4>2-3. 직무 구분: 프론트엔드 vs 백엔드 (빙산 &amp; 식당 비유)</h4>\n<pre><code>🏔️ 빙산 구조\n┌──────────────────────────────────┐\n│  [물 위] 프론트엔드 (눈에 보이는 부분) │\n│  HTML / CSS / JavaScript          │\n├──────────────────────────────────┤\n│  [수면] 퍼블리셔 (연결 통로)          │\n├──────────────────────────────────┤\n│  [물 아래] 백엔드 (보이지 않는 부분)  │\n│  서버 / DB / Java / Python 등      │\n└──────────────────────────────────┘</code></pre>\n<div class=\"tw\"><table><thead><tr><th>직무</th><th>식당 비유</th><th>역할</th><th>사용 기술</th></tr></thead><tbody><tr><td><strong>퍼블리셔</strong></td><td>인테리어 &amp; 플레이팅</td><td>눈에 보이는 화면(HTML/CSS) 제작. 버튼 색깔, 레이아웃</td><td>HTML, CSS, jQuery</td></tr><tr><td><strong>프론트엔드</strong></td><td>웨이터 &amp; 지배인</td><td>사용자 클릭(주문)을 받아 백엔드에 전달, 결과를 화면에 표시</td><td>HTML, CSS, JS, React</td></tr><tr><td><strong>백엔드</strong></td><td>주방장 &amp; 창고지기</td><td>보이지 않는 곳에서 데이터 처리 (서버 = 주방, DB = 냉장고)</td><td>Java, Python, Node.js</td></tr><tr><td><strong>엔지니어</strong></td><td>기초 설비 &amp; 기계실</td><td>시스템 안정성 유지, 서버 인프라 관리</td><td>시스템 전반</td></tr></tbody></table></div>\n<blockquote><strong>중요</strong>: 프론트엔드 언어는 HTML, CSS, JavaScript 딱 3개. 파이썬·자바는 프론트엔드 언어가 아님.</blockquote>\n<hr>\n<h4>2-4. 서버와 도메인</h4>\n<blockquote>웹사이트를 올리는 것 = <strong>집 짓기</strong></blockquote>\n<pre><code>🏠 서버 (Server) = 땅 (Land)\n└─ 파일을 저장하는 24시간 켜진 공간. 호스팅 = 그 땅을 임대하는 것.\n\n🏷️ 도메인 (Domain) = 도로명 주소\n└─ www.naver.com 같은 인터넷 주소. 돈 주고 구매해야 함.\n\n📒 DNS (Domain Name System) = 전화번호부\n└─ naver.com → 실제 IP 주소(223.130.195.200)로 연결해주는 시스템.</code></pre>\n<hr>\n<h4>2-5. HTTP vs HTTPS</h4>\n<pre><code>📮 HTTP   엽서 보내기\n└─ 중간 배달부가 내용 훔쳐볼 수 있음. 보안 취약.\n\n✉️ HTTPS  봉투에 밀봉해서 보내기\n└─ 내용 암호화. 가로채도 내용 알 수 없음. 현재 표준.</code></pre>\n<blockquote>HTTPS 자물쇠 없으면 구글이 &quot;주의 요함&quot; 표시 → 사이트 신뢰도 바닥.</blockquote>\n<hr>\n<h4>2-6. 해상도와 DPI</h4>\n<div class=\"tw\"><table><thead><tr><th>플랫폼</th><th>DPI</th><th>특징</th></tr></thead><tbody><tr><td>웹(Web)</td><td>72 DPI</td><td>기본</td></tr><tr><td>모바일(Mobile)</td><td>144 DPI</td><td>고해상도 필요</td></tr><tr><td>인쇄(Print)</td><td>300 DPI</td><td>최고 해상도</td></tr></tbody></table></div>\n<ul><li>\n편집 디자인과 웹 디자인은 해상도 개념이 다름.\n</li><li>\n일반 모니터용 이미지를 아이폰에서 보면 흐릿하게 보임 → 2배, 3배 큰 이미지를 만들어 축소해서 보여주는 방식 필요 (고해상도 대응).\n</li><li>\n<strong>레티나 디스플레이</strong>: 애플 초고밀도 화면. 사람 눈으로 픽셀 구별 불가 수준.\n</li></ul>\n<hr>\n<h4>2-7. 크로스 브라우징</h4>\n<blockquote><strong>모든 브라우저에서 똑같이 잘 보이도록 호환성을 맞추는 작업</strong> → 퍼블리셔의 핵심 역량</blockquote>\n<pre><code>😤 문제 상황\n└─ &quot;크롬에서는 예쁘게 나오는데, 아이폰(사파리)에서 보니 버튼이 깨져요!&quot;\n\n🌐 브라우저 현황\n├─ Chrome    전 세계 1등. 개발자 표준.\n├─ Safari    아이폰/맥 기본 브라우저.\n├─ Edge      윈도우 기본 브라우저.\n├─ Firefox   개발자들이 보조로 사용.\n└─ IE        ✅ 공식 사망 → 신경 안 써도 됨!</code></pre>\n<hr>\n<h4>2-8. 앱의 종류</h4>\n<pre><code>📱 네이티브 앱\n├─ 특징: 스토어 다운로드. 빠름. 카메라/GPS 완벽 사용.\n└─ 언어: Swift (iOS) / Kotlin (Android)\n\n🌐 웹 앱\n├─ 특징: 설치 없이 브라우저 접속. 디자인만 앱처럼.\n└─ 예시: 넷플릭스/인스타 PC버전\n\n🔀 하이브리드 앱  ← 웹 과정 취업 연결 포인트!\n├─ 특징: 겉은 앱, 안은 웹사이트.\n└─ ⭐ 쇼핑몰 앱 90%가 이 방식</code></pre>\n<blockquote>상담 포인트 → &quot;웹 디자인 배우면 <strong>'하이브리드 앱'의 알맹이</strong>를 만들 수 있어서 쇼핑몰 취업에 유리합니다!&quot;</blockquote>\n<hr>\n<h4>2-9. API</h4>\n<blockquote>API = 프로그램끼리 대화하는 창구 · 비유: <strong>식당의 웨이터</strong></blockquote>\n<pre><code>🍽️ 동작 원리\n└─ 손님 (내 웹사이트) → 웨이터 (API) → 주방 (외부 서비스)\n\n📦 실제 사용 예시\n├─ 🗺️ 내 홈페이지에 지도 띄우기    → 네이버 지도 API\n├─ 🔐 쇼핑몰에 간편 로그인 붙이기   → 카카오 로그인 API\n└─ 🌤️ 날씨 정보 가져오기           → 기상청 API</code></pre>\n<blockquote>&quot;자바스크립트를 배우면 이 API를 마음대로 끌어다 쓸 수 있습니다.&quot;</blockquote>\n<hr>\n<h4>2-10. Git과 GitHub</h4>\n<pre><code>🎮 Git = 게임 세이브 파일\n└─ 실수했을 때 &quot;어제 오후 3시 시점&quot;으로 시간을 되돌릴 수 있게 기록하는 도구.\n   코드 히스토리를 관리하는 버전 관리 시스템.\n\n📸 GitHub = 개발자들의 인스타그램\n└─ 깃으로 저장한 코드를 클라우드에 올려서 공유하는 사이트.\n   개발자/퍼블리셔의 포트폴리오 플랫폼.</code></pre>\n<blockquote>포폴 전략 → <strong>깃허브 주소를 함께 제출</strong>하면 '실무 준비 됐네' 점수 추가!</blockquote>\n<hr>\n<h4>2-11. 노코드 vs 커스텀 코딩</h4>\n<pre><code>🍱 노코드 (아임웹, 윅스)  → 밀키트 / 3분 요리\n└─ 빠르고 쉽지만 커스텀 한계. 똑같은 디자인 양산됨.\n\n👨‍🍳 커스텀 코딩 (우리가 배우는 것)  → 셰프의 요리\n└─ 재료부터 데코까지 100% 수정 가능.</code></pre>\n<blockquote>&quot;기업은 3분 요리를 데워주는 사람보다 <strong>직접 레시피를 개발할 수 있는 셰프(퍼블리셔)</strong> 를 원합니다.&quot;</blockquote>\n<hr>\n<h4>2-12. 웹 보안 기초 (퍼블리셔 필수 상식)</h4>\n<ul><li>\n<strong>난독화 (Obfuscation)</strong>: 변수 이름을 <code>a</code>, <code>b</code>, <code>c</code>처럼 아무 의미 없게 바꾸고 구조를 꼬아 해킹을 어렵게 만드는 기술.\n</li><li>\n<strong>최소화 (Minification)</strong>: 코드의 공백과 줄 바꿈을 없애 텍스트 지옥으로 만들면, 파일 크기도 줄고 속도도 빨라짐.\n</li><li>\n<strong>서버 사이드 검증</strong>: 회원 인증, 결제, 개인정보 등 중요한 검증은 반드시 <strong>백엔드(서버)</strong>에서 처리해야 함.\n</li><li>\n<strong>퍼블리셔 절대 금기</strong>:\n<ul><li>\n<ul><li>\n코드 안에 비밀번호 직접 저장 금지 (<code>if (password == &quot;1234&quot;)</code> 같은 코드)\n</li><li>\n돈 계산·당첨자 선정 같은 중요 로직을 프론트엔드에 노출 금지\n</li><li>\nF12(개발자 도구)로 내 화면이 얼마나 보이는지 늘 직접 확인하는 습관 필요\n</li></ul>\n</li></ul>\n</li></ul>\n<hr>\n<h4>2-13. AI 시대와 코딩</h4>\n<ul><li>\n<strong>요새는 코딩의 암흑기</strong>: 비전공자 및 신입들은 구조를 모르기 때문에 기반 지식을 쌓은 뒤 AI를 학습하면 잘 활용 가능.\n</li><li>\n<strong>바이브 코딩 (Vibe Coding)</strong>: AI에게 구체적 코드 대신 &quot;이런 느낌(Vibe)의 기능&quot;을 요청해 코드를 짜는 방식.\n</li><li>\n<strong>한계</strong>: 기초(Web 1~4)를 모르면 AI가 엉뚱한 코드를 생성해도 눈치채지 못함. <strong>기본 내공이 있어야 AI를 완벽히 통제 가능</strong>.\n</li><li>\n<strong>디버깅 (Debugging)</strong>: 버그를 잡는 작업. 요즘은 AI를 많이 활용함.\n</li></ul>\n<hr>\n<h3>3. 커리큘럼 전체 구조</h3>\n<h4>3-1. 전체 과목 목록</h4>\n<pre><code>본원 웹학과 교육과정 (전체)\n├─ 포토샵\n├─ 일러스트\n├─ 포토웍스 (포토샵 심화)\n├─ 디일러 (일러스트 심화)\n├─ UX/UI 1\n├─ UX/UI 2\n├─ 웹1 (웹표준 기초 - HTML/CSS)\n├─ 웹2 (웹표준 심화 - 고급 레이아웃)\n├─ 웹3 (반응형 웹)\n├─ 웹4 (자바스크립트 + 제이쿼리)\n├─ 웹모션 (SVG 애니메이션)\n├─ 웹프로젝트 1 (기획하기)\n├─ 웹프로젝트 2 (사이트에 올리기)\n├─ 웹디자인 기능사 (주말반)\n└─ 웹 포트폴리오</code></pre>\n<h4>3-2. 단계별 핵심 요약표</h4>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>핵심 기술</th><th>비유</th><th>난이도</th><th>멘탈 케어 포인트</th></tr></thead><tbody><tr><td><strong>UX/UI 1~2</strong></td><td>Figma</td><td>설계도 &amp; 모델하우스</td><td>⭐⭐</td><td>&quot;동무의 상상을 홀로그램으로 그리시오!&quot;</td></tr><tr><td><strong>Web 1~2</strong></td><td>HTML/CSS</td><td>골조 &amp; 인테리어</td><td>⭐⭐⭐</td><td>&quot;영타 200타는 무인의 기본 소양이라오!&quot;</td></tr><tr><td><strong>Web 3</strong></td><td>JavaScript</td><td>전기 &amp; 수도</td><td>⭐⭐⭐⭐⭐</td><td>&quot;정신 차리시오! 햄스터가 똑똑해지는 과정이오!&quot;</td></tr><tr><td><strong>Web 4</strong></td><td>jQuery</td><td>밀키트 라이브러리</td><td>⭐⭐⭐</td><td>&quot;비급(Library)을 쓰니 참으로 쉽지 않소?&quot;</td></tr><tr><td><strong>웹모션</strong></td><td>SVG, Animation</td><td>불쇼 &amp; 파인다이닝</td><td>⭐⭐⭐</td><td>&quot;와, 이 집 포폴 비주얼 미쳤네?&quot;</td></tr><tr><td><strong>포트폴리오</strong></td><td>전체 통합</td><td>최종 요리 완성</td><td>⭐⭐⭐⭐</td><td>1:1 피드백으로 완주</td></tr></tbody></table></div>\n<hr>\n<h3>4. 과목별 상세 설명</h3>\n<h4>4-1. 포토샵 / 포토웍스</h4>\n<ul><li>\n<strong>포토샵 (Photoshop)</strong>: 이미지 편집. 사진 보정, 합성, 자르기 등 픽셀(점) 단위 작업. 비트맵 방식이라 확대하면 깨짐.\n</li><li>\n<strong>포토웍스</strong>: 포토샵 심화 과정.\n</li></ul>\n<h4>4-2. 일러스트레이터 / 디일러</h4>\n<ul><li>\n<strong>일러스트레이터 (Illustrator)</strong>: 로고/아이콘 제작. 선과 면으로 그림을 그림. 벡터 방식이라 아무리 확대해도 선명함.\n</li><li>\n<strong>디일러</strong>: 일러스트 심화 과정.\n</li></ul>\n<hr>\n<h4>4-3. UX/UI 1 (기획과 미학)</h4>\n<blockquote>실제 벽돌을 쌓기 전, <strong>'어떤 집을 지을지'</strong> 상상하고 그리는 단계.</blockquote>\n<ul><li>\n<strong>UX (User Experience, 사용자 경험)</strong>: &quot;설계자 &amp; 건축가&quot;\n<ul><li>\n<ul><li>\n사용자가 &quot;어디가 불편할까?&quot;, &quot;이 문은 당기는 게 편할까 미는 게 편할까?&quot;를 고민하는 단계.\n</li><li>\n데이터와 심리학 기반. (예: &quot;오른손잡이가 많으니까 '구매' 버튼을 오른쪽에 두자!&quot;)\n</li><li>\n목적성 조사, 색감이 어떤지, 아이콘이 누르기 편한 위치인지, 메뉴가 접근하기 좋게 짜여졌는지 구성.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>UI (User Interface, 사용자 인터페이스)</strong>: &quot;인테리어 디자이너&quot;\n<ul><li>\n<ul><li>\nUX가 정한 위치에 예쁜 버튼을 만들고, 색칠하고, 폰트를 입히는 시각적인 작업.\n</li><li>\n(예: &quot;그 '구매' 버튼을 파란색 동그라미로 만들고 그림자를 넣자.&quot;)\n</li><li>\n우리가 접하는 화면(네이버 웹사이트, 앱 화면, 게임 화면 등).\n</li></ul>\n</li></ul>\n</li><li>\n<strong>핵심 비유</strong>: &quot;인테리어(UI)가 화려해도 서비스(UX)가 엉망이면 손님은 다시 오지 않소. 파스타는 넓은 그릇에 담아야지 와인잔에 담으면 안 되는 법! <strong>무엇을 담을지(UX)</strong>를 먼저 설계하고 <strong>그릇(UI)</strong>을 고르시오.&quot;\n</li><li>\n<strong>학습 내용</strong>: UX/UI 개념 이해, 웹디자인 기획 기초, 타이포그래피, 인터페이스 설계 요소, UX/UI 디자인 기법.\n</li><li>\n<strong>주요 툴</strong>: <strong>피그마(Figma)</strong> - 업계 표준. 웹사이트가 실제로 어떻게 작동할지 미리 만들어보는 툴. 여러 명이 동시에 접속해서 작업 가능. (어도비 XD는 잘 쓰이지 않음)\n</li><li>\n<strong>대상</strong>: 툴을 아예 모르는 초심자 입문.\n</li></ul>\n<h4>4-4. UX/UI 2 (피그마 심화)</h4>\n<ul><li>\n<strong>완전 피그마(Figma) 전문 과정</strong>.\n</li><li>\n피그마 고급 기능 학습, 반응형 웹/앱의 UX/UI 기획, 반응형 웹/앱 디자인 및 프로토타입 제작.\n</li><li>\n<strong>개편 이후</strong>: 코드 세팅 이론 강화 예정 → 건축가(디자이너)와 목수(개발자)가 대화하는 법을 더 깊게 배우게 됨.\n</li><li>\n*Tip*: &quot;피그마만 배우고 싶어요&quot;라고 하면 → 상담 필요 (단독 수강 반려 가능성).\n</li></ul>\n<hr>\n<h4>4-5. 웹1 → HTML/CSS 기초 (뼈대 세우기)</h4>\n<blockquote>비유: &quot;접시에 고기와 야채(HTML)를 담고, 소스를 예쁘게 뿌려(CSS) <strong>'음식 모형'</strong>을 만드는 단계.&quot;</blockquote>\n<blockquote>보기는 좋은데, 맛(기능)은 없고 젓가락으로 집어도 안 집힘.</blockquote>\n<ul><li>\n<strong>필수 요건</strong>: <strong>영타 200타 이상</strong> 필수. 속도가 느리면 수업을 못 따라감, 사전 연습 필요.\n</li><li>\n<strong>HTML (HyperText Markup Language)</strong> = 건물의 철근 뼈대\n<ul><li>\n<ul><li>\n웹페이지의 구조 담당. 제목, 본문, 이미지, 버튼 같은 덩어리를 놓는 것.\n</li><li>\n명령어가 아닌 '약속 기호(Tag)'. <code>&lt;button&gt;누르세요&lt;/button&gt;</code>라고 쓰면 버튼이 생김.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>CSS (Cascading Style Sheets)</strong> = 인테리어 마감재\n<ul><li>\n<ul><li>\nHTML 뼈대에 벽지를 바르고, 가구를 배치하고, 예쁘게 꾸미는 것.\n</li><li>\n크기, 색상, 레이아웃(배치) 담당.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>학습 내용</strong>: HTML5 기본 태그, CSS3 기본 속성, 기본 레이아웃 패턴, 웹표준(유니버설 디자인), 접근성(장애인 차별 금지법).\n</li><li>\n<strong>결과</strong>: 간단하고 정적인 사이트 구현 가능.\n</li></ul>\n<h5>시맨틱 태그 (Semantic Tag) → Web2 심화 포함</h5>\n<ul><li>\n<strong>개념</strong>: &quot;의미가 담긴 이름표&quot;\n<ul><li>\n<ul><li>\n옛날엔 모든 박스를 <code>&lt;div&gt;</code>(그냥 박스)라고 불렀음.\n</li><li>\n지금은 <code>&lt;header&gt;</code>(머리말), <code>&lt;footer&gt;</code>(바닥글), <code>&lt;nav&gt;</code>(메뉴)처럼 이름표를 정확히 붙임.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>왜 쓰는가?</strong>\n<ul><li>\n<ul><li>\n<strong>시각장애인 배려</strong>: 화면 낭독기(스크린 리더)가 &quot;여기는 메뉴입니다&quot;, &quot;여기는 본문입니다&quot;라고 정확히 읽어줌. (웹 접근성 / 훈민정음의 애민정신)\n</li><li>\n<strong>검색엔진 최적화(SEO)</strong>: 구글 로봇이 &quot;아, 여기가 진짜 본문이구나!&quot; 하고 정보를 더 잘 긁어감.\n</li></ul>\n</li></ul>\n</li></ul>\n<hr>\n<h4>4-6. 웹2 → 레이아웃 심화 (테이블 세팅과 배치)</h4>\n<blockquote>비유: &quot;손님이 먹기 편하게 국그릇은 오른쪽, 밥그릇은 왼쪽에 <strong>'제자리에 배치'</strong>하는 법.&quot;</blockquote>\n<ul><li>\n<strong>학습 내용</strong>: 화면 레이아웃(배치) 잡는 법.\n</li><li>\n<strong>기술</strong>: 옛날 방식(Float)과 최신 방식(Flex/Grid)을 모두 배워, 어떤 화면이 와도 깔끔하게 차려내는 능력.\n</li><li>\nHTML5 시맨틱 태그, CSS3 고급 속성, 고급 레이아웃 패턴 학습.\n</li><li>\n애니메이션, 영상 넣기 등 심화 과정 포함.\n</li></ul>\n<hr>\n<h4>4-7. 웹3 → 반응형 웹 (마법의 그릇)</h4>\n<blockquote>비유: &quot;<strong>'그릇이 살아 움직인다!'</strong> 거인(PC)이 오면 큰 접시로 변하고, 요정(모바일)이 오면 작은 컵으로 변하면서 음식 배치가 저절로 바뀜.&quot;</blockquote>\n<blockquote>또는 &quot;물 같은 웹사이트&quot; → 물을 컵에 담으면 컵 모양, 대야에 담으면 대야 모양이 되듯이.</blockquote>\n<ul><li>\n<strong>개념</strong>: PC, 태블릿, 모바일 등 다양한 화면 크기에 대응하는 기술. 소스 코드는 하나인데, CSS(미디어 쿼리)로 화면 크기를 감지해 배치를 바꿈.\n</li><li>\n<strong>난이도</strong>: <strong>'통곡의 벽'</strong>. 고정된 그릇(px)이 아니라 늘어나는 그릇(%)을 써야 해서 난이도 급등.\n</li><li>\n<strong>학습 내용</strong>: 반응형 웹 레이아웃 패턴, 내비게이션 패턴, 모바일/태블릿/PC 데스크톱 화면 구현.\n</li></ul>\n<hr>\n<h4>4-8. 웹4 → JavaScript + jQuery (지글지글 요리하기)</h4>\n<blockquote>비유: &quot;<strong>'생명과 맛'</strong>. 불을 켜서 스테이크가 지글거리고(이벤트), 메뉴판을 누르면 음식이 뿅 하고 나옵니다(동적 구현).&quot;</blockquote>\n<ul><li>\n<strong>자바스크립트 (JavaScript)</strong> = 전기 배선 &amp; 스위치\n<ul><li>\n<ul><li>\n정지해 있는 건물에 전기를 넣어서 움직이게 함.\n</li><li>\n이미지 슬라이드 넘기기, 팝업창 띄우기, 로그인 버튼 누르면 서버로 정보 보내기 등 동적 기능 담당.\n</li><li>\n<strong>ECMAScript(ES6)</strong>: 회사끼리 싸우지 말라고 정한 자바스크립트의 '공식 표준 레시피' 명칭.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>제이쿼리 (jQuery)</strong> = 밀키트 (간편 조리 세트)\n<ul><li>\n<ul><li>\nJS로 짜려면 10줄 필요한 복잡한 코드를 2줄로 압축해 만들어 둔 도구 모음(라이브러리).\n</li><li>\n요즘은 JS 자체가 좋아져서 잘 안 쓰지만, 옛날에 만든 사이트 유지보수 때문에 배움.\n</li><li>\n학원 Web3에서는 자바스크립트의 라이브러리인 제이쿼리(jQuery) 학습 위주.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>학습 내용</strong>: ECMA스크립트6 이해 및 기본 문법, 제이쿼리 이벤트와 메서드/플러그인 활용법, 동적 모션 구현.\n</li><li>\n<strong>전략</strong>: 가장 어려워하는 구간. 이때 멘탈을 잡기 위해 <strong>웹디자인 기능사(조리사 자격증)</strong> 취득을 유도.\n</li></ul>\n<h5>바닐라 JS(Vanilla JS) vs 제이쿼리(jQuery) 비교</h5>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>바닐라 JS (Vanilla JS)</th><th>제이쿼리 (jQuery)</th></tr></thead><tbody><tr><td><strong>정체</strong></td><td>아무 라이브러리도 섞지 않은 순수 자바스크립트</td><td>바닐라 JS를 쓰기 쉽게 개조한 도구 세트</td></tr><tr><td><strong>명령 방식</strong></td><td><code>document.querySelector('.box').style.color = 'red';</code></td><td><code>$('.box').css('color', 'red');</code></td></tr><tr><td><strong>느낌</strong></td><td>문법이 다소 길고 복잡함 (엄격함)</td><td>직관적이고 매우 짧음 (편리함)</td></tr><tr><td><strong>로딩 속도</strong></td><td>매우 빠름 (추가 파일 없음)</td><td>상대적으로 느림 (라이브러리 로딩 필요)</td></tr><tr><td><strong>실무 위상</strong></td><td>현대 웹의 표준 / 취업의 필수 조건</td><td>구형 사이트 유지보수 / 퍼블리셔 입문용</td></tr></tbody></table></div>\n<ul><li>\n<strong>왜 바닐라 JS가 대세인가?</strong>\n<ul><li>\n<ul><li>\n<strong>성능</strong>: 필요한 코드만 딱 챙겨가니 로딩 속도가 빠름.\n</li><li>\n<strong>표준화</strong>: 이제 모든 브라우저가 'ES6+' 표준을 지키므로 굳이 제이쿼리라는 번역기가 필요 없음.\n</li><li>\n<strong>프레임워크 입문 조건</strong>: React, Vue 같은 현대 프레임워크는 제이쿼리를 쓰지 않음. 바닐라 JS 내공이 있어야 입성 가능.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>멘토링 필살기</strong>: &quot;제이쿼리는 실무에서 당장 마주할 '현실'이고, 바닐라 JS는 연봉을 높이고 더 좋은 회사로 가기 위한 '실력'입니다.&quot;\n</li></ul>\n<hr>\n<h4>4-9. 웹모션 → SVG &amp; Animation (파인다이닝의 기술)</h4>\n<blockquote>비유: &quot;<strong>'불쇼와 밀키트'</strong>. 스테이크 위에서 불쇼(Motion)를 보여주고, 육수는 장인이 만든 시판용 육수(Library)를 사서 부어버림.&quot;</blockquote>\n<ul><li>\n<strong>SVG</strong> = 고무줄 같은 그림\n<ul><li>\n<ul><li>\n일반 사진(jpg)은 확대하면 깨지지만, SVG는 수학 공식으로 그린 그림이라 아무리 확대해도 깨지지 않음.\n</li><li>\n로고, 아이콘, 간단한 애니메이션에 필수.\n</li></ul>\n</li></ul>\n</li><li>\n<strong>목표</strong>: &quot;와, 이 집 포폴 비주얼 미쳤네?&quot; 소리 듣게 만들기.\n</li><li>\n<strong>학습 내용</strong>: SVG 기본 문법, 기능 툴과 애니메이션 실습, 생동감 있고 역동적인 웹 구현.\n</li></ul>\n<hr>\n<h4>4-10. 웹프로젝트 1 &amp; 2</h4>\n<ul><li>\n<strong>웹프로젝트 1 (기획하기)</strong>: 지금까지 배운 지식을 활용하여 사이트 주제와 컨셉을 정하고, 미디어별 화면 설계 및 디자인 시안 제작.\n</li><li>\n<strong>웹프로젝트 2 (사이트에 올리기)</strong>: 디자인 시안을 분석하고 웹페이지 기본 구조를 코딩하며, 미디어별 화면을 구현하고 필요한 동적 요소를 구현.\n</li></ul>\n<hr>\n<h4>4-11. 웹디자인 기능사 (국가기술자격)</h4>\n<ul><li>\n<strong>주관</strong>: 큐넷 (한국산업인력공단), 연 4회 실시.\n</li><li>\n<strong>의미</strong>: 웹 에이전시는 '시간'이 생명. 포트폴리오는 작업 시간을 알 수 없으나, 기능사 시험은 시간제한이 있어서 <strong>전문 지식 + 정해진 시간 내 완수 능력</strong>을 동시에 어필 가능.\n</li><li>\n<strong>전략</strong>: 필기는 문제은행식으로 개별 취득. <strong>실기(작업형)</strong>는 학원 대비반을 통해 4시간 내 완성하는 훈련 필수.\n</li><li>\n<strong>운영</strong>: 주말반으로 운영.\n</li></ul>\n<hr>\n<h4>4-12. 웹 포트폴리오 (최종)</h4>\n<ul><li>\n<strong>기간</strong>: 최소 2개월 이상 소요. (개인차 있음, 채워야 하는 양에 따라 3~5개월)\n</li><li>\n<strong>구성</strong>: 자기소개 페이지 + 2개 사이트 리뉴얼/구축 (기본).\n</li><li>\n<strong>내용</strong>: 기획 → 설계(UX/UI) → 구현(코딩) → 포트폴리오 제작의 전체 실무 프로세스를 혼자 힘으로 완주.\n</li><li>\n<strong>결과</strong>: 취업 시 내 명함이 되는 '나만의 웹사이트' 완성. 1:1 피드백으로 진행.\n</li><li>\n<strong>핵심 주의</strong>: 학원 레시피(수업 예제)를 그대로 내면 &quot;이거 냉동식품 돌렸네요?&quot; 하고 탈락. 조리법(Code)은 그대로 쓰되, 재료와 소스(주제/디자인)를 바꿔서 <strong>'나만의 시그니처 메뉴'</strong>로 재창조해야 함.\n</li></ul>\n<hr>\n<h3>5. 프로그램 · 언어 설명</h3>\n<h4>5-1. 디자인 도구</h4>\n<div class=\"tw\"><table><thead><tr><th>툴</th><th>특징</th></tr></thead><tbody><tr><td><strong>포토샵 (Photoshop)</strong></td><td>이미지 편집, 사진 보정/합성/자르기. 비트맵(픽셀) 방식.</td></tr><tr><td><strong>일러스트레이터</strong></td><td>로고/아이콘 제작. 벡터 방식 → 확대해도 선명함.</td></tr><tr><td><strong>피그마 (Figma)</strong></td><td>웹사이트 설계도(프로토타입) 제작. 여러 명 동시 접속 작업 가능. 업계 표준.</td></tr><tr><td><strong>VS Code</strong></td><td>전 세계 개발자가 가장 많이 쓰는 코딩 프로그램. 자동 완성, 알림 기능.</td></tr><tr><td><strong>메모장</strong></td><td>코딩 원리 이해용 기초 텍스트 에디터.</td></tr></tbody></table></div>\n<blockquote>비유: 메모장 = 연필, VS Code = 아이패드.</blockquote>\n<hr>\n<h4>5-2. 프로그래밍 언어 전체 정리</h4>\n<h5>C 언어 계열</h5>\n<div class=\"tw\"><table><thead><tr><th>언어</th><th>특징</th><th>주요 용도</th></tr></thead><tbody><tr><td><strong>C언어</strong></td><td>모든 언어의 뿌리. 기계어와 가장 친한 언어. 엄격하고 깊은 내공 요구.</td><td>임베디드(세탁기, 에어컨, 밥솥 내부 칩 제어), 7-Segment 실습</td></tr><tr><td><strong>C++ (씨 쁠쁠)</strong></td><td>C언어의 정통 후계자. 객체 지향 무공 추가. 엄청 빠름.</td><td>고사양 3D 게임, 포토샵 같은 무거운 프로그램</td></tr><tr><td><strong>C# (씨 샵)</strong></td><td>마이크로소프트의 언어. 현대적 편의성. Java와 사촌지간.</td><td>윈도우 프로그램, 유니티(Unity) 게임 개발</td></tr></tbody></table></div>\n<blockquote>C 가문 비유: C언어 = 라틴어, C++ = 이탈리아어, C# = 영어(글로벌 표준어)</blockquote>\n<h5>Java vs JavaScript (햄과 햄스터)</h5>\n<blockquote>두 언어는 <strong>'바다'</strong>와 <strong>'바다코끼리'</strong>만큼이나 기술적 접점이 없는 타인. 이름만 비슷하고 완전히 남남.</blockquote>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>Java (마스터 햄)</th><th>JavaScript (햄스터)</th></tr></thead><tbody><tr><td><strong>기본 철학</strong></td><td>&quot;법대로 합시다 (Strict)&quot;</td><td>&quot;좋은 게 좋은 거죠 (Flexible)&quot;</td></tr><tr><td><strong>타이핑</strong></td><td>정적 타이핑 (Static)</td><td>동적 타이핑 (Dynamic)</td></tr><tr><td><strong>오류 반응</strong></td><td>틀리면 요리 시작도 안 함 (컴파일 에러)</td><td>일단 어떻게든 요리함 (느슨한 처리)</td></tr><tr><td><strong>1 + &quot;1&quot; 결과</strong></td><td>&quot;무엄하다! (에러)&quot;</td><td>&quot;11 이지롱! (성공)&quot;</td></tr><tr><td><strong>주요 용도</strong></td><td>대기업/은행/공공기관 서버 (백엔드)</td><td>웹 브라우저에서 동작 (프론트엔드)</td></tr><tr><td><strong>특징</strong></td><td>객체지향(부품 조립식). 단단하고 복잡함.</td><td>인터프리터(즉시 실행). 유연하고 자유로움.</td></tr></tbody></table></div>\n<ul><li>\n<strong>Java 취약점 이슈</strong>: 만들어진 결과물을 뜯어보면(디컴파일), 어떤 재료와 비법을 썼는지 역추적하기 쉬워서 '해킹(분석)에 취약하다'는 꼬리표가 붙었음. &quot;레시피 도난 위험.&quot;\n</li><li>\n<strong>JavaScript 이름의 비밀</strong>: 원래 Java랑 아무 상관 없는데, 당시 '자바'가 인기 있어서 이름만 슬쩍 비슷하게 지은 것. (햄 vs 햄스터)\n</li></ul>\n<h5>Python (파이썬)</h5>\n<ul><li>\n문법이 영어 문장처럼 쉬워서 초보자에게 인기 1위.\n</li><li>\n<strong>AI(인공지능)</strong>, 데이터 분석, 백엔드 서버 개발에 주로 쓰임.\n</li><li>\n프론트/백 가리지 않고 사용 가능. (단, 웹 프론트엔드에서는 JS가 표준)\n</li></ul>\n<h5>Node.js</h5>\n<ul><li>\n자바스크립트 실행 엔진. JS가 서버에서도 동작할 수 있게 해주는 환경.\n</li><li>\nV8 엔진이라는 슈퍼 가속기로 업무 속도를 폭발시킴.\n</li><li>\n비유: 햄스터(JS)의 강력한 갑옷(강화 슈트).\n</li></ul>\n<hr>\n<h4>5-3. 라이브러리 vs 프레임워크</h4>\n<div class=\"tw\"><table><thead><tr><th>구분</th><th>특징</th><th>주도권</th><th>예시</th></tr></thead><tbody><tr><td><strong>라이브러리</strong></td><td>반찬가게 &amp; 공구함. 필요할 때만 골라 쓰는 부품.</td><td>개발자(나)</td><td>jQuery, Lodash</td></tr><tr><td><strong>프레임워크</strong></td><td>프랜차이즈/오마카세. 시스템이 정한 규칙대로 일해야 함.</td><td>시스템</td><td>Vue, Angular</td></tr><tr><td><strong>리액트(React)</strong></td><td>웹을 레고 블록(Component) 단위로 조립. 가상 DOM(Virtual DOM) 사용.</td><td>혼합</td><td>-</td></tr></tbody></table></div>\n<hr>\n<h4>5-4. 커리어 진화 로드맵 (퍼블리셔 → 프론트엔드)</h4>\n<pre><code>Lvl 1. 정통 퍼블리셔 (UI Master)\n└─ 디자인을 1px 오차 없이 구현하는 화면의 수호자. (우리 과정의 종착지)\n\nLvl 2. 스마트 퍼블리셔 (JS Specialist)\n└─ jQuery 없이 순수 바닐라 JS를 부리며 논리력을 장착한 상태.\n\nLvl 3. 프론트엔드 개발자 (Architect)\n└─ React 같은 대규모 프레임워크 무공을 익혀 대규모 시스템을 관리하는 고수.</code></pre>\n<blockquote>&quot;퍼블리셔 출신은 개발자들보다 <strong>눈(디자인 안목)</strong>과 <strong>기본기(HTML 구조)</strong>가 뛰어나, 현업에서 가장 선호하는 최고의 인재가 될 수 있다!&quot;</blockquote>\n<hr>\n<h3>6. 취업 및 진로</h3>\n<h4>6-1. 취업 분야 가이드</h4>\n<div class=\"tw\"><table><thead><tr><th>분야</th><th>주요 업무 및 특징</th><th>추천 성향</th></tr></thead><tbody><tr><td><strong>1. 웹 에이전시</strong></td><td>웹사이트 제작 전문 회사. 다양한 기업의 사이트를 수주받아 제작. 디자인/퍼블리싱/유지보수.</td><td>다양한 스타일을 경험하고 실력을 빨리 키우고 싶은 분.</td></tr><tr><td><strong>2. 쇼핑몰 (자사몰)</strong></td><td>카페24 등 템플릿 관리. 상품 페이지 제작, 배너 디자인, 사이트 관리.</td><td>패션/유통에 관심 있고 안정적인 업무를 선호하는 분.</td></tr><tr><td><strong>3. 인하우스 (일반기업)</strong></td><td>특정 기업 홍보팀/디자인팀. 자사 브랜드 사이트 관리 및 마케팅 디자인.</td><td>한 브랜드에 깊게 관여하고 싶고 워라밸을 중시하는 분.</td></tr><tr><td><strong>4. UI/UX 디자인</strong></td><td>앱(App) 서비스 기획 및 디자인. 편리한 사용성을 연구하고 화면 설계.</td><td>논리적인 사고를 즐기고, 모바일 앱 분야에 관심 있는 분.</td></tr><tr><td><strong>5. 프리랜서/기타</strong></td><td>크몽 등 재능 마켓 활동, 강사, 개발자 전직 등.</td><td>독립적인 성향, 자기 주도적인 분.</td></tr></tbody></table></div>\n<ul><li>\n<strong>취업처 요약</strong>: 웹 에이전시(전문 식당), 인하우스(기업 구내식당), 홈쇼핑, 언론사 등.\n</li></ul>\n<h4>6-2. 인재상 및 성향</h4>\n<ul><li>\n<strong>가장 중요한 것 → 인내심</strong>: 코딩은 에러 하나 잡으려고 밤새는 일이 많음. 곰국 끓이듯이 진득하게 앉아서 원인을 찾을 수 있는 <strong>'엉덩이 무거운 사람'</strong>이 최고.\n</li><li>\n<strong>추천 성향</strong>: 꼼꼼한 사람, 규칙 지키는 걸 좋아하는 사람, 시각적 피드백(내가 만든 게 바로 보이는 것)을 즐기는 사람.\n</li><li>\n<strong>시장 변화</strong>: 예전에는 혼자 다 했지만, 지금은 퍼블리셔(조리 전문)와 웹 디자이너(플레이팅 전문)로 나뉨. 하지만 사장님들은 여전히 <strong>풀스택(Full-Stack)</strong>을 좋아함 (요리도 하고, 서빙도 하고, 배달도 하는 만능 점원).\n</li></ul>\n<h4>6-3. AI 시대의 취업 전략</h4>\n<ul><li>\nAI 도입으로 단순 하드코딩은 AI가 대신하는 시대. 비전공생/신입들은 구조를 모르기 때문에 기반 지식을 쌓은 뒤 AI를 학습하면 유리.\n</li><li>\n우리는 AI가 갖추지 못한 <strong>인간의 역량(디자인 감각, 맥락 이해, 기획력)</strong>을 키워야 함.\n</li><li>\n기초(Web 1~4)를 알아야 AI도 부려먹을 수 있음.\n</li></ul>\n<h4>6-4. 포트폴리오 전략</h4>\n<ul><li>\n<strong>자기소개 페이지 + 사이트 2개 기본</strong> (기획 → 설계 → 코딩 → 완성).\n</li><li>\n<strong>재탕 금지</strong>: 수업 예제를 그대로 내면 탈락. 주제/디자인을 바꿔서 나만의 시그니처 메뉴로 재창조.\n</li><li>\n<strong>깃허브 주소 함께 제출</strong>: '실무 준비 됐네' 점수 추가.\n</li><li>\n<strong>웹디자인 기능사 병행</strong>: 실력 + 시간 내 완수 능력을 동시에 어필.\n</li><li>\n<strong>집에서 연습 필수</strong>: 코딩은 언어 배우는 것과 같음. 반복 학습이 핵심.\n</li></ul>\n<hr>\n<h3>7. 상담 포인트</h3>\n<h4>7-1. 자주 묻는 질문 (Q&amp;A) → 방어용 답변</h4>\n<p><strong>Q. 코딩 너무 어려워요. 꼭 해야 하나요?</strong></p>\n<blockquote>A. 샘플 페이지 만들기까지는 해야 함. 개발자만큼 할 필요는 없지만 구조는 알아야 함.</blockquote>\n<p><strong>Q. 집에서 공부해야 하나요?</strong></p>\n<blockquote>A. 네, 연습 필수. 코딩은 언어 배우는 것과 같음.</blockquote>\n<p><strong>Q. 쇼핑몰 만들면 돈 되나요?</strong></p>\n<blockquote>A. 네, 됩니다. 단, 프론트/백엔드 지식 없이 접근하면 유지보수가 어려움.</blockquote>\n<p><strong>Q. 비전공자인데 AI로만 하면 안 되나요?</strong></p>\n<blockquote>A. 글자수나 이름 등 디테일 수정 시 코딩 없이는 어려움. AI는 구체적으로 요청하지 않으면 엉뚱한 걸 만듦. 기본 흐름: 만들어보고 → 웹1, 2 배우고 → 고생했고 → 취업.</blockquote>\n<p><strong>Q. 피그마만 배우고 싶어요.</strong></p>\n<blockquote>A. 상담 필요 (단독 수강 반려 가능성. 학과장님 또는 팀장님께 문의).</blockquote>\n<p><strong>Q. 저 앱 만들고 싶은데 웹 과정 들어도 돼요?</strong></p>\n<blockquote>A. 웹 디자인 배우면 '하이브리드 앱'의 알맹이를 만들 수 있어서 쇼핑몰 취업에 유리함. 쇼핑몰 앱 90%가 하이브리드 앱 방식.</blockquote>\n<p><strong>Q. 윅스(Wix)나 아임웹으로 코딩 없이 만들면 되는 거 아닌가요?</strong></p>\n<blockquote>A. 노코드는 밀키트/3분 요리. 커스텀 한계가 있고 디자인이 양산됨. 기업은 직접 레시피를 개발할 수 있는 셰프(퍼블리셔)를 원함.</blockquote>\n<p><strong>Q. C언어는 안 배우나요?</strong></p>\n<blockquote>A. C언어는 기계 제어(임베디드) 언어. 웹 디자인과는 분야가 다름.</blockquote>\n<hr>\n<h4>7-2. 상담 멘트 (Closing)</h4>\n<blockquote>&quot;이 과정은 단순한 툴 교육이 아닙니다. <strong>'기획(UX) → 디자인(UI) → 구현(Coding)'</strong>으로 이어지는 <strong>웹사이트 제작의 A to Z</strong>를 배우는 실무 과정입니다. 특히 요즘 기업들은 디자인 감각이 있는 퍼블리셔를 선호하기 때문에, 비전공자라도 포트폴리오만 잘 준비하면 에이전시나 인하우스 등 다양한 곳으로 취업할 수 있습니다.&quot;</blockquote>\n<h4>7-3. 비유 치트키 모음</h4>\n<div class=\"tw\"><table><thead><tr><th>상황</th><th>비유</th></tr></thead><tbody><tr><td>HTML</td><td>건물의 철근 뼈대</td></tr><tr><td>CSS</td><td>인테리어 마감재 (벽지/가구)</td></tr><tr><td>JavaScript</td><td>전기 배선 &amp; 스위치</td></tr><tr><td>jQuery</td><td>밀키트 (간편 조리 세트)</td></tr><tr><td>Java</td><td>마스터 햄 (깐깐한 독일 장인)</td></tr><tr><td>JavaScript</td><td>햄스터 (유연한 예술가)</td></tr><tr><td>UX</td><td>설계자 &amp; 건축가</td></tr><tr><td>UI</td><td>인테리어 디자이너</td></tr><tr><td>서버</td><td>주방 / 땅</td></tr><tr><td>DB</td><td>대형 냉장고</td></tr><tr><td>API</td><td>식당의 웨이터</td></tr><tr><td>반응형 웹</td><td>물 같은 웹사이트 (컵에 담으면 컵 모양)</td></tr><tr><td>라이브러리</td><td>반찬가게 / 공구함 (내가 주도권 가짐)</td></tr><tr><td>프레임워크</td><td>프랜차이즈 / 오마카세 (시스템이 주도권 가짐)</td></tr><tr><td>Git</td><td>게임 세이브 파일</td></tr><tr><td>GitHub</td><td>개발자들의 인스타그램</td></tr><tr><td>바이브 코딩</td><td>칼질 몰라도 AI 로봇한테 말로 시켜서 요리하는 시대</td></tr></tbody></table></div>\n<hr>\n<h3>8. 수강료 · 패키지 안내</h3>\n<blockquote>단위: 만원 (과목당 단가) · 실제 등록 시 팀장님께 견적 확인 필수</blockquote>\n<pre><code>🌐 웹 / UX·UI\n&gt; 전 과목 45~50 · 주말은 웹디자인기능사만 운영\n\n📅 평일\n├─ 🎨 UX·UI 디자인 (50)\n│     UXUI1 웹기획, 웹디자인 기초 (피그마는 후반에 살짝)\n│     UXUI2 피그마 심화, 반응형 웹·앱 디자인 프로토타입\n├─ 💻 웹 퍼블리싱 (50)\n│     웹1 HTML, CSS 웹표준\n│     웹2 심화 HTML CSS 고급 레이아웃\n│     웹3 반응형 웹 이해\n│     웹4 자바스크립트, 제이쿼리\n├─ 🎞️ 웹모션 SVG 애니메이션  45\n└─ 📁 포폴\n      웹포폴 (50) / UXUI포폴 (50)\n\n📅 주말\n└─ 🏅 웹디자인기능사  50\n\n🌙 방과후 특강 (방특)\n├─ 포토샵  30 / 포토웍스  32\n└─ 일러스트  30 / 디일러  32</code></pre>\n<h4>관련 자격증</h4>\n<ul><li>\n<strong>GTQ</strong> (그래픽기술자격, 포토샵)\n</li><li>\n<strong>GTQi</strong> (일러스트)\n</li><li>\n<strong>GTQid</strong> (인디자인)\n</li><li>\n<strong>ACP</strong> (어도비 공인 자격증)\n</li><li>\n<strong>그래픽기능사</strong>\n</li><li>\n<strong>컬러리스트</strong>\n</li><li>\n<strong>웹디자인기능사</strong> (국가기술자격, 큐넷, 연 4회)\n</li></ul>\n<h4>신설 과정: AI 네이버 코드 (스마트스토어 / 노코드)</h4>\n<ul><li>\n<strong>기간</strong>: 6개월 과정 (클라우드 코드, 노코드).\n</li><li>\n<strong>대상</strong>: 코딩을 아예 모르는 비전공자, 쇼핑몰 창업 희망자.\n</li><li>\n<strong>장점</strong>: 개발 몰라도 쇼핑몰/랜딩 페이지 구축 가능. 자기소개 + 2개 사이트 기본.\n</li><li>\n<strong>단점</strong>: 디테일한 수정(글자 폰트, 미세 레이아웃 등)이 어려움. 결국 웹1, 2(HTML/CSS)를 배워야 커스텀 가능.\n</li><li>\n현재 과정 개편 예고됨. 변경 가능.\n</li></ul>\n<hr>\n<blockquote><strong>출처</strong>: 문의준 팀장님 필기 노트, 서우정 학과장님 강의, 김○○ 강사님 교육, 멘토 강의 통합 정리</blockquote>\n<blockquote><strong>최종 정리일</strong>: 2026-02-28</blockquote>\n<blockquote><strong>키워드</strong>: #웹학과 #웹디자인 #웹퍼블리싱 #UXUI #HTML #CSS #JavaScript #jQuery #Figma #취업 #커리큘럼 #상담가이드</blockquote>","x":"💻 웹학과 지식 통합본 웹학과 상담과 수업 안내에 필요한 지식을 한 문서에 모은 통합본이다. 웹 디자인의 정의와 업무 흐름, 비전공자 눈높이의 it·웹 기초 상식, 포토샵부터 웹 포트폴리오까지의 커리큘럼과 과목별 설명, 프로그램·언어 정리, 취업 분야와 인재상, 상담 q&a와 비유 치트키, 수강료·패키지 안내를 8개 절에 담았다. 9월 이후 과목명은 아래 개편 안내에 적힌 정본 문서를 먼저 확인한다. aix 커리큘럼 개편(2026 09~) 적용 예정. 9월 이후 개강·상담은 aix_커리큘럼개편_260715 을 정본으로 우선 확인할 것(ai에이전트웹·ai바이브코딩→aix 바이브코딩, ai피그마→aix 피그마). 이 문서의 구과목명은 8월 개강분까지만 유효, 자동 갱신 안 됨. 목적 : 웹학과 관련 모든 학습 노트, 강의 필기, 상담 가이드, 커리큘럼 자료를 하나로 통합한 완결판. 출처 : 문의준 팀장님 필기, 서우정 학과장님 수업, 김○○ 강사님 교육, 멘토 강의 노트 등 통합 정리. 목차 1. 1. 학과 개요 2. 2. it · 웹 기초 상식 3. 3. 커리큘럼 전체 구조 4. 4. 과목별 상세 설명 (웹디자인 · 퍼블리싱) 5. 5. 프로그램 · 언어 설명 6. 6. 취업 및 진로 7. 7. 상담 포인트 8. 8. 수강료 · 패키지 안내 1. 학과 개요 1 1. 웹 디자인이란? \"웹 디자인은 그림만 그리는 게 아니라, 기술로 구현하는 것입니다.\" 공식 : design (시각적 표현) + coding (기술적 구현) 목표 : html5와 css3 웹 표준 기술을 익혀, 내가 디자인한 것을 실제 웹사이트로 만들어내는 능력 배양. 정의 : 웹은 관리하고 구축하는 영역. 어떤 디바이스(pc, 모바일 등)에서도 최적화된 화면을 송출해야 함. 1 2. 업무 흐름 (process) 기획(planning) → 디자인(design) → 퍼블리싱(publishing) → 개발(dev) 단계 직군 역할 : : : 기획 ux 디자이너, 기획자 건축으로 치면 '설계도'를 만드는 최상위 단계 디자인 웹 디자이너 기획자가 만든 설계도를 시각화 퍼블리싱 웹 퍼블리셔 디자인과 개발의 가교. 디자이너의 시안을 코드로 변환하여 웹에 띄움 개발 프론트엔드 / 백엔드 개발자 뒷단의 데이터 처리 1 3. 우리 학원의 정체성 우리 학과는 '디자인' 위주 → 백엔드의 복잡한 계산보다 시각적 완성도 와 유니버설 디자인(웹 접근성) 에 집중. 핵심 양성 인재 : 디자인 감각과 코딩 논리를 모두 갖춘 웹 퍼블리셔 . 차별점 : 실무 투입 속도가 가장 빠른 직군. 퍼블리셔 출신은 디자인 안목과 html 구조 기초가 뛰어나 현업에서 선호하는 상급 인재. 2. it · 웹 기초 상식 2 1. 코딩 문맹 탈출 (비전공자 눈높이 설명) 상담 필살기: \"코딩, 어렵게 생각 마세요. 주방에서 일어나는 일과 똑같아요.\" 언어의 3단계 종류 설명 : : 자연어 (natural language) 한국어, 영어처럼 '사람' 이 쓰는 말 기계어 (machine language) 0과 1로 된 '컴퓨터' 의 말 프로그래밍 언어 사람의 말(자연어)을 컴퓨터(기계어)가 알아듣게 '번역' 해주는 중간 언어 번역 방식: 컴파일러 vs 인터프리터 컴파일러 (compiler = 번역가): 책 한 권을 처음부터 끝까지 다 번역해서 완성본을 만드는 방식. 실행 속도는 빠르지만, 오타 하나 고치려면 책을 처음부터 번역해야 해서 수정이 번거로움. (java, c언어 등) 인터프리터 (interpreter = 동시 통역사): 셰프가 주문서 읽듯이, 한 줄 한 줄 읽으면서 바로바로 실행하는 방식. 웹(web)은 손님(사용자) 반응을 보고 바로바로 화면을 고쳐야 하기 때문에 이 방식을 씀. (javascript, python 등) 객체 지향 (oop) & 붕어빵 이론 설명 : 옛날에는 코드를 줄줄이 썼다면, 이제는 '부품(객체)' 을 만들어서 조립함. 클래스 (class = 붕어빵 기계/틀) : \"밀가루 반죽 넣고 팥 넣어서 굽는다\"는 설계도. 객체 (object = 갓 구운 붕어빵) : 틀에서 찍혀 나온 실제 붕어빵(슈크림맛, 팥맛). 붕어빵 100개를 만들 때, 100번 처음부터 만드는 게 아니라 '틀(class)' 하나만 잘 만들어두면 계속 찍어낼 수 있음. 2 2. 웹 삼위일체 (집 짓기 프로세스) 기술 역할 비유 : : : html5 (structure) 뼈대와 구조 담당. <video , <audio 등 자체 재생 가능 건물의 철근 뼈대 (철근) css3 (skin) 색상, 크기, 레이아웃 담당. 코드만으로 고급 효과 구현 인테리어 마감재 (벽지/가구) javascript (action) 동적 기능 담당. 클릭·스크롤에 반응 전기 배선 & 스위치 html의 역사 (html5인 이유) 옛날 (html 4.01) : 동영상을 보려면 '플래시'나 '액티브x' 같은 별도 도구 필요. \"개인 숟가락 지참 필수.\" 혁명 (html5) : 별도 프로그램 없이 html 하나만으로 동영상/음악 재생 가능. \"숟가락 제공.\" 숫자 5는 '표준의 완성' 을 뜻함. css의 역사 (css3인 이유) 옛날 (css 1, 2) : 둥근 모서리 하나 만들려면 포토샵으로 잘라 붙이는 노가다가 필요. \"장비 부족.\" 혁명 (css3) : 그림자, 애니메이션 등 고급 효과를 이미지 없이 코드만으로 구현 . \"최첨단 조리 도구.\" 2 3. 직무 구분: 프론트엔드 vs 백엔드 (빙산 & 식당 비유) 🏔️ 빙산 구조 ┌──────────────────────────────────┐ │ 물 위 프론트엔드 (눈에 보이는 부분) │ │ html / css / javascript │ ├──────────────────────────────────┤ │ 수면 퍼블리셔 (연결 통로) │ ├──────────────────────────────────┤ │ 물 아래 백엔드 (보이지 않는 부분) │ │ 서버 / db / java / python 등 │ └──────────────────────────────────┘ 직무 식당 비유 역할 사용 기술 : : : : 퍼블리셔 인테리어 & 플레이팅 눈에 보이는 화면(html/css) 제작. 버튼 색깔, 레이아웃 html, css, jquery 프론트엔드 웨이터 & 지배인 사용자 클릭(주문)을 받아 백엔드에 전달, 결과를 화면에 표시 html, css, js, react 백엔드 주방장 & 창고지기 보이지 않는 곳에서 데이터 처리 (서버 = 주방, db = 냉장고) java, python, node.js 엔지니어 기초 설비 & 기계실 시스템 안정성 유지, 서버 인프라 관리 시스템 전반 중요 : 프론트엔드 언어는 html, css, javascript 딱 3개. 파이썬·자바는 프론트엔드 언어가 아님. 2 4. 서버와 도메인 웹사이트를 올리는 것 = 집 짓기 🏠 서버 (server) = 땅 (land) └─ 파일을 저장하는 24시간 켜진 공간. 호스팅 = 그 땅을 임대하는 것. 🏷️ 도메인 (domain) = 도로명 주소 └─ www.naver.com 같은 인터넷 주소. 돈 주고 구매해야 함. 📒 dns (domain name system) = 전화번호부 └─ naver.com → 실제 ip 주소(223.130.195.200)로 연결해주는 시스템. 2 5. http vs https 📮 http 엽서 보내기 └─ 중간 배달부가 내용 훔쳐볼 수 있음. 보안 취약. ✉️ https 봉투에 밀봉해서 보내기 └─ 내용 암호화. 가로채도 내용 알 수 없음. 현재 표준. https 자물쇠 없으면 구글이 \"주의 요함\" 표시 → 사이트 신뢰도 바닥. 2 6. 해상도와 dpi 플랫폼 dpi 특징 : : : 웹(web) 72 dpi 기본 모바일(mobile) 144 dpi 고해상도 필요 인쇄(print) 300 dpi 최고 해상도 편집 디자인과 웹 디자인은 해상도 개념이 다름. 일반 모니터용 이미지를 아이폰에서 보면 흐릿하게 보임 → 2배, 3배 큰 이미지를 만들어 축소해서 보여주는 방식 필요 (고해상도 대응). 레티나 디스플레이 : 애플 초고밀도 화면. 사람 눈으로 픽셀 구별 불가 수준. 2 7. 크로스 브라우징 모든 브라우저에서 똑같이 잘 보이도록 호환성을 맞추는 작업 → 퍼블리셔의 핵심 역량 😤 문제 상황 └─ \"크롬에서는 예쁘게 나오는데, 아이폰(사파리)에서 보니 버튼이 깨져요!\" 🌐 브라우저 현황 ├─ chrome 전 세계 1등. 개발자 표준. ├─ safari 아이폰/맥 기본 브라우저. ├─ edge 윈도우 기본 브라우저. ├─ firefox 개발자들이 보조로 사용. └─ ie ✅ 공식 사망 → 신경 안 써도 됨! 2 8. 앱의 종류 📱 네이티브 앱 ├─ 특징: 스토어 다운로드. 빠름. 카메라/gps 완벽 사용. └─ 언어: swift (ios) / kotlin (android) 🌐 웹 앱 ├─ 특징: 설치 없이 브라우저 접속. 디자인만 앱처럼. └─ 예시: 넷플릭스/인스타 pc버전 🔀 하이브리드 앱 ← 웹 과정 취업 연결 포인트! ├─ 특징: 겉은 앱, 안은 웹사이트. └─ ⭐ 쇼핑몰 앱 90%가 이 방식 상담 포인트 → \"웹 디자인 배우면 '하이브리드 앱'의 알맹이 를 만들 수 있어서 쇼핑몰 취업에 유리합니다!\" 2 9. api api = 프로그램끼리 대화하는 창구 · 비유: 식당의 웨이터 🍽️ 동작 원리 └─ 손님 (내 웹사이트) → 웨이터 (api) → 주방 (외부 서비스) 📦 실제 사용 예시 ├─ 🗺️ 내 홈페이지에 지도 띄우기 → 네이버 지도 api ├─ 🔐 쇼핑몰에 간편 로그인 붙이기 → 카카오 로그인 api └─ 🌤️ 날씨 정보 가져오기 → 기상청 api \"자바스크립트를 배우면 이 api를 마음대로 끌어다 쓸 수 있습니다.\" 2 10. git과 github 🎮 git = 게임 세이브 파일 └─ 실수했을 때 \"어제 오후 3시 시점\"으로 시간을 되돌릴 수 있게 기록하는 도구. 코드 히스토리를 관리하는 버전 관리 시스템. 📸 github = 개발자들의 인스타그램 └─ 깃으로 저장한 코드를 클라우드에 올려서 공유하는 사이트. 개발자/퍼블리셔의 포트폴리오 플랫폼. 포폴 전략 → 깃허브 주소를 함께 제출 하면 '실무 준비 됐네' 점수 추가! 2 11. 노코드 vs 커스텀 코딩 🍱 노코드 (아임웹, 윅스) → 밀키트 / 3분 요리 └─ 빠르고 쉽지만 커스텀 한계. 똑같은 디자인 양산됨. 👨‍🍳 커스텀 코딩 (우리가 배우는 것) → 셰프의 요리 └─ 재료부터 데코까지 100% 수정 가능. \"기업은 3분 요리를 데워주는 사람보다 직접 레시피를 개발할 수 있는 셰프(퍼블리셔) 를 원합니다.\" 2 12. 웹 보안 기초 (퍼블리셔 필수 상식) 난독화 (obfuscation) : 변수 이름을 a , b , c 처럼 아무 의미 없게 바꾸고 구조를 꼬아 해킹을 어렵게 만드는 기술. 최소화 (minification) : 코드의 공백과 줄 바꿈을 없애 텍스트 지옥으로 만들면, 파일 크기도 줄고 속도도 빨라짐. 서버 사이드 검증 : 회원 인증, 결제, 개인정보 등 중요한 검증은 반드시 백엔드(서버) 에서 처리해야 함. 퍼블리셔 절대 금기 : 1. 코드 안에 비밀번호 직접 저장 금지 ( if (password == \"1234\") 같은 코드) 2. 돈 계산·당첨자 선정 같은 중요 로직을 프론트엔드에 노출 금지 3. f12(개발자 도구)로 내 화면이 얼마나 보이는지 늘 직접 확인하는 습관 필요 2 13. ai 시대와 코딩 요새는 코딩의 암흑기 : 비전공자 및 신입들은 구조를 모르기 때문에 기반 지식을 쌓은 뒤 ai를 학습하면 잘 활용 가능. 바이브 코딩 (vibe coding) : ai에게 구체적 코드 대신 \"이런 느낌(vibe)의 기능\"을 요청해 코드를 짜는 방식. 한계 : 기초(web 1~4)를 모르면 ai가 엉뚱한 코드를 생성해도 눈치채지 못함. 기본 내공이 있어야 ai를 완벽히 통제 가능 . 디버깅 (debugging) : 버그를 잡는 작업. 요즘은 ai를 많이 활용함. 3. 커리큘럼 전체 구조 3 1. 전체 과목 목록 본원 웹학과 교육과정 (전체) ├─ 포토샵 ├─ 일러스트 ├─ 포토웍스 (포토샵 심화) ├─ 디일러 (일러스트 심화) ├─ ux/ui 1 ├─ ux/ui 2 ├─ 웹1 (웹표준 기초 html/css) ├─ 웹2 (웹표준 심화 고급 레이아웃) ├─ 웹3 (반응형 웹) ├─ 웹4 (자바스크립트 + 제이쿼리) ├─ 웹모션 (svg 애니메이션) ├─ 웹프로젝트 1 (기획하기) ├─ 웹프로젝트 2 (사이트에 올리기) ├─ 웹디자인 기능사 (주말반) └─ 웹 포트폴리오 3 2. 단계별 핵심 요약표 단계 핵심 기술 비유 난이도 멘탈 케어 포인트 : : : : : ux/ui 1~2 figma 설계도 & 모델하우스 ⭐⭐ \"동무의 상상을 홀로그램으로 그리시오!\" web 1~2 html/css 골조 & 인테리어 ⭐⭐⭐ \"영타 200타는 무인의 기본 소양이라오!\" web 3 javascript 전기 & 수도 ⭐⭐⭐⭐⭐ \"정신 차리시오! 햄스터가 똑똑해지는 과정이오!\" web 4 jquery 밀키트 라이브러리 ⭐⭐⭐ \"비급(library)을 쓰니 참으로 쉽지 않소?\" 웹모션 svg, animation 불쇼 & 파인다이닝 ⭐⭐⭐ \"와, 이 집 포폴 비주얼 미쳤네?\" 포트폴리오 전체 통합 최종 요리 완성 ⭐⭐⭐⭐ 1:1 피드백으로 완주 4. 과목별 상세 설명 4 1. 포토샵 / 포토웍스 포토샵 (photoshop) : 이미지 편집. 사진 보정, 합성, 자르기 등 픽셀(점) 단위 작업. 비트맵 방식이라 확대하면 깨짐. 포토웍스 : 포토샵 심화 과정. 4 2. 일러스트레이터 / 디일러 일러스트레이터 (illustrator) : 로고/아이콘 제작. 선과 면으로 그림을 그림. 벡터 방식이라 아무리 확대해도 선명함. 디일러 : 일러스트 심화 과정. 4 3. ux/ui 1 (기획과 미학) 실제 벽돌을 쌓기 전, '어떤 집을 지을지' 상상하고 그리는 단계. ux (user experience, 사용자 경험) : \"설계자 & 건축가\" 사용자가 \"어디가 불편할까?\", \"이 문은 당기는 게 편할까 미는 게 편할까?\"를 고민하는 단계. 데이터와 심리학 기반. (예: \"오른손잡이가 많으니까 '구매' 버튼을 오른쪽에 두자!\") 목적성 조사, 색감이 어떤지, 아이콘이 누르기 편한 위치인지, 메뉴가 접근하기 좋게 짜여졌는지 구성. ui (user interface, 사용자 인터페이스) : \"인테리어 디자이너\" ux가 정한 위치에 예쁜 버튼을 만들고, 색칠하고, 폰트를 입히는 시각적인 작업. (예: \"그 '구매' 버튼을 파란색 동그라미로 만들고 그림자를 넣자.\") 우리가 접하는 화면(네이버 웹사이트, 앱 화면, 게임 화면 등). 핵심 비유 : \"인테리어(ui)가 화려해도 서비스(ux)가 엉망이면 손님은 다시 오지 않소. 파스타는 넓은 그릇에 담아야지 와인잔에 담으면 안 되는 법! 무엇을 담을지(ux) 를 먼저 설계하고 그릇(ui) 을 고르시오.\" 학습 내용 : ux/ui 개념 이해, 웹디자인 기획 기초, 타이포그래피, 인터페이스 설계 요소, ux/ui 디자인 기법. 주요 툴 : 피그마(figma) 업계 표준. 웹사이트가 실제로 어떻게 작동할지 미리 만들어보는 툴. 여러 명이 동시에 접속해서 작업 가능. (어도비 xd는 잘 쓰이지 않음) 대상 : 툴을 아예 모르는 초심자 입문. 4 4. ux/ui 2 (피그마 심화) 완전 피그마(figma) 전문 과정 . 피그마 고급 기능 학습, 반응형 웹/앱의 ux/ui 기획, 반응형 웹/앱 디자인 및 프로토타입 제작. 개편 이후 : 코드 세팅 이론 강화 예정 → 건축가(디자이너)와 목수(개발자)가 대화하는 법을 더 깊게 배우게 됨. tip : \"피그마만 배우고 싶어요\"라고 하면 → 상담 필요 (단독 수강 반려 가능성). 4 5. 웹1 → html/css 기초 (뼈대 세우기) 비유: \"접시에 고기와 야채(html)를 담고, 소스를 예쁘게 뿌려(css) '음식 모형' 을 만드는 단계.\" 보기는 좋은데, 맛(기능)은 없고 젓가락으로 집어도 안 집힘. 필수 요건 : 영타 200타 이상 필수. 속도가 느리면 수업을 못 따라감, 사전 연습 필요. html (hypertext markup language) = 건물의 철근 뼈대 웹페이지의 구조 담당. 제목, 본문, 이미지, 버튼 같은 덩어리를 놓는 것. 명령어가 아닌 '약속 기호(tag)'. <button 누르세요</button 라고 쓰면 버튼이 생김. css (cascading style sheets) = 인테리어 마감재 html 뼈대에 벽지를 바르고, 가구를 배치하고, 예쁘게 꾸미는 것. 크기, 색상, 레이아웃(배치) 담당. 학습 내용 : html5 기본 태그, css3 기본 속성, 기본 레이아웃 패턴, 웹표준(유니버설 디자인), 접근성(장애인 차별 금지법). 결과 : 간단하고 정적인 사이트 구현 가능. 시맨틱 태그 (semantic tag) → web2 심화 포함 개념 : \"의미가 담긴 이름표\" 옛날엔 모든 박스를 <div (그냥 박스)라고 불렀음. 지금은 <header (머리말), <footer (바닥글), <nav (메뉴)처럼 이름표를 정확히 붙임. 왜 쓰는가? 1. 시각장애인 배려 : 화면 낭독기(스크린 리더)가 \"여기는 메뉴입니다\", \"여기는 본문입니다\"라고 정확히 읽어줌. (웹 접근성 / 훈민정음의 애민정신) 2. 검색엔진 최적화(seo) : 구글 로봇이 \"아, 여기가 진짜 본문이구나!\" 하고 정보를 더 잘 긁어감. 4 6. 웹2 → 레이아웃 심화 (테이블 세팅과 배치) 비유: \"손님이 먹기 편하게 국그릇은 오른쪽, 밥그릇은 왼쪽에 '제자리에 배치' 하는 법.\" 학습 내용 : 화면 레이아웃(배치) 잡는 법. 기술 : 옛날 방식(float)과 최신 방식(flex/grid)을 모두 배워, 어떤 화면이 와도 깔끔하게 차려내는 능력. html5 시맨틱 태그, css3 고급 속성, 고급 레이아웃 패턴 학습. 애니메이션, 영상 넣기 등 심화 과정 포함. 4 7. 웹3 → 반응형 웹 (마법의 그릇) 비유: \" '그릇이 살아 움직인다!' 거인(pc)이 오면 큰 접시로 변하고, 요정(모바일)이 오면 작은 컵으로 변하면서 음식 배치가 저절로 바뀜.\" 또는 \"물 같은 웹사이트\" → 물을 컵에 담으면 컵 모양, 대야에 담으면 대야 모양이 되듯이. 개념 : pc, 태블릿, 모바일 등 다양한 화면 크기에 대응하는 기술. 소스 코드는 하나인데, css(미디어 쿼리)로 화면 크기를 감지해 배치를 바꿈. 난이도 : '통곡의 벽' . 고정된 그릇(px)이 아니라 늘어나는 그릇(%)을 써야 해서 난이도 급등. 학습 내용 : 반응형 웹 레이아웃 패턴, 내비게이션 패턴, 모바일/태블릿/pc 데스크톱 화면 구현. 4 8. 웹4 → javascript + jquery (지글지글 요리하기) 비유: \" '생명과 맛' . 불을 켜서 스테이크가 지글거리고(이벤트), 메뉴판을 누르면 음식이 뿅 하고 나옵니다(동적 구현).\" 자바스크립트 (javascript) = 전기 배선 & 스위치 정지해 있는 건물에 전기를 넣어서 움직이게 함. 이미지 슬라이드 넘기기, 팝업창 띄우기, 로그인 버튼 누르면 서버로 정보 보내기 등 동적 기능 담당. ecmascript(es6) : 회사끼리 싸우지 말라고 정한 자바스크립트의 '공식 표준 레시피' 명칭. 제이쿼리 (jquery) = 밀키트 (간편 조리 세트) js로 짜려면 10줄 필요한 복잡한 코드를 2줄로 압축해 만들어 둔 도구 모음(라이브러리). 요즘은 js 자체가 좋아져서 잘 안 쓰지만, 옛날에 만든 사이트 유지보수 때문에 배움. 학원 web3에서는 자바스크립트의 라이브러리인 제이쿼리(jquery) 학습 위주. 학습 내용 : ecma스크립트6 이해 및 기본 문법, 제이쿼리 이벤트와 메서드/플러그인 활용법, 동적 모션 구현. 전략 : 가장 어려워하는 구간. 이때 멘탈을 잡기 위해 웹디자인 기능사(조리사 자격증) 취득을 유도. 바닐라 js(vanilla js) vs 제이쿼리(jquery) 비교 구분 바닐라 js (vanilla js) 제이쿼리 (jquery) : : : 정체 아무 라이브러리도 섞지 않은 순수 자바스크립트 바닐라 js를 쓰기 쉽게 개조한 도구 세트 명령 방식 document.queryselector('.box').style.color = 'red'; $('.box').css('color', 'red'); 느낌 문법이 다소 길고 복잡함 (엄격함) 직관적이고 매우 짧음 (편리함) 로딩 속도 매우 빠름 (추가 파일 없음) 상대적으로 느림 (라이브러리 로딩 필요) 실무 위상 현대 웹의 표준 / 취업의 필수 조건 구형 사이트 유지보수 / 퍼블리셔 입문용 왜 바닐라 js가 대세인가? 1. 성능 : 필요한 코드만 딱 챙겨가니 로딩 속도가 빠름. 2. 표준화 : 이제 모든 브라우저가 'es6+' 표준을 지키므로 굳이 제이쿼리라는 번역기가 필요 없음. 3. 프레임워크 입문 조건 : react, vue 같은 현대 프레임워크는 제이쿼리를 쓰지 않음. 바닐라 js 내공이 있어야 입성 가능. 멘토링 필살기 : \"제이쿼리는 실무에서 당장 마주할 '현실'이고, 바닐라 js는 연봉을 높이고 더 좋은 회사로 가기 위한 '실력'입니다.\" 4 9. 웹모션 → svg & animation (파인다이닝의 기술) 비유: \" '불쇼와 밀키트' . 스테이크 위에서 불쇼(motion)를 보여주고, 육수는 장인이 만든 시판용 육수(library)를 사서 부어버림.\" svg = 고무줄 같은 그림 일반 사진(jpg)은 확대하면 깨지지만, svg는 수학 공식으로 그린 그림이라 아무리 확대해도 깨지지 않음. 로고, 아이콘, 간단한 애니메이션에 필수. 목표 : \"와, 이 집 포폴 비주얼 미쳤네?\" 소리 듣게 만들기. 학습 내용 : svg 기본 문법, 기능 툴과 애니메이션 실습, 생동감 있고 역동적인 웹 구현. 4 10. 웹프로젝트 1 & 2 웹프로젝트 1 (기획하기) : 지금까지 배운 지식을 활용하여 사이트 주제와 컨셉을 정하고, 미디어별 화면 설계 및 디자인 시안 제작. 웹프로젝트 2 (사이트에 올리기) : 디자인 시안을 분석하고 웹페이지 기본 구조를 코딩하며, 미디어별 화면을 구현하고 필요한 동적 요소를 구현. 4 11. 웹디자인 기능사 (국가기술자격) 주관 : 큐넷 (한국산업인력공단), 연 4회 실시. 의미 : 웹 에이전시는 '시간'이 생명. 포트폴리오는 작업 시간을 알 수 없으나, 기능사 시험은 시간제한이 있어서 전문 지식 + 정해진 시간 내 완수 능력 을 동시에 어필 가능. 전략 : 필기는 문제은행식으로 개별 취득. 실기(작업형) 는 학원 대비반을 통해 4시간 내 완성하는 훈련 필수. 운영 : 주말반으로 운영. 4 12. 웹 포트폴리오 (최종) 기간 : 최소 2개월 이상 소요. (개인차 있음, 채워야 하는 양에 따라 3~5개월) 구성 : 자기소개 페이지 + 2개 사이트 리뉴얼/구축 (기본). 내용 : 기획 → 설계(ux/ui) → 구현(코딩) → 포트폴리오 제작의 전체 실무 프로세스를 혼자 힘으로 완주. 결과 : 취업 시 내 명함이 되는 '나만의 웹사이트' 완성. 1:1 피드백으로 진행. 핵심 주의 : 학원 레시피(수업 예제)를 그대로 내면 \"이거 냉동식품 돌렸네요?\" 하고 탈락. 조리법(code)은 그대로 쓰되, 재료와 소스(주제/디자인)를 바꿔서 '나만의 시그니처 메뉴' 로 재창조해야 함. 5. 프로그램 · 언어 설명 5 1. 디자인 도구 툴 특징 : : 포토샵 (photoshop) 이미지 편집, 사진 보정/합성/자르기. 비트맵(픽셀) 방식. 일러스트레이터 로고/아이콘 제작. 벡터 방식 → 확대해도 선명함. 피그마 (figma) 웹사이트 설계도(프로토타입) 제작. 여러 명 동시 접속 작업 가능. 업계 표준. vs code 전 세계 개발자가 가장 많이 쓰는 코딩 프로그램. 자동 완성, 알림 기능. 메모장 코딩 원리 이해용 기초 텍스트 에디터. 비유: 메모장 = 연필, vs code = 아이패드. 5 2. 프로그래밍 언어 전체 정리 c 언어 계열 언어 특징 주요 용도 : : : c언어 모든 언어의 뿌리. 기계어와 가장 친한 언어. 엄격하고 깊은 내공 요구. 임베디드(세탁기, 에어컨, 밥솥 내부 칩 제어), 7 segment 실습 c++ (씨 쁠쁠) c언어의 정통 후계자. 객체 지향 무공 추가. 엄청 빠름. 고사양 3d 게임, 포토샵 같은 무거운 프로그램 c (씨 샵) 마이크로소프트의 언어. 현대적 편의성. java와 사촌지간. 윈도우 프로그램, 유니티(unity) 게임 개발 c 가문 비유: c언어 = 라틴어, c++ = 이탈리아어, c = 영어(글로벌 표준어) java vs javascript (햄과 햄스터) 두 언어는 '바다' 와 '바다코끼리' 만큼이나 기술적 접점이 없는 타인. 이름만 비슷하고 완전히 남남. 구분 java (마스터 햄) javascript (햄스터) : : : 기본 철학 \"법대로 합시다 (strict)\" \"좋은 게 좋은 거죠 (flexible)\" 타이핑 정적 타이핑 (static) 동적 타이핑 (dynamic) 오류 반응 틀리면 요리 시작도 안 함 (컴파일 에러) 일단 어떻게든 요리함 (느슨한 처리) 1 + \"1\" 결과 \"무엄하다! (에러)\" \"11 이지롱! (성공)\" 주요 용도 대기업/은행/공공기관 서버 (백엔드) 웹 브라우저에서 동작 (프론트엔드) 특징 객체지향(부품 조립식). 단단하고 복잡함. 인터프리터(즉시 실행). 유연하고 자유로움. java 취약점 이슈 : 만들어진 결과물을 뜯어보면(디컴파일), 어떤 재료와 비법을 썼는지 역추적하기 쉬워서 '해킹(분석)에 취약하다'는 꼬리표가 붙었음. \"레시피 도난 위험.\" javascript 이름의 비밀 : 원래 java랑 아무 상관 없는데, 당시 '자바'가 인기 있어서 이름만 슬쩍 비슷하게 지은 것. (햄 vs 햄스터) python (파이썬) 문법이 영어 문장처럼 쉬워서 초보자에게 인기 1위. ai(인공지능) , 데이터 분석, 백엔드 서버 개발에 주로 쓰임. 프론트/백 가리지 않고 사용 가능. (단, 웹 프론트엔드에서는 js가 표준) node.js 자바스크립트 실행 엔진. js가 서버에서도 동작할 수 있게 해주는 환경. v8 엔진이라는 슈퍼 가속기로 업무 속도를 폭발시킴. 비유: 햄스터(js)의 강력한 갑옷(강화 슈트). 5 3. 라이브러리 vs 프레임워크 구분 특징 주도권 예시 : : : : 라이브러리 반찬가게 & 공구함. 필요할 때만 골라 쓰는 부품. 개발자(나) jquery, lodash 프레임워크 프랜차이즈/오마카세. 시스템이 정한 규칙대로 일해야 함. 시스템 vue, angular 리액트(react) 웹을 레고 블록(component) 단위로 조립. 가상 dom(virtual dom) 사용. 혼합 5 4. 커리어 진화 로드맵 (퍼블리셔 → 프론트엔드) lvl 1. 정통 퍼블리셔 (ui master) └─ 디자인을 1px 오차 없이 구현하는 화면의 수호자. (우리 과정의 종착지) lvl 2. 스마트 퍼블리셔 (js specialist) └─ jquery 없이 순수 바닐라 js를 부리며 논리력을 장착한 상태. lvl 3. 프론트엔드 개발자 (architect) └─ react 같은 대규모 프레임워크 무공을 익혀 대규모 시스템을 관리하는 고수. \"퍼블리셔 출신은 개발자들보다 눈(디자인 안목) 과 기본기(html 구조) 가 뛰어나, 현업에서 가장 선호하는 최고의 인재가 될 수 있다!\" 6. 취업 및 진로 6 1. 취업 분야 가이드 분야 주요 업무 및 특징 추천 성향 : : : 1. 웹 에이전시 웹사이트 제작 전문 회사. 다양한 기업의 사이트를 수주받아 제작. 디자인/퍼블리싱/유지보수. 다양한 스타일을 경험하고 실력을 빨리 키우고 싶은 분. 2. 쇼핑몰 (자사몰) 카페24 등 템플릿 관리. 상품 페이지 제작, 배너 디자인, 사이트 관리. 패션/유통에 관심 있고 안정적인 업무를 선호하는 분. 3. 인하우스 (일반기업) 특정 기업 홍보팀/디자인팀. 자사 브랜드 사이트 관리 및 마케팅 디자인. 한 브랜드에 깊게 관여하고 싶고 워라밸을 중시하는 분. 4. ui/ux 디자인 앱(app) 서비스 기획 및 디자인. 편리한 사용성을 연구하고 화면 설계. 논리적인 사고를 즐기고, 모바일 앱 분야에 관심 있는 분. 5. 프리랜서/기타 크몽 등 재능 마켓 활동, 강사, 개발자 전직 등. 독립적인 성향, 자기 주도적인 분. 취업처 요약 : 웹 에이전시(전문 식당), 인하우스(기업 구내식당), 홈쇼핑, 언론사 등. 6 2. 인재상 및 성향 가장 중요한 것 → 인내심 : 코딩은 에러 하나 잡으려고 밤새는 일이 많음. 곰국 끓이듯이 진득하게 앉아서 원인을 찾을 수 있는 '엉덩이 무거운 사람' 이 최고. 추천 성향 : 꼼꼼한 사람, 규칙 지키는 걸 좋아하는 사람, 시각적 피드백(내가 만든 게 바로 보이는 것)을 즐기는 사람. 시장 변화 : 예전에는 혼자 다 했지만, 지금은 퍼블리셔(조리 전문)와 웹 디자이너(플레이팅 전문)로 나뉨. 하지만 사장님들은 여전히 풀스택(full stack) 을 좋아함 (요리도 하고, 서빙도 하고, 배달도 하는 만능 점원). 6 3. ai 시대의 취업 전략 ai 도입으로 단순 하드코딩은 ai가 대신하는 시대. 비전공생/신입들은 구조를 모르기 때문에 기반 지식을 쌓은 뒤 ai를 학습하면 유리. 우리는 ai가 갖추지 못한 인간의 역량(디자인 감각, 맥락 이해, 기획력) 을 키워야 함. 기초(web 1~4)를 알아야 ai도 부려먹을 수 있음. 6 4. 포트폴리오 전략 자기소개 페이지 + 사이트 2개 기본 (기획 → 설계 → 코딩 → 완성). 재탕 금지 : 수업 예제를 그대로 내면 탈락. 주제/디자인을 바꿔서 나만의 시그니처 메뉴로 재창조. 깃허브 주소 함께 제출 : '실무 준비 됐네' 점수 추가. 웹디자인 기능사 병행 : 실력 + 시간 내 완수 능력을 동시에 어필. 집에서 연습 필수 : 코딩은 언어 배우는 것과 같음. 반복 학습이 핵심. 7. 상담 포인트 7 1. 자주 묻는 질문 (q&a) → 방어용 답변 q. 코딩 너무 어려워요. 꼭 해야 하나요? a. 샘플 페이지 만들기까지는 해야 함. 개발자만큼 할 필요는 없지만 구조는 알아야 함. q. 집에서 공부해야 하나요? a. 네, 연습 필수. 코딩은 언어 배우는 것과 같음. q. 쇼핑몰 만들면 돈 되나요? a. 네, 됩니다. 단, 프론트/백엔드 지식 없이 접근하면 유지보수가 어려움. q. 비전공자인데 ai로만 하면 안 되나요? a. 글자수나 이름 등 디테일 수정 시 코딩 없이는 어려움. ai는 구체적으로 요청하지 않으면 엉뚱한 걸 만듦. 기본 흐름: 만들어보고 → 웹1, 2 배우고 → 고생했고 → 취업. q. 피그마만 배우고 싶어요. a. 상담 필요 (단독 수강 반려 가능성. 학과장님 또는 팀장님께 문의). q. 저 앱 만들고 싶은데 웹 과정 들어도 돼요? a. 웹 디자인 배우면 '하이브리드 앱'의 알맹이를 만들 수 있어서 쇼핑몰 취업에 유리함. 쇼핑몰 앱 90%가 하이브리드 앱 방식. q. 윅스(wix)나 아임웹으로 코딩 없이 만들면 되는 거 아닌가요? a. 노코드는 밀키트/3분 요리. 커스텀 한계가 있고 디자인이 양산됨. 기업은 직접 레시피를 개발할 수 있는 셰프(퍼블리셔)를 원함. q. c언어는 안 배우나요? a. c언어는 기계 제어(임베디드) 언어. 웹 디자인과는 분야가 다름. 7 2. 상담 멘트 (closing) \"이 과정은 단순한 툴 교육이 아닙니다. '기획(ux) → 디자인(ui) → 구현(coding)' 으로 이어지는 웹사이트 제작의 a to z 를 배우는 실무 과정입니다. 특히 요즘 기업들은 디자인 감각이 있는 퍼블리셔를 선호하기 때문에, 비전공자라도 포트폴리오만 잘 준비하면 에이전시나 인하우스 등 다양한 곳으로 취업할 수 있습니다.\" 7 3. 비유 치트키 모음 상황 비유 : : html 건물의 철근 뼈대 css 인테리어 마감재 (벽지/가구) javascript 전기 배선 & 스위치 jquery 밀키트 (간편 조리 세트) java 마스터 햄 (깐깐한 독일 장인) javascript 햄스터 (유연한 예술가) ux 설계자 & 건축가 ui 인테리어 디자이너 서버 주방 / 땅 db 대형 냉장고 api 식당의 웨이터 반응형 웹 물 같은 웹사이트 (컵에 담으면 컵 모양) 라이브러리 반찬가게 / 공구함 (내가 주도권 가짐) 프레임워크 프랜차이즈 / 오마카세 (시스템이 주도권 가짐) git 게임 세이브 파일 github 개발자들의 인스타그램 바이브 코딩 칼질 몰라도 ai 로봇한테 말로 시켜서 요리하는 시대 8. 수강료 · 패키지 안내 단위: 만원 (과목당 단가) · 실제 등록 시 팀장님께 견적 확인 필수 🌐 웹 / ux·ui 전 과목 45~50 · 주말은 웹디자인기능사만 운영 📅 평일 ├─ 🎨 ux·ui 디자인 (50) │ uxui1 웹기획, 웹디자인 기초 (피그마는 후반에 살짝) │ uxui2 피그마 심화, 반응형 웹·앱 디자인 프로토타입 ├─ 💻 웹 퍼블리싱 (50) │ 웹1 html, css 웹표준 │ 웹2 심화 html css 고급 레이아웃 │ 웹3 반응형 웹 이해 │ 웹4 자바스크립트, 제이쿼리 ├─ 🎞️ 웹모션 svg 애니메이션 45 └─ 📁 포폴 웹포폴 (50) / uxui포폴 (50) 📅 주말 └─ 🏅 웹디자인기능사 50 🌙 방과후 특강 (방특) ├─ 포토샵 30 / 포토웍스 32 └─ 일러스트 30 / 디일러 32 관련 자격증 gtq (그래픽기술자격, 포토샵) gtqi (일러스트) gtqid (인디자인) acp (어도비 공인 자격증) 그래픽기능사 컬러리스트 웹디자인기능사 (국가기술자격, 큐넷, 연 4회) 신설 과정: ai 네이버 코드 (스마트스토어 / 노코드) 기간 : 6개월 과정 (클라우드 코드, 노코드). 대상 : 코딩을 아예 모르는 비전공자, 쇼핑몰 창업 희망자. 장점 : 개발 몰라도 쇼핑몰/랜딩 페이지 구축 가능. 자기소개 + 2개 사이트 기본. 단점 : 디테일한 수정(글자 폰트, 미세 레이아웃 등)이 어려움. 결국 웹1, 2(html/css)를 배워야 커스텀 가능. 현재 과정 개편 예고됨. 변경 가능. 출처 : 문의준 팀장님 필기 노트, 서우정 학과장님 강의, 김○○ 강사님 교육, 멘토 강의 통합 정리 최종 정리일 : 2026 02 28 키워드 : 웹학과 웹디자인 웹퍼블리싱 uxui html css javascript jquery figma 취업 커리큘럼 상담가이드"},"99_시스템/03_학과지식/컨닝노트_간호사사회복지사_MOS어필_260324.md":{"t":"컨닝노트 간호사사회복지사 MOS어필 260324","s":"","g":[],"d":"2026-08-08","f":"학과 지식","l":[],"h":"<h5>🩺 간호사 취업 시 컴퓨터 자격증 현황</h5>\n<p>간호사는 병원 행정 업무와 데이터 관리가 중요해지면서 컴퓨터 자격증이 취업 가산점으로 작용하는 경우가 많습니다.</p>\n<p>실제 병원 합격 후기에서 확인되는 보유 자격증: BLS, 컴활 2급, ACLS</p>\n<p>컴퓨터 자격증 중 가장 많이 언급되는 것은 컴퓨터활용능력(컴활) 1급·2급입니다.</p>\n<p>MOS는 국제 자격증으로 외국계 병원·국제 진료센터 취업 시 오피스 실무 역량을 바로 인정받는 자격증입니다.</p>\n<h4>간호사 취업 시 자격증 우선순위 (참고용)</h4>\n<p>1순위: 간호사 면허증 (국가시험)</p>\n<p>2순위: BLS (심폐소생술 기본 과정) → 신규 간호사 사실상 필수</p>\n<p>3순위: 컴활 2급 or MOS → 행정·데이터 역량 증명</p>\n<p>4순위: ACLS (응급실·중환자실 지원 시 필요)</p>\n<h4>어필 포인트 (간호사 목표 수강생에게)</h4>\n<p>병동에서 환자 기록지(Word), 통계표(Excel), 발표 자료(PPT)를 직접 만들어야 하는 상황이 실제로 발생합니다.</p>\n<p>MOS는 Word·Excel·PowerPoint 3가지를 모두 실기로 검증하는 자격증이라 이 3가지를 한 번에 증명할 수 있습니다.</p>\n<p>컴활은 필기+실기 구조라 준비 기간이 더 필요하지만, MOS는 실기 중심 4주 단기 과정으로 빠르게 취득 가능합니다.</p>\n<p>ITQ는 일반 병원 취업 시장에서는 거의 인정받지 못합니다.</p>\n<h5>👩‍⚕️ 사회복지사 취업 시 컴퓨터 자격증 현황</h5>\n<p>사회복지사 실무에서는 문서 작성(한글·Word), 데이터 관리(Excel), 보고서 작성(PPT)이 일상 업무입니다.</p>\n<p>취업 공고에서 컴퓨터 활용 능력을 우대 또는 필수로 요구하는 경우가 많습니다.</p>\n<h4>사회복지사 취업 시 자격증 우선순위 (참고용)</h4>\n<p>1순위: 사회복지사 2급 or 1급 자격증</p>\n<p>2순위: 운전면허 1종 (대상자 방문 업무 등으로 사실상 필수)</p>\n<p>3순위: 컴퓨터 활용 자격증 (컴활 or MOS)</p>\n<p>4순위: 사회복지사 1급 (2급으로 취업 가능하나 승진·우대에 유리)</p>\n<h4>어필 포인트 (사회복지사 목표 수강생에게)</h4>\n<p>사회복지 현장에서 한글·엑셀·파워포인트 사용이 일상입니다.</p>\n<p>&quot;컴퓨터 가능합니다&quot;는 더 이상 신뢰되지 않습니다. 자격증으로 객관적으로 증명해야 합니다.</p>\n<p>MOS는 Word(문서)·Excel(데이터)·PPT(발표) 3종을 한 번에 커버하는 실기 자격증입니다.</p>\n<p>사회복지 기관 취업 공고에서 ITQ가 언급되는 경우도 있으나 MOS가 국제 공인 자격증으로 더 높은 신뢰도를 가집니다.</p>\n<h5>⚡ 이분 상담 시 핵심 멘트 3가지</h5>\n<p>멘트 1. &quot;MOS가 어려웠던 이유&quot;에 대한 답변</p>\n<p>→ &quot;15주짜리 긴 과정은 진도가 느리고 시험에 맞춰 집중이 안 돼요. 저희는 딱 합격만 목표로 1달 집중하는 구조라 체감이 많이 달라요.&quot;</p>\n<p>멘트 2. ITQ → MOS 전환 설득</p>\n<p>→ &quot;간호나 사회복지 쪽에서 ITQ가 쓰이는 경우가 거의 없어요. MOS가 국제 자격증이라 병원이나 복지관에서 바로 인정해줘요.&quot;</p>\n<p>멘트 3. 금액·일정 부담 완화</p>\n<p>→ &quot;4월 이후 평일 오전반으로 부담 없이 시작하실 수 있고, 수업 녹화본 무제한 제공돼서 빠진 수업도 걱정 없어요.&quot;</p>\n<h5>🔦 놓치기 쉬운 점 / 알아두면 좋은 점</h5>\n<p>주거급여 수급자는 금액 민감도가 높을 수 있습니다. 재컨택 전 분납·할부 가능 여부를 팀장님께 먼저 확인해 두세요.</p>\n<p>문정연님은 자기 할 말 위주로 대화하는 성향입니다. 끊지 말고 다 들은 뒤 핵심 한 문장만 짧게 답하는 전략이 효과적입니다.</p>\n<p>4월 19일 이후 재컨택 타이밍: &quot;4월 이후 평일 오전반 일정 확인됐다&quot;는 구체적 정보를 먼저 주면 연결이 쉬워집니다.</p>\n<p>내배카(내일배움카드) 미해당 → 재컨택 시 &quot;더 빠르게 집중 취득하는 일반과정이라 내배카 대신 일반 결제로 진행해요&quot;로 자연스럽게 안내하세요.</p>","x":"🩺 간호사 취업 시 컴퓨터 자격증 현황 간호사는 병원 행정 업무와 데이터 관리가 중요해지면서 컴퓨터 자격증이 취업 가산점으로 작용하는 경우가 많습니다. 실제 병원 합격 후기에서 확인되는 보유 자격증: bls, 컴활 2급, acls 컴퓨터 자격증 중 가장 많이 언급되는 것은 컴퓨터활용능력(컴활) 1급·2급입니다. mos는 국제 자격증으로 외국계 병원·국제 진료센터 취업 시 오피스 실무 역량을 바로 인정받는 자격증입니다. 간호사 취업 시 자격증 우선순위 (참고용) 1순위: 간호사 면허증 (국가시험) 2순위: bls (심폐소생술 기본 과정) → 신규 간호사 사실상 필수 3순위: 컴활 2급 or mos → 행정·데이터 역량 증명 4순위: acls (응급실·중환자실 지원 시 필요) 어필 포인트 (간호사 목표 수강생에게) 병동에서 환자 기록지(word), 통계표(excel), 발표 자료(ppt)를 직접 만들어야 하는 상황이 실제로 발생합니다. mos는 word·excel·powerpoint 3가지를 모두 실기로 검증하는 자격증이라 이 3가지를 한 번에 증명할 수 있습니다. 컴활은 필기+실기 구조라 준비 기간이 더 필요하지만, mos는 실기 중심 4주 단기 과정으로 빠르게 취득 가능합니다. itq는 일반 병원 취업 시장에서는 거의 인정받지 못합니다. 👩‍⚕️ 사회복지사 취업 시 컴퓨터 자격증 현황 사회복지사 실무에서는 문서 작성(한글·word), 데이터 관리(excel), 보고서 작성(ppt)이 일상 업무입니다. 취업 공고에서 컴퓨터 활용 능력을 우대 또는 필수로 요구하는 경우가 많습니다. 사회복지사 취업 시 자격증 우선순위 (참고용) 1순위: 사회복지사 2급 or 1급 자격증 2순위: 운전면허 1종 (대상자 방문 업무 등으로 사실상 필수) 3순위: 컴퓨터 활용 자격증 (컴활 or mos) 4순위: 사회복지사 1급 (2급으로 취업 가능하나 승진·우대에 유리) 어필 포인트 (사회복지사 목표 수강생에게) 사회복지 현장에서 한글·엑셀·파워포인트 사용이 일상입니다. \"컴퓨터 가능합니다\"는 더 이상 신뢰되지 않습니다. 자격증으로 객관적으로 증명해야 합니다. mos는 word(문서)·excel(데이터)·ppt(발표) 3종을 한 번에 커버하는 실기 자격증입니다. 사회복지 기관 취업 공고에서 itq가 언급되는 경우도 있으나 mos가 국제 공인 자격증으로 더 높은 신뢰도를 가집니다. ⚡ 이분 상담 시 핵심 멘트 3가지 멘트 1. \"mos가 어려웠던 이유\"에 대한 답변 → \"15주짜리 긴 과정은 진도가 느리고 시험에 맞춰 집중이 안 돼요. 저희는 딱 합격만 목표로 1달 집중하는 구조라 체감이 많이 달라요.\" 멘트 2. itq → mos 전환 설득 → \"간호나 사회복지 쪽에서 itq가 쓰이는 경우가 거의 없어요. mos가 국제 자격증이라 병원이나 복지관에서 바로 인정해줘요.\" 멘트 3. 금액·일정 부담 완화 → \"4월 이후 평일 오전반으로 부담 없이 시작하실 수 있고, 수업 녹화본 무제한 제공돼서 빠진 수업도 걱정 없어요.\" 🔦 놓치기 쉬운 점 / 알아두면 좋은 점 주거급여 수급자는 금액 민감도가 높을 수 있습니다. 재컨택 전 분납·할부 가능 여부를 팀장님께 먼저 확인해 두세요. 문정연님은 자기 할 말 위주로 대화하는 성향입니다. 끊지 말고 다 들은 뒤 핵심 한 문장만 짧게 답하는 전략이 효과적입니다. 4월 19일 이후 재컨택 타이밍: \"4월 이후 평일 오전반 일정 확인됐다\"는 구체적 정보를 먼저 주면 연결이 쉬워집니다. 내배카(내일배움카드) 미해당 → 재컨택 시 \"더 빠르게 집중 취득하는 일반과정이라 내배카 대신 일반 결제로 진행해
