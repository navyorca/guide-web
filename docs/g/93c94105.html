/* 레이아웃: 위 명단·설정 → 아래 게임 화면(계기판·하늘·빙판 레인·기지) → 결과. 게임 화면은 남극탐험풍 고정 색, 바깥은 테마 토큰 */
:root{
  --bg:#FFFFFF; --ink:#0B1240; --dim:#5A6488; --navy:#00007F; --blue:#1F4FD8; --line:#D6E4F5;
  --pick:#FFE58A; --pickInk:#3A2A00;
  --f:"Galmuri9","Pretendard Variable","Malgun Gothic",monospace;
  --dot:"Galmuri11B","Galmuri9","Pretendard Variable",monospace;   /* 261001 폰트 통일: 갈무리 한 계열 */
  /* 게임 화면 전용(두 테마 공통) */
  --hud:#00007F; --hudInk:#FFFFFF; --hudVal:#FFE58A; --sky:#7FB2FF; --ice:#F4FAFF; --iceLine:#CFE0F5; --hole:#0A1A5C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070B22; --ink:#E8EEFF; --dim:#97A3CC; --navy:#9DB4FF; --blue:#7FA2FF; --line:#24305C;
  --pick:#5C4A10; --pickInk:#FFE9A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B22; --ink:#E8EEFF; --dim:#97A3CC; --navy:#9DB4FF; --blue:#7FA2FF; --line:#24305C;
  --pick:#5C4A10; --pickInk:#FFE9A6; color-scheme:dark}
*{box-sizing:border-box}
body::after{opacity:.5!important}   /* 배포 워터마크(guide-web 공통) 이 화면만 절반으로 261001 */
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18px;margin:0;font-synthesis:none;-webkit-font-smoothing:none}
svg{shape-rendering:crispEdges}
.pb{fill:var(--pc)}
.fb{visibility:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:20px}
header{display:flex;align-items:flex-end;gap:14px}
#logo svg{height:58px;width:auto;display:block}
h1{font-family:var(--dot);font-weight:400;font-size:22px;margin:0;color:var(--navy);text-wrap:balance}
header p{margin:4px 0 0;color:var(--dim);font-size:18px}
label{display:block;font-size:18px;font-weight:700;color:var(--dim);margin-bottom:6px}
.people{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--navy);padding:4px 4px 4px 10px;font-size:18px;font-weight:700;color:var(--navy)}
.chip button{border:0;background:none;color:var(--dim);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
.chip button:hover{color:var(--navy)}
.empty{color:var(--dim);font-size:18px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:0;padding:9px 10px}
#who{flex:1;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font:inherit;cursor:pointer}
.ghost{background:var(--bg);border:1.5px solid var(--navy);color:var(--navy);border-radius:0;padding:9px 16px;font-size:18px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.ghost:active{transform:translate(3px,3px);box-shadow:none}
.hint{font-size:18px;color:var(--dim)}
.bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
#go{background:var(--navy);color:var(--bg);border:0;border-radius:0;padding:11px 30px;font-family:var(--dot);font-size:22px;box-shadow:4px 4px 0 var(--blue);margin-left:auto}
#go:active{transform:translate(4px,4px);box-shadow:none}
#go:disabled{opacity:.45;cursor:not-allowed}

.game{border:3px solid var(--hud);background:var(--ice);position:relative;overflow:hidden}
.hud{background:var(--hud);color:var(--hudInk);font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:8px 12px;border-bottom:3px solid #FFE58A}
.hb{display:flex;flex-direction:column;line-height:1.15}
.hb small{font-size:18px;color:#9CC3FF}
.hb b{font-family:var(--dot);font-size:22px;color:var(--hudVal);font-weight:400;font-variant-numeric:tabular-nums}
.roul{margin-left:auto;display:flex;align-items:center;gap:8px;color:#FFFFFF}
.slot{width:46px;height:46px;border:3px solid #FFE58A;background:#0A1A5C;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #00007F}
.slot svg{width:28px;height:auto;display:block}
.slot.spin{border-color:#FFFFFF}
.prog{position:relative;height:32px;background:#DCEBFF;border-bottom:3px solid #00007F}
.prog .pline{position:absolute;left:14px;right:34px;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#00007F 0 8px,transparent 8px 14px)}
.prog .pend{position:absolute;right:8px;top:3px;height:26px;width:auto}
.prog .pm{position:absolute;top:4px;height:24px;width:auto;transform:translateX(-50%)}
.prog .pm.ko{filter:grayscale(1) opacity(.6)}
.hurry{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4500;font-family:var(--dot);font-size:22px;color:#FFFFFF;background:#E5484D;border:3px solid #FFFFFF;box-shadow:4px 4px 0 #00007F;padding:8px 22px;animation:blink .2s steps(1) infinite}
.hurry[hidden]{display:none}
@keyframes blink{50%{opacity:.25}}
.sky{position:relative;height:64px;background:var(--sky)}
.sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:40px;shape-rendering:crispEdges}
.sky .base{position:absolute;right:4px;bottom:0;width:44px;height:auto;shape-rendering:crispEdges;left:auto}
.feed{background:#0A1A5C;color:#FFFFFF;font-size:18px;padding:6px 12px;min-height:2.2em;display:grid;gap:2px}
.feed p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed p:first-child{color:#FFE58A}
.arena{display:flex;align-items:stretch;padding:8px;gap:8px;background-color:#A0522D;
  background-image:linear-gradient(#6B3416 2px,transparent 2px),linear-gradient(90deg,#6B3416 2px,transparent 2px);background-size:24px 12px}
.field{position:relative;flex:1;min-width:0;background:var(--ice);overflow:hidden;
  background-image:linear-gradient(#3F6CD8 0 14px,transparent 14px calc(100% - 14px),#3F6CD8 calc(100% - 14px)),
  repeating-linear-gradient(90deg,transparent 0 46px,#E3EEFB 46px 48px)}
.flee{position:absolute;left:0;top:0;z-index:2500}
.flee svg{display:block;height:auto;animation:bob .2s steps(2) infinite}
.runner.ko .bd{filter:grayscale(1) brightness(.8)}
.bump{position:absolute;left:0;top:0;z-index:5}
.bump svg{display:block;height:auto}
.field.pin{background-color:#EDE8FF}
.field.tet{background-color:#0B0F24;background-image:linear-gradient(rgba(156,195,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(156,195,255,.12) 1px,transparent 1px);background-size:20px 20px}
.field.tet .hole,.field.tet .box,.field.tet .ban{opacity:.15}
.tp{position:absolute;left:0;top:0;z-index:3200;pointer-events:none}
.tp svg{display:block;height:auto}
.tp.clear{animation:blink .1s steps(1) infinite}
.runner.sq .sp{animation:none;transform:scale(1.35,.35)}
.field.flood{background-color:#5B8CFF;background-image:repeating-linear-gradient(0deg,transparent 0 10px,#9CC3FF 10px 12px)}
.field.flood .hole,.field.flood .box,.field.flood .ban{opacity:0}
.runner.swim .sp{clip-path:inset(0 0 42% 0);transform:translateY(42%)}
.runner.rocket .bd{filter:drop-shadow(-10px 6px 0 #FF9F1C) drop-shadow(-10px 0 0 #E5484D)}
.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:3000}
.fx svg{display:block;animation:fxpop .48s steps(4) forwards}
@keyframes fxpop{0%{transform:scale(.6)}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.rift,.floes{position:absolute;top:14px;bottom:14px;left:0;z-index:4;pointer-events:none;background:#0A1A5C;
  background-image:repeating-linear-gradient(180deg,transparent 0 10px,rgba(156,195,255,.35) 10px 12px)}
.rift{animation:riftin .4s steps(4) both}
@keyframes riftin{from{transform:scaleX(.1)}to{transform:scaleX(1)}}
.floes{background-color:#1F3F9A}
.floes i{position:absolute;left:12%;width:76%;height:16px;background:#FFFFFF;box-shadow:inset 0 -4px 0 #9CC3FF;animation:bob .6s steps(2) infinite}
.floes i:nth-child(even){animation-delay:.3s;left:20%;width:60%}
.arena{transition:transform .3s steps(3)}
.arena.tiltL{transform:rotate(-1.6deg)}.arena.tiltR{transform:rotate(1.6deg)}
.flyflag{position:absolute;left:0;top:0;z-index:6000;pointer-events:none;display:flex;align-items:flex-end;transition:transform .75s steps(12)}
.flyflag svg{height:44px;width:auto}
.flyflag b{font-family:var(--dot);font-size:22px;color:#FFFFFF;background:#E5484D;border:2px solid #FFFFFF;padding:0 6px;margin-left:2px}

function cast(list){

  return list.map(n=>CH.includes(n)?{k:n,c:n==='아델리펭귄'?COLORS[0]:''}:(pool.shift()||{k:'아델리펭귄',c:cols[ci++%cols.length]}));
}

// ===== 배틀 레이스 =====
// 좌표: x 0~1(출발→결승), y 0~1(빙판 위→아래). y가 0 밑이나 1 위로 밀리면 장외(바다)
const S=51,EDGE=14;   // 261001 캐릭터 10% 확대(46→51)            // 캐릭터 높이(px), 위아래 바다 폭
const UNIT=S/38;               // 펭귄 도트 한 칸 크기. 함정·아이템·표시도 같은 칸 크기로 그린다
const ITEMS=['banana','fish','mush','star'],ITN={banana:'바나나',fish:'물고기',mush:'버섯',star:'별'};
let PIN_P=.37,pinAt=Infinity,pinning=false,pinEnd=0;  // 핀볼 37%
let GIANT_P=.40,giantAt=Infinity;   // 거대 펭귄 40%
let TCOL=[];
let TET_P=.36,tetAt=Infinity,tetris=false,tetEnd=0,tetNext=0,TP=[];   // 테트리스 36%
let ROCKET_P=.40,SWIM_P=.38,FLEE_P=.45,swimAt=Infinity,swimEnd=0,fleeAt=Infinity,fleeing=false; // 로켓 40%, 얼음 깨짐 38%, 깃발 도망 45% (261002 +5%p → +10%p → +20%p)

const fieldEl=()=>$('field');
const PX=x=>8+x*(FW-8-S-14);                    // 왼쪽 위치(px)
const FY=y=>EDGE+S+30+y*(FH-2*EDGE-S-40);    // 위쪽은 캐릭터 키와 말풍선 자리            // 발 위치(px)
const near=(a,b,kx=.7,ky=.5)=>Math.abs(PX(a.x)-PX(b.x))<S*kx&&Math.abs(FY(a.y)-FY(b.y))<S*ky;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?a:b)};
function feed(msg){FEED.unshift(msg);FEED.length=Math.min(FEED.length,3);$('feed').innerHTML=FEED.map(m=>`<p>${esc(m)}</p>`).join('')}
function mk(html,cls,w){const d=document.createElement('div');d.className=cls;d.innerHTML=html;if(w)d.firstChild.style.width=w+'px';fieldEl().appendChild(d);return d}

function putObj(o){o.el.style.transform=`translate(${PX(o.x)+S/2-o.w/2}px,${FY(o.y)-o.h}px)`;o.el.style.zIndex=Math.round(FY(o.y))}

function build(){
  const n=names.length,f=fieldEl();
  f.innerHTML='<div class="goal"></div><canvas class="pfx" id="pfx"></canvas>';
  FH=Math.max(320,Math.min(620,150+n*34));f.style.height=FH+'px';FW=f.clientWidth||600;
  // 결승선 깃발 1·2·3
  flagsLeft=[1,2,3];
  [1,2,3].forEach((k,i)=>{const p=document.createElement('div');p.className='pole';p.id='pole'+k;
    p.style.top=(EDGE+8+i*((FH-2*EDGE-40)/2))+'px';p.innerHTML=svg('flag'+k,'')+`<b>${k}</b>`;f.appendChild(p)});
  const order=shuffle(names.slice());const cs=cast(order);   // 경주 내부 순서도 명단 순서와 무관하게 섞는다OBJ=[];FEED=[];$('feed').innerHTML='<p>출발선에 모였습니다. 아이템 상자와 얼음 구멍을 조심하세요.</p>';
  const lanes=shuffle([...Array(n).keys()]);   // 출발 칸은 명단 순서와 무관하게 섞는다
  R=order.map((name,i)=>{
    const el=document.createElement('div');el.className='runner';el.style.height=S+'px';
    el.style.setProperty('--id',rnd(.6,1.1).toFixed(2)+'s');el.style.setProperty('--dl',(-rnd(0,1)).toFixed(2)+'s');
    el.innerHTML=`<div class="bd">${svg(cs[i].k,'sp',cs[i].c)}<span class="ic"></span></div><span class="flag"></span><span class="tag">${esc(name)}</span>`;
    f.appendChild(el);
    return{name,look:cs[i],el,bd:el.querySelector('.bd'),ic:el.querySelector('.ic'),outs:0,surge:0,fl:el.querySelector('.flag'),u:S/vbH(cs[i].k),
      x:rnd(0,.05),y:.08+.84*(n>1?lanes[i]/(n-1):.5),ty:0,ky:0,v:0,tv:0,next:0,steer:0,state:'walk',until:0,rot:0,z:0,done:0,item:'',useAt:0,star:0,boost:0,icon:'',fade:1};
  });
  R.forEach(r=>r.ty=r.y);
  // 얼음 구멍 5개, 아이템 상자 두 줄
  // 구멍 6개·상자 n×0.6개를 서로 60px·40px 이상 떨어뜨려 빙판 전체에 흩는다
  const spots=[];
  const spot=()=>{for(let i=0;i<60;i++){const x=rnd(.1,.9),y=rnd(.03,.97);if(spots.every(q=>Math.abs(q.x-x)*FW>60||Math.abs(q.y-y)*FH>40)){spots.push({x,y});return[x,y]}}return[rnd(.1,.9),rnd(.03,.97)]};
  for(let i=0;i<6;i++)addObj('hole',...spot());
  for(let i=0;i<Math.max(4,Math.ceil(n*.6));i++)addObj('box',...spot());
  // 남은 거리 막대: 출발~결승 사이에 캐릭터 얼굴 표시
  const pg=$('prog');pg.innerHTML='<span class="pline"></span>'+svg('flag1','pend');
  R.forEach(r=>{pg.insertAdjacentHTML('beforeend',svg(r.look.k,'pm',r.look.c));r.pm=pg.lastElementChild;r.pm.style.left='14px'});
  $('slot').innerHTML='';$('slotname').textContent='ITEM';
  const cv=$('pfx');cv.width=FW;cv.height=FH;PF=PFX(cv);
  R.forEach(place);ranks();
  $('result').hidden=true;$('left').textContent=n;$('rest').textContent='1000m';$('time').textContent='0.0';
}
// 연출 효과: 도트 한 칸 크기를 캐릭터와 맞춘 짧은 폭발·물보라·먼지·반짝임·꽃가루
// 도트 입자: 네모 조각이 사방으로 튀고 중력으로 떨어지며 사라진다
function PFX(cv){const c=cv.getContext('2d');let P=[];return{
  add(x,y,n,cols,sp,g,sz,life,up){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.35+Math.random()*.9);
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(up||0),g,c:cols[i%cols.length],s:sz,l:life*(.6+Math.random()*.7),t:0})}},
  step(dt){c.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>(p.t+=dt)<p.l);
    for(const p of P){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=Math.max(0,1-p.t/p.l)**.6;c.fillStyle=p.c;c.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}c.globalAlpha=1},
  clear(){P=[]}}}
let PF=null,shakeUntil=0,shakeAmp=0;
const shake=(ms,a)=>{shakeUntil=performance.now()+ms;shakeAmp=Math.max(a,performance.now()<shakeUntil?shakeAmp:0)};
const FXP={pow:[['#FFE58A','#FF9F1C','#FFFFFF','#E5484D'],16,260,0,4,.45,0],splash:[['#3F6CD8','#9CC3FF','#FFFFFF'],18,170,650,4,.75,180],
  dust:[['#B8C4D6','#FFFFFF','#DCEBFF'],9,70,-40,4,.55,0],spark:[['#FFFFFF','#FFE58A','#9CC3FF'],14,160,0,3,.5,0],
  confetti:[['#E5484D','#F7B500','#2BB673','#2F6BFF','#FF7AA2','#C77DFF','#FFFFFF'],34,240,420,4,1.3,220]};
function flash(r){r.el.classList.add('flash');setTimeout(()=>r.el.classList.remove('flash'),110)}
function fx(k,o,big){
  if(PF&&FXP[k]){const [cols,n,sp,g,sz,life,up]=FXP[k];PF.add(PX(o.x)+S/2,FY(o.y)-S*.45,n*(big?2:1),cols,sp*(big?1.3:1),g,sz,life,up)}
  const f=fieldEl(),[,,w,h]=SP[k].vb.split(' ').map(Number),m=big?2:1,W=w*UNIT*m,H=h*UNIT*m,d=document.createElement('div');
  d.className='fx';d.innerHTML=svg(k,'');d.firstChild.style.width=W+'px';
  d.style.transform=`translate(${PX(o.x)+S/2-W/2}px,${FY(o.y)-S*.45-H/2}px)`;f.appendChild(d);setTimeout(()=>d.remove(),480);
}
function addObj(type,x,y,extra){
  const k={hole:'hole',box:'box',ban:'banana',proj:'fish'}[type];
  const w=dotW(k),h=+SP[k].vb.split(' ')[3]*UNIT;
  const o=Object.assign({type,x,y,w,h,el:mk(svg(k,''),type,w),live:1,back:0},extra||{});
  OBJ.push(o);putObj(o);return o;
}
function delObj(o){o.live=0;o.el.remove()}
function place(r){
  r.el.style.transform=`translate(${PX(r.x)}px,${FY(r.y)-S-r.z}px)`;r.bd.style.transform=`rotate(${r.rot}deg) scale(${r.sc||1})`;r.el.style.zIndex=Math.round(FY(r.y))+(r.z>0?400:0);r.el.style.opacity=r.fade;
}
function setIcon(r,k){if(r.icon===k)return;r.icon=k;r.ic.style.display=k?'block':'none';if(k){r.ic.innerHTML=svg(k,'');r.ic.style.height=ROWS[k]*r.u+'px'}}
function setState(r,s,ms){r.rot%=360;if(s!=='down'&&s!=='elim')r.faint=0;r.el.classList.toggle('ko',(s==='down'||s==='elim')&&!!r.faint);r.dur=ms;r.state=s;r.until=G+ms;
  if(s==='hit'||s==='down')r.pose=r.nextPose||pick(['front','back','spin']);if(s==='elim')r.pose=pick(['front','back']);r.nextPose='';if(s==='jump')r.flip=Math.random()<.3;r.el.classList.toggle('swim',s==='swim');r.el.classList.toggle('walk',s==='walk'||s==='jump');
  setIcon(r,{slip:'q',hole:'x',hit:'x',climb:'dots',down:'x',eat:'dots'}[s]||'')}
const alive=r=>!r.done&&!r.elim;   // 완주도 탈락도 아닌 펭귄
let elimCount=0;
const free=r=>alive(r)&&(r.state==='walk'||r.state==='jump');
function stun(r,s,ms,why){if(!alive(r)||r.star>G||r.state==='down')return false;setState(r,s,ms);if(why)feed(why);return true}
function knock(t,dir,pow){t.ky+=dir*pow}

function throwFish(a,t,why){const o=addObj('proj',a.x+.02,a.y,{from:a,to:t});if(why)feed(why);return o}

function useItem(r){
  const it=r.item;r.item='';
  if(it==='banana'){addObj('ban',Math.max(0,r.x-.03),r.y);feed(`${jo(r.name,'이','가')} 바나나를 뒤에 던졌습니다`)}
  if(it==='mush'){r.boost=G+900;fx('dust',r);feed(`${r.name} 버섯 부스터!`)}
  if(it==='star'){r.star=G+2400;fx('spark',r,1);feed(`${r.name} 별 무적 상태!`)}
  if(it==='fish'){const ahead=R.filter(o=>alive(o)&&o!==r&&o.x>r.x).sort((a,b)=>a.x-b.x)[0];
    if(ahead)throwFish(r,ahead,`${jo(r.name,'이','가')} ${ahead.name}에게 물고기를 던졌습니다`);else r.item=it}
}

// ponytail: 모든 공격·회피는 순수 난수, 역전 보정 없음. 실제 순서 추첨이라 공정성이 우선
function tick(now){

        if(r.flyT>=1){r.el.style.visibility='hidden';const ex={x:r.x,y:r.flyDir<0?0:1};fx('spark',ex,1);fx('confetti',ex);koPop(r,ex)}}

    if(o.type==='hole'){for(const r of RS)if(free(r)&&r.z===0&&near(r,o,.45,.3)&&!r.passed?.has(o)){(r.passed||(r.passed=new Set())).add(o);

      if(Math.random()<.3){setState(r,'jump',380);fx('dust',r);feed(`${r.name} 바나나를 피했습니다`)}else{fx('dust',r,1);r.nextPose='back';stun(r,'hit',700,`${r.name} 바나나 밟고 뒤로 자빠졌습니다`);delObj(o)}break}}
    if(o.type==='proj'){const t=o.to;

        if(t.giant>G)feed(`${jo(t.name,'은','는')} 거대해서 물고기가 튕겨 나갔습니다`);
        else if(t.star>G)feed(`${t.name} 별 무적으로 막았습니다`);
        else if(Math.random()<.3){setState(t,'jump',380);fx('dust',t);feed(`${t.name} 점프로 피했습니다!`)}
        else{fx('pow',t);fx('splash',t);flash(t);shake(160,3);t.nextPose=pick(['back','spin']);stun(t,'hit',650,`${t.name} 물고기에 맞았습니다`)}}
      else if(o.x>1.05)delObj(o)}
    if(o.live)putObj(o);
  }
  OBJ=OBJ.filter(o=>o.live);
  // 태클·반격·별 충돌
  for(let i=0;i<RS.length;i++)for(let j=i+1;j<RS.length;j++){
    const a=RS[i],b=RS[j];if(!free(a)||!free(b))continue;const gi=a.giant>G||b.giant>G;if(!near(a,b,gi?1.3:.6,gi?.9:.45))continue;
    if((a.giant>G)!==(b.giant>G)){const t=a.giant>G?b:a,s=t===a?b:a;knock(t,Math.sign(t.y-s.y)||pick([-1,1]),1.2);fx('pow',t,1);flash(t);shake(160,4);t.nextPose='front';stun(t,'hit',700,`${s.name}의 거대한 발에 ${jo(t.name,'이','가')} 밟혔습니다!`);continue}
    if(a.star>G!==b.star>G){const t=a.star>G?b:a,s=t===a?b:a;knock(t,Math.sign(t.y-s.y)||1,1.6);fx('spark',t,1);fx('pow',t);t.nextPose='spin';stun(t,'hit',500,`${s.name} 별 몸통박치기! ${t.name} 튕겨 나갑니다`);continue}

  if(G>giantAt){giantAt=Infinity;const c=RS.filter(free);if(c.length){const g=pick(c);g.giant=G+3500;g.el.classList.add('giant');
    eventBanner('거대 펭귄!',`${g.name} 거대화`,'#2BB673');fx('pow',g,1);fx('spark',g,1);shake(400,6);slow(500);feed(`${jo(g.name,'이','가')} 거대 펭귄이 되었습니다! 근처 조심`)}}

function ceremony(){
  stopCeremony();const cv=$('cfx'),st=cv.parentElement;cv.width=st.clientWidth;cv.height=st.clientHeight;
  const E=PFX(cv),c=cv.getContext('2d'),t0c=performance.now();let rk=[],lastc=t0c,next=t0c+300;
  const COL=[['#FFE58A','#FF9F1C','#FFFFFF'],['#FF7AA2','#FFFFFF','#E5484D'],['#9CC3FF','#FFFFFF','#2F6BFF'],['#2BB673','#FFE58A','#FFFFFF'],['#C77DFF','#FFFFFF','#FF7AA2']];
  const loop=now=>{const dt=Math.min(.05,(now-lastc)/1000),el=now-t0c;lastc=now;
    if(now>next){next=now+(el<5000?260:900);rk.push({x:rnd(.08,.92)*cv.width,y:cv.height,vy:-rnd(cv.height*1.5,cv.height*2.1),c:pick(COL)})}
    if(Math.random()<(el<5000?.9:.35))E.add(rnd(0,cv.width),-6,1,pick(COL),25,240,4,2.4);
    E.step(dt);
    rk=rk.filter(r=>{r.vy+=cv.height*1.6*dt;r.y+=r.vy*dt;c.fillStyle='#FFFFFF';c.fillRect(Math.round(r.x),Math.round(r.y),3,7);
      E.add(r.x,r.y+7,1,['#FFE58A','#FF9F1C'],18,60,3,.35);
      if(r.vy>-30){E.add(r.x,r.y,44,r.c,cv.height*.75,cv.height*.45,4,1.2);return false}return true});
    cer=requestAnimationFrame(loop)};
  cer=requestAnimationFrame(loop);
}

// 출발 순간 초기화(카운트다운 뒤). 시험용 모의 경주도 이 함수로 시작한다
function launch(t){
t0=last=t;G=0;elimCount=0;hurryMul=1;hurried=false;nextFocus=2500;nextShift=3200;
    R.forEach(r=>{r.tv=r.v=rnd(.04,.14);r.steer=rnd(300,900);setState(r,'walk',0)});
    swimAt=Math.random()<SWIM_P?rnd(1500,3500):Infinity;swimEnd=0;fleeing=false;fleeAt=Math.random()<FLEE_P?rnd(2200,3600):Infinity;pinning=false;pinAt=Math.random()<PIN_P?rnd(1200,2400):Infinity;tetris=false;TP=[];TCOL=[];tetAt=Math.random()<TET_P?rnd(1800,3400):Infinity;giantAt=Math.random()<GIANT_P?rnd(2000,6000):Infinity;
    if(Math.random()<ROCKET_P){const rk=pick(R);rk.rocketWin=1;setState(rk,'rocket',1e9);rk.el.classList.add('rocket');
      R.forEach(o=>{if(o!==rk){setState(o,'down',1200);fx('dust',o,1)}});fx('pow',rk,1);shake(600,9);setTimeout(()=>slow(900),20);setTimeout(()=>feed(`${rk.name} 로켓 발사! 폭풍에 나머지가 모두 엎어졌습니다`)||eventBanner('로켓 발사!',`${rk.name} 혼자 날아갑니다`,'#E5484D'),50)}
    feed('출발! 1·2·3등 깃발을 먼저 뽑는 펭귄은 누구일까요');
}
function start(){
  if(racing||names.length<2)return;stopCeremony();build();racing=true;renderChips();
  const cd=$('cd');cd.hidden=false;let c=3;cd.textContent=c;const pop=()=>{cd.classList.remove('pop');void cd.offsetWidth;cd.classList.add('pop')};pop();
  const iv=setInterval(()=>{c--;if(c>0){cd.textContent=c;pop();return}
    clearInterval(iv);cd.textContent='출발!';pop();setTimeout(()=>cd.hidden=true,600);
    launch(performance.now());
    raf=requestAnimationFrame(tick)},700);
}

function finish(){
  // 탈락자는 완주자 뒤에 늦게 탈락한 순서대로 순위를 받는다
  const F=R.filter(r=>r.done).length;R.filter(r=>r.elim).sort((a,b)=>b.elim-a.elim).forEach((r,i)=>r.done=F+1+i);
  racing=false;renderChips();
  const n=R.length,k=+$('topn').value,back=$('mode').value==='back';
  const sorted=[...R].sort((a,b)=>a.done-b.done),win=r=>back?r.done>n-k:r.done<=k;
  $('rh').textContent='시상식 · 당첨: '+sorted.filter(win).map(r=>r.name).join(', ');
  $('rs').textContent=(back?'뒤에서 ':'앞에서 ')+k+'명 · 전체 '+n+'명 도착 순서';
  const top=sorted.slice(0,3);
  $('podium').innerHTML=[1,0,2].filter(i=>top[i]).map(i=>{const r=top[i];return `<div class="pd p${i+1}${win(r)?' win':''}"><div class="who">${svg('flag'+(i+1),'pf')}${svg(r.look.k,'pc',r.look.c)}<span class="pn">${esc(r.name)}</span></div><div class="blk"><b>${i+1}</b></div></div>`}).join('');
  const fans=sorted.slice(3).map(r=>svg(r.look.k,'',r.look.c));while(fans.length<12)fans.push(svg('아델리펭귄','',pick(COLORS)));
  $('crowd').innerHTML=fans.join('');
  $('rl').innerHTML=sorted.slice(3).map(r=>`<li class="${win(r)?'win':''}"><b>${r.done}등</b>${svg(r.look.k,'',r.look.c)}<span>${esc(r.name)}</span></li>`).join('');
  $('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'nearest'});if(PF){PF.clear();PF.step(0)}fieldEl().style.transform='';ceremony();
}

$('go').onclick=start;$('again').onclick=start;
$('copy').onclick=e=>{
  const txt=[...R].sort((a,b)=>a.done-b.done).map(r=>r.done+'. '+r.name).join('\n'),b=e.currentTarget;
  navigator.clipboard.writeText(txt).then(()=>b.textContent='복사했습니다').catch(()=>b.textContent='복사가 막혀 있습니다');
  setTimeout(()=>b.textContent='순서 복사',1500);
};
addEventListener('resize',()=>{FW=fieldEl().clientWidth||FW;R.forEach(place);OBJ.forEach(o=>o.type==='pond'?placePond(o):o.type==='rift'||o.type==='floe'?placeBand(o):putObj(o))});
$('logo').innerHTML=svg('아델리펭귄','',COLORS[0]);sky();renderChips();
build();
</script>
